e."],"ex":["Despite the rain, we went out. · In spite of being tired, he worked. · Despite the fact that it rained…"]},{"h":"however / nevertheless (adverbs)","p":["Link two sentences; usually start a new sentence with a comma after."],"ex":["It was expensive. However, we bought it."]},{"h":"whereas / while (contrast two facts)","p":["Show a direct contrast between two ideas."],"ex":["He likes tea, whereas she prefers coffee."]}],"tip":"Use ‘although’ before a clause and ‘despite / in spite of’ before a noun or -ing. ‘Despite it was raining’ is wrong → ‘Despite the rain’ or ‘Although it was raining’.","examples":["\\"Although he was rich, he wasn’t happy.\\"","\\"Despite the traffic, we arrived on time.\\"","\\"In spite of feeling ill, she came.\\"","\\"The plan was risky. Nevertheless, it worked.\\"","\\"I love cities, whereas my brother prefers the countryside.\\"","\\"Even though it costs more, it’s worth it.\\""],"mistakes":[{"x":"Despite it was cold, we swam.","v":"Although it was cold… / Despite the cold… (despite + noun, not a clause)"},{"x":"Although it was hard but he tried.","v":"Although it was hard, he tried. (no “but” with although)"}],"quiz":[{"q":"___ it was raining, we went out.","o":["Despite","Although","In spite","However"],"a":1,"e":"+ clause → Although.","d":"easy"},{"q":"___ the rain, we went out.","o":["Although","Even though","Despite","Whereas"],"a":2,"e":"+ noun → Despite.","d":"easy"},{"q":"He likes coffee, ___ she prefers tea.","o":["despite","whereas","although","in spite of"],"a":1,"e":"Contrast two facts → whereas.","d":"easy"},{"q":"It was expensive. ___, we bought it.","o":["Although","Despite","However","Whereas"],"a":2,"e":"Links two sentences → However.","d":"easy"},{"q":"In spite ___ the cost, they travelled.","o":["of","to","for","at"],"a":0,"e":"in spite of + noun.","d":"easy"},{"q":"___ being tired, she finished the race.","o":["Although","Despite","However","Whereas"],"a":1,"e":"+ -ing → Despite being tired.","d":"med"},{"q":"___ he studied hard, he didn't pass.","o":["Despite","In spite of","Even though","However"],"a":2,"e":"+ clause → Even though.","d":"med"},{"q":"Choose the linker + clause.","o":["Despite the noise","In spite of being late","Although it was late","Despite that"],"a":2,"e":"Although + clause.","d":"med"},{"q":"The food was cold. ___, it tasted fine.","o":["Although","Despite","Nevertheless","Whereas"],"a":2,"e":"Adverb linking sentences → Nevertheless.","d":"med"},{"q":"Despite ___ that it was late, they continued.","o":["the fact","fact","of the fact","a fact"],"a":0,"e":"despite the fact that + clause.","d":"med"},{"q":"Find the mistake: 'Despite it was cold, we swam.'","o":["Despite → Although","cold → the cold","swam → swim","no mistake"],"a":0,"e":"Despite + noun/-ing; before a clause use ‘Although’.","d":"hard"},{"q":"Complete: '___ his wealth, he was unhappy, ___ his brother, who had little, was content.'","o":["Although / despite","Despite / whereas","Whereas / although","However / despite"],"a":1,"e":"Despite + noun ‘his wealth’ + whereas (contrast).","d":"hard"},{"q":"Which is correct?","o":["In spite the danger, they climbed.","In spite of the danger, they climbed.","In spite of they were in danger, they climbed.","In spite that the danger, they climbed."],"a":1,"e":"in spite of + noun.","d":"hard"},{"q":"Complete: '___ being cheaper, the second option is better, ___ the first looks nicer.'","o":["Although / whereas","Despite / whereas","Despite / however","Whereas / although"],"a":1,"e":"Despite + -ing ‘being cheaper’ + whereas (contrast).","d":"hard"},{"q":"Choose the sentence that links two contrasting sentences.","o":["Although it was hard, however we tried.","It was hard. However, we tried.","Despite however it was hard.","However it was hard we tried."],"a":1,"e":"However links two separate sentences.","d":"hard"}]},{"id":"g15","title":"Articles & determiners: advanced","lead":"At B2, article choice depends on shades of meaning: specific vs. general, the use of ‘the’ with unique reference, and fixed patterns with quantifiers and abstract nouns.","leadTr":{"uz":"B2 da artikl tanlash ma'no nozikliklariga bog'liq: aniq va umumiy ma'no, yagona narsalar bilan 'the' hamda mavhum otlar bilan turg'un qoliplar.","ru":"На B2 выбор артикля зависит от оттенков: конкретное против общего, the с уникальными объектами, устойчивые модели с абстрактными существительными."},"situation":"","blocks":[{"h":"the for unique / specified reference","p":["Use the when context makes the noun specific, after superlatives, and with ‘the only/same/first’."],"ex":["The book you lent me was great. · He’s the best. · It’s the only way."]},{"h":"zero article for general meaning","p":["Use no article for plural and uncountable nouns talking in general."],"ex":["Happiness matters. · Children learn fast. · I study history."]},{"h":"the + adjective (groups)","p":["the + adjective can mean a whole group of people."],"ex":["The rich get richer. · The government helps the unemployed."]},{"h":"determiners & ‘of’","p":["Use of with the/my/these: ‘most of the students’, ‘none of my friends’; without ‘of’ for general: ‘most students’."],"ex":["Most of the water was gone. · Most water is recycled here."]}],"tip":"Use ‘the’ when the noun is made specific by context (‘the book you lent me’), but no article for general statements with plurals/uncountables (‘books are useful’).","examples":["\\"The information you gave me was helpful.\\"","\\"Knowledge is power.\\"","\\"She wants to help the poor.\\"","\\"Most of the guests had left.\\"","\\"He’s the first to arrive.\\"","\\"I don’t drink coffee.\\""],"mistakes":[{"x":"I’m interested in the nature.","v":"…in nature. (general uncountable → no article)"},{"x":"He gave me an useful advice.","v":"He gave me useful advice. (advice is uncountable)"}],"quiz":[{"q":"___ book you recommended was excellent.","o":["A","An","The","—"],"a":2,"e":"Specified by context → The book you recommended.","d":"easy"},{"q":"___ is important for everyone. (general)","o":["The health","A health","Health","An health"],"a":2,"e":"General uncountable → no article.","d":"easy"},{"q":"The government should help ___.","o":["a poor","the poor","poor","poors"],"a":1,"e":"the + adjective = the group: the poor.","d":"easy"},{"q":"___ of the students passed.","o":["Most","Most of","The most","Much"],"a":1,"e":"+ the → Most of the students.","d":"easy"},{"q":"She's ___ only person who knows.","o":["a","an","the","—"],"a":2,"e":"‘only’ → the only person.","d":"easy"},{"q":"I love ___ in general. (plural, general)","o":["the dogs","dogs","a dogs","an dog"],"a":1,"e":"General plural → no article: dogs.","d":"med"},{"q":"___ water in this bottle is dirty.","o":["A","An","The","—"],"a":2,"e":"Specified ‘in this bottle’ → The water.","d":"med"},{"q":"___ students learn at different speeds. (general)","o":["The","A","Most","—"],"a":3,"e":"General plural → no article.","d":"med"},{"q":"He was ___ first to finish.","o":["a","an","the","—"],"a":2,"e":"Ordinal → the first.","d":"med"},{"q":"Choose the general statement.","o":["The life is hard.","Life is hard.","A life is hard.","An life is hard."],"a":1,"e":"Abstract general → Life is hard.","d":"med"},{"q":"Find the mistake: 'I'm interested in the nature.'","o":["the nature → nature","interested → interesting","in → on","no mistake"],"a":0,"e":"General uncountable → nature (no article).","d":"hard"},{"q":"Complete: '___ rich should pay more tax, and ___ advice you gave was wise.'","o":["A / the","The / the","The / a","Rich / the"],"a":1,"e":"the rich (group) + the advice (specified).","d":"hard"},{"q":"Which is correct?","o":["Most of people work hard.","Most people work hard.","The most people work hard.","Most of the people hard work."],"a":1,"e":"General → Most people (no ‘of’ without the).","d":"hard"},{"q":"Complete: 'She studies ___ history of ___ art.'","o":["the / —","— / the","the / the","a / an"],"a":0,"e":"‘the history of art’: specified ‘the history’, general ‘art’.","d":"hard"},{"q":"Choose the correct sentence.","o":["He gave me an useful advice.","He gave me a useful advice.","He gave me useful advice.","He gave me the useful advices."],"a":2,"e":"‘advice’ is uncountable → no article, no plural.","d":"hard"}]},{"id":"p1","title":"Subject–verb agreement in long sentences","lead":"When the subject and the verb are separated by long phrases, it becomes easy to match the verb to the wrong noun. Train yourself to find the true subject first — then choose the verb form.","leadTr":{"uz":"Ega va kesim orasida uzun iboralar bo'lsa, fe'lni noto'g'ri otga moslashtirish oson. Avval haqiqiy egani toping — keyin fe'l shaklini tanlang.","ru":"Когда подлежащее и сказуемое разделены длинными оборотами, легко согласовать глагол не с тем словом. Сначала найдите настоящее подлежащее — затем выбирайте форму глагола."},"situation":"","blocks":[],"tip":"","examples":[],"mistakes":[],"quiz":[{"q":"Text: 'The collection of handwritten letters from the early twentieth century [___] recently been donated to the university library.'\\n\\nWhich choice correctly completes the text?","o":["are","having","have","has"],"a":3,"e":"Cross out 'of handwritten letters from the early twentieth century.' Subject = 'collection' (singular) → has.","d":"medium"},{"q":"Text: 'The committee on environmental standards [___] voted to adopt stricter regulations on industrial emissions.'\\n\\nWhich choice correctly completes the text?","o":["are","were","has","have"],"a":2,"e":"'Committee' is a collective noun — singular in American English. It acts as a unit → has.","d":"medium"},{"q":"Text: 'A number of studies examining the long-term effects of sleep deprivation on cognitive function [___] produced alarming results.'\\n\\nWhich choice correctly completes the text?","o":["is","has","have","was"],"a":2,"e":"'A number of X' = PLURAL → have. (Contrast: 'The number of studies HAS grown' — 'the number' = singular.)","d":"medium"},{"q":"Text: 'The team of researchers, along with several graduate students, [___] presented findings at last month's conference.'\\n\\nWhich choice correctly completes the text?","o":["has","were","are","have"],"a":0,"e":"'Along with several graduate students' is an intervening phrase — cross it out. Subject = 'The team' (singular collective noun) → has.","d":"medium"},{"q":"Text: 'The number of species affected by climate change [___] grown dramatically since the 1980s.'\\n\\nWhich choice correctly completes the text?","o":["have","having","are","has"],"a":3,"e":"'The number of X' = SINGULAR → has. Cross out 'of species affected by climate change.' Subject = 'the number' → has.","d":"medium"},{"q":"Text: 'Every student, teacher, and administrator in the district [___] required to complete the new training module.'\\n\\nWhich choice correctly completes the text?","o":["are","were","have been","is"],"a":3,"e":"When 'every' or 'each' precedes a compound subject joined by 'and,' the subject is still treated as SINGULAR. 'Every student, teacher, and administrator' → singular → is.","d":"medium"},{"q":"Text: 'The report, together with its supporting appendices, [___] submitted to the board last Friday.'\\n\\nWhich choice correctly completes the text?","o":["are","were","was","have been"],"a":2,"e":"'Together with its supporting appendices' is an intervening phrase (cross it out). Subject = 'The report' (singular) → was.","d":"medium"},{"q":"Text: 'The policy changes announced by the administration [___] sparked widespread debate among educators.'\\n\\nWhich choice correctly completes the text?","o":["is","has","was","have"],"a":3,"e":"Cross out the intervening phrase 'announced by the administration.' Subject = 'changes' (plural) → have.","d":"medium"},{"q":"Text: 'There [___] a series of unresolved questions about the long-term safety of the compound.'\\n\\nWhich choice correctly completes the text?","o":["are","have been","is","were"],"a":2,"e":"Inverted sentence — find the subject after 'There ___.' Subject = 'a series' (singular collective noun) → is. 'A series of X' = singular.","d":"medium"},{"q":"Text: 'The jury [___] still deliberating when the judge called for a recess.'\\n\\nWhich choice correctly completes the text?","o":["have been","was","are","were"],"a":1,"e":"'Jury' = collective noun, singular in American English → was. The jury acts as a unified body.","d":"medium"},{"q":"Text: 'Neither the proposed budget nor the alternative plans [___] received sufficient support from the full council.'\\n\\nWhich choice correctly completes the text?","o":["was","have","is","has"],"a":1,"e":"'Neither...nor': verb agrees with the CLOSEST subject. Closest = 'plans' (plural) → have.","d":"medium"},{"q":"Text: 'Each of the participating countries [___] agreed to reduce carbon emissions by at least 30 percent by 2030.'\\n\\nWhich choice correctly completes the text?","o":["has","have","were","are"],"a":0,"e":"'Each' is always SINGULAR regardless of the following noun. Cross out 'of the participating countries.' Subject = 'each' → has.","d":"medium"}]},{"id":"p2","title":"Pronouns: agreement & clear reference","lead":"A pronoun must match its noun in number and refer to it unambiguously. These exercises train both: choosing the right pronoun and keeping the reference clear.","leadTr":{"uz":"Olmosh o'z oti bilan son jihatdan mos kelishi va unga aniq ishora qilishi kerak. Bu mashqlar ikkalasini ham rivojlantiradi: to'g'ri olmoshni tanlash va ishorani aniq saqlash.","ru":"Местоимение должно совпадать с существительным в числе и однозначно на него указывать. Эти упражнения тренируют и выбор местоимения, и ясность ссылки."},"situation":"","blocks":[],"tip":"","examples":[],"mistakes":[],"quiz":[{"q":"Text: 'The government announced [___] intention to reform the tax code before the end of the fiscal year.'\\n\\nWhich choice correctly completes the text?","o":["their","its","our","his or her"],"a":1,"e":"'The government' is a singular collective noun → 'its.' A (their) treats it as plural.","d":"medium"},{"q":"Text: 'Each candidate must prepare [___] own statement of purpose before the interview.'\\n\\nWhich choice correctly completes the text?","o":["our","its","his or her","their"],"a":2,"e":"'Each' = singular. In formal written English, 'each candidate' takes 'his or her.' C is correct.","d":"medium"},{"q":"Text: 'The research team, frustrated by the lack of funding, decided to publish [___] preliminary findings independently.'\\n\\nWhich choice correctly completes the text?","o":["their","its","his or her","one's"],"a":1,"e":"'Research team' is a collective noun acting as a unit → singular → 'its.' But as members sharing intellectual agency, 'their' is also increasingly accepted. In this context — 'publish findings' as a unified act — B (its) is more formally precise.","d":"medium"},{"q":"Text: 'The corporation restructured [___] operations to reduce overhead costs in the wake of declining revenues.'\\n\\nWhich choice correctly completes the text?","o":["its","our","one's","their"],"a":0,"e":"'The corporation' = singular → 'its.' A (their) incorrectly treats it as plural.","d":"medium"},{"q":"Text: 'The company and [___] subsidiary both reported strong earnings for the third quarter.'\\n\\nWhich choice correctly completes the text?","o":["their","its","our","it's"],"a":1,"e":"'The company' is singular. 'Its subsidiary' — the subsidiary belongs to the singular company → 'its.' A is correct.","d":"medium"},{"q":"Text: 'No one should be forced to compromise [___] principles simply to advance a career.'\\n\\nWhich choice correctly completes the text?","o":["his or her","its","our","their"],"a":0,"e":"'No one' = SINGULAR indefinite pronoun → 'his or her' in formal register. C is correct.","d":"medium"},{"q":"Text: 'The committee published [___] annual report outlining the progress made toward achieving sustainability goals.'\\n\\nWhich choice correctly completes the text?","o":["its","our","their","it's"],"a":0,"e":"'The committee' = singular collective noun → 'its.' D is correct. A (their) is incorrect for a singular noun. B (it's) = 'it is' — wrong word.","d":"medium"},{"q":"Text: 'Both the director and the lead actor acknowledged [___] debt to the playwright's original vision.'\\n\\nWhich choice correctly completes the text?","o":["one's","its","their","his or her"],"a":2,"e":"'Both X and Y' = plural → 'their.' C is correct. They share a collective debt.","d":"medium"},{"q":"Text: 'The university updated [___] admissions policy to consider a wider range of socioeconomic factors.'\\n\\nWhich choice correctly completes the text?","o":["its","their","our","it's"],"a":0,"e":"'The university' = singular → 'its.' C is correct. A (their) is plural. B (it's) = 'it is.'","d":"medium"},{"q":"Text: 'Each country in the alliance pledged to increase [___] defense budget by two percent over the next decade.'\\n\\nWhich choice correctly completes the text?","o":["its","one's","their","our"],"a":0,"e":"'Each country' — 'each' modifies 'country' (singular) → 'its.' B is correct. Though 'their' is increasingly used informally, 'its' is more formally precise for a singular noun.","d":"medium"},{"q":"Text: 'Neither of the lead researchers was willing to retract [___] published findings without further evidence.'\\n\\nWhich choice correctly completes the text?","o":["our","its","his or her","their"],"a":2,"e":"'Neither of the lead researchers' — 'neither' is singular → 'his or her.' B is correct.","d":"medium"},{"q":"Text: 'The board of directors voted to approve the merger despite [___] concerns about the valuation.'\\n\\nWhich choice correctly completes the text?","o":["their","our","one's","its"],"a":3,"e":"'The board of directors' = singular collective noun → 'its.' A is correct. The board as a unified body has 'its' concerns.","d":"medium"}]},{"id":"p3","title":"Commas & semicolons","lead":"The comma and the semicolon are where most writing mistakes live. Learn when two ideas need a semicolon, when a comma is enough, and when neither belongs.","leadTr":{"uz":"Vergul va nuqtali vergul — yozuvdagi xatolarning ko'pchiligi shu yerda. Ikki fikr qachon nuqtali vergul talab qilishini, qachon vergul yetarli ekanini o'rganing.","ru":"Запятая и точка с запятой — где живёт большинство ошибок письма. Учитесь понимать, когда двум идеям нужна точка с запятой, когда достаточно запятой, а когда не нужно ничего."},"situation":"","blocks":[],"tip":"","examples":[],"mistakes":[],"quiz":[{"q":"Text: 'The experiment produced unexpected results[___] the team immediately redesigned the protocol.'\\n\\nWhich choice correctly completes the text?","o":["no punctuation",", and",";","therefore"],"a":2,"e":"Two independent clauses. C (semicolon) correctly joins them.","d":"medium"},{"q":"Text: 'The bridge, which was built in 1923[___] has withstood numerous earthquakes without significant structural damage.'\\n\\nWhich choice correctly completes the text?","o":["—",";",",","no punctuation"],"a":2,"e":"'Which was built in 1923' is a NONRESTRICTIVE clause — it adds information but doesn't identify which bridge. Nonrestrictive elements need commas on BOTH sides. The opening comma is present; a closing comma is needed here. A (,) is correct.","d":"medium"},{"q":"Text: 'After carefully analyzing three years of climate data[___] the researchers concluded that temperatures had risen faster than projected.'\\n\\nWhich choice correctly completes the text?","o":["—",",",";","no punctuation"],"a":1,"e":"An introductory participial phrase ('After carefully analyzing...') must be followed by a comma before the main clause. C (,) is correct.","d":"medium"},{"q":"Text: 'The students who complete all required coursework[___] will be eligible to graduate in May.'\\n\\nWhich choice correctly completes the text?","o":["—",";","no punctuation",","],"a":2,"e":"'Who complete all required coursework' is RESTRICTIVE — it identifies WHICH students (not all students, only those who complete coursework). No commas around restrictive clauses. B (no punctuation) is correct.","d":"medium"},{"q":"Text: 'The novel, written over a period of ten years[___] draws on the author's experiences living in three different countries.'\\n\\nWhich choice correctly completes the text?","o":[";","—","no punctuation",","],"a":3,"e":"'Written over a period of ten years' is a nonrestrictive participial phrase providing extra information about the novel. It needs commas on BOTH sides. The opening comma is already there; a closing comma is needed. B (,) is correct.","d":"medium"},{"q":"Text: 'Scientists have long studied the effects of sleep deprivation[___] researchers continue to discover new neurological consequences.'\\n\\nWhich choice correctly completes the text?","o":[",",";",", and","no punctuation"],"a":1,"e":"Two independent clauses. A comma alone = comma splice (A wrong). C (semicolon) correctly joins two independent clauses. B adds 'and' with a comma — also grammatically correct, but since we're choosing from four options, C (semicolon) is the clean correct punctuation choice.","d":"medium"},{"q":"Text: 'The park features hiking trails, a botanical garden[___] and a small amphitheater for outdoor performances.'\\n\\nWhich choice correctly completes the text?","o":[";",",","no punctuation","—"],"a":1,"e":"Series of three items: 'hiking trails, a botanical garden, and a small amphitheater.' Standard comma before 'and' in a series (Oxford comma). C (,) is correct. A semicolon would only be needed if the items had internal commas.","d":"medium"},{"q":"Text: 'The proposal was rejected[___] the board felt it lacked sufficient financial justification.'\\n\\nWhich choice correctly completes the text?","o":[",","; however,","; because","because"],"a":3,"e":"\\"Because\\" makes the second clause dependent: \\"rejected because the board felt...\\" C is natural and correct.","d":"medium"},{"q":"Text: 'The architect designed the museum[___] but the city lacked funding to build it for another decade.'\\n\\nWhich choice correctly completes the text?","o":["—","no punctuation",",",";"],"a":2,"e":"Two independent clauses joined by 'but' (FANBOYS) require a comma before 'but.' C (,) is correct.","d":"medium"},{"q":"Text: 'Dr. Chen, the lead researcher on the project[___] presented her findings at the international conference.'\\n\\nWhich choice correctly completes the text?","o":["—",";",",","no punctuation"],"a":2,"e":"'The lead researcher on the project' is a NONRESTRICTIVE appositive (renames Dr. Chen). It needs commas on both sides. The opening comma is present; a closing comma is needed. C (,) is correct.","d":"medium"},{"q":"Text: 'Although the weather forecast predicted rain[___] the outdoor ceremony proceeded as planned.'\\n\\nWhich choice correctly completes the text?","o":[",","no punctuation","—",";"],"a":0,"e":"'Although the weather forecast predicted rain' is an introductory dependent clause. Must be followed by a comma before the main clause. C (,) is correct.","d":"medium"},{"q":"Text: 'The legislation was praised by economists[___] criticized by labor unions, and debated extensively in the press.'\\n\\nWhich choice correctly completes the text?","o":[";",",","and","no punctuation"],"a":1,"e":"This is a series: 'praised by economists, criticized by labor unions, and debated...' The comma after 'economists' is needed to separate the first and second items in the series. B (,) is correct.","d":"medium"}]},{"id":"p4","title":"Verb tense in context","lead":"Real texts mix tenses constantly. These items give you a sentence with surrounding context — your job is to keep the timeline consistent.","leadTr":{"uz":"Haqiqiy matnlarda zamonlar doim aralashadi. Bu mashqlarda kontekstli gap beriladi — vazifangiz voqealar chizig'ini izchil saqlash.","ru":"В настоящих текстах времена постоянно смешиваются. Здесь дано предложение с контекстом — ваша задача сохранить хронологию последовательной."},"situation":"","blocks":[],"tip":"","examples":[],"mistakes":[],"quiz":[{"q":"Text: 'In 1928, Alexander Fleming noticed that mold [___] the bacteria in his petri dish, leading to the discovery of penicillin.'\\n\\nWhich choice correctly completes the text?","o":["is killing","kills","had killed","was killing"],"a":3,"e":"The passage describes events in 1928 (past). 'Was killing' = past progressive, showing the ongoing action at the time of his observation. D is correct.","d":"medium"},{"q":"Text: 'By the time the rescue team reached the stranded climbers, temperatures [___] below freezing for over eighteen hours.'\\n\\nWhich choice correctly completes the text?","o":["dropped","have dropped","were dropping","had dropped"],"a":3,"e":"'By the time [past event]' requires PAST PERFECT to show the temperature drop preceded the rescue. B (had dropped) is correct.","d":"medium"},{"q":"Text: 'The committee recommended that the new facilities [___] accessible to all students with disabilities.'\\n\\nWhich choice correctly completes the text?","o":["be","are","being","were"],"a":0,"e":"'Recommended that' + SUBJECT + BASE VERB (subjunctive). C (be) is correct.","d":"medium"},{"q":"Text: 'If the treatment [___] more affordable, many patients who currently cannot access it would benefit significantly.'\\n\\nWhich choice correctly completes the text?","o":["is","would be","was","were"],"a":3,"e":"Contrary-to-fact condition (treatment is NOT currently affordable). 'Were' for all subjects in hypothetical conditions. C is correct.","d":"medium"},{"q":"Text: 'Researchers studying the fossilized remains [___] that the species went extinct approximately 65 million years ago.'\\n\\nWhich choice correctly completes the text?","o":["had concluded","have concluded","will conclude","are conclude"],"a":1,"e":"Present perfect (have concluded) shows ongoing/current relevance — researchers have concluded (and this is the current scientific understanding). A is correct.","d":"medium"},{"q":"Text: 'If the proposal [___] submitted before the deadline, it would have been considered for funding.'\\n\\nWhich choice correctly completes the text?","o":["were","had been","was","is"],"a":1,"e":"Contrary-to-fact past (it was NOT submitted): 'If it HAD BEEN submitted' + 'would have been considered.' C (had been) is correct.","d":"medium"},{"q":"Text: 'The policy required that every employee [___] a mandatory safety training course before beginning work.'\\n\\nWhich choice correctly completes the text?","o":["completed","completes","is completing","complete"],"a":3,"e":"'Required that' + subjunctive: BASE VERB. C (complete) is correct.","d":"medium"},{"q":"Text: 'By 2030, the company [___] all of its operations to renewable energy sources.'\\n\\nWhich choice correctly completes the text?","o":["converts","converted","has converted","will have converted"],"a":3,"e":"'By 2030' (a future deadline) + FUTURE PERFECT to show completion by that point. C (will have converted) is correct.","d":"medium"},{"q":"Text: 'When the archaeologists [___] the site, they found evidence of a civilization far older than previously thought.'\\n\\nWhich choice correctly completes the text?","o":["excavated","had excavated","excavate","have excavated"],"a":0,"e":"Sequential past events: 'excavated...found.' Both in simple past since they happened at roughly the same time (the finding was part of the excavation). D is correct.","d":"medium"},{"q":"Text: 'The judge insisted that the witness [___] the entire transcript without interruption.'\\n\\nWhich choice correctly completes the text?","o":["reads","has read","read","reading"],"a":2,"e":"'Insisted that' + subjunctive: BASE VERB. B (read) is correct.","d":"medium"},{"q":"Text: 'Scientists [___] that the average global temperature has risen by approximately 1.1°C since pre-industrial times.'\\n\\nWhich choice correctly completes the text?","o":["had estimated","estimated","were estimating","have estimated"],"a":3,"e":"Current scientific consensus with past-to-present relevance → PRESENT PERFECT. C (have estimated) is correct.","d":"medium"},{"q":"Text: 'If renewable energy [___] cheaper faster, the transition from fossil fuels would have occurred decades earlier.'\\n\\nWhich choice correctly completes the text?","o":["would have become","has become","became","had become"],"a":3,"e":"Contrary-to-fact past: 'If it HAD BECOME cheaper' + 'would have occurred.' B is correct.","d":"medium"}]},{"id":"p5","title":"Transitions between ideas","lead":"However, therefore, meanwhile, in contrast… The right connector shows the logical relationship between two sentences. Read both sides of the blank before choosing.","leadTr":{"uz":"However, therefore, meanwhile… To'g'ri bog'lovchi ikki gap orasidagi mantiqiy aloqani ko'rsatadi. Tanlashdan oldin bo'sh joyning ikkala tomonini ham o'qing.","ru":"However, therefore, meanwhile… Правильная связка показывает логическую связь между предложениями. Прочитайте обе стороны пропуска, прежде чем выбирать."},"situation":"","blocks":[],"tip":"","examples":[],"mistakes":[],"quiz":[{"q":"Text: 'Early research on the drug showed promising results in laboratory settings. _____, clinical trials involving human subjects revealed serious side effects that had not appeared in animal models.'\\n\\nWhich transition most logically completes the text?","o":["Furthermore","For instance","Consequently","However"],"a":3,"e":"S1 (promising results) CONTRASTS with S2 (serious side effects). This is a CONTRAST relationship → However.","d":"medium"},{"q":"Text: 'The archaeologist found pottery suggesting settlement dating to 3000 BCE. _____, carbon dating of charcoal found in the same stratum confirmed the site was occupied during the early Bronze Age.'\\n\\nWhich transition most logically completes the text?","o":["Nevertheless","Moreover","Consequently","In contrast"],"a":1,"e":"S1 (pottery suggests early date) and S2 (carbon dating confirms similar date) are pointing in the SAME direction — S2 adds confirming evidence. ADDITION → Moreover.","d":"medium"},{"q":"Text: 'Researchers have documented that people sleeping fewer than six hours show impaired reaction times and reduced working memory. _____, the prevalence of chronic sleep deprivation in industrialized nations continues to rise.'\\n\\nWhich transition most logically completes the text?","o":["Nevertheless","As a result","Therefore","Additionally"],"a":0,"e":"S1 (documented harms) vs. S2 (deprivation is RISING despite this knowledge). Something continues DESPITE evidence against it. CONTRAST-DESPITE → Nevertheless.","d":"medium"},{"q":"Text: 'The new manufacturing technique reduced production costs by 40%. _____, the savings were passed on to consumers in the form of lower retail prices.'\\n\\nWhich transition most logically completes the text?","o":["However","For example","Consequently","In contrast"],"a":2,"e":"Lower costs (cause) → lower prices for consumers (effect). CAUSE/EFFECT → Consequently.","d":"medium"},{"q":"Text: 'Some historians argue the decline of Rome was primarily due to internal political corruption. _____, other scholars emphasize the role of external pressures, including migrations and military defeats along the empire's borders.'\\n\\nWhich transition most logically completes the text?","o":["By contrast","In addition","Similarly","Consequently"],"a":0,"e":"S1 (internal factors) is contrasted with S2 (external factors — 'other scholars emphasize DIFFERENT causes'). CONTRAST → By contrast.","d":"medium"},{"q":"Text: 'The new public transit system reduced average commute times significantly. _____, it lowered carbon emissions by reducing the number of private vehicles on major roadways.'\\n\\nWhich transition most logically completes the text?","o":["As a result","For instance","Additionally","However"],"a":2,"e":"S1 (reduced commutes) and S2 (also reduced emissions) — the second ADDS another benefit of the same system. ADDITION → Additionally.","d":"medium"},{"q":"Text: 'The medication showed no improvement over placebo in the controlled study. _____, subsequent real-world data collected from thousands of patients suggested meaningful benefits in the general population.'\\n\\nWhich transition most logically completes the text?","o":["Similarly","Consequently","Nevertheless","Therefore"],"a":2,"e":"S1 (no improvement over placebo) vs. S2 (real-world data shows benefits). Something positive happens DESPITE the controlled study finding. CONTRAST-DESPITE → Nevertheless.","d":"medium"},{"q":"Text: 'The company invested heavily in employee training programs. _____, staff turnover rates fell sharply over the following three years, saving considerable recruitment and onboarding costs.'\\n\\nWhich transition most logically completes the text?","o":["As a result","Moreover","However","In contrast"],"a":0,"e":"Investment in training (cause) → lower turnover (direct effect). CAUSE/EFFECT → As a result.","d":"medium"},{"q":"Text: 'The prime minister had campaigned on a platform of fiscal restraint. _____, the budget she presented in her first year in office included the largest spending increase in a decade.'\\n\\nWhich transition most logically completes the text?","o":["Furthermore","Yet","In fact","As a result"],"a":1,"e":"The PM campaigned on restraint (expectation) but her budget was the opposite (largest spending increase). Clear reversal. CONTRAST → Yet.","d":"medium"},{"q":"Text: 'Several studies have found that people make better decisions under moderate rather than extreme time pressure. _____, some amount of deadline stress appears to focus attention productively.'\\n\\nWhich transition most logically completes the text?","o":["Therefore","That is","However","Nevertheless"],"a":1,"e":"S2 explains/clarifies the MECHANISM behind S1's finding. 'That is' introduces a reformulation or explanation in other words. 'Therefore' would be wrong if S2 is a result but here it elaborates why.","d":"medium"},{"q":"Text: 'The city's public library system has faced severe budget cuts over the past decade. _____, many branches have reduced their hours and eliminated programs for children and seniors.'\\n\\nWhich transition most logically completes the text?","o":["As a result","In contrast","Furthermore","Nevertheless"],"a":0,"e":"Budget cuts (cause) → reduced hours and eliminated programs (effect). CAUSE/EFFECT → As a result.","d":"medium"},{"q":"Text: 'Proponents of nuclear energy argue it produces reliable, low-carbon electricity at scale. _____, critics point to unresolved questions about waste storage and the safety of aging reactor infrastructure.'\\n\\nWhich transition most logically completes the text?","o":["Similarly","However","Nevertheless","Consequently"],"a":1,"e":"Proponents' view (positive) vs. critics' view (concerns). Two opposing perspectives. CONTRAST → However.","d":"medium"}]}],"vocabulary":[{"id":"v1","title":"Work & business","words":[{"w":"colleague","pos":"n","ipa":"/ˈkɒliːɡ/","uz":"hamkasb","ru":"коллега","def":"","ex":"My colleagues are very supportive."},{"w":"deadline","pos":"n","ipa":"/ˈdedlaɪn/","uz":"muddat","ru":"крайний срок","def":"","ex":"We're working to a tight deadline."},{"w":"negotiate","pos":"v","ipa":"/nɪˈɡəʊʃieɪt/","uz":"muzokara olib bormoq","ru":"вести переговоры","def":"","ex":"They negotiated a better contract."},{"w":"profit","pos":"n","ipa":"/ˈprɒfɪt/","uz":"foyda","ru":"прибыль","def":"","ex":"The company made a large profit."},{"w":"client","pos":"n","ipa":"/ˈklaɪənt/","uz":"mijoz","ru":"клиент","def":"","ex":"We met an important client."},{"w":"redundant","pos":"adj","ipa":"/rɪˈdʌndənt/","uz":"ishdan boʻshatilgan","ru":"сокращённый","def":"","ex":"He was made redundant last year."},{"w":"invest","pos":"v","ipa":"/ɪnˈvest/","uz":"sarmoya kiritmoq","ru":"инвестировать","def":"","ex":"They invested in new technology."},{"w":"revenue","pos":"n","ipa":"/ˈrevənjuː/","uz":"daromad","ru":"выручка","def":"","ex":"Annual revenue rose by ten percent."},{"w":"entrepreneur","pos":"n","ipa":"/ˌɒntrəprəˈnɜː/","uz":"tadbirkor","ru":"предприниматель","def":"","ex":"She's a successful entrepreneur."},{"w":"stakeholder","pos":"n","ipa":"/ˈsteɪkhəʊldə/","uz":"manfaatdor tomon","ru":"заинтересованная сторона","def":"","ex":"All stakeholders were consulted."},{"w":"merge","pos":"v","ipa":"/mɜːdʒ/","uz":"birlashmoq","ru":"сливаться","def":"","ex":"The two firms merged."},{"w":"bankrupt","pos":"adj","ipa":"/ˈbæŋkrʌpt/","uz":"bankrot","ru":"банкрот","def":"","ex":"The business went bankrupt."},{"w":"shareholder","pos":"n","ipa":"/ˈʃeəhəʊldə/","uz":"aksiyador","ru":"акционер","def":"","ex":"Shareholders met to vote."},{"w":"productivity","pos":"n","ipa":"/ˌprɒdʌkˈtɪvəti/","uz":"unumdorlik","ru":"производительность","def":"","ex":"Productivity has improved."},{"w":"recruit","pos":"v","ipa":"/rɪˈkruːt/","uz":"ishga olmoq","ru":"набирать","def":"","ex":"They are recruiting new staff."},{"w":"strategy","pos":"n","ipa":"/ˈstrætədʒi/","uz":"strategiya","ru":"стратегия","def":"","ex":"We need a clear strategy."},{"w":"budget","pos":"n","ipa":"/ˈbʌdʒɪt/","uz":"byudjet","ru":"бюджет","def":"","ex":"The project went over budget."},{"w":"competitor","pos":"n","ipa":"/kəmˈpetɪtə/","uz":"raqobatchi","ru":"конкурент","def":"","ex":"Our main competitor cut prices."},{"w":"launch","pos":"v","ipa":"/lɔːntʃ/","uz":"ishga tushirmoq","ru":"запускать","def":"","ex":"They launched a new product."},{"w":"turnover","pos":"n","ipa":"/ˈtɜːnəʊvə/","uz":"aylanma","ru":"оборот","def":"","ex":"The shop has a high turnover."},{"w":"promote","pos":"v","ipa":"/prəˈməʊt/","uz":"lavozimini koʻtarmoq","ru":"продвигать","def":"","ex":"She was promoted to manager."},{"w":"sustainable","pos":"adj","ipa":"/səˈsteɪnəbl/","uz":"barqaror","ru":"устойчивый","def":"","ex":"We aim for sustainable growth."}]},{"id":"v2","title":"Science & technology","words":[{"w":"research","pos":"n","ipa":"/rɪˈsɜːtʃ/","uz":"tadqiqot","ru":"исследование","def":"","ex":"They conduct medical research."},{"w":"experiment","pos":"n","ipa":"/ɪkˈsperɪmənt/","uz":"tajriba","ru":"эксперимент","def":"","ex":"The experiment was a success."},{"w":"data","pos":"n","ipa":"/ˈdeɪtə/","uz":"maʼlumotlar","ru":"данные","def":"","ex":"We analysed the data carefully."},{"w":"device","pos":"n","ipa":"/dɪˈvaɪs/","uz":"qurilma","ru":"устройство","def":"","ex":"This device measures heart rate."},{"w":"artificial","pos":"adj","ipa":"/ˌɑːtɪˈfɪʃl/","uz":"sunʼiy","ru":"искусственный","def":"","ex":"Artificial intelligence is growing fast."},{"w":"innovation","pos":"n","ipa":"/ˌɪnəˈveɪʃn/","uz":"innovatsiya","ru":"инновация","def":"","ex":"The phone was a major innovation."},{"w":"laboratory","pos":"n","ipa":"/ləˈbɒrətri/","uz":"laboratoriya","ru":"лаборатория","def":"","ex":"She works in a laboratory."},{"w":"hypothesis","pos":"n","ipa":"/haɪˈpɒθəsɪs/","uz":"gipoteza","ru":"гипотеза","def":"","ex":"The data supported the hypothesis."},{"w":"breakthrough","pos":"n","ipa":"/ˈbreɪkθruː/","uz":"yutuq","ru":"прорыв","def":"","ex":"A breakthrough in cancer treatment."},{"w":"software","pos":"n","ipa":"/ˈsɒftweə/","uz":"dasturiy taʼminot","ru":"программное обеспечение","def":"","ex":"We updated the software."},{"w":"network","pos":"n","ipa":"/ˈnetwɜːk/","uz":"tarmoq","ru":"сеть","def":"","ex":"The network connects all offices."},{"w":"automatic","pos":"adj","ipa":"/ˌɔːtəˈmætɪk/","uz":"avtomatik","ru":"автоматический","def":"","ex":"The doors are automatic."},{"w":"engineer","pos":"n","ipa":"/ˌendʒɪˈnɪə/","uz":"muhandis","ru":"инженер","def":"","ex":"A software engineer fixed it."},{"w":"invention","pos":"n","ipa":"/ɪnˈvenʃn/","uz":"ixtiro","ru":"изобретение","def":"","ex":"The wheel was a great invention."},{"w":"theory","pos":"n","ipa":"/ˈθɪəri/","uz":"nazariya","ru":"теория","def":"","ex":"Einstein's theory changed physics."},{"w":"satellite","pos":"n","ipa":"/ˈsætəlaɪt/","uz":"sunʼiy yoʻldosh","ru":"спутник","def":"","ex":"The satellite orbits the Earth."},{"w":"genetic","pos":"adj","ipa":"/dʒəˈnetɪk/","uz":"genetik","ru":"генетический","def":"","ex":"Genetic research is advancing."},{"w":"fun t":"allow"},{"w":"presumptuous","pos":"adj","ipa":"/prɪˈzʌmptʃuəs/","uz":"beadab, dadil","ru":"самонадеянный","def":"too bold or forward","ex":"It was presumptuous to assume.","syn":"arrogant, overconfident","ant":"modest"},{"w":"pretentious","pos":"adj","ipa":"/prɪˈtɛnʃəs/","uz":"manmansirovchi, dabdabali","ru":"претенциозный","def":"trying to seem important","ex":"His pretentious style put readers off.","syn":"affected, showy","ant":"unpretentious"},{"w":"proficient","pos":"adj","ipa":"/prəˈfɪʃənt/","uz":"mohir, malakali","ru":"умелый","def":"skilled and competent","ex":"She is proficient in three languages.","syn":"skilled, adept","ant":"incompetent"},{"w":"prolific","pos":"adj","ipa":"/prəˈlɪfɪk/","uz":"sermahsul, ko'p yozadigan","ru":"плодовитый","def":"producing much work","ex":"A prolific author, she wrote daily.","syn":"productive, fertile","ant":"unproductive"},{"w":"propensity","pos":"noun","ipa":"/prəˈpɛnsɪti/","uz":"moyillik, mayl","ru":"склонность","def":"a natural tendency","ex":"He has a propensity for risk.","syn":"tendency, inclination","ant":"aversion"},{"w":"prudent","pos":"adj","ipa":"/ˈpruːdənt/","uz":"ehtiyotkor, oqilona","ru":"благоразумный","def":"careful and sensible","ex":"It was a prudent choice.","syn":"sensible, cautious","ant":"reckless"},{"w":"quell","pos":"verb","ipa":"/kwɛl/","uz":"bostirmoq, tinchlantirmoq","ru":"подавлять","def":"to suppress or calm","ex":"Troops quelled the riot.","syn":"suppress, subdue","ant":"incite"},{"w":"rancor","pos":"noun","ipa":"/ˈræŋkər/","uz":"g'azab, adovat","ru":"злоба","def":"bitter resentment","ex":"Old rancor resurfaced.","syn":"bitterness, resentment","ant":"goodwill"},{"w":"reciprocal","pos":"adj","ipa":"/rɪˈsɪprəkəl/","uz":"o'zaro","ru":"взаимный","def":"given and received in return","ex":"They had a reciprocal arrangement.","syn":"mutual, shared","ant":"one-sided"},{"w":"reconcile","pos":"verb","ipa":"/ˈrɛkənsaɪl/","uz":"yarashtirmoq, muvofiqlashtirmoq","ru":"примирять","def":"to make consistent or restore harmony","ex":"They reconciled after the fight.","syn":"harmonize, settle","ant":"—"},{"w":"relinquish","pos":"verb","ipa":"/rɪˈlɪŋkwɪʃ/","uz":"voz kechmoq, topshirmoq","ru":"отказываться","def":"to give up or surrender","ex":"She relinquished control.","syn":"surrender, yield","ant":"retain"},{"w":"render","pos":"verb","ipa":"/ˈrɛndər/","uz":"aylantirmoq, taqdim etmoq","ru":"делать, представлять","def":"to cause to become; to provide","ex":"The error rendered the data useless.","syn":"make, provide","ant":"—"},{"w":"repudiate","pos":"verb","ipa":"/rɪˈpjuːdieɪt/","uz":"rad etmoq, inkor qilmoq","ru":"отвергать","def":"to reject or disown","ex":"He repudiated the claim.","syn":"reject, disown","ant":"embrace"},{"w":"resolute","pos":"adj","ipa":"/ˈrɛzəluːt/","uz":"qat'iyatli, mustahkam","ru":"решительный","def":"firm and determined","ex":"She was resolute in her decision.","syn":"determined, steadfast","ant":"irresolute"},{"w":"reticent","pos":"adj","ipa":"/ˈrɛtɪsənt/","uz":"kamgap, tortinchoq","ru":"сдержанный","def":"reluctant to speak","ex":"He was reticent about his past.","syn":"reserved, taciturn","ant":"talkative"},{"w":"reverence","pos":"noun","ipa":"/ˈrɛvərəns/","uz":"hurmat, ehtirom","ru":"благоговение","def":"deep respect","ex":"They spoke with reverence.","syn":"respect, awe","ant":"contempt"}]},{"id":"sv16","title":"Academic words · Set 8","words":[{"w":"abate","pos":"verb","ipa":"/əˈbeɪt/","uz":"kamaymoq, pasaymoq","ru":"утихать, ослабевать","def":"to lessen in intensity","ex":"The storm finally abated.","syn":"subside, diminish","ant":"intensify"},{"w":"abdicate","pos":"verb","ipa":"/ˈæbdɪkeɪt/","uz":"taxtdan voz kechmoq","ru":"отрекаться","def":"to give up power or responsibility","ex":"The king abdicated the throne.","syn":"resign, relinquish","ant":"retain"},{"w":"abscond","pos":"verb","ipa":"/əbˈskɒnd/","uz":"qochib ketmoq, yashirinmoq","ru":"скрываться, сбегать","def":"to leave secretly to avoid capture","ex":"The cashier absconded with the funds.","syn":"flee, escape","ant":"remain"},{"w":"abstemious","pos":"adj","ipa":"/æbˈstiːmiəs/","uz":"parhezkor, tiyilgan","ru":"воздержанный","def":"sparing in eating and drinking","ex":"He led an abstemious lifestyle.","syn":"moderate, temperate","ant":"indulgent"},{"w":"accentuate","pos":"verb","ipa":"/əkˈsɛntʃueɪt/","uz":"ta'kidlamoq, kuchaytirmoq","ru":"подчёркивать","def":"to emphasize or make prominent","ex":"The lighting accentuated the colors.","syn":"emphasize, highlight","ant":"downplay"},{"w":"acquiesce","pos":"verb","ipa":"/ˌækwiˈɛs/","uz":"rozi bo'lmoq, ko'nmoq","ru":"соглашаться, уступать","def":"to accept reluctantly without protest","ex":"She acquiesced to their demands.","syn":"consent, comply","ant":"resist"},{"w":"acrid","pos":"adj","ipa":"/ˈækrɪd/","uz":"achchiq, o'tkir","ru":"едкий","def":"sharp and bitter in smell or taste","ex":"Acrid smoke filled the room.","syn":"pungent, bitter","ant":"mild"},{"w":"adamant","pos":"adj","ipa":"/ˈædəmənt/","uz":"qat'iy, qaysar","ru":"непреклонный","def":"refusing to change one's mind","ex":"She was adamant about leaving.","syn":"unyielding, firm","ant":"flexible"},{"w":"adroit","pos":"adj","ipa":"/əˈdrɔɪt/","uz":"mohir, epchil","ru":"ловкий, искусный","def":"clever and skillful","ex":"An adroit negotiator closed the deal.","syn":"skillful, deft","ant":"clumsy"},{"w":"adulation","pos":"noun","ipa":"/ˌædʒəˈleɪʃən/","uz":"haddan tashqari maqtov","ru":"лесть, обожание","def":"excessive admiration or praise","ex":"The star received constant adulation.","syn":"praise, flattery","ant":"criticism"},{"w":"adulterate","pos":"verb","ipa":"/əˈdʌltəreɪt/","uz":"buzmoq, aralashtirmoq","ru":"фальсифицировать, разбавлять","def":"to make impure by adding something","ex":"The milk was adulterated with water.","syn":"contaminate, dilute","ant":"purify"},{"w":"affluent","pos":"adj","ipa":"/ˈæfluənt/","uz":"badavlat, boy","ru":"богатый, состоятельный","def":"wealthy","ex":"They live in an affluent suburb.","syn":"wealthy, prosperous","ant":"poor"},{"w":"aggrandize","pos":"verb","ipa":"/əˈɡrændaɪz/","uz":"ulug'lamoq, kattalashtirmoq","ru":"возвеличивать","def":"to increase power or reputation","ex":"He sought to aggrandize himself.","syn":"exalt, magnify","ant":"belittle"},{"w":"allay","pos":"verb","ipa":"/əˈleɪ/","uz":"tinchlantirmoq, yengillashtirmoq","ru":"успокаивать, развеивать","def":"to reduce fear or concern","ex":"The news allayed their fears.","syn":"calm, ease","ant":"aggravate"},{"w":"allude","pos":"verb","ipa":"/əˈluːd/","uz":"ishora qilmoq","ru":"намекать, ссылаться","def":"to refer to indirectly","ex":"She alluded to the scandal.","syn":"hint, refer","ant":"state"},{"w":"amalgamate","pos":"verb","ipa":"/əˈmælɡəmeɪt/","uz":"birlashtirmoq","ru":"объединять, сливать","def":"to combine into one","ex":"The firms amalgamated.","syn":"merge, combine","ant":"separate"},{"w":"ameliorate","pos":"verb","ipa":"/əˈmiːliəreɪt/","uz":"yaxshilamoq","ru":"улучшать","def":"to make better","ex":"Reforms ameliorated conditions.","syn":"improve, better","ant":"worsen"},{"w":"amenable","pos":"adj","ipa":"/əˈmiːnəbəl/","uz":"moyil, ko'nuvchan","ru":"сговорчивый, поддающийся","def":"open to suggestion; responsive","ex":"He is amenable to change.","syn":"agreeable, receptive","ant":"resistant"},{"w":"amorphous","pos":"adj","ipa":"/əˈmɔːrfəs/","uz":"shaklsiz, noaniq","ru":"аморфный, бесформенный","def":"without clear shape or structure","ex":"An amorphous mass of clay.","syn":"shapeless, vague","ant":"structured"},{"w":"anachronism","pos":"noun","ipa":"/əˈnækrənɪzəm/","uz":"davrga mos kelmaslik","ru":"анахронизм","def":"something out of its proper time","ex":"A sword in a modern film is an anachronism.","syn":"misplacement","ant":"—"}]},{"id":"sv17","title":"Academic words · Set 9","words":[{"w":"anecdote","pos":"noun","ipa":"/ˈænɪkdoʊt/","uz":"hikoya, latifa","ru":"анекдот, история","def":"a short personal story","ex":"She told an amusing anecdote.","syn":"story, account","ant":"—"},{"w":"animosity","pos":"noun","ipa":"/ˌænɪˈmɒsɪti/","uz":"adovat, dushmanlik","ru":"враждебность","def":"strong hostility","ex":"There was animosity between them.","syn":"hostility, enmity","ant":"friendship"},{"w":"antithesis","pos":"noun","ipa":"/ænˈtɪθəsɪs/","uz":"ziddiyat, qarama-qarshilik","ru":"антитеза, противоположность","def":"the direct opposite","ex":"His calm is the antithesis of her panic.","syn":"opposite, contrast","ant":"sameness"},{"w":"apathetic","pos":"adj","ipa":"/ˌæpəˈθɛtɪk/","uz":"befarq, loqayd","ru":"апатичный, безразличный","def":"showing no interest or emotion","ex":"Voters seemed apathetic.","syn":"indifferent, uncaring","ant":"passionate"},{"w":"aplomb","pos":"noun","ipa":"/əˈplɒm/","uz":"vazminlik, dadillik","ru":"самообладание","def":"calm confidence","ex":"She handled the crisis with aplomb.","syn":"poise, composure","ant":"awkwardness"},{"w":"apprise","pos":"verb","ipa":"/əˈpraɪz/","uz":"xabardor qilmoq","ru":"уведомлять, извещать","def":"to inform","ex":"Keep me apprised of changes.","syn":"inform, notify","ant":"conceal"},{"w":"approbation","pos":"noun","ipa":"/ˌæprəˈbeɪʃən/","uz":"ma'qullash, tasdiq","ru":"одобрение","def":"approval or praise","ex":"The plan won wide approbation.","syn":"approval, praise","ant":"disapproval"},{"w":"arcane","pos":"adj","ipa":"/ɑːrˈkeɪn/","uz":"sirli, kam ma'lum","ru":"тайный, малопонятный","def":"mysterious; known to few","ex":"An arcane rule no one understood.","syn":"obscure, esoteric","ant":"common"},{"w":"arid","pos":"adj","ipa":"/ˈærɪd/","uz":"qurg'oqchil, quruq","ru":"засушливый, сухой","def":"very dry; lacking interest","ex":"The arid desert stretched for miles.","syn":"dry, barren","ant":"lush"},{"w":"ascetic","pos":"adj","ipa":"/əˈsɛtɪk/","uz":"zohid, riyozatkash","ru":"аскетичный","def":"practicing severe self-discipline","ex":"The monk led an ascetic life.","syn":"austere, abstinent","ant":"indulgent"},{"w":"assuage","pos":"verb","ipa":"/əˈsweɪdʒ/","uz":"yumshatmoq, tinchlantirmoq","ru":"смягчать, унимать","def":"to make less severe","ex":"Nothing could assuage her grief.","syn":"ease, soothe","ant":"intensify"},{"w":"atrophy","pos":"verb","ipa":"/ˈætrəfi/","uz":"zaiflashmoq, susaymoq","ru":"атрофироваться, чахнуть","def":"to waste away","ex":"Muscles atrophy without use.","syn":"wither, degenerate","ant":"strengthen"},{"w":"avarice","pos":"noun","ipa":"/ˈævərɪs/","uz":"ochko'zlik, tamagirlik","ru":"алчность, жадность","def":"extreme greed for wealth","ex":"His avarice knew no limits.","syn":"greed, cupidity","ant":"generosity"},{"w":"aver","pos":"verb","ipa":"/əˈvɜːr/","uz":"qat'iy aytmoq, tasdiqlamoq","ru":"утверждать","def":"to state firmly as true","ex":"She averred her innocence.","syn":"assert, declare","ant":"deny"},{"w":"avid","pos":"adj","ipa":"/ˈævɪd/","uz":"ishtiyoqli, qiziquvchan","ru":"страстный, заядлый","def":"keenly interested; enthusiastic","ex":"An avid reader of history.","syn":"keen, eager","ant":"indifferent"},{"w":"belie","pos":"verb","ipa":"/bɪˈlaɪ/","uz":"yashirmoq, zid kelmoq","ru":"противоречить, скрывать","def":"to contradict or misrepresent","ex":"Her smile belied her sorrow.","syn":"contradict, mask","ant":"confirm"},{"w":"benevolence","pos":"noun","ipa":"/bəˈnɛvələns/","uz":"xayrixohlik, mehribonlik","ru":"благожелательность","def":"kindness; goodwill","ex":"She acted out of benevolence.","syn":"kindness, generosity","ant":"malice"},{"w":"bequeath","pos":"verb","ipa":"/bɪˈkwiːð/","uz":"meros qoldirmoq","ru":"завещать","def":"to leave to someone in a will","ex":"She bequeathed her estate to charity.","syn":"leave, hand down","ant":"—"},{"w":"blatant","pos":"adj","ipa":"/ˈbleɪtənt/","uz":"ochiq-oydin, qo'pol","ru":"вопиющий, явный","def":"completely obvious, often offensively","ex":"A blatant lie.","syn":"flagrant, glaring","ant":"subtle"},{"w":"boisterous","pos":"adj","ipa":"/ˈbɔɪstərəs/","uz":"shovqinli, serharakat","ru":"шумный, буйный","def":"noisy and energetic","ex":"A boisterous crowd.","syn":"rowdy, loud","ant":"quiet"}]}],"reading":[{"id":"r1","title":"The Remote Working Debate","text":"Since the pandemic, working from home has become normal for millions of people. Supporters argue that it offers a better work-life balance: employees save hours that would otherwise be wasted commuting, and many report feeling less stressed and more productive.\\nNot everyone is convinced, however. Some managers worry that staff who work remotely are harder to supervise and less connected to their colleagues. Younger workers, in particular, may miss the informal learning that happens in an office, where they can pick up skills simply by watching experienced people.\\nThe truth probably lies somewhere in between. A growing number of companies in Manchester and London now offer a 'hybrid' model, in which employees spend part of the week at home and part in the office. Had this option been available ten years ago, it might have seemed strange. Today, it is increasingly seen as the best of both worlds.","quiz":[{"q":"What is one advantage of remote work mentioned?","o":["higher pay","a better work-life balance","more holidays","free meals"],"a":1,"e":"It offers a better work-life balance.","d":"medium"},{"q":"Why do some managers worry?","o":["Staff work too hard.","Staff are harder to supervise.","Offices are expensive.","Staff earn less."],"a":1,"e":"Remote staff are harder to supervise and less connected.","d":"medium"},{"q":"What might younger workers miss?","o":["higher salaries","informal learning in the office","longer holidays","free transport"],"a":1,"e":"They may miss informal learning from experienced colleagues.","d":"medium"},{"q":"What is the 'hybrid' model?","o":["working only at home","working only in the office","part home, part office","working at night"],"a":2,"e":"Part of the week at home, part in the office.","d":"medium"},{"q":"What is the writer's overall view of hybrid work?","o":["It is strange.","It is the best of both worlds.","It will fail.","It is only for managers."],"a":1,"e":"It is increasingly seen as the best of both worlds.","d":"medium"}]},{"id":"r2","title":"Living with Artificial Intelligence","text":"Artificial intelligence is no longer science fiction. It already recommends the films we watch, filters our emails, and helps doctors read medical scans. For many, these developments are exciting; for others, they are a cause for concern.\\nThose who welcome AI point to its potential to save lives and time. A computer can examine thousands of images far faster than a human, spotting patterns that might otherwise be missed. In industries from farming to finance, AI is helping people make better decisions.\\nYet the same technology raises difficult questions. If a self-driving car causes an accident, who is responsible? As machines take over more tasks, some jobs will certainly disappear. Supporters argue that new jobs will be created, just as they were during the Industrial Revolution. Critics are less sure. What seems clear is that AI is here to stay, and societies will need to decide carefully how to use it.","quiz":[{"q":"What does the text say AI already does?","o":["replaces all doctors","recommends films and filters emails","drives all cars","teaches in schools"],"a":1,"e":"It recommends films, filters emails and helps read scans.","d":"medium"},{"q":"Why is AI useful in medicine?","o":["It is cheaper.","It examines images faster than humans.","It never makes mistakes.","It replaces nurses."],"a":1,"e":"It can examine many images quickly and spot patterns.","d":"medium"},{"q":"What difficult question does the text raise?","o":["how fast cars go","who is responsible for a self-driving car accident","how to build computers","where to buy AI"],"a":1,"e":"Responsibility for a self-driving car accident.","d":"medium"},{"q":"What do supporters say about jobs?","o":["All jobs will be lost.","New jobs will be created.","No jobs will change.","Only farming jobs remain."],"a":1,"e":"They argue new jobs will be created.","d":"medium"},{"q":"What conclusion does the writer reach?","o":["AI should be banned.","AI will disappear soon.","AI is here to stay and must be used carefully.","AI is useless."],"a":2,"e":"AI is here to stay; societies must decide how to use it.","d":"medium"}]},{"id":"r3","title":"Why We Put Things Off","text":"Almost everyone procrastinates. We delay important tasks, choosing instead to check our phones, tidy a drawer, or make yet another cup of tea. We know we are wasting time, and yet we do it anyway. Why?\\nPsychologists suggest that procrastination is not really about laziness. It is more often about emotion. When a task makes us feel anxious or bored, our brain looks for an escape, and a quick, pleasant distraction provides instant relief. The problem, of course, is that the relief never lasts, and the task only grows more stressful.\\nThe good news is that procrastination can be managed. Experts recommend breaking a large task into small steps, so that it feels less frightening. It also helps to forgive yourself for past delays; research has shown that students who stopped criticising themselves actually procrastinated less in future. In other words, being kinder to ourselves may be the first step towards getting things done.","quiz":[{"q":"According to psychologists, procrastination is mainly about ___.","o":["laziness","emotion","intelligence","time"],"a":1,"e":"It is more about emotion than laziness.","d":"medium"},{"q":"Why does the brain seek distraction?","o":["to learn","for instant relief from anxiety or boredom","to save money","to sleep"],"a":1,"e":"Distraction gives instant relief from bad feelings.","d":"medium"},{"q":"What is the problem with distraction?","o":["It costs money.","The relief never lasts.","It is illegal.","It is tiring."],"a":1,"e":"The relief never lasts and the task grows more stressful.","d":"medium"},{"q":"What do experts recommend for big tasks?","o":["ignoring them","breaking them into small steps","doing them at night","asking others to do them"],"a":1,"e":"Break a large task into small steps.","d":"medium"},{"q":"What did research on students show?","o":["Self-criticism helped.","Forgiving themselves reduced procrastination.","Punishment worked best.","Nothing changed."],"a":1,"e":"Students who stopped self-criticism procrastinated less.","d":"medium"}]},{"id":"r4","title":"Report: Improving the Town Library","text":"Introduction\\nThe purpose of this report is to assess the current state of Brighton Central Library and to recommend improvements. The findings are based on a survey of 200 users and interviews with staff.\\n\\nFindings\\nThe majority of users praised the library's wide selection of books. However, several problems were identified. Firstly, the opening hours were felt to be too limited, particularly for those who work full-time. Secondly, the building's Wi-Fi was described as slow and unreliable. Finally, a number of younger visitors complained that there was nowhere quiet to study.\\n\\nRecommendations\\nIn light of these findings, it is recommended that the library extend its opening hours into the evening. Furthermore, the Wi-Fi system should be upgraded as a priority. Were a quiet study area to be created on the upper floor, it would almost certainly attract more students.\\n\\nConclusion\\nWith relatively modest investment, the library could serve the community far more effectively.","quiz":[{"q":"What is the purpose of the report?","o":["to close the library","to assess it and recommend improvements","to advertise books","to hire staff"],"a":1,"e":"To assess the library and recommend improvements.","d":"medium"},{"q":"How was the information gathered?","o":["from one manager","a survey and interviews","from the internet","from newspapers"],"a":1,"e":"A survey of 200 users and staff interviews.","d":"medium"},{"q":"What did users praise?","o":["the café","the wide selection of books","the parking","the garden"],"a":1,"e":"The wide selection of books.","d":"medium"},{"q":"Which was NOT a problem identified?","o":["limited opening hours","slow Wi-Fi","nowhere quiet to study","rude staff"],"a":3,"e":"Rude staff was not mentioned.","d":"medium"},{"q":"What is recommended for the upper floor?","o":["a café","a quiet study area","a car park","a cinema"],"a":1,"e":"Creating a quiet study area would attract students.","d":"medium"}]},{"id":"r5","title":"The Cost of Cheap Travel","text":"Never before has travel been so affordable. Budget airlines now offer flights across Europe for the price of a meal, and millions of us take advantage every year. Yet this golden age of cheap travel comes at a price that does not appear on the ticket.\\nThe most obvious cost is environmental. Aviation produces a significant share of carbon emissions, and a single long flight can undo months of careful recycling. Less visible, but no less serious, is the impact on popular destinations. Cities such as Venice and Barcelona have become so crowded with visitors that local residents are being pushed out of their own neighbourhoods.\\nNone of this means we should stop travelling altogether. Travel broadens the mind and supports countless livelihoods. What it does suggest is that we should travel more thoughtfully — flying less often, staying longer, and respecting the places we visit. Only if tourists and governments act together will the benefits of travel be preserved for future generations.","quiz":[{"q":"What point does the opening make about travel today?","o":["It is too expensive.","It has never been so affordable.","It is dangerous.","It is disappearing."],"a":1,"e":"Travel has never been so affordable.","d":"medium"},{"q":"What is described as the most obvious cost?","o":["environmental","financial","political","medical"],"a":0,"e":"The environmental cost (carbon emissions).","d":"medium"},{"q":"What problem do Venice and Barcelona face?","o":["too few tourists","overcrowding pushing out residents","high prices","bad weather"],"a":1,"e":"Overcrowding is pushing local residents out.","d":"medium"},{"q":"Does the writer say we should stop travelling?","o":["Yes, completely.","No, but travel more thoughtfully.","Yes, for one year.","No opinion is given."],"a":1,"e":"We should travel more thoughtfully, not stop.","d":"medium"},{"q":"What does the writer say is needed to preserve travel's benefits?","o":["cheaper flights","tourists and governments acting together","more airports","longer holidays"],"a":1,"e":"Tourists and governments must act together.","d":"medium"}]},{"id":"s1","title":"Reading set: Ideas & evidence I","text":"Each task below contains its own short passage. Read it closely, then answer — this trains exactly the kind of reading you will meet in real academic texts and exams.\\n\\nQuyida har bir topshiriqning o'z qisqa matni bor. Diqqat bilan o'qing, so'ng javob bering.","quiz":[{"q":"Passage: Recent archaeological discoveries along the ancient Silk Road reveal that the exchange of goods was accompanied by an equally significant transfer of agricultural knowledge. Crop varieties, farming techniques, and irrigation methods all traveled alongside silk and spices, fundamentally reshaping food production across Eurasia.\\n\\nWhich best states the main idea?","o":["The Silk Road facilitated trade in goods AND the spread of agricultural knowledge across Eurasia","Irrigation methods developed in Asia were superior to those used in Europe","Silk Road sites contain artifacts related to farming and food production","The Silk Road was primarily a route for luxury goods between Asia and Europe"],"a":0,"e":"The passage argues the Silk Road transferred BOTH goods AND agricultural knowledge. C covers the full argument. A and B are too narrow. D is not stated.","d":"medium"},{"q":"Passage: The assumption that digital technology has uniformly shortened human attention spans is not supported by evidence. While social media correlates with brief engagement, long-form video streaming and e-reading involve sustained attention comparable to traditional media.\\n\\nWhich best states the central claim?","o":["Digital technology has significantly shortened the average human attention span","Long-form streaming requires greater attention than reading physical books","The relationship between digital technology and attention is more complex than a simple decline narrative","Social media platforms are specifically designed to capture user attention"],"a":2,"e":"The passage challenges the 'uniformly shortened' assumption — not all digital activities reduce attention. C captures this nuance. A is what the passage contradicts. B and D are too narrow.","d":"medium"},{"q":"Passage: Biologist E.O. Wilson coined 'biophilia' to describe an innate human affinity for other living systems. He argued that millions of years of evolution hardwired humans to find beauty and meaning in nature — a connection he believed modern urban life systematically erodes.\\n\\nThe text is primarily about","o":["Wilson's argument that humans have an evolutionarily rooted connection to nature that urbanization threatens","The psychological effects of city living without access to natural environments","The scientific debate surrounding Wilson's hypothesis","Wilson's career contributions to evolutionary science"],"a":0,"e":"The passage presents Wilson's specific argument: humans are hardwired for nature AND urbanization erodes this. B captures both parts. A implies debate (not stated). C and D are too narrow.","d":"medium"},{"q":"Passage: The narrative that the printing press single-handedly caused the Protestant Reformation oversimplifies history. While Gutenberg's invention accelerated Luther's ideas, religious discontent had been building for over a century before 1517, driven by clerical corruption and economic grievances.\\n\\nThe central claim is that","o":["The Reformation was caused primarily by economics rather than religion","The press was one factor in the Reformation, but tensions had deeper roots that preceded it","Gutenberg's press was not invented until after Luther's 95 Theses","Luther's ideas would have spread even without the printing press"],"a":1,"e":"The passage argues the press-caused-Reformation narrative is oversimplified because discontent predated print. C captures this. A is factually wrong. B distorts. D is speculative.","d":"medium"}]},{"id":"s2","title":"Reading set: Ideas & evidence II","text":"Each task below contains its own short passage. Read it closely, then answer — this trains exactly the kind of reading you will meet in real academic texts and exams.\\n\\nQuyida har bir topshiriqning o'z qisqa matni bor. Diqqat bilan o'qing, so'ng javob bering.","quiz":[{"q":"Passage: As Arctic permafrost thaws, it releases stored carbon dioxide and methane, which accelerate warming, which causes more thawing. What makes this alarming is that permafrost contains roughly twice as much carbon as is currently in the atmosphere.\\n\\nThe main idea is","o":["Climate change poses threats to Arctic ecosystems that scientists are only beginning to understand","Arctic permafrost stores large quantities of carbon accumulated over thousands of years","The thawing of permafrost creates a self-reinforcing cycle that could dramatically amplify climate change","Scientists have recently discovered that permafrost contains methane in addition to carbon dioxide"],"a":2,"e":"The key argument is the feedback loop PLUS the alarming carbon quantity. B captures both. A and C are individual details. D is too vague.","d":"medium"},{"q":"Passage: Scholar Nancy Armstrong argues that the rise of the Victorian novel was inseparable from the rise of middle-class femininity. The idealized domestic woman depicted in these novels was not merely a reflection of social reality but an active construct that helped produce it — shaping how readers understood desire and virtue.\\n\\nWhat is the central claim?","o":["Victorian heroines demonstrated virtues that real women were expected to emulate","Victorian novels were primarily written by and for middle-class women","Armstrong argues domestic fiction both reflected and actively shaped Victorian ideals of femininity","Victorian domestic fiction was more concerned with class than gender"],"a":2,"e":"Armstrong's argument has two parts: novels were part of the rise of femininity AND they actively produced that femininity. B captures both. A is not stated. C misses 'actively constructed.' D contradicts the text.","d":"medium"},{"q":"Passage: Traditional economics treats humans as rational actors who maximize self-interest. However, behavioral economics research demonstrates that human decision-making is systematically shaped by cognitive biases, emotional states, and social influences that often lead people to act against their own stated preferences.\\n\\nThe passage primarily argues that","o":["Behavioral economics has replaced traditional economics as the dominant framework","Human beings are fundamentally irrational and incapable of sound economic decisions","Cognitive biases can occasionally cause people to deviate from economically rational behavior","Traditional economic models fail to accurately capture how humans actually make decisions"],"a":3,"e":"The passage says traditional models assume rationality BUT behavioral economics shows systematic biases. B captures this. A is too strong. C is too extreme. D is too weak — 'occasionally' vs. 'systematically.'","d":"medium"},{"q":"Passage: Standardized testing was justified by the need for objective measures. Yet critics argue these tests measure a narrow band of skills, create incentives to 'teach to the test,' and systematically disadvantage lower-income students who lack access to test preparation resources.\\n\\nThe main idea is","o":["Test preparation resources give wealthier students an unfair advantage","Despite their stated purpose of objective measurement, standardized tests have several significant shortcomings","Standardized testing was introduced to American schools in the 1980s","Academic performance has declined since the adoption of standardized testing"],"a":1,"e":"The passage presents the purpose AND multiple criticisms. B captures this full structure. A is background only. C is one specific criticism. D is not stated.","d":"medium"}]},{"id":"s3","title":"Reading set: Author's craft","text":"Each task below contains its own short passage. Read it closely, then answer — this trains exactly the kind of reading you will meet in real academic texts and exams.\\n\\nQuyida har bir topshiriqning o'z qisqa matni bor. Diqqat bilan o'qing, so'ng javob bering.","quiz":[{"q":"Text: 'The architect's early sketches were rough and provisional, but they captured the essential character of the building she would eventually construct.'\\n\\nAs used in the text, 'provisional' most nearly means","o":["provided as a benefit","temporary and subject to change","carefully detailed","legally authorized"],"a":1,"e":"The sketches are 'rough' and not final — they are preliminary. 'Provisional' = temporary, not yet final. 'Legally authorized' and 'provided as a benefit' are other senses of 'provision.'","d":"medium"},{"q":"Text: 'Anthropologists studying the remote community found that its social structures were remarkably resilient, having persisted through centuries of external disruption and internal conflict.'\\n\\nAs used in the text, 'resilient' most nearly means","o":["elastic in shape","financially stable over long periods","resistant to all forms of change","able to withstand and recover from difficulties"],"a":3,"e":"The structures 'persisted through' disruption — they survived and endured. 'Resilient' = able to withstand and recover. 'Elastic' is a physical sense. 'Resistant to all change' is too absolute.","d":"medium"},{"q":"Text: 'Though the two theories appear superficially similar, closer examination reveals they rest on fundamentally incompatible assumptions about the nature of consciousness.'\\n\\nAs used in the text, 'incompatible' most nearly means","o":["unable to coexist or be reconciled","difficult to understand","originating from different traditions","not yet proven by evidence"],"a":0,"e":"The assumptions 'cannot coexist' — they can't both be right simultaneously. 'Incompatible' = unable to be reconciled. 'Difficult to understand' changes the meaning entirely.","d":"medium"},{"q":"Text: 'The documentary draws on extensive archival footage to illuminate aspects of the artist's life that were previously unknown.'\\n\\nAs used in the text, 'illuminate' most nearly means","o":["light up physically","make more understandable","create through imagination","criticize harshly"],"a":1,"e":"The footage 'sheds light on' previously unknown aspects — makes them clear and understandable. The physical lighting sense doesn't apply here.","d":"medium"}]}],"listening":[{"id":"l1","title":"A University Lecture","script":"Good morning, everyone. Today we're looking at the psychology of decision-making. Now, we like to think we make choices logically, weighing up the facts. But research suggests otherwise. In fact, most of our decisions are driven by emotion and by mental shortcuts the brain uses to save effort. These shortcuts are usually helpful, but they can lead to predictable mistakes. For example, people tend to fear losing something far more than they value gaining the same thing. This is called loss aversion, and we'll explore it in detail after the break. For now, I'd like you to read chapter four before next week's seminar.","quiz":[{"q":"What is the lecture about?","o":["the history of war","the psychology of decision-making","learning languages","economics of trade"],"a":1,"e":"It is about the psychology of decision-making.","d":"medium"},{"q":"What does research suggest about our decisions?","o":["They are purely logical.","They are driven by emotion and mental shortcuts.","They are always wrong.","They take a long time."],"a":1,"e":"Most decisions are driven by emotion and shortcuts.","d":"medium"},{"q":"What are the mental shortcuts usually like?","o":["always harmful","usually helpful but sometimes lead to mistakes","never used","very slow"],"a":1,"e":"Usually helpful, but can cause predictable mistakes.","d":"medium"},{"q":"What is 'loss aversion'?","o":["loving to win","fearing loss more than valuing an equal gain","forgetting facts","avoiding decisions"],"a":1,"e":"Fearing loss more than valuing the same gain.","d":"medium"},{"q":"What must students do before the seminar?","o":["write an essay","read chapter four","take a test","give a talk"],"a":1,"e":"Read chapter four before next week's seminar.","d":"medium"}]},{"id":"l2","title":"A Job Interview","script":"So, thank you for coming in. Could you tell me why you applied for this marketing role? Of course. I've followed your company for years, and I really admire your creative campaigns. I felt my experience would be a good fit. Tell me about a challenge you've faced. In my last job, we lost a major client unexpectedly. Rather than panic, I led a small team to win back three smaller clients within a month. That's impressive. And where do you see yourself in five years? Honestly, I'd like to be managing my own team here, helping to develop the kind of campaigns that first attracted me to you. Excellent. We'll be in touch by the end of the week.","quiz":[{"q":"What role is the candidate applying for?","o":["accounting","marketing","teaching","engineering"],"a":1,"e":"It is a marketing role.","d":"medium"},{"q":"Why did she apply?","o":["for the salary","she admires the company's creative campaigns","it was near her home","a friend told her to"],"a":1,"e":"She admires their creative campaigns and felt it fit.","d":"medium"},{"q":"What challenge did she describe?","o":["losing her job","losing a major client and winning back smaller ones","missing a deadline","a computer failure"],"a":1,"e":"Losing a major client, then winning back three smaller ones.","d":"medium"},{"q":"Where does she see herself in five years?","o":["in another company","managing her own team there","retired","studying"],"a":1,"e":"Managing her own team at the company.","d":"medium"},{"q":"When will she hear back?","o":["tomorrow","by the end of the week","next month","never"],"a":1,"e":"By the end of the week.","d":"medium"}]},{"id":"l3","title":"A Discussion on Social Media","script":"Welcome back. Today we're debating whether social media does more harm than good. Sarah, you start. Well, I think the benefits are huge. It keeps families connected across the world and gives a voice to people who would otherwise be ignored. But James, you disagree? I do. I'm not denying the benefits, but we can't ignore the harm. Studies link heavy use to anxiety, especially among teenagers. People compare their real lives to others' perfect online images, and they feel worse. Sarah, a response? I'd say the problem isn't the technology itself, but how we use it. With better education, we could enjoy the good and avoid the worst. That's a fair point. We'll take some calls after this.","quiz":[{"q":"What is the debate about?","o":["whether to ban phones","whether social media does more harm than good","how to make money online","which app is best"],"a":1,"e":"Whether social media does more harm than good.","d":"medium"},{"q":"What benefit does Sarah mention?","o":["it makes money","it keeps families connected and gives a voice","it is free","it is fast"],"a":1,"e":"It connects families and gives people a voice.","d":"medium"},{"q":"What harm does James describe?","o":["it costs too much","a link to anxiety, especially in teenagers","it is too slow","it wastes paper"],"a":1,"e":"Heavy use is linked to anxiety in teenagers.","d":"medium"},{"q":"Why do people feel worse, according to James?","o":["they read too much news","they compare their lives to others' perfect images","they lose money","they get tired"],"a":1,"e":"They compare real lives to perfect online images.","d":"medium"},{"q":"What is Sarah's final point?","o":["Social media should be banned.","The problem is how we use it, not the technology.","Teenagers should not use phones.","Education does not help."],"a":1,"e":"The problem is how we use it; education could help.","d":"medium"}]},{"id":"l4","title":"A Climate News Report","script":"In environmental news, a major report published today warns that global temperatures are rising faster than previously expected. Scientists say that without urgent action, many coastal cities could face serious flooding within decades. However, the report is not entirely negative. It notes that the cost of renewable energy, such as solar and wind power, has fallen dramatically, making clean energy cheaper than coal in much of the world. The authors argue that the technology to solve the crisis already exists; what is missing is political will. A global summit will be held in Leeds next month, where world leaders will be under pressure to agree on stronger targets. Critics, however, fear that promises will once again be broken.","quiz":[{"q":"What does the new report warn about?","o":["falling temperatures","temperatures rising faster than expected","less rain","more snow"],"a":1,"e":"Global temperatures are rising faster than expected.","d":"medium"},{"q":"What could happen to coastal cities?","o":["nothing","serious flooding within decades","more tourists","colder weather"],"a":1,"e":"They could face serious flooding within decades.","d":"medium"},{"q":"What positive point does the report make?","o":["coal is cheaper","renewable energy has become much cheaper","the crisis is over","temperatures are falling"],"a":1,"e":"Renewable energy costs have fallen dramatically.","d":"medium"},{"q":"According to the authors, what is missing?","o":["technology","political will","money","scientists"],"a":1,"e":"The technology exists; political will is missing.","d":"medium"},{"q":"What do critics fear about the summit?","o":["it will be cancelled","promises will be broken again","it
