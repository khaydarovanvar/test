:"He felt lonely abroad."},{"w":"polite","pos":"adj","ipa":"/pəˈlaɪt/","uz":"odobli","ru":"вежливый","def":"","ex":"Always be polite to guests."},{"w":"honest","pos":"adj","ipa":"/ˈɒnɪst/","uz":"halol","ru":"честный","def":"","ex":"She is an honest person."},{"w":"jealous","pos":"adj","ipa":"/ˈdʒeləs/","uz":"rashkchi","ru":"ревнивый","def":"","ex":"He felt jealous of his brother."},{"w":"generous","pos":"adj","ipa":"/ˈdʒenərəs/","uz":"saxiy","ru":"щедрый","def":"","ex":"She is very generous."},{"w":"selfish","pos":"adj","ipa":"/ˈselfɪʃ/","uz":"xudbin","ru":"эгоистичный","def":"","ex":"Don't be selfish."},{"w":"patient","pos":"adj","ipa":"/ˈpeɪʃnt/","uz":"sabrli","ru":"терпеливый","def":"","ex":"A good teacher is patient."},{"w":"cheerful","pos":"adj","ipa":"/ˈtʃɪəfl/","uz":"quvnoq","ru":"весёлый","def":"","ex":"He is always cheerful."},{"w":"brave","pos":"adj","ipa":"/breɪv/","uz":"jasur","ru":"храбрый","def":"","ex":"The brave girl helped them."},{"w":"rude","pos":"adj","ipa":"/ruːd/","uz":"qopol","ru":"грубый","def":"","ex":"It's rude to interrupt."},{"w":"marry","pos":"v","ipa":"/ˈmæri/","uz":"turmush qurmoq","ru":"жениться","def":"","ex":"They will marry in June."},{"w":"divorce","pos":"n","ipa":"/dɪˈvɔːs/","uz":"ajrashish","ru":"развод","def":"","ex":"They got a divorce."},{"w":"support","pos":"v","ipa":"/səˈpɔːt/","uz":"qollab-quvvatlamoq","ru":"поддерживать","def":"","ex":"My family supports me."},{"w":"get on","pos":"phr","ipa":"/ɡet ɒn/","uz":"chiqishmoq","ru":"ладить","def":"","ex":"I get on well with my sister."}]}],"reading":[{"id":"r1","title":"A Trip to London","text":"Last summer, Daniel and his sister Olivia travelled to London for the first time. They took an early train from Manchester and arrived at about ten o'clock.\\nFirst, they visited the British Museum, which was free and very interesting. After that, they had lunch in a small café near the river. In the afternoon, they went on a boat trip and saw many famous buildings.\\nThe weather was warm and sunny all day. In the evening, they were tired but happy. They bought some souvenirs and took lots of photos before they caught the last train home.","quiz":[{"q":"Where did Daniel and Olivia travel from?","o":["London","Manchester","Oxford","Leeds"],"a":1,"e":"They took a train from Manchester.","d":"medium"},{"q":"What did they visit first?","o":["a café","the British Museum","a boat","a shop"],"a":1,"e":"First they visited the British Museum.","d":"medium"},{"q":"How much did the museum cost?","o":["It was free.","Ten pounds.","Five pounds.","The text doesn't say."],"a":0,"e":"The museum was free.","d":"medium"},{"q":"What did they do in the afternoon?","o":["had lunch","went on a boat trip","caught a train","visited a museum"],"a":1,"e":"In the afternoon they went on a boat trip.","d":"medium"},{"q":"How did they feel in the evening?","o":["bored","angry","tired but happy","cold"],"a":2,"e":"They were tired but happy.","d":"medium"}]},{"id":"r2","title":"My First Job","text":"My name is Sophie and I'm nineteen. Last year, I got my first job in a small bookshop in Bristol. At first, I was nervous because I didn't have any experience.\\nMy manager, Mr Clarke, was very kind and patient. He showed me how to use the till and how to help customers find books. The other staff were friendly too, so I soon felt comfortable.\\nI worked part-time, three days a week, and the salary wasn't very high. But I learned a lot, and I really enjoyed talking to customers about books. Now I want to study literature at university.","quiz":[{"q":"Where does Sophie work?","o":["a café","a bookshop","a library","a hotel"],"a":1,"e":"She works in a bookshop in Bristol.","d":"medium"},{"q":"How did she feel at first?","o":["bored","angry","nervous","tired"],"a":2,"e":"She was nervous because she had no experience.","d":"medium"},{"q":"What is her manager like?","o":["unkind","kind and patient","lazy","strict"],"a":1,"e":"Mr Clarke was kind and patient.","d":"medium"},{"q":"How often does she work?","o":["every day","three days a week","at weekends only","once a month"],"a":1,"e":"She works part-time, three days a week.","d":"medium"},{"q":"What does Sophie want to do next?","o":["change jobs","study literature at university","open a shop","become a manager"],"a":1,"e":"She wants to study literature at university.","d":"medium"}]},{"id":"r3","title":"An Email about a Holiday","text":"Hi Grace,\\n\\nHow are you? I'm writing from a small hotel in Brighton, where I've been since Monday. I'm having a wonderful time!\\n\\nI've already done so many things. I've walked along the beach, eaten fresh fish, and visited the famous pier. Yesterday I went swimming in the sea, although the water was quite cold. I haven't been shopping yet, but I'm planning to go tomorrow.\\n\\nThe weather has been mostly sunny, but it rained a little this morning. The people here are very friendly, and the food is delicious.\\n\\nI'll be home on Saturday. Let's meet next week — I'll show you my photos!\\n\\nLove,\\nJack","quiz":[{"q":"Where is Jack staying?","o":["a hotel in Brighton","a flat in London","a friend's house","a campsite"],"a":0,"e":"He's in a small hotel in Brighton.","d":"medium"},{"q":"What has Jack NOT done yet?","o":["walk on the beach","eat fish","go shopping","visit the pier"],"a":2,"e":"He hasn't been shopping yet.","d":"medium"},{"q":"How was the sea when he went swimming?","o":["warm","quite cold","dirty","dangerous"],"a":1,"e":"The water was quite cold.","d":"medium"},{"q":"What was the weather like this morning?","o":["snowy","it rained a little","very hot","windy"],"a":1,"e":"It rained a little this morning.","d":"medium"},{"q":"When will Jack go home?","o":["Monday","Wednesday","Saturday","next week"],"a":2,"e":"He'll be home on Saturday.","d":"medium"}]},{"id":"r4","title":"Town or City?","text":"Many people argue about whether it is better to live in a big city or a small town. Both have advantages and disadvantages.\\nBig cities, like London or Birmingham, are more exciting. There are more jobs, better shops, and lots of things to do in the evening. However, cities are usually more expensive and more crowded, and the air is often more polluted.\\nSmall towns are quieter and cheaper. People are often friendlier and know their neighbours. On the other hand, there are fewer jobs, and young people sometimes find life a little boring.\\nIn my opinion, the best choice depends on your age and your needs. When I was younger, I loved the city, but now I prefer the peace of a small town.","quiz":[{"q":"What is one advantage of big cities?","o":["cheaper houses","more jobs and things to do","cleaner air","friendlier neighbours"],"a":1,"e":"Cities have more jobs and things to do.","d":"medium"},{"q":"What is one disadvantage of big cities?","o":["too quiet","more expensive and crowded","no shops","no jobs"],"a":1,"e":"Cities are more expensive and crowded.","d":"medium"},{"q":"According to the text, people in small towns are often ___.","o":["richer","friendlier","busier","ruder"],"a":1,"e":"People in small towns are often friendlier.","d":"medium"},{"q":"Why might young people find small towns boring?","o":["too many people","there are fewer jobs and things to do","the air is polluted","houses are expensive"],"a":1,"e":"There are fewer jobs and less to do.","d":"medium"},{"q":"What does the writer prefer now?","o":["a big city","the peace of a small town","living abroad","the writer doesn't say"],"a":1,"e":"Now the writer prefers the peace of a small town.","d":"medium"}]},{"id":"r5","title":"The Lost Phone","text":"It was a cold Friday evening, and Emily was hurrying home from work. While she was waiting at the bus stop, she took out her phone to check the time. The bus arrived, and in the rush to get on, she didn't notice that her phone had fallen onto the seat next to her.\\nWhen she got home, she realised her phone was missing. She felt terrible — all her photos and messages were on it. She borrowed her flatmate's phone and called her own number, but nobody answered.\\nThe next morning, however, she received an email. A kind passenger named Harry had found the phone and seen her details on the screen. They arranged to meet at a café in the city centre, and Harry returned the phone. Emily was so grateful that she bought him a coffee. Now they are good friends.","quiz":[{"q":"What was Emily doing when she lost her phone?","o":["sleeping","hurrying home from work","shopping","working in an office"],"a":1,"e":"She was hurrying home from work.","d":"medium"},{"q":"How did she lose the phone?","o":["She dropped it in the street.","It fell onto the bus seat in the rush.","Someone stole it.","She left it at the office."],"a":1,"e":"It fell onto the seat as she rushed onto the bus.","d":"medium"},{"q":"Why did she feel terrible?","o":["She missed the bus.","All her photos and messages were on the phone.","She had no money.","She was late for work."],"a":1,"e":"Her photos and messages were on the phone.","d":"medium"},{"q":"How did Harry contact her?","o":["He phoned her.","He sent an email after seeing her details.","He visited her flat.","He wrote a letter."],"a":1,"e":"He emailed her after seeing her details on the screen.","d":"medium"},{"q":"What happened in the end?","o":["She never found the phone.","Harry kept the phone.","Harry returned the phone and they became friends.","She bought a new phone."],"a":2,"e":"Harry returned it and now they are good friends.","d":"medium"}]}],"listening":[{"id":"l1","title":"A Job Interview","script":"Good morning. Please sit down. So, your name is Lucy, isn't it? Yes, that's right. And why do you want to work here? Well, I love books, and I have two years of experience in a shop in Leeds. That's great. The job is part-time, four days a week. The salary is twelve pounds an hour. Can you start next Monday? Yes, of course. Thank you very much.","quiz":[{"q":"What is the woman's name?","o":["Grace","Lucy","Emily","Sophie"],"a":1,"e":"The interviewer confirms her name is Lucy.","d":"medium"},{"q":"How much experience does she have?","o":["one year","two years","four years","no experience"],"a":1,"e":"She has two years of experience.","d":"medium"},{"q":"In which city did she work before?","o":["London","Leeds","Brighton","Bristol"],"a":1,"e":"She worked in a shop in Leeds.","d":"medium"},{"q":"How many days a week is the job?","o":["two","three","four","five"],"a":2,"e":"The job is part-time, four days a week.","d":"medium"},{"q":"When can she start?","o":["today","next Monday","next month","she can't start"],"a":1,"e":"She can start next Monday.","d":"medium"}]},{"id":"l2","title":"Booking a Hotel","script":"Good afternoon, Riverside Hotel. How can I help you? Hello, I'd like to book a room for two nights, please. Certainly. For how many people? For two adults. We have a double room for ninety pounds a night, including breakfast. That sounds good. I'll take it. Can I have your name, please? Yes, it's Tom Harris. Thank you, Mr Harris. We look forward to seeing you on Friday.","quiz":[{"q":"How many nights does the man want to book?","o":["one","two","three","four"],"a":1,"e":"He wants a room for two nights.","d":"medium"},{"q":"How many people is the room for?","o":["one adult","two adults","a family","three people"],"a":1,"e":"It's for two adults.","d":"medium"},{"q":"How much is the room per night?","o":["ninety pounds","nineteen pounds","nine pounds","fifty pounds"],"a":0,"e":"The double room is ninety pounds a night.","d":"medium"},{"q":"What is included in the price?","o":["dinner","breakfast","parking","a tour"],"a":1,"e":"The price includes breakfast.","d":"medium"},{"q":"When will the man arrive?","o":["Thursday","Friday","Saturday","Sunday"],"a":1,"e":"They look forward to seeing him on Friday.","d":"medium"}]},{"id":"l3","title":"Weekend Plans","script":"Hi Olivia, what are you going to do this weekend? Hi Daniel. On Saturday I'm going to visit my grandmother in Oxford. Then on Sunday, if the weather is nice, I'm going to go cycling with some friends. That sounds fun. Would you like to join us on Sunday? I'd love to, but I have to study for my exam on Monday. Oh, that's a shame. Maybe next time. Yes, definitely. Good luck with your exam!","quiz":[{"q":"What is Olivia going to do on Saturday?","o":["go cycling","visit her grandmother","study","stay at home"],"a":1,"e":"On Saturday she's visiting her grandmother in Oxford.","d":"medium"},{"q":"Where does her grandmother live?","o":["London","Oxford","Brighton","Leeds"],"a":1,"e":"Her grandmother lives in Oxford.","d":"medium"},{"q":"What will decide if she goes cycling?","o":["her exam","the weather","her friends","her grandmother"],"a":1,"e":"She'll go cycling if the weather is nice.","d":"medium"},{"q":"Why can't Daniel go cycling on Sunday?","o":["He's busy at work.","He has to study for an exam.","He doesn't have a bike.","He's visiting family."],"a":1,"e":"He has to study for his exam on Monday.","d":"medium"},{"q":"When is Daniel's exam?","o":["Saturday","Sunday","Monday","Friday"],"a":2,"e":"His exam is on Monday.","d":"medium"}]},{"id":"l4","title":"A Travel Announcement","script":"Good morning, passengers. This is an announcement for the ten-thirty train to London. We are sorry to say that this train is delayed by about twenty minutes because of bad weather. The train will now leave from platform four, not platform two. Passengers travelling to Brighton should change at Gatwick. The café on platform one is open if you would like a hot drink while you wait. Thank you for your patience.","quiz":[{"q":"Where is the train going?","o":["Brighton","London","Oxford","Gatwick"],"a":1,"e":"It's the ten-thirty train to London.","d":"medium"},{"q":"Why is the train delayed?","o":["an accident","bad weather","too many passengers","a broken engine"],"a":1,"e":"It's delayed because of bad weather.","d":"medium"},{"q":"How long is the delay?","o":["ten minutes","about twenty minutes","an hour","two minutes"],"a":1,"e":"The delay is about twenty minutes.","d":"medium"},{"q":"Which platform will the train leave from now?","o":["platform one","platform two","platform four","platform ten"],"a":2,"e":"It will now leave from platform four.","d":"medium"},{"q":"Where should passengers to Brighton change?","o":["London","Gatwick","Oxford","platform one"],"a":1,"e":"They should change at Gatwick.","d":"medium"}]}],"speaking":[{"id":"s1","title":"Last weekend","prompt":"Talk about what you did last weekend.","seconds":60,"tips":["Use past simple: went, saw, played…","First…, then…, after that…"]},{"id":"s2","title":"My town","prompt":"Describe your town or city. What can visitors do there?","seconds":60,"tips":["There is / there are…","You can visit…","The best place is…"]},{"id":"s3","title":"Future plans","prompt":"What are you going to do next summer?","seconds":60,"tips":["I'm going to…","I want to…","Maybe I will…"]},{"id":"s4","title":"Shopping","prompt":"Describe the last thing you bought and why.","seconds":60,"tips":["I bought…","It cost…","I chose it because…"]},{"id":"s5","title":"Comparing","prompt":"Compare two places you know: which is better and why?","seconds":60,"tips":["… is bigger than…","… is more interesting…","I prefer… because…"]},{"id":"s6","title":"Giving directions","prompt":"Explain how to get from your home to the nearest shop.","seconds":60,"tips":["Go straight…","Turn left / right…","It's next to…"]}],"writing":[{"id":"w1","title":"Last holiday","prompt":"Write 60–80 words about your last holiday. Use the past simple.","min":60,"max":90,"hints":["Last summer I went to…","We visited…","The best part was…"]},{"id":"w2","title":"An invitation","prompt":"Write an email inviting a friend to your birthday (60–80 words).","min":60,"max":90,"hints":["Would you like to…?","It starts at…","Let me know if…"]},{"id":"w3","title":"My favourite place","prompt":"Write 80–100 words about your favourite place.","min":80,"max":110,"hints":["It is located…","I go there when…","It makes me feel…"]},{"id":"w4","title":"Daily routine","prompt":"Describe your daily routine in 60–80 words with time expressions.","min":60,"max":90,"hints":["I usually…","After that…","In the evening…"]}]}},{"id":"B1","name":"Intermediate","tagline":"Communicate independently","weeks":12,"skills":{"grammar":[{"id":"g1","title":"Present perfect continuous","lead":"The present perfect continuous links the past to the present and emphasises the duration or repetition of an activity, especially one that is still going on or has only just stopped.","leadTr":null,"situation":"“You look exhausted!” “Yes, I ’ve been working in the garden all day.” — The present perfect continuous focuses on an activity that has been going on and explains a present result.","blocks":[{"h":"Form: have/has been + -ing","p":["Use have/has been + verb-ing. It focuses on the activity itself rather than the finished result."],"ex":["I have been working all day. · She has been studying since nine."]},{"h":"for & since","p":["Use for + a period and since + a starting point to show how long the activity has lasted."],"ex":["We’ve been waiting for two hours. · He’s been living here since 2019."]},{"h":"Continuous vs. simple","p":["The continuous stresses how long / how active; the simple stresses the completed result."],"ex":["I’ve been reading this book. (still reading) · I’ve read this book. (finished)"]},{"h":"Recent activity with a result","p":["It can explain a present situation caused by a recent activity."],"ex":["You look tired. — Yes, I’ve been running."]}],"tip":"Don’t use the continuous with state verbs (know, like, be, have = possess): say ‘I have known her for years’, not ‘I have been knowing’.","examples":["\\"I ’ve been learning English for five years.\\"","\\"It has been raining all morning.\\"","\\"They ’ve been working on the project since Monday.\\"","\\"Why are you so dirty? — I ’ve been gardening.\\"","\\"She ’s been feeling ill recently.\\"","\\"We ’ve been waiting for ages.\\""],"mistakes":[{"x":"I have been knowing her for years.","v":"I have known her for years. (state verb → simple)"},{"x":"I am working here since May.","v":"I ’ve been working here since May."}],"quiz":[{"q":"I ___ for two hours and I'm still not finished.","o":["have worked","have been working","work","am working"],"a":1,"e":"Ongoing activity + duration → have been working.","d":"easy"},{"q":"She ___ since this morning.","o":["has studied","has been studying","studies","studied"],"a":1,"e":"Still going → has been studying.","d":"easy"},{"q":"How long ___ you ___ here?","o":["have / lived","have / been living","do / live","are / living"],"a":1,"e":"Duration of an ongoing situation → have you been living.","d":"easy"},{"q":"It ___ all day; the streets are wet.","o":["has rained","has been raining","rains","is raining"],"a":1,"e":"Activity with present result → has been raining.","d":"easy"},{"q":"They ___ football for an hour.","o":["have been playing","have played","play","are play"],"a":0,"e":"Duration of activity → have been playing.","d":"easy"},{"q":"Choose the duration form: 'We ___ for ages.'","o":["have waited","have been waiting","wait","waited"],"a":1,"e":"Emphasis on how long → have been waiting.","d":"med"},{"q":"You're out of breath. What ___ you ___?","o":["have / done","have / been doing","did / do","are / doing"],"a":1,"e":"Recent activity explaining a state → have you been doing.","d":"med"},{"q":"He ___ here since 2018.","o":["has been living","has lived","lives","lived"],"a":0,"e":"Both are possible, but with ‘since’ + ongoing the continuous is natural: has been living.","d":"med"},{"q":"Which verb is wrong in the continuous?","o":["working","studying","knowing","running"],"a":2,"e":"‘know’ is a state verb → not used in the continuous.","d":"med"},{"q":"Complete: 'My eyes hurt because I ___ at the screen.'","o":["have stared","have been staring","stare","stared"],"a":1,"e":"Recent ongoing activity → have been staring.","d":"med"},{"q":"Find the mistake: 'I have been knowing him for years.'","o":["been knowing → known","have → has","for → since","no mistake"],"a":0,"e":"State verb: I have known him for years.","d":"hard"},{"q":"Complete: 'She ___ all morning, so the cake is ready.'","o":["has been baking","has baked","baked","bakes"],"a":0,"e":"Activity over a period explaining a result → has been baking.","d":"hard"},{"q":"Which sentence stresses the finished result?","o":["I've been writing three emails.","I've written three emails.","I'm writing three emails.","I write three emails."],"a":1,"e":"Completed result with a number → present perfect simple: I’ve written three emails.","d":"hard"},{"q":"Complete: 'They ___ in this town ___ ten years and they love it.'","o":["have been living / since","have been living / for","have lived / since","are living / for"],"a":1,"e":"Ongoing + period → have been living for ten years.","d":"hard"},{"q":"Choose the natural sentence.","o":["How long have you been waiting?","How long do you wait?","How long are you waiting?","How long have you waited continuously?"],"a":0,"e":"Duration of an ongoing wait → have you been waiting.","d":"hard"}]},{"id":"g2","title":"Past perfect","lead":"The past perfect shows that one past action happened before another past action. It helps to make the order of events in a story clear.","leadTr":null,"situation":"“When I got to the station, the train had already left.” — The past perfect shows the train left before I arrived. It puts two past events in order.","blocks":[{"h":"Form: had + past participle","p":["Use had + past participle for the earlier of two past actions."],"ex":["When I arrived, the train had already left."]},{"h":"With past simple","p":["Often used with the past simple: the past perfect = the earlier action; the past simple = the later one."],"ex":["She had finished dinner before he came home."]},{"h":"after, before, when, by the time","p":["Common with these time linkers to show sequence."],"ex":["By the time we got there, the film had started."]},{"h":"Negatives & questions","p":["Negative: hadn’t + past participle. Question: Had + subject + past participle?"],"ex":["I hadn’t seen her before. · Had you eaten when they called?"]}],"tip":"Use the past perfect only when you need to show one past event happened before another. For a simple sequence (first… then…), the past simple alone is enough.","examples":["\\"When we arrived, the party had already started.\\"","\\"She had never flown before that day.\\"","\\"They had finished the work before the boss returned.\\"","\\"By the time I woke up, he had left.\\"","\\"I knew I had met him somewhere.\\"","\\"Had you booked the room before you arrived?\\""],"mistakes":[{"x":"After I had ate, I went out.","v":"After I had eaten, I went out. (past participle)"},{"x":"When I arrived, the film already started.","v":"…the film had already started."}],"quiz":[{"q":"When I arrived, the train ___.","o":["already left","had already left","has already left","leaves"],"a":1,"e":"Earlier past action → had already left.","d":"easy"},{"q":"She ___ dinner before he came home.","o":["finished","had finished","has finished","finishes"],"a":1,"e":"Earlier action → had finished.","d":"easy"},{"q":"The past perfect of 'see' is ___.","o":["had saw","had seen","has seen","saw"],"a":1,"e":"had + past participle: had seen.","d":"easy"},{"q":"By the time we got there, the film ___.","o":["started","had started","starts","has started"],"a":1,"e":"Earlier action → had started.","d":"easy"},{"q":"They ___ never ___ sushi before that trip.","o":["had / eaten","have / eaten","did / eat","had / ate"],"a":0,"e":"had + past participle: had eaten.","d":"easy"},{"q":"I recognised her because I ___ her before.","o":["met","had met","have met","meet"],"a":1,"e":"Earlier action → had met.","d":"med"},{"q":"After he ___ the letter, he posted it.","o":["wrote","had written","has written","writes"],"a":1,"e":"First action → had written.","d":"med"},{"q":"We were late; the meeting ___ already ___.","o":["had / begun","have / begun","did / begin","had / began"],"a":0,"e":"had + past participle: had begun.","d":"med"},{"q":"___ you ever ___ abroad before that holiday?","o":["Have / been","Had / been","Did / be","Had / be"],"a":1,"e":"Past perfect question: Had you been?","d":"med"},{"q":"Choose the earlier action: 'When I phoned, she ___.'","o":["went out","had gone out","goes out","has gone out"],"a":1,"e":"Before the phone call → had gone out.","d":"med"},{"q":"Find the mistake: 'After I had ate, I went out.'","o":["had ate → had eaten","went → had gone","After → Before","no mistake"],"a":0,"e":"Past participle of eat is eaten: had eaten.","d":"hard"},{"q":"Complete: 'By the time the police arrived, the thief ___.'","o":["escaped","had escaped","has escaped","escapes"],"a":1,"e":"Earlier action → had escaped.","d":"hard"},{"q":"Which order is correct?","o":["He had left before I arrived.","He left before I had arrived.","He had left before I had arrived.","He leaves before I arrive."],"a":0,"e":"Earlier action ‘had left’ + later ‘arrived’.","d":"hard"},{"q":"Complete: 'I didn't recognise the town because it ___ so much.'","o":["changed","had changed","has changed","changes"],"a":1,"e":"Change happened before → had changed.","d":"hard"},{"q":"Choose the natural sentence.","o":["When the guests arrived, she had cooked dinner.","When the guests arrived, she has cooked dinner.","When the guests arrived, she cooks dinner.","When the guests had arrived, she has cooked."],"a":0,"e":"Dinner cooked before guests arrived → had cooked.","d":"hard"}]},{"id":"g3","title":"Future forms","lead":"English uses several forms to talk about the future. Choosing the right one depends on whether you mean a prediction, a plan, an arrangement, a timetable or an instant decision.","leadTr":null,"situation":"","blocks":[{"h":"will & be going to","p":["will = predictions, instant decisions, offers, promises. be going to = plans/intentions and predictions from evidence."],"ex":["It will snow tonight. · We’re going to paint the house."]},{"h":"Present continuous (arrangements)","p":["Use the present continuous for fixed arrangements, usually with a time and another person."],"ex":["I’m meeting Sara at six. · They’re flying to Rome on Friday."]},{"h":"Present simple (timetables)","p":["Use the present simple for timetabled events (transport, programmes, schedules)."],"ex":["The train leaves at 9:15. · The film starts at eight."]},{"h":"may / might (possibility)","p":["Use may/might for things that are possible but not certain."],"ex":["It might rain later. · I may go to the party."]}],"tip":"For a plan use ‘going to’; for an arrangement with a time use the present continuous; for a timetable use the present simple; for an instant decision use ‘will’.","examples":["\\"Look at the clouds — it ’s going to rain.\\"","\\"I think she ’ll pass the exam.\\"","\\"We ’re having dinner with friends tonight.\\"","\\"The bus leaves at half past seven.\\"","\\"I might visit my cousin at the weekend.\\"","\\"Don’t worry, I ’ll carry that for you.\\""],"mistakes":[{"x":"The plane will arrive at 6 — it’s the timetable.","v":"The plane arrives at 6. (timetable → present simple)"},{"x":"I think I’m passing the exam.","v":"I think I’ll pass. (prediction → will)"}],"quiz":[{"q":"Look at that car! It ___ crash.","o":["will","is going to","might to","goes to"],"a":1,"e":"Prediction from evidence → is going to crash.","d":"easy"},{"q":"The train ___ at 10:30.","o":["will leave","is leaving","leaves","is going to leave"],"a":2,"e":"Timetable → present simple: leaves.","d":"easy"},{"q":"I ___ Tom for coffee at four. (arrangement)","o":["will meet","am meeting","meet","might meet"],"a":1,"e":"Fixed arrangement → present continuous.","d":"easy"},{"q":"(phone rings) I ___ get it.","o":["am going to","will","am getting","might"],"a":1,"e":"Instant decision → will.","d":"easy"},{"q":"It ___ rain later, but I'm not sure.","o":["will","might","is going to","does"],"a":1,"e":"Possibility → might.","d":"easy"},{"q":"We ___ visit Spain next summer. (plan)","o":["will","are going to","are visiting now","might to"],"a":1,"e":"Plan → are going to visit.","d":"med"},{"q":"The match ___ at 8 pm tonight.","o":["will start","starts","is starting now","is going to start"],"a":1,"e":"Scheduled → present simple: starts.","d":"med"},{"q":"She ___ to the dentist tomorrow at nine. (arrangement)","o":["will go","is going","goes","might go"],"a":1,"e":"Arrangement with time → present continuous.","d":"med"},{"q":"I'm cold. — I ___ close the window.","o":["am going to","will","close","might"],"a":1,"e":"Offer/instant decision → will.","d":"med"},{"q":"Choose the evidence-based prediction.","o":["She will have a baby — look!","She's going to have a baby — look!","She has a baby soon.","She might to have a baby."],"a":1,"e":"Evidence now → is going to.","d":"med"},{"q":"Find the mistake: 'The plane will arrive at 6, it's the timetable.'","o":["will arrive → arrives","6 → six","plane → flight","no mistake"],"a":0,"e":"Timetable → present simple: arrives.","d":"hard"},{"q":"Complete: 'We ___ (plan) move house, and I think it ___ (prediction) be stressful.'","o":["will / are going to","are going to / will","are going to / are going to","will / will"],"a":1,"e":"Plan → going to; prediction → will.","d":"hard"},{"q":"Which shows a possibility?","o":["I'm definitely going.","I might go.","I'm going at six.","The bus goes at six."],"a":1,"e":"Uncertain future → might go.","d":"hard"},{"q":"Complete: 'Hurry! The film ___ at eight and we ___ Jack there.'","o":["will start / will meet","starts / are meeting","is starting / meet","starts / will meet"],"a":1,"e":"Timetable ‘starts’ + arrangement ‘are meeting’.","d":"hard"},{"q":"Choose the natural arrangement sentence.","o":["I have dinner with them tonight.","I'm having dinner with them tonight.","I will have dinner with them, it's arranged.","I might have dinner tonight, it's arranged."],"a":1,"e":"Fixed arrangement → present continuous.","d":"hard"}]},{"id":"g4","title":"Second conditional","lead":"The second conditional talks about imaginary, unlikely or unreal present and future situations. It uses the past simple in the if-clause and ‘would’ in the result clause.","leadTr":null,"situation":"“If I won the lottery, I ’d travel the world.” — The situation is imaginary and unlikely, so we use the past simple + would, not present + will.","blocks":[{"h":"Form: if + past simple, would + base","p":["The past tense here doesn’t mean past time — it shows the situation is hypothetical."],"ex":["If I had more money, I would travel."]},{"h":"were for all persons","p":["With ‘be’, we often use were for all persons, especially in advice with ‘If I were you’."],"ex":["If I were you, I’d apologise. · If she were here, she’d help."]},{"h":"would / could / might","p":["Use could (ability/possibility) or might (possible result) instead of ‘would’."],"ex":["If I had a car, I could drive you. · We might win if we tried."]},{"h":"first vs. second","p":["First conditional = real/likely; second conditional = unlikely/unreal."],"ex":["If it rains, I’ll stay in. (likely) · If it snowed in July, I’d be shocked. (unreal)"]}],"tip":"For advice, ‘If I were you, I’d…’ is the natural phrase. Don’t mix forms: ‘If I would have money’ is wrong → ‘If I had money, I would…’.","examples":["\\"If I won the lottery, I would buy a house.\\"","\\"If I were you, I ’d see a doctor.\\"","\\"She would travel more if she had time.\\"","\\"If we lived by the sea, we could swim every day.\\"","\\"What would you do if you lost your job?\\"","\\"If he spoke French, he might get the job.\\""],"mistakes":[{"x":"If I would have money, I would travel.","v":"If I had money, I would travel. (no “would” after if)"},{"x":"If I was you, I will help.","v":"If I were you, I ’d help."}],"quiz":[{"q":"If I ___ rich, I would buy a yacht.","o":["am","were","will be","would be"],"a":1,"e":"Second conditional: if + past (were).","d":"easy"},{"q":"If I had time, I ___ help you.","o":["will","would","had","am"],"a":1,"e":"Result → would help.","d":"easy"},{"q":"If I ___ you, I'd apologise.","o":["am","was being","were","will be"],"a":2,"e":"Advice → If I were you.","d":"easy"},{"q":"She would travel if she ___ more money.","o":["has","had","will have","would have"],"a":1,"e":"if + past simple: had.","d":"easy"},{"q":"If we lived nearer, we ___ visit more often.","o":["will","would","had","are"],"a":1,"e":"Result → would visit.","d":"easy"},{"q":"What ___ you do if you won a million?","o":["will","would","did","do"],"a":1,"e":"Hypothetical → would you do.","d":"med"},{"q":"If he ___ harder, he'd pass.","o":["studies","studied","will study","would study"],"a":1,"e":"if + past simple: studied.","d":"med"},{"q":"I ___ buy it if it weren't so expensive.","o":["will","would","had","am"],"a":1,"e":"Result → would buy.","d":"med"},{"q":"If I had a car, I ___ drive you home.","o":["can","could","will","would to"],"a":1,"e":"Ability in result → could drive.","d":"med"},{"q":"Choose the unreal situation.","o":["If it rains, I'll stay in.","If it snowed in summer, I'd be amazed.","If I have time, I'll call.","If you heat ice, it melts."],"a":1,"e":"Unlikely/unreal → second conditional.","d":"med"},{"q":"Find the mistake: 'If I would have money, I would travel.'","o":["would have → had","would travel → travel","If → When","no mistake"],"a":0,"e":"No ‘would’ in the if-clause: If I had money…","d":"hard"},{"q":"Complete: 'If she ___ here, she ___ what to do.'","o":["was / would know","were / would know","is / knows","were / knew"],"a":1,"e":"were (be) + would know.","d":"hard"},{"q":"Which is correct?","o":["If I was you, I will help.","If I were you, I would help.","If I am you, I would help.","If I were you, I will help."],"a":1,"e":"If I were you, I would help.","d":"hard"},{"q":"Complete: 'We ___ win the match if we ___ as a team.'","o":["will / play","would / played","would / play","will / played"],"a":1,"e":"would win + played (past).","d":"hard"},{"q":"Choose the natural advice.","o":["If I were you, I'd take the job.","If I am you, I take the job.","If I would be you, I take the job.","If I was you, I'll take the job."],"a":0,"e":"If I were you, I’d take the job.","d":"hard"}]},{"id":"g5","title":"Modals of deduction (present)","lead":"We use modal verbs to say how certain we are about a present situation. ‘Must’ shows we are almost sure something is true; ‘can’t’ that it is impossible; ‘might/may/could’ that it is possible.","leadTr":null,"situation":"","blocks":[{"h":"must (almost certain)","p":["Use must + base verb when you are sure something is true based on evidence."],"ex":["The light’s on — she must be home."]},{"h":"can’t (impossible)","p":["Use can’t (not ‘mustn’t’) when you are sure something is not true."],"ex":["He can’t be hungry; he’s just eaten."]},{"h":"might / may / could (possible)","p":["Use these for things that are possible but uncertain."],"ex":["She might be at work. · They could be lost."]},{"h":"with continuous","p":["Use modal + be + -ing for an action happening now."],"ex":["He’s not answering — he must be sleeping."]}],"tip":"The opposite of ‘must be’ (sure it is) is ‘can’t be’ (sure it isn’t), not ‘mustn’t be’. ‘Mustn’t’ means prohibition, not deduction.","examples":["\\"You’ve worked all day — you must be tired.\\"","\\"That can’t be John; he’s in Spain.\\"","\\"She might know the answer.\\"","\\"They must be having dinner; the lights are on.\\"","\\"It could be true, but I’m not sure.\\"","\\"He can’t be serious!\\""],"mistakes":[{"x":"He isn’t home — he mustn’t be at work.","v":"…he must be at work. (mustn’t ≠ deduction)"},{"x":"She must works late.","v":"She must be working late. (modal + be + -ing)"}],"quiz":[{"q":"The lights are on, so she ___ be home.","o":["can't","must","mustn't","couldn't"],"a":1,"e":"Sure it’s true → must be.","d":"easy"},{"q":"He's just eaten, so he ___ be hungry.","o":["must","can't","might","may"],"a":1,"e":"Sure it’s not true → can’t be.","d":"easy"},{"q":"I'm not sure, but she ___ be at work.","o":["must","can't","might","mustn't"],"a":2,"e":"Possible → might be.","d":"easy"},{"q":"That ___ be true — it's impossible!","o":["must","might","can't","may"],"a":2,"e":"Impossible → can’t be.","d":"easy"},{"q":"They aren't answering. They ___ be out.","o":["can't","might","mustn't","couldn't"],"a":1,"e":"Possible explanation → might be out.","d":"easy"},{"q":"He's wearing a coat, so it ___ be cold.","o":["can't","must","mustn't","may not"],"a":1,"e":"Evidence → must be cold.","d":"med"},{"q":"She speaks five languages — she ___ be clever.","o":["can't","might not","must","mustn't"],"a":2,"e":"Strong deduction → must be.","d":"med"},{"q":"The phone is off. He ___ be sleeping.","o":["must be","can't be","mustn't be","isn't"],"a":0,"e":"Likely explanation → must be sleeping.","d":"med"},{"q":"This ___ be the right address; the numbers don't match.","o":["must","might","can't","may"],"a":2,"e":"Sure it’s wrong → can’t be.","d":"med"},{"q":"Choose the 'possible' modal.","o":["must","can't","could","mustn't"],"a":2,"e":"‘could’ = possible.","d":"med"},{"q":"Find the mistake: 'He's not at home, he mustn't be at work.'","o":["mustn't → must","not → no","at → in","no mistake"],"a":0,"e":"For a likely explanation use ‘must be at work’ (mustn’t is prohibition).","d":"hard"},{"q":"Complete: 'She ___ be ill — she ___ be at the gym; her bag is here.'","o":["might / can't","must / might","can't / must","might / must"],"a":0,"e":"‘might be ill’ (possible) + ‘can’t be at the gym’ (impossible — bag is here).","d":"hard"},{"q":"Which is correct?","o":["He can't be serious.","He mustn't be serious.","He don't be serious.","He couldn't to be serious."],"a":0,"e":"Sure it isn’t → can’t be.","d":"hard"},{"q":"Complete: 'No one's answering. They ___ out, or they ___ be sleeping.'","o":["must be / can't","might be / might","can't be / must","must be / mustn't"],"a":1,"e":"Both uncertain → might be / might be.","d":"hard"},{"q":"Choose the present-continuous deduction.","o":["She must works late.","She must be working late.","She must working late.","She must to work late."],"a":1,"e":"modal + be + -ing: must be working.","d":"hard"}]},{"id":"g6","title":"The passive","lead":"We use the passive when the action is more important than the person who does it, or when we don’t know who did it. The object of the active sentence becomes the subject of the passive.","leadTr":null,"situation":"“This bridge was built in 1890.” — We use the passive when the action matters more than who did it (or we don’t know who did it).","blocks":[{"h":"Form: be + past participle","p":["Use the right tense of be + the past participle. Present: am/is/are + pp. Past: was/were + pp."],"ex":["English is spoken here. · The window was broken yesterday."]},{"h":"by + agent","p":["Use by to say who or what does the action, but only when it is important."],"ex":["The book was written by Orwell. · He was bitten by a dog."]},{"h":"When to use the passive","p":["Use it when the doer is unknown, obvious or unimportant, or in formal/scientific writing."],"ex":["My car was stolen. (we don’t know who) · The results were analysed."]},{"h":"Other tenses","p":["Present perfect: has/have been + pp. Future: will be + pp. Modal: can/must be + pp."],"ex":["The job has been done. · It will be finished soon. · It must be paid today."]}],"tip":"Only verbs with an object (transitive) can be made passive. ‘happen’, ‘arrive’ and ‘sleep’ have no object, so they cannot be passive.","examples":["\\"Millions of phones are made in China.\\"","\\"The bridge was built in 1890.\\"","\\"This letter was written by my grandmother.\\"","\\"The thieves were caught by the police.\\"","\\"Dinner is being prepared now.\\"","\\"The work will be finished tomorrow.\\""],"mistakes":[{"x":"The letter was wrote by John.","v":"The letter was written by John. (past participle)"},{"x":"The accident was happened.","v":"The accident happened. (“happen” has no object → no passive)"}],"quiz":[{"q":"English ___ in many countries.","o":["speaks","is spoken","spoken","is speaking"],"a":1,"e":"Present passive: is spoken.","d":"easy"},{"q":"The window ___ yesterday.","o":["broke","was broken","is broken","breaks"],"a":1,"e":"Past passive: was broken.","d":"easy"},{"q":"The passive of 'They make cars here' is 'Cars ___ here.'","o":["make","are made","made","is made"],"a":1,"e":"Plural subject → are made.","d":"easy"},{"q":"This book ___ by Dickens.","o":["wrote","was written","is writing","writes"],"a":1,"e":"Past passive: was written.","d":"easy"},{"q":"The rooms ___ every day.","o":["clean","are cleaned","is cleaned","cleaning"],"a":1,"e":"Plural present passive: are cleaned.","d":"easy"},{"q":"My bike ___ last week.","o":["stole","was stolen","is stolen","steals"],"a":1,"e":"Past passive: was stolen.","d":"med"},{"q":"Choose the agent: 'The house was designed ___ a famous architect.'","o":["from","by","with","of"],"a":1,"e":"Agent → by.","d":"med"},{"q":"The present perfect passive of 'do' is 'It ___.'","o":["has done","has been done","is done","was done"],"a":1,"e":"has/have been + pp: has been done.","d":"med"},{"q":"Which verb CANNOT be passive?","o":["build","write","arrive","clean"],"a":2,"e":"‘arrive’ has no object → not passive.","d":"med"},{"q":"The future passive of 'finish' is 'It ___ tomorrow.'","o":["will finish","will be finished","is finished","finishes"],"a":1,"e":"will be + pp: will be finished.","d":"med"},{"q":"Find the mistake: 'The letter was wrote by John.'","o":["wrote → written","was → is","by → from","no mistake"],"a":0,"e":"Past participle: was written.","d":"hard"},{"q":"Make passive: 'Somebody has cleaned the room.'","o":["The room has cleaned.","The room has been cleaned.","The room was clean.","The room is cleaning."],"a":1,"e":"Present perfect passive: has been cleaned.","d":"hard"},{"q":"Which sentence is correct?","o":["The thief was caught by police.","The thief caught by police.","The thief was catch by police.","The thief is catch by police."],"a":0,"e":"was + past participle: was caught.","d":"hard"},{"q":"Complete (modal passive): 'These forms ___ in pen.'","o":["must complete","must be completed","must completed","are must complete"],"a":1,"e":"modal + be + pp: must be completed.","d":"hard"},{"q":"Make passive: 'They are building a new school.'","o":["A new school is built.","A new school is being built.","A new school builds.","A new school was built."],"a":1,"e":"Present continuous passive: is being built.","d":"hard"}]},{"id":"g7","title":"Reported speech: statements","lead":"Reported (indirect) speech tells what someone said without using their exact words. Tenses usually move one step back, and pronouns and time words often change.","leadTr":null,"situation":"","blocks":[{"h":"Tense backshift","p":["Move the tense back one step: present simple → past simple; present continuous → past continuous; will → would; can → could."],"ex":["“I am tired.” → He said he was tired.","“I will call.” → She said she would call."]},{"h":"say & tell","p":["Use tell + a person; use say without a person (or with ‘to’)."],"ex":["She told me she was busy. · She said she was busy."]},{"h":"Pronouns & time words","p":["Change pronouns to fit the new speaker, and words like today→that day, tomorrow→the next day, now→then."],"ex":["“I’ll see you tomorrow.” → He said he’d see me the next day."]},{"h":"that (optional)","p":["You can include or leave out that after say/tell."],"ex":["She said (that) she liked it."]}],"tip":"After tell you must name the listener (tell me/him/us); after say you don’t. ‘He said me’ is wrong → ‘He told me’ or ‘He said’.","examples":["\\"“I’m hungry.” → She said she was hungry.\\"","\\"“We live in Leeds.” → They said they lived in Leeds.\\"","\\"“I’ll help you.” → He said he would help me.\\"","\\"“I can swim.” → She told me she could swim.\\"","\\"“I’m working now.” → He said he was working then.\\"","\\"“I bought a car.” → She said she had bought a car.\\""],"mistakes":[{"x":"He said me that he was late.","v":"He told me… / He said (that)… (tell + person, say + no person)"},{"x":"She said she will come.","v":"She said she would come. (will → would)"}],"quiz":[{"q":"\\"I am tired.\\" → He said he ___ tired.","o":["is","was","were","has been"],"a":1,"e":"present → past: was.","d":"easy"},{"q":"\\"I will call.\\" → She said she ___ call.","o":["will","would","can","could"],"a":1,"e":"will → would.","d":"easy"},{"q":"\\"I live here.\\" → He said he ___ there.","o":["lives","lived","is living","has lived"],"a":1,"e":"present → past: lived.","d":"easy"},{"q":"Choose the correct verb: 'She ___ me she was busy.'","o":["said","told","say","says"],"a":1,"e":"+ person → told me.","d":"easy"},{"q":"\\"I can swim.\\" → He said he ___ swim.","o":["can","could","will","would"],"a":1,"e":"can → could.","d":"easy"},{"q":"\\"We are eating.\\" → They said they ___ eating.","o":["are","were","was","have been"],"a":1,"e":"present continuous → past continuous: were eating.","d":"med"},{"q":"\\"I bought a car.\\" → She said she ___ a car.","o":["bought","had bought","has bought","buys"],"a":1,"e":"past → past perfect: had bought.","d":"med"},{"q":"Choose say/tell: 'He ___ that he was sorry.'","o":["told","said","told to","says"],"a":1,"e":"No person → said.","d":"med"},{"q":"\\"I'll see you tomorrow.\\" → He said he'd see me ___.","o":["tomorrow","the next day","yesterday","now"],"a":1,"e":"tomorrow → the next day.","d":"med"},{"q":"\\"I don't like it.\\" → She said she ___ it.","o":["doesn't like","didn't like","won't like","hasn't liked"],"a":1,"e":"present → past: didn’t like.","d":"med"},{"q":"Find the mistake: 'He said me that he was late.'","o":["said me → told me","that → which","was → is","no mistake"],"a":0,"e":"After ‘said’ no person; use ‘told me’.","d":"hard"},{"q":"Report: \\"I have finished my homework.\\"","o":["She said she finished her homework.","She said she had finished her homework.","She said she has finished her homework.","She said she finishes her homework."],"a":1,"e":"present perfect → past perfect: had finished.","d":"hard"},{"q":"Which is correct?","o":["He told he was tired.","He told me he was tired.","He said me he was tired.","He say me he was tired."],"a":1,"e":"tell + person: told me.","d":"hard"},{"q":"Report: \\"We are leaving now.\\"","o":["They said they are leaving now.","They said they were leaving then.","They said they leave then.","They said they will leave now."],"a":1,"e":"present continuous → past continuous; now → then.","d":"hard"},{"q":"Report: \\"I can't come tomorrow.\\"","o":["He said he can't come tomorrow.","He said he couldn't come the next day.","He said he couldn't come tomorrow.","He told he couldn't come."],"a":1,"e":"can’t → couldn’t; tomorrow → the next day.","d":"hard"}]},{"id":"g8","title":"Reported questions & commands","lead":"When we report questions and orders, the structure changes. Reported questions use statement word order, and reported commands use ‘to’ + verb.","leadTr":null,"situation":"","blocks":[{"h":"Wh- questions","p":["Keep the question word, then use statement order (subject + verb) with no auxiliary do/does/did."],"ex":["“Where do you live?” → She asked where I lived."]},{"h":"Yes/No questions","p":["Use if or whether, then statement order."],"ex":["“Are you ready?” → He asked if I was ready."]},{"h":"Commands & requests","p":["Use told/asked + person + to + verb. For negatives, use not to."],"ex":["“Sit down.” → She told me to sit down. · “Don’t move.” → He told me not to move."]},{"h":"No question mark","p":["Reported questions are statements, so they don’t end with a question mark."],"ex":["He asked where the station was."]}],"tip":"In reported questions, don’t keep the question word order or ‘do/did’: ‘She asked where did I live’ is wrong → ‘She asked where I lived.’","examples":["\\"“What time is it?” → He asked what time it was.\\"","\\"“Do you like tea?” → She asked if I liked tea.\\"","\\"“Where are you going?” → He asked where I was going.\\"","\\"“Close the door.” → She told me to close the door.\\"","\\"“Please help me.” → He asked me to help him.\\"","\\"“Don’t be late.” → She told me not to be late.\\""],"mistakes":[{"x":"She asked me what time was it.","v":"She asked what time it was. (statement word order)"},{"x":"He told me to don’t go.","v":"He told me not to go."}],"quiz":[{"q":"\\"Where do you live?\\" → She asked where I ___.","o":["live","lived","do live","am living"],"a":1,"e":"Statement order, backshift: where I lived.","d":"easy"},{"q":"\\"Are you ready?\\" → He asked ___ I was ready.","o":["that","if","what","do"],"a":1,"e":"Yes/No → if.","d":"easy"},{"q":"\\"Sit down.\\" → She told me ___ down.","o":["sit","to sit","sitting","sat"],"a":1,"e":"Command → to sit.","d":"easy"},{"q":"\\"Don't run.\\" → He told me ___ run.","o":["to not","don't","not to","to don't"],"a":2,"e":"Negative command → not to run.","d":"easy"},{"q":"\\"What is your name?\\" → She asked what my name ___.","o":["is","was","be","were"],"a":1,"e":"Backshift: what my name was.","d":"easy"},{"q":"\\"Do you like coffee?\\" → He asked if I ___ coffee.","o":["like","liked","do like","am liking"],"a":1,"e":"if + statement order, backshift: liked.","d":"med"},{"q":"\\"Open the window.\\" → She asked me ___ the window.","o":["open","to open","opening","opened"],"a":1,"e":"Request → to open.","d":"med"},{"q":"\\"Where are you going?\\" → He asked where I ___.","o":["am going","was going","go","were going"],"a":1,"e":"present cont. → past cont.: was going.","d":"med"},{"q":"\\"Can you swim?\\" → She asked if I ___ swim.","o":["can","could","will","would"],"a":1,"e":"can → could.","d":"med"},{"q":"Choose the correct word order.","o":["He asked where did I live.","He asked where I lived.","He asked where lived I.","He asked did where I live."],"a":1,"e":"Statement order: where I lived.","d":"med"},{"q":"Find the mistake: 'She asked me what time was it.'","o":["was it → it was","what → which","asked → told","no mistake"],"a":0,"e":"Statement order: what time it was.","d":"hard"},{"q":"Report: \\"Please don't tell anyone.\\"","o":["He asked me not to tell anyone.","He asked me to don't tell anyone.","He asked me don't tell anyone.","He told to not tell anyone."],"a":0,"e":"Negative request → asked me not to tell.","d":"hard"},{"q":"Report: \\"Have you finished?\\"","o":["She asked if I had finished.","She asked if I have finished.","She asked did I finish.","She asked if had I finished."],"a":0,"e":"Yes/No + present perfect → if I had finished.","d":"hard"},{"q":"Report: \\"Why are you late?\\"","o":["He asked why was I late.","He asked why I was late.","He asked why I am late.","He asked me why late I was."],"a":1,"e":"Statement order, backshift: why I was late.","d":"hard"},{"q":"Report: \\"Wait here.\\"","o":["She told me wait here.","She told me to wait there.","She told me to wait here now.","She said me to wait there."],"a":1,"e":"Command → to wait; here → there.","d":"hard"}]},{"id":"g9","title":"Relative clauses (defining & non-defining)","lead":"Relative clauses add information about a noun. Defining clauses give essential information; non-defining clauses give extra information and are separated by commas.","leadTr":null,"situation":"","blocks":[{"h":"Defining clauses","p":["Give essential information (you need it to know which person or thing). Use who, which, that, where, whose. No commas."],"ex":["The man who lives next door is a doctor."]},{"h":"Non-defining clauses","p":["Give extra, non-essential information, set off by commas. Don’t use ‘that’; don’t omit the pronoun."],"ex":["My brother, who lives in Leeds, is a teacher."]},{"h":"Leaving out the pronoun","p":["In defining clauses, you can omit who/which/that when it is the object."],"ex":["The book (that) I read was great."]},{"h":"whose & where","p":["whose shows possession; where refers to a place."],"ex":["She’s the woman whose car was stolen. · That’s the town where I grew up."]}],"tip":"Use commas only for extra information (non-defining). With commas, never use ‘that’ and never drop the pronoun. Without commas (defining), you can use ‘that’ and may drop an object pronoun.","examples":["\\"The keys that were on the table have gone.\\"","\\"Paris, which is the capital of France, is beautiful.\\"","\\"The film (that) we saw was boring.\\"","\\"My uncle, who is a pilot, travels a lot.\\"","\\"That’s the house where I was born.\\"","\\"He’s the boy whose dog bit me.\\""],"mistakes":[{"x":"My car, that is red, is fast.","v":"My car, which is red, is fast. (non-defining → which)"},{"x":"The man which called…","v":"The man who called… (people → who)"}],"quiz":[{"q":"The woman ___ teaches us is very kind.","o":["which","who","where","whose"],"a":1,"e":"People → who.","d":"easy"},{"q":"I bought a phone ___ takes great photos.","o":["who","which","where","whose"],"a":1,"e":"Things → which/that.","d":"easy"},{"q":"That's the café ___ we first met.","o":["which","who","where","whose"],"a":2,"e":"Place → where.","d":"easy"},{"q":"She's the girl ___ brother is famous.","o":["who","which","whose","where"],"a":2,"e":"Possession → whose.","d":"easy"},{"q":"Which clause has extra information (needs commas)?","o":["The man who called is here.","My dad, who is 60, still works.","The book that I read…","The town where I live…"],"a":1,"e":"Non-defining → commas.","d":"easy"},{"q":"In which sentence can we omit the pronoun?","o":["The man who lives here…","The book that I read…","The woman who called…","The city which is huge…"],"a":1,"e":"Object pronoun in a defining clause can be dropped: the book I read.","d":"med"},{"q":"Non-defining: 'London, ___ is the capital, is huge.'","o":["that","which","where","who"],"a":1,"e":"Non-defining things → which (never ‘that’).","d":"med"},{"q":"The keys ___ were on the table are gone.","o":["who","which","where","whose"],"a":1,"e":"Things → which/that.","d":"med"},{"q":"My sister, ___ lives in Bristol, is a nurse.","o":["that","who","which","where"],"a":1,"e":"Non-defining people → who.","d":"med"},{"q":"Choose the defining clause.","o":["The man who called is my boss.","My boss, who is 50, called.","Paris, which I love, is busy.","Tom, whose car broke, is late."],"a":0,"e":"Defining = essential, no commas.","d":"med"},{"q":"Find the mistake: 'My car, that is red, is fast.'","o":["that → which","car → cars","is → are","no mistake"],"a":0,"e":"Non-defining clauses use ‘which’, not ‘that’.","d":"hard"},{"q":"Complete: 'The hotel ___ we stayed, ___ was by the sea, was lovely.'","o":["which / that","where / which","that / where","where / who"],"a":1,"e":"Place ‘where we stayed’ + non-defining ‘which was by the sea’.","d":"hard"},{"q":"Which sentence omits the pronoun correctly?","o":["The film we saw was good.","The man lives here is nice.","The city is big I visited.","The book wrote by him."],"a":0,"e":"Object pronoun dropped: the film (that) we saw.","d":"hard"},{"q":"Complete: 'He's the player ___ goal won the match, ___ made him famous.'","o":["who / which","whose / which","whose / that","which / who"],"a":1,"e":"‘whose goal’ (possession) + non-defining ‘which made him famous’.","d":"hard"},{"q":"Choose the correct non-defining sentence.","o":["My teacher who is French is kind.","My teacher, who is French, is kind.","My teacher, that is French, is kind.","My teacher which is French is kind."],"a":1,"e":"Extra info → commas + who.","d":"hard"}]},{"id":"g10","title":"Past habits: used to & would","lead":"To describe the past we can use ‘used to’ and ‘would’ for repeated habits, but only ‘used to’ works for past states. Both contrast the past with the present.","leadTr":null,"situation":"","blocks":[{"h":"used to (habits & states)","p":["used to + base verb describes past habits and past states that are no longer true."],"ex":["I used to play tennis. · She used to have long hair."]},{"h":"would (repeated habits only)","p":["would + base verb describes repeated past actions, but not states. It is common in stories."],"ex":["Every summer we would visit my grandparents."]},{"h":"would vs. used to with states","p":["Don’t use ‘would’ with state verbs (be, have, like, know). Use ‘used to’."],"ex":["✓ I used to be shy. · ✗ I would be shy."]},{"h":"Negatives & questions","p":["For ‘used to’: didn’t use to / Did … use to? (no -d)."],"ex":["He didn’t use to like coffee. · Did you use to live here?"]}],"tip":"Use ‘would’ only for repeated actions. For past states (be, have, like, know), you must use ‘used to’: ‘I used to have a bike’, not ‘I would have a bike’.","examples":["\\"We used to live by the sea.\\"","\\"On Sundays, my dad would cook a big breakfast.\\"","\\"She used to be very shy.\\"","\\"He didn’t use to exercise, but now he runs daily.\\"","\\"As children, we would play outside all day.\\"","\\"Did you use to have a dog?\\""],"mistakes":[{"x":"I would have a red car when I was young.","v":"I used to have a red car. (state → used to)"},{"x":"Did you used to live here?","v":"Did you use to live here? (after did → no -d)"}],"quiz":[{"q":"I ___ play football every day as a child.","o":["use to","used to","would have","am used to"],"a":1,"e":"Past habit: used to play.","d":"easy"},{"q":"Every winter, we ___ go skiing.","o":["would","used","use","are used to"],"a":0,"e":"Repeated action → would go.","d":"easy"},{"q":"She ___ have long hair.","o":["would","used to","use to","is used to"],"a":1,"e":"Past state → used to have.","d":"easy"},{"q":"They ___ visit us every summer.","o":["would","use to","are used to","using to"],"a":0,"e":"Repeated action → would visit.","d":"easy"},{"q":"He ___ be very thin.","o":["would","used to","use to","is used to"],"a":1,"e":"Past state → used to be.","d":"easy"},{"q":"Which sentence is WRONG?","o":["I used to be shy.","I would be shy.","I would play outside.","I used to play outside."],"a":1,"e":"‘would’ can’t be used with the state ‘be’.","d":"med"},{"q":"Negative: 'I ___ like vegetables.'","o":["didn't used to","didn't use to","wouldn't","don't used to"],"a":1,"e":"didn’t use to (no -d).","d":"med"},{"q":"On holiday, we ___ swim in the sea every morning.","o":["used","would","use to","are used to"],"a":1,"e":"Repeated action → would swim.","d":"med"},{"q":"___ you use to have a bike?","o":["Do","Did","Were","Would"],"a":1,"e":"Did you use to…?","d":"med"},{"q":"Choose the state-verb sentence (only 'used to').","o":["We would run.","We would sing.","I used to have a cat.","They would visit."],"a":2,"e":"‘have’ is a state → used to have.","d":"med"},{"q":"Find the mistake: 'I would have a red car when I was young.'","o":["would have → used to have","when → while","young → younger","no mistake"],"a":0,"e":"State ‘have’ → used to have (not would).","d":"hard"},{"q":"Complete: 'My grandmother ___ tell us stories, and she ___ a wonderful voice.'","o":["used to / would have","would / used to have","would / would have","used to / used to"],"a":1,"e":"Repeated action ‘would tell’ + state ‘used to have’.","d":"hard"},{"q":"Which is correct for a past habit and a past state?","o":["I would be a teacher and would smoke.","I used to be a teacher and would smoke.","I would be a teacher and used to smoke.","I use to be a teacher and would smoke."],"a":1,"e":"State ‘used to be’ + repeated action ‘would smoke’.","d":"hard"},{"q":"Complete: '___ they ___ live in the countryside?'","o":["Did / used to","Did / use to","Would / use to","Do / use to"],"a":1,"e":"Did + use to: Did they use to live…?","d":"hard"},{"q":"Choose the natural sentence.","o":["When I was a kid, I would have a dog.","When I was a kid, I used to have a dog.","When I was a kid, I use to have a dog.","When I was a kid, I am used to have a dog."],"a":1,"e":"State ‘have’ → used to have.","d":"hard"}]},{"id":"g11","title":"Gerunds & infinitives","lead":"Many verbs are followed by a gerund (-ing) and others by an infinitive (to + verb). Some verbs take either form, and a few change meaning depending on which you choose.","leadTr":null,"situation":"","blocks":[{"h":"Verb + -ing","p":["After enjoy, finish, avoid, suggest, mind, keep, practise, can’t stand, look forward to, and after prepositions, use the -ing form."],"ex":["I enjoy cooking. · She’s good at drawing. · I look forward to seeing you."]},{"h":"Verb + to-infinitive","p":["After want, decide, hope, plan, promise, agree, offer, refuse, manage, learn, would like, use to + verb."],"ex":["We decided to leave. · He refused to help."]},{"h":"verb + object + to","p":["Some verbs take an object then to-infinitive: want, ask, tell, allow, advise, expect."],"ex":["She asked me to wait. · They allowed us to stay."]},{"h":"Change of meaning","p":["A few verbs change meaning: stop, remember, try, forget."],"ex":["I stopped smoking. (gave it up) · I stopped to smoke. (paused in order to)"]}],"tip":"After prepositions (about, of, at, in, before, after, without), always use the -ing form: ‘I’m interested in learning’, ‘before going out’.","examples":["\\"I can’t stand waiting in queues.\\"","\\"She decided to study abroad.\\"","\\"He’s thinking about changing jobs.\\"","\\"They asked me to help them.\\"","\\"Remember to lock the door. (don’t forget)\\"","\\"I’ll never forget visiting Rome. (the memory)\\""],"mistakes":[{"x":"I’m interested in to learn Spanish.","v":"I’m interested in learning Spanish. (preposition + -ing)"},{"x":"They allowed us stay.","v":"They allowed us to stay."}],"quiz":[{"q":"I enjoy ___ to music.","o":["listen","to listen","listening","listened"],"a":2,"e":"enjoy + -ing: listening.","d":"easy"},{"q":"We decided ___ early.","o":["leave","to leave","leaving","left"],"a":1,"e":"decide + to: to leave.","d":"easy"},{"q":"She's good at ___.","o":["draw","to draw","drawing","drew"],"a":2,"e":"Preposition ‘at’ + -ing: drawing.","d":"easy"},{"q":"He refused ___ the question.","o":["answer","to answer","answering","answered"],"a":1,"e":"refuse + to: to answer.","d":"easy"},{"q":"Do you mind ___ the window?","o":["open","to open","opening","opened"],"a":2,"e":"mind + -ing: opening.","d":"easy"},{"q":"They asked me ___ them.","o":["help","to help","helping","helped"],"a":1,"e":"ask + object + to: to help.","d":"med"},{"q":"I'm thinking about ___ a new car.","o":["buy","to buy","buying","bought"],"a":2,"e":"Preposition ‘about’ + -ing: buying.","d":"med"},{"q":"She managed ___ the problem.","o":["solve","to solve","solving","solved"],"a":1,"e":"manage + to: to solve.","d":"med"},{"q":"We're looking forward to ___ you.","o":["see","to see","seeing","saw"],"a":2,"e":"‘look forward to’ + -ing: seeing.","d":"med"},{"q":"He suggested ___ a taxi.","o":["take","to take","taking","taken"],"a":2,"e":"suggest + -ing: taking.","d":"med"},{"q":"Find the mistake: 'I'm interested in to learn Spanish.'","o":["to learn → learning","interested → interesting","in → on","no mistake"],"a":0,"e":"Preposition ‘in’ + -ing: learning.","d":"hard"},{"q":"Choose the correct meaning: 'He stopped to smoke' means ___.","o":["he gave up smoking","he paused in order to smoke","he never smoked","he hates smoking"],"a":1,"e":"stop + to = pause in order to do something.","d":"hard"},{"q":"Complete: 'Please remember ___ the door, and I'll never forget ___ here as a child.'","o":["locking / to play","to lock / playing","to lock / to play","locking / playing"],"a":1,"e":"remember to do (duty) + forget doing (memory).","d":"hard"},{"q":"Which is correct?","o":["They allowed us stay.","They allowed us to stay.","They allowed us staying.","They allowed to us stay."],"a":1,"e":"allow + object + to: allowed us to stay.","d":"hard"},{"q":"Complete: 'I tried ___ the box, but it was locked, so I tried ___ a knife.'","o":["opening / using","to open / using","to open / to use","opening / to use"],"a":1,"e":"try to do (attempt) + try doing (experiment): to open / using.","d":"hard"}]},{"id":"g12","title":"Comparing: as…as, less, modifiers","lead":"Beyond basic comparatives, we can show that two things are equal, that one is inferior, or how big the difference is. These patterns make comparisons more precise.","leadTr":null,"situation":"","blocks":[{"h":"as … as (equality)","p":["Use as + adjective + as to say two things are the same, and not as … as for inequality."],"ex":["She’s as tall as her brother. · It’s not as cold as yesterday."]},{"h":"less … than","p":["Use less + adjective + than (the opposite of ‘more … than’), usually with longer adjectives."],"ex":["This film is less interesting than the book."]},{"h":"Modifiers","p":["Make comparatives stronger or weaker with much, far, a lot, a bit, slightly."],"ex":["He’s much taller than me. · It’s a bit warmer today."]},{"h":"the … the … (parallel)","p":["Use ‘the + comparative … the + comparative’ to show that two things change together."],"ex":["The more you practise, the better you get."]}],"tip":"To strengthen a comparative, use much or far (much/far better), not ‘very’. ‘Very better’ is wrong; ‘much better’ is correct.","examples":["\\"Maths is as difficult as physics for me.\\"","\\"This phone is not as expensive as that one.\\"","\\"Today is far hotter than yesterday.\\"","\\"The book is less exciting than the film.\\"","\\"He runs a bit faster than me.\\"","\\"The harder you work, the more you earn.\\""],"mistakes":[{"x":"This car is very better than mine.","v":"…is much better than mine. (much/far, not very)"},{"x":"She is as tall than him.","v":"She is as tall as him."}],"quiz":[{"q":"She is ___ tall ___ her sister.","o":["as / as","so / as","as / than","more / than"],"a":0,"e":"Equality: as tall as.","d":"easy"},{"q":"It isn't ___ cold ___ yesterday.","o":["as / than","so / than","as / as","more / as"],"a":2,"e":"not as cold as.","d":"easy"},{"q":"This book is ___ interesting than that one.","o":["less","least","not","as"],"a":0,"e":"less interesting than.","d":"easy"},{"q":"He's ___ taller than me.","o":["very","much","more","most"],"a":1,"e":"Modifier → much taller.","d":"easy"},{"q":"Today is ___ a bit warmer than yesterday.","o":["very","more","just","most"],"a":2,"e":"‘just a bit warmer’ — slightly (just/a bit) modifies the comparative.","d":"easy"},{"q":"My phone is ___ expensive ___ yours.","o":["as / than","as / as","more / as","so / as"],"a":1,"e":"Equality: as expensive as.","d":"med"},{"q":"The film was ___ exciting than the book.","o":["less","least","not as","fewer"],"a":0,"e":"less exciting than.","d":"med"},{"q":"He's ___ better at chess than I am.","o":["very","far","most","more"],"a":1,"e":"Modifier → far better.","d":"med"},{"q":"Complete: '___ you practise, ___ you become.'","o":["More / better","The more / the better","More the / better the","The most / the best"],"a":1,"e":"the more … the better.","d":"med"},{"q":"Choose the equality sentence.","o":["She is taller than him.","She is as tall as him.","She is the tallest.","She is more tall than him."],"a":1,"e":"Equality → as tall as.","d":"med"},{"q":"Find the mistake: 'This car is very better than mine.'","o":["very → much","better → best","than → as","no mistake"],"a":0,"e":"Use ‘much better’, not ‘very better’.","d":"hard"},{"q":"Complete: 'It's ___ as difficult ___ I expected — much easier, in fact.'","o":["not so / than","not as / as","as / as","less / than"],"a":1,"e":"not as difficult as.","d":"hard"},{"q":"Which means 'they are equal'?","o":["A is less good than B.","A is much better than B.","A is as good as B.","A isn't as good as B."],"a":2,"e":"as good as = equal.","d":"hard"},{"q":"Complete: 'The ___ we leave, the ___ we'll arrive.'","o":["sooner / earlier","more soon / more early","soonest / earliest","sooner / more early"],"a":0,"e":"the sooner … the earlier.","d":"hard"},{"q":"Choose the correctly modified comparative.","o":["It's far more cheap.","It's far cheaper.","It's very cheaper.","It's more cheaper."],"a":1,"e":"far cheaper (much/far + comparative).","d":"hard"}]},{"id":"g13","title":"Quantifiers","lead":"Quantifiers tell us about amount and number. At B1 we extend beyond some/any to all, most, both, neither, none, each and every, and learn how they combine with nouns and ‘of’.","leadTr":null,"situation":"","blocks":[{"h":"all / most / some / none","p":["Use these for general amounts. With ‘the/my/these’ + noun, add of: most of the students."],"ex":["Most people like music. · None of the answers were right."]},{"h":"both / neither / either","p":["both = the two together; neither = not one and not the other; either = one or the other."],"ex":["Both films are good. · Neither answer is correct. · Either day is fine."]},{"h":"each & every","p":["Both mean ‘all, seen individually’, and take a singular verb. ‘every’ for the whole group; ‘each’ for the individuals."],"ex":["Every student has a book. · Each answer is different."]},{"h":"a few / a little / several","p":["a few + countable, a little + uncountable, several = more than a few (countable)."],"ex":["A few people came. · A little milk. · Several students passed."]}],"tip":"every and each are followed by a singular noun and verb: ‘Every student is here’, not ‘every students are here’.","examples":["\\"Most of my friends live abroad.\\"","\\"None of the shops were open.\\"","\\"Both answers are correct.\\"","\\"Neither of us wants to go.\\"","\\"Every child needs love.\\"","\\"Several people complained.\\""],"mistakes":[{"x":"Every students are present.","v":"Every student is present. (every + singular)"},{"x":"Most of people are kind.","v":"Most people are kind. (no “of” without the/my)"}],"quiz":[{"q":"___ people enjoy music.","o":["Most","Most of","The most","Much"],"a":0,"e":"General → Most people.","d":"easy"},{"q":"___ of the students passed.","o":["Every","Each","All","Most of"],"a":3,"e":"With ‘the’ → Most of the students.","d":"easy"},{"q":"___ answers are correct — well done!","o":["Both","Neither","Either","Every"],"a":0,"e":"The two together → Both answers.","d":"easy"},{"q":"___ student has a textbook.","o":["Every","All","Most","Both"],"a":0,"e":"+ singular noun → Every student.","d":"easy"},{"q":"I have ___ money, just a little.","o":["a few","a little","many","several"],"a":1,"e":"Uncountable → a little.","d":"easy"},{"q":"___ of the answers was right; they were all wrong.","o":["All","Both","None","Most"],"a":2,"e":"Zero → None of the answers.","d":"med"},{"q":"___ of us wants to leave; we're both happy.","o":["Both","Either","Neither","Each"],"a":2,"e":"Not one and not the other → Neither.","d":"med"},{"q":"___ child in the class is different.","o":["Each","All","Both","Most"],"a":0,"e":"Individuals + singular → Each child.","d":"med"},{"q":"___ students complained about the test.","o":["Several","A little","Much","Every"],"a":0,"e":"More than a few, countable → Several.","d":"med"},{"q":"Choose the correct verb: 'Every student ___ here.'","o":["are","is","were","have"],"a":1,"e":"‘every’ → singular: is.","d":"med"},{"q":"Find the mistake: 'Every students are present.'","o":["students are → student is","Every → All","present → presents","no mistake"],"a":0,"e":"every + singular: Every student is present.","d":"hard"},{"q":"Complete: '___ of the two options is fine; choose ___ you like.'","o":["Both / either","Either / either","Neither / both","Each / neither"],"a":1,"e":"Either of the two is fine; choose either.","d":"hard"},{"q":"Which is correct?","o":["Most of people are kind.","Most people are kind.","The most people are kind.","Most of the people kind."],"a":1,"e":"General statement → Most people (no ‘of’ without the/my/these).","d":"hard"},{"q":"Complete: '___ of my friends came, but ___ stayed late.'","o":["All / none","All / no","Every / none","Each / no"],"a":0,"e":"All of my friends came, but none stayed late.","d":"hard"},{"q":"Choose the sentence with correct agreement.","o":["Each of the rooms have a bed.","Each of the rooms has a bed.","Each rooms has a bed.","Each of the room have a bed."],"a":1,"e":"‘each’ → singular verb: has.","d":"hard"}]},{"id":"g14","title":"Conditionals: zero, first & linkers","lead":"Conditionals describe results that follow from conditions. The zero conditional states facts; the first conditional describes likely future situations. Linkers like unless and as long as add precision.","leadTr":null,"situation":"","blocks":[{"h":"Zero conditional (facts)","p":["Use if/when + present, present for things that are always true."],"ex":["If you heat water, it boils."]},{"h":"First conditional (likely future)","p":["Use if + present, will + base for real, likely future situations."],"ex":["If it rains, we’ll stay in."]},{"h":"unless","p":["unless = if … not. It introduces the only condition that changes the result."],"ex":["I won’t go unless you come too. (= if you don’t come)"]},{"h":"as long as / provided that / in case","p":["as long as / provided that = on condition that; in case = as a precaution."],"ex":["You can stay as long as you’re quiet. · Take an umbrella in case it rains."]}],"tip":"Don’t use ‘will’ after if/unless/as long as/in case in the condition: ‘If it will rain’ is wrong → ‘If it rains, we’ll stay in.’","examples":["\\"If you mix blue and yellow, you get green.\\"","\\"If you study, you’ll pass.\\"","\\"We’ll be late unless we hurry.\\"","\\"You can borrow it as long as you return it.\\"","\\"I’ll take my phone in case you call.\\"","\\"Provided that you pay, you can join.\\""],"mistakes":[{"x":"I’ll help you as long as you will ask.","v":"…as long as you ask. (no “will” in the condition)"},{"x":"Unless you don’t hurry, we’ll be late.","v":"Unless you hurry… (unless already = if not)"}],"quiz":[{"q":"If you heat ice, it ___.","o":["will melt","melts","melted","is melting"],"a":1,"e":"Zero conditional → present: melts.","d":"easy"},{"q":"If it rains, we ___ inside.","o":["stay","will stay","stayed","would stay"],"a":1,"e":"First conditional → will stay.","d":"easy"},{"q":"You'll be late ___ you hurry.","o":["if","unless","when","as"],"a":1,"e":"unless = if … not.","d":"easy"},{"q":"If you ___ water to 100°C, it boils.","o":["will heat","heat","heated","would heat"],"a":1,"e":"Zero conditional → present: heat.","d":"easy"},{"q":"I'll call you ___ I arrive.","o":["unless","when","in case of","provided"],"a":1,"e":"‘when I arrive’ (it will happen).","d":"easy"},{"q":"Take a coat ___ it gets cold.","o":["unless","in case","as long as","provided"],"a":1,"e":"Precaution → in case it gets cold.","d":"med"},{"q":"You can stay ___ you keep quiet.","o":["unless","in case","as long as","if not"],"a":2,"e":"Condition → as long as.","d":"med"},{"q":"If you ___ now, you'll catch the bus.","o":["will leave","leave","left","would leave"],"a":1,"e":"First conditional → leave (present).","d":"med"},{"q":"We won't win ___ we play better.","o":["if","unless","when","in case"],"a":1,"e":"unless = if … not.","d":"med"},{"q":"Choose the zero conditional.","o":["If it rains, I'll stay.","If you drop glass, it breaks.","If I were rich, I'd travel.","If you study, you'll pass."],"a":1,"e":"General fact → zero conditional.","d":"med"},{"q":"Find the mistake: 'I'll help you as long as you will ask.'","o":["you will ask → you ask","help → helping","as long as → unless","no mistake"],"a":0,"e":"No ‘will’ in the condition: as long as you ask.","d":"hard"},{"q":"Complete: 'I'll lend it to you ___ you ___ it back.'","o":["unless / give","provided that / give","in case / will give","unless / will give"],"a":1,"e":"Condition → provided that you give it back.","d":"hard"},{"q":"Which is correct?","o":["Unless you don't hurry, we'll be late.","Unless you hurry, we'll be late.","If you hurry, we'll be late.","Unless you will hurry, we'll be late."],"a":1,"e":"unless already means ‘if not’: Unless you hurry…","d":"hard"},{"q":"Complete: 'Take the map ___ you ___ lost.'","o":["unless / get","in case / get","as long as / get","if / will get"],"a":1,"e":"Precaution → in case you get lost.","d":"hard"},{"q":"Choose the correct first conditional.","o":["If it will snow, school closes.","If it snows, school will close.","If it snows, school closes always.","If it would snow, school will close."],"a":1,"e":"If + present, will + base.","d":"hard"}]},{"id":"g15","title":"Articles: a / an / the / zero","lead":"Articles are small but tricky. ‘A/an’ introduces something new or one of many; ‘the’ points to something specific or already known; and we use no article (zero) for general ideas and most plurals/uncountables.","leadTr":null,"situation":"","blocks":[{"h":"a / an (one of many, new)","p":["Use a/an with singular countable nouns mentioned for the first time or as examples. ‘an’ before a vowel sound."],"ex":["I saw a dog. · She’s an engineer. · It takes an hour. (silent h)"]},{"h":"the (specific / known)","p":["Use the when both speaker and listener know which one, for unique things, and when mentioned again."],"ex":["The sun is hot. · I bought a book; the book was great."]},{"h":"zero article (general)","p":["Use no article for plural and uncountable nouns in general, and most names, meals, and many places."],"ex":["Dogs are loyal. · I like music. · We have lunch at one."]},{"h":"Fixed expressions","p":["Some places take ‘the’ or zero by convention."],"ex":["go to school/work/bed (zero) · play the piano · in the morning"]}],"tip":"Use ‘a/an’ when it’s new or one of many, and ‘the’ when it’s specific or already known. For general statements with plurals/uncountables, use no article: ‘Books are useful’, not ‘The books are useful’.","examples":["\\"She’s a teacher and an artist.\\"","\\"The Earth goes round the Sun.\\"","\\"I love coffee in the morning.\\"","\\"We went to school by bus.\\"","\\"He plays the guitar very well.\\"","\\"Children need plenty of sleep.\\""],"mistakes":[{"x":"I love the nature.","v":"I love nature. (general uncountable → no article)"},{"x":"She is best doctor in town.","v":"She is the best doctor in town. (superlative → the)"}],"quiz":[{"q":"I saw ___ cat in the garden.","o":["a","an","the","—"],"a":0,"e":"New, singular countable → a cat.","d":"easy"},{"q":"She is ___ honest person.","o":["a","an","the","—"],"a":1,"e":"Silent h, vowel sound → an honest.","d":"easy"},{"q":"___ sun rises in the east.","o":["A","An","The","—"],"a":2,"e":"Unique object → The sun.","d":"easy"},{"q":"I like ___ music.","o":["a","an","the","—"],"a":3,"e":"General uncountable → no article.","d":"easy"},{"q":"He's ___ engineer.","o":["a","an","the","—"],"a":1,"e":"Vowel sound → an engineer.","d":"easy"},{"q":"We go to ___ bed at ten.","o":["a","the","—","an"],"a":2,"e":"Fixed expression → go to bed (zero).","d":"med"},{"q":"I bought a phone. ___ phone was cheap.","o":["A","An","The","—"],"a":2,"e":"Mentioned again → The phone.","d":"med"},{"q":"___ dogs are friendly animals. (in general)","o":["A","An","The","—"],"a":3,"e":"General plural → no article.","d":"med"},{"q":"She plays ___ violin.","o":["a","an","the","—"],"a":2,"e":"Instruments → play the violin.","d":"med"},{"q":"It takes ___ hour to get there.","o":["a","an","the","—"],"a":1,"e":"Silent h → an hour.","d":"med"},{"q":"Find the mistake: 'I love the nature.'","o":["the nature → nature","love → like","I → We","no mistake"],"a":0,"e":"General uncountable → no article: I love nature.","d":"hard"},{"q":"Complete: 'We had ___ breakfast, then went to ___ work.'","o":["the / the","— / —","a / the","the / —"],"a":1,"e":"Meals and ‘go to work’ → zero article.","d":"hard"},{"q":"Which is correct?","o":["The life is hard sometimes.","Life is hard sometimes.","A life is hard sometimes.","An life is hard sometimes."],"a":1,"e":"General abstract noun → no article: Life is hard.","d":"hard"},{"q":"Complete: 'I saw ___ film last night. ___ film was about ___ space.'","o":["a / The / —","the / A / the","a / A / a","— / The / the"],"a":0,"e":"a film (new) / The film (known) / space (general, zero).","d":"hard"},{"q":"Choose the correct sentence.","o":["She is best doctor in the town.","She is the best doctor in the town.","She is a best doctor in the town.","She is best doctor in town a."],"a":1,"e":"Superlative needs ‘the’: the best
