ll day.","syn":"lethargic, languid","ant":"energetic"},{"w":"lucrative","pos":"adj","ipa":"/ˈluːkrətɪv/","uz":"foydali, daromadli","ru":"прибыльный","def":"profitable","ex":"A lucrative deal.","syn":"profitable, gainful","ant":"unprofitable"},{"w":"luminous","pos":"adj","ipa":"/ˈluːmɪnəs/","uz":"yorug', nurli","ru":"светящийся, яркий","def":"giving off light; brilliant","ex":"A luminous glow.","syn":"radiant, bright","ant":"dark"},{"w":"magnate","pos":"noun","ipa":"/ˈmæɡneɪt/","uz":"yirik ishbilarmon, magnat","ru":"магнат","def":"a powerful businessperson","ex":"An oil magnate.","syn":"tycoon, mogul","ant":"—"},{"w":"malevolent","pos":"adj","ipa":"/məˈlɛvələnt/","uz":"yovuz, badniyat","ru":"злонамеренный","def":"wishing harm to others","ex":"A malevolent grin.","syn":"malicious, hostile","ant":"benevolent"}]},{"id":"sv24","title":"Academic words · Set 7","words":[{"w":"maverick","pos":"noun","ipa":"/ˈmævərɪk/","uz":"mustaqil fikrli, an'anaga bo'ysunmaydigan","ru":"индивидуалист, нонконформист","def":"an independent nonconformist","ex":"A political maverick.","syn":"nonconformist, rebel","ant":"conformist"},{"w":"mawkish","pos":"adj","ipa":"/ˈmɔːkɪʃ/","uz":"haddan tashqari hissiy, yig'loqi","ru":"слащавый, сентиментальный","def":"excessively sentimental","ex":"A mawkish film.","syn":"sentimental, maudlin","ant":"unsentimental"},{"w":"meager","pos":"adj","ipa":"/ˈmiːɡər/","uz":"oz, kam","ru":"скудный","def":"lacking in quantity or quality","ex":"A meager portion.","syn":"scant, paltry","ant":"abundant"},{"w":"mellifluous","pos":"adj","ipa":"/məˈlɪfluəs/","uz":"yoqimli, shirin ovozli","ru":"сладкозвучный","def":"sweet-sounding","ex":"A mellifluous voice.","syn":"melodious, smooth","ant":"harsh"},{"w":"mendacious","pos":"adj","ipa":"/mɛnˈdeɪʃəs/","uz":"yolg'onchi, aldamchi","ru":"лживый","def":"lying; untruthful","ex":"A mendacious witness.","syn":"dishonest, deceitful","ant":"truthful"},{"w":"mercenary","pos":"adj","ipa":"/ˈmɜːrsɪnɛri/","uz":"manfaatparast, pulparast","ru":"корыстный","def":"motivated only by money","ex":"A mercenary attitude.","syn":"greedy, venal","ant":"altruistic"},{"w":"mire","pos":"verb","ipa":"/ˈmaɪər/","uz":"botqoqqa botmoq, chigallashtirmoq","ru":"увязнуть, погрязнуть","def":"to entangle or get stuck","ex":"Mired in debt.","syn":"bog down, entangle","ant":"free"},{"w":"mollify","pos":"verb","ipa":"/ˈmɒlɪfaɪ/","uz":"tinchlantirmoq, yumshatmoq","ru":"смягчать, успокаивать","def":"to soothe or appease","ex":"She tried to mollify the angry client.","syn":"appease, pacify","ant":"provoke"},{"w":"munificent","pos":"adj","ipa":"/mjuːˈnɪfɪsənt/","uz":"saxiy, oliyhimmat","ru":"щедрый","def":"very generous","ex":"A munificent gift.","syn":"generous, lavish","ant":"stingy"},{"w":"myriad","pos":"adj","ipa":"/ˈmɪriəd/","uz":"son-sanoqsiz, juda ko'p","ru":"бесчисленный","def":"countless; very many","ex":"Myriad stars.","syn":"countless, innumerable","ant":"few"},{"w":"nascent","pos":"adj","ipa":"/ˈnæsənt/","uz":"endi paydo bo'layotgan","ru":"зарождающийся","def":"just beginning to develop","ex":"A nascent industry.","syn":"emerging, incipient","ant":"mature"},{"w":"nebulous","pos":"adj","ipa":"/ˈnɛbjələs/","uz":"noaniq, tumanli","ru":"туманный, неясный","def":"vague; unclear","ex":"A nebulous idea.","syn":"vague, hazy","ant":"clear"},{"w":"nefarious","pos":"adj","ipa":"/nɪˈfɛriəs/","uz":"jirkanch, qabih","ru":"гнусный, злодейский","def":"wicked; criminal","ex":"A nefarious scheme.","syn":"villainous, heinous","ant":"virtuous"},{"w":"negligible","pos":"adj","ipa":"/ˈnɛɡlɪdʒəbəl/","uz":"arzimas, e'tiborga olmasa bo'ladigan","ru":"незначительный","def":"so small as to be unimportant","ex":"A negligible difference.","syn":"insignificant, trivial","ant":"significant"},{"w":"novice","pos":"noun","ipa":"/ˈnɒvɪs/","uz":"yangi boshlovchi","ru":"новичок","def":"a beginner","ex":"A chess novice.","syn":"beginner, neophyte","ant":"expert"},{"w":"obfuscate","pos":"verb","ipa":"/ˈɒbfʌskeɪt/","uz":"chalkashtirmoq, qorong'ilashtirmoq","ru":"запутывать, затемнять","def":"to make unclear or confusing","ex":"Jargon obfuscates the point.","syn":"confuse, muddle","ant":"clarify"},{"w":"obsequious","pos":"adj","ipa":"/əbˈsiːkwiəs/","uz":"xushomadgo'y, laganbardor","ru":"подобострастный","def":"excessively obedient or flattering","ex":"An obsequious assistant.","syn":"servile, fawning","ant":"assertive"},{"w":"obstreperous","pos":"adj","ipa":"/əbˈstrɛpərəs/","uz":"shovqinli, itoatsiz","ru":"буйный, шумный","def":"noisy and unruly","ex":"An obstreperous child.","syn":"unruly, rowdy","ant":"docile"},{"w":"officious","pos":"adj","ipa":"/əˈfɪʃəs/","uz":"aralashuvchi, o'zini tutqun","ru":"назойливый, навязчивый","def":"meddlesome; overly eager to help","ex":"An officious clerk.","syn":"meddlesome, intrusive","ant":"reserved"},{"w":"onerous","pos":"adj","ipa":"/ˈoʊnərəs/","uz":"og'ir, mashaqqatli","ru":"обременительный","def":"burdensome","ex":"An onerous task.","syn":"burdensome, taxing","ant":"easy"}]},{"id":"sv25","title":"Academic words · Set 8","words":[{"w":"opportune","pos":"adj","ipa":"/ˌɒpərˈtuːn/","uz":"qulay, mos","ru":"подходящий, своевременный","def":"well-timed","ex":"An opportune moment.","syn":"timely, favorable","ant":"inopportune"},{"w":"ostracize","pos":"verb","ipa":"/ˈɒstrəsaɪz/","uz":"chetga surmoq, jamiyatdan chiqarmoq","ru":"подвергать остракизму, изгонять","def":"to exclude from a group","ex":"They ostracized the newcomer.","syn":"exclude, shun","ant":"welcome"},{"w":"palatable","pos":"adj","ipa":"/ˈpælətəbəl/","uz":"mazali, maqbul","ru":"приятный на вкус, приемлемый","def":"pleasant to taste or accept","ex":"A palatable meal.","syn":"agreeable, acceptable","ant":"distasteful"},{"w":"palpable","pos":"adj","ipa":"/ˈpælpəbəl/","uz":"sezilarli, aniq his qilinadigan","ru":"ощутимый, осязаемый","def":"able to be felt; obvious","ex":"Palpable tension.","syn":"tangible, obvious","ant":"intangible"},{"w":"panacea","pos":"noun","ipa":"/ˌpænəˈsiːə/","uz":"barcha dardlarga davo","ru":"панацея","def":"a supposed cure-all","ex":"No single panacea exists.","syn":"cure-all, remedy","ant":"—"},{"w":"paragon","pos":"noun","ipa":"/ˈpærəɡɒn/","uz":"namuna, ideal","ru":"образец, эталон","def":"a model of excellence","ex":"A paragon of virtue.","syn":"model, exemplar","ant":"—"},{"w":"partisan","pos":"adj","ipa":"/ˈpɑːrtɪzən/","uz":"tarafkash, biryoqlama","ru":"пристрастный, партийный","def":"strongly biased toward one side","ex":"A partisan crowd.","syn":"biased, one-sided","ant":"impartial"},{"w":"paucity","pos":"noun","ipa":"/ˈpɔːsɪti/","uz":"kamlik, tanqislik","ru":"нехватка","def":"smallness of quantity","ex":"A paucity of evidence.","syn":"scarcity, dearth","ant":"abundance"},{"w":"penchant","pos":"noun","ipa":"/ˈpɛntʃənt/","uz":"moyillik, mayl","ru":"склонность","def":"a strong liking or tendency","ex":"A penchant for risk.","syn":"inclination, fondness","ant":"aversion"},{"w":"penitent","pos":"adj","ipa":"/ˈpɛnɪtənt/","uz":"tavba qilgan, pushaymon","ru":"кающийся","def":"feeling regret for wrongdoing","ex":"A penitent apology.","syn":"remorseful, contrite","ant":"unrepentant"},{"w":"perfidious","pos":"adj","ipa":"/pərˈfɪdiəs/","uz":"xoin, sotqin","ru":"вероломный","def":"deceitful; treacherous","ex":"A perfidious ally.","syn":"treacherous, disloyal","ant":"faithful"},{"w":"permeate","pos":"verb","ipa":"/ˈpɜːrmieɪt/","uz":"singib o'tmoq, yoyilmoq","ru":"проникать, пропитывать","def":"to spread throughout","ex":"The smell permeated the house.","syn":"pervade, saturate","ant":"—"},{"w":"perspicacious","pos":"adj","ipa":"/ˌpɜːspɪˈkeɪʃəs/","uz":"zukko, o'tkir zehnli","ru":"проницательный","def":"having keen insight","ex":"A perspicacious observer.","syn":"shrewd, astute","ant":"obtuse"},{"w":"petulant","pos":"adj","ipa":"/ˈpɛtʃələnt/","uz":"injiq, jizzaki","ru":"раздражительный, капризный","def":"childishly irritable","ex":"A petulant complaint.","syn":"peevish, sulky","ant":"good-natured"},{"w":"philanthropy","pos":"noun","ipa":"/fɪˈlænθrəpi/","uz":"xayriya, insonparvarlik","ru":"филантропия, благотворительность","def":"charitable giving to others","ex":"A life of philanthropy.","syn":"charity, benevolence","ant":"selfishness"},{"w":"placid","pos":"adj","ipa":"/ˈplæsɪd/","uz":"osoyishta, xotirjam","ru":"спокойный, безмятежный","def":"calm and peaceful","ex":"A placid lake.","syn":"calm, serene","ant":"turbulent"},{"w":"platitude","pos":"noun","ipa":"/ˈplætɪtuːd/","uz":"umumiy gap, klishe","ru":"банальность","def":"a dull, overused statement","ex":"The speech was full of platitudes.","syn":"cliché, truism","ant":"originality"},{"w":"plethora","pos":"noun","ipa":"/ˈplɛθərə/","uz":"mo'l-ko'llik, ortiqcha","ru":"изобилие, избыток","def":"an excess; a large amount","ex":"A plethora of options.","syn":"abundance, surplus","ant":"scarcity"},{"w":"polarize","pos":"verb","ipa":"/ˈpoʊləraɪz/","uz":"qutblashtirmoq, ikkiga bo'lmoq","ru":"поляризовать, разделять","def":"to divide into opposing groups","ex":"The issue polarized voters.","syn":"divide, split","ant":"unite"},{"w":"precocious","pos":"adj","ipa":"/prɪˈkoʊʃəs/","uz":"erta rivojlangan, zukko","ru":"не по годам развитый","def":"showing early development","ex":"A precocious child.","syn":"advanced, gifted","ant":"backward"}]}],"reading":[{"id":"s1","title":"Reading set: Inference & implication","text":"Each task below contains its own short passage. Read it closely, then answer — this trains exactly the kind of reading you will meet in real academic texts and exams.\\n\\nQuyida har bir topshiriqning o'z qisqa matni bor. Diqqat bilan o'qing, so'ng javob bering.","quiz":[{"q":"Passage: 'Countries that have legalized and regulated cannabis markets have seen declines in cannabis purchases from illegal dealers in those regions. However, cross-border trafficking to neighboring areas where cannabis remains illegal has increased significantly in some cases.'\\n\\nThe passage most strongly suggests that","o":["Cannabis legalization is ineffective as a policy because illegal activity increases","Cannabis legalization reduces domestic illegal sales but may shift rather than eliminate some illegal trafficking","Legalizing cannabis eliminates all illegal drug trade activity","The effects of cannabis legalization on illegal markets vary depending on whether neighboring jurisdictions have also legalized"],"a":1,"e":"The passage shows: legal markets → fewer local illegal sales BUT MORE cross-border trafficking where it's illegal elsewhere. D accurately captures both effects: reduces domestic illegal sales but shifts (not eliminates) trafficking. A is an over-inference. B mischaracterizes (legal markets DO reduce local illegal sales). C is about what would happen with neighboring legalization — not directly stated.","d":"medium"},{"q":"Passage: 'The reintroduction of wolves to Yellowstone in 1995 produced cascading ecological effects. Elk populations declined and changed their grazing behavior, which allowed riverbank vegetation to recover. The returning vegetation stabilized banks, changed river flow patterns, and attracted beavers, whose dams created wetland habitats. Songbird and fish populations subsequently increased.'\\n\\nIt can most reasonably be inferred from the passage that","o":["Wolves directly improved water quality in Yellowstone's rivers","Beaver populations were zero in Yellowstone before wolf reintroduction","The removal of wolves had previously triggered a chain of ecological changes throughout the park","Elk are the primary threat to ecological balance in all natural parks"],"a":2,"e":"Since the REINTRODUCTION of wolves triggered positive cascading changes (elk behavior changed, vegetation recovered, rivers changed, beavers returned), it can be inferred that the REMOVAL of wolves had previously triggered the REVERSE chain — elk overgrazed, banks eroded, rivers changed, etc. B captures this logical reversal. A is not supported (water quality not mentioned). C is too broad. D is an over-inference (beavers may have been reduced, not necessarily zero).","d":"medium"},{"q":"Passage: 'Antibiotic resistance has emerged as a major threat to global health, with drug-resistant infections killing an estimated 700,000 people annually. Much of this resistance has developed because antibiotics have been prescribed for viral infections — against which they are entirely ineffective — or because patients fail to complete their full course of treatment.'\\n\\nThe passage most strongly implies that","o":["Completing a full course of antibiotics guarantees that resistance will not develop","Viruses will eventually become resistant to antibiotics as well","All antibiotic prescriptions are unnecessary and should be eliminated","Reducing inappropriate antibiotic use could help slow the development of resistance"],"a":3,"e":"The passage identifies two causes of resistance: prescribing for viruses AND incomplete courses. It follows logically that reducing these practices could slow resistance development. B directly follows. A is extreme (passage doesn't say all prescriptions are inappropriate). C is a biological misunderstanding (viruses can't develop antibiotic resistance). D over-infers (completion helps but doesn't guarantee resistance prevention).","d":"medium"},{"q":"Passage: 'Observations of chimpanzee groups in the wild have documented tool use, strategic deception, cultural transmission of behaviors across generations, and even rudimentary forms of political coalition-building. These findings have required researchers to revise earlier assumptions about what distinguishes human cognition from that of other primates.'\\n\\nFrom the passage, it can be inferred that researchers previously believed","o":["Observations of wild primates were not scientifically valid before these studies","Chimpanzees were incapable of any form of intelligent behavior","Chimpanzees and humans share a common ancestor but diverged significantly in cognitive ability","The behaviors observed in chimpanzees — tool use, deception, culture, and political behavior — were thought to be exclusively human"],"a":3,"e":"The passage says the findings 'required researchers to REVISE EARLIER ASSUMPTIONS about what distinguishes human cognition' — implying the earlier assumption was that these specific behaviors (tool use, deception, culture, coalition-building) DISTINGUISHED humans and were thought to be uniquely human. B captures this. A is too extreme (they didn't think chimps had NO intelligence). C is about ancestry (not mentioned). D is unsupported.","d":"medium"}]},{"id":"s2","title":"Reading set: Tone & perspective","text":"Each task below contains its own short passage. Read it closely, then answer — this trains exactly the kind of reading you will meet in real academic texts and exams.\\n\\nQuyida har bir topshiriqning o'z qisqa matni bor. Diqqat bilan o'qing, so'ng javob bering.","quiz":[{"q":"Passage: 'Renewable energy capacity has grown dramatically in recent years. Solar installations increased globally by 45% in 2023 alone, while wind capacity additions reached a new record. These developments are genuinely encouraging. Nevertheless, fossil fuels still account for approximately 80% of global energy consumption, and emissions continue to rise. The pace of the energy transition, impressive in absolute terms, remains deeply insufficient relative to what climate science indicates is necessary to limit warming to 1.5°C.'\\n\\nThe author's attitude toward the renewable energy transition is best described as","o":["Neutral, presenting both positive and negative data without taking a position","Enthusiastically celebratory of renewable energy's rapid growth","Deeply pessimistic that the energy transition will ever succeed","Cautiously concerned — acknowledging genuine progress while emphasizing that the pace remains inadequate for climate goals"],"a":3,"e":"Evaluative language: 'genuinely encouraging' (positive) + 'deeply insufficient relative to what climate science indicates is necessary' (concern). The structure — acknowledge progress, then emphasize inadequacy — produces CAUTIOUS CONCERN. C is correct. A is wrong (the author doesn't stop at encouragement). B is wrong (the progress is genuine). D is wrong (the passage is not neutral — it takes a clear position on adequacy).","d":"medium"},{"q":"Passage: 'Dr. Semmelweis published his findings demonstrating that handwashing reduced maternal mortality by more than 80%. His colleagues dismissed his work, continued their contaminated practices, and Semmelweis died in an asylum — ironically, from an infection. The medical establishment he had sought to enlighten took another generation to accept what he had already proven. When we speak of 'evidence-based medicine' today, we would do well to remember that the evidence can be readily available and the medicine still catastrophically wrong.'\\n\\nThe author's attitude toward the medical establishment's rejection of Semmelweis's findings is best described as","o":["Sharply critical, with the irony of Semmelweis's death used to intensify the critique","Sympathetically understanding of why doctors might resist new evidence","Cautiously optimistic that modern medicine has learned from this mistake","Neutral and objective, presenting the historical facts without judgment"],"a":0,"e":"'The medical establishment he had sought to enlighten took another generation to accept' is already critical. 'Ironically, from an infection' uses irony to sharpen the critique dramatically. The final sentence ('evidence can be readily available and the medicine still catastrophically wrong') maintains the critical tone. B is correct. A is wrong (no sympathy for the establishment). C is wrong (the language is evaluative and critical, not neutral). D is wrong (the final sentence warns that the problem persists, not that it's been learned from).","d":"medium"},{"q":"Passage: 'It has become fashionable in some quarters to argue that the humanities are in 'crisis' — that declining enrollments, reduced funding, and employer skepticism signal their irrelevance in a technology-driven economy. This narrative is overdrawn. Humanities graduates demonstrate strong performance in critical thinking, written communication, and ethical reasoning — skills that employers consistently rank among their highest priorities. The crisis, to the extent it is real, is one of perception and marketing, not of value.'\\n\\nThe author's perspective on the humanities 'crisis' is best described as","o":["Neutral, presenting arguments both for and against the relevance of the humanities","Alarmed by the genuine decline in humanities enrollment and funding","Nostalgic for an era when the humanities were more central to university education","Skeptical of the crisis narrative, arguing that the humanities' value remains intact even if their public perception has suffered"],"a":3,"e":"The author directly dismisses the 'crisis' narrative as 'overdrawn' and provides evidence for humanities graduates' value. The final characterization — crisis of 'perception and marketing, not of value' — shows the author believes the value is real but the image is damaged. B is correct. A is wrong (the author rejects the alarm). C is wrong (the author takes a clear position). D is wrong (no nostalgia is expressed).","d":"medium"},{"q":"Passage: 'The global ocean conveyor belt — the system of deep and surface currents that redistributes heat around the planet — has shown measurable signs of slowing. Computer models have long predicted this as a consequence of freshwater input from melting glaciers. The potential consequences of significant slowdown include dramatic temperature changes in Northern Europe, disruption of monsoon systems, and sea level rise along certain coastlines. Scientists are careful to note that the current evidence, while concerning, does not indicate imminent collapse — but the direction of change is unambiguous.'\\n\\nThe author's attitude toward ocean conveyor belt slowdown is best described as","o":["Dismissive of the evidence, noting that scientists themselves are not alarmed","Enthusiastically reporting that the science on this issue is now settled","Measured concern — noting the signs and potential consequences while accurately reflecting scientific caution about overstatement","Alarmist, predicting imminent catastrophic collapse"],"a":2,"e":"The passage notes 'measurable signs' and 'potential consequences' (expressing concern) but explicitly notes scientists say 'evidence... does not indicate imminent collapse' (reflecting appropriate caution). The tone precisely mirrors scientific epistemic standards: concerned but not alarmist. B is correct. A is wrong (the author explicitly says scientists don't predict imminent collapse). C is wrong (the evidence is presented as 'concerning'). D is wrong (the author presents ongoing uncertainty, not settled science).","d":"medium"}]},{"id":"s3","title":"Reading set: Cross-text analysis","text":"Each task below contains its own short passage. Read it closely, then answer — this trains exactly the kind of reading you will meet in real academic texts and exams.\\n\\nQuyida har bir topshiriqning o'z qisqa matni bor. Diqqat bilan o'qing, so'ng javob bering.","quiz":[{"q":"Text 1: 'The human memory is fundamentally reconstructive, not reproductive. Each time a memory is retrieved, it is rebuilt from fragments and can be altered by subsequent experience, suggestion, and expectation. This means eyewitness testimony is inherently unreliable as legal evidence.'\\n\\nText 2: 'While memory is subject to distortion, the degree of unreliability varies considerably with conditions. Highly distinctive, emotionally salient events are encoded and retained more accurately than ordinary ones. Eyewitness testimony for peripheral details is indeed unreliable, but testimony about the central action in a violent crime may be quite accurate.'\\n\\nHow would the author of Text 2 most likely respond to the argument in Text 1?","o":["By agreeing that eyewitness testimony should never be used as legal evidence","By arguing that legal reforms have already addressed the problem of unreliable eyewitness testimony","By disputing the claim that human memory is reconstructive rather than reproductive","By arguing that Text 1 overgeneralizes — the reliability of eyewitness testimony varies by emotional significance and detail type"],"a":3,"e":"Text 2 acknowledges memory distortion ('while memory is subject to distortion') but argues reliability VARIES — emotionally salient events are more accurate, and central actions more reliable than peripheral details. This directly challenges Text 1's blanket conclusion that eyewitness testimony is 'inherently unreliable.' B is correct. A is wrong (Text 2 argues testimony CAN be reliable). C is wrong (Text 2 doesn't dispute reconstruction — it accepts it but argues it varies). D is wrong (legal reforms not mentioned).","d":"medium"},{"q":"Text 1: 'The concept of 'natural' in food marketing has no scientific basis. 'Natural' flavors can be chemically identical to 'artificial' ones; the difference lies in source, not structure. Regulatory agencies in most countries have declined to define the term, making 'natural' on a food label legally meaningless.'\\n\\nText 2: 'Consumer preference for 'natural' products, however scientifically unfounded, is a real and powerful market signal. Companies that ignore it do so at commercial risk. The interesting question is not whether 'natural' is scientifically meaningful but why consumers have developed such strong preferences for naturalness — what psychological and cultural functions the concept serves.'\\n\\nHow would the author of Text 1 most likely respond to the focus of Text 2?","o":["By conceding that the scientific meaninglessness of 'natural' is less important than its cultural significance","By suggesting that regulatory agencies should study consumer psychology before defining 'natural'","By arguing that Text 2's acceptance of consumer preferences as a 'market signal' ignores the harm caused by misleading marketing that exploits those preferences","By agreeing that consumer psychology is the most important lens for understanding 'natural' food labeling"],"a":2,"e":"Text 1's concern is that 'natural' is misleading and scientifically meaningless. If Text 2 accepts consumer preference as a 'market signal' to be catered to, Text 1's author would argue: this ignores the problem that companies are exploiting a psychologically real but scientifically false belief. B captures this response. A is wrong (Text 1 is critical of the 'natural' concept, not interested in its psychology). C is wrong (Text 1 doesn't concede cultural significance trumps scientific accuracy). D is wrong (not stated).","d":"medium"},{"q":"Text 1: 'Long-form journalism — deeply reported, book-length magazine features — is in crisis. Digital platforms reward brevity and engagement metrics. Advertisers follow eyeballs. The economic incentives that once sustained thousand-word investigations have largely dissolved.'\\n\\nText 2: 'The apparent crisis of long-form journalism is a crisis of the legacy advertising model, not of audience appetite. Newsletter platforms, reader-supported journalism, and podcast adaptations of long-form reporting have found substantial audiences willing to pay directly for in-depth work. The business model has changed; the form may survive.'\\n\\nBased on Text 2, how would its author most likely respond to the argument in Text 1?","o":["By suggesting that brief content is preferable to long-form journalism for modern audiences","By arguing that Text 1 conflates the crisis of the advertising model with the fate of long-form journalism as a form, and that direct-support models suggest the form can persist","By arguing that government subsidy is the only path to saving long-form journalism","By agreeing that long-form journalism is disappearing because of digital platforms"],"a":1,"e":"Text 2 explicitly says the crisis is 'of the legacy advertising model, not of audience appetite' — directly responding to Text 1's claim that 'economic incentives have dissolved.' Text 2 argues new models (newsletters, direct support) can sustain the form. B accurately captures this reframe. A is wrong (Text 2 argues the form can survive). C is wrong (Text 2 says audience appetite for long-form remains). D is wrong (Text 2 doesn't mention government subsidy).","d":"medium"}]},{"id":"s4","title":"Reading set: Rhetorical synthesis","text":"Each task below contains its own short passage. Read it closely, then answer — this trains exactly the kind of reading you will meet in real academic texts and exams.\\n\\nQuyida har bir topshiriqning o'z qisqa matni bor. Diqqat bilan o'qing, so'ng javob bering.","quiz":[{"q":"Notes:\\n• Coffee was first cultivated in Ethiopia around the 9th century CE\\n• Coffee spread to the Arabian Peninsula by the 15th century\\n• First European coffeehouses opened in the 17th century\\n• Coffee is now the second most traded commodity globally after crude oil\\n• Approximately 2 billion cups of coffee are consumed worldwide each day\\n\\nThe student wants to introduce the topic by establishing the global significance of coffee consumption.\\n\\nWhich choice most effectively uses relevant information from the notes?","o":["With approximately 2 billion cups consumed daily, coffee is the second most traded commodity in the world after crude oil, making it one of the most globally significant agricultural products.","Coffee was first cultivated in Ethiopia around the 9th century CE before spreading to the Arabian Peninsula and then Europe.","European coffeehouses, which first opened in the 17th century, played an important role in the development of intellectual and commercial culture.","Coffee has a rich history spanning more than a thousand years, from its origins in Ethiopia to its current global presence."],"a":0,"e":"The goal is to establish GLOBAL SIGNIFICANCE. B uses the two most impactful statistics: 2 billion cups daily AND second most traded commodity — both directly establish significance. A only covers the historical spread (not significance). C focuses on coffeehouses (historical context, not global significance). D is vague and doesn't use specific data to establish significance.","d":"medium"},{"q":"Notes:\\n• Polar ice sheets contain approximately 68% of Earth's fresh water\\n• If all polar ice melted, sea levels would rise approximately 70 meters\\n• Current sea level rise: about 3.6 mm per year\\n• 2023 was the hottest year on record globally\\n• Arctic sea ice extent hit a record low in September 2023\\n\\nThe student wants to support the claim that recent climate data reflects accelerating change.\\n\\nWhich choice most effectively uses relevant information from the notes?","o":["The record global temperatures of 2023 and the concurrent record low Arctic sea ice extent represent evidence of accelerating change in Earth's climate systems.","If all polar ice melted, sea levels would rise approximately 70 meters — a scenario that would threaten most coastal cities worldwide.","Polar ice sheets hold approximately 68% of Earth's fresh water, meaning their complete melting would raise sea levels by approximately 70 meters.","Sea levels are currently rising at approximately 3.6 millimeters per year, and polar ice sheets contain approximately 68% of Earth's fresh water."],"a":0,"e":"The goal is to support 'accelerating change' using RECENT DATA. B uses 2023 record temperatures and record low Arctic sea ice — both from 2023 and explicitly described as 'accelerating change.' A uses the ice volume and sea level rise potential — not recent trend data. C uses current sea level rise rate and ice volume — not the most recent record-breaking data. D projects the total melt scenario — future speculation, not recent trend evidence.","d":"medium"},{"q":"Notes:\\n• Library of Congress holds approximately 173 million items\\n• Founded in 1800; originally served US Congress\\n• Now open to the public — no library card required for on-site research\\n• Holds the first map to use the name 'America' (1507)\\n• Holds Stradivari violins and active string quartet performances\\n\\nThe student wants to emphasize the Library of Congress's unexpected breadth — that it holds far more than books and documents.\\n\\nWhich choice most effectively uses relevant information from the notes?","o":["Founded in 1800, the Library of Congress holds approximately 173 million items and has evolved from a congressional resource to a public institution.","While the Library of Congress holds the historic 1507 map that first named 'America,' its collections extend far beyond historical documents to include Stradivari violins — instruments still used in active performances hosted by the institution.","The Library of Congress holds 173 million items and is open to the public without requiring a library card for on-site research.","The Library of Congress, founded in 1800 to serve the US Congress, has grown into a public research institution holding approximately 173 million items."],"a":1,"e":"The goal is to emphasize 'unexpected breadth — far more than books and documents.' B presents a progression from a historical document (expected) to Stradivari violins used in live performances (unexpected, non-documentary) — the contrast shows the unexpected breadth perfectly. A focuses on history and size but doesn't show the non-documentary breadth. C mentions size and public access but not the surprising range of collections. D is historical but doesn't show the unexpected breadth.","d":"medium"},{"q":"Notes:\\n• Bees pollinate approximately 1/3 of the world's food supply\\n• Global bee populations have declined 30% in the last decade\\n• Neonicotinoid pesticides are linked to bee disorientation and colony collapse\\n• Urban beekeeping has increased 200% in the past five years\\n• Some urban environments have higher bee health than rural agricultural areas\\n\\nThe student wants to present a surprising finding that complicates the narrative of universal bee decline.\\n\\nWhich choice most effectively uses relevant information from the notes?","o":["Counterintuitively, some urban environments now support healthier bee populations than adjacent rural agricultural areas — a finding that complicates the narrative of universal decline.","Urban beekeeping has increased by 200% in the past five years, reflecting growing public awareness of the importance of pollinators.","Bees pollinate approximately one-third of the world's food supply, making their documented 30% population decline over the past decade a serious concern for global agriculture.","Neonicotinoid pesticides, widely used in agricultural settings, have been linked to the bee disorientation and colony collapse that have contributed to the 30% population decline."],"a":0,"e":"The goal is to present a SURPRISING FINDING that COMPLICATES the universal decline narrative. C uses the urban/rural health comparison and explicitly frames it as counterintuitive — directly serving the 'complicates the narrative' goal. A presents the decline narrative rather than complicating it. B explains causes of the decline — doesn't complicate the narrative. D notes urban beekeeping growth but doesn't present the surprising health finding.","d":"medium"}]}],"listening":[{"id":"l1","title":"Lecture: The Aral Sea","script":"Good afternoon, everyone. Today I want to talk about one of the most dramatic environmental transformations of the twentieth century: the shrinking of the Aral Sea. Once the fourth-largest lake in the world, it lost over ninety percent of its volume within two generations, after the rivers that fed it were diverted to irrigate cotton fields. The consequences reached far beyond the shoreline. Fishing towns like Moynaq found themselves dozens of kilometres from the water, and dust storms began carrying salt across the region, affecting agriculture and public health. Yet the story is not only one of loss. In recent years, cooperation on the Kazakh side led to the construction of a dam that has partially revived the northern basin, and fish have returned to some waters. Scientists now treat the Aral as a case study — a warning about short-term planning, but also evidence that determined intervention can reverse at least part of the damage.","quiz":[{"q":"What caused the Aral Sea to shrink?","o":["Climate change alone","Rivers were diverted for irrigation","An earthquake changed its basin","Overfishing removed its ecosystem"],"a":1,"e":"The lecturer says the rivers that fed it were diverted to irrigate cotton fields.","d":"medium"},{"q":"What does the speaker say about Moynaq?","o":["It was flooded by the sea","It became a major port","It ended up far from the water","It built the northern dam"],"a":2,"e":"Fishing towns like Moynaq found themselves dozens of kilometres from the water.","d":"medium"},{"q":"Why does the speaker mention the northern dam?","o":["To criticise cotton farming","To show partial recovery is possible","To explain the dust storms","To compare two lakes"],"a":1,"e":"The dam partially revived the northern basin — evidence that intervention can reverse damage.","d":"hard"},{"q":"The speaker's overall tone is best described as…","o":["entirely pessimistic","angry and accusing","balanced — warning plus hope","humorous"],"a":2,"e":"The story is 'not only one of loss': a warning, but also evidence of recovery.","d":"hard"}]},{"id":"l2","title":"Interview: Studying abroad","script":"Interviewer: You spent four years studying in another country. What surprised you most? — Speaker: Honestly, it wasn't the language or the weather. It was how differently people approached disagreement. In my first seminar, a student openly challenged the professor's interpretation, and instead of taking offence, the professor thanked him and adjusted her argument. Where I grew up, questioning a teacher in public would have felt disrespectful. It took me a full semester to realise that debate was not an attack but a form of participation — and another semester to actually join in. — Interviewer: And did that change you? — Speaker: Completely. I still value politeness, but I no longer confuse silence with respect. If I disagree now, I say so — carefully, with evidence, but I say so. I think that skill has helped my career more than any single course I took.","quiz":[{"q":"What surprised the speaker most abroad?","o":["The difficult language","The attitude to disagreement","The cost of living","The weather"],"a":1,"e":"It wasn't language or weather — it was how differently people approached disagreement.","d":"medium"},{"q":"How did the professor react to being challenged?","o":["She was offended","She ignored the student","She thanked him and adjusted her argument","She ended the seminar"],"a":2,"e":"Instead of taking offence, the professor thanked him.","d":"medium"},{"q":"What does the speaker mean by 'I no longer confuse silence with respect'?","o":["Silence is always rude","Respect requires agreement","Staying quiet is not the only way to show respect","Speaking loudly shows confidence"],"a":2,"e":"He still values politeness but now expresses disagreement carefully — silence isn't the only respectful option.","d":"hard"},{"q":"Which skill does the speaker say helped his career most?","o":["Fluent writing","Constructive disagreement","Time management","Public speaking"],"a":1,"e":"\\"That skill has helped my career more than any single course\\" — voicing disagreement with evidence.","d":"hard"}]},{"id":"l3","title":"Podcast: How polyglots learn","script":"Welcome back to the show. Our topic today: what do successful language learners actually do differently? We interviewed thirty people who each speak five or more languages, and three patterns kept appearing. First, none of them waited to feel ready. They started speaking from day one, tolerating mistakes that would make most learners blush. Second, they built the language into their routine instead of adding it on top: podcasts while commuting, shopping lists in the target language, a diary of three sentences every night. The effort felt almost invisible, which is precisely why it survived busy weeks. And third — this one surprised us — they were selective about vocabulary. Rather than memorising long lists, they tracked words they had personally needed and missed in real conversations. One participant put it beautifully: a word you needed yesterday is worth twenty words you might need someday.","quiz":[{"q":"How many patterns did the researchers identify?","o":["Two","Three","Five","Thirty"],"a":1,"e":"Three patterns kept appearing.","d":"medium"},{"q":"What did polyglots do 'from day one'?","o":["Memorise word lists","Take formal exams","Start speaking","Hire tutors"],"a":2,"e":"None of them waited to feel ready — they started speaking from day one.","d":"medium"},{"q":"Why did routine-based learning survive busy weeks?","o":["It was scheduled by teachers","The effort felt almost invisible","It was rewarded with prizes","It required no materials"],"a":1,"e":"Built into the routine, the effort felt almost invisible — so it survived.","d":"hard"},{"q":"Which words did polyglots prioritise?","o":["The most frequent 1,000 words","Words from academic lists","Words they personally needed and missed","Words that are easy to spell"],"a":2,"e":"They tracked words they had needed and missed in real conversations.","d":"hard"}]}],"speaking":[{"id":"s1","title":"Nuanced opinion","prompt":"To what extent does language shape the way we think? Speak for two minutes.","seconds":120,"tips":["Hedge: arguably, to some degree…","Cite an example or study you know.","Distinguish correlation from causation."]},{"id":"s2","title":"Impromptu defence","prompt":"Defend an opinion you personally disagree with, convincingly.","seconds":120,"tips":["Steel-man the position.","Use concessive clauses: while it may seem…","Maintain a persuasive register."]},{"id":"s3","title":"Abstract description","prompt":"Describe the feeling of learning something difficult, without naming the skill.","seconds":90,"tips":["Rich metaphor and imagery.","Vary sentence rhythm.","Land on a resonant closing line."]}],"writing":[{"id":"w1","title":"Discursive essay","prompt":"Write 220–260 words: 'Universal basic income is inevitable.' Discuss with reference to work, technology, and society.","min":220,"max":300,"hints":["Frame the debate before taking a side.","Acknowledge complexity; avoid absolutes.","Use precise, low-frequency vocabulary naturally."]},{"id":"w2","title":"A proposal","prompt":"Write a 220–260 word proposal to your city council for improving public spaces.","min":220,"max":300,"hints":["Sections: Aim, Current situation, Proposal, Benefits.","Persuasive but measured tone.","Anticipate objections."]}]}}]`),Ap=[{b:"A1",q:"He ___ to school every day.",o:["go","goes","going","went"],a:1,skill:"grammar"},{b:"A1",q:"I ___ a student.",o:["is","are","am","be"],a:2,skill:"grammar"},{b:"A1",q:"There ___ two books on the table.",o:["is","are","am","be"],a:1,skill:"grammar"},{b:"A1",q:"She ___ like coffee.",o:["don't","doesn't","isn't","not"],a:1,skill:"vocabulary"},{b:"A2",q:"We ___ to the beach last summer.",o:["go","goes","went","gone"],a:2,skill:"grammar"},{b:"A2",q:"If it rains, I ___ at home.",o:["stay","will stay","stayed","staying"],a:1,skill:"grammar"},{b:"A2",q:"This book is ___ than that one.",o:["interesting","more interesting","most interesting","interestinger"],a:1,skill:"grammar"},{b:"A2",q:"I have lived here ___ 2010.",o:["for","since","from","at"],a:1,skill:"vocabulary"},{b:"B1",q:"She asked me ___ I had finished.",o:["that","if","what","which"],a:1,skill:"grammar"},{b:"B1",q:"By the time we arrived, the film ___.",o:["started","has started","had started","was starting"],a:2,skill:"grammar"},{b:"B1",q:"I'm not used to ___ early.",o:["get up","getting up","got u
