 will cost too much","no one will attend"],"a":1,"e":"They fear promises will once again be broken.","d":"medium"}]}],"speaking":[{"id":"s1","title":"Arguing a position","prompt":"Should social media be regulated? Argue your position for 90 seconds.","seconds":90,"tips":["State your thesis in one sentence.","Concede one opposing point, then refute it.","Use linkers: nevertheless, what's more…"]},{"id":"s2","title":"Describing change","prompt":"How has your country changed in the last ten years?","seconds":90,"tips":["Trends: there has been a steady rise in…","Contrast past and present.","Speculate about the future."]},{"id":"s3","title":"Job interview","prompt":"Answer: 'Tell me about a challenge you overcame.'","seconds":90,"tips":["STAR: situation, task, action, result.","Keep it concrete.","Finish with what you learned."]},{"id":"s4","title":"Hypothetical","prompt":"If you could change one law, what would it be and why?","seconds":75,"tips":["Conditionals: If … were…, I would…","Justify with consequences.","Address a counter-argument."]},{"id":"s5","title":"Explaining a process","prompt":"Explain how something you know well works, to a beginner.","seconds":90,"tips":["Passive voice: it is heated / it gets stored…","Sequence: initially, subsequently, finally.","Check understanding: in other words…"]},{"id":"s6","title":"Culture","prompt":"What should a visitor know about your culture before arriving?","seconds":90,"tips":["Tend to / are likely to…","Give do's and don'ts.","Explain one custom's origin."]}],"writing":[{"id":"w1","title":"Opinion essay","prompt":"Write 140–180 words: 'Cities should ban private cars from their centres.' Do you agree?","min":140,"max":200,"hints":["Clear thesis in paragraph one.","One paragraph per argument.","Concede and refute a counter-argument."]},{"id":"w2","title":"A report","prompt":"Write a 140–180 word report on how students in your school use technology, with a recommendation.","min":140,"max":200,"hints":["Use headings: Introduction, Findings, Recommendation.","Passive voice where natural.","Quantify: the majority of…, one in three…"]},{"id":"w3","title":"A complaint","prompt":"Write a formal complaint (140–180 words) about a product that arrived damaged.","min":140,"max":200,"hints":["State facts and dates precisely.","Firm but polite register.","Say exactly what you expect to happen."]},{"id":"w4","title":"An article","prompt":"Write a magazine article (140–180 words): 'Three habits that changed my life.'","min":140,"max":200,"hints":["Hook the reader in line one.","One vivid example per habit.","End with encouragement."]}]}},{"id":"C1","name":"Advanced","tagline":"Master advanced English","weeks":16,"skills":{"grammar":[{"id":"g1","title":"Inversion for emphasis","lead":"Advanced English uses inversion — putting the auxiliary before the subject — to add drama and formality. It is common in writing, speeches, and formal speaking.","leadTr":{"uz":"Ilg'or ingliz tilida urg'u berish uchun inversiya ishlatiladi — yordamchi fe'l egadan oldin keladi. Bu yozma nutq va rasmiy uslubda ko'p uchraydi.","ru":"В продвинутом английском для усиления используется инверсия — вспомогательный глагол ставится перед подлежащим. Это характерно для письменной и формальной речи."},"situation":"","blocks":[{"h":"Negative adverbials","p":["After never, rarely, seldom, little, no sooner, not only — invert subject and auxiliary."],"ex":["Never have I seen such dedication.","Not only did she win, but she also broke the record."]},{"h":"Conditionals without 'if'","p":["Had / Should / Were can replace 'if' in formal conditionals."],"ex":["Had I known, I would have called.","Should you need anything, ask."]},{"h":"So / Such … that","p":["So + adjective and Such + noun phrase can open the sentence with inversion."],"ex":["So intense was the storm that flights stopped.","Such was the noise that nobody slept."]}],"tip":"Inversion is a spice, not a staple — one per paragraph is plenty.","examples":["Rarely does a film capture a book so well.","Little did they know what awaited them.","No sooner had we arrived than it started to rain."],"mistakes":[{"x":"Never I have seen such a thing.","v":"Never have I seen such a thing — auxiliary before subject."},{"x":"Not only she sings, but she dances.","v":"Not only does she sing, but she also dances."}],"quiz":[{"q":"___ had the meeting started when the fire alarm rang.","o":["No sooner","Not only","Rarely","Should"],"a":0,"e":"No sooner had X happened than Y — paired with 'than'.","d":"hard"},{"q":"___ you require assistance, our team is available around the clock.","o":["Were","Should","Had","So"],"a":1,"e":"Should = if, in formal conditionals: Should you require…","d":"hard"},{"q":"Not only ___ the deadline, she exceeded every target.","o":["she met","met she","did she meet","she did meet"],"a":2,"e":"After 'not only' use auxiliary + subject + verb: did she meet.","d":"hard"},{"q":"___ was the demand that the servers crashed.","o":["So","Such","Never","Little"],"a":1,"e":"Such + was + noun phrase: Such was the demand that…","d":"hard"},{"q":"Had I known about the traffic, I ___ earlier.","o":["would leave","left","would have left","had left"],"a":2,"e":"Had I known = If I had known → would have left (third conditional).","d":"hard"}]},{"id":"g2","title":"Cleft sentences","lead":"Cleft sentences (It was… that…, What I need is…) split one message into two clauses to control emphasis — a hallmark of fluent, natural English.","leadTr":{"uz":"Cleft gaplar (It was… that…, What I need is…) bitta fikrni ikki qismga bo'lib, urg'uni boshqaradi — bu ravon ingliz tilining belgisi.","ru":"Расщеплённые предложения (It was… that…, What I need is…) делят одну мысль на две части, управляя акцентом — признак свободного владения языком."},"situation":"","blocks":[{"h":"It-clefts","p":["Emphasise who, what, when or where with It + be + focus + that/who."],"ex":["It was Maria who solved it.","It was in 2019 that everything changed."]},{"h":"Wh-clefts","p":["What + clause + be + focus emphasises the thing itself."],"ex":["What I need is a long holiday.","What annoyed me was the silence afterwards."]},{"h":"All-clefts","p":["All + clause + be + focus means 'the only thing'."],"ex":["All I asked for was five minutes.","All it takes is practice."]}],"tip":"In speech, wh-clefts buy you thinking time while sounding sophisticated.","examples":["It's the small details that matter.","What makes her different is her patience.","All we can do is wait."],"mistakes":[{"x":"It was Maria which solved it.","v":"Use who for people: It was Maria who solved it."},{"x":"What I need it is a holiday.","v":"No extra pronoun: What I need is a holiday."}],"quiz":[{"q":"___ the ending that ruined the film for me.","o":["What was","It was","All was","That was"],"a":1,"e":"It-cleft: It was + focus + that…","d":"hard"},{"q":"What impressed the panel ___ her honesty.","o":["was","were","it was","that was"],"a":0,"e":"Wh-cleft takes singular be: What impressed them was…","d":"hard"},{"q":"___ I'm saying is that we need more time.","o":["All","What","It","Such"],"a":1,"e":"What I'm saying is… — emphasising the message.","d":"medium"},{"q":"It was only when I reread the letter ___ I understood.","o":["when","which","that","then"],"a":2,"e":"It-cleft closes with that: …that I understood.","d":"hard"}]},{"id":"g3","title":"The subjunctive & formal structures","lead":"Formal English preserves the subjunctive after verbs like suggest, demand, insist — and fixed phrases like 'be that as it may'. Mastering it lifts your writing register instantly.","leadTr":{"uz":"Rasmiy ingliz tilida suggest, demand, insist kabi fe'llardan keyin subjunktiv saqlanadi. Uni egallash yozuv uslubingizni darhol ko'taradi.","ru":"Формальный английский сохраняет сослагательное наклонение после глаголов suggest, demand, insist. Владение им сразу повышает регистр письма."},"situation":"","blocks":[{"h":"Mandative subjunctive","p":["After suggest/recommend/demand/insist + that, use the base form for all persons."],"ex":["They insisted that she be present.","We recommend that he take the earlier train."]},{"h":"Formal fixed phrases","p":["Some subjunctives survive only in set expressions."],"ex":["Be that as it may…","Suffice it to say…","Far be it from me to judge."]},{"h":"Were-subjunctive","p":["Use 'were' for all persons in hypotheticals."],"ex":["If I were in your position…","I wish it were simpler."]}],"tip":"In American English the mandative subjunctive is standard; British English often uses 'should' instead — both are correct.","examples":["The board demanded that the report be rewritten.","It is essential that every voice be heard.","If he were honest, he'd admit it."],"mistakes":[{"x":"They suggested that he goes home.","v":"Base form after suggest: …that he go home."},{"x":"If I was you, I'd wait.","v":"Hypothetical: If I were you, I'd wait."}],"quiz":[{"q":"The committee insisted that the policy ___ reviewed annually.","o":["is","be","was","were"],"a":1,"e":"Mandative subjunctive: insisted that it be reviewed.","d":"hard"},{"q":"It is vital that she ___ informed immediately.","o":["is","was","be","will be"],"a":2,"e":"It is vital that + base form: …that she be informed.","d":"hard"},{"q":"I wish it ___ possible to be in two places at once.","o":["was","is","were","be"],"a":2,"e":"Wish + were-subjunctive: I wish it were possible.","d":"medium"}]},{"id":"p1","title":"Colons & dashes","lead":"Colons introduce and dashes interrupt — both add sophistication when used precisely, and both are tested mercilessly in formal writing. Master the exact rules.","leadTr":{"uz":"Ikki nuqta kiritadi, tire esa to'xtatadi — ikkalasi ham aniq ishlatilganda uslubni boyitadi. Aniq qoidalarni o'zlashtiring.","ru":"Двоеточие вводит, тире прерывает — оба знака делают стиль изящнее при точном использовании. Освойте точные правила."},"situation":"","blocks":[],"tip":"","examples":[],"mistakes":[],"quiz":[{"q":"Text: 'The study identified three major risk factors[___] poor diet, sedentary lifestyle, and chronic stress.'\\n\\nWhich choice correctly completes the text?","o":[";",",",":","—"],"a":2,"e":"An independent clause ('The study identified three major risk factors') followed by a list. D (:) correctly introduces the list. Both colon and dash would work, but in formal writing a colon is preferred.","d":"medium"},{"q":"Text: 'The scientist[___]who had spent 30 years researching the topic[___]finally announced her breakthrough.'\\n\\nWhich choice correctly uses dashes?","o":["comma and comma","dash and comma","dash and dash","no punctuation"],"a":2,"e":"'Who had spent 30 years researching the topic' is parenthetical information. Em dashes must appear in PAIRS: 'The scientist—who had spent 30 years...—finally announced.' D is correct.","d":"medium"},{"q":"Text: 'Her conclusion was simple[___] the current model was fundamentally flawed.'\\n\\nWhich choice correctly completes the text?","o":[";","—",":",","],"a":2,"e":"'Her conclusion was simple' is an independent clause. A colon or dash can introduce the explanation that follows. D (:) is correct (formal). C (—) also works. Both D and C are valid — D is preferred in formal contexts.","d":"medium"},{"q":"Text: 'The award[___]which had never before been given to a non-citizen[___]recognized her lifetime contributions.'\\n\\nWhich choice correctly uses dashes?","o":["comma and comma","no punctuation","dash and dash","semicolon and comma"],"a":2,"e":"Em dashes must appear in PAIRS around parenthetical information. B (dash and dash) is correct: 'The award—which had never...non-citizen—recognized...'","d":"medium"},{"q":"Text: 'The new policy accomplished one crucial thing[___]it gave low-income families access to affordable healthcare.'\\n\\nWhich choice correctly completes the text?","o":["—",",",";",":"],"a":3,"e":"'The new policy accomplished one crucial thing' is a complete independent clause. A colon introduces the explanation. C (:) is correct. D (em dash) would also work. Both are valid; C is the formal choice.","d":"medium"},{"q":"Text: 'Three cities were considered for the summit[___]Geneva, Singapore, and Nairobi.'\\n\\nWhich choice correctly completes the text?","o":[";",":","—",","],"a":1,"e":"Complete independent clause followed by a list. D (:) is correct. C (—) would also work but the colon is more formal.","d":"medium"},{"q":"Text: 'The expedition[___]the first of its kind in over fifty years[___]attracted international media attention.'\\n\\nWhich choice correctly uses dashes?","o":["no punctuation","comma and comma","dash and dash","semicolon and comma"],"a":2,"e":"Parenthetical information in the middle of a sentence requires em dashes in PAIRS. C (dash and dash) is correct.","d":"medium"},{"q":"Text: 'One conclusion emerged from the data[___]the intervention was only effective for adolescents.'\\n\\nWhich choice correctly completes the text?","o":[":",";","—",","],"a":0,"e":"Complete clause + explanation. C (:) is correct. B (—) also works. C preferred in formal writing.","d":"medium"},{"q":"Text: 'The architect designed three landmark buildings[___]the concert hall, the public library, and the civic center.'\\n\\nWhich choice correctly completes the text?","o":[",",":","—","no punctuation"],"a":1,"e":"Complete clause followed by a list of explanatory items. C (:) is correct. B (—) also works.","d":"medium"},{"q":"Text: 'The company's success depended on[___]innovation, strategic partnerships, and market timing.'\\n\\nWhich choice correctly completes the text?","o":[",","no punctuation","—",":"],"a":1,"e":"Colon CANNOT follow a preposition ('on'). D (no punctuation) is correct: 'depended on innovation, strategic partnerships, and market timing.'","d":"medium"},{"q":"Text: 'The finding had one major implication[___]the standard treatment needed to be revised.'\\n\\nWhich choice correctly completes the text?","o":["no punctuation",":",",","—"],"a":1,"e":"Complete clause + implication explained. C (:) is correct. B (—) also valid. C is formal choice.","d":"medium"},{"q":"Text: 'The committee was divided[___]half supported the proposal, and half opposed it.'\\n\\nWhich choice correctly completes the text?","o":["—",",",":","no punctuation"],"a":2,"e":"'The committee was divided' is a complete clause. A colon introduces an explanation. B (:) is correct. A (em dash) would also work.","d":"medium"}]},{"id":"p2","title":"Apostrophes & possession","lead":"Its or it's? Students' or student's? The apostrophe is small but ruthless. These exercises cover possession, contractions and the classic traps.","leadTr":{"uz":"Its yoki it's? Students' yoki student's? Apostrof kichik, lekin shafqatsiz. Bu mashqlar egalik, qisqartma va klassik tuzoqlarni qamrab oladi.","ru":"Its или it's? Students' или student's? Апостроф мал, но беспощаден. Здесь — принадлежность, сокращения и классические ловушки."},"situation":"","blocks":[],"tip":"","examples":[],"mistakes":[],"quiz":[{"q":"Text: 'The company released [___] annual sustainability report last month.'\\n\\nWhich choice correctly completes the text?","o":["it's","its","its'","it has"],"a":1,"e":"'Its' = possessive (belonging to the company). Expand test: 'released it is annual report' → nonsense → use 'its' (no apostrophe). B is correct.","d":"medium"},{"q":"Text: 'The professors [___] lectures on quantum mechanics attracted students from across the university.'\\n\\nWhich choice correctly completes the text?","o":["professors's","professor's","professors'","professors"],"a":2,"e":"Multiple professors → plural → plural possessive: 'professors'' (apostrophe after the s). B is correct. A would mean one professor. C doubles the s — never correct.","d":"medium"},{"q":"Text: 'The researcher presented [___] findings to a panel of international experts.'\\n\\nWhich choice correctly completes the text?","o":["her","her's","hers","hers'"],"a":2,"e":"'Hers' is already a possessive pronoun — no apostrophe needed. C is correct. 'Her's' and 'hers'' are not real words.","d":"medium"},{"q":"Text: 'Despite [___] best efforts, the team could not replicate the original experiment's results.'\\n\\nWhich choice correctly completes the text?","o":["they're","their","they are","there"],"a":1,"e":"'Their' = possessive pronoun (belonging to them). B is correct. A = they are. C = location. D is the expanded form of A.","d":"medium"},{"q":"Text: 'The study examined the [___] responses to the new curriculum across three age groups.'\\n\\nWhich choice correctly completes the text?","o":["childrens'","children's","childrens","children"],"a":1,"e":"'Children' is an irregular plural (does not end in s). Possessive = add 's: 'children's.' A is correct.","d":"medium"},{"q":"Text: 'The committee reviewed all six [___] proposals before making its final decision.'\\n\\nWhich choice correctly completes the text?","o":["candidates","candidate's","candidates'","candidate"],"a":2,"e":"Multiple candidates (all six) → plural possessive: 'candidates'' (apostrophe after s). B is correct.","d":"medium"},{"q":"Text: 'The [___] new initiative focuses on reducing carbon emissions.'\\n\\nWhich choice correctly completes the text?","o":["government's","governments'","government","governments"],"a":0,"e":"One government → singular possessive: 'government's.' A is correct.","d":"medium"},{"q":"Text: '[___] been over a decade since the discovery was first announced.'\\n\\nWhich choice correctly completes the text?","o":["Its'","It's","Its","Thats"],"a":1,"e":"'It's been...' = 'It has been...' — a contraction. B (it's) is correct. A (its) is possessive, not a contraction.","d":"medium"},{"q":"Text: 'The scientist [___] research on deep-sea organisms earned her international recognition.'\\n\\nWhich choice correctly completes the text?","o":["whos","whose","whos'","who's"],"a":1,"e":"'Whose' = possessive relative pronoun (the scientist's research). B is correct. A (who's) = 'who is' — expand test: 'the scientist who is research...' → nonsense.","d":"medium"},{"q":"Text: 'The two [___] offices share the same building but operate completely independently.'\\n\\nWhich choice correctly completes the text?","o":["departmentss","departments","departments'","department's"],"a":2,"e":"Two departments → plural → plural possessive: 'departments'' (apostrophe after s). B is correct.","d":"medium"},{"q":"Text: 'The [___] impact on the local ecosystem was studied for three years.'\\n\\nWhich choice correctly completes the text?","o":["factory's","factorys","factories","factories'"],"a":3,"e":"Multiple factories (implied by context) → plural possessive: 'factories'' (apostrophe after s, irregular plural formed with -ies). A is correct.","d":"medium"},{"q":"Text: 'The company announced that [___] expanding operations to three new markets.'\\n\\nWhich choice correctly completes the text?","o":["it has","it's","its'","its"],"a":1,"e":"'It's expanding' = 'it is expanding' — a contraction. B (it's) is correct.","d":"medium"}]},{"id":"p3","title":"Sentence boundaries","lead":"Run-ons and fragments are the two ways a sentence can fail. Learn to detect where one complete thought ends and the next must begin.","leadTr":{"uz":"Qo'shilib ketgan gaplar va chala gaplar — gap buzilishining ikki yo'li. Bitta to'liq fikr qayerda tugashini va keyingisi qayerda boshlanishi kerakligini aniqlashni o'rganing.","ru":"Слипшиеся предложения и фрагменты — два способа сломать предложение. Учитесь видеть, где заканчивается одна законченная мысль и должна начаться следующая."},"situation":"","blocks":[],"tip":"","examples":[],"mistakes":[],"quiz":[{"q":"Which version is a comma splice?","o":["The data was compelling, so the board approved the project immediately.","The data was compelling; the board approved the project immediately.","The data was compelling, the board approved the project immediately.","Because the data was compelling, the board approved the project immediately."],"a":2,"e":"B joins two independent clauses with only a comma — a comma splice.","d":"medium"},{"q":"Which version is a run-on?","o":["The weather delayed the launch, and engineers rescheduled for the following week.","The weather delayed the launch engineers rescheduled for the following week.","Although the weather delayed the launch, engineers rescheduled for the following week.","The weather delayed the launch; engineers rescheduled for the following week."],"a":1,"e":"B has two independent clauses with no punctuation or connector — a fused run-on.","d":"medium"},{"q":"Text: 'The novel received mixed reviews upon publication[___] it is now considered a masterpiece of twentieth-century literature.'\\n\\nWhich choice correctly completes the text?","o":["; however,",",","no punctuation","because"],"a":0,"e":"Two contrasting independent clauses. '; however,' correctly shows contrast with semicolon before and comma after.","d":"medium"},{"q":"Which version is a sentence fragment?","o":["After years of painstaking research.","The scientist published her findings last month.","The board reviewed all proposals carefully.","The experiment yielded unexpected results."],"a":0,"e":"B — 'After years of painstaking research' — is a dependent clause with no main clause. Fragment.","d":"medium"},{"q":"Text: 'Solar panels have become significantly cheaper over the past decade[___] many households that previously could not afford them can now install them.'\\n\\nWhich choice correctly completes the text?","o":[",","no punctuation",";",", and"],"a":2,"e":"Two independent clauses. C (semicolon) correctly joins them. A = comma splice. D = run-on.","d":"medium"},{"q":"Which version correctly fixes the fragment 'Discovered in a remote cave in southern France'?","o":["The paintings, discovered in a remote cave in southern France, date back 30,000 years.","Discovered in a remote cave in southern France the paintings date back 30,000 years.","Discovered in a remote cave in southern France, to date back 30,000 years.","Discovered in a remote cave in southern France; the paintings date back 30,000 years."],"a":0,"e":"B attaches the participial phrase to the main sentence: 'The paintings... date back 30,000 years.' Correct sentence structure.","d":"medium"},{"q":"Text: 'The researchers worked around the clock[___] they were determined to publish before the competing team.'\\n\\nWhich choice correctly completes the text?","o":[", because","no punctuation",";",","],"a":2,"e":"Two independent clauses. C (semicolon) is correct. A = comma splice. D = run-on.","d":"medium"},{"q":"Which version is a fragment?","o":["After the team analyzed all available data, it reached a conclusion.","Having analyzed all available data.","The team analyzed all available data and reached a conclusion.","Having analyzed all available data, the team reached a definitive conclusion."],"a":1,"e":"B is only a participial phrase — no subject, no main verb. Fragment.","d":"medium"},{"q":"Text: 'The population has been declining for years[___] conservationists have been unable to determine the primary cause.'\\n\\nWhich choice correctly completes the text?","o":["; yet,",", and",",","no punctuation"],"a":0,"e":"Contrast: declining but cause unknown. '; yet,' shows contrast with proper semicolon + comma punctuation.","d":"medium"},{"q":"Which version is NOT a fragment?","o":["Although the researchers worked for three years.","The test results were inconclusive, but the study continued.","To determine the cause of the anomaly.","Because the test results were inconclusive."],"a":1,"e":"C has a subject ('the study') and a main verb ('continued'). A, B are dependent clauses alone. D is an infinitive phrase alone.","d":"medium"},{"q":"Text: 'The bridge was structurally sound[___] city engineers ordered it closed after residents reported unusual vibrations.'\\n\\nWhich choice correctly completes the text?","o":[",",", and","no punctuation","; nevertheless,"],"a":3,"e":"Sound but still closed — contrast. '; nevertheless,' correctly shows the contrast.","d":"medium"},{"q":"Which version correctly rewrites 'The experiment was a success. Which proved that the hypothesis was correct.' to eliminate the fragment?","o":["The experiment was a success; which proved that the hypothesis was correct.","The experiment was a success, it proved that the hypothesis was correct.","The experiment was a success. That proved that the hypothesis was correct.","The experiment was a success, which proved that the hypothesis was correct."],"a":3,"e":"A attaches 'which proved...' as a nonrestrictive relative clause — no longer a fragment. B incorrectly uses semicolon before a relative clause (not an independent clause). D is a comma splice.","d":"medium"}]},{"id":"p4","title":"Modifiers & parallelism","lead":"'Walking to work, the rain started' — who was walking? Dangling modifiers and broken parallel structures are subtle errors that mark the difference between B2 and C1 writing.","leadTr":{"uz":"'Walking to work, the rain started' — kim yurayotgan edi? Noto'g'ri bog'langan aniqlovchilar va buzilgan parallel tuzilmalar B2 va C1 yozuvini ajratib turadigan nozik xatolardir.","ru":"'Walking to work, the rain started' — кто шёл? Висячие обороты и нарушенный параллелизм — тонкие ошибки, отличающие письмо C1 от B2."},"situation":"","blocks":[],"tip":"","examples":[],"mistakes":[],"quiz":[{"q":"Which version correctly fixes the dangling modifier?","o":["The samples, returning from the field, were carefully labeled.","Returning from the field, the samples were carefully labeled by the team.","The team's samples returning from the field were carefully labeled.","Returning from the field, the team carefully labeled the samples."],"a":3,"e":"'Returning from the field' — who returned? The team. Subject after comma must be 'the team.' B is correct.","d":"medium"},{"q":"Which version is correctly parallel?","o":["The CEO was praised for her vision, her work ethic, and her willingness to take bold risks.","The CEO was praised for having vision, her work ethic, and taking bold risks.","The CEO was praised for her vision, her work ethic, and taking bold risks.","The CEO was praised for vision, her work ethic, and that she took bold risks."],"a":0,"e":"B: three parallel noun phrases — 'her vision, her work ethic, her willingness.' All possessive noun phrases. A mixes nouns and a gerund. C and D mix forms.","d":"medium"},{"q":"Which version corrects the dangling modifier 'Having examined the patient, the diagnosis was made'?","o":["Having examined the patient, the diagnosis was made.","The patient, having been examined, the diagnosis was made.","A diagnosis was made, having examined the patient.","Having examined the patient, the doctor made a diagnosis."],"a":3,"e":"'Having examined the patient' — the doctor examined. B: subject after comma = 'the doctor.' Correct.","d":"medium"},{"q":"Which version is NOT correctly parallel?","o":["She enjoys reading novels, watching films, and hiking trails.","He is talented, dedicated, and works very hard.","The course covers theory, practice, and application.","The study was comprehensive, rigorous, and well-documented."],"a":1,"e":"B mixes adjectives (talented, dedicated) with a verb phrase (works very hard). Should be: 'talented, dedicated, and hardworking.'","d":"medium"},{"q":"Which placement of 'nearly' gives the meaning that almost all homes were affected?","o":["The storm destroyed every home nearly in the neighborhood.","Nearly the storm destroyed every home in the neighborhood.","The storm nearly destroyed every home in the neighborhood.","The storm destroyed nearly every home in the neighborhood."],"a":3,"e":"B: 'nearly every home' — 'nearly' directly modifies 'every home.' A: 'nearly destroyed' means the storm came close to destroying. B is correct for the intended meaning.","d":"medium"},{"q":"Which version uses 'not only...but also' correctly?","o":["The vaccine not only preventing the disease but also reduces its severity.","The vaccine not only prevents the disease but also it reduces severity.","The vaccine not only prevents the disease but also reducing its severity.","The vaccine not only prevents the disease but also reduces its severity."],"a":3,"e":"B: 'not only PREVENTS...but also REDUCES' — both base verbs, parallel. A ends with a gerund. C begins with a gerund. D adds 'it' unnecessarily.","d":"medium"},{"q":"Which version corrects the misplaced modifier?","o":["On paper plates, she served cake to the children.","She served to the children cake on paper plates.","She served cake on paper plates to the children.","She served cake to the children on paper plates."],"a":2,"e":"'On paper plates' should modify 'cake' (the cake was on paper plates, not the children). C: 'cake on paper plates to the children' — modifier is adjacent to 'cake.' Correct.","d":"medium"},{"q":"Which version corrects the dangling modifier 'Written during the Great Depression, readers found the novel deeply moving'?","o":["Readers found the novel, written during the Great Depression, deeply moving.","Written during the Great Depression, readers found the novel deeply moving.","Written during the Great Depression, the novel was found deeply moving by readers.","The novel, written during the Great Depression, readers found deeply moving."],"a":0,"e":"'Written during the Great Depression' modifies 'the novel.' C places the modifier immediately after 'the novel' as a nonrestrictive element — correct. B also works. C is cleaner.","d":"medium"},{"q":"Which version makes a correct parallel comparison?","o":["Both B and C are correct.","The population of Tokyo is larger than New York's.","The population of Tokyo is larger than New York.","The population of Tokyo is larger than the population of New York."],"a":0,"e":"B (Tokyo's population vs. New York's) and C (Tokyo's population vs. New York's population) both correctly compare population to population. D is correct.","d":"medium"},{"q":"Which correctly fixes the dangling modifier 'To pass the course, regular attendance is required'?","o":["Both B and C are correct.","To pass the course, students must attend regularly.","To pass the course, regular attendance is required.","Regular attendance is required to pass the course."],"a":0,"e":"A is a dangling modifier (attendance doesn't pass courses; students do). B fixes the subject. C restructures. Both B and C are correct. D is the answer.","d":"medium"},{"q":"'The scientist observed the samples using a high-powered microscope.' The modifier 'using a high-powered microscope' is ambiguous. Which revision is clearest?","o":["Using a high-powered microscope, the scientist observed the samples.","Using a high-powered microscope, the samples were observed by the scientist.","The scientist, using a high-powered microscope, observed the samples.","Both B and C are correct."],"a":3,"e":"B and C both correctly attach 'using a high-powered microscope' to 'the scientist' (the person using the microscope). Both are clear and grammatically correct. D is the answer.","d":"medium"},{"q":"Which version uses 'both...and' correctly?","o":["The policy is both controversial and wide criticism has followed.","The policy is both controversial and widely criticized.","The policy is both controversial and it has been widely criticized.","The policy both is controversial and widely criticized."],"a":1,"e":"B: 'both CONTROVERSIAL and WIDELY CRITICIZED' — both adjective phrases parallel. A mixes adjective and clause. C is awkward. D mixes adjective and clause.","d":"medium"}]},{"id":"p5","title":"Words in context","lead":"Advanced texts choose words for precision, not decoration. Use the logic of the passage — contrast, cause, tone — to select the word that fits exactly.","leadTr":{"uz":"Murakkab matnlar so'zni bezak uchun emas, aniqlik uchun tanlaydi. Matn mantig'idan — qarama-qarshilik, sabab, ohang — foydalanib, aynan mos so'zni tanlang.","ru":"Сложные тексты выбирают слова ради точности, а не украшения. Опирайтесь на логику текста — контраст, причину, тон — чтобы выбрать точное слово."},"situation":"","blocks":[],"tip":"","examples":[],"mistakes":[],"quiz":[{"q":"Text: 'Critics have questioned whether canonical works of Western literature adequately represent human diversity, or whether the canon merely reflects the prejudices of those who codified it.'\\n\\nAs used in the text, 'codified' most nearly means","o":["encoded in secret form","simplified for general audiences","arranged into a systematic body of rules or standards","described in critical essays"],"a":2,"e":"The canon was 'codified' — established and systematized into a recognized body of works. 'Codified' = arranged into a formal system or set of standards.","d":"medium"},{"q":"Text: 'The speaker's tone was measured throughout the debate, conveying neither the contempt her critics expected nor the enthusiasm her supporters hoped for.'\\n\\nAs used in the text, 'measured' most nearly means","o":["carefully controlled and restrained","determined by assessment","quantified precisely","equal in all respects"],"a":0,"e":"The tone was moderate — neither contemptuous nor enthusiastic. 'Measured' here = carefully controlled and restrained. 'Quantified' is a different sense entirely.","d":"medium"},{"q":"Text: 'The proposed reforms enjoyed broad popular support but faced sustained resistance from entrenched interests in the legislature who stood to lose influence if the changes were implemented.'\\n\\nAs used in the text, 'entrenched' most nearly means","o":["publicly criticized","connected through financial ties","firmly established and resistant to change","recently installed in power"],"a":2,"e":"'Entrenched interests' = deeply established and resistant to change. They've long held their positions. 'Recently installed' is the opposite meaning.","d":"medium"},{"q":"Text: 'The novelist's prose style has been described as austere, stripped of ornamentation and reliant on plain declarative sentences that place the weight of meaning on individual words.'\\n\\nAs used in the text, 'austere' most nearly means","o":["morally rigorous","financially constrained","severely simple and without decoration","harsh and unpleasant in tone"],"a":2,"e":"'Austere' prose is stripped of ornamentation — severely simple. B captures this. 'Morally rigorous' applies to people or conduct, not prose style.","d":"medium"},{"q":"Text: 'The startup's rapid expansion was celebrated, but observers who scrutinized its financial filings noted that profitability remained elusive despite record revenue growth.'\\n\\nAs used in the text, 'elusive' most nearly means","o":["secretive or deliberately hidden","difficult to define","present only in small amounts","not yet achieved despite efforts"],"a":3,"e":"Profitability 'remained elusive' despite efforts — it was not yet obtained. 'Elusive' = difficult to achieve or attain. 'Secretive' is wrong. 'Present in small amounts' is wrong.","d":"medium"},{"q":"Text: 'The historian carefully distinguished between primary sources — documents produced at the time of the events — and secondary sources, which interpret and synthesize primary materials.'\\n\\nAs used in the text, 'synthesize' most nearly means","o":["combine elements into a coherent whole","criticize using multiple perspectives","copy directly without attribution","produce artificially in a laboratory"],"a":0,"e":"'Synthesize primary materials' = combine and integrate them into a unified analysis. The chemistry meaning (produce artificially) doesn't apply in this academic writing context.","d":"medium"},{"q":"Text: 'The administration's position on the treaty was ambiguous: official statements seemed to support ratification, but unnamed officials suggested the president harbored significant reservations.'\\n\\nAs used in the text, 'harbored' most nearly means","o":["held privately within oneself","acquired through study","concealed from authorities","expressed openly in public"],"a":0,"e":"The president 'harbored reservations' = held or maintained them internally, without expressing them publicly. 'Concealed from authorities' implies illegality, which doesn't fit.","d":"medium"},{"q":"Text: 'The peacock's elaborate tail is described as a 'costly signal' — a feature so metabolically expensive to produce that its very existence demonstrates the fitness of the individual bearing it.'\\n\\nAs used in the text, 'costly' most nearly means","o":["requiring significant biological resources","financially expensive to acquire","emotionally burdensome","rare and therefore valuable"],"a":0,"e":"'Metabolically expensive' is the context — the passage itself clarifies the sense. 'Costly' here means requiring significant biological/metabolic resources, not money.","d":"medium"},{"q":"Text: 'The scientist's reputation, once sterling, was tarnished by the revelation that several of her most celebrated findings could not be replicated by independent researchers.'\\n\\nAs used in the text, 'tarnished' most nearly means","o":["damaged or diminished in quality","temporarily misunderstood","physically corroded by chemicals","completely destroyed"],"a":0,"e":"'Tarnished reputation' = damaged, made less bright — a metaphor from metal tarnishing. 'Completely destroyed' is too strong; the passage says 'tarnished,' not 'destroyed.'","d":"medium"},{"q":"Text: 'The committee's findings were tentative, acknowledging that available data was insufficient to support definitive conclusions and calling for further investigation.'\\n\\nAs used in the text, 'tentative' most nearly means","o":["intended as temporary","excessively cautious","based on incomplete research","not fully committed or certain"],"a":3,"e":"'Tentative findings' = preliminary, not fully established, open to revision. 'Not fully committed or certain' captures this. 'Intended as temporary' misses the certainty/confidence aspect.","d":"medium"},{"q":"Text: 'The anthropologist argued that gift-giving in this culture was not merely ceremonial but served to articulate and reinforce complex social hierarchies among participants.'\\n\\nAs used in the text, 'articulate' most nearly means","o":["express or give form to something","speak clearly and expressively","connect mechanically","break down into component parts"],"a":0,"e":"Gift-giving 'articulates' social hierarchies — expresses and makes them manifest. 'Speak clearly' is the adjective/adverb meaning applied to a person, not to a cultural practice.","d":"medium"},{"q":"Text: 'The researcher noted that the initial findings were suggestive but not conclusive, warranting replication before they could be incorporated into clinical guidelines.'\\n\\nAs used in the text, 'warranting' most nearly means","o":["justifying or necessitating","providing official documentation for","guaranteeing a positive outcome","legally authorizing"],"a":0,"e":"The findings 'warrant replication' = require/justify replication before clinical use. 'Legally authorizing' is the legal warranty sense, which doesn't fit an academic context.","d":"medium"}]},{"id":"p6","title":"Concision & precision","lead":"Strong English says more with fewer words. Spot redundancy, cut empty phrases, and keep the sentence's full meaning intact.","leadTr":{"uz":"Kuchli ingliz tili kam so'z bilan ko'p ma'no beradi. Ortiqchalikni toping, bo'sh iboralarni olib tashlang, gapning to'liq ma'nosini saqlang.","ru":"Сильный английский говорит больше меньшим числом слов. Находите избыточность, убирайте пустые фразы, сохраняя полный смысл."},"situation":"","blocks":[],"tip":"","examples":[],"mistakes":[],"quiz":[{"q":"Text: 'The council decided to postpone and delay the vote until a later date in the future.'\\n\\nWhich choice most effectively revises the sentence to eliminate unnecessary repetition?","o":["The council decided to postpone the vote.","The council decided to later postpone and delay the vote.","The council decided to postpone and delay the vote to a future date.","The council decided to postpone and delay the vote until a later date in the future."],"a":0,"e":"'Postpone' and 'delay' are synonyms (redundant pair). 'Until a later date in the future' — 'later date' and 'in the future' both mean the same thing, and 'postpone' already implies moving to a future time. B keeps only the essential meaning.","d":"medium"},{"q":"Text: 'The reason the project failed was because the team lacked adequate resources.'\\n\\nWhich choice most effectively revises the underlined portion?","o":["The reason the project failed was that the team lacked adequate resources.","The reason for which the project failed was because the team lacked in adequate resources.","The reason the project failed was because the team lacked adequate resources.","The project failed due to the fact that there was a lack of adequate resources on the team."],"a":0,"e":"'The reason was because' is redundant — 'because' already introduces a reason. The correct form is 'the reason was that.' B makes this correction. A keeps the error. C adds 'due to the fact that' (wordy). D is grammatically awkward and keeps 'because.'","d":"medium"},{"q":"Text: 'The completely exhausted marathon runners finally crossed the finish line at the end of the race.'\\n\\nWhich revision most effectively eliminates redundancy?","o":["The marathon runners, who were exhausted, finally crossed the finish line at the end of the race.","The completely exhausted marathon runners finally crossed the finish line at the end of the race.","The completely exhausted and very tired marathon runners finally crossed the finish line at the end of the race.","The exhausted marathon runners crossed the finish line."],"a":3,"e":"'Completely exhausted' — 'completely' is a meaningless intensifier (you're either exhausted or you're not). 'At the end of the race' is implied by 'crossing the finish line.' B removes both. A keeps both. C adds 'and very tired' (redundant with exhausted). D keeps 'at the end of the race.'","d":"medium"},{"q":"Text: 'Due to the fact that the medication has the ability to cause serious side effects, patients should consult their doctors.'\\n\\nWhich revision is most concise without losing meaning?","o":["Because the medication can cause serious side effects, patients should consult their doctors.","Due to the fact that the medication has the ability to cause serious side effects, patients should consult their doctors.","As a result of the fact that the medication possesses the ability to cause serious side effects, patients should consult with their doctors.","The medication has the ability to cause serious side effects, which is the reason why patients should consult their doctors."],"a":0,"e":"'Due to the fact that' → 'because' | 'has the ability to' → 'can.' B applies both concisions. A keeps both wordy phrases. C replaces one wordy phrase with an even wordier one. D keeps 'has the ability to' and adds 'which is the reason why.'","d":"medium"},{"q":"Text: 'Scientists made an unexpected and surprising discovery about the origins of the universe.'\\n\\nWhich revision eliminates the redundancy?","o":["Scientists made a surprising discovery about the origins of the universe.","Scientists made an unexpected and surprising discovery about the origins of the universe.","Scientists made a very unexpected discovery that was surprising about the origins of the universe.","Scientists made a discovery that was both unexpected and also surprising about the origins of the universe."],"a":0,"e":"'Unexpected' and 'surprising' are synonyms when describing a discovery — a redundant pair. B keeps just 'surprising.' A keeps both. C adds 'very' and rephrases awkwardly. D adds 'both...and also' (more words, same redundancy).","d":"medium"},{"q":"Text: 'The new policy will help facilitate the improvement of working conditions for employees at the company.'\\n\\nWhich is the most concise revision?","o":["The new policy has the ability to help in the facilitation of improvements to employee working conditions.","The new policy will facilitate the improvement and betterment of working conditions for all employees at the company.","The new policy will help improve working conditions for employees.","The new policy will help facilitate the improvement of working conditions for employees at the company."],"a":2,"e":"'Help facilitate the improvement of' → 'help improve' (three words become two). 'At the company' is contextually implied when talking about a company policy. B is maximally concise. A is wordy. C adds 'betterment' (redundant with improvement). D is much wordier.","d":"medium"},{"q":"Text: 'The ancient ruins, which were old and dated back thousands of years, attracted tourists from around the world.'\\n\\nWhich revision is most effective?","o":["The ancient ruins, which were old and dated back thousands of years, attracted tourists from around the world.","The ancient ruins, which dated back thousands of years, attracted tourists from around the world.","The old, ancient ruins, which were thousands of years old, attracted tourists from around the world.","The ruins, which were ancient and dated back many thousands of years into the past, attracted tourists from around the world."],"a":1,"e":"'Ancient ruins which were old' — 'ancient' and 'old' are redundant. 'Dated back thousands of years' shows age, making 'which were old' doubly redundant. B removes 'which were old' and 'ancient' (keeping 'ancient' in the main noun is actually better than the clause). A keeps all redundancies. C has 'old, ancient' (redundant pair). D has 'many thousands of years into the past' ('into the past' is redundant with 'dated back').","d":"medium"},{"q":"Text: 'In the event that the experiment produces unexpected results, researchers should document and record all observations.'\\n\\nWhich revision is most concise?","o":["In the event that the experiment produces unexpected results, researchers need to make documentation and recordings of all observations.","Should the experiment produce results that are unexpected in nature, researchers ought to document and record their observations.","If the experiment produces unexpected results, researchers should document all observations.","In the event that the experiment produces unexpected results, researchers should document and record all observations."],"a":2,"e":"'In the event that' → 'if' (4 words → 1). 'Document and record' — redundant pair; 'document' includes recording. B applies both concisions. A keeps both. C adds 'in nature' and 'ought to document and record.' D keeps 'in the event that' and adds 'make documentation and recordings.'","d":"medium"},{"q":"Text: 'The athlete was able to successfully complete the marathon in under three hours.'\\n\\nWhich revision eliminates the redundancy?","o":["The athlete was able to and did successfully complete the marathon in under three hours.","The athlete was able to successfully complete the marathon in under three hours.","The athlete completed the marathon in under three hours.","The athlete was successful in being able to complete the marathon in a time under three hours."],"a":2,"e":"'Was able to' and 'successfully' are both implied by 'complete' — if you complete something, you were able to do it and you did it successfully. B strips both. A keeps both. C adds 'in a time under' (wordy). D adds 'and did.'","d":"medium"},{"q":"Text: 'The report's findings were both important and significant to the future advancement of the field.'\\n\\nWhich is the most effective revision?","o":["The report's findings were significant for the advancement of the field.","The report's findings were important, significant, and consequential for the future of the field.","The report's findings were both important and significant to the future advancement of the field.","The report's findings were very important and quite significant for the future advancement of the field."],"a":0,"e":"'Important and significant' — redundant pair. 'Future advancement' — 'advancement' implies moving forward (future is redundant). B removes the redundant pair and 'future.' A keeps both. C adds a third synonym ('consequential'). D adds intensifiers ('very,' 'quite').","d":"medium"},{"q":"Text: 'The new bridge design incorporates several different features that are unique and one-of-a-kind.'\\n\\nWhich revision is most effective?","o":["The new bridge design incorporates features that are unique, one-of-a-kind, and unlike any other.","The new bridge design, which is new, incorporates several different and varied unique features.","The new bridge design incorporates several unique features.","The new bridge design incorporates several different features that are unique and one-of-a-kind."],"a":2,"e":"'Different' is redundant with 'several' (several already implies differences). 'Unique' and 'one-of-a-kind' are synonyms. 'That are' is a wordy relative clause replaceable by an adjective. B strips all: 'several unique features.' A keeps all redundancies. C triples the synonyms. D adds 'which is new' (already in 'new bridge design') and 'different and varied.'","d":"medium"},{"q":"Text: 'The novel is widely considered one of the greatest and most celebrated achievements in American literature.'\\n\\nWhich choice eliminates the redundancy most effectively?","o":["one of the greatest, most celebrated, and most acclaimed achievements in American literature","one of the greatest achievements in American literature","one of the very greatest and widely celebrated achievements in American literature","one of the greatest and most celebrated achievements in American literature"],"a":1,"e":"'Greatest' and 'most celebrated' overlap in meaning as superlative praise — using both is redundant. B keeps only 'greatest.' A keeps both. C adds a third ('most acclaimed'). D adds 'very' and 'widely.'","d":"medium"}]}],"vocabulary":[{"id":"v1","title":"Precision & nuance","words":[{"w":"ubiquitous","pos":"adj","ipa":"/juːˈbɪkwɪtəs/","uz":"hamma joyda uchraydigan","ru":"вездесущий","def":"present or found everywhere","ex":"Smartphones have become ubiquitous."},{"w":"ambivalent","pos":"adj","ipa":"/æmˈbɪvələnt/","uz":"ikkilangan","ru":"двойственный","def":"having mixed feelings","ex":"She felt ambivalent about the move."},{"w":"scrutinise","pos":"v","ipa":"/ˈskruːtənaɪz/","uz":"sinchiklab tekshirmoq","ru":"тщательно изучать","def":"to examine very carefully","ex":"Auditors scrutinised every transaction."},{"w":"tenuous","pos":"adj","ipa":"/ˈtenjuəs/","uz":"zaif, asossiz","ru":"слабый, шаткий","def":"very weak or slight","ex":"The link between the events is tenuous."},{"w":"exacerbate","pos":"v","ipa":"/ɪɡˈzæsəbeɪt/","uz":"og'irlashtirmoq","ru":"усугублять","def":"to make a problem worse","ex":"Panic buying exacerbated the shortage."},{"w":"pragmatic","pos":"adj","ipa":"/præɡˈmætɪk/","uz":"amaliy","ru":"прагматичный","def":"dealing with things practically","ex":"We need a pragmatic solution, not theory."},{"w":"salient","pos":"adj","ipa":"/ˈseɪliənt/","uz":"eng muhim","ru":"существенный","def":"most noticeable or important","ex":"Summarise the salient points."},{"w":"mitigate","pos":"v","ipa":"/ˈmɪtɪɡeɪt/","uz":"yumshatmoq","ru":"смягчать","def":"to make less severe","ex":"Trees mitigate the heat in cities."},{"w":"candid","pos":"adj","ipa":"/ˈkændɪd/","uz":"ochiqko'ngil, samimiy","ru":"откровенный","def":"truthful and straightforward","ex":"She was candid about her doubts."},{"w":"resilient","pos":"adj","ipa":"/rɪˈzɪliənt/","uz":"bardoshli","ru":"стойкий","def":"able to recover quickly from difficulty","ex":"She is remarkably resilient."}]},{"id":"sv18","title":"Academic words · Set 1","words":[{"w":"bombastic","pos":"adj","ipa":"/bɒmˈbæstɪk/","uz":"dabdabali, balandparvoz","ru":"напыщенный","def":"high-sounding but with little meaning","ex":"His bombastic speech impressed no one.","syn":"pompous, grandiose","ant":"restrained"},{"w":"brazen","pos":"adj","ipa":"/ˈbreɪzən/","uz":"uyatsiz, dadil","ru":"наглый, бесстыдный","def":"bold and without shame","ex":"A brazen attempt to cheat.","syn":"shameless, bold","ant":"timid"},{"w":"buttress","pos":"verb","ipa":"/ˈbʌtrəs/","uz":"mustahkamlamoq, qo'llab-quvvatlamoq","ru":"подкреплять","def":"to support or strengthen","ex":"Columns buttress the wall.","syn":"support, reinforce","ant":"undermine"},{"w":"cajole","pos":"verb","ipa":"/kəˈdʒoʊl/","uz":"shirin so'z bilan ko'ndirmoq","ru":"уговаривать, упрашивать","def":"to persuade by flattery","ex":"She cajoled him into helping.","syn":"coax, wheedle","ant":"coerce"},{"w":"capitulate","pos":"verb","ipa":"/kəˈpɪtʃəleɪt/","uz":"taslim bo'lmoq","ru":"капитулировать, сдаваться","def":"to surrender","ex":"The army capitulated.","syn":"surrender, yield","ant":"resist"},{"w":"castigate","pos":"verb","ipa":"/ˈkæstɪɡeɪt/","uz":"qattiq tanqid qilmoq","ru":"сурово критиковать","def":"to criticize severely","ex":"The coach castigated the team.","syn":"rebuke, reprimand","ant":"praise"},{"w":"catalyst","pos":"noun","ipa":"/ˈkætəlɪst/","uz":"katalizator, turtki","ru":"катализатор","def":"something that causes change","ex":"The crisis was a catalyst for reform.","syn":"spur, trigger","ant":"—"},{"w":"caustic","pos":"adj","ipa":"/ˈkɔːstɪk/","uz":"achchiq, kuydiruvchi","ru":"едкий, язвительный","def":"sharply critical; corrosive","ex":"A caustic remark.","syn":"scathing, biting","ant":"gentle"},{"w":"chastise","pos":"verb","ipa":"/tʃæsˈtaɪz/","uz":"jazolamoq, koyimoq","ru":"наказывать, бранить","def":"to scold or punish","ex":"The teacher chastised the students.","syn":"scold, rebuke","ant":"praise"},{"w":"circumspect","pos":"adj","ipa":"/ˈsɜːrkəmspɛkt/","uz":"ehtiyotkor, hushyor","ru":"осмотрительный","def":"cautious; considering all risks","ex":"Be circumspect with strangers.","syn":"cautious, wary","ant":"reckless"},{"w":"clandestine","pos":"adj","ipa":"/klænˈdɛstɪn/","uz":"yashirin, maxfiy","ru":"тайный, подпольный","def":"kept secret","ex":"A clandestine meeting.","syn":"secret, covert","ant":"open"},{"w":"coalesce","pos":"verb","ipa":"/ˌkoʊəˈlɛs/","uz":"birlashmoq, qo'shilmoq","ru":"объединяться, срастаться","def":"to come together as one","ex":"The groups coalesced into a movement.","syn":"unite, merge","ant":"separate"},{"w":"cogitate","pos":"verb","ipa":"/ˈkɒdʒɪteɪt/","uz":"chuqur o'ylamoq","ru":"размышлять","def":"to think deeply","ex":"He cogitated over the problem.","syn":"ponder, reflect","ant":"ignore"},{"w":"complacent","pos":"adj","ipa":"/kəmˈpleɪsənt/","uz":"o'zidan mamnun, beg'am","ru":"самодовольный","def":"smugly self-satisfied","ex":"Don't get complacent after one win.","syn":"smug, self-satisfied","ant":"vigilant"},{"w":"concur","pos":"verb","ipa":"/kənˈkɜːr/","uz":"rozi bo'lmoq, qo'shilmoq","ru":"соглашаться","def":"to agree","ex":"I concur with your view.","syn":"agree, assent","ant":"disagree"},{"w":"condescend","pos":"verb","ipa":"/ˌkɒndɪˈsɛnd/","uz":"kamsitib munosabatda bo'lmoq","ru":"снисходить","def":"to behave as if superior to others","ex":"He condescended to the staff.","syn":"patronize, talk down","ant":"respect"},{"w":"conflagration","pos":"noun","ipa":"/ˌkɒnfləˈɡreɪʃən/","uz":"katta yong'in","ru":"пожар, пламя","def":"a large destructive fire","ex":"The conflagration destroyed the block.","syn":"blaze, inferno","ant":"—"},{"w":"confound","pos":"verb","ipa":"/kənˈfaʊnd/","uz":"chalkashtirmoq, hayratda qoldirmoq","ru":"сбивать с толку, путать","def":"to confuse or mix up","ex":"The results confounded researchers.","syn":"confuse, baffle","ant":"clarify"},{"w":"connoisseur","pos":"noun","ipa":"/ˌkɒnəˈsɜːr/","uz":"bilimdon, ekspert","ru":"знаток, ценитель","def":"an expert judge in matters of taste","ex":"A connoisseur of fine wine.","syn":"expert, authority","ant":"amateur"},{"w":"consternation","pos":"noun","ipa":"/ˌkɒnstərˈneɪʃən/","uz":"dahshat, sarosima","ru":"смятение, тревога","def":"anxiety or dismay","ex":"The delay caused consternation.","syn":"dismay, alarm","ant":"composure"}]},{"id":"sv19","title":"Academic words · Set 2","words":[{"w":"contrived","pos":"adj","ipa":"/kənˈtraɪvd/","uz":"sun'iy, yasama","ru":"надуманный, искусственный","def":"artificial; forced","ex":"A contrived happy ending.","syn":"forced, artificial","ant":"natural"},{"w":"conundrum","pos":"noun","ipa":"/kəˈnʌndrəm/","uz":"jumboq, boshqotirma","ru":"головоломка, загадка","def":"a difficult problem","ex":"The puzzle was a real conundrum.","syn":"puzzle, dilemma","ant":"solution"},{"w":"covet","pos":"verb","ipa":"/ˈkʌvɪt/","uz":"havas qilmoq, orzu qilmoq","ru":"жаждать, завидовать","def":"to desire enviously","ex":"He coveted his neighbor's car.","syn":"desire, crave","ant":"reject"},{"w":"credence","pos":"noun","ipa":"/ˈkriːdəns/","uz":"ishonch, e'tibor","ru":"доверие","def":"belief or trust","ex":"The rumor gained credence.","syn":"belief, trust","ant":"doubt"},{"w":"culpable","pos":"adj","ipa":"/ˈkʌlpəbəl/","uz":"aybdor, javobgar","ru":"виновный","def":"deserving blame","ex":"He was culpable for the error.","syn":"guilty, blameworthy","ant":"innocent"},{"w":"cumbersome","pos":"adj","ipa":"/ˈkʌmbərsəm/","uz":"noqulay, og'ir","ru":"громоздкий, неудобный","def":"difficult to handle; burdensome","ex":"A cumbersome process.","syn":"unwieldy, awkward","ant":"convenient"},{"w":"cursory","pos":"adj","ipa":"/ˈkɜːrsəri/","uz":"yuzaki, shoshilinch","ru":"беглый, поверхностный","def":"hasty and not thorough","ex":"A cursory glance.","syn":"hasty, superficial","ant":"thorough"},{"w":"dauntless","pos":"adj","ipa":"/ˈdɔːntləs/","uz":"qo'rqmas, jasur","ru":"бесстрашный","def":"fearless; bold","ex":"A dauntless explorer.","syn":"fearless, intrepid","ant":"timid"},{"w":"debilitate","pos":"verb","ipa":"/dɪˈbɪlɪteɪt/","uz":"holsizlantirmoq, zaiflashtirmoq","ru":"ослаблять","def":"to weaken greatly","ex":"The illness debilitated him.","syn":"weaken, sap","ant":"strengthen"},{"w":"decry","pos":"verb","ipa":"/dɪˈkraɪ/","uz":"qoralamoq, qattiq tanqid qilmoq","ru":"осуждать","def":"to condemn openly","ex":"Critics decried the decision.","syn":"condemn, denounce","ant":"praise"},{"w":"deferential","pos":"adj","ipa":"/ˌdɛfəˈrɛnʃəl/","uz":"hurmatli, izzatli","ru":"почтительный","def":"showing respect","ex":"A deferential nod.","syn":"respectful, courteous","ant":"rude"},{"w":"deleterious","pos":"adj","ipa":"/ˌdɛlɪˈtɪriəs/","uz":"zararli","ru":"вредный, пагубный","def":"harmful","ex":"Deleterious effects on health.","syn":"harmful, damaging","ant":"beneficial"},{"w":"demur","pos":"verb","ipa":"/dɪˈmɜːr/","uz":"e'tiroz bildirmoq, ikkilanmoq","ru":"возражать","def":"to object or hesitate","ex":"She demurred at the suggestion.","syn":"object, hesitate","ant":"assent"},{"w":"deprecate","pos":"verb","ipa":"/ˈdɛprɪkeɪt/","uz":"qoralamoq, past baholamoq","ru":"порицать, умалять","def":"to express disapproval of","ex":"He deprecated their methods.","syn":"belittle, disparage","ant":"praise"},{"w":"derivative","pos":"adj","ipa":"/dɪˈrɪvətɪv/","uz":"original emas, boshqadan olingan","ru":"неоригинальный, производный","def":"imitative; not original","ex":"A derivative film.","syn":"imitative, unoriginal","ant":"original"},{"w":"desolate","pos":"adj","ipa":"/ˈdɛsələt/","uz":"kimsasiz, huvillagan","ru":"пустынный, заброшенный","def":"empty and bleak","ex":"A desolate landscape.","syn":"barren, bleak","ant":"lush"},{"w":"despot","pos":"noun","ipa":"/ˈdɛspɒt/","uz":"zolim hukmdor","ru":"деспот, тиран","def":"a tyrant","ex":"The despot ruled by fear.","syn":"tyrant, autocrat","ant":"—"},{"w":"destitute","pos":"adj","ipa":"/ˈdɛstɪtuːt/","uz":"kambag'al, muhtoj","ru":"нищий, неимущий","def":"extremely poor","ex":"Destitute families need aid.","syn":"impoverished, penniless","ant":"wealthy"},{"w":"diatribe","pos":"noun","ipa":"/ˈdaɪətraɪb/","uz":"keskin tanqid, dashnom","ru":"тирада, обличение","def":"a bitter verbal attack","ex":"He launched into a diatribe.","syn":"tirade, rant","ant":"praise"},{"w":"diffuse","pos":"verb","ipa":"/dɪˈfjuːz/","uz":"tarqatmoq, yoymoq","ru":"распространять, рассеивать","def":"to spread out","ex":"The scent diffused through the room.","syn":"spread, disperse","ant":"concentrate"}]},{"id":"sv20","title":"Academic words · Set 3","words":[{"w":"dilatory","pos":"adj","ipa":"/ˈdɪlətɔːri/","uz":"sustkash, kechiktiruvchi","ru":"медлительный","def":"slow; tending to delay","ex":"A dilatory response.","syn":"tardy, slow","ant":"prompt"},{"w":"disparity","pos":"noun","ipa":"/dɪˈspærɪti/","uz":"tafovut, tengsizlik","ru":"неравенство, различие","def":"a great difference","ex":"Income disparity widened.","syn":"difference, inequality","ant":"parity"},{"w":"dispassionate","pos":"adj","ipa":"/dɪsˈpæʃənət/","uz":"xolis, hissiyotsiz","ru":"беспристрастный","def":"free from emotion; impartial","ex":"A dispassionate analysis.","syn":"impartial, objective","ant":"emotional"},{"w":"dissipate","pos":"verb","ipa":"/ˈdɪsɪpeɪt/","uz":"tarqalmoq, sarflab yubormoq","ru":"рассеиваться, растрачивать","def":"to scatter or waste","ex":"The fog dissipated.","syn":"disperse, squander","ant":"gather"},{"w":"dissuade","pos":"verb","ipa":"/dɪˈsweɪd/","uz":"qaytarmoq, ko'ndirmaslik","ru":"отговаривать","def":"to persuade someone not to do something","ex":"She dissuaded him from quitting.","syn":"deter, discourage","ant":"persuade"},{"w":"dogged","pos":"adj","ipa":"/ˈdɒɡɪd/","uz":"qat'iyatli, o'jar","ru":"упорный","def":"persistent; stubborn","ex":"Her dogged effort paid off.","syn":"tenacious, persistent","ant":"irresolute"},{"w":"dormant","pos":"adj","ipa":"/ˈdɔːrmənt/","uz":"uyqudagi, faolsiz","ru":"спящий, бездействующий","def":"inactive; sleeping","ex":"A dormant volcano.","syn":"inactive, latent","ant":"active"},{"w":"duplicity","pos":"noun","ipa":"/duːˈplɪsɪti/","uz":"ikkiyuzlamachilik","ru":"двуличность, лицемерие","def":"deceitfulness","ex":"His duplicity was exposed.","syn":"deceit, double-dealing","ant":"honesty"},{"w":"ebb","pos":"verb","ipa":"/ɛb/","uz":"pasaymoq, qaytmoq","ru":"убывать, отливать","def":"to decline or recede","ex":"The tide ebbed.","syn":"recede, decline","ant":"rise"},{"w":"eclipse","pos":"verb","ipa":"/ɪˈklɪps/","uz":"soya solmoq, ortda qoldirmoq","ru":"затмевать","def":"to surpass or overshadow","ex":"Her fame eclipsed his.","syn":"overshadow, surpass","ant":"—"},{"w":"efface","pos":"verb","ipa":"/ɪˈfeɪs/","uz":"o'chirmoq, yo'q qilmoq","ru":"стирать, изглаживать","def":"to erase or wipe out","ex":"Time effaced the inscription.","syn":"erase, obliterate","ant":"preserve"},{"w":"effervescent","pos":"adj","ipa":"/ˌɛfərˈvɛsənt/","uz":"jo'shqin, quvnoq","ru":"искрящийся, оживлённый","def":"bubbly; lively","ex":"An effervescent personality.","syn":"lively, vivacious","ant":"dull"},{"w":"effrontery","pos":"noun","ipa":"/ɪˈfrʌntəri/","uz":"beadablik, dadillik","ru":"наглость, дерзость","def":"shameless boldness","ex":"He had the effrontery to lie.","syn":"audacity, gall","ant":"timidity"},{"w":"egalitarian","pos":"adj","ipa":"/ɪˌɡælɪˈtɛriən/","uz":"tenglikka asoslangan","ru":"эгалитарный","def":"favoring equality","ex":"An egalitarian society.","syn":"equal, democratic","ant":"hierarchical"},{"w":"elated","pos":"adj","ipa":"/ɪˈleɪtɪd/","uz":"quvonchli, shod","ru":"в восторге, ликующий","def":"very happy","ex":"She was elated by the news.","syn":"thrilled, overjoyed","ant":"dejected"},{"w":"embezzle","pos":"verb","ipa":"/ɪmˈbɛzəl/","uz":"o'zlashtirmoq, talon-taroj qilmoq","ru":"присваивать, растрачивать","def":"to steal money entrusted to one","ex":"He embezzled company funds.","syn":"misappropriate, steal","ant":"—"},{"w":"empathy","pos":"noun","ipa":"/ˈɛmpəθi/","uz":"hamdardlik","ru":"эмпатия, сопереживание","def":"the ability to share another's feelings","ex":"She felt empathy for them.","syn":"compassion, understanding","ant":"indifference"},{"w":"emphatic","pos":"adj","ipa":"/ɪmˈfætɪk/","uz":"qat'iy, ta'kidli","ru":"решительный, выразительный","def":"forceful and clear","ex":"An emphatic denial.","syn":"forceful, decided","ant":"tentative"},{"w":"enervate","pos":"verb","ipa":"/ˈɛnərveɪt/","uz":"holdan toydirmoq","ru":"изнурять, обессиливать","def":"to drain of energy","ex":"The heat enervated t
