.”","‘Coffee’ = C–O–double F–double E… (F–F, E–E)"]},{"h":"Capital and small letters","p":["Each letter has a capital (A, B, C) and a small form (a, b, c).","We use capitals to start a sentence, for names, for the word I, and for countries, days and months."],"ex":["I live in Tashkent.","Monday, July, Anna"]}],"tip":"Be careful with vowels — the same vowel can sound different: the a in cat is not the a in car. Listen and repeat new words to learn their real sound.","examples":["B-O-O-K spells the word ‘book’.","‘Class’ has a double S: C-L-A-S-S.","My name is Anna — names start with a capital letter.","‘Hour’ begins with a silent H, so we say it like ‘our’.","The vowels in ‘education’ are e, a, i and o.","We say the letter W as ‘double-u’."],"mistakes":[{"x":"My name is spelt with double “n”: N-N. (said as “en en”)","v":"Say each letter clearly: “double N”. English speakers often say “double” for two of the same letter."},{"x":"The letter “i” sounds like Uzbek/Russian “и”.","v":"In English the letter “i” is named /aɪ/ (“eye”), not /iː/."}],"quiz":[{"q":"Which of these is a vowel?","o":["B","E","K","T"],"a":1,"e":"The vowels are A, E, I, O, U — so E is a vowel.","d":"easy"},{"q":"How many letters are in the English alphabet?","o":["24","25","26","27"],"a":2,"e":"The alphabet has 26 letters.","d":"easy"},{"q":"How do you spell 'dog'?","o":["D-O-G","D-A-G","T-O-G","D-O-K"],"a":0,"e":"‘Dog’ is spelled D-O-G.","d":"easy"},{"q":"Which letter is a consonant?","o":["A","O","M","U"],"a":2,"e":"M is a consonant; A, O and U are vowels.","d":"easy"},{"q":"The word 'sun' has how many letters?","o":["2","3","4","5"],"a":1,"e":"S-U-N = three letters.","d":"easy"},{"q":"The 'LL' in 'ball' is called ___.","o":["two L","double L","big L","long L"],"a":1,"e":"Two of the same letter together are called ‘double’.","d":"med"},{"q":"Which word begins with a vowel sound?","o":["table","apple","car","dog"],"a":1,"e":"‘Apple’ begins with the vowel A.","d":"med"},{"q":"Choose the correct spelling.","o":["hapy","happy","happi","haapy"],"a":1,"e":"‘Happy’ has a double P: H-A-P-P-Y.","d":"med"},{"q":"Which word must start with a capital letter?","o":["book","monday","tashkent","table"],"a":2,"e":"Names of cities (Tashkent) always take a capital letter.","d":"med"},{"q":"'Coffee' is spelled with ___.","o":["double F and double E","double F only","double E only","no double letters"],"a":0,"e":"C-O-F-F-E-E has double F and double E.","d":"med"},{"q":"Which letter can act as a vowel in 'my'?","o":["M","Y","both","none"],"a":1,"e":"In ‘my’, Y works as a vowel.","d":"hard"},{"q":"How do you spell 'school'?","o":["S-C-H-O-O-L","S-K-O-O-L","S-C-O-O-L","S-C-H-U-L"],"a":0,"e":"‘School’ is S-C-H-O-O-L, with a silent H and double O.","d":"hard"},{"q":"Which sentence uses capitals correctly?","o":["i live in london.","I live in London.","I Live In London.","i Live in london."],"a":1,"e":"Capital I, capital for the city London, and a capital to start the sentence.","d":"hard"},{"q":"The name of the letter 'H' is ___.","o":["haitch","aitch","hatch","ah"],"a":1,"e":"The letter H is called ‘aitch’.","d":"hard"},{"q":"Which word has a silent letter?","o":["cat","know","sun","dog"],"a":1,"e":"In ‘know’, the K is silent — we say /noʊ/.","d":"hard"}]},{"id":"g2","title":"Verb to be","lead":"‘Be’ is the most important verb in English. We use it to say who we are, how we feel, where things are, and to describe people and objects. It has three present forms: am, is, are.","leadTr":{"uz":"‘Be’ — ingliz tilidagi eng muhim feʼl. U kimligimizni, qanday his qilishimizni, narsalar qayerdaligini aytadi va taʼriflaydi. Hozirgi zamonda uch shakli bor: am, is, are.","ru":"‘Be’ — важнейший глагол в английском. Им говорят, кто мы, как себя чувствуем, где находятся вещи, и описывают людей и предметы. В настоящем времени три формы: am, is, are."},"situation":"“I am a teacher. My sister is a doctor. We are from Tashkent.” The verb be connects a person to a job, a place or a description.","blocks":[{"h":"The three forms","p":["Use am with I, is with he / she / it, and are with you / we / they."],"ex":["I am a student. · She is happy. · They are at home."]},{"h":"Short forms (contractions)","p":["In speaking and informal writing we join the pronoun and ‘be’: I’m, you’re, he’s, she’s, it’s, we’re, they’re."],"ex":["I’m tired. · He’s from Italy. · They’re teachers."]},{"h":"Negatives","p":["Add not after ‘be’. Short forms: isn’t (= is not), aren’t (= are not). ‘am not’ has no short form."],"ex":["She is not / isn’t here. · We are not / aren’t ready. · I am not cold."]},{"h":"Questions and short answers","p":["To make a question, put ‘be’ before the subject. For wh‑questions, the wh‑word goes first."],"ex":["Are you a student? — Yes, I am. / No, I’m not.","Where is she? — She’s at school."]}],"tip":"Don’t confuse it’s (= it is) with its (possessive). ‘It’s cold’ = it is cold. ‘The dog likes its food’ = the food belonging to it.","examples":["I am from Spain. (I’m from Spain.)","She is a nurse. (She’s a nurse.)","They are in the garden. (They’re in the garden.)","Is he your brother? — Yes, he is.","We aren’t ready yet.","It’s a cold morning. (It is)"],"mistakes":[{"x":"I student. / She doctor.","v":"I am a student. / She is a doctor. (don’t drop “be”)"},{"x":"He are happy.","v":"He is happy. (he/she/it → is)"},{"x":"I’m agree with you.","v":"I agree with you. (“agree” is a verb — no “be”)"}],"quiz":[{"q":"I ___ a student.","o":["is","am","are","be"],"a":1,"e":"With ‘I’ we use ‘am’.","d":"easy"},{"q":"She ___ from Tashkent.","o":["am","are","is","be"],"a":2,"e":"With he/she/it we use ‘is’.","d":"easy"},{"q":"We ___ friends.","o":["is","am","are","be"],"a":2,"e":"With we/you/they we use ‘are’.","d":"easy"},{"q":"The short form of 'he is' is ___.","o":["he's","hes","he're","his"],"a":0,"e":"‘he is’ = ‘he’s’.","d":"easy"},{"q":"They ___ at home.","o":["is","are","am","be"],"a":1,"e":"With ‘they’ we use ‘are’.","d":"easy"},{"q":"___ you a teacher?","o":["Is","Am","Are","Be"],"a":2,"e":"With ‘you’ we use ‘are’, and it comes first in a question.","d":"med"},{"q":"He ___ happy today.","o":["isn't","aren't","amn't","not is"],"a":0,"e":"‘is not’ = ‘isn’t’.","d":"med"},{"q":"Choose the correct negative: 'We ___ ready.'","o":["isn't","aren't","not are","am not"],"a":1,"e":"With ‘we’ the negative is ‘aren’t’.","d":"med"},{"q":"'___ she your sister?' — 'Yes, she ___.'","o":["Is / is","Are / are","Is / are","Am / is"],"a":0,"e":"Question ‘Is she…?’ and short answer ‘Yes, she is.’","d":"med"},{"q":"It ___ a beautiful day.","o":["am","are","is","be"],"a":2,"e":"With ‘it’ we use ‘is’.","d":"med"},{"q":"Which sentence is correct?","o":["I amn't tired.","I not am tired.","I'm not tired.","I am not't tired."],"a":2,"e":"‘am not’ has no contraction; we say ‘I’m not’.","d":"hard"},{"q":"'Where ___ your parents?'","o":["is","am","are","be"],"a":2,"e":"‘parents’ is plural → ‘are’.","d":"hard"},{"q":"Complete: 'My name ___ Anna and I ___ ten.'","o":["is / am","am / is","are / am","is / are"],"a":0,"e":"‘name is’ (it) and ‘I am’.","d":"hard"},{"q":"Choose the correct short answer: 'Are they students?'","o":["Yes, they're.","Yes, they are.","Yes, they is.","Yes, they am."],"a":1,"e":"In short answers we don’t contract: ‘Yes, they are.’","d":"hard"},{"q":"Find the mistake: 'She are my best friend.'","o":["are → is","She → Her","friend → friends","no mistake"],"a":0,"e":"With ‘she’ we use ‘is’: She is my best friend.","d":"hard"}]},{"id":"g3","title":"Pronouns & possessives","lead":"Pronouns replace nouns so we don’t repeat names. Possessive words show who something belongs to. Getting these right makes your English sound natural.","leadTr":{"uz":"Olmoshlar otlar oʻrnini bosadi, shunda ismlarni takrorlamaymiz. Egalik soʻzlari nimanidir kimga tegishliligini koʻrsatadi. Ularni toʻgʻri ishlatish nutqingizni tabiiy qiladi.","ru":"Местоимения заменяют существительные, чтобы не повторять имена. Притяжательные слова показывают принадлежность. Их правильное употребление делает речь естественной."},"situation":"","blocks":[{"h":"Subject pronouns","p":["These do the action and usually come before the verb: I, you, he, she, it, we, they."],"ex":["He plays football. · We live here."]},{"h":"Object pronouns","p":["These receive the action and come after the verb or a preposition: me, you, him, her, it, us, them."],"ex":["She loves me. · Give the book to him. · I can see them."]},{"h":"Possessive adjectives","p":["These go before a noun to show owner: my, your, his, her, its, our, their."],"ex":["This is my bag. · Their house is big."]},{"h":"Possessive pronouns & 's","p":["Possessive pronouns stand alone: mine, yours, his, hers, ours, theirs. We also add ’s to a name to show belonging."],"ex":["This book is mine. · That’s Anna’s pen (= the pen of Anna)."]}],"tip":"‘Their’ (owner), ‘there’ (place) and ‘they’re’ (= they are) sound the same but are different words. ‘Their car is over there, and they’re late.’","examples":["This is my book and that one is yours.","Can you help me, please?","We like them, and they like us.","Her bag is blue; his is black.","That car is ours, not theirs.","This is Tom’s pen (the pen of Tom)."],"mistakes":[{"x":"Me like coffee.","v":"I like coffee. (subject = I)"},{"x":"This is me book.","v":"This is my book. (possessive = my)"},{"x":"Her is my sister.","v":"She is my sister. (subject = she)"}],"quiz":[{"q":"___ play tennis every Sunday. (the speaker + friends)","o":["Us","We","Our","They"],"a":1,"e":"Subject pronoun for the group with the speaker is ‘We’.","d":"easy"},{"q":"This is ___ book. (it belongs to me)","o":["I","me","my","mine"],"a":2,"e":"Before a noun we use the possessive adjective ‘my’.","d":"easy"},{"q":"I can see ___. (he)","o":["he","him","his","himself"],"a":1,"e":"After the verb we use the object pronoun ‘him’.","d":"easy"},{"q":"That car is ___. (it belongs to us)","o":["our","us","ours","we"],"a":2,"e":"Standing alone, we use the possessive pronoun ‘ours’.","d":"easy"},{"q":"___ is a doctor. (female)","o":["Her","She","Hers","Him"],"a":1,"e":"Subject pronoun for a female is ‘She’.","d":"easy"},{"q":"The dog likes ___ food. (belonging to the dog)","o":["it's","its","it","his"],"a":1,"e":"‘Its’ (no apostrophe) shows possession.","d":"med"},{"q":"Give the keys to ___. (we)","o":["we","our","us","ours"],"a":2,"e":"After a preposition we use the object pronoun ‘us’.","d":"med"},{"q":"This pen is ___. (it belongs to you)","o":["your","you","yours","you're"],"a":2,"e":"Standing alone we use the possessive pronoun ‘yours’.","d":"med"},{"q":"___ parents are very kind. (they)","o":["Them","Their","They're","There"],"a":1,"e":"Before a noun we use ‘their’.","d":"med"},{"q":"Whose bag is this? It's ___.","o":["Anna","Anna's","Annas","of Anna"],"a":1,"e":"We add ’s to show possession: Anna’s.","d":"med"},{"q":"Choose the correct sentence.","o":["Me like coffee.","I like coffee.","My like coffee.","Mine like coffee."],"a":1,"e":"The subject is ‘I’: I like coffee.","d":"hard"},{"q":"Complete: 'She gave ___ book to ___.'","o":["her / I","hers / me","her / me","she / me"],"a":2,"e":"‘her book’ (possessive adjective) and ‘to me’ (object pronoun).","d":"hard"},{"q":"Which uses 'theirs' correctly?","o":["Theirs house is big.","This house is theirs.","Theirs is big house.","That is theirs car."],"a":1,"e":"‘theirs’ stands alone: This house is theirs.","d":"hard"},{"q":"Find the mistake: 'Its a beautiful day.'","o":["Its → It's","a → an","day → days","no mistake"],"a":0,"e":"Here we need ‘It’s’ (= it is), not the possessive ‘its’.","d":"hard"},{"q":"Complete: 'My brother and ___ are at school.' (I)","o":["me","I","mine","my"],"a":1,"e":"As part of the subject we use ‘I’: My brother and I.","d":"hard"}]},{"id":"g4","title":"Articles & nouns","lead":"Articles (a, an, the) are small words before nouns. Choosing the right one — and knowing how to make plurals — is essential for clear, correct English.","leadTr":{"uz":"Artikllar (a, an, the) ot oldidagi kichik soʻzlar. Toʻgʻrisini tanlash va koʻplik yasashni bilish aniq va toʻgʻri ingliz tili uchun zarur.","ru":"Артикли (a, an, the) — маленькие слова перед существительным. Правильный выбор и умение образовывать множественное число важны для грамотного английского."},"situation":"","blocks":[{"h":"a / an — one, not specific","p":["Use a before a consonant sound and an before a vowel sound. We use them for singular things mentioned for the first time."],"ex":["a book · a university (‘yoo’ sound)","an apple · an hour (silent h)"]},{"h":"the — specific / already known","p":["Use the when both speaker and listener know which one, or there is only one."],"ex":["I bought a cake. The cake is delicious.","The sun is hot."]},{"h":"Regular plurals","p":["Most nouns add -s. After -s, -ss, -ch, -sh, -x we add -es. A consonant + y becomes -ies."],"ex":["book → books · box → boxes · baby → babies"]},{"h":"Irregular plurals & uncountables","p":["Some plurals are irregular. Some nouns are uncountable (no plural, no a/an): water, rice, money, information."],"ex":["man → men · woman → women · child → children · foot → feet","I need some water (not ‘a water’)."]}],"tip":"Choose a/an by the sound, not the letter. ‘an MP’ (em-sound) is correct; ‘a university’ (yoo-sound) is correct even though it starts with a vowel.","examples":["I ate an apple and a banana.","There is a dog in the garden. The dog is friendly.","one box → two boxes; one baby → two babies.","The moon is bright tonight. (only one moon)","I need some water — not ‘a water’.","one child → three children (irregular)."],"mistakes":[{"x":"a apple / a hour","v":"an apple / an hour (vowel sound)"},{"x":"I need a informations.","v":"I need information. (uncountable — no “a”, no “-s”)"},{"x":"She is teacher.","v":"She is a teacher. (jobs take “a/an”)"}],"quiz":[{"q":"I have ___ apple.","o":["a","an","the","-"],"a":1,"e":"‘Apple’ starts with a vowel sound, so ‘an’.","d":"easy"},{"q":"She is reading ___ book.","o":["a","an","-","of"],"a":0,"e":"‘Book’ starts with a consonant sound, so ‘a’.","d":"easy"},{"q":"The plural of 'cat' is ___.","o":["cates","cats","caties","cat"],"a":1,"e":"Most nouns just add -s: cats.","d":"easy"},{"q":"The plural of 'box' is ___.","o":["boxs","boxes","boxies","box"],"a":1,"e":"After -x we add -es: boxes.","d":"easy"},{"q":"___ sun is very bright today.","o":["A","An","The","-"],"a":2,"e":"There is only one sun, so we use ‘the’.","d":"easy"},{"q":"The plural of 'baby' is ___.","o":["babys","babies","babyes","baby"],"a":1,"e":"Consonant + y → -ies: babies.","d":"med"},{"q":"I'd like ___ orange and ___ banana.","o":["a / an","an / a","an / an","a / a"],"a":1,"e":"‘an orange’ (vowel sound), ‘a banana’ (consonant sound).","d":"med"},{"q":"Which noun is uncountable?","o":["apple","chair","water","book"],"a":2,"e":"‘Water’ is uncountable — no plural, no a/an.","d":"med"},{"q":"The plural of 'man' is ___.","o":["mans","mens","men","manes"],"a":2,"e":"‘man’ is irregular: men.","d":"med"},{"q":"I saw a film. ___ film was great.","o":["A","An","The","-"],"a":2,"e":"The film is now known, so we use ‘the’.","d":"med"},{"q":"Choose the correct article: '___ hour.'","o":["a","an","the only","one of"],"a":1,"e":"‘Hour’ has a silent h (vowel sound), so ‘an hour’.","d":"hard"},{"q":"Which is correct?","o":["a university","an university","the a university","an universities"],"a":0,"e":"‘University’ starts with a ‘yoo’ sound, so ‘a university’.","d":"hard"},{"q":"The plural of 'child' is ___.","o":["childs","childes","children","childrens"],"a":2,"e":"‘child’ is irregular: children.","d":"hard"},{"q":"Find the mistake: 'I need a money.'","o":["a → an","money → moneys","a money → money/some money","no mistake"],"a":2,"e":"‘Money’ is uncountable: ‘I need money / some money.’","d":"hard"},{"q":"Complete: 'There is ___ egg and ___ spoon on ___ table.'","o":["an / a / the","a / an / the","an / a / a","a / a / the"],"a":0,"e":"‘an egg’ (vowel), ‘a spoon’ (consonant), ‘the table’ (specific).","d":"hard"}]},{"id":"g5","title":"Demonstratives","lead":"This, that, these and those point to people or things. They tell us about number (one or many) and distance (near or far).","leadTr":{"uz":"This, that, these va those odam yoki narsalarga ishora qiladi. Ular son (bitta yoki koʻp) va masofani (yaqin yoki uzoq) bildiradi.","ru":"This, that, these и those указывают на людей или предметы. Они показывают число (один или много) и расстояние (близко или далеко)."},"situation":"","blocks":[{"h":"Near vs. far","p":["Use this/these for things near you, and that/those for things far from you."],"ex":["This is my phone (in my hand). · That is your car (over there)."]},{"h":"Singular vs. plural","p":["This and that are singular (one). These and those are plural (more than one)."],"ex":["this book → these books","that shoe → those shoes"]},{"h":"As pronouns and adjectives","p":["They can stand alone (a pronoun) or come before a noun (an adjective)."],"ex":["This is delicious. (alone)","This cake is delicious. (+ noun)"]},{"h":"Common phrases","p":["We use them on the phone and to introduce people."],"ex":["Hello, this is Anna. (on the phone)","These are my friends, Tom and Sam."]}],"tip":"Match number carefully: ‘these book’ is wrong. Say this book (one) or these books (many).","examples":["This phone (in my hand) is new.","That house (over there) is big.","These shoes are mine; those are yours.","Hello, this is Sara speaking. (on the phone)","These are my friends, Tom and Lucy.","That was a great film!"],"mistakes":[{"x":"this books / these book","v":"this book (one) · these books (more than one)"},{"x":"I like these. (pointing far away)","v":"I like those. (far = that/those)"}],"quiz":[{"q":"___ is my pen. (in my hand)","o":["This","These","Those","Them"],"a":0,"e":"Near + singular = ‘This’.","d":"easy"},{"q":"___ are my shoes. (near me)","o":["This","That","These","Those"],"a":2,"e":"Near + plural = ‘These’.","d":"easy"},{"q":"Look at ___ bird in the sky. (far)","o":["this","these","that","those"],"a":2,"e":"Far + singular = ‘that’.","d":"easy"},{"q":"___ houses over there are new. (far)","o":["This","That","These","Those"],"a":3,"e":"Far + plural = ‘Those’.","d":"easy"},{"q":"The plural of 'this' is ___.","o":["that","these","those","thises"],"a":1,"e":"this → these.","d":"easy"},{"q":"___ apples here are fresh.","o":["This","That","These","Those"],"a":2,"e":"Near + plural ‘apples’ = ‘These’.","d":"med"},{"q":"Choose: 'Is ___ your bag?' (the one near you)","o":["this","these","those","they"],"a":0,"e":"Near + singular = ‘this’.","d":"med"},{"q":"On the phone: 'Hello, ___ is Sara.'","o":["that","this","these","those"],"a":1,"e":"We say ‘this is …’ to introduce ourselves on the phone.","d":"med"},{"q":"The plural of 'that' is ___.","o":["these","those","thats","this"],"a":1,"e":"that → those.","d":"med"},{"q":"___ are my parents. (introducing them)","o":["This","That","These","It"],"a":2,"e":"Introducing two people (plural) = ‘These’.","d":"med"},{"q":"Which sentence is correct?","o":["These book is mine.","This books are mine.","These books are mine.","This book are mine."],"a":2,"e":"Plural ‘books’ needs ‘These … are’.","d":"hard"},{"q":"Complete: '___ shoes are nicer than ___ ones over there.'","o":["This / that","These / those","Those / these","These / that"],"a":1,"e":"Near plural ‘These’ vs. far plural ‘those’.","d":"hard"},{"q":"Find the mistake: 'Look at those car near us.'","o":["those → this/that","car → cars","near → far","no mistake"],"a":0,"e":"‘car’ is singular and near, so ‘this car’ (or far ‘that car’).","d":"hard"},{"q":"Choose the natural sentence.","o":["That is my friends.","Those are my friends.","These is my friends.","This are my friends."],"a":1,"e":"Plural ‘friends’ → ‘Those are’ (or ‘These are’).","d":"hard"},{"q":"'___ is delicious!' (the cake you are eating now)","o":["Those","These","This","That"],"a":2,"e":"One thing, near/now = ‘This’.","d":"hard"}]},{"id":"g6","title":"Present simple","lead":"The present simple is the tense for facts, routines and habits — things that are generally true or happen regularly. It is the most common tense in everyday English.","leadTr":{"uz":"Hozirgi oddiy zamon — faktlar, kundalik ishlar va odatlar uchun. U kundalik ingliz tilidagi eng koʻp ishlatiladigan zamon.","ru":"Present simple — для фактов, распорядка и привычек, того, что обычно верно или происходит регулярно. Это самое частое время в повседневном английском."},"situation":"Tom is a nurse. He works at a hospital. He starts at 8 and finishes at 4. He doesn’t work on Sundays. — Use the present simple for habits, routines and things that are generally true.","blocks":[{"h":"When we use it","p":["For routines (every day), facts (always true) and habits."],"ex":["I get up at seven every day.","Water boils at 100°C."]},{"h":"The third-person -s","p":["With he, she, it we add -s to the verb. After -o, -ss, -ch, -sh, -x we add -es; consonant + y → -ies."],"ex":["I work → she works · go → goes · study → studies"]},{"h":"Negatives","p":["Use don’t (I/you/we/they) and doesn’t (he/she/it) + the base verb (no -s)."],"ex":["They don’t eat meat. · He doesn’t like tea."]},{"h":"Questions & frequency","p":["Use Do/Does + subject + base verb. Adverbs of frequency (always, usually, often, sometimes, never) go before the main verb."],"ex":["Do you play chess? · Does she work here?","I always brush my teeth."]}],"tip":"After does/doesn’t, the verb has no -s: ‘She doesn’t likes’ is wrong → ‘She doesn’t like.’ The -s is already in ‘does’.","examples":["I get up at seven every day.","She goes to work by bus. (he/she/it + -s)","They don’t eat meat.","He doesn’t like coffee.","Do you play tennis? — Yes, I do.","We always have dinner at eight."],"mistakes":[{"x":"He work in a bank.","v":"He works in a bank. (he/she/it → add -s)"},{"x":"She don’t like tea.","v":"She doesn’t like tea. (he/she/it → doesn’t)"},{"x":"Do you likes football?","v":"Do you like football? (after do/does, no -s)"}],"quiz":[{"q":"He ___ to school every day.","o":["go","goes","going","went"],"a":1,"e":"With ‘he’ we add -s: goes.","d":"easy"},{"q":"I ___ coffee every morning.","o":["drinks","drink","drinking","am drink"],"a":1,"e":"With ‘I’ we use the base verb: drink.","d":"easy"},{"q":"They ___ football on Sundays.","o":["plays","play","playing","plaies"],"a":1,"e":"With ‘they’ we use the base verb: play.","d":"easy"},{"q":"She ___ English very well.","o":["speak","speaks","speaking","speakes"],"a":1,"e":"With ‘she’ we add -s: speaks.","d":"easy"},{"q":"We ___ in Tashkent.","o":["lives","live","living","lifes"],"a":1,"e":"With ‘we’ we use the base verb: live.","d":"easy"},{"q":"She ___ like fish.","o":["don't","doesn't","isn't","not"],"a":1,"e":"With ‘she’ the negative is ‘doesn’t’.","d":"med"},{"q":"The third-person form of 'study' is ___.","o":["studys","studyes","studies","study"],"a":2,"e":"Consonant + y → -ies: studies.","d":"med"},{"q":"___ you like music?","o":["Does","Do","Are","Is"],"a":1,"e":"With ‘you’ we use ‘Do’.","d":"med"},{"q":"Choose the correct sentence.","o":["I always eat breakfast.","I eat always breakfast.","Always I breakfast eat.","I eat breakfast always now."],"a":0,"e":"The frequency adverb goes before the verb: I always eat.","d":"med"},{"q":"___ she work on Saturdays?","o":["Do","Does","Is","Are"],"a":1,"e":"With ‘she’ we use ‘Does’.","d":"med"},{"q":"Negative of 'He plays tennis': ___","o":["He don't play tennis.","He doesn't plays tennis.","He doesn't play tennis.","He not play tennis."],"a":2,"e":"doesn’t + base verb (no -s): He doesn’t play.","d":"hard"},{"q":"The third-person form of 'go' is ___.","o":["gos","goes","goies","going"],"a":1,"e":"After -o we add -es: goes.","d":"hard"},{"q":"Find the mistake: 'Does she likes pizza?'","o":["Does → Do","likes → like","she → her","no mistake"],"a":1,"e":"After ‘does’ the verb has no -s: ‘Does she like pizza?’","d":"hard"},{"q":"Complete: 'My father ___ to work by bus, but I ___ to walk.'","o":["go / prefers","goes / prefer","goes / prefers","go / prefer"],"a":1,"e":"‘father goes’ (he) and ‘I prefer’.","d":"hard"},{"q":"Which is correct?","o":["He never not eats meat.","He never eats meat.","He doesn't never eat meat.","He eats never meat."],"a":1,"e":"‘never’ is already negative and goes before the verb: He never eats meat.","d":"hard"}]},{"id":"g7","title":"Present continuous","lead":"The present continuous describes actions happening now, at this moment, or around now (a temporary situation). It is formed with ‘be’ + verb-ing.","leadTr":{"uz":"Hozirgi davom zamoni hozir, shu daqiqada yoki shu atrofda (vaqtinchalik holat) sodir boʻlayotgan ishni bildiradi. ‘be’ + feʼl-ing bilan yasaladi.","ru":"Present continuous описывает действие, происходящее сейчас, в этот момент или в этот период (временно). Образуется ‘be’ + глагол-ing."},"situation":"Look! It is raining and the children are playing inside. — Use the present continuous for an action happening now, at the moment of speaking.","blocks":[{"h":"Form: am/is/are + -ing","p":["Use the right form of ‘be’ and add -ing to the main verb."],"ex":["I am reading. · She is sleeping. · They are playing."]},{"h":"-ing spelling rules","p":["Drop a final silent -e (make → making). Double the final consonant after a short stressed vowel (run → running). ‘ie’ → ‘y’ (lie → lying)."],"ex":["write → writing · sit → sitting · die → dying"]},{"h":"Now vs. routine","p":["Present simple = routines/facts. Present continuous = happening now or temporary."],"ex":["I work in a bank. (job) — I’m working from home today. (now)"]},{"h":"Negatives & questions","p":["Negative: add not after ‘be’. Question: put ‘be’ first."],"ex":["She isn’t listening. · Are you working?"]}],"tip":"Some verbs (like, want, know, love, need, understand) describe states, not actions. We don’t usually use them in the continuous: say ‘I want tea’, not ‘I am wanting tea’.","examples":["Listen! The baby is crying.","I ’m reading a book right now.","They are playing in the park at the moment.","She isn’t working today.","Are you watching TV?","write → writing; run → running; lie → lying."],"mistakes":[{"x":"I am go to school now.","v":"I am going to school now. (be + -ing)"},{"x":"She cooking dinner.","v":"She is cooking dinner. (don’t drop “is”)"},{"x":"I am knowing the answer.","v":"I know the answer. (state verbs: no -ing)"}],"quiz":[{"q":"Look! The baby ___ now.","o":["cries","is crying","cry","crying"],"a":1,"e":"‘now’ → present continuous: is crying.","d":"easy"},{"q":"They ___ in the garden at the moment.","o":["play","plays","are playing","playing"],"a":2,"e":"‘at the moment’ → are playing.","d":"easy"},{"q":"I ___ a book right now.","o":["read","am reading","reads","reading"],"a":1,"e":"‘right now’ → am reading.","d":"easy"},{"q":"The -ing form of 'make' is ___.","o":["makeing","making","makking","makes"],"a":1,"e":"Drop the silent -e: making.","d":"easy"},{"q":"She ___ to music now.","o":["listen","listens","is listening","listening"],"a":2,"e":"‘now’ → is listening.","d":"easy"},{"q":"The -ing form of 'run' is ___.","o":["runing","running","runnning","runs"],"a":1,"e":"Short stressed vowel → double the consonant: running.","d":"med"},{"q":"We ___ dinner at the moment.","o":["have","has","are having","having"],"a":2,"e":"‘at the moment’ → are having.","d":"med"},{"q":"Choose the 'now' sentence.","o":["I read every day.","I am reading right now.","I read books.","I reads a book."],"a":1,"e":"‘right now’ needs the continuous form.","d":"med"},{"q":"Negative: 'He ___ TV now.'","o":["isn't watching","doesn't watch","not watching","aren't watching"],"a":0,"e":"Present continuous negative: isn’t watching.","d":"med"},{"q":"The -ing form of 'sit' is ___.","o":["siting","sitting","siteing","sits"],"a":1,"e":"Short stressed vowel → double: sitting.","d":"med"},{"q":"Which sentence is correct?","o":["I am wanting a coffee.","I want a coffee.","I am want a coffee.","I wanting a coffee."],"a":1,"e":"‘want’ is a state verb — not used in the continuous: I want a coffee.","d":"hard"},{"q":"Complete: 'Be quiet! The students ___ a test.'","o":["take","takes","are taking","taking"],"a":2,"e":"Action happening now → are taking.","d":"hard"},{"q":"The -ing form of 'lie' is ___.","o":["lieing","lying","lieying","liing"],"a":1,"e":"‘ie’ → ‘y’: lying.","d":"hard"},{"q":"Choose the correct question.","o":["Are you do your homework?","Do you doing your homework?","Are you doing your homework?","You are doing homework?"],"a":2,"e":"Continuous question: Are you doing…?","d":"hard"},{"q":"Find the mistake: 'She is read a book now.'","o":["is → are","read → reading","now → today","no mistake"],"a":1,"e":"After ‘is’ we need the -ing form: She is reading.","d":"hard"}]},{"id":"g8","title":"Have got · there is/are","lead":"‘Have got’ talks about possession, family and features. ‘There is / there are’ says that something exists or is present. Both are very common in everyday speech.","leadTr":{"uz":"‘Have got’ egalik, oila va xususiyatlar haqida. ‘There is / there are’ nimadir mavjudligini yoki borligini bildiradi. Ikkalasi ham kundalik nutqda juda koʻp uchraydi.","ru":"‘Have got’ — о принадлежности, семье и признаках. ‘There is / there are’ — о существовании или наличии. Оба очень частотны в речи."},"situation":"","blocks":[{"h":"have got = have (possession)","p":["Use have got (I/you/we/they) and has got (he/she/it). Short forms: I’ve got, she’s got."],"ex":["I’ve got two brothers. · She’s got a new phone."]},{"h":"Negatives & questions with have got","p":["Negative: haven’t/hasn’t got. Question: Have/Has + subject + got?"],"ex":["We haven’t got a car. · Has he got a sister?"]},{"h":"there is / there are","p":["Use there is (+ singular / uncountable) and there are (+ plural) to say something exists."],"ex":["There is a book on the table. · There are five chairs."]},{"h":"Negatives & questions","p":["Negative: there isn’t / there aren’t. Question: Is there…? / Are there…?"],"ex":["There isn’t any milk. · Are there any shops near here?"]}],"tip":"Don’t mix them up: use have got for an owner (‘I have got a dog’) and there is/are for existence (‘There is a dog in the garden’).","examples":["I ’ve got two sisters.","She ’s got a new phone.","We haven’t got a car.","Has he got a bike?","There is a book on the desk.","There are five chairs in the room."],"mistakes":[{"x":"There is three rooms.","v":"There are three rooms. (plural → there are)"},{"x":"She have got a car.","v":"She has got a car. (he/she/it → has got)"},{"x":"I have got not a pen.","v":"I haven’t got a pen."}],"quiz":[{"q":"I ___ a new bag.","o":["has got","have got","got have","am got"],"a":1,"e":"With ‘I’ we use ‘have got’.","d":"easy"},{"q":"She ___ two cats.","o":["have got","has got","got","is got"],"a":1,"e":"With ‘she’ we use ‘has got’.","d":"easy"},{"q":"___ a pen on the desk.","o":["There is","There are","There be","Is there"],"a":0,"e":"Singular ‘a pen’ → There is.","d":"easy"},{"q":"___ three windows in the room.","o":["There is","There are","There be","There am"],"a":1,"e":"Plural ‘windows’ → There are.","d":"easy"},{"q":"Short form of 'I have got' is ___.","o":["I's got","I've got","I got's","Ive's"],"a":1,"e":"‘I have’ = ‘I’ve’ → I’ve got.","d":"easy"},{"q":"We ___ a garden.","o":["haven't got","hasn't got","not got","don't got"],"a":0,"e":"With ‘we’ the negative is ‘haven’t got’.","d":"med"},{"q":"___ any milk in the fridge?","o":["Are there","Is there","There is","Have there"],"a":1,"e":"‘milk’ is uncountable (singular) → Is there.","d":"med"},{"q":"___ he got a bicycle?","o":["Have","Has","Is","Does"],"a":1,"e":"With ‘he’ the question is ‘Has he got…?’.","d":"med"},{"q":"There ___ a lot of people here.","o":["is","are","be","has"],"a":1,"e":"‘people’ is plural → are.","d":"med"},{"q":"Choose the correct negative: 'There ___ any chairs.'","o":["isn't","aren't","not are","hasn't"],"a":1,"e":"Plural ‘chairs’ → There aren’t.","d":"med"},{"q":"Which sentence is correct?","o":["She have got a dog.","She has got a dog.","She has a got dog.","She got has a dog."],"a":1,"e":"With ‘she’: She has got a dog.","d":"hard"},{"q":"Complete: '___ a problem, but ___ no easy answers.'","o":["There is / there are","There are / there is","There is / there is","There are / there are"],"a":0,"e":"‘a problem’ (singular) → there is; ‘answers’ (plural) → there are.","d":"hard"},{"q":"Find the mistake: 'There is five students in the class.'","o":["is → are","five → fives","students → student","no mistake"],"a":0,"e":"Plural ‘five students’ needs ‘There are’.","d":"hard"},{"q":"Which question is correct?","o":["Has you got a car?","Have you got a car?","Do you got a car?","Are you got a car?"],"a":1,"e":"With ‘you’: Have you got a car?","d":"hard"},{"q":"Complete: 'My sister ___ long hair, and ___ a beautiful park near her house.'","o":["has got / there is","have got / there are","has got / there are","there is / has got"],"a":0,"e":"‘sister has got’ (possession) + ‘there is a park’ (existence, singular).","d":"hard"}]},{"id":"g9","title":"Modals: can/can't · imperatives","lead":"‘Can’ expresses ability, possibility and permission. ‘Can’t’ is its negative. The imperative gives instructions, orders and advice. Both are short and very useful.","leadTr":{"uz":"‘Can’ qobiliyat, imkoniyat va ruxsatni bildiradi. ‘Can’t’ uning inkori. Buyruq mayli koʻrsatma, buyruq va maslahat beradi. Ikkalasi ham qisqa va juda foydali.","ru":"‘Can’ выражает способность, возможность и разрешение. ‘Can’t’ — его отрицание. Повелительное наклонение даёт указания, приказы и советы. Оба коротки и полезны."},"situation":"“Can you swim?” — “Yes, I can, but I can’t dive.” Can shows ability and possibility, and it never changes form.","blocks":[{"h":"can for ability","p":["Can + base verb means ‘is able to’. It never changes form (no -s, no ‘to’)."],"ex":["I can swim. · She can speak three languages."]},{"h":"can for permission/requests","p":["We also use can to ask for and give permission."],"ex":["Can I open the window? · You can go now."]},{"h":"can't (negative)","p":["The negative is can’t (cannot). Same form for all subjects."],"ex":["He can’t drive. · We can’t hear you."]},{"h":"Imperatives","p":["Use the base verb to give an instruction. Add don’t for negative imperatives. We often add ‘please’ to be polite."],"ex":["Open your books. · Don’t run! · Please sit down."]}],"tip":"After ‘can’ never use ‘to’: ‘I can to swim’ is wrong → ‘I can swim.’ And ‘can’ has no -s with he/she/it: ‘She can swim’, not ‘She cans’.","examples":["I can swim, but I can’t drive.","Can I open the window, please?","She can speak three languages.","Open your books. (instruction)","Don’t run in the corridor!","Please sit down."],"mistakes":[{"x":"I can to swim.","v":"I can swim. (can + base verb, no “to”)"},{"x":"He cans drive.","v":"He can drive. (no -s on modals)"},{"x":"Please to sit down.","v":"Please sit down. (imperative = base verb)"}],"quiz":[{"q":"I ___ swim very well.","o":["can","cans","am can","can to"],"a":0,"e":"‘can’ + base verb, no -s, no ‘to’.","d":"easy"},{"q":"He ___ drive. He has no licence.","o":["can","can't","doesn't can","not can"],"a":1,"e":"Negative ability = can’t.","d":"easy"},{"q":"___ I borrow your pen?","o":["Can","Cans","Do can","Am"],"a":0,"e":"Request for permission: ‘Can I…?’","d":"easy"},{"q":"___ your books, please. (instruction)","o":["Opening","Open","Opens","To open"],"a":1,"e":"Imperative uses the base verb: Open.","d":"easy"},{"q":"She ___ speak French.","o":["can","cans","is can","can to"],"a":0,"e":"‘can’ never changes: She can speak.","d":"easy"},{"q":"Negative imperative: '___ late!'","o":["Not be","Don't be","Be not","No be"],"a":1,"e":"Negative imperative: Don’t be late!","d":"med"},{"q":"We ___ hear the teacher. It's too noisy.","o":["can","can't","don't can","aren't can"],"a":1,"e":"Negative ability: can’t hear.","d":"med"},{"q":"Choose the correct sentence.","o":["I can to play guitar.","I can play guitar.","I can playing guitar.","I cans play guitar."],"a":1,"e":"can + base verb: I can play.","d":"med"},{"q":"'___ quiet, please.' (instruction)","o":["Are","Be","Being","To be"],"a":1,"e":"Imperative of ‘be’ is just ‘Be’.","d":"med"},{"q":"They ___ come to the party. They're busy.","o":["can","can't","cannot to","don't can"],"a":1,"e":"Negative ability/possibility: can’t come.","d":"med"},{"q":"Which is correct?","o":["She cans cook.","She can cooks.","She can cook.","She is can cook."],"a":2,"e":"‘can’ takes no -s and the verb stays base: She can cook.","d":"hard"},{"q":"Make it negative: 'Touch the wall.'","o":["No touch the wall.","Don't touch the wall.","Not touch the wall.","Don't touching the wall."],"a":1,"e":"Negative imperative: Don’t + base verb.","d":"hard"},{"q":"Find the mistake: 'Can you to help me?'","o":["Can → Do","you → your","to help → help","no mistake"],"a":2,"e":"After ‘can’ we don’t use ‘to’: Can you help me?","d":"hard"},{"q":"Complete: 'You ___ smoke here, but you ___ sit outside.'","o":["can / can't","can't / can","can / can","can't / can't"],"a":1,"e":"No permission inside (can’t), permission outside (can).","d":"hard"},{"q":"Which gives polite advice correctly?","o":["You please sit.","Sit down, please.","Please to sit down.","Sitting down please."],"a":1,"e":"Imperative + please: ‘Sit down, please.’","d":"hard"}]},{"id":"g10","title":"Adjectives","lead":"Adjectives describe nouns — they tell us what people, places and things are like. Knowing where to put them and learning common opposites makes your descriptions clear.","leadTr":{"uz":"Sifatlar otlarni taʼriflaydi — odam, joy va narsalar qanaqaligini aytadi. Ularning oʻrnini va keng tarqalgan qarama-qarshilarini bilish taʼrifni aniq qiladi.","ru":"Прилагательные описывают существительные — какими являются люди, места и вещи. Знание их места и распространённых антонимов делает описание ясным."},"situation":"","blocks":[{"h":"Position","p":["An adjective usually goes before the noun, or after the verb ‘be’. It never changes for plural."],"ex":["a red car · The car is red. · two red cars (not ‘reds’)"]},{"h":"Common opposites","p":["Learn adjectives in pairs."],"ex":["big ↔ small · hot ↔ cold · old ↔ new/young · happy ↔ sad · easy ↔ difficult"]},{"h":"Order of adjectives (basic)","p":["When two adjectives describe a noun, opinion comes before fact: a nice big house (opinion + size)."],"ex":["a beautiful old city · a small black bag"]},{"h":"Very / really","p":["Use very or really before an adjective to make it stronger."],"ex":["It’s very cold. · She’s really kind."]}],"tip":"Adjectives never take a plural -s in English: say ‘three big dogs’, not ‘three bigs dogs’.","examples":["a red car → two red cars (never ‘reds’)","The flowers are beautiful.","big ↔ small · hot ↔ cold · easy ↔ difficult","a small black bag (size before colour)","It’s very cold today.","a nice big house (opinion before size)"],"mistakes":[{"x":"a car red","v":"a red car (adjective before the noun)"},{"x":"They are happys.","v":"They are happy. (adjectives have no plural -s)"}],"quiz":[{"q":"Choose the correct order.","o":["a car red","red a car","a red car","car a red"],"a":2,"e":"Adjective before noun: a red car.","d":"easy"},{"q":"The opposite of 'big' is ___.","o":["large","small","tall","wide"],"a":1,"e":"big ↔ small.","d":"easy"},{"q":"The flowers are ___.","o":["beautifuls","beautiful","beautify","a beautiful"],"a":1,"e":"Adjective after ‘be’, no plural -s: are beautiful.","d":"easy"},{"q":"The opposite of 'hot' is ___.","o":["warm","cool","cold","dry"],"a":2,"e":"hot ↔ cold.","d":"easy"},{"q":"It's a ___ day.","o":["sun","sunny","suns","sunnies"],"a":1,"e":"We need an adjective before ‘day’: a sunny day.","d":"easy"},{"q":"Choose the correct sentence.","o":["They are happys.","They are happy.","They happy are.","They are a happy."],"a":1,"e":"Adjective after ‘be’, no -s: are happy.","d":"med"},{"q":"The opposite of 'difficult' is ___.","o":["hard","easy","heavy","long"],"a":1,"e":"difficult ↔ easy.","d":"med"},{"q":"Which order is correct?","o":["a black small bag","a small black bag","black a small bag","small a black bag"],"a":1,"e":"Size before colour: a small black bag.","d":"med"},{"q":"She has ___ eyes.","o":["blue","blues","a blue","blueing"],"a":0,"e":"Adjective stays singular: blue eyes.","d":"med"},{"q":"Make it stronger: 'The film was ___ good.'","o":["very","much","many","more very"],"a":0,"e":"‘very’ + adjective: very good.","d":"med"},{"q":"Find the mistake: 'I have two reds pens.'","o":["two → second","reds → red","pens → pen","no mistake"],"a":1,"e":"Adjectives don’t take -s: two red pens.","d":"hard"},{"q":"Choose the natural order.","o":["a nice big house","a big nice house","nice a big house","a house big nice"],"a":0,"e":"Opinion (nice) before size (big): a nice big house.","d":"hard"},{"q":"Complete: 'My grandfather is ___, but he feels ___.'","o":["old / young","young / old","olds / young","old / youngs"],"a":0,"e":"old ↔ young; adjectives stay singular.","d":"hard"},{"q":"Which sentence is correct?","o":["It is a interesting book.","It is an interesting book.","It is interesting a book.","It is a book interesting."],"a":1,"e":"‘interesting’ starts with a vowel sound → ‘an’, and the adjective goes before the noun.","d":"hard"},{"q":"Choose the correct description.","o":["a expensive new phone","an new expensive phone","a new expensive phone","an expensive new phone"],"a":3,"e":"‘an’ (vowel sound) + opinion/fact order: an expensive new phone.","d":"hard"}]},{"id":"g11","title":"Quantity: some / any","lead":"‘Some’ and ‘any’ talk about an amount that isn’t exact. Choosing between them depends on whether the sentence is positive, negative or a question — and on whether the noun can be counted.","leadTr":{"uz":"‘Some’ va ‘any’ aniq boʻlmagan miqdor haqida. Ular orasida tanlash gap tasdiq, inkor yoki savol ekanligiga va ot sanaladimi-yoʻqligiga bogʻliq.","ru":"‘Some’ и ‘any’ говорят о неточном количестве. Выбор зависит от того, утверждение это, отрицание или вопрос, и можно ли сосчитать существительное."},"situation":"","blocks":[{"h":"Countable vs. uncountable","p":["Countable nouns have a plural (apple → apples). Uncountable nouns don’t (water, rice, money, bread)."],"ex":["three apples (countable) · some water (uncountable)"]},{"h":"some — positive sentences","p":["Use some in affirmative sentences with plural and uncountable nouns."],"ex":["I have some friends here. · There is some milk in the cup."]},{"h":"any — negatives & questions","p":["Use any in negatives and most questions."],"ex":["I don’t have any money. · Is there any sugar?"]},{"h":"some in offers/requests","p":["We use some (not any) in polite offers and requests, even though they are questions."],"ex":["Would you like some tea? · Can I have some water, please?"]}],"tip":"With uncountable nouns, don’t use a/an or a plural: say ‘some bread’, not ‘a bread’ or ‘breads’.","examples":["I have some apples.","There isn’t any milk.","Is there any bread?","Would you like some tea? (offer)","Can I have some water? (request)","We have some rice but we don’t have any eggs."],"mistakes":[{"x":"I don’t have some sugar.","v":"I don’t have any sugar. (negative → any)"},{"x":"Do you have some questions?","v":"Do you have any questions? (question → any)"}],"quiz":[{"q":"I have ___ apples.","o":["any","some","a","an"],"a":1,"e":"Positive sentence → some.","d":"easy"},{"q":"There isn't ___ juice.","o":["some","any","a","the some"],"a":1,"e":"Negative sentence → any.","d":"easy"},{"q":"Is there ___ bread?","o":["some","a","any","an"],"a":2,"e":"Question → any.","d":"easy"},{"q":"Which noun is uncountable?","o":["apple","egg","rice","banana"],"a":2,"e":"‘Rice’ is uncountable.","d":"easy"},{"q":"We have ___ eggs in the fridge.","o":["any","a","some","an"],"a":2,"e":"Positive + plural → some.","d":"easy"},{"q":"Would you like ___ coffee?","o":["any","some","a","an"],"a":1,"e":"Polite offer uses ‘some’.","d":"med"},{"q":"He doesn't have ___ brothers.","o":["some","any","a","the"],"a":1,"e":"Negative → any.","d":"med"},{"q":"Can I have ___ water, please?","o":["any","a","some","an"],"a":2,"e":"Polite request uses ‘some’.","d":"med"},{"q":"Choose the correct sentence.","o":["I need a bread.","I need some bread.","I need breads.","I need an bread."],"a":1,"e":"‘Bread’ is uncountable → some bread.","d":"med"},{"q":"There are ___ books on the shelf.","o":["any","a","some","much"],"a":2,"e":"Positive + plural → some.","d":"med"},{"q":"Find the mistake: 'Do you have some questions?'","o":["some → any","Do → Are","have → has","no mistake"],"a":0,"e":"In a normal question we use ‘any’: Do you have any questions?","d":"hard"},{"q":"Complete: 'We have ___ rice but we don't have ___ vegetables.'","o":["any / some","some / any","some / some","any / any"],"a":1,"e":"Positive → some rice; negative → any vegetables.","d":"hard"},{"q":"Which is correct?","o":["There aren't some chairs.","There aren't any chairs.","There isn't any chairs.","There are any chairs."],"a":1,"e":"Negative + plural → aren’t any.","d":"hard"},{"q":"Choose the natural offer.","o":["Would you like any cake?","Do you want some help — yes or no?","Would you like some cake?","You like any cake?"],"a":2,"e":"Offers use ‘some’: Would you like some cake?","d":"hard"},{"q":"Complete: 'Is there ___ milk? — Yes, there's ___.'","o":["some / any","any / some","any / any","some / some"],"a":1,"e":"Question → any; positive answer → some.","d":"hard"}]},{"id":"g12","title":"Prepositions","lead":"Prepositions are small words that show relationships of place and time. The most common are in, on, at, and a few movement words. Learn them in fixed phrases.","leadTr":{"uz":"Predloglar joy va vaqt munosabatlarini koʻrsatadigan kichik soʻzlar. Eng koʻp uchraydiganlari in, on, at va bir nechta harakat soʻzlari. Ularni tayyor iboralarda oʻrganing.","ru":"Предлоги — маленькие слова, показывающие отношения места и времени. Самые частые — in, on, at и несколько слов движения. Учите их в устойчивых выражениях."},"situation":"","blocks":[{"h":"Place: in / on / at","p":["in = inside / areas (in a box, in Tashkent). on = a surface (on the table, on the wall). at = a point/place (at the door, at school)."],"ex":["The keys are in my bag. · The photo is on the wall. · I’m at home."]},{"h":"More place words","p":["under (below), next to (beside), between (in the middle of two), behind, in front of, near."],"ex":["The cat is under the chair. · The bank is next to the school."]},{"h":"Time: at / on / in","p":["at + clock time/night (at 7, at night). on + days/dates (on Monday). in + months/years/parts of day (in July, in the morning)."],"ex":["at 6 o’clock · on Friday · in 2026 · in the evening"]},{"h":"Fixed expressions","p":["Some phrases must be memorised."],"ex":["at home · at school · at work · in bed · on time · at the weekend"]}],"tip":"Time prepositions follow a pattern: at = small (clock time), on = medium (a day), in = large (month/year). Think small → big.","examples":["The book is on the table.","I live in Manchester.","The cat is under the chair.","We meet on Monday at 8 o’clock.","My birthday is in July.","The shop is between the bank and the café."],"mistakes":[{"x":"I get up in 7 o’clock.","v":"I get up at 7 o’clock. (clock time → at)"},{"x":"See you in Monday.","v":"See you on Monday. (days → on)"}],"quiz":[{"q":"The book is ___ the table.","o":["in","on","at","under"],"a":1,"e":"A surface → on the table.","d":"easy"},{"q":"I live ___ Tashkent.","o":["on","at","in","by"],"a":2,"e":"Cities use ‘in’.","d":"easy"},{"q":"The cat is ___ the chair. (below it)","o":["on","under","at","in"],"a":1,"e":"Below = under.","d":"easy"},{"q":"We meet ___ Monday.","o":["in","at","on","by"],"a":2,"e":"Days use ‘on’: on Monday.","d":"easy"},{"q":"School starts ___ 8 o'clock.","o":["in","on","at","by"],"a":2,"e":"Clock time uses ‘at’.","d":"easy"},{"q":"The shop is ___ the bank and the café.","o":["between","on","under","at"],"a":0,"e":"In the middle of two things = between.","d":"med"},{"q":"My birthday is ___ July.","o":["on","at","in","by"],"a":2,"e":"Months use ‘in’: in July.","d":"med"},{"q":"She is ___ home now.","o":["in","on","at","to"],"a":2,"e":"Fixed phrase: at home.","d":"med"},{"q":"The picture is ___ the wall.","o":["in","on","at","under"],"a":1,"e":"A surface (wall) → on.","d":"med"},{"q":"The dog is ___ the door, waiting.","o":["in","on","at","under"],"a":2,"e":"A point/place → at the door.","d":"med"},{"q":"Complete: 'I get up ___ 7 ___ the morning.'","o":["in / at","at / in","on / in","at / on"],"a":1,"e":"Clock time ‘at 7’, part of day ‘in the morning’.","d":"hard"},{"q":"Which is correct?","o":["I'm on bed.","I'm at bed.","I'm in bed.","I'm to bed."],"a":2,"e":"Fixed phrase: in bed.","d":"hard"},{"q":"Find the mistake: 'The bank is in front the school.'","o":["in → on","front → back","in front the → in front of the","no mistake"],"a":2,"e":"The phrase is ‘in front of’: in front of the school.","d":"hard"},{"q":"Complete: 'See you ___ the weekend, ___ Saturday ___ 5 pm.'","o":["at / on / at","on / at / in","in / on / at","at / in / on"],"a":0,"e":"‘at the weekend’, ‘on Saturday’, ‘at 5 pm’.","d":"hard"},{"q":"Choose the correct sentence.","o":["The ball is on the box. (inside it)","The keys are in the table.","She is at the kitchen.","The lamp is between two windows."],"a":3,"e":"‘between two windows’ is correct; the others mix up in/on/at.","d":"hard"}]},{"id":"g13","title":"Question words","lead":"Question words (wh- words) ask for information. Each one asks about something different — a person, a place, a time, a reason. Knowing them lets you ask about everything around you.","leadTr":{"uz":"Savol soʻzlari (wh- soʻzlar) maʼlumot soʻraydi. Har biri boshqa narsani soʻraydi — odam, joy, vaqt, sabab. Ularni bilish atrofingizdagi hamma narsani soʻrash imkonini beradi.","ru":"Вопросительные слова (wh-) запрашивают информацию. Каждое спрашивает о своём — о человеке, месте, времени, причине. Зная их, вы можете спросить обо всём."},"situation":"“Where do you live?” “What do you do?” “When does the film start?” — Question words go first, then we use do / does + subject + verb.","blocks":[{"h":"The main wh- words","p":["What (thing), Who (person), Where (place), When (time), Why (reason), How (way/manner)."],"ex":["What is this? · Who is she? · Where do you live? · Why are you late?"]},{"h":"how many / how much","p":["How many + countable (how many books). How much + uncountable / price (how much water, how much is it)."],"ex":["How many students are there? · How much is this jacket?"]},{"h":"Word order with be","p":["wh- word + be + subject."],"ex":["Where is the station? · Who are they?"]},{"h":"Word order with do/does","p":["wh- word + do/does + subject + base verb."],"ex":["What do you want? · Where does she work?"]}],"tip":"Use how many for things you can count and how much for things you can’t (and for prices): ‘How many apples?’ but ‘How much money?’","examples":["What is your name?","Where do you live?","Who is that man?","When does the film start?","How many apples are there?","How much is this jacket?"],"mistakes":[{"x":"Where you live?","v":"Where do you live? (add do/does)"},{"x":"What you are doing?","v":"What are you doing? (be questions: be + subject)"},{"x":"How much costs it?","v":"How much does it cost?"}],"quiz":[{"q":"___ is your name?","o":["Who","What","Where","When"],"a":1,"e":"We ask about a name (thing) with ‘What’.","d":"easy"},{"q":"___ do you live?","o":["What","Who","Where","Why"],"a":2,"e":"Place → Where.","d":"easy"},{"q":"___ is your teacher?","o":["What","Who","Where","When"],"a":1,"e":"Person → Who.","d":"easy"},{"q":"___ is your birthday?","o":["Where","When","Who","How"],"a":1,"e":"Time/date → When.","d":"easy"},{"q":"___ are you sad?","o":["What","Where","Why","Who"],"a":2,"e":"Reason → Why.","d":"easy"},{"q":"___ apples are there?","o":["How much","How many","How","What"],"a":1,"e":"Countable ‘apples’ → How many.","d":"med"},{"q":"___ is this bag?","o":["How many","How much","How","Who"],"a":1,"e":"Price → How much.","d":"med"},{"q":"___ do you go to school?","o":["What","Who","Where","Which one"],"a":2,"e":"Place → Where.","d":"med"},{"q":"___ old are you?","o":["What","How","Who","When"],"a":1,"e":"Age uses ‘How old’.","d":"med"},{"q":"___ does she work?","o":["Where","Who","What","Which"],"a":0,"e":"Place of work → Where.","d":"med"},{"q":"Which question is correct?","o":["Where you are from?","Where are you from?","Where from you are?","From where you are?"],"a":1,"e":"wh- + be + subject: Where are you from?","d":"hard"},{"q":"Complete: '___ time ___ the film start?'","o":["What / does","What / do","When / does","How / does"],"a":0,"e":"‘What time’ + does (it) start.","d":"hard"},{"q":"Find the mistake: 'How much books do you have?'","o":["How much → How many","books → book","do → does","no mistake"],"a":0,"e":"Countable ‘books’ needs ‘How many’.","d":"hard"},{"q":"Choose the correct order.","o":["What you do want?","What do you want?","What want you do?","Do what you want?"],"a":1,"e":"wh- + do + subject + base verb: What do you want?","d":"hard"},{"q":"Complete: '___ is the weather today?'","o":["What","How","Who","Where"],"a":1,"e":"We ask about weather with ‘How is the weather?’","d":"hard"}]},{"id":"g14","title":"Verb patterns: like + -ing","lead":"To talk about activities you enjoy or dislike, English often uses a verb of feeling (like, love, hate, enjoy) followed by the -ing form. This is a key A1 pattern.","leadTr":{"uz":"Yoqtirgan yoki yoqtirmagan mashgʻulotlar haqida gapirish uchun ingliz tili koʻpincha his feʼli (like, love, hate, enjoy) + -ing shaklini ishlatadi. Bu muhim A1 naqsh.","ru":"Чтобы говорить о занятиях, которые нравятся или нет, английский часто использует глагол чувства (like, love, hate, enjoy) + форму -ing. Это важная модель уровня A1."},"situation":"","blocks":[{"h":"like / love / hate / enjoy + -ing","p":["After these verbs, an activity usually takes the -ing form."],"ex":["I like swimming. · She loves dancing. · They hate getting up early."]},{"h":"+ noun","p":["These verbs can also be followed directly by a noun."],"ex":["I like music. · She loves chocolate."]},{"h":"Negatives","p":["Use don’t/doesn’t + like/enjoy + -ing."],"ex":["I don’t like cooking. · He doesn’t enjoy running."]},{"h":"would like = want (polite)","p":["would like is different: it means ‘want’ and is followed by to + base verb or a noun."],"ex":["I’d like to go home. · I’d like a coffee."]}],"tip":"Don’t confuse like + -ing (enjoy an activity) with would like + to (want something now): ‘I like swimming’ vs. ‘I’d like to swim now.’","examples":["I like swimming in summer.","She loves dancing.","They hate getting up early.","He doesn’t enjoy cooking.","I’d like to go home now. (= want)","I’d like a coffee, please."],"mistakes":[{"x":"I like swim.","v":"I like swimming. (like + -ing)"},{"x":"I enjoy to read.","v":"I enjoy reading. (enjoy + -ing)"}],"quiz":[{"q":"I like ___ books.","o":["read","reading","reads","to reading"],"a":1,"e":"After ‘like’ we use -ing: reading.","d":"easy"},{"q":"She loves ___.","o":["dance","dancing","dances","to dancing"],"a":1,"e":"love + -ing: dancing.","d":"easy"},{"q":"They hate ___ up early.","o":["get","getting","gets","to getting"],"a":1,"e":"hate + -ing: getting.","d":"easy"},{"q":"I like ___. (a noun)","o":["music","musicing","to music","musics"],"a":0,"e":"like + noun: music.","d":"easy"},{"q":"We enjoy ___ football.","o":["play","playing","plays","to play"],"a":1,"e":"enjoy + -ing: playing.","d":"easy"},{"q":"He doesn't like ___.","o":["cook","cooking","cooks","to cooking"],"a":1,"e":"don’t/doesn’t like + -ing: cooking.","d":"med"},{"q":"Choose the correct sentence.","o":["I like to swimming.","I like swimming.","I like swims.","I am like swimming."],"a":1,"e":"like + -ing: I like swimming.","d":"med"},{"q":"She loves ___ to music.","o":["listen","listening","listens","to listening"],"a":1,"e":"love + -ing: listening.","d":"med"},{"q":"I'd like ___ a sandwich, please.","o":["have","having","to have","has"],"a":2,"e":"would like + to + base verb: to have.","d":"med"},{"q":"They don't enjoy ___ in winter.","o":["run","running","runs","to running"],"a":1,"e":"enjoy + -ing: running.","d":"med"},{"q":"Which sentence is correct?","o":["I would like swimming now.","I'd like to swim now.","I'd like swim now.","I like to swimming now."],"a":1,"e":"would like + to + base verb: I’d like to swim.","d":"hard"},{"q":"Complete: 'She likes ___ but she'd like ___ a new hobby.'","o":["paint / to find","painting / find","painting / to find","to paint / finding"],"a":2,"e":"like + -ing (painting); would like + to (to find).","d":"hard"},{"q":"Find the mistake: 'I love to cooking.'","o":["love → like","to cooking → cooking","cooking → cook","no mistake"],"a":1,"e":"After ‘love’ use -ing without ‘to’: I love cooking.","d":"hard"},{"q":"Choose the natural request.","o":["I like a tea, please.","I'd like a tea, please.","I liking a tea, please.","I like to a tea, please."],"a":1,"e":"Polite request: I’d like a tea, please.","d":"hard"},{"q":"Complete: 'Do you like ___? — Yes, but I'd like ___ a film tonight.'","o":["read / to watch","reading / watch","reading / to watch","to read / watching"],"a":2,"e":"like + -ing (reading); would like + to (to watch).","d":"hard"}]},{"id":"g15","title":"Numbers & measures","lead":"Numbers are everywhere — ages, prices, dates and the time. This lesson covers cardinal and ordinal numbers, and how to say dates, prices and the clock.","leadTr":{"uz":"Sonlar hamma joyda — yosh, narx, sana va vaqt. Bu dars sanoq va tartib sonlarni, hamda sana, narx va soatni qanday aytishni oʻrgatadi.","ru":"Числа повсюду — возраст, цены, даты и время. Этот урок охватывает количественные и порядковые числительные, а также как называть даты, цены и время."},"situation":"","blocks":[{"h":"Cardinal numbers","p":["These count: one, two, three… Note the tricky ‘teens’ and ‘tens’: thirteen vs. thirty, fifteen vs. fifty."],"ex":["13 = thirteen · 30 = thirty · 15 = fifteen · 50 = fifty"]},{"h":"Ordinal numbers","p":["These show order: first (1st), second (2nd), third (3rd), fourth (4th)… We use them for dates and floors."],"ex":["the first of May · the third floor"]},{"h":"Dates","p":["Say the day as an ordinal: ‘the 5th of June’ or ‘June the 5th’. Years: 2026 = ‘twenty twenty-six’."],"ex":["My birthday is the 12th of July."]},{"h":"Prices & the time","p":["Prices: $5.50 = ‘five fifty’ / ‘five dollars fifty’. Time: 9:00 = ‘nine o’clock’, 9:15 = ‘quarter past nine’, 9:30 = ‘half past nine’, 9:45 = ‘quarter to ten’."],"ex":["It’s half past six. · It costs twenty euros."]}],"tip":"Listen for the stress to tell teens from tens: thirTEEN (stress at the end) vs. THIRty (stress at the start).","examples":["13 = thirteen; 30 = thirty.","the first of May; the third floor.","6:30 = half past six; 7:45 = quarter to eight.","It costs twenty pounds.","My exam is on the 12th of June.","2026 = ‘twenty twenty-six’."],"mistakes":[{"x":"two hundreds people","v":"two hundred people (no -s after a number)"},{"x":"I am twenty years.","v":"I am twenty years old."},{"x":"It costs five dollar.","v":"It costs five dollars. (plural after numbers > 1)"}],"quiz":[{"q":"How do you write the number 15?","o":["fifty","fiveteen","fifteen","fifthteen"],"a":2,"e":"15 = fifteen.","d":"easy"},{"q":"The ordinal form of 'two' is ___.","o":["twoth","second","twice","two"],"a":1,"e":"two → second (2nd).","d":"easy"},{"q":"Which is a month?","o":["Monday","August","Winter","Tuesday"],"a":1,"e":"August is a month.","d":"easy"},{"q":"9:00 — we say ___.","o":["nine o'clock","nine hours","the nine","nine time"],"a":0,"e":"A full hour → o’clock.","d":"easy"},{"q":"Which number comes after nineteen?","o":["eighteen","twenty","twelve","ninety"],"a":1,"e":"After 19 comes 20 (twenty).","d":"easy"},{"q":"30 is written ___.","o":["thirteen","thirty","threety","thurty"],"a":1,"e":"30 = thirty (note: not thirteen).","d":"med"},{"q":"The 3rd of May means the ___ day of May.","o":["second","third","fourth","first"],"a":1,"e":"3rd = third.","d":"med"},{"q":"6:30 — we say ___.","o":["half to six","half past six","six and half","thirty past six"],"a":1,"e":"6:30 = half past six.","d":"med"},{"q":"The ordinal of 'five' is ___.","o":["fiveth","fifth","fifeth","five"],"a":1,"e":"five → fifth.","d":"med"},{"q":"$10.20 is said ___.","o":["ten point twenty","ten twenty","ten and twenty","twenty ten"],"a":1,"e":"Prices: ‘ten twenty’.","d":"med"},{"q":"Which is correct for 13 vs 30?","o":["thirteen = 30","thirty = 13","thirteen = 13","thirteen = 31"],"a":2,"e":"thirteen = 13; thirty = 30.","d":"hard"},{"q":"7:45 — we say ___.","o":["quarter past seven","quarter to eight","three quarters seven","forty-five to eight"],"a":1,"e":"7:45 = quarter to eight.","d":"hard"},{"q":"How do you say the year 2026?","o":["two thousand twenty-six","twenty twenty-six","two zero two six","twenty-six twenty"],"a":1,"e":"2026 is usually ‘twenty twenty-six’.","d":"hard"},{"q":"Complete the date: 'My exam is on the ___ of March.' (1)","o":["one","oneth","first","firstth"],"a":2,"e":"Dates use ordinals: the first of March.","d":"hard"},{"q":"It's 8:15. The correct phrase is ___.","o":["quarter to eight","quarter past eight","half past eight","fifteen to eight"],"a":1,"e":"8:15 = quarter past eight.","d":"hard"}]}],"vocabulary":[{"id":"v1","title":"Personal information, greetings & family","words":[{"w":"name","pos":"n","ipa":"/neɪm/","uz":"ism","ru":"имя","def":"","ex":"My name is Jack."},{"w":"surname","pos":"n","ipa":"/ˈsɜːneɪm/","uz":"familiya","ru":"фамилия","def":"","ex":"Her surname is Brown."},{"w":"age","pos":"n","ipa":"/eɪdʒ/","uz":"yosh","ru":"возраст","def":"","ex":"What is your age?"},{"w":"address","pos":"n","ipa":"/əˈdres/","uz":"manzil","ru":"адрес","def":"","ex":"This is my home address."},{"w":"hello","pos":"int","ipa":"/həˈləʊ/","uz":"salom","ru":"привет","def":"","ex":"Hello! How are you?"},{"w":"goodbye","pos":"int","ipa":"/ɡʊdˈbaɪ/"
