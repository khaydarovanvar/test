e use ‘Although’.","d":"hard"},{"q":"Complete: '___ his wealth, he was unhappy, ___ his brother, who had little, was content.'","o":["Although / despite","Despite / whereas","Whereas / although","However / despite"],"a":1,"e":"Despite + noun ‘his wealth’ + whereas (contrast).","d":"hard"},{"q":"Which is correct?","o":["In spite the danger, they climbed.","In spite of the danger, they climbed.","In spite of they were in danger, they climbed.","In spite that the danger, they climbed."],"a":1,"e":"in spite of + noun.","d":"hard"},{"q":"Complete: '___ being cheaper, the second option is better, ___ the first looks nicer.'","o":["Although / whereas","Despite / whereas","Despite / however","Whereas / although"],"a":1,"e":"Despite + -ing ‘being cheaper’ + whereas (contrast).","d":"hard"},{"q":"Choose the sentence that links two contrasting sentences.","o":["Although it was hard, however we tried.","It was hard. However, we tried.","Despite however it was hard.","However it was hard we tried."],"a":1,"e":"However links two separate sentences.","d":"hard"}]},{"id":"g15","title":"Articles & determiners: advanced","lead":"At B2, article choice depends on shades of meaning: specific vs. general, the use of ‘the’ with unique reference, and fixed patterns with quantifiers and abstract nouns.","leadTr":null,"situation":"","blocks":[{"h":"the for unique / specified reference","p":["Use the when context makes the noun specific, after superlatives, and with ‘the only/same/first’."],"ex":["The book you lent me was great. · He’s the best. · It’s the only way."]},{"h":"zero article for general meaning","p":["Use no article for plural and uncountable nouns talking in general."],"ex":["Happiness matters. · Children learn fast. · I study history."]},{"h":"the + adjective (groups)","p":["the + adjective can mean a whole group of people."],"ex":["The rich get richer. · The government helps the unemployed."]},{"h":"determiners & ‘of’","p":["Use of with the/my/these: ‘most of the students’, ‘none of my friends’; without ‘of’ for general: ‘most students’."],"ex":["Most of the water was gone. · Most water is recycled here."]}],"tip":"Use ‘the’ when the noun is made specific by context (‘the book you lent me’), but no article for general statements with plurals/uncountables (‘books are useful’).","examples":["\\"The information you gave me was helpful.\\"","\\"Knowledge is power.\\"","\\"She wants to help the poor.\\"","\\"Most of the guests had left.\\"","\\"He’s the first to arrive.\\"","\\"I don’t drink coffee.\\""],"mistakes":[{"x":"I’m interested in the nature.","v":"…in nature. (general uncountable → no article)"},{"x":"He gave me an useful advice.","v":"He gave me useful advice. (advice is uncountable)"}],"quiz":[{"q":"___ book you recommended was excellent.","o":["A","An","The","—"],"a":2,"e":"Specified by context → The book you recommended.","d":"easy"},{"q":"___ is important for everyone. (general)","o":["The health","A health","Health","An health"],"a":2,"e":"General uncountable → no article.","d":"easy"},{"q":"The government should help ___.","o":["a poor","the poor","poor","poors"],"a":1,"e":"the + adjective = the group: the poor.","d":"easy"},{"q":"___ of the students passed.","o":["Most","Most of","The most","Much"],"a":1,"e":"+ the → Most of the students.","d":"easy"},{"q":"She's ___ only person who knows.","o":["a","an","the","—"],"a":2,"e":"‘only’ → the only person.","d":"easy"},{"q":"I love ___ in general. (plural, general)","o":["the dogs","dogs","a dogs","an dog"],"a":1,"e":"General plural → no article: dogs.","d":"med"},{"q":"___ water in this bottle is dirty.","o":["A","An","The","—"],"a":2,"e":"Specified ‘in this bottle’ → The water.","d":"med"},{"q":"___ students learn at different speeds. (general)","o":["The","A","Most","—"],"a":3,"e":"General plural → no article.","d":"med"},{"q":"He was ___ first to finish.","o":["a","an","the","—"],"a":2,"e":"Ordinal → the first.","d":"med"},{"q":"Choose the general statement.","o":["The life is hard.","Life is hard.","A life is hard.","An life is hard."],"a":1,"e":"Abstract general → Life is hard.","d":"med"},{"q":"Find the mistake: 'I'm interested in the nature.'","o":["the nature → nature","interested → interesting","in → on","no mistake"],"a":0,"e":"General uncountable → nature (no article).","d":"hard"},{"q":"Complete: '___ rich should pay more tax, and ___ advice you gave was wise.'","o":["A / the","The / the","The / a","Rich / the"],"a":1,"e":"the rich (group) + the advice (specified).","d":"hard"},{"q":"Which is correct?","o":["Most of people work hard.","Most people work hard.","The most people work hard.","Most of the people hard work."],"a":1,"e":"General → Most people (no ‘of’ without the).","d":"hard"},{"q":"Complete: 'She studies ___ history of ___ art.'","o":["the / —","— / the","the / the","a / an"],"a":0,"e":"‘the history of art’: specified ‘the history’, general ‘art’.","d":"hard"},{"q":"Choose the correct sentence.","o":["He gave me an useful advice.","He gave me a useful advice.","He gave me useful advice.","He gave me the useful advices."],"a":2,"e":"‘advice’ is uncountable → no article, no plural.","d":"hard"}]}],"vocabulary":[{"id":"v1","title":"Work & business","words":[{"w":"colleague","pos":"n","ipa":"/ˈkɒliːɡ/","uz":"hamkasb","ru":"коллега","def":"","ex":"My colleagues are very supportive."},{"w":"deadline","pos":"n","ipa":"/ˈdedlaɪn/","uz":"muddat","ru":"крайний срок","def":"","ex":"We're working to a tight deadline."},{"w":"negotiate","pos":"v","ipa":"/nɪˈɡəʊʃieɪt/","uz":"muzokara olib bormoq","ru":"вести переговоры","def":"","ex":"They negotiated a better contract."},{"w":"profit","pos":"n","ipa":"/ˈprɒfɪt/","uz":"foyda","ru":"прибыль","def":"","ex":"The company made a large profit."},{"w":"client","pos":"n","ipa":"/ˈklaɪənt/","uz":"mijoz","ru":"клиент","def":"","ex":"We met an important client."},{"w":"redundant","pos":"adj","ipa":"/rɪˈdʌndənt/","uz":"ishdan boʻshatilgan","ru":"сокращённый","def":"","ex":"He was made redundant last year."},{"w":"invest","pos":"v","ipa":"/ɪnˈvest/","uz":"sarmoya kiritmoq","ru":"инвестировать","def":"","ex":"They invested in new technology."},{"w":"revenue","pos":"n","ipa":"/ˈrevənjuː/","uz":"daromad","ru":"выручка","def":"","ex":"Annual revenue rose by ten percent."},{"w":"entrepreneur","pos":"n","ipa":"/ˌɒntrəprəˈnɜː/","uz":"tadbirkor","ru":"предприниматель","def":"","ex":"She's a successful entrepreneur."},{"w":"stakeholder","pos":"n","ipa":"/ˈsteɪkhəʊldə/","uz":"manfaatdor tomon","ru":"заинтересованная сторона","def":"","ex":"All stakeholders were consulted."},{"w":"merge","pos":"v","ipa":"/mɜːdʒ/","uz":"birlashmoq","ru":"сливаться","def":"","ex":"The two firms merged."},{"w":"bankrupt","pos":"adj","ipa":"/ˈbæŋkrʌpt/","uz":"bankrot","ru":"банкрот","def":"","ex":"The business went bankrupt."},{"w":"shareholder","pos":"n","ipa":"/ˈʃeəhəʊldə/","uz":"aksiyador","ru":"акционер","def":"","ex":"Shareholders met to vote."},{"w":"productivity","pos":"n","ipa":"/ˌprɒdʌkˈtɪvəti/","uz":"unumdorlik","ru":"производительность","def":"","ex":"Productivity has improved."},{"w":"recruit","pos":"v","ipa":"/rɪˈkruːt/","uz":"ishga olmoq","ru":"набирать","def":"","ex":"They are recruiting new staff."},{"w":"strategy","pos":"n","ipa":"/ˈstrætədʒi/","uz":"strategiya","ru":"стратегия","def":"","ex":"We need a clear strategy."},{"w":"budget","pos":"n","ipa":"/ˈbʌdʒɪt/","uz":"byudjet","ru":"бюджет","def":"","ex":"The project went over budget."},{"w":"competitor","pos":"n","ipa":"/kəmˈpetɪtə/","uz":"raqobatchi","ru":"конкурент","def":"","ex":"Our main competitor cut prices."},{"w":"launch","pos":"v","ipa":"/lɔːntʃ/","uz":"ishga tushirmoq","ru":"запускать","def":"","ex":"They launched a new product."},{"w":"turnover","pos":"n","ipa":"/ˈtɜːnəʊvə/","uz":"aylanma","ru":"оборот","def":"","ex":"The shop has a high turnover."},{"w":"promote","pos":"v","ipa":"/prəˈməʊt/","uz":"lavozimini koʻtarmoq","ru":"продвигать","def":"","ex":"She was promoted to manager."},{"w":"sustainable","pos" deb topmoq","ru":"осуждать","def":"","ex":"He was convicted of theft."},{"w":"fraud","pos":"n","ipa":"/frɔːd/","uz":"firibgarlik","ru":"мошенничество","def":"","ex":"She was charged with fraud."}]},{"id":"v9","title":"Emotions & psychology","words":[{"w":"anxiety","pos":"n","ipa":"/æŋˈzaɪəti/","uz":"xavotir","ru":"тревога","def":"","ex":"She suffers from anxiety."},{"w":"confidence","pos":"n","ipa":"/ˈkɒnfɪdəns/","uz":"oʻziga ishonch","ru":"уверенность","def":"","ex":"He spoke with confidence."},{"w":"frustration","pos":"n","ipa":"/frʌˈstreɪʃn/","uz":"umidsizlik","ru":"разочарование","def":"","ex":"She hid her frustration."},{"w":"empathy","pos":"n","ipa":"/ˈempəθi/","uz":"hamdardlik","ru":"эмпатия","def":"","ex":"A nurse needs empathy."},{"w":"motivation","pos":"n","ipa":"/ˌməʊtɪˈveɪʃn/","uz":"motivatsiya","ru":"мотивация","def":"","ex":"His motivation is impressive."},{"w":"resilience","pos":"n","ipa":"/rɪˈzɪliəns/","uz":"chidamlilik","ru":"устойчивость","def":"","ex":"Resilience helps in hard times."},{"w":"grief","pos":"n","ipa":"/ɡriːf/","uz":"qaygʻu","ru":"горе","def":"","ex":"She was overcome by grief."},{"w":"mood","pos":"n","ipa":"/muːd/","uz":"kayfiyat","ru":"настроение","def":"","ex":"He's in a good mood today."},{"w":"behaviour","pos":"n","ipa":"/bɪˈheɪvjə/","uz":"xulq","ru":"поведение","def":"","ex":"Her behaviour changed suddenly."},{"w":"self-esteem","pos":"n","ipa":"/ˌself ɪˈstiːm/","uz":"oʻz-oʻzini hurmat qilish","ru":"самооценка","def":"","ex":"Praise builds self-esteem."},{"w":"depression","pos":"n","ipa":"/dɪˈpreʃn/","uz":"depressiya","ru":"депрессия","def":"","ex":"He is recovering from depression."},{"w":"emotion","pos":"n","ipa":"/ɪˈməʊʃn/","uz":"hissiyot","ru":"эмоция","def":"","ex":"She struggled to control her emotion."},{"w":"stress","pos":"n","ipa":"/stres/","uz":"stress","ru":"стресс","def":"","ex":"Too much stress is harmful."},{"w":"trauma","pos":"n","ipa":"/ˈtrɔːmə/","uz":"ruhiy jarohat","ru":"травма","def":"","ex":"He never forgot the trauma."},{"w":"cope","pos":"v","ipa":"/kəʊp/","uz":"bardosh bermoq","ru":"справляться","def":"","ex":"She copes well with pressure."},{"w":"reaction","pos":"n","ipa":"/riˈækʃn/","uz":"reaksiya","ru":"реакция","def":"","ex":"His reaction surprised us."},{"w":"instinct","pos":"n","ipa":"/ˈɪnstɪŋkt/","uz":"instinkt","ru":"инстинкт","def":"","ex":"Trust your instinct."},{"w":"perception","pos":"n","ipa":"/pəˈsepʃn/","uz":"idrok","ru":"восприятие","def":"","ex":"Perception shapes reality."},{"w":"overwhelmed","pos":"adj","ipa":"/ˌəʊvəˈwelmd/","uz":"ezilgan","ru":"подавленный","def":"","ex":"She felt overwhelmed by work."},{"w":"attitude","pos":"n","ipa":"/ˈætɪtjuːd/","uz":"munosabat","ru":"отношение","def":"","ex":"A positive attitude helps."},{"w":"insecure","pos":"adj","ipa":"/ˌɪnsɪˈkjʊə/","uz":"oʻziga ishonchsiz","ru":"неуверенный","def":"","ex":"He feels insecure about it."},{"w":"wellbeing","pos":"n","ipa":"/ˌwelˈbiːɪŋ/","uz":"farovonlik","ru":"благополучие","def":"","ex":"They care about staff wellbeing."}]}],"reading":[{"id":"r1","title":"The Remote Working Debate","text":"Since the pandemic, working from home has become normal for millions of people. Supporters argue that it offers a better work-life balance: employees save hours that would otherwise be wasted commuting, and many report feeling less stressed and more productive.\\nNot everyone is convinced, however. Some managers worry that staff who work remotely are harder to supervise and less connected to their colleagues. Younger workers, in particular, may miss the informal learning that happens in an office, where they can pick up skills simply by watching experienced people.\\nThe truth probably lies somewhere in between. A growing number of companies in Manchester and London now offer a 'hybrid' model, in which employees spend part of the week at home and part in the office. Had this option been available ten years ago, it might have seemed strange. Today, it is increasingly seen as the best of both worlds.","quiz":[{"q":"What is one advantage of remote work mentioned?","o":["higher pay","a better work-life balance","more holidays","free meals"],"a":1,"e":"It offers a better work-life balance.","d":"medium"},{"q":"Why do some managers worry?","o":["Staff work too hard.","Staff are harder to supervise.","Offices are expensive.","Staff earn less."],"a":1,"e":"Remote staff are harder to supervise and less connected.","d":"medium"},{"q":"What might younger workers miss?","o":["higher salaries","informal learning in the office","longer holidays","free transport"],"a":1,"e":"They may miss informal learning from experienced colleagues.","d":"medium"},{"q":"What is the 'hybrid' model?","o":["working only at home","working only in the office","part home, part office","working at night"],"a":2,"e":"Part of the week at home, part in the office.","d":"medium"},{"q":"What is the writer's overall view of hybrid work?","o":["It is strange.","It is the best of both worlds.","It will fail.","It is only for managers."],"a":1,"e":"It is increasingly seen as the best of both worlds.","d":"medium"}]},{"id":"r2","title":"Living with Artificial Intelligence","text":"Artificial intelligence is no longer science fiction. It already recommends the films we watch, filters our emails, and helps doctors read medical scans. For many, these developments are exciting; for others, they are a cause for concern.\\nThose who welcome AI point to its potential to save lives and time. A computer can examine thousands of images far faster than a human, spotting patterns that might otherwise be missed. In industries from farming to finance, AI is helping people make better decisions.\\nYet the same technology raises difficult questions. If a self-driving car causes an accident, who is responsible? As machines take over more tasks, some jobs will certainly disappear. Supporters argue that new jobs will be created, just as they were during the Industrial Revolution. Critics are less sure. What seems clear is that AI is here to stay, and societies will need to decide carefully how to use it.","quiz":[{"q":"What does the text say AI already does?","o":["replaces all doctors","recommends films and filters emails","drives all cars","teaches in schools"],"a":1,"e":"It recommends films, filters emails and helps read scans.","d":"medium"},{"q":"Why is AI useful in medicine?","o":["It is cheaper.","It examines images faster than humans.","It never makes mistakes.","It replaces nurses."],"a":1,"e":"It can examine many images quickly and spot patterns.","d":"medium"},{"q":"What difficult question does the text raise?","o":["how fast cars go","who is responsible for a self-driving car accident","how to build computers","where to buy AI"],"a":1,"e":"Responsibility for a self-driving car accident.","d":"medium"},{"q":"What do supporters say about jobs?","o":["All jobs will be lost.","New jobs will be created.","No jobs will change.","Only farming jobs remain."],"a":1,"e":"They argue new jobs will be created.","d":"medium"},{"q":"What conclusion does the writer reach?","o":["AI should be banned.","AI will disappear soon.","AI is here to stay and must be used carefully.","AI is useless."],"a":2,"e":"AI is here to stay; societies must decide how to use it.","d":"medium"}]},{"id":"r3","title":"Why We Put Things Off","text":"Almost everyone procrastinates. We delay important tasks, choosing instead to check our phones, tidy a drawer, or make yet another cup of tea. We know we are wasting time, and yet we do it anyway. Why?\\nPsychologists suggest that procrastination is not really about laziness. It is more often about emotion. When a task makes us feel anxious or bored, our brain looks for an escape, and a quick, pleasant distraction provides instant relief. The problem, of course, is that the relief never lasts, and the task only grows more stressful.\\nThe good news is that procrastination can be managed. Experts recommend breaking a large task into small steps, so that it feels less frightening. It also helps to forgive yourself for past delays; research has shown that students who stopped criticising themselves actually procrastinated less in future. In other words, being kinder to ourselves may be the first step towards getting things done.","quiz":[{"q":"According to psychologists, procrastination is mainly about ___.","o":["laziness","emotion","intelligence","time"],"a":1,"e":"It is more about emotion than laziness.","d":"medium"},{"q":"Why does the brain seek distraction?","o":["to learn","for instant relief from anxiety or boredom","to save money","to sleep"],"a":1,"e":"Distraction gives instant relief from bad feelings.","d":"medium"},{"q":"What is the problem with distraction?","o":["It costs money.","The relief never lasts.","It is illegal.","It is tiring."],"a":1,"e":"The relief never lasts and the task grows more stressful.","d":"medium"},{"q":"What do experts recommend for big tasks?","o":["ignoring them","breaking them into small steps","doing them at night","asking others to do them"],"a":1,"e":"Break a large task into small steps.","d":"medium"},{"q":"What did research on students show?","o":["Self-criticism helped.","Forgiving themselves reduced procrastination.","Punishment worked best.","Nothing changed."],"a":1,"e":"Students who stopped self-criticism procrastinated less.","d":"medium"}]},{"id":"r4","title":"Report: Improving the Town Library","text":"Introduction\\nThe purpose of this report is to assess the current state of Brighton Central Library and to recommend improvements. The findings are based on a survey of 200 users and interviews with staff.\\n\\nFindings\\nThe majority of users praised the library's wide selection of books. However, several problems were identified. Firstly, the opening hours were felt to be too limited, particularly for those who work full-time. Secondly, the building's Wi-Fi was described as slow and unreliable. Finally, a number of younger visitors complained that there was nowhere quiet to study.\\n\\nRecommendations\\nIn light of these findings, it is recommended that the library extend its opening hours into the evening. Furthermore, the Wi-Fi system should be upgraded as a priority. Were a quiet study area to be created on the upper floor, it would almost certainly attract more students.\\n\\nConclusion\\nWith relatively modest investment, the library could serve the community far more effectively.","quiz":[{"q":"What is the purpose of the report?","o":["to close the library","to assess it and recommend improvements","to advertise books","to hire staff"],"a":1,"e":"To assess the library and recommend improvements.","d":"medium"},{"q":"How was the information gathered?","o":["from one manager","a survey and interviews","from the internet","from newspapers"],"a":1,"e":"A survey of 200 users and staff interviews.","d":"medium"},{"q":"What did users praise?","o":["the café","the wide selection of books","the parking","the garden"],"a":1,"e":"The wide selection of books.","d":"medium"},{"q":"Which was NOT a problem identified?","o":["limited opening hours","slow Wi-Fi","nowhere quiet to study","rude staff"],"a":3,"e":"Rude staff was not mentioned.","d":"medium"},{"q":"What is recommended for the upper floor?","o":["a café","a quiet study area","a car park","a cinema"],"a":1,"e":"Creating a quiet study area would attract students.","d":"medium"}]},{"id":"r5","title":"The Cost of Cheap Travel","text":"Never before has travel been so affordable. Budget airlines now offer flights across Europe for the price of a meal, and millions of us take advantage every year. Yet this golden age of cheap travel comes at a price that does not appear on the ticket.\\nThe most obvious cost is environmental. Aviation produces a significant share of carbon emissions, and a single long flight can undo months of careful recycling. Less visible, but no less serious, is the impact on popular destinations. Cities such as Venice and Barcelona have become so crowded with visitors that local residents are being pushed out of their own neighbourhoods.\\nNone of this means we should stop travelling altogether. Travel broadens the mind and supports countless livelihoods. What it does suggest is that we should travel more thoughtfully — flying less often, staying longer, and respecting the places we visit. Only if tourists and governments act together will the benefits of travel be preserved for future generations.","quiz":[{"q":"What point does the opening make about travel today?","o":["It is too expensive.","It has never been so affordable.","It is dangerous.","It is disappearing."],"a":1,"e":"Travel has never been so affordable.","d":"medium"},{"q":"What is described as the most obvious cost?","o":["environmental","financial","political","medical"],"a":0,"e":"The environmental cost (carbon emissions).","d":"medium"},{"q":"What problem do Venice and Barcelona face?","o":["too few tourists","overcrowding pushing out residents","high prices","bad weather"],"a":1,"e":"Overcrowding is pushing local residents out.","d":"medium"},{"q":"Does the writer say we should stop travelling?","o":["Yes, completely.","No, but travel more thoughtfully.","Yes, for one year.","No opinion is given."],"a":1,"e":"We should travel more thoughtfully, not stop.","d":"medium"},{"q":"What does the writer say is needed to preserve travel's benefits?","o":["cheaper flights","tourists and governments acting together","more airports","longer holidays"],"a":1,"e":"Tourists and governments must act together.","d":"medium"}]}],"listening":[{"id":"l1","title":"A University Lecture","script":"Good morning, everyone. Today we're looking at the psychology of decision-making. Now, we like to think we make choices logically, weighing up the facts. But research suggests otherwise. In fact, most of our decisions are driven by emotion and by mental shortcuts the brain uses to save effort. These shortcuts are usually helpful, but they can lead to predictable mistakes. For example, people tend to fear losing something far more than they value gaining the same thing. This is called loss aversion, and we'll explore it in detail after the break. For now, I'd like you to read chapter four before next week's seminar.","quiz":[{"q":"What is the lecture about?","o":["the history of war","the psychology of decision-making","learning languages","economics of trade"],"a":1,"e":"It is about the psychology of decision-making.","d":"medium"},{"q":"What does research suggest about our decisions?","o":["They are purely logical.","They are driven by emotion and mental shortcuts.","They are always wrong.","They take a long time."],"a":1,"e":"Most decisions are driven by emotion and shortcuts.","d":"medium"},{"q":"What are the mental shortcuts usually like?","o":["always harmful","usually helpful but sometimes lead to mistakes","never used","very slow"],"a":1,"e":"Usually helpful, but can cause predictable mistakes.","d":"medium"},{"q":"What is 'loss aversion'?","o":["loving to win","fearing loss more than valuing an equal gain","forgetting facts","avoiding decisions"],"a":1,"e":"Fearing loss more than valuing the same gain.","d":"medium"},{"q":"What must students do before the seminar?","o":["write an essay","read chapter four","take a test","give a talk"],"a":1,"e":"Read chapter four before next week's seminar.","d":"medium"}]},{"id":"l2","title":"A Job Interview","script":"So, thank you for coming in. Could you tell me why you applied for this marketing role? Of course. I've followed your company for years, and I really admire your creative campaigns. I felt my experience would be a good fit. Tell me about a challenge you've faced. In my last job, we lost a major client unexpectedly. Rather than panic, I led a small team to win back three smaller clients within a month. That's impressive. And where do you see yourself in five years? Honestly, I'd like to be managing my own team here, helping to develop the kind of campaigns that first attracted me to you. Excellent. We'll be in touch by the end of the week.","quiz":[{"q":"What role is the candidate applying for?","o":["accounting","marketing","teaching","engineering"],"a":1,"e":"It is a marketing role.","d":"medium"},{"q":"Why did she apply?","o":["for the salary","she admires the company's creative campaigns","it was near her home","a friend told her to"],"a":1,"e":"She admires their creative campaigns and felt it fit.","d":"medium"},{"q":"What challenge did she describe?","o":["losing her job","losing a major client and winning back smaller ones","missing a deadline","a computer failure"],"a":1,"e":"Losing a major client, then winning back three smaller ones.","d":"medium"},{"q":"Where does she see herself in five years?","o":["in another company","managing her own team there","retired","studying"],"a":1,"e":"Managing her own team at the company.","d":"medium"},{"q":"When will she hear back?","o":["tomorrow","by the end of the week","next month","never"],"a":1,"e":"By the end of the week.","d":"medium"}]},{"id":"l3","title":"A Discussion on Social Media","script":"Welcome back. Today we're debating whether social media does more harm than good. Sarah, you start. Well, I think the benefits are huge. It keeps families connected across the world and gives a voice to people who would otherwise be ignored. But James, you disagree? I do. I'm not denying the benefits, but we can't ignore the harm. Studies link heavy use to anxiety, especially among teenagers. People compare their real lives to others' perfect online images, and they feel worse. Sarah, a response? I'd say the problem isn't the technology itself, but how we use it. With better education, we could enjoy the good and avoid the worst. That's a fair point. We'll take some calls after this.","quiz":[{"q":"What is the debate about?","o":["whether to ban phones","whether social media does more harm than good","how to make money online","which app is best"],"a":1,"e":"Whether social media does more harm than good.","d":"medium"},{"q":"What benefit does Sarah mention?","o":["it makes money","it keeps families connected and gives a voice","it is free","it is fast"],"a":1,"e":"It connects families and gives people a voice.","d":"medium"},{"q":"What harm does James describe?","o":["it costs too much","a link to anxiety, especially in teenagers","it is too slow","it wastes paper"],"a":1,"e":"Heavy use is linked to anxiety in teenagers.","d":"medium"},{"q":"Why do people feel worse, according to James?","o":["they read too much news","they compare their lives to others' perfect images","they lose money","they get tired"],"a":1,"e":"They compare real lives to perfect online images.","d":"medium"},{"q":"What is Sarah's final point?","o":["Social media should be banned.","The problem is how we use it, not the technology.","Teenagers should not use phones.","Education does not help."],"a":1,"e":"The problem is how we use it; education could help.","d":"medium"}]},{"id":"l4","title":"A Climate News Report","script":"In environmental news, a major report published today warns that global temperatures are rising faster than previously expected. Scientists say that without urgent action, many coastal cities could face serious flooding within decades. However, the report is not entirely negative. It notes that the cost of renewable energy, such as solar and wind power, has fallen dramatically, making clean energy cheaper than coal in much of the world. The authors argue that the technology to solve the crisis already exists; what is missing is political will. A global summit will be held in Leeds next month, where world leaders will be under pressure to agree on stronger targets. Critics, however, fear that promises will once again be broken.","quiz":[{"q":"What does the new report warn about?","o":["falling temperatures","temperatures rising faster than expected","less rain","more snow"],"a":1,"e":"Global temperatures are rising faster than expected.","d":"medium"},{"q":"What could happen to coastal cities?","o":["nothing","serious flooding within decades","more tourists","colder weather"],"a":1,"e":"They could face serious flooding within decades.","d":"medium"},{"q":"What positive point does the report make?","o":["coal is cheaper","renewable energy has become much cheaper","the crisis is over","temperatures are falling"],"a":1,"e":"Renewable energy costs have fallen dramatically.","d":"medium"},{"q":"According to the authors, what is missing?","o":["technology","political will","money","scientists"],"a":1,"e":"The technology exists; political will is missing.","d":"medium"},{"q":"What do critics fear about the summit?","o":["it will be cancelled","promises will be broken again","it will cost too much","no one will attend"],"a":1,"e":"They fear promises will once again be broken.","d":"medium"}]}],"speaking":[{"id":"s1","title":"Arguing a position","prompt":"Should social media be regulated? Argue your position for 90 seconds.","seconds":90,"tips":["State your thesis in one sentence.","Concede one opposing point, then refute it.","Use linkers: nevertheless, what's more…"]},{"id":"s2","title":"Describing change","prompt":"How has your country changed in the last ten years?","seconds":90,"tips":["Trends: there has been a steady rise in…","Contrast past and present.","Speculate about the future."]},{"id":"s3","title":"Job interview","prompt":"Answer: 'Tell me about a challenge you overcame.'","seconds":90,"tips":["STAR: situation, task, action, result.","Keep it concrete.","Finish with what you learned."]},{"id":"s4","title":"Hypothetical","prompt":"If you could change one law, what would it be and why?","seconds":75,"tips":["Conditionals: If … were…, I would…","Justify with consequences.","Address a counter-argument."]},{"id":"s5","title":"Explaining a process","prompt":"Explain how something you know well works, to a beginner.","seconds":90,"tips":["Passive voice: it is heated / it gets stored…","Sequence: initially, subsequently, finally.","Check understanding: in other words…"]},{"id":"s6","title":"Culture","prompt":"What should a visitor know about your culture before arriving?","seconds":90,"tips":["Tend to / are likely to…","Give do's and don'ts.","Explain one custom's origin."]}],"writing":[{"id":"w1","title":"Opinion essay","prompt":"Write 140–180 words: 'Cities should ban private cars from their centres.' Do you agree?","min":140,"max":200,"hints":["Clear thesis in paragraph one.","One paragraph per argument.","Concede and refute a counter-argument."]},{"id":"w2","title":"A report","prompt":"Write a 140–180 word report on how students in your school use technology, with a recommendation.","min":140,"max":200,"hints":["Use headings: Introduction, Findings, Recommendation.","Passive voice where natural.","Quantify: the majority of…, one in three…"]},{"id":"w3","title":"A complaint","prompt":"Write a formal complaint (140–180 words) about a product that arrived damaged.","min":140,"max":200,"hints":["State facts and dates precisely.","Firm but polite register.","Say exactly what you expect to happen."]},{"id":"w4","title":"An article","prompt":"Write a magazine article (140–180 words): 'Three habits that changed my life.'","min":140,"max":200,"hints":["Hook the reader in line one.","One vivid example per habit.","End with encouragement."]}]}},{"id":"C1","name":"Advanced","tagline":"Master advanced English","weeks":16,"skills":{"grammar":[{"id":"g1","title":"Inversion for emphasis","lead":"Advanced English uses inversion — putting the auxiliary before the subject — to add drama and formality. It is common in writing, speeches, and formal speaking.","leadTr":{"uz":"Ilg'or ingliz tilida urg'u berish uchun inversiya ishlatiladi — yordamchi fe'l egadan oldin keladi. Bu yozma nutq va rasmiy uslubda ko'p uchraydi.","ru":"В продвинутом английском для усиления используется инверсия — вспомогательный глагол ставится перед подлежащим. Это характерно для письменной и формальной речи."},"situation":"","blocks":[{"h":"Negative adverbials","p":["After never, rarely, seldom, little, no sooner, not only — invert subject and auxiliary."],"ex":["Never have I seen such dedication.","Not only did she win, but she also broke the record."]},{"h":"Conditionals without 'if'","p":["Had / Should / Were can replace 'if' in formal conditionals."],"ex":["Had I known, I would have called.","Should you need anything, ask."]},{"h":"So / Such … that","p":["So + adjective and Such + noun phrase can open the sentence with inversion."],"ex":["So intense was the storm that flights stopped.","Such was the noise that nobody slept."]}],"tip":"Inversion is a spice, not a staple — one per paragraph is plenty.","examples":["Rarely does a film capture a book so well.","Little did they know what awaited them.","No sooner had we arrived than it started to rain."],"mistakes":[{"x":"Never I have seen such a thing.","v":"Never have I seen such a thing — auxiliary before subject."},{"x":"Not only she sings, but she dances.","v":"Not only does she sing, but she also dances."}],"quiz":[{"q":"___ had the meeting started when the fire alarm rang.","o":["No sooner","Not only","Rarely","Should"],"a":0,"e":"No sooner had X happened than Y — paired with 'than'.","d":"hard"},{"q":"___ you require assistance, our team is available around the clock.","o":["Were","Should","Had","So"],"a":1,"e":"Should = if, in formal conditionals: Should you require…","d":"hard"},{"q":"Not only ___ the deadline, she exceeded every target.","o":["she met","met she","did she meet","she did meet"],"a":2,"e":"After 'not only' use auxiliary + subject + verb: did she meet.","d":"hard"},{"q":"___ was the demand that the servers crashed.","o":["So","Such","Never","Little"],"a":1,"e":"Such + was + noun phrase: Such was the demand that…","d":"hard"},{"q":"Had I known about the traffic, I ___ earlier.","o":["would leave","left","would have left","had left"],"a":2,"e":"Had I known = If I had known → would have left (third conditional).","d":"hard"}]},{"id":"g2","title":"Cleft sentences","lead":"Cleft sentences (It was… that…, What I need is…) split one message into two clauses to control emphasis — a hallmark of fluent, natural English.","leadTr":{"uz":"Cleft gaplar (It was… that…, What I need is…) bitta fikrni ikki qismga bo'lib, urg'uni boshqaradi — bu ravon ingliz tilining belgisi.","ru":"Расщеплённые предложения (It was… that…, What I need is…) делят одну мысль на две части, управляя акцентом — признак свободного владения языком."},"situation":"","blocks":[{"h":"It-clefts","p":["Emphasise who, what, when or where with It + be + focus + that/who."],"ex":["It was Maria who solved it.","It was in 2019 that everything changed."]},{"h":"Wh-clefts","p":["What + clause + be + focus emphasises the thing itself."],"ex":["What I need is a long holiday.","What annoyed me was the silence afterwards."]},{"h":"All-clefts","p":["All + clause + be + focus means 'the only thing'."],"ex":["All I asked for was five minutes.","All it takes is practice."]}],"tip":"In speech, wh-clefts buy you thinking time while sounding sophisticated.","examples":["It's the small details that matter.","What makes her different is her patience.","All we can do is wait."],"mistakes":[{"x":"It was Maria which solved it.","v":"Use who for people: It was Maria who solved it."},{"x":"What I need it is a holiday.","v":"No extra pronoun: What I need is a holiday."}],"quiz":[{"q":"___ the ending that ruined the film for me.","o":["What was","It was","All was","That was"],"a":1,"e":"It-cleft: It was + focus + that…","d":"hard"},{"q":"What impressed the panel ___ her honesty.","o":["was","were","it was","that was"],"a":0,"e":"Wh-cleft takes singular be: What impressed them was…","d":"hard"},{"q":"___ I'm saying is that we need more time.","o":["All","What","It","Such"],"a":1,"e":"What I'm saying is… — emphasising the message.","d":"medium"},{"q":"It was only when I reread the letter ___ I understood.","o":["when","which","that","then"],"a":2,"e":"It-cleft closes with that: …that I understood.","d":"hard"}]},{"id":"g3","title":"The subjunctive & formal structures","lead":"Formal English preserves the subjunctive after verbs like suggest, demand, insist — and fixed phrases like 'be that as it may'. Mastering it lifts your writing register instantly.","leadTr":{"uz":"Rasmiy ingliz tilida suggest, demand, insist kabi fe'llardan keyin subjunktiv saqlanadi. Uni egallash yozuv uslubingizni darhol ko'taradi.","ru":"Формальный английский сохраняет сослагательное наклонение после глаголов suggest, demand, insist. Владение им сразу повышает регистр письма."},"situation":"","blocks":[{"h":"Mandative subjunctive","p":["After suggest/recommend/demand/insist + that, use the base form for all persons."],"ex":["They insisted that she be present.","We recommend that he take the earlier train."]},{"h":"Formal fixed phrases","p":["Some subjunctives survive only in set expressions."],"ex":["Be that as it may…","Suffice it to say…","Far be it from me to judge."]},{"h":"Were-subjunctive","p":["Use 'were' for all persons in hypotheticals."],"ex":["If I were in your position…","I wish it were simpler."]}],"tip":"In American English the mandative subjunctive is standard; British English often uses 'should' instead — both are correct.","examples":["The board demanded that the report be rewritten.","It is essential that every voice be heard.","If he were honest, he'd admit it."],"mistakes":[{"x":"They suggested that he goes home.","v":"Base form after suggest: …that he go home."},{"x":"If I was you, I'd wait.","v":"Hypothetical: If I were you, I'd wait."}],"quiz":[{"q":"The committee insisted that the policy ___ reviewed annually.","o":["is","be","was","were"],"a":1,"e":"Mandative subjunctive: insisted that it be reviewed.","d":"hard"},{"q":"It is vital that she ___ informed immediately.","o":["is","was","be","will be"],"a":2,"e":"It is vital that + base form: …that she be informed.","d":"hard"},{"q":"I wish it ___ possible to be in two places at once.","o":["was","is","were","be"],"a":2,"e":"Wish + were-subjunctive: I wish it were possible.","d":"medium"}]}],"vocabulary":[{"id":"v1","title":"Precision & nuance","words":[{"w":"ubiquitous","pos":"adj","ipa":"/juːˈbɪkwɪtəs/","uz":"hamma joyda uchraydigan","ru":"вездесущий","def":"present or found everywhere","ex":"Smartphones have become ubiquitous."},{"w":"ambivalent","pos":"adj","ipa":"/æmˈbɪvələnt/","uz":"ikkilangan","ru":"двойственный","def":"having mixed feelings","ex":"She felt ambivalent about the move."},{"w":"scrutinise","pos":"v","ipa":"/ˈskruːtənaɪz/","uz":"sinchiklab tekshirmoq","ru":"тщательно изучать","def":"to examine very carefully","ex":"Auditors scrutinised every transaction."},{"w":"tenuous","pos":"adj","ipa":"/ˈtenjuəs/","uz":"zaif, asossiz","ru":"слабый, шаткий","def":"very weak or slight","ex":"The link between the events is tenuous."},{"w":"exacerbate","pos":"v","ipa":"/ɪɡˈzæsəbeɪt/","uz":"og'irlashtirmoq","ru":"усугублять","def":"to make a problem worse","ex":"Panic buying exacerbated the shortage."},{"w":"pragmatic","pos":"adj","ipa":"/præɡˈmætɪk/","uz":"amaliy","ru":"прагматичный","def":"dealing with things practically","ex":"We need a pragmatic solution, not theory."},{"w":"salient","pos":"adj","ipa":"/ˈseɪliənt/","uz":"eng muhim","ru":"существенный","def":"most noticeable or important","ex":"Summarise the salient points."},{"w":"mitigate","pos":"v","ipa":"/ˈmɪtɪɡeɪt/","uz":"yumshatmoq","ru":"смягчать","def":"to make less severe","ex":"Trees mitigate the heat in cities."},{"w":"candid","pos":"adj","ipa":"/ˈkændɪd/","uz":"ochiqko'ngil, samimiy","ru":"откровенный","def":"truthful and straightforward","ex":"She was candid about her doubts."},{"w":"resilient","pos":"adj","ipa":"/rɪˈzɪliənt/","uz":"bardoshli","ru":"стойкий","def":"able to recover quickly from difficulty","ex":"She is remarkably resilient."}]}],"reading":[],"listening":[],"speaking":[{"id":"s1","title":"Nuanced opinion","prompt":"To what extent does language shape the way we thi
