"visit her in the summer holidays","stop writing letters","change schools"],"a":1,"e":"She suggests Grace visit her in the summer holidays.","d":"medium"}]}],"listening":[{"id":"l1","title":"A New Student","script":"Hello, everyone. My name is Oliver. I am twelve years old and I am from Brighton. I have two sisters and one brother. My favourite subject is science, and after school I like playing football with my friends. I have a small cat at home. Its name is Luna. Nice to meet you all!","quiz":[{"q":"What is the boy's name?","o":["Harry","Oliver","Jack","Tom"],"a":1,"e":"He says ‘My name is Oliver.’","d":"medium"},{"q":"How old is he?","o":["ten","eleven","twelve","fourteen"],"a":2,"e":"He is twelve years old.","d":"medium"},{"q":"Where is he from?","o":["London","Brighton","Manchester","Leeds"],"a":1,"e":"He is from Brighton.","d":"medium"},{"q":"What is his favourite subject?","o":["maths","science","English","art"],"a":1,"e":"His favourite subject is science.","d":"medium"},{"q":"What is the name of his cat?","o":["Bobby","Luna","Milo","Felix"],"a":1,"e":"His cat’s name is Luna.","d":"medium"}]},{"id":"l2","title":"At the Shop","script":"Good morning. Can I help you? Yes, please. I would like some bread and two bottles of water. Of course. The bread is one pound, and the water is two pounds. That is three pounds in total. Here you are. Thank you. Have a nice day!","quiz":[{"q":"What does the customer want to buy?","o":["bread and water","milk and eggs","tea and sugar","fruit and meat"],"a":0,"e":"The customer wants bread and two bottles of water.","d":"medium"},{"q":"How many bottles of water does the customer buy?","o":["one","two","three","four"],"a":1,"e":"Two bottles of water.","d":"medium"},{"q":"How much is the bread?","o":["one pound","two pounds","three pounds","five pounds"],"a":0,"e":"The bread is one pound.","d":"medium"},{"q":"How much does the customer pay in total?","o":["one pound","two pounds","three pounds","four pounds"],"a":2,"e":"Three pounds in total.","d":"medium"},{"q":"Where does this conversation happen?","o":["at school","at a shop","at home","at the doctor's"],"a":1,"e":"It happens at a shop.","d":"medium"}]},{"id":"l3","title":"Directions to the Park","script":"Excuse me, where is the park, please? Go straight on along this street. Then take the second turning on the left. The park is next to the library, opposite the bank. It is about five minutes on foot. Thank you very much! You are welcome.","quiz":[{"q":"What is the person looking for?","o":["the bank","the library","the park","the school"],"a":2,"e":"The person is looking for the park.","d":"medium"},{"q":"Which turning should they take?","o":["the first on the right","the second on the left","the first on the left","the third on the right"],"a":1,"e":"Take the second turning on the left.","d":"medium"},{"q":"What is the park next to?","o":["the bank","the library","the shop","the school"],"a":1,"e":"The park is next to the library.","d":"medium"},{"q":"What is opposite the park?","o":["the library","the bank","the café","the hospital"],"a":1,"e":"The park is opposite the bank.","d":"medium"},{"q":"How long does it take to walk there?","o":["two minutes","about five minutes","ten minutes","half an hour"],"a":1,"e":"About five minutes on foot.","d":"medium"}]},{"id":"l4","title":"A Voicemail Message","script":"Hi Harry, this is Lucy. I'm calling about our plan for Saturday. Let's meet at the cinema at four o'clock, not three. The film starts at half past four. Please bring the tickets. Oh, and can you call Jack? He doesn't know about the new time. See you on Saturday. Bye!","quiz":[{"q":"Who is calling?","o":["Harry","Jack","Lucy","Grace"],"a":2,"e":"The caller says ‘this is Lucy.’","d":"medium"},{"q":"What day are they meeting?","o":["Friday","Saturday","Sunday","Monday"],"a":1,"e":"They are meeting on Saturday.","d":"medium"},{"q":"What is the new meeting time?","o":["three o'clock","four o'clock","half past four","five o'clock"],"a":1,"e":"They meet at four o’clock (not three).","d":"medium"},{"q":"What should Harry bring?","o":["the tickets","some food","a book","money"],"a":0,"e":"He should bring the tickets.","d":"medium"},{"q":"Who should Harry call?","o":["Lucy","Jack","the cinema","his mother"],"a":1,"e":"He should call Jack, who doesn’t know the new time.","d":"medium"}]}],"speaking":[{"id":"s1","title":"Introduce yourself","prompt":"Say your name, your age, and where you are from.","seconds":30,"tips":["My name is…","I am … years old.","I am from…"]},{"id":"s2","title":"My family","prompt":"Talk about your family. Who do you live with?","seconds":40,"tips":["I have a brother / a sister.","My mother is a…","We live in…"]},{"id":"s3","title":"My day","prompt":"Describe your typical morning.","seconds":40,"tips":["I get up at…","I have breakfast.","I go to school / work."]},{"id":"s4","title":"My favourite food","prompt":"Talk about food you like and don't like.","seconds":40,"tips":["I like…","I don't like…","My favourite food is…"]},{"id":"s5","title":"My room","prompt":"Describe your room. What is in it?","seconds":45,"tips":["There is a…","There are…","Next to the… / on the…"]},{"id":"s6","title":"Numbers & time","prompt":"Say what time you do three things every day.","seconds":40,"tips":["At seven o'clock I…","Then at… I…"]}],"writing":[{"id":"w1","title":"About me","prompt":"Write 30–50 words about yourself: name, age, family, what you like.","min":30,"max":60,"hints":["I am…","I have…","I like…"]},{"id":"w2","title":"My best friend","prompt":"Write 30–50 words about your best friend.","min":30,"max":60,"hints":["His/Her name is…","He/She is… years old.","We like to…"]},{"id":"w3","title":"My house","prompt":"Describe your house or flat in 40–60 words.","min":40,"max":70,"hints":["There is / there are…","My favourite room is…"]},{"id":"w4","title":"A postcard","prompt":"Write a short postcard to a friend from a holiday (40–60 words).","min":40,"max":70,"hints":["Dear…","I am in…","The weather is…","See you soon!"]}]}},{"id":"A2","name":"Elementary","tagline":"Become confident in everyday English","weeks":10,"skills":{"grammar":[{"id":"g1","title":"Past simple","lead":"The past simple describes finished actions and states at a definite time in the past. It is the main tense for telling stories and talking about yesterday, last week, or years ago.","leadTr":{"uz":"O'tgan zamon (past simple) aniq vaqtda tugagan ish-harakatlarni bildiradi. Bu hikoya qilish hamda 'kecha', 'o'tgan yili' haqida gapirishning asosiy zamoni.","ru":"Past simple описывает завершённые действия в определённый момент прошлого. Это основное время для рассказов и разговоров о «вчера» и «в прошлом году»."},"situation":"“What did you do yesterday?” “I watched a film and went to bed early.” — Use the past simple for finished actions at a definite past time.","blocks":[{"h":"Regular verbs: + -ed","p":["Most verbs add -ed. Verbs ending in -e add only -d; a consonant + y becomes -ied; a short stressed vowel doubles the final consonant."],"ex":["work → worked · live → lived · study → studied · stop → stopped"]},{"h":"Irregular verbs","p":["Many common verbs are irregular and must be learned."],"ex":["go → went · have → had · see → saw · make → made · buy → bought"]},{"h":"Negatives & questions","p":["Use didn’t + base verb for negatives, and Did + subject + base verb for questions. The main verb returns to its base form."],"ex":["I didn’t go out. · Did you see the film?"]},{"h":"Time expressions","p":["Past simple often appears with: yesterday, last night/week, two days ago, in 2010, when I was young."],"ex":["We arrived two hours ago. · She was born in 2009."]}],"tip":"After didn’t and did, never use the past form: ‘I didn’t went’ is wrong → ‘I didn’t go.’ The past is already shown by ‘did’.","examples":["\\"Yesterday I watched a film and cooked dinner.\\"","\\"She went to London last summer.\\"","\\"They didn’t come to the party.\\"","\\"Did you finish your homework? — Yes, I did.\\"","\\"He bought a new bike two weeks ago.\\"","\\"We were very tired after the trip.\\""],"mistakes":[{"x":"I goed home. / She buyed it.","v":"I went home. / She bought it. (irregular verbs)"},{"x":"Did you went there?","v":"Did you go there? (after did → base verb)"},{"x":"I didn’t saw him.","v":"I didn’t see him."}],"quiz":[{"q":"Yesterday I ___ football with my friends.","o":["play","played","plaies","playing"],"a":1,"e":"Regular verb + -ed: played.","d":"easy"},{"q":"The past simple of 'go' is ___.","o":["goed","gone","went","going"],"a":2,"e":"‘go’ is irregular: went.","d":"easy"},{"q":"She ___ a sandwich for lunch.","o":["eat","eated","ate","eaten"],"a":2,"e":"Irregular: eat → ate.","d":"easy"},{"q":"We ___ to the cinema last night.","o":["go","goed","went","gone"],"a":2,"e":"go → went.","d":"easy"},{"q":"The past simple of 'study' is ___.","o":["studyed","studied","studed","study"],"a":1,"e":"Consonant + y → -ied: studied.","d":"easy"},{"q":"I ___ TV yesterday evening.","o":["watch","watched","watching","did watch"],"a":1,"e":"Regular past: watched.","d":"med"},{"q":"They ___ come to school yesterday.","o":["didn't","don't","wasn't","weren't"],"a":0,"e":"Past negative: didn’t come.","d":"med"},{"q":"___ you see Tom last week?","o":["Do","Did","Was","Were"],"a":1,"e":"Past question: Did you see…?","d":"med"},{"q":"The past simple of 'buy' is ___.","o":["buyed","buied","bought","buy"],"a":2,"e":"Irregular: buy → bought.","d":"med"},{"q":"He ___ his keys this morning.","o":["loses","lost","losed","loosed"],"a":1,"e":"Irregular: lose → lost.","d":"med"},{"q":"Find the mistake: 'I didn't went home.'","o":["didn't → don't","went → go","home → to home","no mistake"],"a":1,"e":"After ‘didn’t’ use the base verb: I didn’t go home.","d":"hard"},{"q":"Complete: 'She ___ a letter and ___ it to her friend.'","o":["write / send","wrote / sent","writed / sended","wrote / send"],"a":1,"e":"Irregular: write → wrote; send → sent.","d":"hard"},{"q":"Which question is correct?","o":["Did you went out?","Did you go out?","Do you went out?","Were you go out?"],"a":1,"e":"Did + base verb: Did you go out?","d":"hard"},{"q":"Complete: 'We ___ tired, so we ___ early.'","o":["was / leaved","were / left","were / leaved","was / left"],"a":1,"e":"‘we were’ (plural) and irregular leave → left.","d":"hard"},{"q":"The past simple of 'can' is ___.","o":["canned","could","caned","can"],"a":1,"e":"can → could.","d":"hard"}]},{"id":"g2","title":"Past continuous","lead":"The past continuous describes an action in progress at a moment in the past. It is often used to set the scene in a story, or for an action interrupted by another.","leadTr":{"uz":"Past continuous o'tmishdagi muayyan paytda davom etayotgan ish-harakatni bildiradi. U ko'pincha hikoyada vaziyatni tasvirlash yoki boshqa harakat tomonidan bo'lingan harakat uchun ishlatiladi.","ru":"Past continuous описывает действие, длившееся в определённый момент прошлого. Часто используется для описания обстановки или прерванного действия."},"situation":"“At 8 o’clock last night I was watching TV when the phone rang.” — The past continuous sets the longer background; the past simple is the shorter action that interrupts it.","blocks":[{"h":"Form: was/were + -ing","p":["Use was (I/he/she/it) or were (you/we/they) + verb-ing."],"ex":["I was reading. · They were playing outside."]},{"h":"Interrupted actions","p":["Use past continuous for the longer action and past simple for the shorter one that interrupts it, often joined by when or while."],"ex":["I was sleeping when the phone rang.","While she was cooking, he arrived."]},{"h":"Two actions together","p":["Use past continuous for two longer actions happening at the same time."],"ex":["I was reading while my brother was watching TV."]},{"h":"Negatives & questions","p":["Negative: wasn’t/weren’t + -ing. Question: Was/Were + subject + -ing?"],"ex":["She wasn’t listening. · Were you working at 8 pm?"]}],"tip":"Use the past simple for the short, completed action and the past continuous for the longer background action: ‘I was walking home when it started to rain.’","examples":["\\"At 8 o’clock last night I was studying.\\"","\\"They were watching TV when I came in.\\"","\\"While we were having dinner, the lights went out.\\"","\\"She wasn’t sleeping at midnight.\\"","\\"Were you waiting for me?\\"","\\"He fell while he was running.\\""],"mistakes":[{"x":"I was watch TV.","v":"I was watching TV. (was/were + -ing)"},{"x":"While I cooked, he arrived.","v":"While I was cooking, he arrived."}],"quiz":[{"q":"At 7 pm yesterday I ___ dinner.","o":["have","had","was having","were having"],"a":2,"e":"Action in progress (I) → was having.","d":"easy"},{"q":"They ___ football when it started to rain.","o":["played","were playing","was playing","play"],"a":1,"e":"Background action (they) → were playing.","d":"easy"},{"q":"She ___ a book at 9 o'clock.","o":["was reading","were reading","read","reads"],"a":0,"e":"In progress (she) → was reading.","d":"easy"},{"q":"We ___ TV all evening.","o":["was watching","were watching","watch","watched"],"a":1,"e":"With ‘we’ → were watching.","d":"easy"},{"q":"The past continuous of 'he sleeps' is ___.","o":["he were sleeping","he was sleeping","he is sleeping","he sleeped"],"a":1,"e":"he + was + -ing.","d":"easy"},{"q":"I ___ when the phone rang.","o":["showered","was showering","were showering","shower"],"a":1,"e":"Longer action → was showering.","d":"med"},{"q":"While she ___, he arrived.","o":["cooked","was cooking","were cooking","cooks"],"a":1,"e":"Background action (she) → was cooking.","d":"med"},{"q":"They ___ when I called.","o":["weren't working","wasn't working","didn't working","not working"],"a":0,"e":"Negative (they) → weren’t working.","d":"med"},{"q":"___ you sleeping at midnight?","o":["Was","Were","Did","Are"],"a":1,"e":"Question (you) → Were you sleeping?","d":"med"},{"q":"Choose: 'I was walking home ___ it started to snow.'","o":["while","when","during","that"],"a":1,"e":"A sudden interrupting action uses ‘when’.","d":"med"},{"q":"Find the mistake: 'They was playing in the garden.'","o":["was → were","playing → played","in → at","no mistake"],"a":0,"e":"With ‘they’ use ‘were’: They were playing.","d":"hard"},{"q":"Complete: 'While I ___ TV, my sister ___ her homework.'","o":["watched / did","was watching / was doing","were watching / did","watch / do"],"a":1,"e":"Two parallel past actions → both continuous.","d":"hard"},{"q":"Which sentence is correct?","o":["When I arrived, she cooked.","When I arrived, she was cooking.","When I was arriving, she cooked.","When I arrive, she was cooking."],"a":1,"e":"Short action ‘arrived’ + longer background ‘was cooking’.","d":"hard"},{"q":"Complete: 'What ___ you ___ at 10 pm?'","o":["was / doing","were / doing","did / do","were / did"],"a":1,"e":"Question (you) → Were you doing?","d":"hard"},{"q":"Choose the correct pair.","o":["I was reading when he was calling.","I read when he was calling.","I was reading when he called.","I was read when he called."],"a":2,"e":"Longer action ‘was reading’ + interrupting ‘called’.","d":"hard"}]},{"id":"g3","title":"Present perfect","lead":"The present perfect links the past and the present. We use it for life experiences (without saying exactly when), recent actions with a present result, and situations that started in the past and continue now.","leadTr":{"uz":"Present perfect o'tmish bilan hozirgi zamonni bog'laydi: hayotiy tajriba (qachonligini aytmasdan), natijasi hozir sezilib turgan yaqin voqealar uchun ishlatiladi.","ru":"Present perfect связывает прошлое с настоящим: жизненный опыт (без указания времени) и недавние действия с результатом в настоящем."},"situation":"“I have visited London twice.” We don’t say when — the experience matters now, not the exact time.","blocks":[{"h":"Form: have/has + past participle","p":["Use have (I/you/we/they) or has (he/she/it) + the past participle (the 3rd form: done, gone, seen, been)."],"ex":["I have seen that film. · She has finished her work."]},{"h":"ever / never (experience)","p":["Use ever in questions and never in negatives to talk about experiences at any time in your life."],"ex":["Have you ever been to London? · I have never eaten sushi."]},{"h":"just / already / yet","p":["just = a very short time ago; already = sooner than expected; yet = used in questions and negatives at the end."],"ex":["I’ve just arrived. · She’s already left. · Have you finished yet?"]},{"h":"for / since","p":["Use for + a period of time and since + a point in time for situations continuing now."],"ex":["We’ve lived here for five years. · I’ve known him since 2018."]}],"tip":"Don’t use the present perfect with a finished past time. Say ‘I saw her yesterday’ (past simple), not ‘I have seen her yesterday’. Use the present perfect when the time is unfinished or unstated.","examples":["\\"I have visited three countries.\\"","\\"Have you ever ridden a horse?\\"","\\"She has never tried Italian food.\\"","\\"We’ve just finished dinner.\\"","\\"He has already done his homework.\\"","\\"They’ve lived here for ten years.\\""],"mistakes":[{"x":"I have seen him yesterday.","v":"I saw him yesterday. (definite time → past simple)"},{"x":"She has went home.","v":"She has gone home. (past participle)"},{"x":"I am here since Monday.","v":"I have been here since Monday."}],"quiz":[{"q":"I ___ my homework. (it's finished now)","o":["finish","finished","have finished","finishing"],"a":2,"e":"Present perfect: have finished.","d":"easy"},{"q":"She ___ to Paris. (experience)","o":["has been","have been","is been","was been"],"a":0,"e":"With ‘she’: has been.","d":"easy"},{"q":"The past participle of 'see' is ___.","o":["saw","seen","seed","see"],"a":1,"e":"see → saw → seen.","d":"easy"},{"q":"We ___ this film before.","o":["have saw","has seen","have seen","saw have"],"a":2,"e":"have + past participle: have seen.","d":"easy"},{"q":"They ___ just arrived.","o":["has","have","are","did"],"a":1,"e":"With ‘they’: have just arrived.","d":"easy"},{"q":"Have you ___ been to Spain?","o":["never","ever","yet","already"],"a":1,"e":"In questions about experience we use ‘ever’.","d":"med"},{"q":"I've ___ eaten octopus. (not in my life)","o":["ever","yet","never","just"],"a":2,"e":"Negative experience: never.","d":"med"},{"q":"Has she finished ___?","o":["already","yet","just","since"],"a":1,"e":"In questions, ‘yet’ goes at the end.","d":"med"},{"q":"We've lived here ___ 2015.","o":["for","since","from","during"],"a":1,"e":"A point in time → since 2015.","d":"med"},{"q":"I've known him ___ ten years.","o":["since","for","from","ago"],"a":1,"e":"A period of time → for ten years.","d":"med"},{"q":"Find the mistake: 'I have seen her yesterday.'","o":["have seen → saw","seen → seeing","her → she","no mistake"],"a":0,"e":"With ‘yesterday’ (finished time) use past simple: I saw her yesterday.","d":"hard"},{"q":"Complete: 'She ___ already ___ the email.'","o":["has / sended","have / sent","has / sent","has / send"],"a":2,"e":"has + past participle (send → sent).","d":"hard"},{"q":"Which is correct?","o":["Have you finished already yet?","Have you finished yet?","Did you finished yet?","Have you yet finished?"],"a":1,"e":"‘yet’ goes at the end of the question.","d":"hard"},{"q":"Complete: 'I ___ this book ___ three days, but I haven't finished it.'","o":["have read / since","have had / for","had / for","have read / for"],"a":1,"e":"‘for three days’ + present perfect ‘have had’.","d":"hard"},{"q":"The past participle of 'go' (experience: visit and return) is ___.","o":["gone","been","went","going"],"a":1,"e":"For an experience there and back we use ‘been’: I have been to Rome.","d":"hard"}]},{"id":"g4","title":"Future: will & going to","lead":"English has several ways to talk about the future. The two most common at A2 are ‘will’ and ‘be going to’. Each fits different situations — predictions, decisions, plans and intentions.","leadTr":{"uz":"Ingliz tilida kelasi zamonni aytishning bir necha yo'li bor. A2 darajasida eng muhimlari — 'will' va 'be going to'; biri bashorat va qarorlar, ikkinchisi rejalar uchun.","ru":"В английском несколько способов говорить о будущем. На A2 главные — will и be going to: предсказания и решения против планов."},"situation":"","blocks":[{"h":"will — decisions & predictions","p":["Use will + base verb for instant decisions, offers, promises and general predictions. Short form: ’ll; negative: won’t."],"ex":["I’ll help you. · It will rain tomorrow. · I won’t be late."]},{"h":"be going to — plans & intentions","p":["Use be going to + base verb for plans you have already decided and for predictions based on what you can see now."],"ex":["We’re going to visit Rome. · Look at the sky — it’s going to rain."]},{"h":"will vs going to","p":["A decision made now = will; a plan decided before = going to."],"ex":["(phone rings) I’ll get it! · I’m going to study tonight. (already planned)"]},{"h":"Present continuous for arrangements","p":["For fixed arrangements with a time, the present continuous is also common."],"ex":["I’m meeting Sara at six. · We’re flying on Monday."]}],"tip":"For a decision you make while speaking, use will: ‘I’ll have the chicken, please.’ For something you already planned, use going to: ‘I’m going to start a new job.’","examples":["\\"I think it will be sunny tomorrow.\\"","\\"Don’t worry, I ’ll carry that bag for you.\\"","\\"We ’re going to buy a new car next month.\\"","\\"Look out — you ’re going to drop it!\\"","\\"She won’t come to the meeting.\\"","\\"I ’m meeting the doctor at 3 pm.\\""],"mistakes":[{"x":"I will to call you.","v":"I will call you. (will + base verb)"},{"x":"Look at the clouds — it will rain.","v":"…it’s going to rain. (evidence now → going to)"}],"quiz":[{"q":"I think it ___ rain tomorrow.","o":["will","is going","won't","shall"],"a":0,"e":"A prediction → will rain.","d":"easy"},{"q":"We ___ visit our grandparents next week. (a plan)","o":["will","are going to","won't","go"],"a":1,"e":"A decided plan → are going to visit.","d":"easy"},{"q":"The negative of 'will' is ___.","o":["willn't","won't","don't will","not will"],"a":1,"e":"will not = won’t.","d":"easy"},{"q":"(The phone rings.) I ___ answer it!","o":["am going to","will","won't","going"],"a":1,"e":"An instant decision → I’ll answer it.","d":"easy"},{"q":"Look at those clouds! It ___ rain.","o":["will","won't","is going to","goes to"],"a":2,"e":"Prediction from evidence → is going to rain.","d":"easy"},{"q":"She ___ be twelve next month.","o":["is going","will","won't","does"],"a":1,"e":"A future fact → will be.","d":"med"},{"q":"They ___ move to a new house. (already decided)","o":["will","are going to","won't","go"],"a":1,"e":"A plan → are going to move.","d":"med"},{"q":"I promise I ___ tell anyone.","o":["will","am going to","won't","don't"],"a":2,"e":"A promise (negative) → won’t tell.","d":"med"},{"q":"What ___ you ___ do at the weekend? (plans)","o":["will / going","are / going to","do / going","are / will"],"a":1,"e":"Asking about plans → are you going to do?","d":"med"},{"q":"Choose the instant decision.","o":["I'm going to help you.","I'll help you.","I help you.","I helping you."],"a":1,"e":"Deciding now → I’ll help you.","d":"med"},{"q":"Find the mistake: 'I will to call you later.'","o":["will → am going","to call → call","later → late","no mistake"],"a":1,"e":"After ‘will’ use the base verb: I will call you.","d":"hard"},{"q":"Complete: 'A: I'm cold. B: I ___ close the window.'","o":["am going to","will","won't","going to"],"a":1,"e":"Reacting now (offer) → I’ll close the window.","d":"hard"},{"q":"Which shows a fixed arrangement?","o":["I'll meet Sara at six.","I meet Sara at six.","I'm meeting Sara at six.","I going to meet Sara."],"a":2,"e":"Arrangement with a time → present continuous.","d":"hard"},{"q":"Complete: 'We ___ (plan) start a business, and we hope it ___ (prediction) succeed.'","o":["will / are going to","are going to / will","are going to / are going to","will / will"],"a":1,"e":"Plan → going to start; prediction → will succeed.","d":"hard"},{"q":"Choose the correct prediction from evidence.","o":["She will have a baby — look!","She's going to have a baby — look!","She have a baby soon.","She will to have a baby."],"a":1,"e":"Evidence-based prediction → is going to have.","d":"hard"}]},{"id":"g5","title":"Comparatives & superlatives","lead":"We use comparatives to compare two things and superlatives to compare one thing with all the others in a group. The form depends on the length of the adjective.","leadTr":{"uz":"Comparative ikki narsani, superlative esa bir narsani guruhdagi barcha narsalar bilan solishtiradi. Shakl sifatning uzunligiga bog'liq: -er/-est yoki more/most.","ru":"Сравнительная степень сравнивает два предмета, превосходная — один предмет со всеми. Форма зависит от длины прилагательного: -er/-est или more/most."},"situation":"","blocks":[{"h":"Short adjectives","p":["One-syllable adjectives: add -er (comparative) and -est (superlative). Double a final consonant after a short vowel; -y becomes -ier/-iest."],"ex":["tall → taller → the tallest · big → bigger · happy → happier"]},{"h":"Long adjectives","p":["Two or more syllables: use more (comparative) and the most (superlative)."],"ex":["expensive → more expensive → the most expensive"]},{"h":"than & the","p":["Use than after a comparative, and the before a superlative."],"ex":["She is taller than me. · It’s the biggest city in the country."]},{"h":"Irregular forms","p":["A few adjectives are irregular."],"ex":["good → better → the best · bad → worse → the worst · far → further"]}],"tip":"Don’t mix the two forms: ‘more taller’ and ‘most biggest’ are wrong. Use either -er/-est or more/most, never both.","examples":["\\"Today is hotter than yesterday.\\"","\\"This is the cheapest phone in the shop.\\"","\\"Maths is more difficult than art for me.\\"","\\"She is the most intelligent student in the class.\\"","\\"My new car is better than my old one.\\"","\\"It was the worst film I’ve ever seen.\\""],"mistakes":[{"x":"She is more taller than me.","v":"She is taller than me. (don’t use “more” with -er)"},{"x":"It is the most big.","v":"It is the biggest. (short adjective → -est)"},{"x":"He is more good.","v":"He is better. (irregular)"}],"quiz":[{"q":"This box is ___ than that one.","o":["heavy","heavier","heaviest","more heavy"],"a":1,"e":"Short adjective + -er: heavier.","d":"easy"},{"q":"He is the ___ boy in the class.","o":["taller","tall","tallest","most tall"],"a":2,"e":"Superlative of a short adjective: the tallest.","d":"easy"},{"q":"A car is ___ than a bicycle.","o":["fast","faster","fastest","more fast"],"a":1,"e":"faster than.","d":"easy"},{"q":"The comparative of 'big' is ___.","o":["biger","bigger","more big","biggest"],"a":1,"e":"Double the consonant: bigger.","d":"easy"},{"q":"Gold is ___ than silver.","o":["expensive","expensiver","more expensive","most expensive"],"a":2,"e":"Long adjective → more expensive.","d":"easy"},{"q":"This is the ___ restaurant in town.","o":["best","better","goodest","more good"],"a":0,"e":"Irregular superlative: the best.","d":"med"},{"q":"Today is ___ than yesterday.","o":["worse","worst","bad","badder"],"a":0,"e":"Irregular comparative: worse.","d":"med"},{"q":"The superlative of 'happy' is ___.","o":["happyest","happiest","most happy","more happy"],"a":1,"e":"-y → -iest: happiest.","d":"med"},{"q":"She is ___ student in the school.","o":["more intelligent","the most intelligent","intelligenter","most intelligent"],"a":1,"e":"Long adjective superlative: the most intelligent.","d":"med"},{"q":"My bag is ___ than yours.","o":["more heavy","heavier","heaviest","heavy"],"a":1,"e":"heavier than.","d":"med"},{"q":"Find the mistake: 'This is more cheaper than that.'","o":["more cheaper → cheaper","than → that","this → these","no mistake"],"a":0,"e":"Don’t use ‘more’ with -er: cheaper than.","d":"hard"},{"q":"Complete: 'It is ___ city ___ the country.'","o":["the biggest / in","the bigger / of","biggest / in","the most big / in"],"a":0,"e":"Superlative: the biggest city in the country.","d":"hard"},{"q":"Which is correct?","o":["She is the most tallest.","She is the tallest.","She is more tall.","She is tallest."],"a":1,"e":"Use ‘the tallest’ (no ‘most’ with short adjectives).","d":"hard"},{"q":"Complete: 'This exam was ___ than the last one, but not ___ I've ever taken.'","o":["difficult / the most difficult","more difficult / the most difficult","difficulter / most difficult","more difficult / most difficult"],"a":1,"e":"more difficult than … the most difficult.","d":"hard"},{"q":"Choose the correct sentence.","o":["My results are gooder than his.","My results are better than his.","My results are more good than his.","My results are best than his."],"a":1,"e":"good → better (irregular).","d":"hard"}]},{"id":"g6","title":"Adverbs of manner","lead":"Adverbs of manner tell us how an action is done. They usually describe a verb and most are formed from adjectives.","leadTr":{"uz":"Ravish (adverb of manner) ish-harakat qanday bajarilishini bildiradi. Ko'pchiligi sifatga -ly qo'shib yasaladi: slow → slowly.","ru":"Наречия образа действия говорят, как совершается действие. Большинство образуется от прилагательных с -ly: slow → slowly."},"situation":"","blocks":[{"h":"Forming adverbs: + -ly","p":["Most adverbs add -ly to the adjective. Adjectives ending in -y change to -ily; -le changes to -ly."],"ex":["slow → slowly · happy → happily · simple → simply"]},{"h":"Irregular adverbs","p":["Some adverbs are irregular or the same as the adjective."],"ex":["good → well · fast → fast · hard → hard · early → early"]},{"h":"Position","p":["The adverb usually goes after the verb (or after the object)."],"ex":["She sings beautifully. · He drives the car carefully."]},{"h":"Adjective vs. adverb","p":["An adjective describes a noun; an adverb describes a verb."],"ex":["He is a careful driver. (adjective) · He drives carefully. (adverb)"]}],"tip":"‘Good’ is an adjective; its adverb is well: ‘She is a good singer’ but ‘She sings well.’ ‘She sings good’ is wrong.","examples":["\\"He speaks English fluently.\\"","\\"Please drive slowly.\\"","\\"She plays the piano well.\\"","\\"They worked hard all day.\\"","\\"The children played happily in the garden.\\"","\\"He answered the question correctly.\\""],"mistakes":[{"x":"He speaks very good English.","v":"He speaks English very well. (good → well)"},{"x":"She sings beautiful.","v":"She sings beautifully. (verb → adverb)"}],"quiz":[{"q":"She sings ___.","o":["beautiful","beautifully","beauty","more beautiful"],"a":1,"e":"Adverb of manner: beautifully.","d":"easy"},{"q":"The adverb of 'quick' is ___.","o":["quick","quickly","quicker","quickest"],"a":1,"e":"quick → quickly.","d":"easy"},{"q":"He runs very ___.","o":["fastly","fast","fastlier","more fast"],"a":1,"e":"‘fast’ is the same as adverb and adjective.","d":"easy"},{"q":"Please speak ___.","o":["slow","slowly","slower","slowest"],"a":1,"e":"Adverb: slowly.","d":"easy"},{"q":"The adverb of 'good' is ___.","o":["goodly","gooder","well","best"],"a":2,"e":"good → well (irregular).","d":"easy"},{"q":"They worked ___ all day.","o":["hardly","hard","harder","hardest"],"a":1,"e":"‘hard’ (= with effort) is the adverb; ‘hardly’ means ‘almost not’.","d":"med"},{"q":"She plays the violin ___.","o":["good","goodly","well","best"],"a":2,"e":"Use ‘well’, the adverb of ‘good’.","d":"med"},{"q":"The adverb of 'happy' is ___.","o":["happyly","happily","happy","more happy"],"a":1,"e":"-y → -ily: happily.","d":"med"},{"q":"He drives ___.","o":["careful","carefully","carefuly","care"],"a":1,"e":"Adverb: carefully.","d":"med"},{"q":"Choose the adverb sentence.","o":["She is a quiet girl.","She speaks quietly.","She is quiet.","She quiet speaks."],"a":1,"e":"‘speaks quietly’ uses the adverb.","d":"med"},{"q":"Find the mistake: 'He sings very good.'","o":["good → well","very → much","sings → sing","no mistake"],"a":0,"e":"Use the adverb ‘well’: He sings very well.","d":"hard"},{"q":"Complete: 'She is a ___ worker and she works ___.'","o":["careful / careful","carefully / careful","careful / carefully","carefully / carefully"],"a":2,"e":"Adjective ‘careful’ (worker) + adverb ‘carefully’ (works).","d":"hard"},{"q":"Which is correct?","o":["He answered the question correct.","He answered the question correctly.","He correct answered.","He answered correct the question."],"a":1,"e":"Adverb after the object: answered the question correctly.","d":"hard"},{"q":"Complete: 'The test was ___, so she finished it ___.'","o":["easy / easy","easily / easy","easy / easily","easily / easily"],"a":2,"e":"Adjective ‘easy’ (test) + adverb ‘easily’ (finished).","d":"hard"},{"q":"Choose the correct adverb form.","o":["He spoke angryly.","He spoke angrily.","He spoke angry.","He spoke more angry."],"a":1,"e":"angry → angrily.","d":"hard"}]},{"id":"g7","title":"Quantifiers: much, many, a lot of","lead":"Quantifiers say how much or how many. The right one depends on whether the noun is countable or uncountable, and whether the sentence is positive, negative or a question.","leadTr":{"uz":"Miqdor so'zlari (much, many, a lot of) qancha ekanini bildiradi. To'g'ri tanlov ot sanaladigan yoki sanalmaydigan ekaniga bog'liq.","ru":"Кванторы (much, many, a lot of) выражают количество. Правильный выбор зависит от того, исчисляемое существительное или нет."},"situation":"","blocks":[{"h":"much & many","p":["Use many with countable nouns and much with uncountable nouns, mostly in questions and negatives."],"ex":["How many apples? · How much water? · I don’t have much time."]},{"h":"a lot of / lots of","p":["Use a lot of (or lots of) with both countable and uncountable nouns, usually in positive sentences."],"ex":["She has a lot of friends. · We have a lot of homework."]},{"h":"a few & a little","p":["Use a few with countable nouns and a little with uncountable nouns to mean ‘a small amount’."],"ex":["I have a few questions. · Add a little salt."]},{"h":"too much / too many / enough","p":["too much/many = more than you want; enough = the right amount."],"ex":["There are too many cars. · We don’t have enough chairs."]}],"tip":"In positive sentences, a lot of usually sounds better than ‘much’ or ‘many’: say ‘I have a lot of work’, not ‘I have much work’.","examples":["\\"How many students are in your class?\\"","\\"There isn’t much milk left.\\"","\\"We have a lot of homework today.\\"","\\"I only need a few minutes.\\"","\\"Add a little sugar to the tea.\\"","\\"There are too many people here.\\""],"mistakes":[{"x":"How much books?","v":"How many books? (countable → many)"},{"x":"I have many money.","v":"I have a lot of money. (uncountable, positive → a lot of)"}],"quiz":[{"q":"How ___ apples do you want?","o":["much","many","a little","lot"],"a":1,"e":"Countable ‘apples’ → many.","d":"easy"},{"q":"How ___ water is there?","o":["many","much","few","a lot"],"a":1,"e":"Uncountable ‘water’ → much.","d":"easy"},{"q":"She has ___ friends.","o":["much","a little","a lot of","a much"],"a":2,"e":"Positive sentence → a lot of.","d":"easy"},{"q":"I have ___ books on this subject.","o":["much","a little","a few","a lot"],"a":2,"e":"Countable, small number → a few.","d":"easy"},{"q":"Add ___ salt to the soup.","o":["a few","many","a little","much of"],"a":2,"e":"Uncountable, small amount → a little.","d":"easy"},{"q":"There isn't ___ time left.","o":["many","much","a few","lots"],"a":1,"e":"Uncountable + negative → much.","d":"med"},{"q":"We don't have ___ chairs.","o":["much","many","a little","a much"],"a":1,"e":"Countable + negative → many.","d":"med"},{"q":"There are ___ people in the room. (more than we want)","o":["too much","too many","enough many","a little"],"a":1,"e":"Countable, excess → too many.","d":"med"},{"q":"I'd like ___ sugar in my coffee.","o":["a few","many","a little","a lot"],"a":2,"e":"Uncountable, small amount → a little.","d":"med"},{"q":"We have ___ homework tonight.","o":["many","a few","a lot of","a many"],"a":2,"e":"Uncountable positive → a lot of.","d":"med"},{"q":"Find the mistake: 'I have much friends.'","o":["much → many/a lot of","friends → friend","have → has","no mistake"],"a":0,"e":"Countable positive → ‘many’ or ‘a lot of’ friends.","d":"hard"},{"q":"Complete: 'There isn't ___ juice, but there are ___ apples.'","o":["many / much","much / a few","a little / much","much / many"],"a":1,"e":"Uncountable ‘much juice’ + countable ‘a few apples’.","d":"hard"},{"q":"Which is correct?","o":["We don't have enough chairs.","We don't have chairs enough.","We have not enough chairs.","We don't have a enough chairs."],"a":0,"e":"‘enough’ goes before the noun: enough chairs.","d":"hard"},{"q":"Complete: 'How ___ money do you need? Only ___.'","o":["many / a few","much / a little","much / a few","many / a little"],"a":1,"e":"Uncountable ‘much money’ + ‘a little’.","d":"hard"},{"q":"Choose the natural sentence.","o":["He drinks much coffee.","He drinks a lot of coffee.","He drinks many coffee.","He drinks a few coffee."],"a":1,"e":"Positive + uncountable → a lot of coffee.","d":"hard"}]},{"id":"g8","title":"Verb + infinitive or -ing","lead":"After certain verbs we use the infinitive (to + verb); after others we use the -ing form. Learning which verbs take which form is an important A2 skill.","leadTr":{"uz":"Ba'zi fe'llardan keyin infinitiv (to + fe'l), boshqalaridan keyin -ing shakli keladi: want to go, lekin enjoy going. Qaysi fe'l qaysi shaklni olishini yodlash kerak.","ru":"После одних глаголов идёт инфинитив (to + глагол), после других — форма -ing: want to go, но enjoy going. Какой глагол что требует — нужно запомнить."},"situation":"","blocks":[{"h":"Verb + to-infinitive","p":["These verbs are followed by to + base verb: want, would like, need, decide, hope, plan, promise, learn, try."],"ex":["I want to go home. · She decided to stay. · We hope to win."]},{"h":"Verb + -ing","p":["These verbs are followed by the -ing form: like, love, enjoy, hate, finish, stop, mind, suggest, practise."],"ex":["I enjoy reading. · They finished eating. · Do you mind waiting?"]},{"h":"to-infinitive of purpose","p":["Use to + verb to explain why you do something (the purpose)."],"ex":["I went to the shop to buy milk."]},{"h":"like + -ing vs would like + to","p":["like + -ing = enjoy in general; would like + to = want now."],"ex":["I like swimming. · I’d like to swim now."]}],"tip":"Memorise verbs in short phrases: ‘want to go’, ‘enjoy going’. When unsure, remember that want, need, hope and decide take to, while enjoy, finish and stop take -ing.","examples":["\\"I want to learn Spanish.\\"","\\"She enjoys cooking for her family.\\"","\\"They decided to move to a new city.\\"","\\"He finished doing his homework.\\"","\\"We went out to celebrate her birthday.\\"","\\"Do you mind opening the window?\\""],"mistakes":[{"x":"I want going home.","v":"I want to go home. (want + to)"},{"x":"I enjoy to swim.","v":"I enjoy swimming. (enjoy + -ing)"}],"quiz":[{"q":"I want ___ home.","o":["go","to go","going","to going"],"a":1,"e":"want + to: to go.","d":"easy"},{"q":"She enjoys ___.","o":["dance","to dance","dancing","to dancing"],"a":2,"e":"enjoy + -ing: dancing.","d":"easy"},{"q":"We hope ___ the match.","o":["win","to win","winning","won"],"a":1,"e":"hope + to: to win.","d":"easy"},{"q":"They finished ___ dinner.","o":["eat","to eat","eating","ate"],"a":2,"e":"finish + -ing: eating.","d":"easy"},{"q":"I need ___ a doctor.","o":["see","to see","seeing","saw"],"a":1,"e":"need + to: to see.","d":"easy"},{"q":"He decided ___ at home.","o":["stay","to stay","staying","stayed"],"a":1,"e":"decide + to: to stay.","d":"med"},{"q":"Do you mind ___ the door?","o":["close","to close","closing","closed"],"a":2,"e":"mind + -ing: closing.","d":"med"},{"q":"I went to the library ___ a book.","o":["borrow","to borrow","borrowing","for borrow"],"a":1,"e":"Purpose → to borrow.","d":"med"},{"q":"She stopped ___ because she was tired.","o":["work","to work","working","worked"],"a":2,"e":"stop + -ing: working.","d":"med"},{"q":"We learned ___ in summer.","o":["swim","to swim","swimming","swam"],"a":1,"e":"learn + to: to swim.","d":"med"},{"q":"Find the mistake: 'I enjoy to read books.'","o":["to read → reading","enjoy → enjoys","books → book","no mistake"],"a":0,"e":"enjoy + -ing: I enjoy reading books.","d":"hard"},{"q":"Complete: 'She wants ___ a teacher, so she's learning ___ children.'","o":["become / teach","to become / to teach","to become / teaching","becoming / to teach"],"a":2,"e":"want + to (to become); learn + to (but here ‘teaching’ as a noun-like activity she practises) → best: to teach. (to become / to teach)","d":"hard"},{"q":"Which is correct?","o":["I'd like swimming now.","I'd like to swim now.","I like to swimming now.","I would like swim now."],"a":1,"e":"would like + to: I’d like to swim.","d":"hard"},{"q":"Complete: 'He finished ___ and then decided ___ for a walk.'","o":["to work / to go","working / go","working / to go","work / going"],"a":2,"e":"finish + -ing (working) + decide + to (to go).","d":"hard"},{"q":"Choose the purpose sentence.","o":["I study to passing the exam.","I study to pass the exam.","I study for pass the exam.","I study passing the exam."],"a":1,"e":"Purpose uses to + base verb: to pass.","d":"hard"}]},{"id":"g9","title":"Present perfect vs past simple","lead":"These two tenses both talk about the past, but they are used differently. The past simple is for a finished time; the present perfect connects the past to now.","leadTr":{"uz":"Ikkala zamon ham o'tmish haqida, lekin: past simple — tugagan vaqt uchun (yesterday, in 2020), present perfect esa o'tmishni hozir bilan bog'laydi.","ru":"Оба времени о прошлом, но past simple — для законченного времени (yesterday, in 2020), а present perfect связывает прошлое с настоящим."},"situation":"","blocks":[{"h":"Finished vs. unfinished time","p":["Use the past simple with a finished time word (yesterday, last week, in 2010). Use the present perfect when the time is unstated or unfinished (today, this week, ever)."],"ex":["I saw her yesterday. · I have seen that film. (when? not important)"]},{"h":"Experience vs. specific event","p":["Present perfect = experience at any time. Past simple = a specific completed event."],"ex":["Have you ever been to Rome? — Yes, I went there in 2019."]},{"h":"Result now vs. finished","p":["Present perfect shows a present result; past simple just reports a finished action."],"ex":["I’ve lost my keys. (I can’t find them now) · I lost my keys yesterday."]},{"h":"Signal words","p":["Past simple: yesterday, ago, last…, in 2015. Present perfect: ever, never, just, already, yet, recently, since, for."],"ex":["She moved here two years ago. · She has lived here for two years."]}],"tip":"A finished time word forces the past simple. ‘I have finished it yesterday’ is wrong → ‘I finished it yesterday.’","examples":["\\"I have visited Paris, but I visited it last spring.\\"","\\"She has just left.\\"","\\"They arrived two hours ago.\\"","\\"Have you ever eaten sushi? — Yes, I tried it in Tokyo.\\"","\\"We have known each other since 2018.\\"","\\"He didn’t call me yesterday.\\""],"mistakes":[{"x":"I have finished it yesterday.","v":"I finished it yesterday. (yesterday = finished time)"},{"x":"Did you ever eat sushi?","v":"Have you ever eaten sushi? (life experience → present perfect)"}],"quiz":[{"q":"I ___ my homework yesterday.","o":["have finished","finished","finish","has finished"],"a":1,"e":"‘yesterday’ → past simple: finished.","d":"easy"},{"q":"She ___ to Japan. (experience)","o":["has been","was","went","is been"],"a":0,"e":"Experience → present perfect: has been.","d":"easy"},{"q":"We ___ a great film last night.","o":["have seen","saw","seen","have saw"],"a":1,"e":"‘last night’ → past simple: saw.","d":"easy"},{"q":"He ___ his keys. (he can't find them now)","o":["lost","has lost","lose","loses"],"a":1,"e":"Present result → has lost.","d":"easy"},{"q":"They ___ here in 2015.","o":["have moved","moved","move","has moved"],"a":1,"e":"‘in 2015’ → past simple: moved.","d":"easy"},{"q":"___ you ever ___ a horse?","o":["Did / ride","Have / ridden","Have / rode","Did / ridden"],"a":1,"e":"Experience question → Have you ever ridden?","d":"med"},{"q":"I ___ him two days ago.","o":["have met","met","meet","have meet"],"a":1,"e":"‘two days ago’ → past simple: met.","d":"med"},{"q":"She's not here; she ___ already ___.","o":["has / left","did / leave","have / left","has / leaved"],"a":0,"e":"‘already’ + result now → has left.","d":"med"},{"q":"We ___ in this town for ten years.","o":["lived","have lived","live","has lived"],"a":1,"e":"‘for ten years’ continuing → present perfect: have lived.","d":"med"},{"q":"What time ___ you ___ home last night?","o":["have / arrived","did / arrive","did / arrived","have / arrive"],"a":1,"e":"‘last night’ → past simple: did you arrive?","d":"med"},{"q":"Find the mistake: 'I have seen her last week.'","o":["have seen → saw","seen → seeing","her → she","no mistake"],"a":0,"e":"‘last week’ forces past simple: I saw her last week.","d":"hard"},{"q":"Complete: 'I ___ Tom for years. We ___ at school in 2010.'","o":["have known / met","knew / have met","have known / have met","knew / met"],"a":0,"e":"Continuing ‘have known’ + finished event ‘met’ (in 2010).","d":"hard"},{"q":"Which is correct?","o":["Did you ever go to Spain?","Have you ever been to Spain?","Have you ever went to Spain?","Did you ever been to Spain?"],"a":1,"e":"Experience → Have you ever been…?","d":"hard"},{"q":"Complete: 'She ___ three books this year, and she ___ this one last weekend.'","o":["read / has read","has read / read","read / read","has read / has read"],"a":1,"e":"‘this year’ (unfinished) → has read; ‘last weekend’ → read.","d":"hard"},{"q":"Choose the sentence with a present result.","o":["I broke my arm in 2019.","I've broken my arm — it hurts!","I break my arm.","I was breaking my arm."],"a":1,"e":"Present perfect shows the result now: I’ve broken my arm.","d":"hard"}]},{"id":"g10","title":"used to","lead":"We use ‘used to’ to talk about past habits and states that are no longer true. It is a simple way to contrast the past with the present.","leadTr":{"uz":"'Used to' endi mavjud bo'lmagan o'tmishdagi odat va holatlarni bildiradi: I used to play football — ilgari o'ynardim (hozir yo'q).","ru":"Used to описывает прошлые привычки и состояния, которых больше нет: I used to play football — раньше играл (теперь нет)."},"situation":"“I used to play tennis, but I stopped years ago.” — used to describes a past habit or state that is no longer true.","blocks":[{"h":"Past habits & states","p":["used to + base verb describes something that happened regularly in the past, or a state that was true before but isn’t now."],"ex":["I used to play football every day. · She used to live in Leeds."]},{"h":"Negatives & questions","p":["Negative: didn’t use to (no -d). Question: Did … use to…?"],"ex":["He didn’t use to like coffee. · Did you use to have long hair?"]},{"h":"used to vs. present","p":["‘used to’ always contrasts the past with now."],"ex":["I used to smoke, but now I don’t. · We didn’t use to have a car, but now we do."]},{"h":"Only for the past","p":["For present habits, use the present simple, not ‘used to’."],"ex":["Now I go to the gym every day. (not ‘I use to go’)"]}],"tip":"In negatives and questions the ‘-d’ disappears: ‘didn’t use to’ and ‘Did you use to…?’, never ‘didn’t used to’.","examples":["\\"I used to live in a small village.\\"","\\"She used to have long hair.\\"","\\"We didn’t use to watch much TV.\\"","\\"Did you use to walk to school?\\"","\\"He used to be shy, but now he’s very confident.\\"","\\"They used to play outside every afternoon.\\""],"mistakes":[{"x":"I use to live here.","v":"I used to live here. (affirmative: used)"},{"x":"I didn’t used to smoke.","v":"I didn’t use to smoke. (after did → use, no -d)"}],"quiz":[{"q":"I ___ play tennis when I was young.","o":["use to","used to","am used to","using to"],"a":1,"e":"Past habit: used to play.","d":"easy"},{"q":"She ___ live in London.","o":["used to","use to","uses to","is used to"],"a":0,"e":"Past state: used to live.","d":"easy"},{"q":"We ___ have a dog.","o":["use to","used to","using to","used"],"a":1,"e":"Past state: used to have.","d":"easy"},{"q":"They ___ go to the beach every summer.","o":["use to","used to","uses to","are used to"],"a":1,"e":"Past habit: used to go.","d":"easy"},{"q":"He ___ be very thin.","o":["use to","used to","is used to","using to"],"a":1,"e":"Past state: used to be.","d":"easy"},{"q":"Negative: 'I ___ like vegetables.'","o":["didn't used to","didn't use to","don't used to","usedn't to"],"a":1,"e":"Negative drops the -d: didn’t use to.","d":"med"},{"q":"___ you use to have long hair?","o":["Do","Did","Are","Were"],"a":1,"e":"Question: Did you use to…?","d":"med"},{"q":"She ___ like coffee, but now she loves it.","o":["didn't use to","didn't used to","doesn't use to","wasn't use to"],"a":0,"e":"Negative past habit: didn’t use to.","d":"med"},{"q":"We ___ play outside, but now we stay in.","o":["use to","used to","are used to","using to"],"a":1,"e":"Past habit: used to play.","d":"med"},{"q":"Choose the correct question.","o":["Did you used to smoke?","Did you use to smoke?","Do you use to smoke?","Were you use to smoke?"],"a":1,"e":"Did + use to (no -d): Did you use to smoke?","d":"med"},{"q":"Find the mistake: 'He didn't used to study hard.'","o":["didn't used to → didn't use to","study → studied","hard → hardly","no mistake"],"a":0,"e":"Drop the -d after didn’t: didn’t use to study.","d":"hard"},{"q":"Complete: 'I ___ be afraid of dogs, but now I ___ them.'","o":["use to / love","used to / love","used to / loved","used to / am loving"],"a":1,"e":"Past state ‘used to be’ + present ‘love’.","d":"hard"},{"q":"Which sentence is correct for a present habit?","o":["Now I use to run daily.","Now I run daily.","Now I used to run daily.","Now I am use to run daily."],"a":1,"e":"For present habits use the present simple: I run daily.","d":"hard"},{"q":"Complete: '___ they ___ live near here?'","o":["Did / used to","Did / use to","Do / use to","Were / use to"],"a":1,"e":"Did + use to: Did they use to live…?","d":"hard"},{"q":"Choose the natural contrast.","o":["I used to play piano, and I still do every day exactly the same.","I used to play piano, but I stopped years ago.","I use to play piano now.","I am used to play piano before."],"a":1,"e":"‘used to’ contrasts a past habit with the present (now stopped).","d":"hard"}]},{"id":"g11","title":"Obligation: must, have to, should","lead":"These modal verbs talk about rules, necessity and advice. ‘Must’ and ‘have to’ express obligation; ‘should’ gives advice; their negatives have different meanings.","leadTr":{"uz":"Bu modal fe'llar qoida, zarurat va maslahatni bildiradi: 'must' va 'have to' — majburiyat, 'should' — maslahat. Inkor shakllari esa turlicha ma'no beradi.","ru":"Эти модальные глаголы выражают правила, необходимость и совет: must и have to — обязанность, should — совет. Их отрицания означают разное."},"situation":"","blocks":[{"h":"must & have to (obligation)","p":["must and have to + base verb both mean something is necessary. ‘Must’ often comes from the speaker; ‘have to’ often comes from outside rules."],"ex":["You must wear a seatbelt. · I have to work on Saturday."]},{"h":"should (advice)","p":["should + base verb gives advice or an opinion about the best thing to do."],"ex":["You should see a doctor. · We shouldn’t waste food."]},{"h":"mustn’t vs. don’t have to","p":["mustn’t = it is prohibited (don’t do it!). don’t have to = it isn’t necessary (but you can)."],"ex":["You mustn’t smoke here. (forbidden) · You don’t have to come. (optional)"]},{"h":"Past: had to","p":["The past of both ‘must’ and ‘have to’ is had to."],"ex":["Yesterday I had to stay late at work."]}],"tip":"Be careful: mustn’t and don’t have to are very different. ‘You mustn’t go’ = do NOT go. ‘You don’t have to go’ = you can stay if you like.","examples":["\\"You must stop at a red light.\\"","\\"I have to get up early tomorrow.\\"","\\"You should drink more water.\\"","\\"You mustn’t use your phone in the exam.\\"","\\"We don’t have to pay — it’s free.\\"","\\"She had to wait an hour for the bus.\\""],"mistakes":[{"x":"You mustn’t pay — it’s free, so it’s OK not to.","v":"You don’t have to pay. (no obligation ≠ mustn’t)"},{"x":"He must to go.","v":"He must go. (must + base verb)"}],"quiz":[{"q":"You ___ wear a uniform at this school. (rule)","o":["should","have to","shouldn't","don't have to"],"a":1,"e":"Obligation/rule → have to.","d":"easy"},{"q":"You look tired. You ___ go to bed.","o":["should","mustn't","don't have to","have to"],"a":0,"e":"Advice → should.","d":"easy"},{"q":"You ___ smoke here. It's forbidden.","o":["don't have to","mustn't","should","have to"],"a":1,"e":"Prohibition → mustn’t.","d":"easy"},{"q":"I ___ get up early tomorrow.","o":["should","have to","shouldn't","mustn't"],"a":1,"e":"Necessity → have to.","d":"easy"},{"q":"We ___ waste water.","o":["should","shouldn't","have to","don't have to"],"a":1,"e":"Advice not to do → shouldn’t.","d":"easy"},{"q":"It's free, so you ___ pay.","o":["mustn't","don't have to","should","have to"],"a":1,"e":"Not necessary → don’t have to.","d":"med"},{"q":"Students ___ be quiet in the library. (rule)","o":["should","must","don't have to","shouldn't"],"a":1,"e":"Strong rule → must.","d":"med"},{"q":"The past of 'I must leave' is ___.","o":["I must left","I had to leave","I have to leave","I musted leave"],"a":1,"e":"Past of must/have to → had to leave.","d":"med"},{"q":"You're ill. You ___ see a doctor.","o":["shouldn't","mustn't","should","don't have to"],"a":2,"e":"Advice → should.","d":"med"},{"q":"You ___ touch that — it's dangerous!","o":["don't have to","mustn't","should","have to"],"a":1,"e":"Prohibition → mustn’t.","d":"med"},{"q":"Find the difference: 'You don't have to come.' means ___.","o":["You can't come.","It isn't necessary to come.","You must come.","You shouldn't come."],"a":1,"e":"don’t have to = not necessary (optional).","d":"hard"},{"q":"Complete: 'You ___ be late, but you ___ come if you're busy.'","o":["mustn't / don't have to","don't have to / mustn't","should / must","have to / mustn't"],"a":0,"e":"‘mustn’t be late’ (forbidden) + ‘don’t have to come’ (optional).","d":"hard"},{"q":"Which gives advice correctly?","o":["You should to study more.","You should study more.","You shoulds study more.","You should studying more."],"a":1,"e":"should + base verb: You should study more.","d":"hard"},{"q":"Complete: 'Yesterday I ___ work late, so I ___ cancel my plans.'","o":["have to / should","had to / had to","must / had to","had to / should"],"a":1,"e":"Past obligation → had to (twice).","d":"hard"},{"q":"Choose the prohibition.","o":["You don't have to park here.","You mustn't park here.","You should park here.","You have to park here."],"a":1,"e":"Prohibition → mustn’t park here.","d":"hard"}]},{"id":"g12","title":"First conditional","lead":"The first conditional talks about a real or likely situation in the future and its result. It uses ‘if’ + present simple for the condition and ‘will’ for the result.","leadTr":{"uz":"Birinchi shart gapi (first conditional) kelajakdagi real vaziyat va uning natijasini bildiradi: If + present simple, natijada esa 'will'.","ru":"Первый кондиционал описывает реальную будущую ситуацию и её результат: if + present simple, а в результате — will."},"situation":"“If it rains tomorrow, we ’ll stay at home.” — The first conditional talks about a real, likely future result.","blocks":[{"h":"Form: if + present, will + base","p":["The if-clause uses the present simple; the result clause uses will + base verb."],"ex":["If it rains, we will stay home.","I will call you if I have time."]},{"h":"Order of clauses","p":["You can start with either clause. Use a comma only when the if-clause comes first."],"ex":["If you study, you’ll pass. · You’ll pass if you study."]},{"h":"unless","p":["unless means ‘if … not’."],"ex":["You’ll be late unless you hurry. (= if you don’t hurry)"]},{"h":"may / might / can in the result","p":["Instead of ‘will’, you can use may, might (possible) or can (ability) in the result."],"ex":["If it’s sunny, we might go to the beach."]}],"tip":"Don’t use ‘will’ in the if-clause: ‘If it will rain’ is wrong → ‘If it rains, we will stay home.’ The condition is in the present simple.","examples":["\\"If it rains, we will stay at home.\\"","\\"If you heat ice, it melts.\\"","\\"I’ll help you if you ask me.\\"","\\"You’ll miss the bus unless you run.\\"","\\"If she studies hard, she will pass.\\"","\\"If we leave now, we might catch the train.\\""],"mistakes":[{"x":"If it will rain, I will stay in.","v":"If it rains, I will stay in. (no “will” after if)"},{"x":"If you study, you passed.","v":"If you study, you ’ll pass."}],"quiz":[{"q":"If it rains, we ___ at home.","o":["stay","will stay","stayed","staying"],"a":1,"e":"Result clause → will stay.","d":"easy"},{"q":"If you ___ hard, you'll pass.","o":["study","will study","studied","studying"],"a":0,"e":"If-clause → present simple: study.","d":"easy"},{"q":"I'll call you if I ___ time.","o":["will have","have","had","having"],"a":1,"e":"If-clause → present simple: have.","d":"easy"},{"q":"If she runs, she ___ the bus.","o":["catch","catches","will catch","caught"],"a":2,"e":"Result → will catch.","d":"easy"},{"q":"We'll have a picnic if the weather ___ nice.","o":["will be","is","be","was"],"a":1,"e":"If-clause → present: is.","d":"easy"},{"q":"If you ___ now, you'll arrive on time.","o":["leave","will leave","left","leaving"],"a":0,"e":"If + present: leave.","d":"med"},{"q":"You'll be tired ___ you sleep more.","o":["if","unless","when","because"],"a":1,"e":"‘unless’ = if … not.","d":"med"},{"q":"If I ___ the exam, my parents will be happy.","o":["will pass","pass","passed","passing"],"a":1,"e":"If + present: pass.","d":"med"},{"q":"If it's sunny, we ___ go to the park.","o":["might","must","should have","would"],"a":0,"e":"Possible result → might go.","d":"med"},{"q":"Choose the correct sentence.","o":["If it will rain, I'll stay.","If it rains, I'll stay.","If it rains, I stay.","If it rain, I'll stay."],"a":1,"e":"If + present, will + base.","d":"med"},{"q":"Find the mistake: 'If you will help me, I'll finish faster.'","o":["will help → help","I'll → I","finish → finished","no mistake"],"a":0,"e":"No ‘will’ in the if-clause: If you help me…","d":"hard"},{"q":"Complete: 'You ___ pass ___ you study harder.'","o":["won't / unless","will / unless","won't / if","don't / unless"],"a":0,"e":"‘won’t pass unless you study’ = if you don’t study.","d":"hard"},{"q":"Which is correct?","o":["If we leave now, we catch the train.","If we leave now, we'll catch the train.","If we will leave now, we'll catch.","If we leave now, we caught the train."],"a":1,"e":"If + present, will + base verb.","d":"hard"},{"q":"Complete: 'If it ___ tomorrow, the match ___ cancelled.'","o":["will snow / will be","snows / will be","snows / is","snow / will be"],"a":1,"e":"If + present (snows) + will + base (will be).","d":"hard"},{"q":"Choose the sentence with correct punctuation.","o":["You'll be fine, if you relax.","If you relax you'll be fine.","If you relax, you'll be fine.","If, you relax you'll be fine."],"a":2,"e":"Comma after the if-clause when it comes first.","d":"hard"}]},{"id":"g13","title":"Relative clauses","lead":"Relative clauses give extra information about a noun. They begin with a relative pronoun — who, which, that, where — and help you build longer, more natural sentences.","leadTr":{"uz":"Nisbiy ergash gaplar (relative clauses) ot haqida qo'shimcha ma'lumot beradi. Ular who, which, that, where bilan boshlanadi va uzunroq, tabiiyroq gaplar qurishga yordam beradi.","ru":"Относительные придаточные дают дополнительную информацию о существительном. Они начинаются с who, which, that, where и делают речь естественнее."},"situation":"","blocks":[{"h":"who (people) & which (things)","p":["Use who for people and which for things and animals."],"ex":["The man who lives next door is a doctor.","I bought a phone which takes great photos."]},{"h":"that","p":["that can replace who or which in many sentences, especially in speaking."],"ex":["The book that I read was excellent."]},{"h":"where (places)","p":["Use where to talk about a place."],"ex":["This is the café where we first met."]},{"h":"whose (possession)","p":["Use whose to show that something belongs to someone."],"ex":["That’s the girl whose brother is a singer."]}],"tip":"Use who for people, which for things; that can replace either. Don’t add an extra pronoun: ‘The man who he lives next door’ is wrong — drop ‘he’.","examples":["\\"The woman who teaches us is very kind.\\"","\\"This is the laptop which I bought yesterday.\\"","\\"He’s the player that scored the goal.\\"","\\"That’s the town where I was born.\\"","\\"She’s the friend whose car we borrowed.\\"","\\"The film that we saw was boring.\\""],"mistakes":[{"x":"The man which called…","v":"The man who called… (people → who)"},{"x":"That’s the house which I live.","v":"That’s the house where I live. (place → where)"}],"quiz":[{"q":"The man ___ lives here is my uncle.","o":["which","who","where","whose"],"a":1,"e":"People → who.","d":"easy"},{"q":"I have a watch ___ was very expensive.","o":["who","which","where","whose"],"a":1,"e":"Things → which.","d":"easy"},{"q":"This is the school ___ I study.","o":["which","who","where","that"],"a":2,"e":"Place → where.","d":"easy"},{"q":"She's the woman ___ son is a doctor.","o":["who","which","whose","where"],"a":2,"e":"Possession → whose.","d":"easy"},{"q":"The book ___ I read was great.","o":["who","where","that","whose"],"a":2,"e":"Things → that (or which).","d":"easy"},{"q":"The teacher ___ teaches English is new.","o":["which","who","where","whose"],"a":1,"e":"People → who.","d":"med"},{"q":"That's the restaurant ___ we had dinner.","o":["which","who","where","that"],"a":2,"e":"Place → where.","d":"med"},{"q":"I like the shoes ___ you're wearing.","o":["who","which","where","whose"],"a":1,"e":"Things → which (or that).","d":"med"},{"q":"He's the boy ___ won the competition.","o":["which","who","where","whose"],"a":1,"e":"People → who (or that).","d":"med"},{"q":"Choose the correct relative pronoun: 'a person ___ helps others.'","o":["which","who","where","whose"],"a":1,"e":"People → who.","d":"med"},{"q":"Find the mistake: 'The man who he lives next door is friendly.'","o":["remove 'he'","who → which","lives → live","no mistake"],"a":0,"e":"Don’t add an extra subject: The man who lives next door…","d":"hard"},{"q":"Complete: 'That's the girl ___ bag was stolen and ___ called the police.'","o":["who / whose","whose / who","which / who","whose / which"],"a":1,"e":"‘whose bag’ (possession) + ‘who called’ (subject).","d":"hard"},{"q":"Which is correct?","o":["The film who we saw was good.","The film which we saw was good.","The film where we saw was good.","The film whose we saw was good."],"a":1,"e":"Things → which (or that).","d":"hard"},{"q":"Complete: 'This is the hospital ___ I was born, near the park ___ is now closed.'","o":["which / where","where / which","where / who","that / where"],"a":1,"e":"Place ‘where I was born’ + thing ‘which is now closed’.","d":"hard"},{"q":"Choose the natural sentence.","o":["I know a place that sells great coffee.","I know a place who sells great coffee.","I know a place whose sells great coffee.","I know a place where sells great coffee."],"a":0,"e":"Things → that (here ‘a place that sells…’).","d":"hard"}]},{"id":"g14","title":"Linking words: because, so, but, although","lead":"Linking words join ideas to make your writing and speaking flow. They show reasons, results, contrasts and additions between two parts of a sentence.","leadTr":{"uz":"Bog'lovchi so'zlar (because, so, but, although) fikrlarni bir-biriga bog'laydi: sabab, natija, qarama-qarshilik va qo'shimchani ko'rsatadi.","ru":"Союзы because, so, but, although связывают идеи: причина, следствие, контраст и дополнение между частями предложения."},"situation":"","blocks":[{"h":"because (reason) & so (result)","p":["because introduces a reason; so introduces a result."],"ex":["I stayed home because I was ill. · I was ill, so I stayed home."]},{"h":"but & however (contrast)","p":["but joins two contrasting ideas in one sentence; however often starts a new sentence."],"ex":["It was cold, but we went out. · It was cold. However, we went out."]},{"h":"although / though","p":["although introduces a surprising contrast within a sentence."],"ex":["Although it was raining, we played football."]},{"h":"and / or / also","p":["and adds; or gives a choice; also adds extra information."],"ex":["We had tea and cake. · Tea or coffee? · She sings; she also dances."]}],"tip":"‘because’ is followed by a reason and ‘so’ by a result. ‘I was tired because I worked late’ = the reason; ‘I worked late, so I was tired’ = the result.","examples":["\\"I was hungry, so I made a sandwich.\\"","\\"She passed because she studied hard.\\"","\\"He’s rich, but he isn’t happy.\\"","\\"Although she was tired, she finished the work.\\"","\\"Would you like tea or coffee?\\"","\\"It rained all day, so we stayed inside.\\""],"mistakes":[{"x":"Because it was late, so we left.","v":"Use one linker: Because it was late, we left. (not both)"},{"x":"Although it was hard but he tried.","v":"Although it was hard, he tried. (no “but” with “although”)"}],"quiz":[{"q":"I was tired, ___ I went to bed.","o":["because","so","but","although"],"a":1,"e":"Result → so.","d":"easy"},{"q":"She was happy ___ she passed the exam.","o":["so","because","but","although"],"a":1,"e":"Reason → because.","d":"easy"},{"q":"It was raining, ___ we went out.","o":["because","so","but","or"],"a":2,"e":"Contrast → but.","d":"easy"},{"q":"Would you like tea ___ coffee?","o":["and","or","but","so"],"a":1,"e":"Choice → or.","d":"easy"},{"q":"We had cake ___ ice cream.","o":["or","but","and","so"],"a":2,"e":"Addition → and.","d":"easy"},{"q":"___ it was cold, we went swimming.","o":["Because","So","Although","And"],"a":2,"e":"Surprising contrast → Although.","d":"med"},{"q":"He didn't study, ___ he failed.","o":["because","so","but","although"],"a":1,"e":"Result → so.","d":"med"},{"q":"I like coffee ___ I don't drink it at night.","o":["so","because","but","and"],"a":2,"e":"Contrast → but.","d":"med"},{"q":"They stayed home ___ the bad weather.","o":["because of","so","but","although"],"a":0,"e":"‘because of’ + noun (the bad weather).","d":"med"},{"q":"Choose the reason: 'We left early ___ the film was boring.'","o":["so","because","but","or"],"a":1,"e":"Reason → because.","d":"med"},{"q":"Find the mistake: 'Although it was late, but we kept working.'","o":["remove 'but'","Although → Because","late → lately","no mistake"],"a":0,"e":"Don’t use ‘although’ and ‘but’ together: Although it was late, we kept working.","d":"hard"},{"q":"Complete: 'I was ill, ___ I missed school ___ I'm fine now.'","o":["because / so","so / but","but / so","so / because"],"a":1,"e":"Result ‘so I missed school’ + contrast ‘but I’m fine now’.","d":"hard"},{"q":"Which sentence shows a contrast correctly?","o":["Because it was hot, we wore coats.","Although it was hot, we wore coats.","So it was hot, we wore coats.","And it was hot, we wore coats."],"a":1,"e":"Surprising contrast → Although.","d":"hard"},{"q":"Complete: 'She studied medicine ___ she wanted to help people, ___ now she's a doctor.'","o":["so / because","because / and","but / so","because / but"],"a":1,"e":"Reason ‘because’ + addition ‘and now she’s a doctor’.","d":"hard"},{"q":"Choose the correct linker for a result.","o":["It snowed heavily because the roads closed.","It snowed heavily, so the roads closed.","It snowed heavily although the roads closed.","It snowed heavily but the roads closed."],"a":1,"e":"Result → so the roads closed.","d":"hard"}]},{"id":"g15","title":"Question tags","lead":"Question tags are short questions added to the end of a statement, used to check information or invite agreement. The tag matches the tense and reverses the verb.","leadTr":{"uz":"Question tags — gap oxiriga qo'shiladigan qisqa savollar: ma'lumotni tekshirish yoki rozilik so'rash uchun. Tag zamonga mos keladi va fe'lni teskarisiga aylantiradi.","ru":"Разделительные вопросы — короткие вопросы в конце утверждения для проверки информации. Хвостик повторяет время и меняет утверждение на отрицание."},"situation":"","blocks":[{"h":"Positive statement → negative tag","p":["After a positive statement, the tag is negative, using the same auxiliary verb."],"ex":["You’re from Spain, aren’t you? · She likes tea, doesn’t she?"]},{"h":"Negative statement → positive tag","p":["After a negative statement, the tag is positive."],"ex":["You aren’t tired, are you? · He didn’t call, did he?"]},{"h":"Matching the verb","p":["Use ‘be’ with ‘be’; with other verbs use do/does/did; with the present perfect use have/has; with modals repeat the modal."],"ex":["They can swim, can’t they? · You’ve finished, haven’t you?"]},{"h":"Special cases","p":["‘I am’ → tag is aren’t I. ‘Let’s…’ → tag is shall we."],"ex":["I’m next, aren’t I? · Let’s go, shall we?"]}],"tip":"The tag repeats the auxiliary verb and reverses positive/negative. Statement positive → tag negative, and the other way round: ‘He’s here, isn’t he?’ / ‘He isn’t here, is he?’","examples":["\\"You’re a student, aren’t you?\\"","\\"She works here, doesn’t she?\\"","\\"They didn’t come, did they?\\"","\\"He can drive, can’t he?\\"","\\"We’ve met before, haven’t we?\\"","\\"Let’s have a break, shall we?\\""],"mistakes":[{"x":"You’re ready, isn’t it?","v":"You’re ready, aren’t you? (match the verb & subject)"},{"x":"She can swim, can she?","v":"She can swim, can’t she? (positive → negative tag)"}],"quiz":[{"q":"You're from Italy, ___?","o":["are you","aren't you","do you","don't you"],"a":1,"e":"Positive statement → negative tag: aren’t you?","d":"easy"},{"q":"She likes coffee, ___?","o":["does she","doesn't she","is she","isn't she"],"a":1,"e":"Present simple positive → doesn’t she?","d":"easy"},{"q":"They aren't here, ___?","o":["aren't they","are they","do they","don't they"],"a":1,"e":"Negative statement → positive tag: are they?","d":"easy"},{"q":"He can swim, ___?","o":["can he","can't he","does he","doesn't he"],"a":1,"e":"Modal ‘can’ → can’t he?","d":"easy"},{"q":"You don't like fish, ___?","o":["do you","don't you","are you","aren't you"],"a":0,"e":"Negative → positive tag: do you?","d":"easy"},{"q":"She's a teacher, ___?","o":["is she","isn't she","does she","doesn't she"],"a":1,"e":"‘be’ positive → isn’t she?","d":"med"},{"q":"They went home, ___?","o":["did they","didn't they","do they","don't they"],"a":1,"e":"Past simple positive → didn’t they?","d":"med"},{"q":"You've finished, ___?","o":["have you","haven't you","did you","do you"],"a":1,"e":"Present perfect positive → haven’t you?","d":"med"},{"q":"He won't come, ___?","o":["won't he","will he","does he","doesn't he"],"a":1,"e":"Negative ‘won’t’ → positive tag: will he?","d":"med"},{"q":"Let's go to the park, ___?","o":["will we","shall we","do we","don't we"],"a":1,"e":"‘Let’s…’ → shall we?","d":"med"},{"q":"Complete: 'I'm late, ___?'","o":["am I","amn't I","aren't I","isn't I"],"a":2,"e":"‘I am’ takes the special tag ‘aren’t I?’","d":"hard"},{"q":"Choose the correct tag: 'She didn't call you, ___?'","o":["didn't she","did she","does she","doesn't she"],"a":1,"e":"Negative past → positive tag: did she?","d":"hard"},{"q":"Which sentence is correct?","o":["You can drive, can you?","You can drive, can't you?","You can drive, do you?","You can drive, don't you?"],"a":1,"e":"Positive modal → negative tag: can’t you?","d":"hard"},{"q":"Complete: 'They've been to Paris, ___?'","o":["have they","haven't they","did they","didn't they"],"a":1,"e":"Present perfect positive → haven’t they?","d":"hard"},{"q":"Choose :"ладить","def":"","ex":"I get on well with my sister."}]}],"reading":[{"id":"r1","title":"A Trip to London","text":"Last summer, Daniel and his sister Olivia travelled to London for the first time. They took an early train from Manchester and arrived at about ten o'clock.\\nFirst, they visited the British Museum, which was free and very interesting. After that, they had lunch in a small café near the river. In the afternoon, they went on a boat trip and saw many famous buildings.\\nThe weather was warm and sunny all day. In the evening, they were tired but happy. They bought some souvenirs and took lots of photos before they caught the last train home.","quiz":[{"q":"Where did Daniel and Olivia travel from?","o":["London","Manchester","Oxford","Leeds"],"a":1,"e":"They took a train from Manchester.","d":"medium"},{"q":"What did they visit first?","o":["a café","the British Museum","a boat","a shop"],"a":1,"e":"First they visited the British Museum.","d":"medium"},{"q":"How much did the museum cost?","o":["It was free.","Ten pounds.","Five pounds.","The text doesn't say."],"a":0,"e":"The museum was free.","d":"medium"},{"q":"What did they do in the afternoon?","o":["had lunch","went on a boat trip","caught a train","visited a museum"],"a":1,"e":"In the afternoon they went on a boat trip.","d":"medium"},{"q":"How did they feel in the evening?","o":["bored","angry","tired but happy","cold"],"a":2,"e":"They were tired but happy.","d":"medium"}]},{"id":"r2","title":"My First Job","text":"My name is Sophie and I'm nineteen. Last year, I got my first job in a small bookshop in Bristol. At first, I was nervous because I didn't have any experience.\\nMy manager, Mr Clarke, was very kind and patient. He showed me how to use the till and how to help customers find books. The other staff were friendly too, so I soon felt comfortable.\\nI worked part-time, three days a week, and the salary wasn't very high. But I learned a lot, and I really enjoyed talking to customers about books. Now I want to study literature at university.","quiz":[{"q":"Where does Sophie work?","o":["a café","a bookshop","a library","a hotel"],"a":1,"e":"She works in a bookshop in Bristol.","d":"medium"},{"q":"How did she feel at first?","o":["bored","angry","nervous","tired"],"a":2,"e":"She was nervous because she had no experience.","d":"medium"},{"q":"What is her manager like?","o":["unkind","kind and patient","lazy","strict"],"a":1,"e":"Mr Clarke was kind and patient.","d":"medium"},{"q":"How often does she work?","o":["every day","three days a week","at weekends only","once a month"],"a":1,"e":"She works part-time, three days a week.","d":"medium"},{"q":"What does Sophie want to do next?","o":["change jobs","study literature at university","open a shop","become a manager"],"a":1,"e":"She wants to study literature at university.","d":"medium"}]},{"id":"r3","title":"An Email about a Holiday","text":"Hi Grace,\\n\\nHow are you? I'm writing from a small hotel in Brighton, where I've been since Monday. I'm having a wonderful time!\\n\\nI've already done so many things. I've walked along the beach, eaten fresh fish, and visited the famous pier. Yesterday I went swimming in the sea, although the water was quite cold. I haven't been shopping yet, but I'm planning to go tomorrow.\\n\\nThe weather has been mostly sunny, but it rained a little this morning. The people here are very friendly, and the food is delicious.\\n\\nI'll be home on Saturday. Let's meet next week — I'll show you my photos!\\n\\nLove,\\nJack","quiz":[{"q":"Where is Jack staying?","o":["a hotel in Brighton","a flat in London","a friend's house","a campsite"],"a":0,"e":"He's in a small hotel in Brighton.","d":"medium"},{"q":"What has Jack NOT done yet?","o":["walk on the beach","eat fish","go shopping","visit the pier"],"a":2,"e":"He hasn't been shopping yet.","d":"medium"},{"q":"How was the sea when he went swimming?","o":["warm","quite cold","dirty","dangerous"],"a":1,"e":"The water was quite cold.","d":"medium"},{"q":"What was the weather like this morning?","o":["snowy","it rained a little","very hot","windy"],"a":1,"e":"It rained a little this morning.","d":"medium"},{"q":"When will Jack go home?","o":["Monday","Wednesday","Saturday","next week"],"a":2,"e":"He'll be home on Saturday.","d":"medium"}]},{"id":"r4","title":"Town or City?","text":"Many people argue about whether it is better to live in a big city or a small town. Both have advantages and disadvantages.\\nBig cities, like London or Birmingham, are more exciting. There are more jobs, better shops, and lots of things to do in the evening. However, cities are usually more expensive and more crowded, and the air is often more polluted.\\nSmall towns are quieter and cheaper. People are often friendlier and know their neighbours. On the other hand, there are fewer jobs, and young people sometimes find life a little boring.\\nIn my opinion, the best choice depends on your age and your needs. When I was younger, I loved the city, but now I prefer the peace of a small town.","quiz":[{"q":"What is one advantage of big cities?","o":["cheaper houses","more jobs and things to do","cleaner air","friendlier neighbours"],"a":1,"e":"Cities have more jobs and things to do.","d":"medium"},{"q":"What is one disadvantage of big cities?","o":["too quiet","more expensive and crowded","no shops","no jobs"],"a":1,"e":"Cities are more expensive and crowded.","d":"medium"},{"q":"According to the text, people in small towns are often ___.","o":["richer","friendlier","busier","ruder"],"a":1,"e":"People in small towns are often friendlier.","d":"medium"},{"q":"Why might young people find small towns boring?","o":["too many people","there are fewer jobs and things to do","the air is polluted","houses are expensive"],"a":1,"e":"There are fewer jobs and less to do.","d":"medium"},{"q":"What does the writer prefer now?","o":["a big city","the peace of a small town","living abroad","the writer doesn't say"],"a":1,"e":"Now the writer prefers the peace of a small town.","d":"medium"}]},{"id":"r5","title":"The Lost Phone","text":"It was a cold Friday evening, and Emily was hurrying home from work. While she was waiting at the bus stop, she took out her phone to check the time. The bus arrived, and in the rush to get on, she didn't notice that her phone had fallen onto the seat next to her.\\nWhen she got home, she realised her phone was missing. She felt terrible — all her photos and messages were on it. She borrowed her flatmate's phone and called her own number, but nobody answered.\\nThe next morning, however, she received an email. A kind passenger named Harry had found the phone and seen her details on the screen. They arranged to meet at a café in the city centre, and Harry returned the phone. Emily was so grateful that she bought him a coffee. Now they are good friends.","quiz":[{"q":"What was Emily doing when she lost her phone?","o":["sleeping","hurrying home from work","shopping","working in an office"],"a":1,"e":"She was hurrying home from work.","d":"medium"},{"q":"How did she lose the phone?","o":["She dropped it in the street.","It fell onto the bus seat in the rush.","Someone stole it.","She left it at the office."],"a":1,"e":"It fell onto the seat as she rushed onto the bus.","d":"medium"},{"q":"Why did she feel terrible?","o":["She missed the bus.","All her photos and messages were on the phone.","She had no money.","She was late for work."],"a":1,"e":"Her photos and messages were on the phone.","d":"medium"},{"q":"How did Harry contact her?","o":["He phoned her.","He sent an email after seeing her details.","He visited her flat.","He wrote a letter."],"a":1,"e":"He emailed her after seeing her details on the screen.","d":"medium"},{"q":"What happened in the end?","o":["She never found the phone.","Harry kept the phone.","Harry returned the phone and they became friends.","She bought a new phone."],"a":2,"e":"Harry returned it and now they are good friends.","d":"medium"}]}],"list
