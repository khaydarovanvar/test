,"ipa":"/kənˈtɛnʃəs/","uz":"bahsli, nizoli","ru":"спорный","def":"likely to cause argument","ex":"It was a contentious issue.","syn":"controversial, disputed","ant":"agreeable"},{"w":"contrite","pos":"adj","ipa":"/kənˈtraɪt/","uz":"afsuslanuvchi, tavba qilgan","ru":"раскаивающийся","def":"feeling regret for wrongdoing","ex":"He was contrite after the mistake.","syn":"remorseful, penitent","ant":"unrepentant"},{"w":"convoluted","pos":"adj","ipa":"/ˈkɒnvəluːtɪd/","uz":"murakkab, chigal","ru":"запутанный","def":"extremely complex","ex":"The plot was convoluted.","syn":"complicated, tangled","ant":"straightforward"},{"w":"copious","pos":"adj","ipa":"/ˈkoʊpiəs/","uz":"mo'l, ko'p","ru":"обильный","def":"abundant; plentiful","ex":"She took copious notes.","syn":"abundant, ample","ant":"scant"},{"w":"corroborate","pos":"verb","ipa":"/kəˈrɒbəreɪt/","uz":"tasdiqlamoq","ru":"подтверждать","def":"to confirm with evidence","ex":"Witnesses corroborated her story.","syn":"confirm, verify","ant":"contradict"},{"w":"cryptic","pos":"adj","ipa":"/ˈkrɪptɪk/","uz":"sirli, tushunarsiz","ru":"загадочный","def":"mysterious or obscure","ex":"He left a cryptic note.","syn":"obscure, enigmatic","ant":"clear"},{"w":"curtail","pos":"verb","ipa":"/kərˈteɪl/","uz":"qisqartirmoq, cheklamoq","ru":"сокращать","def":"to reduce or cut short","ex":"They curtailed spending.","syn":"reduce, restrict","ant":"extend"},{"w":"cynical","pos":"adj","ipa":"/ˈsɪnɪkəl/","uz":"ishonchsiz, beparvo","ru":"циничный","def":"distrustful of others' motives","ex":"He grew cynical about politics.","syn":"distrustful, skeptical","ant":"trusting"},{"w":"daunting","pos":"adj","ipa":"/ˈdɔːntɪŋ/","uz":"qo'rqinchli, og'ir","ru":"устрашающий","def":"intimidating; difficult","ex":"The task was daunting.","syn":"intimidating, formidable","ant":"easy"}]}],"reading":[{"id":"r1","title":"A Change of Career","text":"For ten years, Daniel had worked as an accountant in a busy office in Birmingham. The salary was good, but he had never really enjoyed the job. He often felt bored, and by the end of each week he was exhausted.\\nLast year, everything changed. While he was helping a friend repair an old house, he realised how much he loved working with his hands. After a few months, he made a brave decision: he resigned from his job and started training as a carpenter.\\nNow Daniel earns less money than before, but he is much happier. He says he should have changed careers years ago. 'If I had known how good it would feel,' he says, 'I would have done it sooner.'","quiz":[{"q":"What was Daniel's first job?","o":["a carpenter","an accountant","a builder","a teacher"],"a":1,"e":"He had worked as an accountant.","d":"medium"},{"q":"How did he usually feel at work?","o":["excited","bored and tired","proud","relaxed"],"a":1,"e":"He felt bored and exhausted.","d":"medium"},{"q":"What made him realise he wanted a change?","o":["a pay rise","helping a friend repair a house","a holiday","losing his job"],"a":1,"e":"He discovered he loved working with his hands.","d":"medium"},{"q":"How does his salary now compare?","o":["higher","the same","lower","he has none"],"a":2,"e":"He earns less money than before.","d":"medium"},{"q":"How does Daniel feel about the change?","o":["He regrets it.","He is much happier.","He is unsure.","He is angry."],"a":1,"e":"He is much happier and wishes he'd done it sooner.","d":"medium"}]},{"id":"r2","title":"Living Abroad","text":"When Sophie moved from Bristol to Spain, she expected the first few months to be easy. She had visited the country several times on holiday and had always loved the weather and the food. However, living abroad turned out to be very different from visiting.\\nAt first, she found everyday tasks difficult. Simple things, such as opening a bank account or going to the doctor, were stressful because of the language. She often felt lonely and missed her family.\\nGradually, things improved. She joined a local Spanish class, where she met other newcomers, and slowly she began to make friends. After a year, she felt completely at home. 'Moving abroad was the hardest thing I have ever done,' she says, 'but also the best.'","quiz":[{"q":"Why did Sophie think living in Spain would be easy?","o":["She spoke Spanish.","She had visited on holiday and loved it.","She had family there.","She had a job waiting."],"a":1,"e":"She had visited and loved the weather and food.","d":"medium"},{"q":"What made everyday tasks hard at first?","o":["the weather","the food","the language","the money"],"a":2,"e":"The language made simple tasks stressful.","d":"medium"},{"q":"How did she feel in the early months?","o":["excited","lonely","angry","bored"],"a":1,"e":"She felt lonely and missed her family.","d":"medium"},{"q":"How did she start to make friends?","o":["at work","through a Spanish class","online","through family"],"a":1,"e":"She met newcomers at a local Spanish class.","d":"medium"},{"q":"What is her overall opinion of moving abroad?","o":["It was a mistake.","It was the hardest but best thing.","It was easy.","She wants to go home."],"a":1,"e":"The hardest thing she'd done, but also the best.","d":"medium"}]},{"id":"r3","title":"The Power of Habit","text":"Most of us would like to change something about our lives — to exercise more, eat better, or waste less time. Yet good intentions are rarely enough. Research suggests that the secret to lasting change is not willpower, but habit.\\nA habit is an action we repeat so often that it becomes automatic. Once a behaviour becomes a habit, we no longer have to think about it or force ourselves to do it. The difficulty, of course, is building the habit in the first place.\\nExperts recommend starting small. Instead of promising to run for an hour every day, you might begin with just ten minutes. It is also helpful to attach a new habit to an existing one — for example, doing a few exercises straight after brushing your teeth. If you keep the goal small and repeat it daily, it will eventually feel natural.","quiz":[{"q":"According to the text, what is the secret to lasting change?","o":["willpower","habit","money","luck"],"a":1,"e":"The text says habit, not willpower.","d":"medium"},{"q":"What is a habit?","o":["a difficult task","an automatic repeated action","a new year's promise","a type of exercise"],"a":1,"e":"A habit is a repeated, automatic action.","d":"medium"},{"q":"Why are habits useful?","o":["They cost money.","We no longer have to force ourselves.","They are difficult.","They need willpower."],"a":1,"e":"Once automatic, no effort is needed.","d":"medium"},{"q":"What do experts recommend?","o":["starting big","starting small","using willpower","giving up"],"a":1,"e":"Start small, e.g. ten minutes.","d":"medium"},{"q":"What trick helps build a new habit?","o":["doing it once a month","attaching it to an existing habit","doing it for an hour","forgetting about it"],"a":1,"e":"Attach the new habit to an existing one.","d":"medium"}]},{"id":"r4","title":"A Letter of Complaint","text":"Dear Sir or Madam,\\n\\nI am writing to complain about a jacket I bought from your online shop on 3 May (order number 4471).\\n\\nWhen the jacket arrived, I was very disappointed. Although the website described it as dark blue, the jacket I received was clearly black. Furthermore, there was a small hole in one of the pockets, which suggests it had not been checked properly before being sent.\\n\\nI have been a regular customer for several years and have never had a problem before. However, on this occasion I am not satisfied with the quality of the product or the service.\\n\\nI would therefore like a full refund. I have attached a photograph of the jacket as evidence. I look forward to hearing from you within seven days.\\n\\nYours faithfully,\\nJ. Harris","quiz":[{"q":"Why is the customer writing?","o":["to praise the shop","to complain about a jacket","to order a jacket","to ask for a job"],"a":1,"e":"It is a letter of complaint about a jacket.","d":"medium"},{"q":"What was wrong with the colour?","o":["It was the wrong size.","It was black, not dark blue.","It was too bright.","Nothing was wrong."],"a":1,"e":"It was black instead of dark blue.","d":"medium"},{"q":"What other fault did the jacket have?","o":["a missing button","a hole in a pocket","a broken zip","a stain"],"a":1,"e":"There was a hole in one pocket.","d":"medium"},{"q":"What does the customer want?","o":["a new jacket","a discount","a full refund","an apology only"],"a":2,"e":"They request a full refund.","d":"medium"},{"q":"What did the customer attach as evidence?","o":["a receipt","a photograph","a video","a letter"],"a":1,"e":"A photograph of the jacket.","d":"medium"}]},{"id":"r5","title":"The Interview","text":"Emily had prepared for weeks. She had researched the company, practised her answers, and chosen her clothes carefully the night before. By the time the morning arrived, she felt ready — or so she thought.\\nThe trouble began on the way there. Her train was cancelled, and by the time she found another, she was already running late. When she finally reached the office in Manchester, she was twenty minutes behind and out of breath.\\nTo her surprise, the manager was understanding. He explained that one of his own interviews, years earlier, had gone badly for similar reasons, and he had still been offered the job. The interview went well, and Emily relaxed.\\nA week later, an email arrived. She had got the job. Looking back, she realised that the disaster on the way had actually helped: it had shown the manager how she behaved under pressure.","quiz":[{"q":"How had Emily prepared for the interview?","o":["She hadn't prepared.","She researched, practised and chose clothes.","She only chose clothes.","She asked a friend."],"a":1,"e":"She researched, practised answers and chose clothes.","d":"medium"},{"q":"Why was she late?","o":["She woke up late.","Her train was cancelled.","She lost the address.","She forgot the time."],"a":1,"e":"Her train was cancelled.","d":"medium"},{"q":"How did the manager react to her lateness?","o":["He was angry.","He was understanding.","He cancelled it.","He said nothing."],"a":1,"e":"He was understanding and shared his own story.","d":"medium"},{"q":"What was the result?","o":["She didn't get the job.","She got the job.","She had to reapply.","She refused the job."],"a":1,"e":"A week later she got the job.","d":"medium"},{"q":"Why does she think the difficult journey helped?","o":["It made her relax.","It showed how she behaves under pressure.","It impressed the staff.","It made her early."],"a":1,"e":"It showed the manager how she handled pressure.","d":"medium"}]}],"listening":[{"id":"l1","title":"A Job Offer","script":"Hello, is that Lucy? Yes, speaking. Hi Lucy, this is Mr Clarke from Riverside Books. I'm calling about your interview last week. We were very impressed, and I'm pleased to offer you the job. Oh, that's wonderful, thank you! The salary is twenty-four thousand pounds a year, and we'd like you to start on the first of June. Could you let me know by Friday if you accept? Yes, of course. Thank you so much. Great. We'll send you the contract by email. Goodbye.","quiz":[{"q":"Who is calling Lucy?","o":["a colleague","Mr Clarke from Riverside Books","her teacher","a customer"],"a":1,"e":"Mr Clarke from Riverside Books is calling.","d":"medium"},{"q":"Why is he calling?","o":["to arrange an interview","to offer her the job","to cancel the job","to ask a question"],"a":1,"e":"He is offering her the job.","d":"medium"},{"q":"What is the salary?","o":["£20,000","£24,000","£42,000","£14,000"],"a":1,"e":"The salary is twenty-four thousand pounds.","d":"medium"},{"q":"When should she start?","o":["1 June","1 July","next week","Friday"],"a":0,"e":"She should start on the first of June.","d":"medium"},{"q":"By when must she reply?","o":["today","Friday","Monday","1 June"],"a":1,"e":"She must reply by Friday.","d":"medium"}]},{"id":"l2","title":"Booking a Holiday","script":"Good morning, Sunshine Travel. How can I help? Hi, I'd like to book a holiday to Italy for two people in July. Certainly. We have a lovely week in Rome, including flights and a hotel near the centre, for six hundred pounds each. That sounds good. Does it include breakfast? Yes, breakfast is included, but not other meals. And are the flights direct? Yes, they are. The flight from London takes about two and a half hours. Perfect. I'll take it. Could I have your name and a deposit of one hundred pounds, please?","quiz":[{"q":"Where does the customer want to go?","o":["Spain","Italy","France","Greece"],"a":1,"e":"They want a holiday to Italy.","d":"medium"},{"q":"How much does the holiday cost per person?","o":["£100","£600","£250","£2,000"],"a":1,"e":"Six hundred pounds each.","d":"medium"},{"q":"What is included in the price?","o":["all meals","breakfast only","no meals","dinner only"],"a":1,"e":"Breakfast is included, but not other meals.","d":"medium"},{"q":"How long is the flight from London?","o":["one hour","two and a half hours","five hours","half an hour"],"a":1,"e":"About two and a half hours.","d":"medium"},{"q":"How much is the deposit?","o":["£600","£100","£50","£200"],"a":1,"e":"A deposit of one hundred pounds.","d":"medium"}]},{"id":"l3","title":"A Volunteer's Story","script":"Today on the programme we're talking to Tom, who volunteers at a city food bank. Tom, how did you start? Well, I lost my own job two years ago and a charity helped me through a hard time. When I got back on my feet, I wanted to give something back, so I started volunteering. What do you actually do? I help collect food from supermarkets and pack it for families in need. I work about two days a week. Is it rewarding? Absolutely. The best part is meeting people and knowing you've made a real difference. I'd encourage anyone with free time to try it.","quiz":[{"q":"Where does Tom volunteer?","o":["a hospital","a food bank","a school","a library"],"a":1,"e":"He volunteers at a city food bank.","d":"medium"},{"q":"Why did he start volunteering?","o":["for money","a charity had helped him","his boss told him to","for a qualification"],"a":1,"e":"A charity helped him, so he wanted to give back.","d":"medium"},{"q":"What does he do there?","o":["cook meals","collect and pack food","drive a bus","answer phones"],"a":1,"e":"He collects food and packs it for families.","d":"medium"},{"q":"How often does he volunteer?","o":["every day","about two days a week","once a month","at weekends only"],"a":1,"e":"About two days a week.","d":"medium"},{"q":"What does he say is the best part?","o":["the free food","meeting people and making a difference","the exercise","the training"],"a":1,"e":"Meeting people and making a real difference.","d":"medium"}]},{"id":"l4","title":"A Local News Report","script":"And now the local news. The city council has announced that the old library in Oxford Street will be turned into a community centre. The building, which has been closed for three years, will reopen next spring after major repairs. The centre will offer free classes, a café, and a space for local groups to meet. The project will cost around two million pounds, most of which has come from the government. Not everyone is happy, however. Some residents argue that the money should have been spent on the city's schools instead. A public meeting will be held next Tuesday for people to share their views.","quiz":[{"q":"What will the old library become?","o":["a shop","a community centre","a school","a hotel"],"a":1,"e":"It will become a community centre.","d":"medium"},{"q":"How long has the building been closed?","o":["one year","three years","ten years","six months"],"a":1,"e":"It has been closed for three years.","d":"medium"},{"q":"What will the new centre offer?","o":["only a café","free classes, a café and meeting space","a cinema","a swimming pool"],"a":1,"e":"Free classes, a café and a space for groups.","d":"medium"},{"q":"Where did most of the money come from?","o":["local residents","the government","a charity","ticket sales"],"a":1,"e":"Most came from the government.","d":"medium"},{"q":"Why are some residents unhappy?","o":["The café is too small.","They think the money should go to schools.","It opens too late.","It is too far away."],"a":1,"e":"They argue the money should have gone to schools.","d":"medium"}]}],"speaking":[{"id":"s1","title":"Your weekend","prompt":"Talk about your weekend for 60 seconds — what you did and how you felt.","seconds":60,"tips":["Mix past simple and present perfect.","Add opinions: it was surprisingly…","Finish with what you'd do differently."]},{"id":"s2","title":"A memorable trip","prompt":"Describe a trip you will never forget.","seconds":75,"tips":["Set the scene: where, when, who with.","Use narrative tenses.","Say why it was memorable."]},{"id":"s3","title":"Technology in your life","prompt":"How has technology changed the way you study or work?","seconds":75,"tips":["Present perfect: has changed / has made…","Give two concrete examples.","Mention one downside."]},{"id":"s4","title":"Giving advice","prompt":"A friend wants to learn English fast. Give them advice.","seconds":60,"tips":["You should…","If I were you, I'd…","It's worth + -ing…"]},{"id":"s5","title":"Describing a person","prompt":"Describe someone you admire and explain why.","seconds":75,"tips":["Personality adjectives: determined, generous…","Give an example of what they did.","Explain their influence on you."]},{"id":"s6","title":"Problems & solutions","prompt":"What is one problem in your city and how would you solve it?","seconds":75,"tips":["State the problem clearly.","Second conditional: If the city…, it would…","End with the benefit."]}],"writing":[{"id":"w1","title":"For and against","prompt":"Write 100–120 words: 'Studying online is better than studying at school.' Give both sides.","min":100,"max":140,"hints":["On the one hand…","On the other hand…","In my opinion…"]},{"id":"w2","title":"A narrative","prompt":"Write a 100–120 word story that begins: 'When I opened the door, I couldn't believe my eyes.'","min":100,"max":140,"hints":["Use narrative tenses.","Describe feelings.","End with a twist."]},{"id":"w3","title":"A formal email","prompt":"Write a formal email (100–120 words) asking a language school for course information.","min":100,"max":140,"hints":["Dear Sir or Madam,","I am writing to enquire about…","I look forward to your reply."]},{"id":"w4","title":"A review","prompt":"Write a 100–120 word review of a film or book you recently enjoyed.","min":100,"max":140,"hints":["Brief plot without spoilers.","What impressed you.","Who you'd recommend it to."]}]}},{"id":"B2","name":"Upper-Intermediate","tagline":"Speak with confidence and precision","weeks":14,"skills":{"grammar":[{"id":"g1","title":"Third conditional","lead":"The third conditional talks about unreal situations in the past — things that did not happen — and their imagined results. We use it to express regret, criticism or relief about the past.","leadTr":{"uz":"Uchinchi shart gapi o'tmishdagi bo'lmagan voqealar va ularning xayoliy natijalari haqida: afsus, tanqid va tahlil uchun ishlatiladi. If + past perfect, would have + V3.","ru":"Третий кондиционал — о несостоявшемся прошлом и его воображаемых результатах: сожаление, критика, анализ. If + past perfect, would have + V3."},"situation":"“If I had studied medicine, I would have become a doctor.” — But I didn’t study medicine, so I’m not a doctor. The third conditional imagines a different past.","blocks":[{"h":"Form: if + past perfect, would have + past participle","p":["Both clauses refer to an imagined past that is now impossible to change."],"ex":["If I had studied, I would have passed."]},{"h":"would / could / might have","p":["Use could have (ability/possibility) or might have (possible result) instead of ‘would have’."],"ex":["If we’d left earlier, we could have caught the train. · She might have won if she’d tried."]},{"h":"Contractions","p":["‘I’d’ can mean ‘I had’ or ‘I would’. In the if-clause it is ‘had’; in the result it is ‘would’."],"ex":["If I’d known (had), I’d have told you (would)."]},{"h":"Use","p":["Express regret, criticism, or relief about a finished situation."],"ex":["If you’d listened, this wouldn’t have happened."]}],"tip":"Never use ‘would have’ in the if-clause: ‘If I would have known’ is wrong → ‘If I had known, I would have…’.","examples":["\\"If I had known, I would have helped.\\"","\\"She would have passed if she had revised.\\"","\\"If we’d left earlier, we could have caught the bus.\\"","\\"They might have won if they had played better.\\"","\\"If it hadn’t rained, we would have gone out.\\"","\\"You wouldn’t have got lost if you’d used a map.\\""],"mistakes":[{"x":"If I would have known, I’d have called.","v":"If I had known, I’d have called. (no “would” after if)"},{"x":"If you’d asked, I would helped.","v":"…I would have helped. (would + have + pp)"}],"quiz":[{"q":"If I had studied, I ___ the exam.","o":["would pass","would have passed","passed","will pass"],"a":1,"e":"Third conditional result: would have passed.","d":"easy"},{"q":"She would have come if you ___ her.","o":["invited","had invited","would invite","invite"],"a":1,"e":"if + past perfect: had invited.","d":"easy"},{"q":"If we hadn't missed the train, we ___ on time.","o":["would arrive","would have arrived","arrived","will arrive"],"a":1,"e":"Result: would have arrived.","d":"easy"},{"q":"If it ___ rained, we'd have gone to the beach.","o":["didn't","hadn't","wouldn't","doesn't"],"a":1,"e":"if + past perfect negative: hadn't rained.","d":"easy"},{"q":"They ___ won if they'd trained harder.","o":["would have","will have","had","would"],"a":0,"e":"Result: would have won.","d":"easy"},{"q":"If I'd had more time, I ___ you.","o":["would help","would have helped","helped","had helped"],"a":1,"e":"Result: would have helped.","d":"med"},{"q":"We ___ caught the bus if we'd run.","o":["could have","can have","could","would"],"a":0,"e":"Ability in the past → could have caught.","d":"med"},{"q":"If she ___ harder, she might have got the job.","o":["tried","had tried","would try","tries"],"a":1,"e":"if + past perfect: had tried.","d":"med"},{"q":"What ___ you ___ if you'd won the prize?","o":["would / do","would / have done","had / done","will / do"],"a":1,"e":"would have done.","d":"med"},{"q":"Choose the past possibility.","o":["She might win.","She might have won.","She will win.","She would win."],"a":1,"e":"Past unreal → might have won.","d":"med"},{"q":"Find the mistake: 'If I would have known, I'd have called.'","o":["would have known → had known","I'd have → I have","called → call","no mistake"],"a":0,"e":"No ‘would have’ in the if-clause: had known.","d":"hard"},{"q":"Complete: 'If they ___ a map, they ___ lost.'","o":["had used / wouldn't have got","used / wouldn't get","had used / wouldn't get","would use / hadn't got"],"a":0,"e":"had used + wouldn't have got.","d":"hard"},{"q":"Which expresses regret about the past?","o":["If I study, I'll pass.","If I studied, I'd pass.","If I had studied, I'd have passed.","If I study, I pass."],"a":2,"e":"Third conditional = past regret.","d":"hard"},{"q":"Complete: 'She ___ the train if she ___ ten minutes earlier.'","o":["would catch / left","would have caught / had left","caught / had left","had caught / would leave"],"a":1,"e":"would have caught + had left.","d":"hard"},{"q":"Choose the correct sentence.","o":["If you'd asked, I would have helped.","If you'd asked, I would helped.","If you asked, I would have helped.","If you had ask, I would have helped."],"a":0,"e":"had asked + would have helped.","d":"hard"}]},{"id":"g2","title":"Mixed conditionals","lead":"Mixed conditionals combine two time frames. The most common type links a past condition to a present result, or a present condition to a past result.","leadTr":{"uz":"Aralash shart gaplari ikki vaqtni birlashtiradi: eng ko'p uchraydigani — o'tmishdagi shartning hozirgi natijasi: If I had studied medicine, I would be a doctor now.","ru":"Смешанные кондиционалы соединяют два времени: чаще всего прошлое условие с настоящим результатом: If I had studied medicine, I would be a doctor now."},"situation":"","blocks":[{"h":"Past condition → present result","p":["if + past perfect, would + base. A past action affects the present."],"ex":["If I had taken the job, I would be rich now."]},{"h":"Present condition → past result","p":["if + past simple, would have + past participle. A present (general) fact affects the past."],"ex":["If I were more careful, I wouldn’t have made that mistake."]},{"h":"Time markers","p":["Words like now, today, still often signal a present result from a past cause."],"ex":["If she hadn’t missed the flight, she would be here now."]},{"h":"Meaning","p":["Mixed conditionals are unreal in both clauses; only the time frames differ."],"ex":["If I spoke French (now), I would have understood them (then)."]}],"tip":"Decide the time of each clause separately: if the cause is past, use past perfect; if the result is present, use ‘would + base’ (not ‘would have’).","examples":["\\"If I had saved money, I would be on holiday now.\\"","\\"If she were taller, she would have joined the team.\\"","\\"If we hadn’t moved, we would still live in Leeds.\\"","\\"If he weren’t so shy, he would have spoken to her.\\"","\\"If I had learnt to drive, life would be easier now.\\"","\\"If you liked sport, you would have come with us.\\""],"mistakes":[{"x":"If I had studied medicine, I would have been a doctor now.","v":"…I would be a doctor now. (present result → would + base)"},{"x":"If I’d booked, we would have been there now.","v":"…we would be there now."}],"quiz":[{"q":"If I had taken that job, I ___ in London now.","o":["would have lived","would live","lived","will live"],"a":1,"e":"Past cause → present result: would live.","d":"easy"},{"q":"If she weren't so busy, she ___ to the party last night.","o":["would come","would have come","came","comes"],"a":1,"e":"Present fact → past result: would have come.","d":"easy"},{"q":"If we hadn't sold the house, we ___ there still.","o":["would live","would have lived","lived","live"],"a":0,"e":"Past cause → present result: would live.","d":"easy"},{"q":"If he were more careful, he ___ his keys yesterday.","o":["wouldn't lose","wouldn't have lost","didn't lose","won't lose"],"a":1,"e":"Present trait → past result: wouldn't have lost.","d":"easy"},{"q":"If I spoke Spanish, I ___ them in Madrid last week.","o":["would understand","would have understood","understood","understand"],"a":1,"e":"Present ability → past result: would have understood.","d":"easy"},{"q":"If they had invested earlier, they ___ wealthy today.","o":["would be","would have been","were","are"],"a":0,"e":"Past cause → present result: would be.","d":"med"},{"q":"Identify the type: 'If I had slept well, I wouldn't be tired now.'","o":["first","second","third","mixed (past→present)"],"a":3,"e":"Past condition, present result → mixed.","d":"med"},{"q":"Complete: 'If she ___ a doctor, she ___ him last night.'","o":["were / would help","were / would have helped","had been / would help","was / helped"],"a":1,"e":"Present fact ‘were’ + past result ‘would have helped’.","d":"med"},{"q":"Find the mistake: 'If I had studied medicine, I would have been a doctor now.'","o":["would have been → would be","had studied → studied","now → then","no mistake"],"a":0,"e":"Present result → would be (not would have been).","d":"med"},{"q":"Complete: 'If we ___ the map, we ___ lost right now.'","o":["had brought / wouldn't be","brought / wouldn't have been","had brought / wouldn't have been","brought / wouldn't be"],"a":0,"e":"Past cause ‘had brought’ + present result ‘wouldn't be’.","d":"med"},{"q":"Which links a present condition to a past result?","o":["If I had money, I'd buy it.","If I were brave, I would have said yes.","If I had known, I'd have come.","If I study, I'll pass."],"a":1,"e":"Present trait ‘were’ + past result ‘would have said’.","d":"hard"},{"q":"Complete: 'If he ___ so lazy, he ___ the project on time last week.'","o":["weren't / would finish","weren't / would have finished","hadn't been / would finish","wasn't / finished"],"a":1,"e":"Present trait + past result.","d":"hard"},{"q":"Complete: 'If I ___ to drive, I ___ a car now.'","o":["had learnt / would have","had learnt / would have had","learnt / would have","had learnt / would had"],"a":1,"e":"Past cause ‘had learnt’ + present result ‘would have’.","d":"hard"},{"q":"Choose the correct mixed conditional.","o":["If I'd booked, we would be there now.","If I book, we would be there now.","If I'd booked, we would have been there now.","If I booked, we will be there."],"a":0,"e":"Past cause → present result.","d":"hard"},{"q":"Complete: 'If she didn't hate flying, she ___ to Japan with us last year.'","o":["would go","would have gone","went","goes"],"a":1,"e":"Present fact → past result: would have gone.","d":"hard"}]},{"id":"g3","title":"Wish & if only","lead":"We use ‘wish’ and ‘if only’ to talk about things we would like to be different. The tense we choose shows whether we mean the present, the past, or an annoying situation we want to change.","leadTr":{"uz":"'Wish' va 'if only' narsalar boshqacha bo'lishini istaganda ishlatiladi. Tanlangan zamon hozirgi, o'tmish yoki bezovta qiluvchi odat haqida ekanini ko'rsatadi.","ru":"Wish и if only выражают желание, чтобы всё было иначе. Выбранное время показывает: речь о настоящем, прошлом или раздражающей привычке."},"situation":"","blocks":[{"h":"wish + past simple (present)","p":["For present situations we want to be different, use the past simple (or ‘were’)."],"ex":["I wish I had more time. · I wish I were taller."]},{"h":"wish + past perfect (past)","p":["For regrets about the past, use the past perfect."],"ex":["I wish I had studied harder."]},{"h":"wish + would (annoyance)","p":["For another person’s annoying behaviour, or a change we want, use would."],"ex":["I wish you would stop shouting. · I wish it would stop raining."]},{"h":"if only","p":["if only works like ‘wish’ but is more emphatic."],"ex":["If only I hadn’t said that!"]}],"tip":"Don’t use ‘wish + would’ about yourself. Say ‘I wish I could…’, not ‘I wish I would…’. Use ‘would’ for other people’s behaviour.","examples":["\\"I wish I knew the answer.\\"","\\"I wish I hadn’t eaten so much.\\"","\\"I wish you would listen to me.\\"","\\"If only I were on holiday now.\\"","\\"She wishes she had taken the job.\\"","\\"If only it would stop snowing!\\""],"mistakes":[{"x":"I wish I would be on holiday now.","v":"I wish I were on holiday now. (don’t use wish + would about yourself)"},{"x":"I wish I would have studied harder.","v":"I wish I had studied harder."}],"quiz":[{"q":"I wish I ___ taller.","o":["am","were","will be","had been"],"a":1,"e":"Present wish → were.","d":"easy"},{"q":"I wish I ___ harder for the exam (it's finished).","o":["studied","had studied","study","would study"],"a":1,"e":"Past regret → had studied.","d":"easy"},{"q":"I wish you ___ stop interrupting me!","o":["will","would","had","were"],"a":1,"e":"Annoying behaviour → would stop.","d":"easy"},{"q":"I wish I ___ more money right now.","o":["have","had","will have","had had"],"a":1,"e":"Present wish → had.","d":"easy"},{"q":"If only it ___ raining!","o":["stops","would stop","stopped","had stopped"],"a":1,"e":"Wanting a change → would stop.","d":"easy"},{"q":"She wishes she ___ the truth earlier.","o":["knew","had known","knows","would know"],"a":1,"e":"Past regret → had known.","d":"med"},{"q":"I wish I ___ speak Chinese.","o":["can","could","would","will"],"a":1,"e":"Present ability wish → could.","d":"med"},{"q":"I wish my neighbours ___ so much noise.","o":["don't make","wouldn't make","didn't make","hadn't made"],"a":1,"e":"Others' behaviour → wouldn't make.","d":"med"},{"q":"If only I ___ that email — it was a mistake.","o":["didn't send","hadn't sent","don't send","wouldn't send"],"a":1,"e":"Past regret → hadn't sent.","d":"med"},{"q":"Choose the present wish.","o":["I wish I had gone.","I wish I lived nearer.","I wish you would help.","I wish I had known."],"a":1,"e":"Present situation → past simple: lived.","d":"med"},{"q":"Find the mistake: 'I wish I would be on holiday now.'","o":["would be → were","wish → hope","now → then","no mistake"],"a":0,"e":"Don't use ‘wish + would’ about yourself: I wish I were.","d":"hard"},{"q":"Complete: 'I wish I ___ the job, and I wish they ___ me another chance.'","o":["took / would give","had taken / would give","take / give","had taken / gave"],"a":1,"e":"Past regret ‘had taken’ + wanting future change ‘would give’.","d":"hard"},{"q":"Which expresses a past regret?","o":["I wish I knew her.","I wish I had met her.","I wish you would call.","I wish I could swim."],"a":1,"e":"Past perfect → had met.","d":"hard"},{"q":"Complete: 'If only he ___ listen — he never does!'","o":["will","would","had","were"],"a":1,"e":"Annoying habit → would listen.","d":"hard"},{"q":"Choose the correct sentence.","o":["I wish I would have studied.","I wish I had studied.","I wish I studied yesterday.","I wish I will study."],"a":1,"e":"Past regret → wish + past perfect.","d":"hard"}]},{"id":"g4","title":"The passive: advanced","lead":"At B2 we use the passive across all tenses and in impersonal reporting structures, which are common in news and academic writing to report opinions without naming a source.","leadTr":{"uz":"B2 darajasida passiv barcha zamonlarda hamda 'It is said that…' kabi shaxssiz konstruksiyalarda ishlatiladi — bu yangiliklar va akademik uslubda keng tarqalgan.","ru":"На B2 пассив используется во всех временах и в безличных оборотах вроде It is said that… — это типично для новостей и академического стиля."},"situation":"“The painting is thought to be a fake.” / “It is said that he is very rich.” — Impersonal passive structures report opinions without naming who says them.","blocks":[{"h":"All tenses","p":["Form the passive with the correct tense of be + past participle, including perfect and continuous forms."],"ex":["The road is being repaired. · The work had been finished. · It will have been done."]},{"h":"It is said that…","p":["Use It + is/was + reporting verb + that… to report general opinions."],"ex":["It is said that he is very rich. · It was believed that the Earth was flat."]},{"h":"Subject + is said to…","p":["A second pattern: Subject + is/was + said/thought + to + infinitive."],"ex":["He is said to be rich. · She is thought to have left the country."]},{"h":"have/get something done","p":["Use have/get + object + past participle when someone does a service for you (see causatives)."],"ex":["I had my car repaired."]}],"tip":"In ‘He is said to have left’, use the perfect infinitive (to have + pp) when the action is earlier than the reporting.","examples":["\\"The bridge is being rebuilt at the moment.\\"","\\"The results had been announced before we arrived.\\"","\\"It is believed that prices will rise.\\"","\\"The painting is thought to be a fake.\\"","\\"He is said to have made a fortune.\\"","\\"The decision will have been made by Friday.\\""],"mistakes":[{"x":"It is said that he has leave.","v":"…he has left. (past participle)"},{"x":"He is thought to have stole it.","v":"He is thought to have stolen it."}],"quiz":[{"q":"The road ___ at the moment.","o":["is repairing","is being repaired","repairs","was repair"],"a":1,"e":"Present continuous passive: is being repaired.","d":"easy"},{"q":"The letters ___ before noon yesterday.","o":["had delivered","had been delivered","have delivered","deliver"],"a":1,"e":"Past perfect passive: had been delivered.","d":"easy"},{"q":"It ___ that he is very wealthy.","o":["is said","says","said","is saying"],"a":0,"e":"Impersonal report: It is said that.","d":"easy"},{"q":"The house ___ by next week.","o":["will sell","will be sold","sells","is selling"],"a":1,"e":"Future passive: will be sold.","d":"easy"},{"q":"The matter is still ___.","o":["discussing","being discussed","discussed it","discuss"],"a":1,"e":"Continuous passive: being discussed.","d":"easy"},{"q":"It is believed ___ the painting is genuine.","o":["that","to","which","what"],"a":0,"e":"It is believed that…","d":"med"},{"q":"He is said ___ a genius.","o":["that he is","to be","being","be"],"a":1,"e":"Subject + is said + to be.","d":"med"},{"q":"The project ___ by the end of the month.","o":["will finish","will have been finished","finishes","is finishing"],"a":1,"e":"Future perfect passive: will have been finished.","d":"med"},{"q":"She is thought ___ the country.","o":["to leave","to have left","leaving","that left"],"a":1,"e":"Earlier action → to have left.","d":"med"},{"q":"Rewrite impersonally: 'People say she is rich.'","o":["She is said to be rich.","She says to be rich.","She is said being rich.","It says she is rich."],"a":0,"e":"She is said to be rich.","d":"med"},{"q":"Find the mistake: 'It is said that he has leave the company.'","o":["has leave → has left","said → say","that → which","no mistake"],"a":0,"e":"Past participle: has left.","d":"hard"},{"q":"Complete: 'The new policy ___ since January.'","o":["is implemented","has been implemented","implements","is implementing"],"a":1,"e":"Present perfect passive: has been implemented.","d":"hard"},{"q":"Which is correct?","o":["He is thought to have stolen it.","He is thought to have stole it.","He is thought stealing it.","He thinks to steal it."],"a":0,"e":"to have + past participle: to have stolen.","d":"hard"},{"q":"Complete (continuous past passive): 'The house ___ when we drove past.'","o":["was being built","was build","is being built","had built"],"a":0,"e":"Past continuous passive: was being built.","d":"hard"},{"q":"Rewrite: 'They believe the company has lost money.'","o":["The company is believed to have lost money.","The company is believed losing money.","The company believes to lose money.","It is believed the company to lose money."],"a":0,"e":"is believed to have lost money.","d":"hard"}]},{"id":"g5","title":"Reported speech: reporting verbs","lead":"Beyond ‘say’ and ‘tell’, English uses many reporting verbs that summarise the function of what was said — such as offer, promise, suggest, admit and refuse — each with its own grammar pattern.","leadTr":{"uz":"'Say' va 'tell'dan tashqari aytilgan gapning MAQSADINI ifodalovchi fe'llar bor: offer, promise, suggest, admit, refuse — har biri o'z grammatik qolipiga ega.","ru":"Кроме say и tell есть глаголы, передающие ЦЕЛЬ сказанного: offer, promise, suggest, admit, refuse — у каждого своя грамматическая модель."},"situation":"","blocks":[{"h":"verb + to-infinitive","p":["offer, promise, agree, refuse, threaten, decide."],"ex":["He offered to help. · She refused to answer."]},{"h":"verb + object + to-infinitive","p":["advise, ask, tell, warn, remind, encourage, invite."],"ex":["They advised me to wait. · He warned us not to go."]},{"h":"verb + -ing","p":["suggest, admit, deny, recommend, mention."],"ex":["She suggested leaving early. · He admitted breaking it."]},{"h":"verb + preposition + -ing","p":["apologise for, insist on, accuse sb of, congratulate sb on."],"ex":["He apologised for being late. · She insisted on paying."]}],"tip":"Match the verb to its pattern: ‘suggest’ takes -ing or ‘that…’, never ‘to’. ‘He suggested to go’ is wrong → ‘He suggested going’.","examples":["\\"She offered to drive me home.\\"","\\"They warned us not to swim there.\\"","\\"He admitted stealing the money.\\"","\\"I apologised for forgetting her birthday.\\"","\\"The doctor advised him to rest.\\"","\\"She insisted on seeing the manager.\\""],"mistakes":[{"x":"She suggested to meet at six.","v":"She suggested meeting at six. (suggest + -ing)"},{"x":"He apologised to be late.","v":"He apologised for being late."}],"quiz":[{"q":"He offered ___ me with my bags.","o":["help","to help","helping","that help"],"a":1,"e":"offer + to: to help.","d":"easy"},{"q":"She suggested ___ a taxi.","o":["take","to take","taking","takes"],"a":2,"e":"suggest + -ing: taking.","d":"easy"},{"q":"They advised me ___ a doctor.","o":["see","to see","seeing","saw"],"a":1,"e":"advise + object + to: to see.","d":"easy"},{"q":"He admitted ___ the window.","o":["break","to break","breaking","broke"],"a":2,"e":"admit + -ing: breaking.","d":"easy"},{"q":"She refused ___ the question.","o":["answer","to answer","answering","answered"],"a":1,"e":"refuse + to: to answer.","d":"easy"},{"q":"He apologised ___ late.","o":["to be","for being","being","that be"],"a":1,"e":"apologise for + -ing: for being.","d":"med"},{"q":"They warned us ___ out late.","o":["to not stay","not to stay","not staying","don't stay"],"a":1,"e":"warn + object + not to: not to stay.","d":"med"},{"q":"She insisted ___ for dinner.","o":["to pay","on paying","paying","that pay"],"a":1,"e":"insist on + -ing: on paying.","d":"med"},{"q":"He denied ___ anything wrong.","o":["to do","doing","do","that do"],"a":1,"e":"deny + -ing: doing.","d":"med"},{"q":"They invited us ___ the party.","o":["join","to join","joining","that join"],"a":1,"e":"invite + object + to: to join.","d":"med"},{"q":"Find the mistake: 'She suggested to meet at six.'","o":["to meet → meeting","suggested → suggest","six → at six","no mistake"],"a":0,"e":"suggest + -ing: suggested meeting.","d":"hard"},{"q":"Report: \\"I'll definitely pay you back.\\" → He ___.","o":["promised to pay me back","promised paying me back","suggested to pay back","admitted to pay back"],"a":0,"e":"promise + to: promised to pay back.","d":"hard"},{"q":"Report: \\"It was me. I took it.\\" → She ___.","o":["denied taking it","admitted taking it","refused to take it","offered to take it"],"a":1,"e":"admit + -ing: admitted taking it.","d":"hard"},{"q":"Report: \\"You should rest.\\" (doctor → patient)","o":["The doctor advised resting.","The doctor advised him to rest.","The doctor suggested him to rest.","The doctor offered to rest."],"a":1,"e":"advise + object + to: advised him to rest.","d":"hard"},{"q":"Report: \\"Well done on passing!\\" → They ___.","o":["congratulated me on passing","congratulated me to pass","apologised for passing","insisted on passing"],"a":0,"e":"congratulate sb on + -ing.","d":"hard"}]},{"id":"g6","title":"Past modals of deduction","lead":"To make guesses about the past, we use a modal verb + have + past participle. These show how certain we are that something happened, based on present evidence.","leadTr":{"uz":"O'tmish haqidagi taxminlar uchun modal + have + V3 ishlatiladi: must have left — aniq ketgan; can't have known — bilgan bo'lishi mumkin emas.","ru":"Для догадок о прошлом: модальный глагол + have + V3. Must have left — точно ушёл; can't have known — не мог знать."},"situation":"","blocks":[{"h":"must have (almost certain)","p":["Use must have + past participle when you are sure something happened."],"ex":["The ground is wet — it must have rained."]},{"h":"can’t / couldn’t have (impossible)","p":["Use can’t/couldn’t have + pp when you are sure it did not happen."],"ex":["He can’t have finished already; it’s too soon."]},{"h":"might / may / could have (possible)","p":["Use these for things that possibly happened but you’re not sure."],"ex":["She might have missed the bus. · They could have got lost."]},{"h":"should have (criticism/regret)","p":["Use should have + pp for the right thing that didn’t happen (regret or criticism)."],"ex":["You should have told me. · I shouldn’t have eaten so much."]}],"tip":"For deduction the opposite of ‘must have’ is ‘can’t have’, not ‘mustn’t have’. ‘Mustn’t have’ is not used for deduction in standard English.","examples":["\\"The lights are off — they must have gone out.\\"","\\"She can’t have seen us; she didn’t wave.\\"","\\"He might have forgotten the meeting.\\"","\\"You should have called a doctor.\\"","\\"I shouldn’t have said that.\\"","\\"They could have taken the wrong road.\\""],"mistakes":[{"x":"He mustn’t have heard the bell.","v":"He can’t have heard the bell. (negative deduction → can’t have)"},{"x":"You should have call me.","v":"You should have called me."}],"quiz":[{"q":"The grass is wet. It ___ last night.","o":["must rain","must have rained","can't rain","should rain"],"a":1,"e":"Sure it happened → must have rained.","d":"easy"},{"q":"He ___ the news; he looks shocked.","o":["must have heard","can't have heard","should hear","must hear"],"a":0,"e":"Sure → must have heard.","d":"easy"},{"q":"She didn't wave, so she ___ us.","o":["must have seen","can't have seen","should have seen","might see"],"a":1,"e":"Sure not → can't have seen.","d":"easy"},{"q":"I'm not sure where he is. He ___ home.","o":["must have gone","can't have gone","might have gone","should have gone"],"a":2,"e":"Possible → might have gone.","d":"easy"},{"q":"You're hurt! You ___ me.","o":["should have told","must have told","can't have told","might tell"],"a":0,"e":"Criticism/regret → should have told.","d":"easy"},{"q":"The cake is gone. Someone ___ it.","o":["must have eaten","can't have eaten","should eat","must eat"],"a":0,"e":"Sure → must have eaten.","d":"med"},{"q":"He failed? He ___ much.","o":["must have studied","can't have studied","should study","might study"],"a":1,"e":"Sure not → can't have studied.","d":"med"},{"q":"They're late. They ___ stuck in traffic.","o":["should have been","can't have been","might have been","must be"],"a":2,"e":"Possible → might have been.","d":"med"},{"q":"I feel ill. I ___ that fish.","o":["should have eaten","shouldn't have eaten","can't have eaten","must eat"],"a":1,"e":"Regret → shouldn't have eaten.","d":"med"},{"q":"Choose the 'impossible' deduction.","o":["She must have left.","She can't have left.","She might have left.","She should have left."],"a":1,"e":"can't have = sure it didn't happen.","d":"med"},{"q":"Find the mistake: 'He mustn't have heard the bell.'","o":["mustn't have → can't have","heard → hear","the → a","no mistake"],"a":0,"e":"For negative deduction use ‘can't have’.","d":"hard"},{"q":"Complete: 'The door's open — someone ___ in, or you ___ to lock it.'","o":["must have broken / might have forgotten","can't have broken / must forget","should break / can't forget","might break / should forget"],"a":0,"e":"must have broken in (sure) + might have forgotten (possible).","d":"hard"},{"q":"Which shows regret about the past?","o":["I must have left early.","I should have left earlier.","I might have left early.","I can't have left."],"a":1,"e":"should have = regret.","d":"hard"},{"q":"Complete: 'She passed easily — the exam ___ very hard.'","o":["must have been","can't have been","should have been","might be"],"a":1,"e":"Sure it wasn't hard → can't have been.","d":"hard"},{"q":"Choose the correct sentence.","o":["You should have call me.","You should have called me.","You should called me.","You must called me."],"a":1,"e":"should have + past participle: should have called.","d":"hard"}]},{"id":"g7","title":"Relative clauses: advanced","lead":"At B2 we use more formal relative structures: prepositions before the relative pronoun, ‘whose’ for possession, and quantifiers like ‘some of whom’ and ‘both of which’ in non-defining clauses.","leadTr":{"uz":"B2 da rasmiyroq nisbiy tuzilmalar o'rganiladi: predlog + relative pronoun (in which), egalik uchun 'whose' hamda 'some of whom', 'both of which' kabi birikmalar.","ru":"На B2 — более формальные относительные конструкции: предлог + местоимение (in which), whose для принадлежности, some of whom, both of which."},"situation":"","blocks":[{"h":"Preposition + which/whom","p":["In formal English the preposition can go before the relative pronoun (which/whom)."],"ex":["The man to whom I spoke… · The house in which they live…"]},{"h":"Informal: preposition at the end","p":["In everyday English we usually move the preposition to the end and may drop the pronoun."],"ex":["The man (who) I spoke to… · The house (that) they live in…"]},{"h":"quantifier + of whom/which","p":["In non-defining clauses use all/some/many/none/both + of whom/which."],"ex":["I have three sisters, all of whom are doctors."]},{"h":"whose","p":["whose shows possession for people and things."],"ex":["A company whose products are famous… · The author, whose books I love…"]}],"tip":"After a preposition use whom (not ‘who’) and which (not ‘that’): ‘the person to whom…’, ‘the tool with which…’. ‘To that’ and ‘to who’ are wrong here.","examples":["\\"The colleague with whom I work is brilliant.\\"","\\"This is the book about which we spoke.\\"","\\"She has many friends, most of whom live abroad.\\"","\\"They sell phones, none of which are cheap.\\"","\\"He’s an artist whose work sells worldwide.\\"","\\"The reason for which he left is unclear.\\""],"mistakes":[{"x":"The client to that I wrote replied.","v":"…to whom I wrote… (preposition + whom)"},{"x":"I have two cousins, both of who are nurses.","v":"…both of whom are nurses."}],"quiz":[{"q":"The person ___ I spoke was helpful. (formal)","o":["to who","to whom","to that","whom to"],"a":1,"e":"Preposition + whom: to whom.","d":"easy"},{"q":"That's the house ___ which they were born.","o":["in","on","at","of"],"a":0,"e":"born in a house → in which.","d":"easy"},{"q":"He's a writer ___ novels are famous.","o":["who","which","whose","whom"],"a":2,"e":"Possession → whose.","d":"easy"},{"q":"Informal: 'The man I spoke ___.'","o":["to","with","for","of"],"a":0,"e":"speak to → preposition at the end: to.","d":"easy"},{"q":"I have two cousins, both ___ whom are nurses.","o":["of","in","to","for"],"a":0,"e":"both of whom.","d":"easy"},{"q":"The tool ___ which we cut it was sharp.","o":["with","by","of","to"],"a":0,"e":"cut with → with which.","d":"med"},{"q":"She has many fans, some ___ whom waited all night.","o":["of","in","to","for"],"a":0,"e":"some of whom.","d":"med"},{"q":"The company ___ products we use is British.","o":["who","whose","which","whom"],"a":1,"e":"Possession (company's) → whose.","d":"med"},{"q":"This is the issue ___ which we must decide.","o":["on","in","of","at"],"a":0,"e":"decide on → on which.","d":"med"},{"q":"Choose the formal version of 'the man I work with'.","o":["the man with who I work","the man with whom I work","the man with that I work","the man whom I work"],"a":1,"e":"with whom I work.","d":"med"},{"q":"Find the mistake: 'The client to that I wrote replied.'","o":["to that → to whom","wrote → write","replied → reply","no mistake"],"a":0,"e":"After a preposition use ‘whom’, not ‘that’.","d":"hard"},{"q":"Complete: 'He owns three shops, ___ are in London.'","o":["all of which","all of whom","which all","that all"],"a":0,"e":"Things → all of which.","d":"hard"},{"q":"Which is correct and formal?","o":["The report on which it is based is here.","The report on that it is based is here.","The report which it is based on which…","The report based which on it…"],"a":0,"e":"based on → on which.","d":"hard"},{"q":"Complete: 'She interviewed ten people, ___ had experience.'","o":["none of whom","none of which","whom none","which none"],"a":0,"e":"People → none of whom.","d":"hard"},{"q":"Choose the correct 'whose' sentence.","o":["The painter who paintings sell well is here.","The painter whose paintings sell well is here.","The painter which paintings sell well is here.","The painter whom paintings sell well is here."],"a":1,"e":"Possession → whose paintings.","d":"hard"}]},{"id":"g8","title":"Causative: have/get something done","lead":"We use the causative when we arrange for someone else to do a service for us, rather than doing it ourselves. The structure focuses on the result, not on who does the work.","leadTr":{"uz":"Kauzativ (have/get something done) xizmatni o'zimiz emas, boshqa birov bajarishini bildiradi: I had my phone repaired — telefonimni tuzattirdim.","ru":"Каузатив (have/get something done) означает, что услугу выполняет кто-то другой: I had my phone repaired — мне починили телефон."},"situation":"“I don’t cut my own hair — I have it cut.” — The causative shows that someone does a service for you. The focus is on the result, not who does the work.","blocks":[{"h":"have + object + past participle","p":["The standard structure: have + thing + past participle."],"ex":["I had my hair cut. · We had the house painted."]},{"h":"get + object + past participle","p":["get is a more informal alternative to ‘have’."],"ex":["I got my car repaired. · She got her photo taken."]},{"h":"All tenses","p":["Change the tense of ‘have/get’ as needed."],"ex":["I’m having my eyes tested tomorrow. · He’s had his phone fixed."]},{"h":"Unpleasant events","p":["The same structure can describe something bad that happened to you."],"ex":["She had her bag stolen. · They had their flight cancelled."]}],"tip":"The order is have + OBJECT + past participle, not ‘have + past participle + object’. Say ‘I had my car washed’, not ‘I had washed my car’ (that means you did it yourself).","examples":["\\"I had my suit cleaned for the wedding.\\"","\\"We’re getting the kitchen redecorated.\\"","\\"He had his tooth taken out.\\"","\\"She got her hair coloured.\\"","\\"They had their car broken into.\\"","\\"I need to have my passport renewed.\\""],"mistakes":[{"x":"I had repaired my bike at the shop.","v":"I had my bike repaired. (have + object + past participle)"},{"x":"I’ll have fix the roof.","v":"I’ll have the roof fixed."}],"quiz":[{"q":"I ___ my hair cut yesterday.","o":["had","have","did","made"],"a":0,"e":"Causative past: had my hair cut.","d":"easy"},{"q":"We're going to ___ the house painted.","o":["have","do","make","take"],"a":0,"e":"have the house painted.","d":"easy"},{"q":"She ___ her car repaired last week.","o":["got","made","did","took"],"a":0,"e":"got her car repaired.","d":"easy"},{"q":"Choose the correct order.","o":["I had cut my hair.","I had my hair cut.","I had my cut hair.","I cut had my hair."],"a":1,"e":"have + object + past participle.","d":"easy"},{"q":"He needs to have his eyes ___.","o":["test","tested","testing","to test"],"a":1,"e":"Past participle: tested.","d":"easy"},{"q":"I'm ___ my photo taken tomorrow.","o":["have","having","had","got"],"a":1,"e":"Present continuous: having.","d":"med"},{"q":"They ___ their windows cleaned every month.","o":["get","getting","got","to get"],"a":0,"e":"Habit, present simple: get.","d":"med"},{"q":"She ___ her bag stolen on the train. (bad event)","o":["had","did","made","took"],"a":0,"e":"had her bag stolen.","d":"med"},{"q":"We've just ___ the carpet cleaned.","o":["have","had","having","got had"],"a":1,"e":"Present perfect: have had → 'have just had'... here 'had' completes 'have just had'.","d":"med"},{"q":"Choose the causative meaning 'someone did it for me'.","o":["I painted the door.","I had the door painted.","I was painting the door.","I paint the door."],"a":1,"e":"Causative: had the door painted.","d":"med"},{"q":"Find the mistake: 'I had repaired my bike at the shop.'","o":["had repaired → had my bike repaired","at → in","the → a","no mistake"],"a":0,"e":"Causative needs object + pp: had my bike repaired.","d":"hard"},{"q":"Complete: 'You should ___ that tooth ___.'","o":["have / looking at","get / looked at","got / look at","have / look"],"a":1,"e":"get + object + past participle: get it looked at.","d":"hard"},{"q":"Which describes an unpleasant event?","o":["He had his car serviced.","He had his car stolen.","He had his car washed.","He had his car painted."],"a":1,"e":"had his car stolen = bad event.","d":"hard"},{"q":"Complete: 'They ___ their flight ___ because of the storm.'","o":["had / cancelled","had / cancel","got / cancelling","have / cancel"],"a":0,"e":"had + object + past participle: had it cancelled.","d":"hard"},{"q":"Choose the correct future causative.","o":["I'll have fix the roof.","I'll have the roof fixed.","I'll have fixed the roof for me.","I'll fix have the roof."],"a":1,"e":"have + object + past participle: have the roof fixed.","d":"hard"}]},{"id":"g9","title":"Gerunds & infinitives: advanced","lead":"Some verbs are followed by either a gerund or an infinitive, but with a clear change of meaning. Knowing the difference lets you say exactly what you mean.","leadTr":{"uz":"Ayrim fe'llardan keyin gerund ham, infinitiv ham keladi, lekin ma'no aniq o'zgaradi: remember doing (eslash) / remember to do (unutmaslik).","ru":"После некоторых глаголов возможны обе формы, но смысл меняется: remember doing (помнить, как делал) / remember to do (не забыть сделать)."},"situation":"","blocks":[{"h":"remember / forget","p":["+ to = the duty comes after; + -ing = the memory comes before."],"ex":["Remember to lock the door. (do it) · I remember locking it. (memory)"]},{"h":"stop","p":["stop + -ing = end the activity; stop + to = pause in order to do something."],"ex":["He stopped smoking. (quit) · He stopped to smoke. (paused)"]},{"h":"try","p":["try + -ing = experiment; try + to = attempt something difficult."],"ex":["Try adding salt. (experiment) · I tried to open it. (attempt)"]},{"h":"regret / mean / go on","p":["regret + -ing = be sorry about the past; regret + to = be sorry to announce. mean + -ing = involve; mean + to = intend."],"ex":["I regret saying it. · I regret to inform you… · This job means travelling. · I meant to call."]}],"tip":"With ‘remember/forget’: use the infinitive for a task you must do, and the -ing form for a memory of something already done.","examples":["\\"Please remember to post the letter.\\"","\\"I’ll never forget meeting her.\\"","\\"He stopped to rest for a minute.\\"","\\"Try turning it off and on again.\\"","\\"I regret to tell you the news is bad.\\"","\\"Studying abroad means leaving home.\\""],"mistakes":[{"x":"I regret to tell him the truth; now he’s angry.","v":"I regret telling him… (regret + -ing = sorry about the past)"},{"x":"On the walk we stopped taking photos. (meaning: paused to take)","v":"…we stopped to take photos. (pause in order to)"}],"quiz":[{"q":"Remember ___ the door when you leave.","o":["lock","to lock","locking","locked"],"a":1,"e":"Duty to do → to lock.","d":"easy"},{"q":"I remember ___ him at the party last year.","o":["meet","to meet","meeting","met"],"a":2,"e":"Memory → meeting.","d":"easy"},{"q":"He stopped ___ because his lungs hurt. (quit)","o":["smoke","to smoke","smoking","smoked"],"a":2,"e":"Ended the activity → stopped smoking.","d":"easy"},{"q":"On the walk, we stopped ___ photos.","o":["take","to take","taking","took"],"a":1,"e":"Paused in order to → to take.","d":"easy"},{"q":"I regret ___ that I can't help.","o":["say","to say","saying","said"],"a":1,"e":"Sorry to announce → regret to say.","d":"easy"},{"q":"The recipe didn't work. Try ___ more sugar.","o":["to add","adding","add","added"],"a":1,"e":"Experiment → try adding.","d":"med"},{"q":"I tried ___ the window, but it was stuck.","o":["opening","to open","open","opened"],"a":1,"e":"Attempt at something hard → tried to open.","d":"med"},{"q":"This new job means ___ to another city.","o":["to move","moving","move","moved"],"a":1,"e":"mean = involve → moving.","d":"med"},{"q":"I'm sorry, I meant ___ you earlier.","o":["calling","to call","call","called"],"a":1,"e":"mean = intend → to call.","d":"med"},{"q":"Don't forget ___ your medicine tonight.","o":["take","to take","taking","took"],"a":1,"e":"Duty → to take.","d":"med"},{"q":"Find the mistake: 'I regret to tell him the truth; now he's angry.'","o":["to tell → telling","regret → regretting","him → to him","no mistake"],"a":0,"e":"Sorry about the past → regret telling.","d":"hard"},{"q":"Complete: 'I'll never forget ___ the Pyramids, but please remember ___ the tickets.'","o":["to see / buying","seeing / to buy","seeing / buying","to see / to buy"],"a":1,"e":"Memory ‘seeing’ + duty ‘to buy’.","d":"hard"},{"q":"Which means 'he paused his walk to make a call'?","o":["He stopped calling.","He stopped to call.","He stopped to be called.","He stopped called."],"a":1,"e":"stop + to = pause in order to.","d":"hard"},{"q":"Complete: 'We regret ___ you that the flight ___, so we tried ___ another route.'","o":["telling / is cancelled / finding","to inform / has been cancelled / to find","to inform / cancelled / finding","informing / cancelling / to find"],"a":1,"e":"regret to inform + passive + tried to find.","d":"hard"},{"q":"Choose the correct pair.","o":["Remember posting it (do it now) / I stopped to smoke (quit).","Remember to post it (do it) / I stopped smoking (quit).","Remember to post it / I stopped to smoke means I quit.","Remember posting it means do it now."],"a":1,"e":"to-infinitive = task; stop + -ing = quit.","d":"hard"}]},{"id":"g10","title":"Future perfect & continuous","lead":"To talk about the future in detail, we use the future continuous for actions in progress at a future time, and the future perfect for actions that will be completed before a future point.","leadTr":{"uz":"Kelajakni batafsil ifodalash uchun: future continuous — kelajakdagi paytda davom etadigan harakat; future perfect — muayyan muddatgacha tugaydigan harakat.","ru":"Для детального будущего: future continuous — действие в процессе в будущий момент; future perfect — действие, завершённое к сроку."},"situation":"","blocks":[{"h":"Future continuous: will be + -ing","p":["An action that will be in progress at a specific future time."],"ex":["This time tomorrow I will be flying to Rome."]},{"h":"Future perfect: will have + past participle","p":["An action that will be finished before a future time, often with ‘by’."],"ex":["By 2030 they will have built the bridge."]},{"h":"by / by the time","p":["Use by + time or by the time + clause with the future perfect."],"ex":["By the time you arrive, I will have left."]},{"h":"Future perfect continuous","p":["will have been + -ing stresses the duration up to a future point."],"ex":["By June I will have been working here for ten years."]}],"tip":"Use the future continuous for something happening at a future moment, and the future perfect for something completed before that moment.","examples":["\\"At 8 pm I ’ll be having dinner.\\"","\\"By Friday we ’ll have finished the report.\\"","\\"This time next week she ’ll be lying on a beach.\\"","\\"By the time he’s 30, he ’ll have travelled the world.\\"","\\"In May I ’ll have been studying here for three years.\\"","\\"Don’t call at six — I’ll be driving.\\""],"mistakes":[{"x":"By next month I will finish the course.","v":"By next month I will have finished… (completed before → future perfect)"},{"x":"Don’t call at six — I will drive.","v":"…I’ll be driving. (in progress → future continuous)"}],"quiz":[{"q":"This time tomorrow I ___ to Spain.","o":["will fly","will be flying","will have flown","fly"],"a":1,"e":"In progress at a future time → will be flying.","d":"easy"},{"q":"By next year, they ___ the new road.","o":["will build","will be building","will have built","build"],"a":2,"e":"Completed before a future time → will have built.","d":"easy"},{"q":"At 9 pm tonight, we ___ the match.","o":["will watch","will be watching","will have watched","watch"],"a":1,"e":"In progress → will be watching.","d":"easy"},{"q":"By the time you arrive, I ___.","o":["will leave","will be leaving","will have left","leave"],"a":2,"e":"Finished before → will have left.","d":"easy"},{"q":"Don't phone at six; I ___.","o":["will drive","will be driving","will have driven","drive"],"a":1,"e":"In progress → will be driving.","d":"easy"},{"q":"By Friday she ___ the project.","o":["will finish","will be finishing","will have finished","finishes"],"a":2,"e":"Completed by a deadline → will have finished.","d":"med"},{"q":"This time next week, they ___ on holiday.","o":["will relax","will be relaxing","will have relaxed","relax"],"a":1,"e":"In progress → will be relaxing.","d":"med"},{"q":"In June I ___ here for five years.","o":["will work","will be working","will have been working","work"],"a":2,"e":"Duration up to a future point → will have been working.","d":"med"},{"q":"By 2040, scientists ___ a cure, perhaps.","o":["will find","will be finding","will have found","find"],"a":2,"e":"Completed before → will have found.","d":"med"},{"q":"Choose the action in progress at a future time.","o":["I'll have eaten by then.","I'll be eating at 8.","I'll eat at 8.","I eat at 8."],"a":1,"e":"will be eating = in progress.","d":"med"},{"q":"Find the mistake: 'By next month I will finish the course.'","o":["will finish → will have finished","By → On","month → months","no mistake"],"a":0,"e":"Completed before a future time → will have finished.","d":"hard"},{"q":"Complete: 'At noon we ___ the test; by 2 pm we ___ it.'","o":["will be taking / will have finished","will take / will finish","will have taken / will be finishing","take / finish"],"a":0,"e":"In progress ‘will be taking’ + completed ‘will have finished’.","d":"hard"},{"q":"Which stresses duration up to a future point?","o":["I'll have written the book.","I'll be writing the book.","By May I'll have been writing for a year.","I'll write the book."],"a":2,"e":"will have been writing = duration.","d":"hard"},{"q":"Complete: 'By the time the film ends, we ___ here for three hours.'","o":["will sit","will be sitting","will have been sitting","sit"],"a":2,"e":"Duration up to a point → will have been sitting.","d":"hard"},{"q":"Choose the correct future perfect.","o":["By 6, they will have left.","By 6, they will leaving.","By 6, they will have leave.","By 6, they leave."],"a":0,"e":"will have + past participle: will have left.","d":"hard"}]},{"id":"g11","title":"Past perfect continuous","lead":"The past perfect continuous shows that an activity had been in progress for a period before another point in the past. It emphasises duration and often explains a past situation.","leadTr":{"uz":"Past perfect continuous o'tmishdagi nuqtadan OLDIN ma'lum muddat davom etgan faoliyatni bildiradi va ko'pincha sababni tushuntiradi: He was tired because he had been working.","ru":"Past perfect continuous — действие, длившееся ДО момента в прошлом; часто объясняет причину: He was tired because he had been working."},"situation":"“She had been waiting for an hour when the bus finally came.” — The past perfect continuous shows how long an activity had gone on up to a past moment.","blocks":[{"h":"Form: had been + -ing","p":["Use had been + verb-ing for an action that continued up to a point in the past."],"ex":["She had been waiting for an hour when the bus came."]},{"h":"Explaining a past result","p":["It often explains why something was the case at a past moment."],"ex":["His eyes were red because he had been crying."]},{"h":"with for / since","p":["Use for + period and since + starting point."],"ex":["They had been living there for years before they moved."]},{"h":"vs. past perfect simple","p":["The continuous stresses the activity/duration; the simple stresses the completed result."],"ex":["I had been reading. (activity) · I had read the book. (finished)"]}],"tip":"Don’t use the continuous with state verbs. Say ‘I had known her for years’, not ‘I had been knowing’.","examples":["\\"He was tired because he had been working all night.\\"","\\"We had been driving for hours when the car broke down.\\"","\\"She had been studying French before she moved to Paris.\\"","\\"The ground was wet; it had been raining.\\"","\\"They had been arguing before we arrived.\\"","\\"I had been waiting for ages when she finally called.\\""],"mistakes":[{"x":"I had been knowing him for years before he left.","v":"I had known him for years… (state verb → simple)"},{"x":"They had been lived there for years.","v":"They had been living there for years."}],"quiz":[{"q":"She ___ for an hour when the bus arrived.","o":["waited","had been waiting","has waited","was waiting"],"a":1,"e":"Duration up to a past point → had been waiting.","d":"easy"},{"q":"His eyes were red because he ___.","o":["cried","had been crying","cries","has cried"],"a":1,"e":"Explains the past result → had been crying.","d":"easy"},{"q":"They ___ for hours before they stopped.","o":["drove","had been driving","drive","have driven"],"a":1,"e":"Duration → had been driving.","d":"easy"},{"q":"The form of the past perfect continuous is ___.","o":["had + -ing","had been + -ing","has been + -ing","was + -ing"],"a":1,"e":"had been + -ing.","d":"easy"},{"q":"It was wet outside; it ___.","o":["rained","had been raining","rains","has rained"],"a":1,"e":"Earlier activity → had been raining.","d":"easy"},{"q":"We ___ for the train when it was cancelled.","o":["waited","had been waiting","wait","have waited"],"a":1,"e":"Duration before a past event → had been waiting.","d":"med"},{"q":"She was out of breath because she ___.","o":["ran","had been running","runs","has run"],"a":1,"e":"Explains the state → had been running.","d":"med"},{"q":"How long ___ they ___ before they got married?","o":["had / been dating","have / dated","did / date","had / dated"],"a":0,"e":"Duration → had they been dating.","d":"med"},{"q":"Which verb is WRONG in this form?","o":["working","waiting","knowing","studying"],"a":2,"e":"‘know’ is a state verb.","d":"med"},{"q":"Choose the duration form.","o":["I had read for hours.","I had been reading for hours.","I have read for hours.","I was read for hours."],"a":1,"e":"Duration → had been reading.","d":"med"},{"q":"Find the mistake: 'I had been knowing him for years before he left.'","o":["had been knowing → had known","left → leave","years → year","no mistake"],"a":0,"e":"State verb: had known.","d":"hard"},{"q":"Complete: 'By the time help arrived, they ___ for three hours.'","o":["had been swimming","had swum","were swimming","have been swimming"],"a":0,"e":"Duration up to a past point → had been swimming.","d":"hard"},{"q":"Which stresses the completed result?","o":["She had been painting the room.","She had painted the room.","She was painting the room.","She had been paint the room."],"a":1,"e":"Completed → past perfect simple: had painted.","d":"hard"},{"q":"Complete: 'He failed because he ___ instead of revising.'","o":["had been playing","had played","played","was play"],"a":0,"e":"Ongoing activity explaining the result → had been playing.","d":"hard"},{"q":"Choose the correct sentence.","o":["They had been lived there for years.","They had been living there for years.","They have been living there for years before.","They had living there for years."],"a":1,"e":"had been + -ing: had been living.","d":"hard"}]},{"id":"g12","title":"Inversion","lead":"In formal or emphatic English, certain negative or limiting adverbials at the start of a sentence force inversion — the auxiliary verb comes before the subject, as in a question.","leadTr":{"uz":"Rasmiy va ta'sirli uslubda gap boshidagi inkor iboralar (never, rarely, not only) inversiyani talab qiladi — yordamchi fe'l egadan oldin keladi: Never have I seen…","ru":"В формальном стиле отрицательные обороты в начале предложения (never, rarely, not only) требуют инверсии: Never have I seen…"},"situation":"“Never have I seen such a mess.” — In formal or emphatic English, a negative word at the start pushes the auxiliary in front of the subject, like a question.","blocks":[{"h":"Negative adverbials","p":["After never, rarely, seldom, hardly, no sooner, not only, little at the start, invert subject and auxiliary."],"ex":["Never have I seen such a mess. · Rarely does she complain."]},{"h":"hardly… when / no sooner… than","p":["Used for one event quickly following another."],"ex":["Hardly had we arrived when it started to rain. · No sooner had he spoken than she left."]},{"h":"not only… but also","p":["Not only + auxiliary + subject, … but also …"],"ex":["Not only did he apologise, but he also paid."]},{"h":"only + time phrase","p":["After only then / only after / only when / not until, invert."],"ex":["Only when she left did I realise. · Not until midnight did they finish."]}],"tip":"Inversion uses the same auxiliary you’d use in a question: ‘Never have I…’, ‘Rarely does he…’, ‘Not only did she…’. Don’t use normal word order after these openers.","examples":["\\"Never have I been so embarrassed.\\"","\\"Rarely do we see such talent.\\"","\\"Hardly had I sat down when the phone rang.\\"","\\"No sooner had they left than it snowed.\\"","\\"Not only is she clever, but she’s kind too.\\"","\\"Only after the test did he relax.\\""],"mistakes":[{"x":"Never I have eaten such good food.","v":"Never have I eaten such good food. (invert: aux + subject)"},{"x":"Not only she sings, but she dances.","v":"Not only does she sing, but she also dances."},{"x":"No sooner he had left when it rained.","v":"No sooner had he left than it rained."}],"quiz":[{"q":"Never ___ such a beautiful view.","o":["I have seen","have I seen","I saw","did I saw"],"a":1,"e":"Inversion: have I seen.","d":"easy"},{"q":"Rarely ___ to the cinema.","o":["she goes","goes she","does she go","she does go"],"a":2,"e":"Inversion: does she go.","d":"easy"},{"q":"Not only ___ late, but he was rude too.","o":["he was","was he","he is","did he"],"a":1,"e":"Inversion: was he.","d":"easy"},{"q":"Seldom ___ such kindness.","o":["we see","see we","do we see","we do see"],"a":2,"e":"Inversion: do we see.","d":"easy"},{"q":"Hardly ___ down when the bell rang.","o":["I had sat","had I sat","I sat","did I sit"],"a":1,"e":"Inversion: had I sat.","d":"easy"},{"q":"No sooner had we left ___ it started to rain.","o":["when","than","that","then"],"a":1,"e":"No sooner … than.","d":"med"},{"q":"Little ___ that he was being watched.","o":["he knew","knew he","did he know","he did know"],"a":2,"e":"Inversion: did he know.","d":"med"},{"q":"Only when she apologised ___ better.","o":["I felt","felt I","did I feel","I did feel"],"a":2,"e":"Inversion: did I feel.","d":"med"},{"q":"Not until the next day ___ the news.","o":["they heard","heard they","did they hear","they did hear"],"a":2,"e":"Inversion: did they hear.","d":"med"},{"q":"Hardly had I arrived ___ the trouble began.","o":["than","when","then","that"],"a":1,"e":"Hardly … when.","d":"med"},{"q":"Find the mistake: 'Never I have eaten such good food.'","o":["I have → have I","eaten → ate","such → so","no mistake"],"a":0,"e":"Inversion: Never have I eaten.","d":"hard"},{"q":"Complete: 'No sooner ___ the door ___ the alarm rang.'","o":["had he opened / when","he opened / than","had he opened / than","did he open / when"],"a":2,"e":"No sooner had he opened … than.","d":"hard"},{"q":"Which is correct?","o":["Not only she sings, but she dances.","Not only does she sing, but she also dances.","Not only sings she, but she dances.","Not only she does sing, but dances."],"a":1,"e":"Not only does she sing, but she also dances.","d":"hard"},{"q":"Complete: 'Only after he left ___ how rude he had been.'","o":["I realised","realised I","did I realise","I did realise"],"a":2,"e":"Inversion after ‘Only after’: did I realise.","d":"hard"},{"q":"Rewrite with inversion: 'I had rarely felt so happy.'","o":["Rarely I had felt so happy.","Rarely had I felt so happy.","Rarely did I had felt so happy.","Rarely felt I so happy."],"a":1,"e":"Rarely had I felt so happy.","d":"hard"}]},{"id":"g13","title":"Cleft sentences","lead":"Cleft (‘divided’) sentences split one idea into two clauses to emphasise a particular part. They are very common in speech for adding focus and contrast.","leadTr":{"uz":"Cleft gaplar bitta fikrni ikki qismga bo'lib, kerakli joyga urg'u beradi: It was Aziz who called. / What I need is time. Og'zaki nutqda juda ko'p uchraydi.","ru":"Расщеплённые предложения делят мысль надвое ради акцента: It was Aziz who called. / What I need is time. Очень частотны в речи."},"situation":"","blocks":[{"h":"It-cleft: It + be + focus + that/who…","p":["Emphasise a person, thing, time or place."],"ex":["It was Tom who broke it. · It was in 2010 that we met."]},{"h":"What-cleft: What… + be + focus","p":["Emphasise the whole idea, often an action or need."],"ex":["What I need is a holiday. · What he did was (to) call the police."]},{"h":"The thing / the reason / the place","p":["Other openers add focus too."],"ex":["The reason (why) I’m late is the traffic. · The place where we stayed was lovely."]},{"h":"All (that)…","p":["All can mean ‘the only thing’."],"ex":["All I want is peace and quiet."]}],"tip":"In a What-cleft, the verb ‘be’ is singular even before a plural idea if ‘what’ is the subject: ‘What I need is answers’ (not ‘are’).","examples":["\\"It was my sister who called, not me.\\"","\\"It’s your help that I need.\\"","\\"What surprised me was his honesty.\\"","\\"What we did was book another flight.\\"","\\"The reason I left was the noise.\\"","\\"All she wanted was the truth.\\""],"mistakes":[{"x":"What I want are answers.","v":"What I want is answers. (“what” as subject → singular verb)"},{"x":"It was John which sent the email.","v":"It was John who sent the email."}],"quiz":[{"q":"___ Tom who broke the window.","o":["It was","There was","That was","He was"],"a":0,"e":"It-cleft: It was Tom who…","d":"easy"},{"q":"What I need ___ a long rest.","o":["are","is","be","was being"],"a":1,"e":"What-cleft, singular: is.","d":"easy"},{"q":"It was in Paris ___ they got married.","o":["who","which","that","what"],"a":2,"e":"Place/time it-cleft: that.","d":"easy"},{"q":"___ I want is some peace.","o":["All","It","That","Which"],"a":0,"e":"All = the only thing.","d":"easy"},{"q":"It was Sarah ___ helped me.","o":["which","who","what","whom"],"a":1,"e":"Person → who.","d":"easy"},{"q":"What he did ___ apologise.","o":["was","were","is being","be"],"a":0,"e":"What-cleft: was (to) apologise.","d":"med"},{"q":"The reason ___ I called was to thank you.","o":["which","why","what","who"],"a":1,"e":"The reason why.","d":"med"},{"q":"It's not the money ___ matters.","o":["who","what","that","which one"],"a":2,"e":"It-cleft: that matters.","d":"med"},{"q":"What surprised everyone ___ his decision.","o":["was","were","are","be"],"a":0,"e":"Singular ‘what’ → was.","d":"med"},{"q":"Choose the cleft emphasising the place.","o":["We stayed in a lovely hotel.","It was the hotel that we loved.","The place where we stayed was lovely.","A lovely place we stayed."],"a":2,"e":"The place where… = focus on place.","d":"med"},{"q":"Find the mistake: 'What I want are answers.'","o":["are → is","want → wants","What → That","no mistake"],"a":0,"e":"‘What’ as subject → singular: is.","d":"hard"},{"q":"Rewrite to emphasise 'John': 'John sent the email.'","o":["It was John who sent the email.","It was the email who John sent.","What John was the email.","John it was sent the email."],"a":0,"e":"It was John who sent the email.","d":"hard"},{"q":"Complete: '___ we should do ___ tell the truth.'","o":["What / is","That / is","It / that","All what / is"],"a":0,"e":"What we should do is tell the truth.","d":"hard"},{"q":"Which correctly emphasises the reason?","o":["The reason why he left was the noise.","The reason what he left was the noise.","It was the reason the noise left.","Why the reason he left noise."],"a":0,"e":"The reason why he left was the noise.","d":"hard"},{"q":"Complete: '___ that I admire ___ her honesty.'","o":["It is the thing / is","The thing / is","What it is / are","That thing / are"],"a":1,"e":"The thing that I admire is her honesty.","d":"hard"}]},{"id":"g14","title":"Linking & contrast","lead":"Linkers of contrast and concession join ideas that seem to conflict. The right choice depends on whether the linker is followed by a noun, an -ing form, or a full clause.","leadTr":{"uz":"Qarama-qarshilik bog'lovchilari zid fikrlarni birlashtiradi. To'g'ri tanlov bog'lovchidan keyin ot, -ing shakli yoki to'liq gap kelishiga bog'liq: despite + ot, although + gap.","ru":"Союзы контраста и уступки соединяют противоречащие идеи. Выбор зависит от того, что идёт после: despite + сущ., although + предложение."},"situation":"","blocks":[{"h":"although / even though / though + clause","p":["Followed by a subject + verb."],"ex":["Although it was late, we kept working. · Even though she tried, she failed."]},{"h":"despite / in spite of + noun/-ing","p":["Followed by a noun or -ing form, not a clause. Add ‘the fact that’ to use a claus
