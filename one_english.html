inar","faculty"],"a":1,"e":"Thesis = a research dissertation."},{"q":"'Plagiat' (copying someone's work) in English is ___.","o":["scholarship","plagiarism","criterion","discipline"],"a":1,"e":"‘Plagiat’ = plagiarism."},{"q":"To examine something in detail is to ___ it.","o":["revise","analyse","assess","motivate"],"a":1,"e":"Analyse = examine in detail."},{"q":"A standard used to judge something is a ___.","o":["criterion","faculty","tuition","seminar"],"a":0,"e":"Criterion = a standard for judging."},{"q":"Money paid to study at a university is ___.","o":["scholarship","tuition","competence","discipline"],"a":1,"e":"Tuition = study fees."}]},{"id":"v8","title":"Crime & law","words":[{"w":"crime","pos":"n","ipa":"/kraɪm/","uz":"jinoyat","ru":"преступление","ex":"The crime shocked the town."},{"w":"suspect","pos":"n","ipa":"/ˈsʌspekt/","uz":"gumonlanuvchi","ru":"подозреваемый","ex":"Police arrested a suspect."},{"w":"witness","pos":"n","ipa":"/ˈwɪtnəs/","uz":"guvoh","ru":"свидетель","ex":"A witness saw the accident."},{"w":"evidence","pos":"n","ipa":"/ˈevɪdəns/","uz":"dalil","ru":"доказательство","ex":"There was little evidence."},{"w":"trial","pos":"n","ipa":"/ˈtraɪəl/","uz":"sud jarayoni","ru":"суд","ex":"The trial lasted two weeks."},{"w":"guilty","pos":"adj","ipa":"/ˈɡɪlti/","uz":"aybdor","ru":"виновный","ex":"The jury found him guilty."},{"w":"innocent","pos":"adj","ipa":"/ˈɪnəsnt/","uz":"aybsiz","ru":"невиновный","ex":"She was proved innocent."},{"w":"sentence","pos":"n","ipa":"/ˈsentəns/","uz":"hukm","ru":"приговор","ex":"He got a five-year sentence."},{"w":"victim","pos":"n","ipa":"/ˈvɪktɪm/","uz":"jabrlanuvchi","ru":"жертва","ex":"The victim called the police."},{"w":"prosecute","pos":"v","ipa":"/ˈprɒsɪkjuːt/","uz":"jinoiy javobgarlikka tortmoq","ru":"привлекать к суду","ex":"They will prosecute the thief."},{"w":"jury","pos":"n","ipa":"/ˈdʒʊəri/","uz":"hakamlar hayʼati","ru":"присяжные","ex":"The jury reached a verdict."},{"w":"verdict","pos":"n","ipa":"/ˈvɜːdɪkt/","uz":"hukm/qaror","ru":"вердикт","ex":"The verdict was not guilty."},{"w":"offence","pos":"n","ipa":"/əˈfens/","uz":"huquqbuzarlik","ru":"правонарушение","ex":"It was a minor offence."},{"w":"arrest","pos":"v","ipa":"/əˈrest/","uz":"hibsga olmoq","ru":"арестовывать","ex":"Police arrested two men."},{"w":"fine","pos":"n","ipa":"/faɪn/","uz":"jarima","ru":"штраф","ex":"He paid a heavy fine."},{"w":"theft","pos":"n","ipa":"/θeft/","uz":"oʻgʻirlik","ru":"кража","ex":"Theft has increased in the area."},{"w":"lawyer","pos":"n","ipa":"/ˈlɔːjə/","uz":"advokat","ru":"адвокат","ex":"She hired a good lawyer."},{"w":"justice","pos":"n","ipa":"/ˈdʒʌstɪs/","uz":"adolat","ru":"правосудие","ex":"They demanded justice."},{"w":"accuse","pos":"v","ipa":"/əˈkjuːz/","uz":"ayblamoq","ru":"обвинять","ex":"He was accused of fraud."},{"w":"punishment","pos":"n","ipa":"/ˈpʌnɪʃmənt/","uz":"jazo","ru":"наказание","ex":"The punishment was severe."},{"w":"convict","pos":"v","ipa":"/kənˈvɪkt/","uz":"aybdor deb topmoq","ru":"осуждать","ex":"He was convicted of theft."},{"w":"fraud","pos":"n","ipa":"/frɔːd/","uz":"firibgarlik","ru":"мошенничество","ex":"She was charged with fraud."}],"q":[{"q":"A person who sees a crime happen is a ___.","o":["suspect","witness","victim","jury"],"a":1,"e":"Witness = someone who sees an event."},{"q":"'Dalil' (facts proving something) in English is ___.","o":["verdict","evidence","sentence","offence"],"a":1,"e":"‘Dalil’ = evidence."},{"q":"The official decision in a trial is the ___.","o":["fine","verdict","theft","fraud"],"a":1,"e":"Verdict = the court's decision."},{"q":"A person harmed by a crime is the ___.","o":["suspect","witness","victim","lawyer"],"a":2,"e":"Victim = the one harmed."},{"q":"To formally charge someone in court is to ___ them.","o":["prosecute","arrest","witness","fine"],"a":0,"e":"Prosecute = bring a legal case against."}]},{"id":"v9","title":"Emotions & psychology","words":[{"w":"anxiety","pos":"n","ipa":"/æŋˈzaɪəti/","uz":"xavotir","ru":"тревога","ex":"She suffers from anxiety."},{"w":"confidence","pos":"n","ipa":"/ˈkɒnfɪdəns/","uz":"oʻziga ishonch","ru":"уверенность","ex":"He spoke with confidence."},{"w":"frustration","pos":"n","ipa":"/frʌˈstreɪʃn/","uz":"umidsizlik","ru":"разочарование","ex":"She hid her frustration."},{"w":"empathy","pos":"n","ipa":"/ˈempəθi/","uz":"hamdardlik","ru":"эмпатия","ex":"A nurse needs empathy."},{"w":"motivation","pos":"n","ipa":"/ˌməʊtɪˈveɪʃn/","uz":"motivatsiya","ru":"мотивация","ex":"His motivation is impressive."},{"w":"resilience","pos":"n","ipa":"/rɪˈzɪliəns/","uz":"chidamlilik","ru":"устойчивость","ex":"Resilience helps in hard times."},{"w":"grief","pos":"n","ipa":"/ɡriːf/","uz":"qaygʻu","ru":"горе","ex":"She was overcome by grief."},{"w":"mood","pos":"n","ipa":"/muːd/","uz":"kayfiyat","ru":"настроение","ex":"He's in a good mood today."},{"w":"behaviour","pos":"n","ipa":"/bɪˈheɪvjə/","uz":"xulq","ru":"поведение","ex":"Her behaviour changed suddenly."},{"w":"self-esteem","pos":"n","ipa":"/ˌself ɪˈstiːm/","uz":"oʻz-oʻzini hurmat qilish","ru":"самооценка","ex":"Praise builds self-esteem."},{"w":"depression","pos":"n","ipa":"/dɪˈpreʃn/","uz":"depressiya","ru":"депрессия","ex":"He is recovering from depression."},{"w":"emotion","pos":"n","ipa":"/ɪˈməʊʃn/","uz":"hissiyot","ru":"эмоция","ex":"She struggled to control her emotion."},{"w":"stress","pos":"n","ipa":"/stres/","uz":"stress","ru":"стресс","ex":"Too much stress is harmful."},{"w":"trauma","pos":"n","ipa":"/ˈtrɔːmə/","uz":"ruhiy jarohat","ru":"травма","ex":"He never forgot the trauma."},{"w":"cope","pos":"v","ipa":"/kəʊp/","uz":"bardosh bermoq","ru":"справляться","ex":"She copes well with pressure."},{"w":"reaction","pos":"n","ipa":"/riˈækʃn/","uz":"reaksiya","ru":"реакция","ex":"His reaction surprised us."},{"w":"instinct","pos":"n","ipa":"/ˈɪnstɪŋkt/","uz":"instinkt","ru":"инстинкт","ex":"Trust your instinct."},{"w":"perception","pos":"n","ipa":"/pəˈsepʃn/","uz":"idrok","ru":"восприятие","ex":"Perception shapes reality."},{"w":"overwhelmed","pos":"adj","ipa":"/ˌəʊvəˈwelmd/","uz":"ezilgan","ru":"подавленный","ex":"She felt overwhelmed by work."},{"w":"attitude","pos":"n","ipa":"/ˈætɪtjuːd/","uz":"munosabat","ru":"отношение","ex":"A positive attitude helps."},{"w":"insecure","pos":"adj","ipa":"/ˌɪnsɪˈkjʊə/","uz":"oʻziga ishonchsiz","ru":"неуверенный","ex":"He feels insecure about it."},{"w":"wellbeing","pos":"n","ipa":"/ˌwelˈbiːɪŋ/","uz":"farovonlik","ru":"благополучие","ex":"They care about staff wellbeing."}],"q":[{"q":"The ability to understand others' feelings is ___.","o":["anxiety","empathy","grief","stress"],"a":1,"e":"Empathy = sharing others' feelings."},{"q":"'Chidamlilik' (recovering from difficulty) in English is ___.","o":["resilience","frustration","mood","trauma"],"a":0,"e":"‘Chidamlilik’ = resilience."},{"q":"A deep feeling of sadness, especially after a loss, is ___.","o":["mood","grief","instinct","attitude"],"a":1,"e":"Grief = deep sorrow."},{"q":"To deal successfully with a difficult situation is to ___.","o":["cope","react","perceive","stress"],"a":0,"e":"Cope = manage difficulty."},{"q":"How much you value yourself is your ___.","o":["perception","self-esteem","reaction","instinct"],"a":1,"e":"Self-esteem = self-worth."}]}],"READING":[{"id":"r1","title":"The Remote Working Debate","text":"Since the pandemic, working from home has become normal for millions of people. Supporters argue that it offers a better work-life balance: employees save hours that would otherwise be wasted commuting, and many report feeling less stressed and more productive.\nNot everyone is convinced, however. Some managers worry that staff who work remotely are harder to supervise and less connected to their colleagues. Younger workers, in particular, may miss the informal learning that happens in an office, where they can pick up skills simply by watching experienced people.\nThe truth probably lies somewhere in between. A growing number of companies in Manchester and London now offer a 'hybrid' model, in which employees spend part of the week at home and part in the office. Had this option been available ten years ago, it might have seemed strange. Today, it is increasingly seen as the best of both worlds.","level":"Medium","q":[{"q":"What is one advantage of remote work mentioned?","o":["higher pay","a better work-life balance","more holidays","free meals"],"a":1,"e":"It offers a better work-life balance."},{"q":"Why do some managers worry?","o":["Staff work too hard.","Staff are harder to supervise.","Offices are expensive.","Staff earn less."],"a":1,"e":"Remote staff are harder to supervise and less connected."},{"q":"What might younger workers miss?","o":["higher salaries","informal learning in the office","longer holidays","free transport"],"a":1,"e":"They may miss informal learning from experienced colleagues."},{"q":"What is the 'hybrid' model?","o":["working only at home","working only in the office","part home, part office","working at night"],"a":2,"e":"Part of the week at home, part in the office."},{"q":"What is the writer's overall view of hybrid work?","o":["It is strange.","It is the best of both worlds.","It will fail.","It is only for managers."],"a":1,"e":"It is increasingly seen as the best of both worlds."}]},{"id":"r2","title":"Living with Artificial Intelligence","text":"Artificial intelligence is no longer science fiction. It already recommends the films we watch, filters our emails, and helps doctors read medical scans. For many, these developments are exciting; for others, they are a cause for concern.\nThose who welcome AI point to its potential to save lives and time. A computer can examine thousands of images far faster than a human, spotting patterns that might otherwise be missed. In industries from farming to finance, AI is helping people make better decisions.\nYet the same technology raises difficult questions. If a self-driving car causes an accident, who is responsible? As machines take over more tasks, some jobs will certainly disappear. Supporters argue that new jobs will be created, just as they were during the Industrial Revolution. Critics are less sure. What seems clear is that AI is here to stay, and societies will need to decide carefully how to use it.","level":"Medium","q":[{"q":"What does the text say AI already does?","o":["replaces all doctors","recommends films and filters emails","drives all cars","teaches in schools"],"a":1,"e":"It recommends films, filters emails and helps read scans."},{"q":"Why is AI useful in medicine?","o":["It is cheaper.","It examines images faster than humans.","It never makes mistakes.","It replaces nurses."],"a":1,"e":"It can examine many images quickly and spot patterns."},{"q":"What difficult question does the text raise?","o":["how fast cars go","who is responsible for a self-driving car accident","how to build computers","where to buy AI"],"a":1,"e":"Responsibility for a self-driving car accident."},{"q":"What do supporters say about jobs?","o":["All jobs will be lost.","New jobs will be created.","No jobs will change.","Only farming jobs remain."],"a":1,"e":"They argue new jobs will be created."},{"q":"What conclusion does the writer reach?","o":["AI should be banned.","AI will disappear soon.","AI is here to stay and must be used carefully.","AI is useless."],"a":2,"e":"AI is here to stay; societies must decide how to use it."}]},{"id":"r3","title":"Why We Put Things Off","text":"Almost everyone procrastinates. We delay important tasks, choosing instead to check our phones, tidy a drawer, or make yet another cup of tea. We know we are wasting time, and yet we do it anyway. Why?\nPsychologists suggest that procrastination is not really about laziness. It is more often about emotion. When a task makes us feel anxious or bored, our brain looks for an escape, and a quick, pleasant distraction provides instant relief. The problem, of course, is that the relief never lasts, and the task only grows more stressful.\nThe good news is that procrastination can be managed. Experts recommend breaking a large task into small steps, so that it feels less frightening. It also helps to forgive yourself for past delays; research has shown that students who stopped criticising themselves actually procrastinated less in future. In other words, being kinder to ourselves may be the first step towards getting things done.","level":"Medium","q":[{"q":"According to psychologists, procrastination is mainly about ___.","o":["laziness","emotion","intelligence","time"],"a":1,"e":"It is more about emotion than laziness."},{"q":"Why does the brain seek distraction?","o":["to learn","for instant relief from anxiety or boredom","to save money","to sleep"],"a":1,"e":"Distraction gives instant relief from bad feelings."},{"q":"What is the problem with distraction?","o":["It costs money.","The relief never lasts.","It is illegal.","It is tiring."],"a":1,"e":"The relief never lasts and the task grows more stressful."},{"q":"What do experts recommend for big tasks?","o":["ignoring them","breaking them into small steps","doing them at night","asking others to do them"],"a":1,"e":"Break a large task into small steps."},{"q":"What did research on students show?","o":["Self-criticism helped.","Forgiving themselves reduced procrastination.","Punishment worked best.","Nothing changed."],"a":1,"e":"Students who stopped self-criticism procrastinated less."}]},{"id":"r4","title":"Report: Improving the Town Library","text":"Introduction\nThe purpose of this report is to assess the current state of Brighton Central Library and to recommend improvements. The findings are based on a survey of 200 users and interviews with staff.\n\nFindings\nThe majority of users praised the library's wide selection of books. However, several problems were identified. Firstly, the opening hours were felt to be too limited, particularly for those who work full-time. Secondly, the building's Wi-Fi was described as slow and unreliable. Finally, a number of younger visitors complained that there was nowhere quiet to study.\n\nRecommendations\nIn light of these findings, it is recommended that the library extend its opening hours into the evening. Furthermore, the Wi-Fi system should be upgraded as a priority. Were a quiet study area to be created on the upper floor, it would almost certainly attract more students.\n\nConclusion\nWith relatively modest investment, the library could serve the community far more effectively.","level":"Hard","q":[{"q":"What is the purpose of the report?","o":["to close the library","to assess it and recommend improvements","to advertise books","to hire staff"],"a":1,"e":"To assess the library and recommend improvements."},{"q":"How was the information gathered?","o":["from one manager","a survey and interviews","from the internet","from newspapers"],"a":1,"e":"A survey of 200 users and staff interviews."},{"q":"What did users praise?","o":["the café","the wide selection of books","the parking","the garden"],"a":1,"e":"The wide selection of books."},{"q":"Which was NOT a problem identified?","o":["limited opening hours","slow Wi-Fi","nowhere quiet to study","rude staff"],"a":3,"e":"Rude staff was not mentioned."},{"q":"What is recommended for the upper floor?","o":["a café","a quiet study area","a car park","a cinema"],"a":1,"e":"Creating a quiet study area would attract students."}]},{"id":"r5","title":"The Cost of Cheap Travel","text":"Never before has travel been so affordable. Budget airlines now offer flights across Europe for the price of a meal, and millions of us take advantage every year. Yet this golden age of cheap travel comes at a price that does not appear on the ticket.\nThe most obvious cost is environmental. Aviation produces a significant share of carbon emissions, and a single long flight can undo months of careful recycling. Less visible, but no less serious, is the impact on popular destinations. Cities such as Venice and Barcelona have become so crowded with visitors that local residents are being pushed out of their own neighbourhoods.\nNone of this means we should stop travelling altogether. Travel broadens the mind and supports countless livelihoods. What it does suggest is that we should travel more thoughtfully — flying less often, staying longer, and respecting the places we visit. Only if tourists and governments act together will the benefits of travel be preserved for future generations.","level":"Hard","q":[{"q":"What point does the opening make about travel today?","o":["It is too expensive.","It has never been so affordable.","It is dangerous.","It is disappearing."],"a":1,"e":"Travel has never been so affordable."},{"q":"What is described as the most obvious cost?","o":["environmental","financial","political","medical"],"a":0,"e":"The environmental cost (carbon emissions)."},{"q":"What problem do Venice and Barcelona face?","o":["too few tourists","overcrowding pushing out residents","high prices","bad weather"],"a":1,"e":"Overcrowding is pushing local residents out."},{"q":"Does the writer say we should stop travelling?","o":["Yes, completely.","No, but travel more thoughtfully.","Yes, for one year.","No opinion is given."],"a":1,"e":"We should travel more thoughtfully, not stop."},{"q":"What does the writer say is needed to preserve travel's benefits?","o":["cheaper flights","tourists and governments acting together","more airports","longer holidays"],"a":1,"e":"Tourists and governments must act together."}]}],"LISTENING":[{"id":"l1","title":"A University Lecture","script":"Good morning, everyone. Today we're looking at the psychology of decision-making. Now, we like to think we make choices logically, weighing up the facts. But research suggests otherwise. In fact, most of our decisions are driven by emotion and by mental shortcuts the brain uses to save effort. These shortcuts are usually helpful, but they can lead to predictable mistakes. For example, people tend to fear losing something far more than they value gaining the same thing. This is called loss aversion, and we'll explore it in detail after the break. For now, I'd like you to read chapter four before next week's seminar.","level":"Medium","q":[{"q":"What is the lecture about?","o":["the history of war","the psychology of decision-making","learning languages","economics of trade"],"a":1,"e":"It is about the psychology of decision-making."},{"q":"What does research suggest about our decisions?","o":["They are purely logical.","They are driven by emotion and mental shortcuts.","They are always wrong.","They take a long time."],"a":1,"e":"Most decisions are driven by emotion and shortcuts."},{"q":"What are the mental shortcuts usually like?","o":["always harmful","usually helpful but sometimes lead to mistakes","never used","very slow"],"a":1,"e":"Usually helpful, but can cause predictable mistakes."},{"q":"What is 'loss aversion'?","o":["loving to win","fearing loss more than valuing an equal gain","forgetting facts","avoiding decisions"],"a":1,"e":"Fearing loss more than valuing the same gain."},{"q":"What must students do before the seminar?","o":["write an essay","read chapter four","take a test","give a talk"],"a":1,"e":"Read chapter four before next week's seminar."}]},{"id":"l2","title":"A Job Interview","script":"So, thank you for coming in. Could you tell me why you applied for this marketing role? Of course. I've followed your company for years, and I really admire your creative campaigns. I felt my experience would be a good fit. Tell me about a challenge you've faced. In my last job, we lost a major client unexpectedly. Rather than panic, I led a small team to win back three smaller clients within a month. That's impressive. And where do you see yourself in five years? Honestly, I'd like to be managing my own team here, helping to develop the kind of campaigns that first attracted me to you. Excellent. We'll be in touch by the end of the week.","level":"Medium","q":[{"q":"What role is the candidate applying for?","o":["accounting","marketing","teaching","engineering"],"a":1,"e":"It is a marketing role."},{"q":"Why did she apply?","o":["for the salary","she admires the company's creative campaigns","it was near her home","a friend told her to"],"a":1,"e":"She admires their creative campaigns and felt it fit."},{"q":"What challenge did she describe?","o":["losing her job","losing a major client and winning back smaller ones","missing a deadline","a computer failure"],"a":1,"e":"Losing a major client, then winning back three smaller ones."},{"q":"Where does she see herself in five years?","o":["in another company","managing her own team there","retired","studying"],"a":1,"e":"Managing her own team at the company."},{"q":"When will she hear back?","o":["tomorrow","by the end of the week","next month","never"],"a":1,"e":"By the end of the week."}]},{"id":"l3","title":"A Discussion on Social Media","script":"Welcome back. Today we're debating whether social media does more harm than good. Sarah, you start. Well, I think the benefits are huge. It keeps families connected across the world and gives a voice to people who would otherwise be ignored. But James, you disagree? I do. I'm not denying the benefits, but we can't ignore the harm. Studies link heavy use to anxiety, especially among teenagers. People compare their real lives to others' perfect online images, and they feel worse. Sarah, a response? I'd say the problem isn't the technology itself, but how we use it. With better education, we could enjoy the good and avoid the worst. That's a fair point. We'll take some calls after this.","level":"Hard","q":[{"q":"What is the debate about?","o":["whether to ban phones","whether social media does more harm than good","how to make money online","which app is best"],"a":1,"e":"Whether social media does more harm than good."},{"q":"What benefit does Sarah mention?","o":["it makes money","it keeps families connected and gives a voice","it is free","it is fast"],"a":1,"e":"It connects families and gives people a voice."},{"q":"What harm does James describe?","o":["it costs too much","a link to anxiety, especially in teenagers","it is too slow","it wastes paper"],"a":1,"e":"Heavy use is linked to anxiety in teenagers."},{"q":"Why do people feel worse, according to James?","o":["they read too much news","they compare their lives to others' perfect images","they lose money","they get tired"],"a":1,"e":"They compare real lives to perfect online images."},{"q":"What is Sarah's final point?","o":["Social media should be banned.","The problem is how we use it, not the technology.","Teenagers should not use phones.","Education does not help."],"a":1,"e":"The problem is how we use it; education could help."}]},{"id":"l4","title":"A Climate News Report","script":"In environmental news, a major report published today warns that global temperatures are rising faster than previously expected. Scientists say that without urgent action, many coastal cities could face serious flooding within decades. However, the report is not entirely negative. It notes that the cost of renewable energy, such as solar and wind power, has fallen dramatically, making clean energy cheaper than coal in much of the world. The authors argue that the technology to solve the crisis already exists; what is missing is political will. A global summit will be held in Leeds next month, where world leaders will be under pressure to agree on stronger targets. Critics, however, fear that promises will once again be broken.","level":"Hard","q":[{"q":"What does the new report warn about?","o":["falling temperatures","temperatures rising faster than expected","less rain","more snow"],"a":1,"e":"Global temperatures are rising faster than expected."},{"q":"What could happen to coastal cities?","o":["nothing","serious flooding within decades","more tourists","colder weather"],"a":1,"e":"They could face serious flooding within decades."},{"q":"What positive point does the report make?","o":["coal is cheaper","renewable energy has become much cheaper","the crisis is over","temperatures are falling"],"a":1,"e":"Renewable energy costs have fallen dramatically."},{"q":"According to the authors, what is missing?","o":["technology","political will","money","scientists"],"a":1,"e":"The technology exists; political will is missing."},{"q":"What do critics fear about the summit?","o":["it will be cancelled","promises will be broken again","it will cost too much","no one will attend"],"a":1,"e":"They fear promises will once again be broken."}]}],"GMORE":{"g1":{"situation":"“If I <b>had studied</b> medicine, I <b>would have become</b> a doctor.” — But I didn’t study medicine, so I’m not a doctor. The third conditional imagines a different past.","timeline":{"art":["  ✕ (didn’t happen)","──────●──────────────► now","  unreal past │ imagined result"],"note":"Both clauses are unreal — the past cannot be changed."},"mistakes":[{"x":"If I would have known, I’d have called.","v":"If I <b>had</b> known, I’d have called. (no “would” after if)"},{"x":"If you’d asked, I would helped.","v":"…I would <b>have</b> helped. (would + have + pp)"}],"examples":["\"If I <b>had known</b>, I <b>would have helped</b>.\"","\"She <b>would have passed</b> if she <b>had revised</b>.\"","\"If we <b>’d left</b> earlier, we <b>could have caught</b> the bus.\"","\"They <b>might have won</b> if they <b>had played</b> better.\"","\"If it <b>hadn’t rained</b>, we <b>would have gone</b> out.\"","\"You <b>wouldn’t have got</b> lost if you <b>’d used</b> a map.\"","\"If he <b>had asked</b>, I <b>would have said</b> yes.\"","\"We <b>would have missed</b> it if you <b>hadn’t called</b>.\""]},"g2":{"compare":{"title":"two time frames meet","a":{"h":"Past cause → present result","ex":["If I <b>had taken</b> the job, I <b>would be</b> rich now."]},"b":{"h":"Present cause → past result","ex":["If I <b>were</b> more careful, I <b>wouldn’t have made</b> that error."]}},"mistakes":[{"x":"If I had studied medicine, I would have been a doctor now.","v":"…I <b>would be</b> a doctor now. (present result → would + base)"},{"x":"If I’d booked, we would have been there now.","v":"…we <b>would be</b> there now."}],"examples":["\"If I <b>had saved</b> money, I <b>would be</b> on holiday now.\"","\"If she <b>were</b> taller, she <b>would have joined</b> the team.\"","\"If we <b>hadn’t moved</b>, we <b>would still live</b> in Leeds.\"","\"If he <b>weren’t</b> so shy, he <b>would have spoken</b> to her.\"","\"If I <b>had learnt</b> to drive, life <b>would be</b> easier now.\"","\"If you <b>liked</b> sport, you <b>would have come</b> with us.\"","\"If I <b>had slept</b> well, I <b>wouldn’t be</b> tired now.\"","\"If they <b>had invested</b> earlier, they <b>would be</b> rich today.\""]},"g3":{"compare":{"title":"wish + the right tense","a":{"h":"present / past situation","ex":["I wish I <b>knew</b>. (now)","I wish I <b>had studied</b>. (past regret)"]},"b":{"h":"wish + would (others)","ex":["I wish you <b>would stop</b> shouting.","I wish it <b>would stop</b> raining."]}},"mistakes":[{"x":"I wish I would be on holiday now.","v":"I wish I <b>were</b> on holiday now. (don’t use wish + would about yourself)"},{"x":"I wish I would have studied harder.","v":"I wish I <b>had studied</b> harder."}],"examples":["\"I <b>wish</b> I <b>knew</b> the answer.\"","\"I <b>wish</b> I <b>hadn’t eaten</b> so much.\"","\"I <b>wish</b> you <b>would listen</b> to me.\"","\"<b>If only</b> I <b>were</b> on holiday now.\"","\"She <b>wishes</b> she <b>had taken</b> the job.\"","\"<b>If only</b> it <b>would stop</b> snowing!\"","\"I <b>wish</b> I <b>could</b> speak Chinese.\"","\"He <b>wishes</b> he <b>hadn’t sold</b> his car.\""]},"g4":{"situation":"“The painting <b>is thought to be</b> a fake.” / “<b>It is said that</b> he is very rich.” — Impersonal passive structures report opinions without naming who says them.","compare":{"title":"two reporting patterns","a":{"h":"It + be + said/believed + that…","ex":["<b>It is said that</b> he is rich.","<b>It was believed that</b> the Earth was flat."]},"b":{"h":"Subject + be + said/thought + to…","ex":["He <b>is said to be</b> rich.","She <b>is thought to have left</b>."]}},"mistakes":[{"x":"It is said that he has leave.","v":"…he has <b>left</b>. (past participle)"},{"x":"He is thought to have stole it.","v":"He is thought to have <b>stolen</b> it."}],"examples":["\"The bridge <b>is being rebuilt</b> at the moment.\"","\"The results <b>had been announced</b> before we arrived.\"","\"<b>It is believed that</b> prices will rise.\"","\"The painting <b>is thought to be</b> a fake.\"","\"He <b>is said to have made</b> a fortune.\"","\"The decision <b>will have been made</b> by Friday.\"","\"<b>It was reported that</b> no one was hurt.\"","\"She <b>is known to have left</b> the country.\""]},"g5":{"compare":{"title":"match the verb to its pattern","a":{"h":"+ to / + object + to","ex":["offered <b>to help</b>","advised me <b>to wait</b>","refused <b>to answer</b>"]},"b":{"h":"+ -ing / prep + -ing","ex":["suggested <b>leaving</b>","admitted <b>breaking</b> it","apologised <b>for being</b> late"]}},"mistakes":[{"x":"She suggested to meet at six.","v":"She suggested <b>meeting</b> at six. (suggest + -ing)"},{"x":"He apologised to be late.","v":"He apologised <b>for being</b> late."}],"examples":["\"She <b>offered to drive</b> me home.\"","\"They <b>warned us not to swim</b> there.\"","\"He <b>admitted breaking</b> the window.\"","\"I <b>apologised for forgetting</b> her birthday.\"","\"The doctor <b>advised him to rest</b>.\"","\"She <b>insisted on paying</b> for dinner.\"","\"He <b>refused to answer</b> the question.\"","\"They <b>congratulated me on passing</b>.\""]},"g6":{"compare":{"title":"guessing about the past","a":{"h":"must have / can’t have (sure)","ex":["It <b>must have rained</b> — the ground’s wet.","He <b>can’t have seen</b> us."]},"b":{"h":"might/could have · should have","ex":["She <b>might have missed</b> the bus.","You <b>should have called</b> me. (regret)"]}},"mistakes":[{"x":"He mustn’t have heard the bell.","v":"He <b>can’t have heard</b> the bell. (negative deduction → can’t have)"},{"x":"You should have call me.","v":"You should have <b>called</b> me."}],"examples":["\"The ground’s wet — it <b>must have rained</b>.\"","\"He <b>can’t have seen</b> us; he didn’t wave.\"","\"She <b>might have missed</b> the bus.\"","\"You <b>should have called</b> a doctor.\"","\"I <b>shouldn’t have said</b> that.\"","\"They <b>could have taken</b> the wrong road.\"","\"Someone <b>must have eaten</b> the cake.\"","\"He <b>can’t have studied</b> — he failed badly.\""]},"g7":{"compare":{"title":"formal vs. informal","a":{"h":"Formal: prep + whom/which","ex":["the man <b>to whom</b> I spoke","the house <b>in which</b> they live"]},"b":{"h":"Informal: prep at the end","ex":["the man I spoke <b>to</b>","the house they live <b>in</b>"]}},"mistakes":[{"x":"The client to that I wrote replied.","v":"…to <b>whom</b> I wrote… (preposition + whom)"},{"x":"I have two cousins, both of who are nurses.","v":"…both of <b>whom</b> are nurses."}],"examples":["\"The colleague <b>with whom</b> I work is brilliant.\"","\"This is the book <b>about which</b> we spoke.\"","\"She has many friends, <b>most of whom</b> live abroad.\"","\"They sell phones, <b>none of which</b> are cheap.\"","\"He’s an artist <b>whose</b> work sells worldwide.\"","\"The reason <b>for which</b> he left is unclear.\"","\"I have three sisters, <b>all of whom</b> are doctors.\"","\"That’s the house <b>in which</b> she was born.\""]},"g8":{"situation":"“I don’t cut my own hair — I <b>have it cut</b>.” — The causative shows that someone does a service for you. The focus is on the result, not who does the work.","compare":{"title":"who does the action?","a":{"h":"I did it myself","ex":["I <b>painted</b> the door.","I <b>repaired</b> my car."]},"b":{"h":"Someone did it for me","ex":["I <b>had the door painted</b>.","I <b>got my car repaired</b>."]}},"mistakes":[{"x":"I had repaired my bike at the shop.","v":"I <b>had my bike repaired</b>. (have + object + past participle)"},{"x":"I’ll have fix the roof.","v":"I’ll have the roof <b>fixed</b>."}],"examples":["\"I <b>had my hair cut</b> yesterday.\"","\"We<b>’re getting the kitchen redecorated</b>.\"","\"He <b>had his tooth taken out</b>.\"","\"She <b>got her photo taken</b>.\"","\"They <b>had their car broken into</b>.\"","\"I need to <b>have my passport renewed</b>.\"","\"You should <b>get that checked</b> by a doctor.\"","\"We <b>had the house painted</b> last summer.\""]},"g9":{"compare":{"title":"meaning changes","a":{"h":"+ to (the action comes after)","ex":["remember <b>to lock</b> (a duty)","stop <b>to rest</b> (pause in order to)","try <b>to open</b> (attempt)"]},"b":{"h":"+ -ing (the action comes before)","ex":["remember <b>locking</b> (a memory)","stop <b>smoking</b> (quit)","try <b>adding</b> salt (experiment)"]}},"mistakes":[{"x":"I regret to tell him the truth; now he’s angry.","v":"I regret <b>telling</b> him… (regret + -ing = sorry about the past)"},{"x":"On the walk we stopped taking photos. (meaning: paused to take)","v":"…we stopped <b>to take</b> photos. (pause in order to)"}],"examples":["\"Please remember <b>to post</b> the letter. (duty)\"","\"I’ll never forget <b>meeting</b> her. (memory)\"","\"He stopped <b>smoking</b> last year. (quit)\"","\"He stopped <b>to rest</b> for a minute. (paused)\"","\"Try <b>turning</b> it off and on. (experiment)\"","\"I tried <b>to open</b> the jar. (attempt)\"","\"I regret <b>to inform</b> you the news is bad.\"","\"Studying abroad means <b>leaving</b> home.\""]},"g10":{"compare":{"title":"at vs. before a future point","a":{"h":"Future continuous (in progress)","ex":["At 8pm I <b>’ll be having</b> dinner.","This time tomorrow I<b>’ll be flying</b>."]},"b":{"h":"Future perfect (completed by)","ex":["By Friday I<b>’ll have finished</b>.","By 2030 they<b>’ll have built</b> it."]}},"timeline":{"art":["  ▓▓▓▓ (in progress)   ✓ (done by)","────●─────────●──────► now → future","  will be -ing   will have + pp"],"note":"Continuous = happening AT a future moment · Perfect = finished BEFORE it."},"mistakes":[{"x":"By next month I will finish the course.","v":"By next month I <b>will have finished</b>… (completed before → future perfect)"},{"x":"Don’t call at six — I will drive.","v":"…I<b>’ll be driving</b>. (in progress → future continuous)"}],"examples":["\"At 8pm I <b>’ll be having</b> dinner.\"","\"By Friday we <b>’ll have finished</b> the report.\"","\"This time next week she <b>’ll be lying</b> on a beach.\"","\"By the time he’s 30, he <b>’ll have travelled</b> the world.\"","\"In May I <b>’ll have been studying</b> here for three years.\"","\"Don’t call at six — I <b>’ll be driving</b>.\"","\"They <b>’ll have left</b> by the time we arrive.\"","\"This time tomorrow we <b>’ll be flying</b> to Rome.\""]},"g11":{"situation":"“She <b>had been waiting</b> for an hour when the bus finally came.” — The past perfect continuous shows how long an activity had gone on up to a past moment.","timeline":{"art":["  ▓▓▓▓▓▓▓▓✕","  had been waiting │ bus came","──────────────────────► now"],"note":"A long activity continuing up to a point in the past."},"mistakes":[{"x":"I had been knowing him for years before he left.","v":"I <b>had known</b> him for years… (state verb → simple)"},{"x":"They had been lived there for years.","v":"They had been <b>living</b> there for years."}],"examples":["\"He was tired because he <b>had been working</b> all night.\"","\"We <b>had been driving</b> for hours when the car broke down.\"","\"She <b>had been studying</b> French before she moved to Paris.\"","\"The ground was wet; it <b>had been raining</b>.\"","\"They <b>had been arguing</b> before we arrived.\"","\"I <b>had been waiting</b> for ages when she called.\"","\"His eyes were red because he <b>had been crying</b>.\"","\"By noon they <b>had been walking</b> for six hours.\""]},"g12":{"situation":"“<b>Never have I</b> seen such a mess.” — In formal or emphatic English, a negative word at the start pushes the auxiliary in front of the subject, like a question.","mistakes":[{"x":"Never I have eaten such good food.","v":"<b>Never have I</b> eaten such good food. (invert: aux + subject)"},{"x":"Not only she sings, but she dances.","v":"<b>Not only does she</b> sing, but she also dances."},{"x":"No sooner he had left when it rained.","v":"<b>No sooner had he</b> left <b>than</b> it rained."}],"examples":["\"<b>Never have I</b> been so embarrassed.\"","\"<b>Rarely do we</b> see such talent.\"","\"<b>Hardly had I</b> sat down when the phone rang.\"","\"<b>No sooner had they</b> left than it snowed.\"","\"<b>Not only is she</b> clever, but she’s kind too.\"","\"<b>Only after</b> the test <b>did he</b> relax.\"","\"<b>Little did he</b> know what was coming.\"","\"<b>Not until</b> midnight <b>did they</b> finish.\""]},"g13":{"compare":{"title":"two ways to add focus","a":{"h":"It-cleft (a person/thing/time)","ex":["<b>It was</b> Tom <b>who</b> broke it.","<b>It was</b> in 2010 <b>that</b> we met."]},"b":{"h":"What-cleft (the whole idea)","ex":["<b>What I need is</b> a holiday.","<b>What he did was</b> (to) call the police."]}},"mistakes":[{"x":"What I want are answers.","v":"What I want <b>is</b> answers. (“what” as subject → singular verb)"},{"x":"It was John which sent the email.","v":"It was John <b>who</b> sent the email."}],"examples":["\"<b>It was</b> my sister <b>who</b> called, not me.\"","\"<b>It’s</b> your help <b>that</b> I need.\"","\"<b>What</b> surprised me <b>was</b> his honesty.\"","\"<b>What we did was</b> book another flight.\"","\"<b>The reason</b> I left <b>was</b> the noise.\"","\"<b>All</b> she wanted <b>was</b> the truth.\"","\"<b>It was</b> in 2010 <b>that</b> we first met.\"","\"<b>The place where</b> we stayed was lovely.\""]},"g14":{"compare":{"title":"what follows the linker?","a":{"h":"+ clause (subject + verb)","ex":["<b>Although</b> it was late, we worked.","<b>Even though</b> she tried, she failed."]},"b":{"h":"+ noun / -ing","ex":["<b>Despite</b> the rain, we went out.","<b>In spite of</b> being tired, he worked."]}},"mistakes":[{"x":"Despite it was cold, we swam.","v":"<b>Although</b> it was cold… / <b>Despite the cold</b>… (despite + noun, not a clause)"},{"x":"Although it was hard but he tried.","v":"<b>Although</b> it was hard, he tried. (no “but” with although)"}],"examples":["\"<b>Although</b> he was rich, he wasn’t happy.\"","\"<b>Despite</b> the traffic, we arrived on time.\"","\"<b>In spite of</b> feeling ill, she came.\"","\"The plan was risky. <b>Nevertheless</b>, it worked.\"","\"I love cities, <b>whereas</b> my brother prefers the countryside.\"","\"<b>Even though</b> it costs more, it’s worth it.\"","\"It was expensive. <b>However</b>, we bought it.\"","\"<b>Despite the fact that</b> it rained, the match went ahead.\""]},"g15":{"compare":{"title":"specific vs. general","a":{"h":"the (made specific by context)","ex":["<b>The</b> book <b>you lent me</b> was great.","He’s <b>the</b> first to arrive."]},"b":{"h":"zero (general) · the + adj (groups)","ex":["<b>Knowledge</b> is power.","The government helps <b>the poor</b>."]}},"mistakes":[{"x":"I’m interested in the nature.","v":"…in <b>nature</b>. (general uncountable → no article)"},{"x":"He gave me an useful advice.","v":"He gave me <b>useful advice</b>. (advice is uncountable)"}],"examples":["\"<b>The</b> information <b>you gave me</b> was helpful.\"","\"<b>Knowledge</b> is power. (general)\"","\"She wants to help <b>the poor</b>.\"","\"<b>Most of the</b> guests had left.\"","\"He’s <b>the</b> first <b>to</b> arrive.\"","\"I don’t drink <b>coffee</b>. (general)\"","\"<b>The</b> rich should pay more tax.\"","\"She gave me some <b>useful advice</b>. (uncountable)\""]}}}};

/* ================= store & state ================= */
const store={
  get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
};
const DEF={lang:"uz",theme:"light",level:null,onboarded:false,xp:0,streak:0,lastDay:"",days:{},done:{},srs:{},goal:30};
let S=Object.assign({},DEF,store.get("oneeng",{}));
function save(){store.set("oneeng",S)}
function t(k){return (I18N[S.lang]&&I18N[S.lang][k])||I18N.uz[k]||k}
function todayStr(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function yesterdayStr(){const d=new Date(Date.now()-864e5);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function addXP(n){
  const td=todayStr();
  if(S.lastDay!==td){S.streak=(S.lastDay===yesterdayStr())?S.streak+1:1;S.lastDay=td}
  const before=S.days[td]||0;
  S.days[td]=before+n;S.xp+=n;save();
  if(before<S.goal&&S.days[td]>=S.goal)toast(t("daily_done"));
  const ks=Object.keys(S.days);if(ks.length>90){ks.sort();ks.slice(0,ks.length-90).forEach(k=>delete S.days[k])}
}
/* ================= helpers ================= */
const $=s=>document.querySelector(s);
const $$=s=>document.querySelectorAll(s);
function el(tag,cls,html){const e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function stripHTML(s){const d=document.createElement("div");d.innerHTML=s;return d.textContent||""}
function shuffled(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
let toastTimer=null;
function toast(msg){const e=$("#toast");e.textContent=msg;e.classList.add("show");clearTimeout(toastTimer);toastTimer=setTimeout(()=>e.classList.remove("show"),2600)}
/* ================= TTS ================= */
let voiceEn=null;
function pickVoice(){
  try{
    const vs=speechSynthesis.getVoices();
    voiceEn=vs.find(v=>/en[-_](GB|US)/i.test(v.lang)&&/female|Google|Samantha|Karen|Daniel/i.test(v.name))
          ||vs.find(v=>/^en/i.test(v.lang))||null;
  }catch(e){}
}
if("speechSynthesis" in window){pickVoice();speechSynthesis.onvoiceschanged=pickVoice}
function speak(text,rate){
  if(!("speechSynthesis" in window))return;
  try{
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(stripHTML(text));
    u.lang="en-US";if(voiceEn)u.voice=voiceEn;u.rate=rate||0.95;
    speechSynthesis.speak(u);
  }catch(e){}
}
function stopSpeak(){try{speechSynthesis.cancel()}catch(e){}}
/* ================= views ================= */
const VIEWS=["onboard","place","home","levels","level","lesson","srs","speak","settings"];
let current="home";
function show(v){
  stopSpeak();
  VIEWS.forEach(x=>$("#v-"+x).classList.toggle("hidden",x!==v));
  current=v;
  $$(".nav button").forEach(b=>b.classList.toggle("active",b.dataset.v===v));
  $("#mainNav").classList.toggle("hidden",v==="onboard"||v==="place");
  window.scrollTo(0,0);
  updateSrsBadge();
}
$$(".nav button").forEach(b=>b.onclick=()=>{route(b.dataset.v)});
function route(v){
  if(v==="home")renderHome();
  else if(v==="levels")renderLevels();
  else if(v==="srs")renderSrs();
  else if(v==="speak")renderSpeak();
  else if(v==="settings")renderSettings();
  show(v);
}
function applyLangTexts(){
  $$("[data-t]").forEach(e=>e.textContent=t(e.dataset.t));
  $("#brandSub").textContent=S.lang==="ru"?"Английский · по-русски и по-узбекски":S.lang==="en"?"English · explained in your language":"Ingliz tili · o'zbekcha";
  document.documentElement.lang=S.lang;
}
/* ================= level data helpers ================= */
const LEVELS=["A1","A2","B1","B2"];
const TYPES=[["GRAMMAR","grammar","📘"],["VOCAB","vocab","🃏"],["READING","reading","📖"],["LISTENING","listening","🎧"]];
function lKey(lvl,type,id){return lvl+"|"+type+"|"+id}
function levelLessons(lvl){let n=0;TYPES.forEach(([T])=>n+=ENG[lvl][T].length);return n}
function levelDone(lvl){let n=0;TYPES.forEach(([T])=>ENG[lvl][T].forEach(l=>{if(S.done[lKey(lvl,T,l.id)])n++}));return n}
function nextLesson(lvl){
  for(const [T] of TYPES)for(const l of ENG[lvl][T])if(!S.done[lKey(lvl,T,l.id)])return {lvl,type:T,lesson:l};
  return null;
}
function trFor(lvl,id){const tr=ENG[lvl].TR;return (tr&&tr[id])||null}
function trText(obj){if(!obj)return "";return obj[S.lang==="ru"?"ru":"uz"]||""}
/* ================= onboarding ================= */
function renderOnboard(step){
  const host=$("#v-onboard");host.innerHTML="";
  if(step==="lang"){
    host.appendChild(el("div","hero",`<h1>🇬🇧 One English</h1><p>${esc(t("onb_lang"))}</p>`));
    const lp=el("div","lang-pick");
    [["uz","🇺🇿","O'zbekcha"],["ru","🇷🇺","Русский"],["en","🇬🇧","English"]].forEach(([code,flag,name])=>{
      const b=el("button",null,`<span>${flag}</span> ${name}`);
      b.onclick=()=>{S.lang=code;save();applyLangTexts();renderOnboard("intro")};
      lp.appendChild(b);
    });
    host.appendChild(lp);
  }else{
    host.appendChild(el("div","hero",`<h1>${esc(t("onb_title"))}</h1><p>${esc(t("onb_sub"))}</p>`));
    const c=el("div","card pad");
    const b1=el("button","btn orange block",esc(t("onb_place")));
    b1.onclick=()=>{startPlacement()};
    const sp=el("div",null,"");sp.style.height="10px";
    const b2=el("button","btn sec block",esc(t("onb_skip")));
    b2.onclick=()=>{renderOnboard("pick")};
    c.appendChild(b1);c.appendChild(sp);c.appendChild(b2);
    host.appendChild(c);
    if(step==="pick"){
      const pk=el("div","eyebrow",esc(t("pick_level")));host.appendChild(pk);
      const card=el("div","card");
      const names={A1:"Beginner",A2:"Elementary",B1:"Intermediate",B2:"Upper-Intermediate"};
      LEVELS.forEach(lvl=>{
        const r=el("button","row",`<div class="ring"><i>${lvl}</i></div><div class="meta"><b>${lvl} — ${names[lvl]}</b><span>${levelLessons(lvl)} ${esc(t("lessons"))}</span></div><span class="chev">›</span>`);
        r.onclick=()=>{S.level=lvl;S.onboarded=true;save();route("home")};
        card.appendChild(r);
      });
      host.appendChild(card);
    }
  }
  show("onboard");
}
/* ================= placement ================= */
let pl=null;
function startPlacement(){pl={idx:0,correct:{},order:PLACEMENT.slice()};renderPlaceQ();show("place")}
function renderPlaceQ(){
  const host=$("#v-place");host.innerHTML="";
  if(pl.idx>=pl.order.length){return renderPlaceResult()}
  const q=pl.order[pl.idx];
  host.appendChild(el("div","backbar",`<div class="pl-progress">${esc(t("place_title"))} · ${pl.idx+1} ${esc(t("q_of"))} ${pl.order.length}</div>`));
  const bar=el("div","pbar","<i></i>");host.appendChild(bar);
  requestAnimationFrame(()=>bar.querySelector("i").style.width=(pl.idx/pl.order.length*100)+"%");
  const card=el("div","card pad");
  card.appendChild(el("div","qtext",esc(q.q)));
  q.o.forEach((o,i)=>{
    const b=el("button","opt",`<span class="k">${"ABCD"[i]}</span> ${esc(o)}`);
    b.onclick=()=>{
      if(i===q.a){pl.correct[q.b]=(pl.correct[q.b]||0)+1}
      pl.idx++;renderPlaceQ();
    };
    card.appendChild(b);
  });
  host.appendChild(card);
}
function renderPlaceResult(){
  const host=$("#v-place");host.innerHTML="";
  const c=pl.correct;
  const score=Object.values(c).reduce((a,b)=>a+b,0);
  let lvl="A1";
  if((c.A1||0)+(c.A2||0)>=6)lvl="A2";
  if(lvl==="A2"&&(c.B1||0)>=3)lvl="B1";
  if(lvl==="B1"&&(c.B2||0)+(c.C1||0)>=4)lvl="B2";
  host.appendChild(el("div","hero center",`<p style="margin-bottom:4px">${esc(t("place_done"))}</p>`));
  const card=el("div","card pad center");
  card.appendChild(el("div","result-lvl",lvl));
  card.appendChild(el("p","lead center",score+" / "+pl.order.length));
  const b=el("button","btn block",esc(t("place_start_lvl")));
  b.onclick=()=>{S.level=lvl;S.onboarded=true;save();route("home")};
  card.appendChild(b);
  const sp=el("div");sp.style.height="10px";card.appendChild(sp);
  const rb=el("button","btn sec block",esc(t("place_retake")));
  rb.onclick=()=>startPlacement();
  card.appendChild(rb);
  host.appendChild(card);
}

function renderLevels(){
  const host=$("#v-levels");host.innerHTML="";

let fc=null;
function startFlashcards(lvl,l){
  fc={lvl,l,order:shuffled(l.words),idx:0,added:0};
  renderFlashcard();
}
function renderFlashcard(){
  const host=$("#v-lesson");host.innerHTML="";
  const back=el("div","backbar");
  const bb=el("button","backbtn","‹ "+esc(fc.l.title));
  bb.onclick=()=>openLesson(fc.lvl,"VOCAB",fc.l);
  back.appendChild(bb);host.appendChild(back);
  if(fc.idx>=fc.order.length){
    // flashcards done -> generate MCQ quiz from words
    const words=fc.l.words;
    const qs=shuffled(words).slice(0,Math.min(10,words.length)).map(w=>{
      const trg=x=>S.lang==="ru"?x.ru:x.uz;
      const wrong=shuffled(words.filter(x=>x.w!==w.w)).slice(0,3).map(trg);
      const opts=shuffled([trg(w)].concat(wrong));
      return {q:"“"+w.w+"” — ?",o:opts,a:opts.indexOf(trg(w)),e:w.w+" = "+trg(w)+" · "+w.ex};
    });
    startQuiz(fc.lvl,"VOCAB",Object.assign({},fc.l,{q:qs}));
    return;
  }
  const bar=el("div","pbar","<i></i>");host.appendChild(bar);
  requestAnimationFrame(()=>bar.querySelector("i").style.width=(fc.idx/fc.order.length*100)+"%");
  const w=fc.order[fc.idx];
  const card=el("div","card fcard");
  card.appendChild(el("div","big",esc(w.w)));
  card.appendChild(el("div","ipa",esc(w.ipa||"")));
  const sb=el("button","btn sec","🔊");sb.onclick=()=>speak(w.w+". "+w.ex);
  card.appendChild(sb);
  const ansWrap=el("div",null,"");
  const showB=el("button","btn block",esc(t("fc_show")));
  showB.onclick=()=>{
    ansWrap.innerHTML="";
    ansWrap.appendChild(el("div","ans",esc(S.lang==="ru"?w.ru:w.uz)));
    ansWrap.appendChild(el("div","ex",esc(w.ex)));
    const fb=el("div","fbtns");
    const good=el("button","btn",esc(t("fc_know")));
    const bad=el("button","btn sec",esc(t("fc_dontknow")));
    good.onclick=()=>{srsAdd(fc.lvl,fc.l.id,w,2);fc.added++;fc.idx++;addXP(1);renderFlashcard()};
    bad.onclick=()=>{srsAdd(fc.lvl,fc.l.id,w,0);fc.added++;fc.idx++;renderFlashcard()};
    fb.appendChild(good);fb.appendChild(bad);
    ansWrap.appendChild(fb);
    showB.classList.add("hidden");
  };
  card.appendChild(ansWrap);
  card.appendChild(showB);
  host.appendChild(card);
  show("lesson");
}

let qz=null;
function startQuiz(lvl,type,l){
  qz={lvl,type,l,idx:0,correct:0,order:l.q.slice()};
  renderQuizQ();
}
function renderQuizQ(){
  const host=$("#v-lesson");host.innerHTML="";
  const back=el("div","backbar");
  const bb=el("button","backbtn","‹ "+esc(qz.l.title));
  bb.onclick=()=>openLesson(qz.lvl,qz.type,ENG[qz.lvl][qz.type].find(x=>x.id===qz.l.id)||qz.l);
  back.appendChild(bb);host.appendChild(back);
  if(qz.idx>=qz.order.length)return renderQuizResult(host);
  const bar=el("div","pbar","<i></i>");host.appendChild(bar);
  requestAnimationFrame(()=>bar.querySelector("i").style.width=(qz.idx/qz.order.length*100)+"%");
  host.appendChild(el("div","pl-progress",(qz.idx+1)+" "+t("q_of")+" "+qz.order.length));
  const q=qz.order[qz.idx];
  const card=el("div","card pad");
  card.appendChild(el("div","qtext",q.q));
  const tr=qz.type==="GRAMMAR"?trFor(qz.lvl,qz.l.id):null;
  let answered=false;
  q.o.forEach((o,i)=>{
    const b=el("button","opt",`<span class="k">${"ABCD"[i]}</span> <span>${esc(o)}</span>`);
    b.onclick=()=>{
      if(answered)return;answered=true;
      const ok=i===q.a;
      if(ok){qz.correct++;addXP(2)}
      card.querySelectorAll(".opt").forEach((x,xi)=>{
        if(xi===q.a)x.classList.add("correct");
        else if(xi===i)x.classList.add("wrong");
      });
      let ex=(ok?"✅ "+t("correct"):"❌ "+t("wrong"))+(q.e?" — "+q.e:"");
      const exd=el("div","expl "+(ok?"ok":"no"),ex);
      const trE=tr&&tr.q&&tr.q[qz.l.q.indexOf(q)];
      if(trE){const txt=trText(trE);if(txt)exd.appendChild(el("span","tr2","🌐 "+esc(txt)))}
      card.appendChild(exd);
      const nb=el("button","btn block",esc(qz.idx+1>=qz.order.length?t("finish"):t("next")));
      nb.onclick=()=>{qz.idx++;renderQuizQ()};
      card.appendChild(nb);
      window.scrollTo({top:document.body.scrollHeight,behavior:"smooth"});
    };
    card.appendChild(b);
  });
  host.appendChild(card);
  show("lesson");
}
function renderQuizResult(host){
  const total=qz.order.length,score=qz.correct;

  save();
  const card=el("div","card pad center");
  card.appendChild(el("div","result-lvl",score+"/"+total));
  card.appendChild(el("p","lead center",esc(t("quiz_done"))+" +XP"));

/* ================= SRS ================= */
const SRS_DAYS=[1,2,4,8,20,60];
function srsAdd(lvl,lessonId,w,box){
  const k=wordKey(lvl,lessonId,w.w);
  if(!S.srs[k])S.srs[k]={box:box||0,due:Date.now()+(box?SRS_DAYS[box]:1)*864e5,lvl,lid:lessonId,w:w.w};
  save();updateSrsBadge();
}
function srsWordObj(entry){
  const lessons=ENG[entry.lvl]&&ENG[entry.lvl].VOCAB;
  if(!lessons)return null;
  const l=lessons.find(x=>x.id===entry.lid);
  return l?l.words.find(x=>x.w===entry.w):null;
}
function dueWords(){
  const now=Date.now(),out=[];
  for(const k in S.srs){if(S.srs[k].due<=now){const w=srsWordObj(S.srs[k]);if(w)out.push({key:k,entry:S.srs[k],w})}}
  return out;
}
function updateSrsBadge(){
  const n=dueWords().length;
  let d=$("#navSrs .dot");
  if(n){if(!d){d=el("span","dot","");$("#navSrs").appendChild(d)}d.textContent=n>99?"99+":n}
  else if(d)d.remove();
}
let sq=null;

    host.appendChild(el("div","card pad center",Object.keys(S.srs).length? "🎉 "+esc(t("srs_done")):esc(t("srs_empty"))));

let sp=null;
function speakPool(){
  const pool=[];
  const lvl=S.level||"A1";
  (ENG[lvl].GRAMMAR||[]).forEach(l=>(l.examples||[]).forEach(x=>{const s=stripHTML(x).replace(/\(.*?\)/g,"").trim();if(s.length>8&&s.length<90)pool.push(s)}));
  (ENG[lvl].VOCAB||[]).forEach(l=>l.words.forEach(w=>{if(w.ex&&w.ex.length>8&&w.ex.length<90)pool.push(w.ex)}));
  return pool;
}
function renderSpeak(){
  const host=$("#v-speak");host.innerHTML="";
  host.appendChild(el("div","hero",`<h1>${esc(t("speak_title"))} 🎤</h1><p>${esc(t("speak_sub"))}</p>`));
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  const pool=speakPool();
  sp={sentence:pool[Math.floor(Math.random()*pool.length)]||"Hello! How are you today?",rec:null};
  const card=el("div","card pad");
  card.appendChild(el("div","saytext",esc(sp.sentence)));
  const lb=el("button","btn sec block",esc(t("speak_listen")));
  lb.onclick=()=>speak(sp.sentence,0.9);
  card.appendChild(lb);
  const mic=el("button","mic","🎤");
  const status=el("p","lead center",esc(t("speak_tap")));
  const heard=el("div","heard");
  const scoreEl=el("div","score-big");
  card.appendChild(mic);card.appendChild(status);card.appendChild(heard);card.appendChild(scoreEl);
  if(!SR){status.textContent=t("speak_unsupported");mic.disabled=true;mic.style.opacity=".4"}
  else{
    mic.onclick=()=>{
      heard.innerHTML="";scoreEl.textContent="";
      const r=new SR();sp.rec=r;
      r.lang="en-US";r.interimResults=false;r.maxAlternatives=1;
      mic.classList.add("rec");status.textContent=t("speak_recording");
      r.onresult=e=>{
        const said=e.results[0][0].transcript;
        const norm=s=>s.toLowerCase().replace(/[^a-z' ]/g," ").split(/\s+/).filter(Boolean);
        const target=norm(sp.sentence),got=norm(said);
        const gotSet=new Set(got);
        let hit=0;
        const html=target.map(wd=>{const ok=gotSet.has(wd);if(ok)hit++;return `<span class="${ok?"hit":"miss"}">${esc(wd)}</span>`}).join(" ");
        const pct=Math.round(hit/target.length*100);
        heard.innerHTML=`<div style="margin-bottom:6px;color:var(--muted)">${esc(t("speak_heard"))} “${esc(said)}”</div>${html}`;
        scoreEl.textContent=pct+"%";
        scoreEl.style.color=pct>=80?"var(--good)":pct>=50?"var(--orange)":"var(--bad)";
        status.textContent=pct>=80?t("speak_great"):pct>=50?t("speak_good"):t("speak_try");
        if(pct>=80)addXP(3);
      };
      r.onerror=()=>{status.textContent=t("speak_try")};
      r.onend=()=>{mic.classList.remove("rec");if(!heard.innerHTML)status.textContent=t("speak_tap")};
      try{r.start()}catch(e){mic.classList.remove("rec")}
    };
  }
  const nb=el("button","btn orange block",esc(t("speak_next")));
  nb.style.marginTop="14px";
  nb.onclick=()=>renderSpeak();
  card.appendChild(nb);
  host.appendChild(card);
}

  // placement
  const pl2=el("button","row",`<div class="meta"><b>${esc(t("s_place"))}</b></div><span class="chev">›</span>`);
  pl2.onclick=()=>startPlacement();
  card.appendChild(pl2);
  // reset
  const rs=el("button","row",`<div class="meta"><b style="color:var(--bad)">${esc(t("s_reset"))}</b></div>`);
  rs.onclick=()=>{if(confirm(t("s_reset_confirm"))){localStorage.removeItem("oneeng");location.reload()}};
  card.appendChild(rs);
  host.appendChild(card);
  host.appendChild(el("div","notice",esc(t("s_about"))));
}
/* ================= theme & init ================= */
function applyTheme(){document.documentElement.setAttribute("data-theme",S.theme)}
$("#themeBtn").onclick=()=>{S.theme=S.theme==="dark"?"light":"dark";save();applyTheme()};
applyTheme();applyLangTexts();
if(!S.onboarded||!S.level)renderOnboard("lang");
else route("home");
</script>
</body>
</html>
