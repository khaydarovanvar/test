:1,"d":"easy","e":"see → saw → seen."},{"q":"We ___ this film before.","o":["have saw","has seen","have seen","saw have"],"a":2,"d":"easy","e":"have + past participle: have seen."},{"q":"They ___ just arrived.","o":["has","have","are","did"],"a":1,"d":"easy","e":"With ‘they’: have just arrived."},{"q":"Have you ___ been to Spain?","o":["never","ever","yet","already"],"a":1,"d":"med","e":"In questions about experience we use ‘ever’."},{"q":"I've ___ eaten octopus. (not in my life)","o":["ever","yet","never","just"],"a":2,"d":"med","e":"Negative experience: never."},{"q":"Has she finished ___?","o":["already","yet","just","since"],"a":1,"d":"med","e":"In questions, ‘yet’ goes at the end."},{"q":"We've lived here ___ 2015.","o":["for","since","from","during"],"a":1,"d":"med","e":"A point in time → since 2015."},{"q":"I've known him ___ ten years.","o":["since","for","from","ago"],"a":1,"d":"med","e":"A period of time → for ten years."},{"q":"Find the mistake: 'I have seen her yesterday.'","o":["have seen → saw","seen → seeing","her → she","no mistake"],"a":0,"d":"hard","e":"With ‘yesterday’ (finished time) use past simple: I saw her yesterday."},{"q":"Complete: 'She ___ already ___ the email.'","o":["has / sended","have / sent","has / sent","has / send"],"a":2,"d":"hard","e":"has + past participle (send → sent)."},{"q":"Which is correct?","o":["Have you finished already yet?","Have you finished yet?","Did you finished yet?","Have you yet finished?"],"a":1,"d":"hard","e":"‘yet’ goes at the end of the question."},{"q":"Complete: 'I ___ this book ___ three days, but I haven't finished it.'","o":["have read / since","have had / for","had / for","have read / for"],"a":1,"d":"hard","e":"‘for three days’ + present perfect ‘have had’."},{"q":"The past participle of 'go' (experience: visit and return) is ___.","o":["gone","been","went","going"],"a":1,"d":"hard","e":"For an experience there and back we use ‘been’: I have been to Rome."}]},{"id":"g4","title":"Future: will & going to","lead":"English has several ways to talk about the future. The two most common at A2 are ‘will’ and ‘be going to’. Each fits different situations — predictions, decisions, plans and intentions.","blocks":[{"h":"will — decisions & predictions","p":["Use <b>will</b> + base verb for instant decisions, offers, promises and general predictions. Short form: ’ll; negative: won’t."],"ex":["I<b>’ll</b> help you. · It <b>will</b> rain tomorrow. · I <b>won’t</b> be late."]},{"h":"be going to — plans & intentions","p":["Use <b>be going to</b> + base verb for plans you have already decided and for predictions based on what you can see now."],"ex":["We<b>’re going to</b> visit Rome. · Look at the sky — it<b>’s going to</b> rain."]},{"h":"will vs going to","p":["A decision made <b>now</b> = will; a plan decided <b>before</b> = going to."],"ex":["(phone rings) I<b>’ll</b> get it! · I<b>’m going to</b> study tonight. (already planned)"]},{"h":"Present continuous for arrangements","p":["For fixed arrangements with a time, the present continuous is also common."],"ex":["I<b>’m meeting</b> Sara at six. · We<b>’re flying</b> on Monday."]}],"tip":"For a decision you make <b>while speaking</b>, use <b>will</b>: ‘I’ll have the chicken, please.’ For something you <b>already planned</b>, use <b>going to</b>: ‘I’m going to start a new job.’","examples":["\"I think it <b>will</b> be sunny tomorrow.\"","\"Don’t worry, I <b>’ll</b> carry that bag for you.\"","\"We <b>’re going to</b> buy a new car next month.\"","\"Look out — you <b>’re going to</b> drop it!\"","\"She <b>won’t</b> come to the meeting.\"","\"I <b>’m meeting</b> the doctor at 3 pm.\""],"q":[{"q":"I think it ___ rain tomorrow.","o":["will","is going","won't","shall"],"a":0,"d":"easy","e":"A prediction → will rain."},{"q":"We ___ visit our grandparents next week. (a plan)","o":["will","are going to","won't","go"],"a":1,"d":"easy","e":"A decided plan → are going to visit."},{"q":"The negative of 'will' is ___.","o":["willn't","won't","don't will","not will"],"a":1,"d":"easy","e":"will not = won’t."},{"q":"(The phone rings.) I ___ answer it!","o":["am going to","will","won't","going"],"a":1,"d":"easy","e":"An instant decision → I’ll answer it."},{"q":"Look at those clouds! It ___ rain.","o":["will","won't","is going to","goes to"],"a":2,"d":"easy","e":"Prediction from evidence → is going to rain."},{"q":"She ___ be twelve next month.","o":["is going","will","won't","does"],"a":1,"d":"med","e":"A future fact → will be."},{"q":"They ___ move to a new house. (already decided)","o":["will","are going to","won't","go"],"a":1,"d":"med","e":"A plan → are going to move."},{"q":"I promise I ___ tell anyone.","o":["will","am going to","won't","don't"],"a":2,"d":"med","e":"A promise (negative) → won’t tell."},{"q":"What ___ you ___ do at the weekend? (plans)","o":["will / going","are / going to","do / going","are / will"],"a":1,"d":"med","e":"Asking about plans → are you going to do?"},{"q":"Choose the instant decision.","o":["I'm going to help you.","I'll help you.","I help you.","I helping you."],"a":1,"d":"med","e":"Deciding now → I’ll help you."},{"q":"Find the mistake: 'I will to call you later.'","o":["will → am going","to call → call","later → late","no mistake"],"a":1,"d":"hard","e":"After ‘will’ use the base verb: I will call you."},{"q":"Complete: 'A: I'm cold. B: I ___ close the window.'","o":["am going to","will","won't","going to"],"a":1,"d":"hard","e":"Reacting now (offer) → I’ll close the window."},{"q":"Which shows a fixed arrangement?","o":["I'll meet Sara at six.","I meet Sara at six.","I'm meeting Sara at six.","I going to meet Sara."],"a":2,"d":"hard","e":"Arrangement with a time → present continuous."},{"q":"Complete: 'We ___ (plan) start a business, and we hope it ___ (prediction) succeed.'","o":["will / are going to","are going to / will","are going to / are going to","will / will"],"a":1,"d":"hard","e":"Plan → going to start; prediction → will succeed."},{"q":"Choose the correct prediction from evidence.","o":["She will have a baby — look!","She's going to have a baby — look!","She have a baby soon.","She will to have a baby."],"a":1,"d":"hard","e":"Evidence-based prediction → is going to have."}]},{"id":"g5","title":"Comparatives & superlatives","lead":"We use comparatives to compare two things and superlatives to compare one thing with all the others in a group. The form depends on the length of the adjective.","blocks":[{"h":"Short adjectives","p":["One-syllable adjectives: add <b>-er</b> (comparative) and <b>-est</b> (superlative). Double a final consonant after a short vowel; -y becomes -ier/-iest."],"ex":["tall → tall<b>er</b> → the tall<b>est</b> · big → big<b>ger</b> · happy → happ<b>ier</b>"]},{"h":"Long adjectives","p":["Two or more syllables: use <b>more</b> (comparative) and <b>the most</b> (superlative)."],"ex":["expensive → <b>more</b> expensive → the <b>most</b> expensive"]},{"h":"than & the","p":["Use <b>than</b> after a comparative, and <b>the</b> before a superlative."],"ex":["She is tall<b>er than</b> me. · It’s <b>the</b> bigg<b>est</b> city in the country."]},{"h":"Irregular forms","p":["A few adjectives are irregular."],"ex":["good → <b>better</b> → the <b>best</b> · bad → <b>worse</b> → the <b>worst</b> · far → <b>further</b>"]}],"tip":"Don’t mix the two forms: ‘more taller’ and ‘most biggest’ are wrong. Use <b>either</b> -er/-est <b>or</b> more/most, never both.","examples":["\"Today is <b>hotter than</b> yesterday.\"","\"This is <b>the cheapest</b> phone in the shop.\"","\"Maths is <b>more difficult than</b> art for me.\"","\"She is <b>the most intelligent</b> student in the class.\"","\"My new car is <b>better than</b> my old one.\"","\"It was <b>the worst</b> film I’ve ever seen.\""],"q":[{"q":"This box is ___ than that one.","o":["heavy","heavier","heaviest","more heavy"],"a":1,"d":"easy","e":"Short adjective + -er: heavier."},{"q":"He is the ___ boy in the class.","o":["taller","tall","tallest","most tall"],"a":2,"d":"easy","e":"Superlative of a short adjective: the tallest."},{"q":"A car is ___ than a bicycle.","o":["fast","faster","fastest","more fast"],"a":1,"d":"easy","e":"faster than."},{"q":"The comparative of 'big' is ___.","o":["biger","bigger","more big","biggest"],"a":1,"d":"easy","e":"Double the consonant: bigger."},{"q":"Gold is ___ than silver.","o":["expensive","expensiver","more expensive","most expensive"],"a":2,"d":"easy","e":"Long adjective → more expensive."},{"q":"This is the ___ restaurant in town.","o":["best","better","goodest","more good"],"a":0,"d":"med","e":"Irregular superlative: the best."},{"q":"Today is ___ than yesterday.","o":["worse","worst","bad","badder"],"a":0,"d":"med","e":"Irregular comparative: worse."},{"q":"The superlative of 'happy' is ___.","o":["happyest","happiest","most happy","more happy"],"a":1,"d":"med","e":"-y → -iest: happiest."},{"q":"She is ___ student in the school.","o":["more intelligent","the most intelligent","intelligenter","most intelligent"],"a":1,"d":"med","e":"Long adjective superlative: the most intelligent."},{"q":"My bag is ___ than yours.","o":["more heavy","heavier","heaviest","heavy"],"a":1,"d":"med","e":"heavier than."},{"q":"Find the mistake: 'This is more cheaper than that.'","o":["more cheaper → cheaper","than → that","this → these","no mistake"],"a":0,"d":"hard","e":"Don’t use ‘more’ with -er: cheaper than."},{"q":"Complete: 'It is ___ city ___ the country.'","o":["the biggest / in","the bigger / of","biggest / in","the most big / in"],"a":0,"d":"hard","e":"Superlative: the biggest city in the country."},{"q":"Which is correct?","o":["She is the most tallest.","She is the tallest.","She is more tall.","She is tallest."],"a":1,"d":"hard","e":"Use ‘the tallest’ (no ‘most’ with short adjectives)."},{"q":"Complete: 'This exam was ___ than the last one, but not ___ I've ever taken.'","o":["difficult / the most difficult","more difficult / the most difficult","difficulter / most difficult","more difficult / most difficult"],"a":1,"d":"hard","e":"more difficult than … the most difficult."},{"q":"Choose the correct sentence.","o":["My results are gooder than his.","My results are better than his.","My results are more good than his.","My results are best than his."],"a":1,"d":"hard","e":"good → better (irregular)."}]},{"id":"g6","title":"Adverbs of manner","lead":"Adverbs of manner tell us how an action is done. They usually describe a verb and most are formed from adjectives.","blocks":[{"h":"Forming adverbs: + -ly","p":["Most adverbs add <b>-ly</b> to the adjective. Adjectives ending in -y change to <b>-ily</b>; -le changes to <b>-ly</b>."],"ex":["slow → slow<b>ly</b> · happy → happ<b>ily</b> · simple → simp<b>ly</b>"]},{"h":"Irregular adverbs","p":["Some adverbs are irregular or the same as the adjective."],"ex":["good → <b>well</b> · fast → <b>fast</b> · hard → <b>hard</b> · early → <b>early</b>"]},{"h":"Position","p":["The adverb usually goes <b>after the verb</b> (or after the object)."],"ex":["She sings <b>beautifully</b>. · He drives the car <b>carefully</b>."]},{"h":"Adjective vs. adverb","p":["An adjective describes a noun; an adverb describes a verb."],"ex":["He is a <b>careful</b> driver. (adjective) · He drives <b>carefully</b>. (adverb)"]}],"tip":"‘Good’ is an adjective; its adverb is <b>well</b>: ‘She is a <b>good</b> singer’ but ‘She sings <b>well</b>.’ ‘She sings good’ is wrong.","examples":["\"He speaks English <b>fluently</b>.\"","\"Please drive <b>slowly</b>.\"","\"She plays the piano <b>well</b>.\"","\"They worked <b>hard</b> all day.\"","\"The children played <b>happily</b> in the garden.\"","\"He answered the question <b>correctly</b>.\""],"q":[{"q":"She sings ___.","o":["beautiful","beautifully","beauty","more beautiful"],"a":1,"d":"easy","e":"Adverb of manner: beautifully."},{"q":"The adverb of 'quick' is ___.","o":["quick","quickly","quicker","quickest"],"a":1,"d":"easy","e":"quick → quickly."},{"q":"He runs very ___.","o":["fastly","fast","fastlier","more fast"],"a":1,"d":"easy","e":"‘fast’ is the same as adverb and adjective."},{"q":"Please speak ___.","o":["slow","slowly","slower","slowest"],"a":1,"d":"easy","e":"Adverb: slowly."},{"q":"The adverb of 'good' is ___.","o":["goodly","gooder","well","best"],"a":2,"d":"easy","e":"good → well (irregular)."},{"q":"They worked ___ all day.","o":["hardly","hard","harder","hardest"],"a":1,"d":"med","e":"‘hard’ (= with effort) is the adverb; ‘hardly’ means ‘almost not’."},{"q":"She plays the violin ___.","o":["good","goodly","well","best"],"a":2,"d":"med","e":"Use ‘well’, the adverb of ‘good’."},{"q":"The adverb of 'happy' is ___.","o":["happyly","happily","happy","more happy"],"a":1,"d":"med","e":"-y → -ily: happily."},{"q":"He drives ___.","o":["careful","carefully","carefuly","care"],"a":1,"d":"med","e":"Adverb: carefully."},{"q":"Choose the adverb sentence.","o":["She is a quiet girl.","She speaks quietly.","She is quiet.","She quiet speaks."],"a":1,"d":"med","e":"‘speaks quietly’ uses the adverb."},{"q":"Find the mistake: 'He sings very good.'","o":["good → well","very → much","sings → sing","no mistake"],"a":0,"d":"hard","e":"Use the adverb ‘well’: He sings very well."},{"q":"Complete: 'She is a ___ worker and she works ___.'","o":["careful / careful","carefully / careful","careful / carefully","carefully / carefully"],"a":2,"d":"hard","e":"Adjective ‘careful’ (worker) + adverb ‘carefully’ (works)."},{"q":"Which is correct?","o":["He answered the question correct.","He answered the question correctly.","He correct answered.","He answered correct the question."],"a":1,"d":"hard","e":"Adverb after the object: answered the question correctly."},{"q":"Complete: 'The test was ___, so she finished it ___.'","o":["easy / easy","easily / easy","easy / easily","easily / easily"],"a":2,"d":"hard","e":"Adjective ‘easy’ (test) + adverb ‘easily’ (finished)."},{"q":"Choose the correct adverb form.","o":["He spoke angryly.","He spoke angrily.","He spoke angry.","He spoke more angry."],"a":1,"d":"hard","e":"angry → angrily."}]},{"id":"g7","title":"Quantifiers: much, many, a lot of","lead":"Quantifiers say how much or how many. The right one depends on whether the noun is countable or uncountable, and whether the sentence is positive, negative or a question.","blocks":[{"h":"much & many","p":["Use <b>many</b> with countable nouns and <b>much</b> with uncountable nouns, mostly in questions and negatives."],"ex":["How <b>many</b> apples? · How <b>much</b> water? · I don’t have <b>much</b> time."]},{"h":"a lot of / lots of","p":["Use <b>a lot of</b> (or lots of) with both countable and uncountable nouns, usually in positive sentences."],"ex":["She has <b>a lot of</b> friends. · We have <b>a lot of</b> homework."]},{"h":"a few & a little","p":["Use <b>a few</b> with countable nouns and <b>a little</b> with uncountable nouns to mean ‘a small amount’."],"ex":["I have <b>a few</b> questions. · Add <b>a little</b> salt."]},{"h":"too much / too many / enough","p":["<b>too much/many</b> = more than you want; <b>enough</b> = the right amount."],"ex":["There are <b>too many</b> cars. · We don’t have <b>enough</b> chairs."]}],"tip":"In positive sentences, <b>a lot of</b> usually sounds better than ‘much’ or ‘many’: say ‘I have <b>a lot of</b> work’, not ‘I have much work’.","examples":["\"How <b>many</b> students are in your class?\"","\"There isn’t <b>much</b> milk left.\"","\"We have <b>a lot of</b> homework today.\"","\"I only need <b>a few</b> minutes.\"","\"Add <b>a little</b> sugar to the tea.\"","\"There are <b>too many</b> people here.\""],"q":[{"q":"How ___ apples do you want?","o":["much","many","a little","lot"],"a":1,"d":"easy","e":"Countable ‘apples’ → many."},{"q":"How ___ water is there?","o":["many","much","few","a lot"],"a":1,"d":"easy","e":"Uncountable ‘water’ → much."},{"q":"She has ___ friends.","o":["much","a little","a lot of","a much"],"a":2,"d":"easy","e":"Positive sentence → a lot of."},{"q":"I have ___ books on this subject.","o":["much","a little","a few","a lot"],"a":2,"d":"easy","e":"Countable, small number → a few."},{"q":"Add ___ salt to the soup.","o":["a few","many","a little","much of"],"a":2,"d":"easy","e":"Uncountable, small amount → a little."},{"q":"There isn't ___ time left.","o":["many","much","a few","lots"],"a":1,"d":"med","e":"Uncountable + negative → much."},{"q":"We don't have ___ chairs.","o":["much","many","a little","a much"],"a":1,"d":"med","e":"Countable + negative → many."},{"q":"There are ___ people in the room. (more than we want)","o":["too much","too many","enough many","a little"],"a":1,"d":"med","e":"Countable, excess → too many."},{"q":"I'd like ___ sugar in my coffee.","o":["a few","many","a little","a lot"],"a":2,"d":"med","e":"Uncountable, small amount → a little."},{"q":"We have ___ homework tonight.","o":["many","a few","a lot of","a many"],"a":2,"d":"med","e":"Uncountable positive → a lot of."},{"q":"Find the mistake: 'I have much friends.'","o":["much → many/a lot of","friends → friend","have → has","no mistake"],"a":0,"d":"hard","e":"Countable positive → ‘many’ or ‘a lot of’ friends."},{"q":"Complete: 'There isn't ___ juice, but there are ___ apples.'","o":["many / much","much / a few","a little / much","much / many"],"a":1,"d":"hard","e":"Uncountable ‘much juice’ + countable ‘a few apples’."},{"q":"Which is correct?","o":["We don't have enough chairs.","We don't have chairs enough.","We have not enough chairs.","We don't have a enough chairs."],"a":0,"d":"hard","e":"‘enough’ goes before the noun: enough chairs."},{"q":"Complete: 'How ___ money do you need? Only ___.'","o":["many / a few","much / a little","much / a few","many / a little"],"a":1,"d":"hard","e":"Uncountable ‘much money’ + ‘a little’."},{"q":"Choose the natural sentence.","o":["He drinks much coffee.","He drinks a lot of coffee.","He drinks many coffee.","He drinks a few coffee."],"a":1,"d":"hard","e":"Positive + uncountable → a lot of coffee."}]},{"id":"g8","title":"Verb + infinitive or -ing","lead":"After certain verbs we use the infinitive (to + verb); after others we use the -ing form. Learning which verbs take which form is an important A2 skill.","blocks":[{"h":"Verb + to-infinitive","p":["These verbs are followed by <b>to + base verb</b>: want, would like, need, decide, hope, plan, promise, learn, try."],"ex":["I <b>want to go</b> home. · She <b>decided to stay</b>. · We <b>hope to win</b>."]},{"h":"Verb + -ing","p":["These verbs are followed by the <b>-ing</b> form: like, love, enjoy, hate, finish, stop, mind, suggest, practise."],"ex":["I <b>enjoy reading</b>. · They <b>finished eating</b>. · Do you <b>mind waiting</b>?"]},{"h":"to-infinitive of purpose","p":["Use <b>to + verb</b> to explain why you do something (the purpose)."],"ex":["I went to the shop <b>to buy</b> milk."]},{"h":"like + -ing vs would like + to","p":["<b>like + -ing</b> = enjoy in general; <b>would like + to</b> = want now."],"ex":["I <b>like swimming</b>. · I<b>’d like to swim</b> now."]}],"tip":"Memorise verbs in short phrases: ‘want <b>to</b> go’, ‘enjoy <b>going</b>’. When unsure, remember that want, need, hope and decide take <b>to</b>, while enjoy, finish and stop take <b>-ing</b>.","examples":["\"I <b>want to learn</b> Spanish.\"","\"She <b>enjoys cooking</b> for her family.\"","\"They <b>decided to move</b> to a new city.\"","\"He <b>finished doing</b> his homework.\"","\"We went out <b>to celebrate</b> her birthday.\"","\"Do you <b>mind opening</b> the window?\""],"q":[{"q":"I want ___ home.","o":["go","to go","going","to going"],"a":1,"d":"easy","e":"want + to: to go."},{"q":"She enjoys ___.","o":["dance","to dance","dancing","to dancing"],"a":2,"d":"easy","e":"enjoy + -ing: dancing."},{"q":"We hope ___ the match.","o":["win","to win","winning","won"],"a":1,"d":"easy","e":"hope + to: to win."},{"q":"They finished ___ dinner.","o":["eat","to eat","eating","ate"],"a":2,"d":"easy","e":"finish + -ing: eating."},{"q":"I need ___ a doctor.","o":["see","to see","seeing","saw"],"a":1,"d":"easy","e":"need + to: to see."},{"q":"He decided ___ at home.","o":["stay","to stay","staying","stayed"],"a":1,"d":"med","e":"decide + to: to stay."},{"q":"Do you mind ___ the door?","o":["close","to close","closing","closed"],"a":2,"d":"med","e":"mind + -ing: closing."},{"q":"I went to the library ___ a book.","o":["borrow","to borrow","borrowing","for borrow"],"a":1,"d":"med","e":"Purpose → to borrow."},{"q":"She stopped ___ because she was tired.","o":["work","to work","working","worked"],"a":2,"d":"med","e":"stop + -ing: working."},{"q":"We learned ___ in summer.","o":["swim","to swim","swimming","swam"],"a":1,"d":"med","e":"learn + to: to swim."},{"q":"Find the mistake: 'I enjoy to read books.'","o":["to read → reading","enjoy → enjoys","books → book","no mistake"],"a":0,"d":"hard","e":"enjoy + -ing: I enjoy reading books."},{"q":"Complete: 'She wants ___ a teacher, so she's learning ___ children.'","o":["become / teach","to become / to teach","to become / teaching","becoming / to teach"],"a":2,"d":"hard","e":"want + to (to become); learn + to (but here ‘teaching’ as a noun-like activity she practises) → best: to teach. (to become / to teach)"},{"q":"Which is correct?","o":["I'd like swimming now.","I'd like to swim now.","I like to swimming now.","I would like swim now."],"a":1,"d":"hard","e":"would like + to: I’d like to swim."},{"q":"Complete: 'He finished ___ and then decided ___ for a walk.'","o":["to work / to go","working / go","working / to go","work / going"],"a":2,"d":"hard","e":"finish + -ing (working) + decide + to (to go)."},{"q":"Choose the purpose sentence.","o":["I study to passing the exam.","I study to pass the exam.","I study for pass the exam.","I study passing the exam."],"a":1,"d":"hard","e":"Purpose uses to + base verb: to pass."}]},{"id":"g9","title":"Present perfect vs past simple","lead":"These two tenses both talk about the past, but they are used differently. The past simple is for a finished time; the present perfect connects the past to now.","blocks":[{"h":"Finished vs. unfinished time","p":["Use the <b>past simple</b> with a finished time word (yesterday, last week, in 2010). Use the <b>present perfect</b> when the time is unstated or unfinished (today, this week, ever)."],"ex":["I <b>saw</b> her <b>yesterday</b>. · I <b>have seen</b> that film. (when? not important)"]},{"h":"Experience vs. specific event","p":["Present perfect = experience at any time. Past simple = a specific completed event."],"ex":["<b>Have</b> you ever <b>been</b> to Rome? — Yes, I <b>went</b> there in 2019."]},{"h":"Result now vs. finished","p":["Present perfect shows a present result; past simple just reports a finished action."],"ex":["I<b>’ve lost</b> my keys. (I can’t find them now) · I <b>lost</b> my keys yesterday."]},{"h":"Signal words","p":["Past simple: yesterday, ago, last…, in 2015. Present perfect: ever, never, just, already, yet, recently, since, for."],"ex":["She <b>moved</b> here <b>two years ago</b>. · She <b>has lived</b> here <b>for</b> two years."]}],"tip":"A finished time word forces the past simple. ‘I have finished it <b>yesterday</b>’ is wrong → ‘I <b>finished</b> it yesterday.’","examples":["\"I <b>have visited</b> Paris, but I <b>visited</b> it last spring.\"","\"She <b>has just left</b>.\"","\"They <b>arrived</b> two hours ago.\"","\"<b>Have</b> you ever <b>eaten</b> sushi? — Yes, I <b>tried</b> it in Tokyo.\"","\"We <b>have known</b> each other <b>since</b> 2018.\"","\"He <b>didn’t call</b> me yesterday.\""],"q":[{"q":"I ___ my homework yesterday.","o":["have finished","finished","finish","has finished"],"a":1,"d":"easy","e":"‘yesterday’ → past simple: finished."},{"q":"She ___ to Japan. (experience)","o":["has been","was","went","is been"],"a":0,"d":"easy","e":"Experience → present perfect: has been."},{"q":"We ___ a great film last night.","o":["have seen","saw","seen","have saw"],"a":1,"d":"easy","e":"‘last night’ → past simple: saw."},{"q":"He ___ his keys. (he can't find them now)","o":["lost","has lost","lose","loses"],"a":1,"d":"easy","e":"Present result → has lost."},{"q":"They ___ here in 2015.","o":["have moved","moved","move","has moved"],"a":1,"d":"easy","e":"‘in 2015’ → past simple: moved."},{"q":"___ you ever ___ a horse?","o":["Did / ride","Have / ridden","Have / rode","Did / ridden"],"a":1,"d":"med","e":"Experience question → Have you ever ridden?"},{"q":"I ___ him two days ago.","o":["have met","met","meet","have meet"],"a":1,"d":"med","e":"‘two days ago’ → past simple: met."},{"q":"She's not here; she ___ already ___.","o":["has / left","did / leave","have / left","has / leaved"],"a":0,"d":"med","e":"‘already’ + result now → has left."},{"q":"We ___ in this town for ten years.","o":["lived","have lived","live","has lived"],"a":1,"d":"med","e":"‘for ten years’ continuing → present perfect: have lived."},{"q":"What time ___ you ___ home last night?","o":["have / arrived","did / arrive","did / arrived","have / arrive"],"a":1,"d":"med","e":"‘last night’ → past simple: did you arrive?"},{"q":"Find the mistake: 'I have seen her last week.'","o":["have seen → saw","seen → seeing","her → she","no mistake"],"a":0,"d":"hard","e":"‘last week’ forces past simple: I saw her last week."},{"q":"Complete: 'I ___ Tom for years. We ___ at school in 2010.'","o":["have known / met","knew / have met","have known / have met","knew / met"],"a":0,"d":"hard","e":"Continuing ‘have known’ + finished event ‘met’ (in 2010)."},{"q":"Which is correct?","o":["Did you ever go to Spain?","Have you ever been to Spain?","Have you ever went to Spain?","Did you ever been to Spain?"],"a":1,"d":"hard","e":"Experience → Have you ever been…?"},{"q":"Complete: 'She ___ three books this year, and she ___ this one last weekend.'","o":["read / has read","has read / read","read / read","has read / has read"],"a":1,"d":"hard","e":"‘this year’ (unfinished) → has read; ‘last weekend’ → read."},{"q":"Choose the sentence with a present result.","o":["I broke my arm in 2019.","I've broken my arm — it hurts!","I break my arm.","I was breaking my arm."],"a":1,"d":"hard","e":"Present perfect shows the result now: I’ve broken my arm."}]},{"id":"g10","title":"used to","lead":"We use ‘used to’ to talk about past habits and states that are no longer true. It is a simple way to contrast the past with the present.","blocks":[{"h":"Past habits & states","p":["<b>used to</b> + base verb describes something that happened regularly in the past, or a state that was true before but isn’t now."],"ex":["I <b>used to play</b> football every day. · She <b>used to live</b> in Leeds."]},{"h":"Negatives & questions","p":["Negative: <b>didn’t use to</b> (no -d). Question: <b>Did</b> … <b>use to</b>…?"],"ex":["He <b>didn’t use to</b> like coffee. · <b>Did</b> you <b>use to</b> have long hair?"]},{"h":"used to vs. present","p":["‘used to’ always contrasts the past with now."],"ex":["I <b>used to smoke</b>, but now I don’t. · We <b>didn’t use to</b> have a car, but now we do."]},{"h":"Only for the past","p":["For present habits, use the present simple, not ‘used to’."],"ex":["Now I <b>go</b> to the gym every day. (not ‘I use to go’)"]}],"tip":"In negatives and questions the ‘-d’ disappears: ‘<b>didn’t use to</b>’ and ‘<b>Did you use to…?</b>’, never ‘didn’t used to’.","examples":["\"I <b>used to live</b> in a small village.\"","\"She <b>used to have</b> long hair.\"","\"We <b>didn’t use to</b> watch much TV.\"","\"<b>Did</b> you <b>use to</b> walk to school?\"","\"He <b>used to be</b> shy, but now he’s very confident.\"","\"They <b>used to play</b> outside every afternoon.\""],"q":[{"q":"I ___ play tennis when I was young.","o":["use to","used to","am used to","using to"],"a":1,"d":"easy","e":"Past habit: used to play."},{"q":"She ___ live in London.","o":["used to","use to","uses to","is used to"],"a":0,"d":"easy","e":"Past state: used to live."},{"q":"We ___ have a dog.","o":["use to","used to","using to","used"],"a":1,"d":"easy","e":"Past state: used to have."},{"q":"They ___ go to the beach every summer.","o":["use to","used to","uses to","are used to"],"a":1,"d":"easy","e":"Past habit: used to go."},{"q":"He ___ be very thin.","o":["use to","used to","is used to","using to"],"a":1,"d":"easy","e":"Past state: used to be."},{"q":"Negative: 'I ___ like vegetables.'","o":["didn't used to","didn't use to","don't used to","usedn't to"],"a":1,"d":"med","e":"Negative drops the -d: didn’t use to."},{"q":"___ you use to have long hair?","o":["Do","Did","Are","Were"],"a":1,"d":"med","e":"Question: Did you use to…?"},{"q":"She ___ like coffee, but now she loves it.","o":["didn't use to","didn't used to","doesn't use to","wasn't use to"],"a":0,"d":"med","e":"Negative past habit: didn’t use to."},{"q":"We ___ play outside, but now we stay in.","o":["use to","used to","are used to","using to"],"a":1,"d":"med","e":"Past habit: used to play."},{"q":"Choose the correct question.","o":["Did you used to smoke?","Did you use to smoke?","Do you use to smoke?","Were you use to smoke?"],"a":1,"d":"med","e":"Did + use to (no -d): Did you use to smoke?"},{"q":"Find the mistake: 'He didn't used to study hard.'","o":["didn't used to → didn't use to","study → studied","hard → hardly","no mistake"],"a":0,"d":"hard","e":"Drop the -d after didn’t: didn’t use to study."},{"q":"Complete: 'I ___ be afraid of dogs, but now I ___ them.'","o":["use to / love","used to / love","used to / loved","used to / am loving"],"a":1,"d":"hard","e":"Past state ‘used to be’ + present ‘love’."},{"q":"Which sentence is correct for a present habit?","o":["Now I use to run daily.","Now I run daily.","Now I used to run daily.","Now I am use to run daily."],"a":1,"d":"hard","e":"For present habits use the present simple: I run daily."},{"q":"Complete: '___ they ___ live near here?'","o":["Did / used to","Did / use to","Do / use to","Were / use to"],"a":1,"d":"hard","e":"Did + use to: Did they use to live…?"},{"q":"Choose the natural contrast.","o":["I used to play piano, and I still do every day exactly the same.","I used to play piano, but I stopped years ago.","I use to play piano now.","I am used to play piano before."],"a":1,"d":"hard","e":"‘used to’ contrasts a past habit with the present (now stopped)."}]},{"id":"g11","title":"Obligation: must, have to, should","lead":"These modal verbs talk about rules, necessity and advice. ‘Must’ and ‘have to’ express obligation; ‘should’ gives advice; their negatives have different meanings.","blocks":[{"h":"must & have to (obligation)","p":["<b>must</b> and <b>have to</b> + base verb both mean something is necessary. ‘Must’ often comes from the speaker; ‘have to’ often comes from outside rules."],"ex":["You <b>must</b> wear a seatbelt. · I <b>have to</b> work on Saturday."]},{"h":"should (advice)","p":["<b>should</b> + base verb gives advice or an opinion about the best thing to do."],"ex":["You <b>should</b> see a doctor. · We <b>shouldn’t</b> waste food."]},{"h":"mustn’t vs. don’t have to","p":["<b>mustn’t</b> = it is prohibited (don’t do it!). <b>don’t have to</b> = it isn’t necessary (but you can)."],"ex":["You <b>mustn’t</b> smoke here. (forbidden) · You <b>don’t have to</b> come. (optional)"]},{"h":"Past: had to","p":["The past of both ‘must’ and ‘have to’ is <b>had to</b>."],"ex":["Yesterday I <b>had to</b> stay late at work."]}],"tip":"Be careful: <b>mustn’t</b> and <b>don’t have to</b> are very different. ‘You mustn’t go’ = do NOT go. ‘You don’t have to go’ = you can stay if you like.","examples":["\"You <b>must</b> stop at a red light.\"","\"I <b>have to</b> get up early tomorrow.\"","\"You <b>should</b> drink more water.\"","\"You <b>mustn’t</b> use your phone in the exam.\"","\"We <b>don’t have to</b> pay — it’s free.\"","\"She <b>had to</b> wait an hour for the bus.\""],"q":[{"q":"You ___ wear a uniform at this school. (rule)","o":["should","have to","shouldn't","don't have to"],"a":1,"d":"easy","e":"Obligation/rule → have to."},{"q":"You look tired. You ___ go to bed.","o":["should","mustn't","don't have to","have to"],"a":0,"d":"easy","e":"Advice → should."},{"q":"You ___ smoke here. It's forbidden.","o":["don't have to","mustn't","should","have to"],"a":1,"d":"easy","e":"Prohibition → mustn’t."},{"q":"I ___ get up early tomorrow.","o":["should","have to","shouldn't","mustn't"],"a":1,"d":"easy","e":"Necessity → have to."},{"q":"We ___ waste water.","o":["should","shouldn't","have to","don't have to"],"a":1,"d":"easy","e":"Advice not to do → shouldn’t."},{"q":"It's free, so you ___ pay.","o":["mustn't","don't have to","should","have to"],"a":1,"d":"med","e":"Not necessary → don’t have to."},{"q":"Students ___ be quiet in the library. (rule)","o":["should","must","don't have to","shouldn't"],"a":1,"d":"med","e":"Strong rule → must."},{"q":"The past of 'I must leave' is ___.","o":["I must left","I had to leave","I have to leave","I musted leave"],"a":1,"d":"med","e":"Past of must/have to → had to leave."},{"q":"You're ill. You ___ see a doctor.","o":["shouldn't","mustn't","should","don't have to"],"a":2,"d":"med","e":"Advice → should."},{"q":"You ___ touch that — it's dangerous!","o":["don't have to","mustn't","should","have to"],"a":1,"d":"med","e":"Prohibition → mustn’t."},{"q":"Find the difference: 'You don't have to come.' means ___.","o":["You can't come.","It isn't necessary to come.","You must come.","You shouldn't come."],"a":1,"d":"hard","e":"don’t have to = not necessary (optional)."},{"q":"Complete: 'You ___ be late, but you ___ come if you're busy.'","o":["mustn't / don't have to","don't have to / mustn't","should / must","have to / mustn't"],"a":0,"d":"hard","e":"‘mustn’t be late’ (forbidden) + ‘don’t have to come’ (optional)."},{"q":"Which gives advice correctly?","o":["You should to study more.","You should study more.","You shoulds study more.","You should studying more."],"a":1,"d":"hard","e":"should + base verb: You should study more."},{"q":"Complete: 'Yesterday I ___ work late, so I ___ cancel my plans.'","o":["have to / should","had to / had to","must / had to","had to / should"],"a":1,"d":"hard","e":"Past obligation → had to (twice)."},{"q":"Choose the prohibition.","o":["You don't have to park here.","You mustn't park here.","You should park here.","You have to park here."],"a":1,"d":"hard","e":"Prohibition → mustn’t park here."}]},{"id":"g12","title":"First conditional","lead":"The first conditional talks about a real or likely situation in the future and its result. It uses ‘if’ + present simple for the condition and ‘will’ for the result.","blocks":[{"h":"Form: if + present, will + base","p":["The <b>if-clause</b> uses the present simple; the <b>result clause</b> uses will + base verb."],"ex":["<b>If</b> it <b>rains</b>, we <b>will stay</b> home.","I <b>will call</b> you <b>if</b> I <b>have</b> time."]},{"h":"Order of clauses","p":["You can start with either clause. Use a comma only when the if-clause comes first."],"ex":["<b>If</b> you study, you’ll pass. · You’ll pass <b>if</b> you study."]},{"h":"unless","p":["<b>unless</b> means ‘if … not’."],"ex":["You’ll be late <b>unless</b> you hurry. (= if you don’t hurry)"]},{"h":"may / might / can in the result","p":["Instead of ‘will’, you can use may, might (possible) or can (ability) in the result."],"ex":["If it’s sunny, we <b>might</b> go to the beach."]}],"tip":"Don’t use ‘will’ in the if-clause: ‘If it <b>will rain</b>’ is wrong → ‘If it <b>rains</b>, we will stay home.’ The condition is in the present simple.","examples":["\"If it rains, we <b>will stay</b> at home.\"","\"If you <b>heat</b> ice, it melts.\"","\"I’ll help you if you <b>ask</b> me.\"","\"You’ll miss the bus <b>unless</b> you run.\"","\"If she studies hard, she <b>will pass</b>.\"","\"If we leave now, we <b>might</b> catch the train.\""],"q":[{"q":"If it rains, we ___ at home.","o":["stay","will stay","stayed","staying"],"a":1,"d":"easy","e":"Result clause → will stay."},{"q":"If you ___ hard, you'll pass.","o":["study","will study","studied","studying"],"a":0,"d":"easy","e":"If-clause → present simple: study."},{"q":"I'll call you if I ___ time.","o":["will have","have","had","having"],"a":1,"d":"easy","e":"If-clause → present simple: have."},{"q":"If she runs, she ___ the bus.","o":["catch","catches","will catch","caught"],"a":2,"d":"easy","e":"Result → will catch."},{"q":"We'll have a picnic if the weather ___ nice.","o":["will be","is","be","was"],"a":1,"d":"easy","e":"If-clause → present: is."},{"q":"If you ___ now, you'll arrive on time.","o":["leave","will leave","left","leaving"],"a":0,"d":"med","e":"If + present: leave."},{"q":"You'll be tired ___ you sleep more.","o":["if","unless","when","because"],"a":1,"d":"med","e":"‘unless’ = if … not."},{"q":"If I ___ the exam, my parents will be happy.","o":["will pass","pass","passed","passing"],"a":1,"d":"med","e":"If + present: pass."},{"q":"If it's sunny, we ___ go to the park.","o":["might","must","should have","would"],"a":0,"d":"med","e":"Possible result → might go."},{"q":"Choose the correct sentence.","o":["If it will rain, I'll stay.","If it rains, I'll stay.","If it rains, I stay.","If it rain, I'll stay."],"a":1,"d":"med","e":"If + present, will + base."},{"q":"Find the mistake: 'If you will help me, I'll finish faster.'","o":["will help → help","I'll → I","finish → finished","no mistake"],"a":0,"d":"hard","e":"No ‘will’ in the if-clause: If you help me…"},{"q":"Complete: 'You ___ pass ___ you study harder.'","o":["won't / unless","will / unless","won't / if","don't / unless"],"a":0,"d":"hard","e":"‘won’t pass unless you study’ = if you don’t study."},{"q":"Which is correct?","o":["If we leave now, we catch the train.","If we leave now, we'll catch the train.","If we will leave now, we'll catch.","If we leave now, we caught the train."],"a":1,"d":"hard","e":"If + present, will + base verb."},{"q":"Complete: 'If it ___ tomorrow, the match ___ cancelled.'","o":["will snow / will be","snows / will be","snows / is","snow / will be"],"a":1,"d":"hard","e":"If + present (snows) + will + base (will be)."},{"q":"Choose the sentence with correct punctuation.","o":["You'll be fine, if you relax.","If you relax you'll be fine.","If you relax, you'll be fine.","If, you relax you'll be fine."],"a":2,"d":"hard","e":"Comma after the if-clause when it comes first."}]},{"id":"g13","title":"Relative clauses","lead":"Relative clauses give extra information about a noun. They begin with a relative pronoun — who, which, that, where — and help you build longer, more natural sentences.","blocks":[{"h":"who (people) & which (things)","p":["Use <b>who</b> for people and <b>which</b> for things and animals."],"ex":["The man <b>who</b> lives next door is a doctor.","I bought a phone <b>which</b> takes great photos."]},{"h":"that","p":["<b>that</b> can replace who or which in many sentences, especially in speaking."],"ex":["The book <b>that</b> I read was excellent."]},{"h":"where (places)","p":["Use <b>where</b> to talk about a place."],"ex":["This is the café <b>where</b> we first met."]},{"h":"whose (possession)","p":["Use <b>whose</b> to show that something belongs to someone."],"ex":["That’s the girl <b>whose</b> brother is a singer."]}],"tip":"Use <b>who</b> for people, <b>which</b> for things; <b>that</b> can replace either. Don’t add an extra pronoun: ‘The man who he lives next door’ is wrong — drop ‘he’.","examples":["\"The woman <b>who</b> teaches us is very kind.\"","\"This is the laptop <b>which</b> I bought yesterday.\"","\"He’s the player <b>that</b> scored the goal.\"","\"That’s the town <b>where</b> I was born.\"","\"She’s the friend <b>whose</b> car we borrowed.\"","\"The film <b>that</b> we saw was boring.\""],"q":[{"q":"The man ___ lives here is my uncle.","o":["which","who","where","whose"],"a":1,"d":"easy","e":"People → who."},{"q":"I have a watch ___ was very expensive.","o":["who","which","where","whose"],"a":1,"d":"easy","e":"Things → which."},{"q":"This is the school ___ I study.","o":["which","who","where","that"],"a":2,"d":"easy","e":"Place → where."},{"q":"She's the woman ___ son is a doctor.","o":["who","which","whose","where"],"a":2,"d":"easy","e":"Possession → whose."},{"q":"The book ___ I read was great.","o":["who","where","that","whose"],"a":2,"d":"easy","e":"Things → that (or which)."},{"q":"The teacher ___ teaches English is new.","o":["which","who","where","whose"],"a":1,"d":"med","e":"People → who."},{"q":"That's the restaurant ___ we had dinner.","o":["which","who","where","that"],"a":2,"d":"med","e":"Place → where."},{"q":"I like the shoes ___ you're wearing.","o":["who","which","where","whose"],"a":1,"d":"med","e":"Things → which (or that)."},{"q":"He's the boy ___ won the competition.","o":["which","who","where","whose"],"a":1,"d":"med","e":"People → who (or that)."},{"q":"Choose the correct relative pronoun: 'a person ___ helps others.'","o":["which","who","where","whose"],"a":1,"d":"med","e":"People → who."},{"q":"Find the mistake: 'The man who he lives next door is friendly.'","o":["remove 'he'","who → which","lives → live","no mistake"],"a":0,"d":"hard","e":"Don’t add an extra subject: The man who lives next door…"},{"q":"Complete: 'That's the girl ___ bag was stolen and ___ called the police.'","o":["who / whose","whose / who","which / who","whose / which"],"a":1,"d":"hard","e":"‘whose bag’ (possession) + ‘who called’ (subject)."},{"q":"Which is correct?","o":["The film who we saw was good.","The film which we saw was good.","The film where we saw was good.","The film whose we saw was good."],"a":1,"d":"hard","e":"Things → which (or that)."},{"q":"Complete: 'This is the hospital ___ I was born, near the park ___ is now closed.'","o":["which / where","where / which","where / who","that / where"],"a":1,"d":"hard","e":"Place ‘where I was born’ + thing ‘which is now closed’."},{"q":"Choose the natural sentence.","o":["I know a place that sells great coffee.","I know a place who sells great coffee.","I know a place whose sells great coffee.","I know a place where sells great coffee."],"a":0,"d":"hard","e":"Things → that (here ‘a place that sells…’)."}]},{"id":"g14","title":"Linking words: because, so, but, although","lead":"Linking words join ideas to make your writing and speaking flow. They show reasons, results, contrasts and additions between two parts of a sentence.","blocks":[{"h":"because (reason) & so (result)","p":["<b>because</b> introduces a reason; <b>so</b> introduces a result."],"ex":["I stayed home <b>because</b> I was ill. · I was ill, <b>so</b> I stayed home."]},{"h":"but & however (contrast)","p":["<b>but</b> joins two contrasting ideas in one sentence; <b>however</b> often starts a new sentence."],"ex":["It was cold, <b>but</b> we went out. · It was cold. <b>However</b>, we went out."]},{"h":"although / though","p":["<b>although</b> introduces a surprising contrast within a sentence."],"ex":["<b>Although</b> it was raining, we played football."]},{"h":"and / or / also","p":["<b>and</b> adds; <b>or</b> gives a choice; <b>also</b> adds extra information."],"ex":["We had tea <b>and</b> cake. · Tea <b>or</b> coffee? · She sings; she <b>also</b> dances."]}],"tip":"‘<b>because</b>’ is followed by a reason and ‘<b>so</b>’ by a result. ‘I was tired <b>because</b> I worked late’ = the reason; ‘I worked late, <b>so</b> I was tired’ = the result.","examples":["\"I was hungry, <b>so</b> I made a sandwich.\"","\"She passed <b>because</b> she studied hard.\"","\"He’s rich, <b>but</b> he isn’t happy.\"","\"<b>Although</b> she was tired, she finished the work.\"","\"Would you like tea <b>or</b> coffee?\"","\"It rained all day, <b>so</b> we stayed inside.\""],"q":[{"q":"I was tired, ___ I went to bed.","o":["because","so","but","although"],"a":1,"d":"easy","e":"Result → so."},{"q":"She was happy ___ she passed the exam.","o":["so","because","but","although"],"a":1,"d":"easy","e":"Reason → because."},{"q":"It was raining, ___ we went out.","o":["because","so","but","or"],"a":2,"d":"easy","e":"Contrast → but."},{"q":"Would you like tea ___ coffee?","o":["and","or","but","so"],"a":1,"d":"easy","e":"Choice → or."},{"q":"We had cake ___ ice cream.","o":["or","but","and","so"],"a":2,"d":"easy","e":"Addition → and."},{"q":"___ it was cold, we went swimming.","o":["Because","So","Although","And"],"a":2,"d":"med","e":"Surprising contrast → Although."},{"q":"He didn't study, ___ he failed.","o":["because","so","but","although"],"a":1,"d":"med","e":"Result → so."},{"q":"I like coffee ___ I don't drink it at night.","o":["so","because","but","and"],"a":2,"d":"med","e":"Contrast → but."},{"q":"They stayed home ___ the bad weather.","o":["because of","so","but","although"],"a":0,"d":"med","e":"‘because of’ + noun (the bad weather)."},{"q":"Choose the reason: 'We left early ___ the film was boring.'","o":["so","because","but","or"],"a":1,"d":"med","e":"Reason → because."},{"q":"Find the mistake: 'Although it was late, but we kept working.'","o":["remove 'but'","Although → Because","late → lately","no mistake"],"a":0,"d":"hard","e":"Don’t use ‘although’ and ‘but’ together: Although it was late, we kept working."},{"q":"Complete: 'I was ill, ___ I missed school ___ I'm fine now.'","o":["because / so","so / but","but / so","so / because"],"a":1,"d":"hard","e":"Result ‘so I missed school’ + contrast ‘but I’m fine now’."},{"q":"Which sentence shows a contrast correctly?","o":["Because it was hot, we wore coats.","Although it was hot, we wore coats.","So it was hot, we wore coats.","And it was hot, we wore coats."],"a":1,"d":"hard","e":"Surprising contrast → Although."},{"q":"Complete: 'She studied medicine ___ she wanted to help people, ___ now she's a doctor.'","o":["so / because","because / and","but / so","because / but"],"a":1,"d":"hard","e":"Reason ‘because’ + addition ‘and now she’s a doctor’."},{"q":"Choose the correct linker for a result.","o":["It snowed heavily because the roads closed.","It snowed heavily, so the roads closed.","It snowed heavily although the roads closed.","It snowed heavily but the roads closed."],"a":1,"d":"hard","e":"Result → so the roads closed."}]},{"id":"g15","title":"Question tags","lead":"Question tags are short questions added to the end of a statement, used to check information or invite agreement. The tag matches the tense and reverses the verb.","blocks":[{"h":"Positive statement → negative tag","p":["After a positive statement, the tag is negative, using the same auxiliary verb."],"ex":["You’re from Spain, <b>aren’t you</b>? · She likes tea, <b>doesn’t she</b>?"]},{"h":"Negative statement → positive tag","p":["After a negative statement, the tag is positive."],"ex":["You aren’t tired, <b>are you</b>? · He didn’t call, <b>did he</b>?"]},{"h":"Matching the verb","p":["Use ‘be’ with ‘be’; with other verbs use do/does/did; with the present perfect use have/has; with modals repeat the modal."],"ex":["They can swim, <b>can’t they</b>? · You’ve finished, <b>haven’t you</b>?"]},{"h":"Special cases","p":["‘I am’ → tag is <b>aren’t I</b>. ‘Let’s…’ → tag is <b>shall we</b>."],"ex":["I’m next, <b>aren’t I</b>? · Let’s go, <b>shall we</b>?"]}],"tip":"The tag repeats the <b>auxiliary verb</b> and reverses positive/negative. Statement positive → tag negative, and the other way round: ‘He’s here, <b>isn’t he</b>?’ / ‘He isn’t here, <b>is he</b>?’","examples":["\"You’re a student, <b>aren’t you</b>?\"","\"She works here, <b>doesn’t she</b>?\"","\"They didn’t come, <b>did they</b>?\"","\"He can drive, <b>can’t he</b>?\"","\"We’ve met before, <b>haven’t we</b>?\"","\"Let’s have a break, <b>shall we</b>?\""],"q":[{"q":"You're from Italy, ___?","o":["are you","aren't you","do you","don't you"],"a":1,"d":"easy","e":"Positive statement → negative tag: aren’t you?"},{"q":"She likes coffee, ___?","o":["does she","doesn't she","is she","isn't she"],"a":1,"d":"easy","e":"Present simple positive → doesn’t she?"},{"q":"They aren't here, ___?","o":["aren't they","are they","do they","don't they"],"a":1,"d":"easy","e":"Negative statem ","ex":"Our neighbours are very friendly."},{"w":"kind","pos":"adj","ipa":"/kaɪnd/","uz":"mehribon","ru":"добрый","ex":"She is kind to everyone."},{"w":"shy","pos":"adj","ipa":"/ʃaɪ/","uz":"uyatchan","ru":"застенчивый","ex":"He is too shy to speak."},{"w":"confident","pos":"adj","ipa":"/ˈkɒnfɪdənt/","uz":"oʻziga ishongan","ru":"уверенный","ex":"She feels confident now."},{"w":"worried","pos":"adj","ipa":"/ˈwʌrid/","uz":"xavotirli","ru":"обеспокоенный","ex":"I'm worried about the exam."},{"w":"proud","pos":"adj","ipa":"/praʊd/","uz":"faxrlanadigan","ru":"гордый","ex":"His parents are proud of him."},{"w":"relationship","pos":"n","ipa":"/rɪˈleɪʃnʃɪp/","uz":"munosabat","ru":"отношения","ex":"They have a good relationship."},{"w":"couple","pos":"n","ipa":"/ˈkʌpl/","uz":"juftlik","ru":"пара","ex":"They are a lovely couple."},{"w":"neighbour","pos":"n","ipa":"/ˈneɪbə/","uz":"qoʻshni","ru":"сосед","ex":"My neighbour helps me a lot."},{"w":"agree","pos":"v","ipa":"/əˈɡriː/","uz":"rozi boʻlmoq","ru":"соглашаться","ex":"I agree with you."},{"w":"argue","pos":"v","ipa":"/ˈɑːɡjuː/","uz":"tortishmoq","ru":"спорить","ex":"They never argue."},{"w":"trust","pos":"v","ipa":"/trʌst/","uz":"ishonmoq","ru":"доверять","ex":"I trust my best friend."},{"w":"lonely","pos":"adj","ipa":"/ˈləʊnli/","uz":"yolgʻiz","ru":"одинокий","ex":"He felt lonely abroad."},{"w":"polite","pos":"adj","ipa":"/pəˈlaɪt/","uz":"odobli","ru":"вежливый","ex":"Always be polite to guests."},{"w":"honest","pos":"adj","ipa":"/ˈɒnɪst/","uz":"halol","ru":"честный","ex":"She is an honest person."},{"w":"jealous","pos":"adj","ipa":"/ˈdʒeləs/","uz":"rashkchi","ru":"ревнивый","ex":"He felt jealous of his brother."},{"w":"generous","pos":"adj","ipa":"/ˈdʒenərəs/","uz":"saxiy","ru":"щедрый","ex":"She is very generous."},{"w":"selfish","pos":"adj","ipa":"/ˈselfɪʃ/","uz":"xudbin","ru":"эгоистичный","ex":"Don't be selfish."},{"w":"patient","pos":"adj","ipa":"/ˈpeɪʃnt/","uz":"sabrli","ru":"терпеливый","ex":"A good teacher is patient."},{"w":"cheerful","pos":"adj","ipa":"/ˈtʃɪəfl/","uz":"quvnoq","ru":"весёлый","ex":"He is always cheerful."},{"w":"brave","pos":"adj","ipa":"/breɪv/","uz":"jasur","ru":"храбрый","ex":"The brave girl helped them."},{"w":"rude","pos":"adj","ipa":"/ruːd/","uz":"qopol","ru":"грубый","ex":"It's rude to interrupt."},{"w":"marry","pos":"v","ipa":"/ˈmæri/","uz":"turmush qurmoq","ru":"жениться","ex":"They will marry in June."},{"w":"divorce","pos":"n","ipa":"/dɪˈvɔːs/","uz":"ajrashish","ru":"развод","ex":"They got a divorce."},{"w":"support","pos":"v","ipa":"/səˈpɔːt/","uz":"qollab-quvvatlamoq","ru":"поддерживать","ex":"My family supports me."},{"w":"get on","pos":"phr","ipa":"/ɡet ɒn/","uz":"chiqishmoq","ru":"ладить","ex":"I get on well with my sister."}],"q":[{"q":"A person who is afraid to speak to new people is ___.","o":["confident","shy","proud","friendly"],"a":1,"e":"Shy = afraid to speak to others."},{"q":"'Mehribon' in English is ___.","o":["kind","shy","lonely","worried"],"a":0,"e":"‘Mehribon’ = kind."},{"q":"The opposite of 'shy' is ___.","o":["worried","lonely","confident","polite"],"a":2,"e":"shy ↔ confident."},{"q":"When you say sorry and please, you are ___.","o":["polite","lonely","worried","proud"],"a":0,"e":"Polite = well-mannered."},{"q":"A person who always tells the truth is ___.","o":["shy","honest","lonely","worried"],"a":1,"e":"Honest = truthful."}]}],"READING":[{"id":"r1","title":"A Trip to London","text":"Last summer, Daniel and his sister Olivia travelled to London for the first time. They took an early train from Manchester and arrived at about ten o'clock.\nFirst, they visited the British Museum, which was free and very interesting. After that, they had lunch in a small café near the river. In the afternoon, they went on a boat trip and saw many famous buildings.\nThe weather was warm and sunny all day. In the evening, they were tired but happy. They bought some souvenirs and took lots of photos before they caught the last train home.","level":"Easy","q":[{"q":"Where did Daniel and Olivia travel from?","o":["London","Manchester","Oxford","Leeds"],"a":1,"e":"They took a train from Manchester."},{"q":"What did they visit first?","o":["a café","the British Museum","a boat","a shop"],"a":1,"e":"First they visited the British Museum."},{"q":"How much did the museum cost?","o":["It was free.","Ten pounds.","Five pounds.","The text doesn't say."],"a":0,"e":"The museum was free."},{"q":"What did they do in the afternoon?","o":["had lunch","went on a boat trip","caught a train","visited a museum"],"a":1,"e":"In the afternoon they went on a boat trip."},{"q":"How did they feel in the evening?","o":["bored","angry","tired but happy","cold"],"a":2,"e":"They were tired but happy."}]},{"id":"r2","title":"My First Job","text":"My name is Sophie and I'm nineteen. Last year, I got my first job in a small bookshop in Bristol. At first, I was nervous because I didn't have any experience.\nMy manager, Mr Clarke, was very kind and patient. He showed me how to use the till and how to help customers find books. The other staff were friendly too, so I soon felt comfortable.\nI worked part-time, three days a week, and the salary wasn't very high. But I learned a lot, and I really enjoyed talking to customers about books. Now I want to study literature at university.","level":"Easy","q":[{"q":"Where does Sophie work?","o":["a café","a bookshop","a library","a hotel"],"a":1,"e":"She works in a bookshop in Bristol."},{"q":"How did she feel at first?","o":["bored","angry","nervous","tired"],"a":2,"e":"She was nervous because she had no experience."},{"q":"What is her manager like?","o":["unkind","kind and patient","lazy","strict"],"a":1,"e":"Mr Clarke was kind and patient."},{"q":"How often does she work?","o":["every day","three days a week","at weekends only","once a month"],"a":1,"e":"She works part-time, three days a week."},{"q":"What does Sophie want to do next?","o":["change jobs","study literature at university","open a shop","become a manager"],"a":1,"e":"She wants to study literature at university."}]},{"id":"r3","title":"An Email about a Holiday","text":"Hi Grace,\n\nHow are you? I'm writing from a small hotel in Brighton, where I've been since Monday. I'm having a wonderful time!\n\nI've already done so many things. I've walked along the beach, eaten fresh fish, and visited the famous pier. Yesterday I went swimming in the sea, although the water was quite cold. I haven't been shopping yet, but I'm planning to go tomorrow.\n\nThe weather has been mostly sunny, but it rained a little this morning. The people here are very friendly, and the food is delicious.\n\nI'll be home on Saturday. Let's meet next week — I'll show you my photos!\n\nLove,\nJack","level":"Medium","q":[{"q":"Where is Jack staying?","o":["a hotel in Brighton","a flat in London","a friend's house","a campsite"],"a":0,"e":"He's in a small hotel in Brighton."},{"q":"What has Jack NOT done yet?","o":["walk on the beach","eat fish","go shopping","visit the pier"],"a":2,"e":"He hasn't been shopping yet."},{"q":"How was the sea when he went swimming?","o":["warm","quite cold","dirty","dangerous"],"a":1,"e":"The water was quite cold."},{"q":"What was the weather like this morning?","o":["snowy","it rained a little","very hot","windy"],"a":1,"e":"It rained a little this morning."},{"q":"When will Jack go home?","o":["Monday","Wednesday","Saturday","next week"],"a":2,"e":"He'll be home on Saturday."}]},{"id":"r4","title":"Town or City?","text":"Many people argue about whether it is better to live in a big city or a small town. Both have advantages and disadvantages.\nBig cities, like London or Birmingham, are more exciting. There are more jobs, better shops, and lots of things to do in the evening. However, cities are usually more expensive and more crowded, and the air is often more polluted.\nSmall towns are quieter and cheaper. People are often friendlier and know their neighbours. On the other hand, there are fewer jobs, and young people sometimes find life a little boring.\nIn my opinion, the best choice depends on your age and your needs. When I was younger, I loved the city, but now I prefer the peace of a small town.","level":"Medium","q":[{"q":"What is one advantage of big cities?","o":["cheaper houses","more jobs and things to do","cleaner air","friendlier neighbours"],"a":1,"e":"Cities have more jobs and things to do."},{"q":"What is one disadvantage of big cities?","o":["too quiet","more expensive and crowded","no shops","no jobs"],"a":1,"e":"Cities are more expensive and crowded."},{"q":"According to the text, people in small towns are often ___.","o":["richer","friendlier","busier","ruder"],"a":1,"e":"People in small towns are often friendlier."},{"q":"Why might young people find small towns boring?","o":["too many people","there are fewer jobs and things to do","the air is polluted","houses are expensive"],"a":1,"e":"There are fewer jobs and less to do."},{"q":"What does the writer prefer now?","o":["a big city","the peace of a small town","living abroad","the writer doesn't say"],"a":1,"e":"Now the writer prefers the peace of a small town."}]},{"id":"r5","title":"The Lost Phone","text":"It was a cold Friday evening, and Emily was hurrying home from work. While she was waiting at the bus stop, she took out her phone to check the time. The bus arrived, and in the rush to get on, she didn't notice that her phone had fallen onto the seat next to her.\nWhen she got home, she realised her phone was missing. She felt terrible — all her photos and messages were on it. She borrowed her flatmate's phone and called her own number, but nobody answered.\nThe next morning, however, she received an email. A kind passenger named Harry had found the phone and seen her details on the screen. They arranged to meet at a café in the city centre, and Harry returned the phone. Emily was so grateful that she bought him a coffee. Now they are good friends.","level":"Hard","q":[{"q":"What was Emily doing when she lost her phone?","o":["sleeping","hurrying home from work","shopping","working in an office"],"a":1,"e":"She was hurrying home from work."},{"q":"How did she lose the phone?","o":["She dropped it in the street.","It fell onto the bus seat in the rush.","Someone stole it.","She left it at the office."],"a":1,"e":"It fell onto the seat as she rushed onto the bus."},{"q":"Why did she feel terrible?","o":["She missed the bus.","All her photos and messages were on the phone.","She had no money.","She was late for work."],"a":1,"e":"Her photos and messages were on the phone."},{"q":"How did Harry contact her?","o":["He phoned her.","He sent an email after seeing her details.","He visited her flat.","He wrote a letter."],"a":1,"e":"He emailed her after seeing her details on the screen."},{"q":"What happened in the end?","o":["She never found the phone.","Harry kept the phone.","Harry returned the phone and they became friends.","She bought a new phone."],"a":2,"e":"Harry returned it and now they are good friends."}]}],"LISTENING":[{"id":"l1","title":"A Job Interview","script":"Good morning. Please sit down. So, your name is Lucy, isn't it? Yes, that's right. And why do you want to work here? Well, I love books, and I have two years of experience in a shop in Leeds. That's great. The job is part-time, four days a week. The salary is twelve pounds an hour. Can you start next Monday? Yes, of course. Thank you very much.","level":"Easy","q":[{"q":"What is the woman's name?","o":["Grace","Lucy","Emily","Sophie"],"a":1,"e":"The interviewer confirms her name is Lucy."},{"q":"How much experience does she have?","o":["one year","two years","four years","no experience"],"a":1,"e":"She has two years of experience."},{"q":"In which city did she work before?","o":["London","Leeds","Brighton","Bristol"],"a":1,"e":"She worked in a shop in Leeds."},{"q":"How many days a week is the job?","o":["two","three","four","five"],"a":2,"e":"The job is part-time, four days a week."},{"q":"When can she start?","o":["today","next Monday","next month","she can't start"],"a":1,"e":"She can start next Monday."}]},{"id":"l2","title":"Booking a Hotel","script":"Good afternoon, Riverside Hotel. How can I help you? Hello, I'd like to book a room for two nights, please. Certainly. For how many people? For two adults. We have a double room for ninety pounds a night, including breakfast. That sounds good. I'll take it. Can I have your name, please? Yes, it's Tom Harris. Thank you, Mr Harris. We look forward to seeing you on Friday.","level":"Easy","q":[{"q":"How many nights does the man want to book?","o":["one","two","three","four"],"a":1,"e":"He wants a room for two nights."},{"q":"How many people is the room for?","o":["one adult","two adults","a family","three people"],"a":1,"e":"It's for two adults."},{"q":"How much is the room per night?","o":["ninety pounds","nineteen pounds","nine pounds","fifty pounds"],"a":0,"e":"The double room is ninety pounds a night."},{"q":"What is included in the price?","o":["dinner","breakfast","parking","a tour"],"a":1,"e":"The price includes breakfast."},{"q":"When will the man arrive?","o":["Thursday","Friday","Saturday","Sunday"],"a":1,"e":"They look forward to seeing him on Friday."}]},{"id":"l3","title":"Weekend Plans","script":"Hi Olivia, what are you going to do this weekend? Hi Daniel. On Saturday I'm going to visit my grandmother in Oxford. Then on Sunday, if the weather is nice, I'm going to go cycling with some friends. That sounds fun. Would you like to join us on Sunday? I'd love to, but I have to study for my exam on Monday. Oh, that's a shame. Maybe next time. Yes, definitely. Good luck with your exam!","level":"Medium","q":[{"q":"What is Olivia going to do on Saturday?","o":["go cycling","visit her grandmother","study","stay at home"],"a":1,"e":"On Saturday she's visiting her grandmother in Oxford."},{"q":"Where does her grandmother live?","o":["London","Oxford","Brighton","Leeds"],"a":1,"e":"Her grandmother lives in Oxford."},{"q":"What will decide if she goes cycling?","o":["her exam","the weather","her friends","her grandmother"],"a":1,"e":"She'll go cycling if the weather is nice."},{"q":"Why can't Daniel go cycling on Sunday?","o":["He's busy at work.","He has to study for an exam.","He doesn't have a bike.","He's visiting family."],"a":1,"e":"He has to study for his exam on Monday."},{"q":"When is Daniel's exam?","o":["Saturday","Sunday","Monday","Friday"],"a":2,"e":"His exam is on Monday."}]},{"id":"l4","title":"A Travel Announcement","script":"Good morning, passengers. This is an announcement for the ten-thirty train to London. We are sorry to say that this train is delayed by about twenty minutes because of bad weather. The train will now leave from platform four, not platform two. Passengers travelling to Brighton should change at Gatwick. The café on platform one is open if you would like a hot drink while you wait. Thank you for your patience.","level":"Medium","q":[{"q":"Where is the train going?","o":["Brighton","London","Oxford","Gatwick"],"a":1,"e":"It's the ten-thirty train to London."},{"q":"Why is the train delayed?","o":["an accident","bad weather","too many passengers","a broken engine"],"a":1,"e":"It's delayed because of bad weather."},{"q":"How long is the delay?","o":["ten minutes","about twenty minutes","an hour","two minutes"],"a":1,"e":"The delay is about twenty minutes."},{"q":"Which platform will the train leave from now?","o":["platform one","platform two","platform four","platform ten"],"a":2,"e":"It will now leave from platform four."},{"q":"Where should passengers to Brighton change?","o":["London","Gatwick","Oxford","platform one"],"a":1,"e":"They should change at Gatwick."}]}],"GMORE":{"g1":{"situation":"“What did you do yesterday?” “I <b>watched</b> a film and <b>went</b> to bed early.” — Use the past simple for finished actions at a definite past time.","timeline":{"art":["     ✕ (yesterday)","─────●───────────────► now","   finished"],"note":"A completed action at a known time in the past."},"mistakes":[{"x":"I goed home. / She buyed it.","v":"I <b>went</b> home. / She <b>bought</b> it. (irregular verbs)"},{"x":"Did you went there?","v":"<b>Did</b> you <b>go</b> there? (after did → base verb)"},{"x":"I didn’t saw him.","v":"I <b>didn’t see</b> him."}],"examples":["\"I <b>visited</b> my grandparents last weekend.\"","\"She <b>bought</b> a new dress yesterday.\"","\"We <b>went</b> to the cinema on Friday.\"","\"They <b>didn’t come</b> to the party.\"","\"<b>Did</b> you <b>see</b> the match?\"","\"He <b>wrote</b> me a long letter.\"","\"It <b>rained</b> all day.\"","\"I <b>didn’t have</b> time to call you.\""]},"g2":{"situation":"“At 8 o’clock last night I <b>was watching</b> TV when the phone <b>rang</b>.” — The past continuous sets the longer background; the past simple is the shorter action that interrupts it.","timeline":{"art":["   ▓▓▓▓▓▓▓✕▓▓▓▓▓▓▓","──────────●──────────► now","  was watching | rang"],"note":"Long action in progress (was -ing) interrupted by a short one (past simple)."},"compare":{"a":{"h":"Past continuous (background)","ex":["I <b>was cooking</b> at 6.","They <b>were sleeping</b>."]},"b":{"h":"Past simple (interruption)","ex":["…when she <b>called</b>.","…when it <b>started</b> to rain."]}},"mistakes":[{"x":"I was watch TV.","v":"I <b>was watching</b> TV. (was/were + -ing)"},{"x":"While I cooked, he arrived.","v":"While I <b>was cooking</b>, he arrived."}],"examples":["\"At 8 o’clock I <b>was having</b> dinner.\"","\"She <b>was reading</b> when I arrived.\"","\"They <b>were playing</b> football all afternoon.\"","\"It <b>was snowing</b> when we left.\"","\"What <b>were</b> you <b>doing</b> at midnight?\"","\"We <b>were waiting</b> when the bus came.\"","\"He <b>wasn’t listening</b> to the teacher.\"","\"While I <b>was cooking</b>, the phone rang.\""]},"g3":{"situation":"“I <b>have visited</b> London twice.” We don’t say <i>when</i> — the experience matters now, not the exact time.","timeline":{"art":["  ✕    ✕    ✕  (at some time before now)","──────────────────●──► now","        ?  ?  ?"],"note":"A past action connected to now — no definite time."},"mistakes":[{"x":"I have seen him yesterday.","v":"I <b>saw</b> him yesterday. (definite time → past simple)"},{"x":"She has went home.","v":"She has <b>gone</b> home. (past participle)"},{"x":"I am here since Monday.","v":"I <b>have been</b> here since Monday."}],"examples":["\"I <b>have visited</b> London twice.\"","\"She <b>has just finished</b> her homework.\"","\"We <b>have never eaten</b> sushi.\"","\"<b>Have</b> you <b>ever been</b> to Paris?\"","\"He <b>has lived</b> here since 2019.\"","\"They <b>haven’t arrived</b> yet.\"","\"I <b>have already seen</b> that film.\"","\"She <b>has lost</b> her keys.\""]},"g4":{"compare":{"title":"will vs. going to","a":{"h":"will — decisions & predictions","ex":["(phone rings) I’<b>ll</b> get it.","I think it <b>’ll</b> rain."]},"b":{"h":"going to — plans & evidence","ex":["We<b>’re going to</b> move house.","Look — it<b>’s going to</b> rain!"]}},"mistakes":[{"x":"I will to call you.","v":"I <b>will call</b> you. (will + base verb)"},{"x":"Look at the clouds — it will rain.","v":"…it<b>’s going to</b> rain. (evidence now → going to)"}],"examples":["\"I think it <b>will rain</b> tomorrow.\"","\"We <b>are going to</b> buy a house.\"","\"(phone rings) I <b>’ll get</b> it.\"","\"Look at the clouds — it <b>’s going to</b> snow.\"","\"She <b>will be</b> twenty next month.\"","\"They <b>are going to</b> visit us soon.\"","\"<b>Will</b> you <b>help</b> me?\"","\"I’m sure you <b>’ll pass</b> the exam.\""]},"g5":{"compare":{"title":"comparative vs. superlative","a":{"h":"Comparative (2 things)","ex":["taller <b>than</b>","more expensive <b>than</b>","better <b>than</b>"]},"b":{"h":"Superlative (3+)","ex":["<b>the</b> tallest","<b>the</b> most expensive","<b>the</b> best"]}},"mistakes":[{"x":"She is more taller than me.","v":"She is <b>taller</b> than me. (don’t use “more” with -er)"},{"x":"It is the most big.","v":"It is the <b>biggest</b>. (short adjective → -est)"},{"x":"He is more good.","v":"He is <b>better</b>. (irregular)"}],"examples":["\"This box is <b>heavier than</b> that one.\"","\"She is <b>the tallest</b> in the class.\"","\"My phone is <b>more expensive than</b> yours.\"","\"Today is <b>the hottest</b> day of the year.\"","\"He runs <b>faster than</b> me.\"","\"It’s <b>the best</b> restaurant in town.\"","\"This test was <b>easier than</b> the last one.\"","\"Mount Everest is <b>the highest</b> mountain.\""]},"g6":{"compare":{"title":"adjective vs. adverb","a":{"h":"Adjective (describes a noun)","ex":["a <b>quick</b> runner","She is <b>careful</b>."]},"b":{"h":"Adverb (describes a verb)","ex":["He runs <b>quickly</b>.","She drives <b>carefully</b>."]}},"mistakes":[{"x":"He speaks very good English.","v":"He speaks English very <b>well</b>. (good → well)"},{"x":"She sings beautiful.","v":"She sings <b>beautifully</b>. (verb → adverb)"}],"examples":["\"She speaks English <b>fluently</b>.\"","\"He drives <b>carefully</b>.\"","\"They worked <b>hard</b> all day.\"","\"The children played <b>happily</b>.\"","\"Please speak more <b>slowly</b>.\"","\"She sings <b>beautifully</b>.\"","\"He answered the question <b>correctly</b>.\"","\"I sleep <b>well</b> at weekends.\""]},"g7":{"compare":{"title":"much / many / a lot of","a":{"h":"Countable","ex":["How <b>many</b> books?","not <b>many</b> people","<b>a lot of</b> friends"]},"b":{"h":"Uncountable","ex":["How <b>much</b> water?","not <b>much</b> time","<b>a lot of</b> money"]}},"mistakes":[{"x":"How much books?","v":"How <b>many</b> books? (countable → many)"},{"x":"I have many money.","v":"I have <b>a lot of</b> money. (uncountable, positive → a lot of)"}],"examples":["\"How <b>many</b> books do you have?\"","\"How <b>much</b> water do you drink?\"","\"There aren’t <b>many</b> people here.\"","\"I don’t have <b>much</b> time.\"","\"We have <b>a lot of</b> homework.\"","\"She has <b>a lot of</b> friends.\"","\"There’s <b>too much</b> noise.\"","\"He drinks <b>too many</b> coffees.\""]},"g8":{"compare":{"title":"two patterns","a":{"h":"verb + to","ex":["want <b>to go</b>","decide <b>to leave</b>","hope <b>to win</b>"]},"b":{"h":"verb + -ing","ex":["enjoy <b>reading</b>","finish <b>working</b>","avoid <b>driving</b>"]}},"mistakes":[{"x":"I want going home.","v":"I want <b>to go</b> home. (want + to)"},{"x":"I enjoy to swim.","v":"I enjoy <b>swimming</b>. (enjoy + -ing)"}],"examples":["\"I want <b>to learn</b> Spanish.\"","\"She enjoys <b>swimming</b>.\"","\"They decided <b>to leave</b> early.\"","\"He finished <b>working</b> at six.\"","\"We hope <b>to see</b> you soon.\"","\"I can’t stand <b>waiting</b>.\"","\"She promised <b>to call</b> me.\"","\"Avoid <b>driving</b> at night.\""]},"g9":{"compare":{"title":"the key difference","a":{"h":"Present perfect (no time)","ex":["I <b>have seen</b> that film.","She <b>has just left</b>."]},"b":{"h":"Past simple (finished time)","ex":["I <b>saw</b> it last week.","She <b>left</b> at 6."]}},"mistakes":[{"x":"I have finished it yesterday.","v":"I <b>finished</b> it yesterday. (yesterday = finished time)"},{"x":"Did you ever eat sushi?","v":"<b>Have</b> you ever <b>eaten</b> sushi? (life experience → present perfect)"}],"examples":["\"I <b>have seen</b> that film. (no time)\"","\"I <b>saw</b> it last night. (finished time)\"","\"She <b>has lived</b> here for years.\"","\"She <b>lived</b> in Rome in 2010.\"","\"<b>Have</b> you <b>finished</b> yet?\"","\"<b>Did</b> you <b>finish</b> yesterday?\"","\"We <b>have just arrived</b>.\"","\"We <b>arrived</b> an hour ago.\""]},"g10":{"situation":"“I <b>used to play</b> tennis, but I stopped years ago.” — <b>used to</b> describes a past habit or state that is no longer true.","mistakes":[{"x":"I use to live here.","v":"I <b>used to</b> live here. (affirmative: used)"},{"x":"I didn’t used to smoke.","v":"I <b>didn’t use to</b> smoke. (after did → use, no -d)"}],"examples":["\"I <b>used to play</b> the piano.\"","\"She <b>used to have</b> short hair.\"","\"We <b>used to live</b> in a village.\"","\"He <b>didn’t use to</b> like vegetables.\"","\"<b>Did</b> you <b>use to</b> smoke?\"","\"They <b>used to walk</b> to school.\"","\"I <b>used to be</b> very shy.\"","\"There <b>used to be</b> a cinema here.\""]},"g11":{"compare":{"title":"obligation","a":{"h":"must / have to (necessary)","ex":["You <b>must</b> stop here.","I <b>have to</b> work."]},"b":{"h":"mustn’t / don’t have to","ex":["You <b>mustn’t</b> smoke. (forbidden)","You <b>don’t have to</b> come. (not necessary)"]}},"mistakes":[{"x":"You mustn’t pay — it’s free, so it’s OK not to.","v":"You <b>don’t have to</b> pay. (no obligation ≠ mustn’t)"},{"x":"He must to go.","v":"He <b>must go</b>. (must + base verb)"}],"examples":["\"You <b>must</b> wear a seatbelt.\"","\"I <b>have to</b> work on Saturday.\"","\"You <b>mustn’t</b> smoke here.\"","\"You <b>don’t have to</b> pay — it’s free.\"","\"You <b>should</b> see a doctor.\"","\"He <b>shouldn’t</b> drive so fast.\"","\"We <b>have to</b> leave now.\"","\"<b>Should</b> I call her?\""]},"g12":{"situation":"“If it <b>rains</b> tomorrow, we <b>’ll stay</b> at home.” — The first conditional talks about a real, likely future result.","mistakes":[{"x":"If it will rain, I will stay in.","v":"If it <b>rains</b>, I will stay in. (no “will” after if)"},{"x":"If you study, you passed.","v":"If you study, you <b>’ll pass</b>."}],"examples":["\"If it <b>rains</b>, we <b>’ll stay</b> in.\"","\"If you <b>study</b>, you <b>’ll pass</b>.\"","\"She <b>’ll be</b> happy if you <b>come</b>.\"","\"If I <b>have</b> time, I <b>’ll call</b> you.\"","\"We <b>’ll miss</b> the bus if we <b>don’t hurry</b>.\"","\"If he <b>asks</b>, I <b>’ll help</b> him.\"","\"What <b>will</b> you do if it <b>snows</b>?\"","\"If you <b>heat</b> the soup, it <b>’ll be</b> nicer.\""]},"g13":{"compare":{"title":"who / which / where","a":{"h":"who (people) · which (things)","ex":["the man <b>who</b> called","the book <b>which</b> I read"]},"b":{"h":"where (places)","ex":["the town <b>where</b> I live"]}},"mistakes":[{"x":"The man which called…","v":"The man <b>who</b> called… (people → who)"},{"x":"That’s the house which I live.","v":"That’s the house <b>where</b> I live. (place → where)"}],"examples":["\"The woman <b>who</b> called is my boss.\"","\"This is the book <b>which</b> I told you about.\"","\"That’s the house <b>where</b> I grew up.\"","\"He’s the man <b>whose</b> car was stolen.\"","\"The film <b>that</b> we saw was great.\"","\"She’s the teacher <b>who</b> helped me.\"","\"It’s a phone <b>which</b> takes good photos.\"","\"This is the café <b>where</b> we met.\""]},"g14":{"compare":{"title":"reason vs. result vs. contrast","a":{"h":"because (reason) · so (result)","ex":["I stayed in <b>because</b> it rained.","It rained, <b>so</b> I stayed in."]},"b":{"h":"but / although (contrast)","ex":["It rained, <b>but</b> we went out.","<b>Although</b> it rained, we went out."]}},"mistakes":[{"x":"Because it was late, so we left.","v":"Use one linker: <b>Because</b> it was late, we left. (not both)"},{"x":"Although it was hard but he tried.","v":"<b>Although</b> it was hard, he tried. (no “but” with “although”)"}],"examples":["\"I stayed home <b>because</b> I was tired.\"","\"It was late, <b>so</b> we left.\"","\"I wanted to come, <b>but</b> I couldn’t.\"","\"<b>Although</b> it was raining, we went out.\"","\"She passed <b>because</b> she studied hard.\"","\"He was ill, <b>so</b> he stayed in bed.\"","\"The film was long <b>but</b> interesting.\"","\"<b>Although</b> he is rich, he isn’t happy.\""]},"g15":{"compare":{"title":"positive ↔ negative tag","a":{"h":"Positive sentence → negative tag","ex":["You’re tired, <b>aren’t you</b>?","He likes it, <b>doesn’t he</b>?"]},"b":{"h":"Negative sentence → positive tag","ex":["You aren’t tired, <b>are you</b>?","He doesn’t like it, <b>does he</b>?"]}},"mistakes":[{"x":"You’re ready, isn’t it?","v":"You’re ready, <b>aren’t you</b>? (match the verb & subject)"},{"x":"She can swim, can she?","v":"She can swim, <b>can’t she</b>? (positive → negative tag)"}],"examples":["\"You’re tired, <b>aren’t you</b>?\"","\"He likes coffee, <b>doesn’t he</b>?\"","\"They aren’t here, <b>are they</b>?\"","\"She can swim, <b>can’t she</b>?\"","\"It’s cold today, <b>isn’t it</b>?\"","\"You don’t smoke, <b>do you</b>?\"","\"We’ve met before, <b>haven’t we</b>?\"","\"He won’t mind, <b>will he</b>?\""]}}},"B1":{"GRAMMAR":[{"id":"g1","title":"Present perfect continuous","lead":"The present perfect continuous links the past to the present and emphasises the duration or repetition of an activity, especially one that is still going on or has only just stopped.","blocks":[{"h":"Form: have/has been + -ing","p":["Use <b>have/has been</b> + verb-ing. It focuses on the activity itself rather than the finished result."],"ex":["I <b>have been working</b> all day. · She <b>has been studying</b> since nine."]},{"h":"for & since","p":["Use <b>for</b> + a period and <b>since</b> + a starting point to show how long the activity has lasted."],"ex":["We<b>’ve been waiting for</b> two hours. · He<b>’s been living</b> here <b>since</b> 2019."]},{"h":"Continuous vs. simple","p":["The continuous stresses <b>how long / how active</b>; the simple stresses the <b>completed result</b>."],"ex":["I<b>’ve been reading</b> this book. (still reading) · I<b>’ve read</b> this book. (finished)"]},{"h":"Recent activity with a result","p":["It can explain a present situation caused by a recent activity."],"ex":["You look tired. — Yes, I<b>’ve been running</b>."]}],"tip":"Don’t use the continuous with state verbs (know, like, be, have = possess): say ‘I <b>have known</b> her for years’, not ‘I have been knowing’.","examples":["\"I <b>’ve been learning</b> English for five years.\"","\"It <b>has been raining</b> all morning.\"","\"They <b>’ve been working</b> on the project since Monday.\"","\"Why are you so dirty? — I <b>’ve been gardening</b>.\"","\"She <b>’s been feeling</b> ill recently.\"","\"We <b>’ve been waiting</b> for ages.\""],"q":[{"q":"I ___ for two hours and I'm still not finished.","o":["have worked","have been working","work","am working"],"a":1,"d":"easy","e":"Ongoing activity + duration → have been working."},{"q":"She ___ since this morning.","o":["has studied","has been studying","studies","studied"],"a":1,"d":"easy","e":"Still going → has been studying."},{"q":"How long ___ you ___ here?","o":["have / lived","have / been living","do / live","are / living"],"a":1,"d":"easy","e":"Duration of an ongoing situation → have you been living."},{"q":"It ___ all day; the streets are wet.","o":["has rained","has been raining","rains","is raining"],"a":1,"d":"easy","e":"Activity with present result → has been raining."},{"q":"They ___ football for an hour.","o":["have been playing","have played","play","are play"],"a":0,"d":"easy","e":"Duration of activity → have been playing."},{"q":"Choose the duration form: 'We ___ for ages.'","o":["have waited","have been waiting","wait","waited"],"a":1,"d":"med","e":"Emphasis on how long → have been waiting."},{"q":"You're out of breath. What ___ you ___?","o":["have / done","have / been doing","did / do","are / doing"],"a":1,"d":"med","e":"Recent activity explaining a state → have you been doing."},{"q":"He ___ here since 2018.","o":["has been living","has lived","lives","lived"],"a":0,"d":"med","e":"Both are possible, but with ‘since’ + ongoing the continuous is natural: has been living."},{"q":"Which verb is wrong in the continuous?","o":["working","studying","knowing","running"],"a":2,"d":"med","e":"‘know’ is a state verb → not used in the continuous."},{"q":"Complete: 'My eyes hurt because I ___ at the screen.'","o":["have stared","have been staring","stare","stared"],"a":1,"d":"med","e":"Recent ongoing activity → have been staring."},{"q":"Find the mistake: 'I have been knowing him for years.'","o":["b
