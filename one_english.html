een knowing → known","have → has","for → since","no mistake"],"a":0,"d":"hard","e":"State verb: I have known him for years."},{"q":"Complete: 'She ___ all morning, so the cake is ready.'","o":["has been baking","has baked","baked","bakes"],"a":0,"d":"hard","e":"Activity over a period explaining a result → has been baking."},{"q":"Which sentence stresses the finished result?","o":["I've been writing three emails.","I've written three emails.","I'm writing three emails.","I write three emails."],"a":1,"d":"hard","e":"Completed result with a number → present perfect simple: I’ve written three emails."},{"q":"Complete: 'They ___ in this town ___ ten years and they love it.'","o":["have been living / since","have been living / for","have lived / since","are living / for"],"a":1,"d":"hard","e":"Ongoing + period → have been living for ten years."},{"q":"Choose the natural sentence.","o":["How long have you been waiting?","How long do you wait?","How long are you waiting?","How long have you waited continuously?"],"a":0,"d":"hard","e":"Duration of an ongoing wait → have you been waiting."}]},{"id":"g2","title":"Past perfect","lead":"The past perfect shows that one past action happened before another past action. It helps to make the order of events in a story clear.","blocks":[{"h":"Form: had + past participle","p":["Use <b>had</b> + past participle for the earlier of two past actions."],"ex":["When I arrived, the train <b>had</b> already <b>left</b>."]},{"h":"With past simple","p":["Often used with the past simple: the past perfect = the earlier action; the past simple = the later one."],"ex":["She <b>had finished</b> dinner before he <b>came</b> home."]},{"h":"after, before, when, by the time","p":["Common with these time linkers to show sequence."],"ex":["<b>By the time</b> we got there, the film <b>had started</b>."]},{"h":"Negatives & questions","p":["Negative: hadn’t + past participle. Question: Had + subject + past participle?"],"ex":["I <b>hadn’t seen</b> her before. · <b>Had</b> you <b>eaten</b> when they called?"]}],"tip":"Use the past perfect only when you need to show one past event happened <b>before</b> another. For a simple sequence (first… then…), the past simple alone is enough.","examples":["\"When we arrived, the party <b>had</b> already <b>started</b>.\"","\"She <b>had never flown</b> before that day.\"","\"They <b>had finished</b> the work before the boss returned.\"","\"By the time I woke up, he <b>had left</b>.\"","\"I knew I <b>had met</b> him somewhere.\"","\"<b>Had</b> you <b>booked</b> the room before you arrived?\""],"q":[{"q":"When I arrived, the train ___.","o":["already left","had already left","has already left","leaves"],"a":1,"d":"easy","e":"Earlier past action → had already left."},{"q":"She ___ dinner before he came home.","o":["finished","had finished","has finished","finishes"],"a":1,"d":"easy","e":"Earlier action → had finished."},{"q":"The past perfect of 'see' is ___.","o":["had saw","had seen","has seen","saw"],"a":1,"d":"easy","e":"had + past participle: had seen."},{"q":"By the time we got there, the film ___.","o":["started","had started","starts","has started"],"a":1,"d":"easy","e":"Earlier action → had started."},{"q":"They ___ never ___ sushi before that trip.","o":["had / eaten","have / eaten","did / eat","had / ate"],"a":0,"d":"easy","e":"had + past participle: had eaten."},{"q":"I recognised her because I ___ her before.","o":["met","had met","have met","meet"],"a":1,"d":"med","e":"Earlier action → had met."},{"q":"After he ___ the letter, he posted it.","o":["wrote","had written","has written","writes"],"a":1,"d":"med","e":"First action → had written."},{"q":"We were late; the meeting ___ already ___.","o":["had / begun","have / begun","did / begin","had / began"],"a":0,"d":"med","e":"had + past participle: had begun."},{"q":"___ you ever ___ abroad before that holiday?","o":["Have / been","Had / been","Did / be","Had / be"],"a":1,"d":"med","e":"Past perfect question: Had you been?"},{"q":"Choose the earlier action: 'When I phoned, she ___.'","o":["went out","had gone out","goes out","has gone out"],"a":1,"d":"med","e":"Before the phone call → had gone out."},{"q":"Find the mistake: 'After I had ate, I went out.'","o":["had ate → had eaten","went → had gone","After → Before","no mistake"],"a":0,"d":"hard","e":"Past participle of eat is eaten: had eaten."},{"q":"Complete: 'By the time the police arrived, the thief ___.'","o":["escaped","had escaped","has escaped","escapes"],"a":1,"d":"hard","e":"Earlier action → had escaped."},{"q":"Which order is correct?","o":["He had left before I arrived.","He left before I had arrived.","He had left before I had arrived.","He leaves before I arrive."],"a":0,"d":"hard","e":"Earlier action ‘had left’ + later ‘arrived’."},{"q":"Complete: 'I didn't recognise the town because it ___ so much.'","o":["changed","had changed","has changed","changes"],"a":1,"d":"hard","e":"Change happened before → had changed."},{"q":"Choose the natural sentence.","o":["When the guests arrived, she had cooked dinner.","When the guests arrived, she has cooked dinner.","When the guests arrived, she cooks dinner.","When the guests had arrived, she has cooked."],"a":0,"d":"hard","e":"Dinner cooked before guests arrived → had cooked."}]},{"id":"g3","title":"Future forms","lead":"English uses several forms to talk about the future. Choosing the right one depends on whether you mean a prediction, a plan, an arrangement, a timetable or an instant decision.","blocks":[{"h":"will & be going to","p":["<b>will</b> = predictions, instant decisions, offers, promises. <b>be going to</b> = plans/intentions and predictions from evidence."],"ex":["It <b>will</b> snow tonight. · We<b>’re going to</b> paint the house."]},{"h":"Present continuous (arrangements)","p":["Use the present continuous for fixed arrangements, usually with a time and another person."],"ex":["I<b>’m meeting</b> Sara at six. · They<b>’re flying</b> to Rome on Friday."]},{"h":"Present simple (timetables)","p":["Use the present simple for timetabled events (transport, programmes, schedules)."],"ex":["The train <b>leaves</b> at 9:15. · The film <b>starts</b> at eight."]},{"h":"may / might (possibility)","p":["Use <b>may/might</b> for things that are possible but not certain."],"ex":["It <b>might</b> rain later. · I <b>may</b> go to the party."]}],"tip":"For a <b>plan</b> use ‘going to’; for an <b>arrangement</b> with a time use the present continuous; for a <b>timetable</b> use the present simple; for an <b>instant decision</b> use ‘will’.","examples":["\"Look at the clouds — it <b>’s going to</b> rain.\"","\"I think she <b>’ll</b> pass the exam.\"","\"We <b>’re having</b> dinner with friends tonight.\"","\"The bus <b>leaves</b> at half past seven.\"","\"I <b>might</b> visit my cousin at the weekend.\"","\"Don’t worry, I <b>’ll</b> carry that for you.\""],"q":[{"q":"Look at that car! It ___ crash.","o":["will","is going to","might to","goes to"],"a":1,"d":"easy","e":"Prediction from evidence → is going to crash."},{"q":"The train ___ at 10:30.","o":["will leave","is leaving","leaves","is going to leave"],"a":2,"d":"easy","e":"Timetable → present simple: leaves."},{"q":"I ___ Tom for coffee at four. (arrangement)","o":["will meet","am meeting","meet","might meet"],"a":1,"d":"easy","e":"Fixed arrangement → present continuous."},{"q":"(phone rings) I ___ get it.","o":["am going to","will","am getting","might"],"a":1,"d":"easy","e":"Instant decision → will."},{"q":"It ___ rain later, but I'm not sure.","o":["will","might","is going to","does"],"a":1,"d":"easy","e":"Possibility → might."},{"q":"We ___ visit Spain next summer. (plan)","o":["will","are going to","are visiting now","might to"],"a":1,"d":"med","e":"Plan → are going to visit."},{"q":"The match ___ at 8 pm tonight.","o":["will start","starts","is starting now","is going to start"],"a":1,"d":"med","e":"Scheduled → present simple: starts."},{"q":"She ___ to the dentist tomorrow at nine. (arrangement)","o":["will go","is going","goes","might go"],"a":1,"d":"med","e":"Arrangement with time → present continuous."},{"q":"I'm cold. — I ___ close the window.","o":["am going to","will","close","might"],"a":1,"d":"med","e":"Offer/instant decision → will."},{"q":"Choose the evidence-based prediction.","o":["She will have a baby — look!","She's going to have a baby — look!","She has a baby soon.","She might to have a baby."],"a":1,"d":"med","e":"Evidence now → is going to."},{"q":"Find the mistake: 'The plane will arrive at 6, it's the timetable.'","o":["will arrive → arrives","6 → six","plane → flight","no mistake"],"a":0,"d":"hard","e":"Timetable → present simple: arrives."},{"q":"Complete: 'We ___ (plan) move house, and I think it ___ (prediction) be stressful.'","o":["will / are going to","are going to / will","are going to / are going to","will / will"],"a":1,"d":"hard","e":"Plan → going to; prediction → will."},{"q":"Which shows a possibility?","o":["I'm definitely going.","I might go.","I'm going at six.","The bus goes at six."],"a":1,"d":"hard","e":"Uncertain future → might go."},{"q":"Complete: 'Hurry! The film ___ at eight and we ___ Jack there.'","o":["will start / will meet","starts / are meeting","is starting / meet","starts / will meet"],"a":1,"d":"hard","e":"Timetable ‘starts’ + arrangement ‘are meeting’."},{"q":"Choose the natural arrangement sentence.","o":["I have dinner with them tonight.","I'm having dinner with them tonight.","I will have dinner with them, it's arranged.","I might have dinner tonight, it's arranged."],"a":1,"d":"hard","e":"Fixed arrangement → present continuous."}]},{"id":"g4","title":"Second conditional","lead":"The second conditional talks about imaginary, unlikely or unreal present and future situations. It uses the past simple in the if-clause and ‘would’ in the result clause.","blocks":[{"h":"Form: if + past simple, would + base","p":["The past tense here doesn’t mean past time — it shows the situation is hypothetical."],"ex":["<b>If</b> I <b>had</b> more money, I <b>would</b> travel."]},{"h":"were for all persons","p":["With ‘be’, we often use <b>were</b> for all persons, especially in advice with ‘If I were you’."],"ex":["If I <b>were</b> you, I<b>’d</b> apologise. · If she <b>were</b> here, she’d help."]},{"h":"would / could / might","p":["Use <b>could</b> (ability/possibility) or <b>might</b> (possible result) instead of ‘would’."],"ex":["If I had a car, I <b>could</b> drive you. · We <b>might</b> win if we tried."]},{"h":"first vs. second","p":["First conditional = real/likely; second conditional = unlikely/unreal."],"ex":["If it <b>rains</b>, I’ll stay in. (likely) · If it <b>snowed</b> in July, I’d be shocked. (unreal)"]}],"tip":"For advice, ‘<b>If I were you, I’d…</b>’ is the natural phrase. Don’t mix forms: ‘If I <b>would have</b> money’ is wrong → ‘If I <b>had</b> money, I would…’.","examples":["\"If I <b>won</b> the lottery, I <b>would</b> buy a house.\"","\"If I <b>were</b> you, I <b>’d</b> see a doctor.\"","\"She <b>would</b> travel more if she <b>had</b> time.\"","\"If we <b>lived</b> by the sea, we <b>could</b> swim every day.\"","\"What <b>would</b> you do if you <b>lost</b> your job?\"","\"If he <b>spoke</b> French, he <b>might</b> get the job.\""],"q":[{"q":"If I ___ rich, I would buy a yacht.","o":["am","were","will be","would be"],"a":1,"d":"easy","e":"Second conditional: if + past (were)."},{"q":"If I had time, I ___ help you.","o":["will","would","had","am"],"a":1,"d":"easy","e":"Result → would help."},{"q":"If I ___ you, I'd apologise.","o":["am","was being","were","will be"],"a":2,"d":"easy","e":"Advice → If I were you."},{"q":"She would travel if she ___ more money.","o":["has","had","will have","would have"],"a":1,"d":"easy","e":"if + past simple: had."},{"q":"If we lived nearer, we ___ visit more often.","o":["will","would","had","are"],"a":1,"d":"easy","e":"Result → would visit."},{"q":"What ___ you do if you won a million?","o":["will","would","did","do"],"a":1,"d":"med","e":"Hypothetical → would you do."},{"q":"If he ___ harder, he'd pass.","o":["studies","studied","will study","would study"],"a":1,"d":"med","e":"if + past simple: studied."},{"q":"I ___ buy it if it weren't so expensive.","o":["will","would","had","am"],"a":1,"d":"med","e":"Result → would buy."},{"q":"If I had a car, I ___ drive you home.","o":["can","could","will","would to"],"a":1,"d":"med","e":"Ability in result → could drive."},{"q":"Choose the unreal situation.","o":["If it rains, I'll stay in.","If it snowed in summer, I'd be amazed.","If I have time, I'll call.","If you heat ice, it melts."],"a":1,"d":"med","e":"Unlikely/unreal → second conditional."},{"q":"Find the mistake: 'If I would have money, I would travel.'","o":["would have → had","would travel → travel","If → When","no mistake"],"a":0,"d":"hard","e":"No ‘would’ in the if-clause: If I had money…"},{"q":"Complete: 'If she ___ here, she ___ what to do.'","o":["was / would know","were / would know","is / knows","were / knew"],"a":1,"d":"hard","e":"were (be) + would know."},{"q":"Which is correct?","o":["If I was you, I will help.","If I were you, I would help.","If I am you, I would help.","If I were you, I will help."],"a":1,"d":"hard","e":"If I were you, I would help."},{"q":"Complete: 'We ___ win the match if we ___ as a team.'","o":["will / play","would / played","would / play","will / played"],"a":1,"d":"hard","e":"would win + played (past)."},{"q":"Choose the natural advice.","o":["If I were you, I'd take the job.","If I am you, I take the job.","If I would be you, I take the job.","If I was you, I'll take the job."],"a":0,"d":"hard","e":"If I were you, I’d take the job."}]},{"id":"g5","title":"Modals of deduction (present)","lead":"We use modal verbs to say how certain we are about a present situation. ‘Must’ shows we are almost sure something is true; ‘can’t’ that it is impossible; ‘might/may/could’ that it is possible.","blocks":[{"h":"must (almost certain)","p":["Use <b>must</b> + base verb when you are sure something is true based on evidence."],"ex":["The light’s on — she <b>must</b> be home."]},{"h":"can’t (impossible)","p":["Use <b>can’t</b> (not ‘mustn’t’) when you are sure something is not true."],"ex":["He <b>can’t</b> be hungry; he’s just eaten."]},{"h":"might / may / could (possible)","p":["Use these for things that are possible but uncertain."],"ex":["She <b>might</b> be at work. · They <b>could</b> be lost."]},{"h":"with continuous","p":["Use modal + <b>be + -ing</b> for an action happening now."],"ex":["He’s not answering — he <b>must be sleeping</b>."]}],"tip":"The opposite of ‘must be’ (sure it is) is ‘<b>can’t</b> be’ (sure it isn’t), <b>not</b> ‘mustn’t be’. ‘Mustn’t’ means prohibition, not deduction.","examples":["\"You’ve worked all day — you <b>must</b> be tired.\"","\"That <b>can’t</b> be John; he’s in Spain.\"","\"She <b>might</b> know the answer.\"","\"They <b>must be having</b> dinner; the lights are on.\"","\"It <b>could</b> be true, but I’m not sure.\"","\"He <b>can’t</b> be serious!\""],"q":[{"q":"The lights are on, so she ___ be home.","o":["can't","must","mustn't","couldn't"],"a":1,"d":"easy","e":"Sure it’s true → must be."},{"q":"He's just eaten, so he ___ be hungry.","o":["must","can't","might","may"],"a":1,"d":"easy","e":"Sure it’s not true → can’t be."},{"q":"I'm not sure, but she ___ be at work.","o":["must","can't","might","mustn't"],"a":2,"d":"easy","e":"Possible → might be."},{"q":"That ___ be true — it's impossible!","o":["must","might","can't","may"],"a":2,"d":"easy","e":"Impossible → can’t be."},{"q":"They aren't answering. They ___ be out.","o":["can't","might","mustn't","couldn't"],"a":1,"d":"easy","e":"Possible explanation → might be out."},{"q":"He's wearing a coat, so it ___ be cold.","o":["can't","must","mustn't","may not"],"a":1,"d":"med","e":"Evidence → must be cold."},{"q":"She speaks five languages — she ___ be clever.","o":["can't","might not","must","mustn't"],"a":2,"d":"med","e":"Strong deduction → must be."},{"q":"The phone is off. He ___ be sleeping.","o":["must be","can't be","mustn't be","isn't"],"a":0,"d":"med","e":"Likely explanation → must be sleeping."},{"q":"This ___ be the right address; the numbers don't match.","o":["must","might","can't","may"],"a":2,"d":"med","e":"Sure it’s wrong → can’t be."},{"q":"Choose the 'possible' modal.","o":["must","can't","could","mustn't"],"a":2,"d":"med","e":"‘could’ = possible."},{"q":"Find the mistake: 'He's not at home, he mustn't be at work.'","o":["mustn't → must","not → no","at → in","no mistake"],"a":0,"d":"hard","e":"For a likely explanation use ‘must be at work’ (mustn’t is prohibition)."},{"q":"Complete: 'She ___ be ill — she ___ be at the gym; her bag is here.'","o":["might / can't","must / might","can't / must","might / must"],"a":0,"d":"hard","e":"‘might be ill’ (possible) + ‘can’t be at the gym’ (impossible — bag is here)."},{"q":"Which is correct?","o":["He can't be serious.","He mustn't be serious.","He don't be serious.","He couldn't to be serious."],"a":0,"d":"hard","e":"Sure it isn’t → can’t be."},{"q":"Complete: 'No one's answering. They ___ out, or they ___ be sleeping.'","o":["must be / can't","might be / might","can't be / must","must be / mustn't"],"a":1,"d":"hard","e":"Both uncertain → might be / might be."},{"q":"Choose the present-continuous deduction.","o":["She must works late.","She must be working late.","She must working late.","She must to work late."],"a":1,"d":"hard","e":"modal + be + -ing: must be working."}]},{"id":"g6","title":"The passive","lead":"We use the passive when the action is more important than the person who does it, or when we don’t know who did it. The object of the active sentence becomes the subject of the passive.","blocks":[{"h":"Form: be + past participle","p":["Use the right tense of <b>be</b> + the past participle. Present: am/is/are + pp. Past: was/were + pp."],"ex":["English <b>is spoken</b> here. · The window <b>was broken</b> yesterday."]},{"h":"by + agent","p":["Use <b>by</b> to say who or what does the action, but only when it is important."],"ex":["The book <b>was written by</b> Orwell. · He <b>was bitten by</b> a dog."]},{"h":"When to use the passive","p":["Use it when the doer is unknown, obvious or unimportant, or in formal/scientific writing."],"ex":["My car <b>was stolen</b>. (we don’t know who) · The results <b>were analysed</b>."]},{"h":"Other tenses","p":["Present perfect: has/have been + pp. Future: will be + pp. Modal: can/must be + pp."],"ex":["The job <b>has been done</b>. · It <b>will be finished</b> soon. · It <b>must be paid</b> today."]}],"tip":"Only verbs with an object (transitive) can be made passive. ‘happen’, ‘arrive’ and ‘sleep’ have no object, so they cannot be passive.","examples":["\"Millions of phones <b>are made</b> in China.\"","\"The bridge <b>was built</b> in 1890.\"","\"This letter <b>was written by</b> my grandmother.\"","\"The thieves <b>were caught</b> by the police.\"","\"Dinner <b>is being prepared</b> now.\"","\"The work <b>will be finished</b> tomorrow.\""],"q":[{"q":"English ___ in many countries.","o":["speaks","is spoken","spoken","is speaking"],"a":1,"d":"easy","e":"Present passive: is spoken."},{"q":"The window ___ yesterday.","o":["broke","was broken","is broken","breaks"],"a":1,"d":"easy","e":"Past passive: was broken."},{"q":"The passive of 'They make cars here' is 'Cars ___ here.'","o":["make","are made","made","is made"],"a":1,"d":"easy","e":"Plural subject → are made."},{"q":"This book ___ by Dickens.","o":["wrote","was written","is writing","writes"],"a":1,"d":"easy","e":"Past passive: was written."},{"q":"The rooms ___ every day.","o":["clean","are cleaned","is cleaned","cleaning"],"a":1,"d":"easy","e":"Plural present passive: are cleaned."},{"q":"My bike ___ last week.","o":["stole","was stolen","is stolen","steals"],"a":1,"d":"med","e":"Past passive: was stolen."},{"q":"Choose the agent: 'The house was designed ___ a famous architect.'","o":["from","by","with","of"],"a":1,"d":"med","e":"Agent → by."},{"q":"The present perfect passive of 'do' is 'It ___.'","o":["has done","has been done","is done","was done"],"a":1,"d":"med","e":"has/have been + pp: has been done."},{"q":"Which verb CANNOT be passive?","o":["build","write","arrive","clean"],"a":2,"d":"med","e":"‘arrive’ has no object → not passive."},{"q":"The future passive of 'finish' is 'It ___ tomorrow.'","o":["will finish","will be finished","is finished","finishes"],"a":1,"d":"med","e":"will be + pp: will be finished."},{"q":"Find the mistake: 'The letter was wrote by John.'","o":["wrote → written","was → is","by → from","no mistake"],"a":0,"d":"hard","e":"Past participle: was written."},{"q":"Make passive: 'Somebody has cleaned the room.'","o":["The room has cleaned.","The room has been cleaned.","The room was clean.","The room is cleaning."],"a":1,"d":"hard","e":"Present perfect passive: has been cleaned."},{"q":"Which sentence is correct?","o":["The thief was caught by police.","The thief caught by police.","The thief was catch by police.","The thief is catch by police."],"a":0,"d":"hard","e":"was + past participle: was caught."},{"q":"Complete (modal passive): 'These forms ___ in pen.'","o":["must complete","must be completed","must completed","are must complete"],"a":1,"d":"hard","e":"modal + be + pp: must be completed."},{"q":"Make passive: 'They are building a new school.'","o":["A new school is built.","A new school is being built.","A new school builds.","A new school was built."],"a":1,"d":"hard","e":"Present continuous passive: is being built."}]},{"id":"g7","title":"Reported speech: statements","lead":"Reported (indirect) speech tells what someone said without using their exact words. Tenses usually move one step back, and pronouns and time words often change.","blocks":[{"h":"Tense backshift","p":["Move the tense back one step: present simple → past simple; present continuous → past continuous; will → would; can → could."],"ex":["“I <b>am</b> tired.” → He said he <b>was</b> tired.","“I <b>will</b> call.” → She said she <b>would</b> call."]},{"h":"say & tell","p":["Use <b>tell</b> + a person; use <b>say</b> without a person (or with ‘to’)."],"ex":["She <b>told me</b> she was busy. · She <b>said</b> she was busy."]},{"h":"Pronouns & time words","p":["Change pronouns to fit the new speaker, and words like today→that day, tomorrow→the next day, now→then."],"ex":["“I’ll see you <b>tomorrow</b>.” → He said he’d see me <b>the next day</b>."]},{"h":"that (optional)","p":["You can include or leave out <b>that</b> after say/tell."],"ex":["She said (<b>that</b>) she liked it."]}],"tip":"After <b>tell</b> you must name the listener (tell <b>me/him/us</b>); after <b>say</b> you don’t. ‘He said me’ is wrong → ‘He <b>told</b> me’ or ‘He <b>said</b>’.","examples":["\"“I’m hungry.” → She said she <b>was</b> hungry.\"","\"“We live in Leeds.” → They said they <b>lived</b> in Leeds.\"","\"“I’ll help you.” → He said he <b>would</b> help me.\"","\"“I can swim.” → She told me she <b>could</b> swim.\"","\"“I’m working now.” → He said he <b>was working</b> then.\"","\"“I bought a car.” → She said she <b>had bought</b> a car.\""],"q":[{"q":"\"I am tired.\" → He said he ___ tired.","o":["is","was","were","has been"],"a":1,"d":"easy","e":"present → past: was."},{"q":"\"I will call.\" → She said she ___ call.","o":["will","would","can","could"],"a":1,"d":"easy","e":"will → would."},{"q":"\"I live here.\" → He said he ___ there.","o":["lives","lived","is living","has lived"],"a":1,"d":"easy","e":"present → past: lived."},{"q":"Choose the correct verb: 'She ___ me she was busy.'","o":["said","told","say","says"],"a":1,"d":"easy","e":"+ person → told me."},{"q":"\"I can swim.\" → He said he ___ swim.","o":["can","could","will","would"],"a":1,"d":"easy","e":"can → could."},{"q":"\"We are eating.\" → They said they ___ eating.","o":["are","were","was","have been"],"a":1,"d":"med","e":"present continuous → past continuous: were eating."},{"q":"\"I bought a car.\" → She said she ___ a car.","o":["bought","had bought","has bought","buys"],"a":1,"d":"med","e":"past → past perfect: had bought."},{"q":"Choose say/tell: 'He ___ that he was sorry.'","o":["told","said","told to","says"],"a":1,"d":"med","e":"No person → said."},{"q":"\"I'll see you tomorrow.\" → He said he'd see me ___.","o":["tomorrow","the next day","yesterday","now"],"a":1,"d":"med","e":"tomorrow → the next day."},{"q":"\"I don't like it.\" → She said she ___ it.","o":["doesn't like","didn't like","won't like","hasn't liked"],"a":1,"d":"med","e":"present → past: didn’t like."},{"q":"Find the mistake: 'He said me that he was late.'","o":["said me → told me","that → which","was → is","no mistake"],"a":0,"d":"hard","e":"After ‘said’ no person; use ‘told me’."},{"q":"Report: \"I have finished my homework.\"","o":["She said she finished her homework.","She said she had finished her homework.","She said she has finished her homework.","She said she finishes her homework."],"a":1,"d":"hard","e":"present perfect → past perfect: had finished."},{"q":"Which is correct?","o":["He told he was tired.","He told me he was tired.","He said me he was tired.","He say me he was tired."],"a":1,"d":"hard","e":"tell + person: told me."},{"q":"Report: \"We are leaving now.\"","o":["They said they are leaving now.","They said they were leaving then.","They said they leave then.","They said they will leave now."],"a":1,"d":"hard","e":"present continuous → past continuous; now → then."},{"q":"Report: \"I can't come tomorrow.\"","o":["He said he can't come tomorrow.","He said he couldn't come the next day.","He said he couldn't come tomorrow.","He told he couldn't come."],"a":1,"d":"hard","e":"can’t → couldn’t; tomorrow → the next day."}]},{"id":"g8","title":"Reported questions & commands","lead":"When we report questions and orders, the structure changes. Reported questions use statement word order, and reported commands use ‘to’ + verb.","blocks":[{"h":"Wh- questions","p":["Keep the question word, then use <b>statement order</b> (subject + verb) with no auxiliary do/does/did."],"ex":["“<b>Where do</b> you live?” → She asked <b>where I lived</b>."]},{"h":"Yes/No questions","p":["Use <b>if</b> or <b>whether</b>, then statement order."],"ex":["“<b>Are</b> you ready?” → He asked <b>if I was</b> ready."]},{"h":"Commands & requests","p":["Use <b>told/asked</b> + person + <b>to</b> + verb. For negatives, use <b>not to</b>."],"ex":["“Sit down.” → She <b>told me to sit</b> down. · “Don’t move.” → He <b>told me not to move</b>."]},{"h":"No question mark","p":["Reported questions are statements, so they don’t end with a question mark."],"ex":["He asked where the station was."]}],"tip":"In reported questions, don’t keep the question word order or ‘do/did’: ‘She asked where <b>did I live</b>’ is wrong → ‘She asked where <b>I lived</b>.’","examples":["\"“What time is it?” → He asked what time <b>it was</b>.\"","\"“Do you like tea?” → She asked <b>if I liked</b> tea.\"","\"“Where are you going?” → He asked where <b>I was going</b>.\"","\"“Close the door.” → She told me <b>to close</b> the door.\"","\"“Please help me.” → He asked me <b>to help</b> him.\"","\"“Don’t be late.” → She told me <b>not to be</b> late.\""],"q":[{"q":"\"Where do you live?\" → She asked where I ___.","o":["live","lived","do live","am living"],"a":1,"d":"easy","e":"Statement order, backshift: where I lived."},{"q":"\"Are you ready?\" → He asked ___ I was ready.","o":["that","if","what","do"],"a":1,"d":"easy","e":"Yes/No → if."},{"q":"\"Sit down.\" → She told me ___ down.","o":["sit","to sit","sitting","sat"],"a":1,"d":"easy","e":"Command → to sit."},{"q":"\"Don't run.\" → He told me ___ run.","o":["to not","don't","not to","to don't"],"a":2,"d":"easy","e":"Negative command → not to run."},{"q":"\"What is your name?\" → She asked what my name ___.","o":["is","was","be","were"],"a":1,"d":"easy","e":"Backshift: what my name was."},{"q":"\"Do you like coffee?\" → He asked if I ___ coffee.","o":["like","liked","do like","am liking"],"a":1,"d":"med","e":"if + statement order, backshift: liked."},{"q":"\"Open the window.\" → She asked me ___ the window.","o":["open","to open","opening","opened"],"a":1,"d":"med","e":"Request → to open."},{"q":"\"Where are you going?\" → He asked where I ___.","o":["am going","was going","go","were going"],"a":1,"d":"med","e":"present cont. → past cont.: was going."},{"q":"\"Can you swim?\" → She asked if I ___ swim.","o":["can","could","will","would"],"a":1,"d":"med","e":"can → could."},{"q":"Choose the correct word order.","o":["He asked where did I live.","He asked where I lived.","He asked where lived I.","He asked did where I live."],"a":1,"d":"med","e":"Statement order: where I lived."},{"q":"Find the mistake: 'She asked me what time was it.'","o":["was it → it was","what → which","asked → told","no mistake"],"a":0,"d":"hard","e":"Statement order: what time it was."},{"q":"Report: \"Please don't tell anyone.\"","o":["He asked me not to tell anyone.","He asked me to don't tell anyone.","He asked me don't tell anyone.","He told to not tell anyone."],"a":0,"d":"hard","e":"Negative request → asked me not to tell."},{"q":"Report: \"Have you finished?\"","o":["She asked if I had finished.","She asked if I have finished.","She asked did I finish.","She asked if had I finished."],"a":0,"d":"hard","e":"Yes/No + present perfect → if I had finished."},{"q":"Report: \"Why are you late?\"","o":["He asked why was I late.","He asked why I was late.","He asked why I am late.","He asked me why late I was."],"a":1,"d":"hard","e":"Statement order, backshift: why I was late."},{"q":"Report: \"Wait here.\"","o":["She told me wait here.","She told me to wait there.","She told me to wait here now.","She said me to wait there."],"a":1,"d":"hard","e":"Command → to wait; here → there."}]},{"id":"g9","title":"Relative clauses (defining & non-defining)","lead":"Relative clauses add information about a noun. Defining clauses give essential information; non-defining clauses give extra information and are separated by commas.","blocks":[{"h":"Defining clauses","p":["Give essential information (you need it to know which person or thing). Use who, which, that, where, whose. No commas."],"ex":["The man <b>who lives next door</b> is a doctor."]},{"h":"Non-defining clauses","p":["Give extra, non-essential information, set off by <b>commas</b>. Don’t use ‘that’; don’t omit the pronoun."],"ex":["My brother, <b>who lives in Leeds</b>, is a teacher."]},{"h":"Leaving out the pronoun","p":["In defining clauses, you can omit who/which/that when it is the <b>object</b>."],"ex":["The book (<b>that</b>) I read was great."]},{"h":"whose & where","p":["<b>whose</b> shows possession; <b>where</b> refers to a place."],"ex":["She’s the woman <b>whose</b> car was stolen. · That’s the town <b>where</b> I grew up."]}],"tip":"Use commas only for <b>extra</b> information (non-defining). With commas, never use ‘that’ and never drop the pronoun. Without commas (defining), you can use ‘that’ and may drop an object pronoun.","examples":["\"The keys <b>that</b> were on the table have gone.\"","\"Paris, <b>which</b> is the capital of France, is beautiful.\"","\"The film (that) we saw was boring.\"","\"My uncle, <b>who</b> is a pilot, travels a lot.\"","\"That’s the house <b>where</b> I was born.\"","\"He’s the boy <b>whose</b> dog bit me.\""],"q":[{"q":"The woman ___ teaches us is very kind.","o":["which","who","where","whose"],"a":1,"d":"easy","e":"People → who."},{"q":"I bought a phone ___ takes great photos.","o":["who","which","where","whose"],"a":1,"d":"easy","e":"Things → which/that."},{"q":"That's the café ___ we first met.","o":["which","who","where","whose"],"a":2,"d":"easy","e":"Place → where."},{"q":"She's the girl ___ brother is famous.","o":["who","which","whose","where"],"a":2,"d":"easy","e":"Possession → whose."},{"q":"Which clause has extra information (needs commas)?","o":["The man who called is here.","My dad, who is 60, still works.","The book that I read…","The town where I live…"],"a":1,"d":"easy","e":"Non-defining → commas."},{"q":"In which sentence can we omit the pronoun?","o":["The man who lives here…","The book that I read…","The woman who called…","The city which is huge…"],"a":1,"d":"med","e":"Object pronoun in a defining clause can be dropped: the book I read."},{"q":"Non-defining: 'London, ___ is the capital, is huge.'","o":["that","which","where","who"],"a":1,"d":"med","e":"Non-defining things → which (never ‘that’)."},{"q":"The keys ___ were on the table are gone.","o":["who","which","where","whose"],"a":1,"d":"med","e":"Things → which/that."},{"q":"My sister, ___ lives in Bristol, is a nurse.","o":["that","who","which","where"],"a":1,"d":"med","e":"Non-defining people → who."},{"q":"Choose the defining clause.","o":["The man who called is my boss.","My boss, who is 50, called.","Paris, which I love, is busy.","Tom, whose car broke, is late."],"a":0,"d":"med","e":"Defining = essential, no commas."},{"q":"Find the mistake: 'My car, that is red, is fast.'","o":["that → which","car → cars","is → are","no mistake"],"a":0,"d":"hard","e":"Non-defining clauses use ‘which’, not ‘that’."},{"q":"Complete: 'The hotel ___ we stayed, ___ was by the sea, was lovely.'","o":["which / that","where / which","that / where","where / who"],"a":1,"d":"hard","e":"Place ‘where we stayed’ + non-defining ‘which was by the sea’."},{"q":"Which sentence omits the pronoun correctly?","o":["The film we saw was good.","The man lives here is nice.","The city is big I visited.","The book wrote by him."],"a":0,"d":"hard","e":"Object pronoun dropped: the film (that) we saw."},{"q":"Complete: 'He's the player ___ goal won the match, ___ made him famous.'","o":["who / which","whose / which","whose / that","which / who"],"a":1,"d":"hard","e":"‘whose goal’ (possession) + non-defining ‘which made him famous’."},{"q":"Choose the correct non-defining sentence.","o":["My teacher who is French is kind.","My teacher, who is French, is kind.","My teacher, that is French, is kind.","My teacher which is French is kind."],"a":1,"d":"hard","e":"Extra info → commas + who."}]},{"id":"g10","title":"Past habits: used to & would","lead":"To describe the past we can use ‘used to’ and ‘would’ for repeated habits, but only ‘used to’ works for past states. Both contrast the past with the present.","blocks":[{"h":"used to (habits & states)","p":["<b>used to</b> + base verb describes past habits and past states that are no longer true."],"ex":["I <b>used to play</b> tennis. · She <b>used to have</b> long hair."]},{"h":"would (repeated habits only)","p":["<b>would</b> + base verb describes repeated past <b>actions</b>, but not states. It is common in stories."],"ex":["Every summer we <b>would</b> visit my grandparents."]},{"h":"would vs. used to with states","p":["Don’t use ‘would’ with state verbs (be, have, like, know). Use ‘used to’."],"ex":["✓ I <b>used to be</b> shy. · ✗ I would be shy."]},{"h":"Negatives & questions","p":["For ‘used to’: didn’t use to / Did … use to? (no -d)."],"ex":["He <b>didn’t use to</b> like coffee. · <b>Did</b> you <b>use to</b> live here?"]}],"tip":"Use ‘<b>would</b>’ only for repeated <b>actions</b>. For past <b>states</b> (be, have, like, know), you must use ‘<b>used to</b>’: ‘I used to <b>have</b> a bike’, not ‘I would have a bike’.","examples":["\"We <b>used to live</b> by the sea.\"","\"On Sundays, my dad <b>would cook</b> a big breakfast.\"","\"She <b>used to be</b> very shy.\"","\"He <b>didn’t use to</b> exercise, but now he runs daily.\"","\"As children, we <b>would play</b> outside all day.\"","\"<b>Did</b> you <b>use to</b> have a dog?\""],"q":[{"q":"I ___ play football every day as a child.","o":["use to","used to","would have","am used to"],"a":1,"d":"easy","e":"Past habit: used to play."},{"q":"Every winter, we ___ go skiing.","o":["would","used","use","are used to"],"a":0,"d":"easy","e":"Repeated action → would go."},{"q":"She ___ have long hair.","o":["would","used to","use to","is used to"],"a":1,"d":"easy","e":"Past state → used to have."},{"q":"They ___ visit us every summer.","o":["would","use to","are used to","using to"],"a":0,"d":"easy","e":"Repeated action → would visit."},{"q":"He ___ be very thin.","o":["would","used to","use to","is used to"],"a":1,"d":"easy","e":"Past state → used to be."},{"q":"Which sentence is WRONG?","o":["I used to be shy.","I would be shy.","I would play outside.","I used to play outside."],"a":1,"d":"med","e":"‘would’ can’t be used with the state ‘be’."},{"q":"Negative: 'I ___ like vegetables.'","o":["didn't used to","didn't use to","wouldn't","don't used to"],"a":1,"d":"med","e":"didn’t use to (no -d)."},{"q":"On holiday, we ___ swim in the sea every morning.","o":["used","would","use to","are used to"],"a":1,"d":"med","e":"Repeated action → would swim."},{"q":"___ you use to have a bike?","o":["Do","Did","Were","Would"],"a":1,"d":"med","e":"Did you use to…?"},{"q":"Choose the state-verb sentence (only 'used to').","o":["We would run.","We would sing.","I used to have a cat.","They would visit."],"a":2,"d":"med","e":"‘have’ is a state → used to have."},{"q":"Find the mistake: 'I would have a red car when I was young.'","o":["would have → used to have","when → while","young → younger","no mistake"],"a":0,"d":"hard","e":"State ‘have’ → used to have (not would)."},{"q":"Complete: 'My grandmother ___ tell us stories, and she ___ a wonderful voice.'","o":["used to / would have","would / used to have","would / would have","used to / used to"],"a":1,"d":"hard","e":"Repeated action ‘would tell’ + state ‘used to have’."},{"q":"Which is correct for a past habit and a past state?","o":["I would be a teacher and would smoke.","I used to be a teacher and would smoke.","I would be a teacher and used to smoke.","I use to be a teacher and would smoke."],"a":1,"d":"hard","e":"State ‘used to be’ + repeated action ‘would smoke’."},{"q":"Complete: '___ they ___ live in the countryside?'","o":["Did / used to","Did / use to","Would / use to","Do / use to"],"a":1,"d":"hard","e":"Did + use to: Did they use to live…?"},{"q":"Choose the natural sentence.","o":["When I was a kid, I would have a dog.","When I was a kid, I used to have a dog.","When I was a kid, I use to have a dog.","When I was a kid, I am used to have a dog."],"a":1,"d":"hard","e":"State ‘have’ → used to have."}]},{"id":"g11","title":"Gerunds & infinitives","lead":"Many verbs are followed by a gerund (-ing) and others by an infinitive (to + verb). Some verbs take either form, and a few change meaning depending on which you choose.","blocks":[{"h":"Verb + -ing","p":["After enjoy, finish, avoid, suggest, mind, keep, practise, can’t stand, look forward to, and after prepositions, use the <b>-ing</b> form."],"ex":["I <b>enjoy cooking</b>. · She’s good <b>at drawing</b>. · I look forward <b>to seeing</b> you."]},{"h":"Verb + to-infinitive","p":["After want, decide, hope, plan, promise, agree, offer, refuse, manage, learn, would like, use <b>to + verb</b>."],"ex":["We <b>decided to leave</b>. · He <b>refused to help</b>."]},{"h":"verb + object + to","p":["Some verbs take an object then to-infinitive: want, ask, tell, allow, advise, expect."],"ex":["She <b>asked me to wait</b>. · They <b>allowed us to stay</b>."]},{"h":"Change of meaning","p":["A few verbs change meaning: <b>stop</b>, <b>remember</b>, <b>try</b>, <b>forget</b>."],"ex":["I stopped <b>smoking</b>. (gave it up) · I stopped <b>to smoke</b>. (paused in order to)"]}],"tip":"After prepositions (about, of, at, in, before, after, without), always use the <b>-ing</b> form: ‘I’m interested in <b>learning</b>’, ‘before <b>going</b> out’.","examples":["\"I <b>can’t stand waiting</b> in queues.\"","\"She <b>decided to study</b> abroad.\"","\"He’s thinking <b>about changing</b> jobs.\"","\"They <b>asked me to help</b> them.\"","\"Remember <b>to lock</b> the door. (don’t forget)\"","\"I’ll never forget <b>visiting</b> Rome. (the memory)\""],"q":[{"q":"I enjoy ___ to music.","o":["listen","to listen","listening","listened"],"a":2,"d":"easy","e":"enjoy + -ing: listening."},{"q":"We decided ___ early.","o":["leave","to leave","leaving","left"],"a":1,"d":"easy","e":"decide + to: to leave."},{"q":"She's good at ___.","o":["draw","to draw","drawing","drew"],"a":2,"d":"easy","e":"Preposition ‘at’ + -ing: drawing."},{"q":"He refused ___ the question.","o":["answer","to answer","answering","answered"],"a":1,"d":"easy","e":"refuse + to: to answer."},{"q":"Do you mind ___ the window?","o":["open","to open","opening","opened"],"a":2,"d":"easy","e":"mind + -ing: opening."},{"q":"They asked me ___ them.","o":["help","to help","helping","helped"],"a":1,"d":"med","e":"ask + object + to: to help."},{"q":"I'm thinking about ___ a new car.","o":["buy","to buy","buying","bought"],"a":2,"d":"med","e":"Preposition ‘about’ + -ing: buying."},{"q":"She managed ___ the problem.","o":["solve","to solve","solving","solved"],"a":1,"d":"med","e":"manage + to: to solve."},{"q":"We're looking forward to ___ you.","o":["see","to see","seeing","saw"],"a":2,"d":"med","e":"‘look forward to’ + -ing: seeing."},{"q":"He suggested ___ a taxi.","o":["take","to take","taking","taken"],"a":2,"d":"med","e":"suggest + -ing: taking."},{"q":"Find the mistake: 'I'm interested in to learn Spanish.'","o":["to learn → learning","interested → interesting","in → on","no mistake"],"a":0,"d":"hard","e":"Preposition ‘in’ + -ing: learning."},{"q":"Choose the correct meaning: 'He stopped to smoke' means ___.","o":["he gave up smoking","he paused in order to smoke","he never smoked","he hates smoking"],"a":1,"d":"hard","e":"stop + to = pause in order to do something."},{"q":"Complete: 'Please remember ___ the door, and I'll never forget ___ here as a child.'","o":["locking / to play","to lock / playing","to lock / to play","locking / playing"],"a":1,"d":"hard","e":"remember to do (duty) + forget doing (memory)."},{"q":"Which is correct?","o":["They allowed us stay.","They allowed us to stay.","They allowed us staying.","They allowed to us stay."],"a":1,"d":"hard","e":"allow + object + to: allowed us to stay."},{"q":"Complete: 'I tried ___ the box, but it was locked, so I tried ___ a knife.'","o":["opening / using","to open / using","to open / to use","opening / to use"],"a":1,"d":"hard","e":"try to do (attempt) + try doing (experiment): to open / using."}]},{"id":"g12","title":"Comparing: as…as, less, modifiers","lead":"Beyond basic comparatives, we can show that two things are equal, that one is inferior, or how big the difference is. These patterns make comparisons more precise.","blocks":[{"h":"as … as (equality)","p":["Use <b>as + adjective + as</b> to say two things are the same, and <b>not as … as</b> for inequality."],"ex":["She’s <b>as tall as</b> her brother. · It’s <b>not as cold as</b> yesterday."]},{"h":"less … than","p":["Use <b>less + adjective + than</b> (the opposite of ‘more … than’), usually with longer adjectives."],"ex":["This film is <b>less interesting than</b> the book."]},{"h":"Modifiers","p":["Make comparatives stronger or weaker with <b>much, far, a lot, a bit, slightly</b>."],"ex":["He’s <b>much taller</b> than me. · It’s <b>a bit warmer</b> today."]},{"h":"the … the … (parallel)","p":["Use ‘<b>the + comparative … the + comparative</b>’ to show that two things change together."],"ex":["<b>The more</b> you practise, <b>the better</b> you get."]}],"tip":"To strengthen a comparative, use <b>much</b> or <b>far</b> (much/far better), not ‘very’. ‘Very better’ is wrong; ‘<b>much</b> better’ is correct.","examples":["\"Maths is <b>as difficult as</b> physics for me.\"","\"This phone is <b>not as expensive as</b> that one.\"","\"Today is <b>far hotter</b> than yesterday.\"","\"The book is <b>less exciting than</b> the film.\"","\"He runs <b>a bit faster</b> than me.\"","\"<b>The harder</b> you work, <b>the more</b> you earn.\""],"q":[{"q":"She is ___ tall ___ her sister.","o":["as / as","so / as","as / than","more / than"],"a":0,"d":"easy","e":"Equality: as tall as."},{"q":"It isn't ___ cold ___ yesterday.","o":["as / than","so / than","as / as","more / as"],"a":2,"d":"easy","e":"not as cold as."},{"q":"This book is ___ interesting than that one.","o":["less","least","not","as"],"a":0,"d":"easy","e":"less interesting than."},{"q":"He's ___ taller than me.","o":["very","much","more","most"],"a":1,"d":"easy","e":"Modifier → much taller."},{"q":"Today is ___ a bit warmer than yesterday.","o":["very","more","just","most"],"a":2,"d":"easy","e":"‘just a bit warmer’ — slightly (just/a bit) modifies the comparative."},{"q":"My phone is ___ expensive ___ yours.","o":["as / than","as / as","more / as","so / as"],"a":1,"d":"med","e":"Equality: as expensive as."},{"q":"The film was ___ exciting than the book.","o":["less","least","not as","fewer"],"a":0,"d":"med","e":"less exciting than."},{"q":"He's ___ better at chess than I am.","o":["very","far","most","more"],"a":1,"d":"med","e":"Modifier → far better."},{"q":"Complete: '___ you practise, ___ you become.'","o":["More / better","The more / the better","More the / better the","The most / the best"],"a":1,"d":"med","e":"the more … the better."},{"q":"Choose the equality sentence.","o":["She is taller than him.","She is as tall as him.","She is the tallest.","She is more tall than him."],"a":1,"d":"med","e":"Equality → as tall as."},{"q":"Find the mistake: 'This car is very better than mine.'","o":["very → much","better → best","than → as","no mistake"],"a":0,"d":"hard","e":"Use ‘much better’, not ‘very better’."},{"q":"Complete: 'It's ___ as difficult ___ I expected — much easier, in fact.'","o":["not so / than","not as / as","as / as","less / than"],"a":1,"d":"hard","e":"not as difficult as."},{"q":"Which means 'they are equal'?","o":["A is less good than B.","A is much better than B.","A is as good as B.","A isn't as good as B."],"a":2,"d":"hard","e":"as good as = equal."},{"q":"Complete: 'The ___ we leave, the ___ we'll arrive.'","o":["sooner / earlier","more soon / more early","soonest / earliest","sooner / more early"],"a":0,"d":"hard","e":"the sooner … the earlier."},{"q":"Choose the correctly modified comparative.","o":["It's far more cheap.","It's far cheaper.","It's very cheaper.","It's more cheaper."],"a":1,"d":"hard","e":"far cheaper (much/far + comparative)."}]},{"id":"g13","title":"Quantifiers","lead":"Quantifiers tell us about amount and number. At B1 we extend beyond some/any to all, most, both, neither, none, each and every, and learn how they combine with nouns and ‘of’.","blocks":[{"h":"all / most / some / none","p":["Use these for general amounts. With ‘the/my/these’ + noun, add <b>of</b>: most <b>of</b> the students."],"ex":["<b>Most</b> people like music. · <b>None of</b> the answers were right."]},{"h":"both / neither / either","p":["<b>both</b> = the two together; <b>neither</b> = not one and not the other; <b>either</b> = one or the other."],"ex":["<b>Both</b> films are good. · <b>Neither</b> answer is correct. · <b>Either</b> day is fine."]},{"h":"each & every","p":["Both mean ‘all, seen individually’, and take a <b>singular</b> verb. ‘every’ for the whole group; ‘each’ for the individuals."],"ex":["<b>Every</b> student <b>has</b> a book. · <b>Each</b> answer <b>is</b> different."]},{"h":"a few / a little / several","p":["<b>a few</b> + countable, <b>a little</b> + uncountable, <b>several</b> = more than a few (countable)."],"ex":["<b>A few</b> people came. · <b>A little</b> milk. · <b>Several</b> students passed."]}],"tip":"<b>every</b> and <b>each</b> are followed by a <b>singular</b> noun and verb: ‘Every student <b>is</b> here’, not ‘every students are here’.","examples":["\"<b>Most of</b> my friends live abroad.\"","\"<b>None of</b> the shops were open.\"","\"<b>Both</b> answers are correct.\"","\"<b>Neither</b> of us wants to go.\"","\"<b>Every</b> child needs love.\"","\"<b>Several</b> people complained.\""],"q":[{"q":"___ people enjoy music.","o":["Most","Most of","The most","Much"],"a":0,"d":"easy","e":"General → Most people."},{"q":"___ of the students passed.","o":["Every","Each","All","Most of"],"a":3,"d":"easy","e":"With ‘the’ → Most of the students."},{"q":"___ answers are correct — well done!","o":["Both","Neither","Either","Every"],"a":0,"d":"easy","e":"The two together → Both answers."},{"q":"___ student has a textbook.","o":["Every","All","Most","Both"],"a":0,"d":"easy","e":"+ singular noun → Every student."},{"q":"I have ___ money, just a little.","o":["a few","a little","many","several"],"a":1,"d":"easy","e":"Uncountable → a little."},{"q":"___ of the answers was right; they were all wrong.","o":["All","Both","None","Most"],"a":2,"d":"med","e":"Zero → None of the answers."},{"q":"___ of us wants to leave; we're both happy.","o":["Both","Either","Neither","Each"],"a":2,"d":"med","e":"Not one and not the other → Neither."},{"q":"___ child in the class is different.","o":["Each","All","Both","Most"],"a":0,"d":"med","e":"Individuals + singular → Each child."},{"q":"___ students complained about the test.","o":["Several","A little","Much","Every"],"a":0,"d":"med","e":"More than a few, countable → Several."},{"q":"Choose the correct verb: 'Every student ___ here.'","o":["are","is","were","have"],"a":1,"d":"med","e":"‘every’ → singular: is."},{"q":"Find the mistake: 'Every students are present.'","o":["students are → student is","Every → All","present → presents","no mistake"],"a":0,"d":"hard","e":"every + singular: Every student is present."},{"q":"Complete: '___ of the two options is fine; choose ___ you like.'","o":["Both / either","Either / either","Neither / both","Each / neither"],"a":1,"d":"hard","e":"Either of the two is fine; choose either."},{"q":"Which is correct?","o":["Most of people are kind.","Most people are kind.","The most people are kind.","Most of the people kind."],"a":1,"d":"hard","e":"General statement → Most people (no ‘of’ without the/my/these)."},{"q":"Complete: '___ of my friends came, but ___ stayed late.'","o":["All / none","All / no","Every / none","Each / no"],"a":0,"d":"hard","e":"All of my friends came, but none stayed late."},{"q":"Choose the sentence with correct agreement.","o":["Each of the rooms have a bed.","Each of the rooms has a bed.","Each rooms has a bed.","Each of the room have a bed."],"a":1,"d":"hard","e":"‘each’ → singular verb: has."}]},{"id":"g14","title":"Conditionals: zero, first & linkers","lead":"Conditionals describe results that follow from conditions. The zero conditional states facts; the first conditional describes likely future situations. Linkers like unless and as long as add precision.","blocks":[{"h":"Zero conditional (facts)","p":["Use <b>if/when + present, present</b> for things that are always true."],"ex":["<b>If</b> you <b>heat</b> water, it <b>boils</b>."]},{"h":"First conditional (likely future)","p":["Use <b>if + present, will + base</b> for real, likely future situations."],"ex":["<b>If</b> it <b>rains</b>, we<b>’ll stay</b> in."]},{"h":"unless","p":["<b>unless</b> = if … not. It introduces the only condition that changes the result."],"ex":["I won’t go <b>unless</b> you come too. (= if you don’t come)"]},{"h":"as long as / provided that / in case","p":["<b>as long as / provided that</b> = on condition that; <b>in case</b> = as a precaution."],"ex":["You can stay <b>as long as</b> you’re quiet. · Take an umbrella <b>in case</b> it rains."]}],"tip":"Don’t use ‘will’ after if/unless/as long as/in case in the condition: ‘If it <b>will rain</b>’ is wrong → ‘If it <b>rains</b>, we’ll stay in.’","examples":["\"If you <b>mix</b> blue and yellow, you <b>get</b> green.\"","\"If you <b>study</b>, you<b>’ll pass</b>.\"","\"We’ll be late <b>unless</b> we hurry.\"","\"You can borrow it <b>as long as</b> you return it.\"","\"I’ll take my phone <b>in case</b> you call.\"","\"<b>Provided that</b> you pay, you can join.\""],"q":[{"q":"If you heat ice, it ___.","o":["will melt","melts","melted","is melting"],"a":1,"d":"easy","e":"Zero conditional → present: melts."},{"q":"If it rains, we ___ inside.","o":["stay","will stay","stayed","would stay"],"a":1,"d":"easy","e":"First conditional → will stay."},{"q":"You'll be late ___ you hurry.","o":["if","unless","when","as"],"a":1,"d":"easy","e":"unless = if … not."},{"q":"If you ___ water to 100°C, it boils.","o":["will heat","heat","heated","would heat"],"a":1,"d":"easy","e":"Zero conditional → present: heat."},{"q":"I'll call you ___ I arrive.","o":["unless","when","in case of","provided"],"a":1,"d":"easy","e":"‘when I arrive’ (it will happen)."},{"q":"Take a coat ___ it gets cold.","o":["unless","in case","as long as","provided"],"a":1,"d":"med","e":"Precaution → in case it gets cold."},{"q":"You can stay ___ you keep quiet.","o":["unless","in case","as long as","if not"],"a":2,"d":"med","e":"Condition → as long as."},{"q":"If you ___ now, you'll catch the bus.","o":["will leave","leave","left","would leave"],"a":1,"d":"med","e":"First conditional → leave (present)."},{"q":"We won't win ___ we play better.","o":["if","unless","when","in case"],"a":1,"d":"med","e":"unless = if … not."},{"q":"Choose the zero conditional.","o":["If it rains, I'll stay.","If you drop glass, it breaks.","If I were rich, I'd travel.","If you study, you'll pass."],"a":1,"d":"med","e":"General fact → zero conditional."},{"q":"Find the mistake: 'I'll help you as long as you will ask.'","o":["you will ask → you ask","help → helping","as long as → unless","no mistake"],"a":0,"d":"hard","e":"No ‘will’ in the condition: as long as you ask."},{"q":"Complete: 'I'll lend it to you ___ you ___ it back.'","o":["unless / give","provided that / give","in case / will give","unless / will give"],"a":1,"d":"hard","e":"Condition → provided that you give it back."},{"q":"Which is correct?","o":["Unless you don't hurry, we'll be late.","Unless you hurry, we'll be late.","If you hurry, we'll be late.","Unless you will hurry, we'll be late."],"a":1,"d":"hard","e":"unless already means ‘if not’: Unless you hurry…"},{"q":"Complete: 'Take the map ___ you ___ lost.'","o":["unless / get","in case / get","as long as / get","if / will get"],"a":1,"d":"hard","e":"Precaution → in case you get lost."},{"q":"Choose the correct first conditional.","o":["If it will snow, school closes.","If it snows, school will close.","If it snows, school closes always.","If it would snow, school will close."],"a":1,"d":"hard","e":"If + present, will + base."}]},{"id":"g15","title":"Articles: a / an / the / zero","lead":"Articles are small but tricky. ‘A/an’ introduces something new or one of many; ‘the’ points to something specific or already known; and we use no article (zero) for general ideas and most plurals/uncountables.","blocks":[{"h":"a / an (one of many, new)","p":["Use <b>a/an</b> with singular countable nouns mentioned for the first time or as examples. ‘an’ before a vowel sound."],"ex":["I saw <b>a</b> dog. · She’s <b>an</b> engineer. · It takes <b>an</b> hour. (silent h)"]},{"h":"the (specific / known)","p":["Use <b>the</b> when both speaker and listener know which one, for unique things, and when mentioned again."],"ex":["<b>The</b> sun is hot. · I bought a book; <b>the</b> book was great."]},{"h":"zero article (general)","p":["Use no article for plural and uncountable nouns in general, and most names, meals, and many places."],"ex":["<b>Dogs</b> are loyal. · I like <b>music</b>. · We have <b>lunch</b> at one."]},{"h":"Fixed expressions","p":["Some places take ‘the’ or zero by convention."],"ex":["go to <b>school/work/bed</b> (zero) · play <b>the</b> piano · in <b>the</b> morning"]}],"tip":"Use ‘<b>a/an</b>’ when it’s new or one of many, and ‘<b>the</b>’ when it’s specific or already known. For general statements with plurals/uncountables, use <b>no article</b>: ‘<b>Books</b> are useful’, not ‘The books are useful’.","examples":["\"She’s <b>a</b> teacher and <b>an</b> artist.\"","\"<b>The</b> Earth goes round <b>the</b> Sun.\"","\"I love <b>coffee</b> in <b>the</b> morning.\"","\"We went to <b>school</b> by bus.\"","\"He plays <b>the</b> guitar very well.\"","\"<b>Children</b> need plenty of sleep.\""],"q":[{"q":"I saw ___ cat in the garden.","o":["a","an","the","—"],"a":0,"d":"easy","e":"New, singular countable → a cat."},{"q":"She is ___ honest person.","o":["a","an","the","—"],"a":1,"d":"easy","e":"Silent h, vowel sound → an honest."},{"q":"___ sun rises in the east.","o":["A","An","The","—"],"a":2,"d":"easy","e":"Unique object → The sun."},{"q":"I like ___ music.","o":["a","an","the","—"],"a":3,"d":"easy","e":"General uncountable → no article."},{"q":"He's ___ engineer.","o":["a","an","the","—"],"a":1,"d":"easy","e":"Vowel sound → an engineer."},{"q":"We go to ___ bed at ten.","o":["a","the","—","an"],"a":2,"d":"med","e":"Fixed expression → go to bed (zero)."},{"q":"I bought a phone. ___ phone was cheap.","o":["A","An","The","—"],"a":2,"d":"med","e":"Mentioned again → The phone."},{"q":"___ dogs are friendly animals. (in general)","o":["A","An","The","—"],"a":3,"d":"med","e":"General plural → no article."},{"q":"She plays ___ violin.","o":["a","an","the","—"],"a":2,"d":"med","e":"Instruments → play the violin."},{"q":"It takes ___ hour to get there.","o":["a","an","the","—"],"a":1,"d":"med","e":"Silent h → an hour."},{"q":"Find the mistake: 'I love the nature.'","o":["the nature → nature","love → like","I → We","no mistake"],"a":0,"d":"hard","e":"General uncountable → no article: I love nature."},{"q":"Complete: 'We had ___ breakfast, then went to ___ work.'","o":["the / the","— / —","a / the","the / —"],"a":1,"d":"hard","e":"Meals and ‘go to work’ → zero article."},{"q":"Which is correct?","o":["The life is hard sometimes.","Life is hard sometimes.","A life is hard sometimes.","An life is hard sometimes."],"a":1,"d":"hard","e":"General abstract noun → no article: Life is hard."},{"q":"Complete: 'I saw ___ film last night. ___ film was about ___ space.'","o":["a / The / —","the / A / the","a / A / a","— / The / the"],"a":0,"d":"hard","e":"a film (new) / The film (known) / space (general, zero)."},{"q":"Choose the correct sentence.","o":["She is best doctor in the town.","She is the best doctor in the town.","She is a best doctor in the town.","She is best doctor in town a."],"a":1,"d":"hard","e":"Superlative needs ‘the’: the best doctor."}]}],"VOCAB":[{"id":"v1","title":"Personality & character","words":[{"w":"ambitious","pos":"adj","ipa":"/æmˈbɪʃəs/","uz":"shijoatli","ru":"амбициозный","ex":"She is ambitious and wants to lead the company."},{"w":"reliable","pos":"adj","ipa":"/rɪˈlaɪəbl/","uz":"ishonchli","ru":"надёжный","ex":"He is reliable and always keeps his word."},{"w":"confident","pos":"adj","ipa":"/ˈkɒnfɪdənt/","uz":"oʻziga ishongan","ru":"уверенный","ex":"She gave a confident speech."},{"w":"shy","pos":"adj","ipa":"/ʃaɪ/","uz":"uyatchan","ru":"застенчивый","ex":"He is too shy to ask questions."},{"w":"generous","pos":"adj","ipa":"/ˈdʒenərəs/","uz":"saxiy","ru":"щедрый","ex":"My aunt is very generous."},{"w":"selfish","pos":"adj","ipa":"/ˈselfɪʃ/","uz":"xudbin","ru":"эгоистичный","ex":"It was selfish of him to take it all."},{"w":"honest","pos":"adj","ipa":"/ˈɒnɪst/","uz":"halol","ru":"честный","ex":"An honest answer is best."},{"w":"patient","pos":"adj","ipa":"/ˈpeɪʃnt/","uz":"sabrli","ru":"терпеливый","ex":"Teachers must be patient."},{"w":"hard-working","pos":"adj","ipa":"/ˌhɑːdˈwɜːkɪŋ/","uz":"mehnatkash","ru":"трудолюбивый","ex":"She is a hard-working student."},{"w":"lazy","pos":"adj","ipa":"/ˈleɪzi/","uz":"dangasa","ru":"ленивый","ex":"Don't be lazy; finish the job."},{"w":"polite","pos":"adj","ipa":"/pəˈlaɪt/","uz":"odobli","ru":"вежливый","ex":"He is always polite to guests."},{"w":"rude","pos":"adj","ipa":"/ruːd/","uz":"qoʻpol","ru":"грубый","ex":"It's rude to interrupt people."},{"w":"cheerful","pos":"adj","ipa":"/ˈtʃɪəfl/","uz":"quvnoq","ru":"весёлый","ex":"She has a cheerful personality."},{"w":"sensible","pos":"adj","ipa":"/ˈsensəbl/","uz":"aqlli","ru":"благоразумный","ex":"That was a sensible decision."},{"w":"creative","pos":"adj","ipa":"/kriˈeɪtɪv/","uz":"ijodkor","ru":"творческий","ex":"He is very creative in his work."},{"w":"brave","pos":"adj","ipa":"/breɪv/","uz":"jasur","ru":"храбрый","ex":"The brave firefighter saved them."},{"w":"jealous","pos":"adj","ipa":"/ˈdʒeləs/","uz":"rashkchi","ru":"ревнивый","ex":"He felt jealous of her success."},{"w":"friendly","pos":"adj","ipa":"/ˈfrendli/","uz":"doʻstona","ru":"дружелюбный","ex":"Our new neighbours are friendly."},{"w":"strict","pos":"adj","ipa":"/strɪkt/","uz":"qatʼiy","ru":"строгий","ex":"My father is quite strict."},{"w":"easy-going","pos":"adj","ipa":"/ˌiːziˈɡəʊɪŋ/","uz":"beozor","ru":"покладистый","ex":"She's easy-going and relaxed."},{"w":"stubborn","pos":"adj","ipa":"/ˈstʌbən/","uz":"oʻjar","ru":"упрямый","ex":"He's too stubborn to change his mind."},{"w":"talented","pos":"adj","ipa":"/ˈtæləntɪd/","uz":"isteʼdodli","ru":"талантливый","ex":"She is a talented musician."},{"w":"loyal","pos":"adj","ipa":"/ˈlɔɪəl/","uz":"sodiq","ru":"верный","ex":"A loyal friend stays with you."},{"w":"curious","pos":"adj","ipa":"/ˈkjʊəriəs/","uz":"qiziquvchan","ru":"любопытный","ex":"Children are naturally curious."}],"q":[{"q":"A person who always tells the truth is ___.","o":["lazy","honest","rude","jealous"],"a":1,"e":"Honest = truthful."},{"q":"'Saxiy' in English is ___.","o":["selfish","generous","shy","strict"],"a":1,"e":"‘Saxiy’ = generous."},{"q":"The opposite of 'hard-working' is ___.","o":["lazy","reliable","brave","loyal"],"a":0,"e":"hard-working ↔ lazy."},{"q":"Someone who wants to succeed and rise is ___.","o":["shy","ambitious","rude","stubborn"],"a":1,"e":"Ambitious = eager to succeed."},{"q":"A person you can always depend on is ___.","o":["jealous","reliable","lazy","selfish"],"a":1,"e":"Reliable = dependable."}]},{"id":"v2","title":"Work & careers","words":[{"w":"career","pos":"n","ipa":"/kəˈrɪə/","uz":"karyera","ru":"карьера ","charity"],"a":1,"e":"Pollution = contamination."},{"q":"'Qashshoqlik' in English is ___.","o":["poverty","equality","crime","waste"],"a":0,"e":"‘Qashshoqlik’ = poverty."},{"q":"A person who works without pay to help is a ___.","o":["volunteer","government","population","society"],"a":0,"e":"Volunteer = unpaid helper."},{"q":"Animals at risk of dying out are ___.","o":["endangered","wealthy","protected","global"],"a":0,"e":"Endangered = at risk of extinction."},{"q":"The slow rise in Earth's temperature is ___.","o":["pollution","global warming","poverty","crime"],"a":1,"e":"Global warming = rising temperatures."}]},{"id":"v9","title":"Feelings & relationships","words":[{"w":"relationship","pos":"n","ipa":"/rɪˈleɪʃnʃɪp/","uz":"munosabat","ru":"отношения","ex":"They have a strong relationship."},{"w":"argue","pos":"v","ipa":"/ˈɑːɡjuː/","uz":"tortishmoq","ru":"спорить","ex":"They rarely argue."},{"w":"support","pos":"v","ipa":"/səˈpɔːt/","uz":"qoʻllab-quvvatlamoq","ru":"поддерживать","ex":"My family supports me."},{"w":"trust","pos":"v","ipa":"/trʌst/","uz":"ishonmoq","ru":"доверять","ex":"I trust my best friend."},{"w":"get on","pos":"phr","ipa":"/ɡet ɒn/","uz":"chiqishmoq","ru":"ладить","ex":"I get on well with my sister."},{"w":"fall in love","pos":"phr","ipa":"/fɔːl ɪn lʌv/","uz":"sevib qolmoq","ru":"влюбиться","ex":"They fell in love quickly."},{"w":"marry","pos":"v","ipa":"/ˈmæri/","uz":"turmush qurmoq","ru":"жениться","ex":"They will marry in spring."},{"w":"divorce","pos":"n","ipa":"/dɪˈvɔːs/","uz":"ajrashish","ru":"развод","ex":"They got a divorce."},{"w":"jealous","pos":"adj","ipa":"/ˈdʒeləs/","uz":"rashkchi","ru":"ревнивый","ex":"He gets jealous easily."},{"w":"anxious","pos":"adj","ipa":"/ˈæŋkʃəs/","uz":"xavotirli","ru":"тревожный","ex":"She felt anxious before the test."},{"w":"proud","pos":"adj","ipa":"/praʊd/","uz":"faxrlanadigan","ru":"гордый","ex":"His parents are proud of him."},{"w":"embarrassed","pos":"adj","ipa":"/ɪmˈbærəst/","uz":"xijolat tortgan","ru":"смущённый","ex":"I felt embarrassed by my mistake."},{"w":"disappointed","pos":"adj","ipa":"/ˌdɪsəˈpɔɪntɪd/","uz":"hafsalasi pir boʻlgan","ru":"разочарованный","ex":"She was disappointed by the result."},{"w":"grateful","pos":"adj","ipa":"/ˈɡreɪtfl/","uz":"minnatdor","ru":"благодарный","ex":"I'm grateful for your help."},{"w":"lonely","pos":"adj","ipa":"/ˈləʊnli/","uz":"yolgʻiz","ru":"одинокий","ex":"He felt lonely far from home."},{"w":"confident","pos":"adj","ipa":"/ˈkɒnfɪdənt/","uz":"oʻziga ishongan","ru":"уверенный","ex":"She feels confident now."},{"w":"nervous","pos":"adj","ipa":"/ˈnɜːvəs/","uz":"asabiy","ru":"нервный","ex":"He was nervous on stage."},{"w":"relaxed","pos":"adj","ipa":"/rɪˈlækst/","uz":"boʻshashgan","ru":"расслабленный","ex":"I feel relaxed on holiday."},{"w":"upset","pos":"adj","ipa":"/ʌpˈset/","uz":"xafa","ru":"расстроенный","ex":"She was upset about the news."},{"w":"sympathy","pos":"n","ipa":"/ˈsɪmpəθi/","uz":"hamdardlik","ru":"сочувствие","ex":"He showed great sympathy."},{"w":"close","pos":"adj","ipa":"/kləʊs/","uz":"yaqin","ru":"близкий","ex":"We are very close friends."},{"w":"respect","pos":"v","ipa":"/rɪˈspekt/","uz":"hurmat qilmoq","ru":"уважать","ex":"I respect her opinion."}],"q":[{"q":"To believe someone is honest and reliable is to ___ them.","o":["argue","trust","divorce","upset"],"a":1,"e":"Trust = have confidence in."},{"q":"'Faxrlanadigan' in English is ___.","o":["lonely","proud","jealous","anxious"],"a":1,"e":"‘Faxrlanadigan’ = proud."},{"q":"To have a good relationship with someone is to ___ them.","o":["argue with","get on with","fall in love","divorce"],"a":1,"e":"Get on with = have a good relationship."},{"q":"Feeling thankful for help is being ___.","o":["jealous","grateful","upset","nervous"],"a":1,"e":"Grateful = thankful."},{"q":"Feeling worried and uneasy is feeling ___.","o":["proud","anxious","close","relaxed"],"a":1,"e":"Anxious = worried."}]}],"READING":[{"id":"r1","title":"A Change of Career","text":"For ten years, Daniel had worked as an accountant in a busy office in Birmingham. The salary was good, but he had never really enjoyed the job. He often felt bored, and by the end of each week he was exhausted.\nLast year, everything changed. While he was helping a friend repair an old house, he realised how much he loved working with his hands. After a few months, he made a brave decision: he resigned from his job and started training as a carpenter.\nNow Daniel earns less money than before, but he is much happier. He says he should have changed careers years ago. 'If I had known how good it would feel,' he says, 'I would have done it sooner.'","level":"Easy","q":[{"q":"What was Daniel's first job?","o":["a carpenter","an accountant","a builder","a teacher"],"a":1,"e":"He had worked as an accountant."},{"q":"How did he usually feel at work?","o":["excited","bored and tired","proud","relaxed"],"a":1,"e":"He felt bored and exhausted."},{"q":"What made him realise he wanted a change?","o":["a pay rise","helping a friend repair a house","a holiday","losing his job"],"a":1,"e":"He discovered he loved working with his hands."},{"q":"How does his salary now compare?","o":["higher","the same","lower","he has none"],"a":2,"e":"He earns less money than before."},{"q":"How does Daniel feel about the change?","o":["He regrets it.","He is much happier.","He is unsure.","He is angry."],"a":1,"e":"He is much happier and wishes he'd done it sooner."}]},{"id":"r2","title":"Living Abroad","text":"When Sophie moved from Bristol to Spain, she expected the first few months to be easy. She had visited the country several times on holiday and had always loved the weather and the food. However, living abroad turned out to be very different from visiting.\nAt first, she found everyday tasks difficult. Simple things, such as opening a bank account or going to the doctor, were stressful because of the language. She often felt lonely and missed her family.\nGradually, things improved. She joined a local Spanish class, where she met other newcomers, and slowly she began to make friends. After a year, she felt completely at home. 'Moving abroad was the hardest thing I have ever done,' she says, 'but also the best.'","level":"Medium","q":[{"q":"Why did Sophie think living in Spain would be easy?","o":["She spoke Spanish.","She had visited on holiday and loved it.","She had family there.","She had a job waiting."],"a":1,"e":"She had visited and loved the weather and food."},{"q":"What made everyday tasks hard at first?","o":["the weather","the food","the language","the money"],"a":2,"e":"The language made simple tasks stressful."},{"q":"How did she feel in the early months?","o":["excited","lonely","angry","bored"],"a":1,"e":"She felt lonely and missed her family."},{"q":"How did she start to make friends?","o":["at work","through a Spanish class","online","through family"],"a":1,"e":"She met newcomers at a local Spanish class."},{"q":"What is her overall opinion of moving abroad?","o":["It was a mistake.","It was the hardest but best thing.","It was easy.","She wants to go home."],"a":1,"e":"The hardest thing she'd done, but also the best."}]},{"id":"r3","title":"The Power of Habit","text":"Most of us would like to change something about our lives — to exercise more, eat better, or waste less time. Yet good intentions are rarely enough. Research suggests that the secret to lasting change is not willpower, but habit.\nA habit is an action we repeat so often that it becomes automatic. Once a behaviour becomes a habit, we no longer have to think about it or force ourselves to do it. The difficulty, of course, is building the habit in the first place.\nExperts recommend starting small. Instead of promising to run for an hour every day, you might begin with just ten minutes. It is also helpful to attach a new habit to an existing one — for example, doing a few exercises straight after brushing your teeth. If you keep the goal small and repeat it daily, it will eventually feel natural.","level":"Medium","q":[{"q":"According to the text, what is the secret to lasting change?","o":["willpower","habit","money","luck"],"a":1,"e":"The text says habit, not willpower."},{"q":"What is a habit?","o":["a difficult task","an automatic repeated action","a new year's promise","a type of exercise"],"a":1,"e":"A habit is a repeated, automatic action."},{"q":"Why are habits useful?","o":["They cost money.","We no longer have to force ourselves.","They are difficult.","They need willpower."],"a":1,"e":"Once automatic, no effort is needed."},{"q":"What do experts recommend?","o":["starting big","starting small","using willpower","giving up"],"a":1,"e":"Start small, e.g. ten minutes."},{"q":"What trick helps build a new habit?","o":["doing it once a month","attaching it to an existing habit","doing it for an hour","forgetting about it"],"a":1,"e":"Attach the new habit to an existing one."}]},{"id":"r4","title":"A Letter of Complaint","text":"Dear Sir or Madam,\n\nI am writing to complain about a jacket I bought from your online shop on 3 May (order number 4471).\n\nWhen the jacket arrived, I was very disappointed. Although the website described it as dark blue, the jacket I received was clearly black. Furthermore, there was a small hole in one of the pockets, which suggests it had not been checked properly before being sent.\n\nI have been a regular customer for several years and have never had a problem before. However, on this occasion I am not satisfied with the quality of the product or the service.\n\nI would therefore like a full refund. I have attached a photograph of the jacket as evidence. I look forward to hearing from you within seven days.\n\nYours faithfully,\nJ. Harris","level":"Medium","q":[{"q":"Why is the customer writing?","o":["to praise the shop","to complain about a jacket","to order a jacket","to ask for a job"],"a":1,"e":"It is a letter of complaint about a jacket."},{"q":"What was wrong with the colour?","o":["It was the wrong size.","It was black, not dark blue.","It was too bright.","Nothing was wrong."],"a":1,"e":"It was black instead of dark blue."},{"q":"What other fault did the jacket have?","o":["a missing button","a hole in a pocket","a broken zip","a stain"],"a":1,"e":"There was a hole in one pocket."},{"q":"What does the customer want?","o":["a new jacket","a discount","a full refund","an apology only"],"a":2,"e":"They request a full refund."},{"q":"What did the customer attach as evidence?","o":["a receipt","a photograph","a video","a letter"],"a":1,"e":"A photograph of the jacket."}]},{"id":"r5","title":"The Interview","text":"Emily had prepared for weeks. She had researched the company, practised her answers, and chosen her clothes carefully the night before. By the time the morning arrived, she felt ready — or so she thought.\nThe trouble began on the way there. Her train was cancelled, and by the time she found another, she was already running late. When she finally reached the office in Manchester, she was twenty minutes behind and out of breath.\nTo her surprise, the manager was understanding. He explained that one of his own interviews, years earlier, had gone badly for similar reasons, and he had still been offered the job. The interview went well, and Emily relaxed.\nA week later, an email arrived. She had got the job. Looking back, she realised that the disaster on the way had actually helped: it had shown the manager how she behaved under pressure.","level":"Hard","q":[{"q":"How had Emily prepared for the interview?","o":["She hadn't prepared.","She researched, practised and chose clothes.","She only chose clothes.","She asked a friend."],"a":1,"e":"She researched, practised answers and chose clothes."},{"q":"Why was she late?","o":["She woke up late.","Her train was cancelled.","She lost the address.","She forgot the time."],"a":1,"e":"Her train was cancelled."},{"q":"How did the manager react to her lateness?","o":["He was angry.","He was understanding.","He cancelled it.","He said nothing."],"a":1,"e":"He was understanding and shared his own story."},{"q":"What was the result?","o":["She didn't get the job.","She got the job.","She had to reapply.","She refused the job."],"a":1,"e":"A week later she got the job."},{"q":"Why does she think the difficult journey helped?","o":["It made her relax.","It showed how she behaves under pressure.","It impressed the staff.","It made her early."],"a":1,"e":"It showed the manager how she handled pressure."}]}],"LISTENING":[{"id":"l1","title":"A Job Offer","script":"Hello, is that Lucy? Yes, speaking. Hi Lucy, this is Mr Clarke from Riverside Books. I'm calling about your interview last week. We were very impressed, and I'm pleased to offer you the job. Oh, that's wonderful, thank you! The salary is twenty-four thousand pounds a year, and we'd like you to start on the first of June. Could you let me know by Friday if you accept? Yes, of course. Thank you so much. Great. We'll send you the contract by email. Goodbye.","level":"Easy","q":[{"q":"Who is calling Lucy?","o":["a colleague","Mr Clarke from Riverside Books","her teacher","a customer"],"a":1,"e":"Mr Clarke from Riverside Books is calling."},{"q":"Why is he calling?","o":["to arrange an interview","to offer her the job","to cancel the job","to ask a question"],"a":1,"e":"He is offering her the job."},{"q":"What is the salary?","o":["£20,000","£24,000","£42,000","£14,000"],"a":1,"e":"The salary is twenty-four thousand pounds."},{"q":"When should she start?","o":["1 June","1 July","next week","Friday"],"a":0,"e":"She should start on the first of June."},{"q":"By when must she reply?","o":["today","Friday","Monday","1 June"],"a":1,"e":"She must reply by Friday."}]},{"id":"l2","title":"Booking a Holiday","script":"Good morning, Sunshine Travel. How can I help? Hi, I'd like to book a holiday to Italy for two people in July. Certainly. We have a lovely week in Rome, including flights and a hotel near the centre, for six hundred pounds each. That sounds good. Does it include breakfast? Yes, breakfast is included, but not other meals. And are the flights direct? Yes, they are. The flight from London takes about two and a half hours. Perfect. I'll take it. Could I have your name and a deposit of one hundred pounds, please?","level":"Medium","q":[{"q":"Where does the customer want to go?","o":["Spain","Italy","France","Greece"],"a":1,"e":"They want a holiday to Italy."},{"q":"How much does the holiday cost per person?","o":["£100","£600","£250","£2,000"],"a":1,"e":"Six hundred pounds each."},{"q":"What is included in the price?","o":["all meals","breakfast only","no meals","dinner only"],"a":1,"e":"Breakfast is included, but not other meals."},{"q":"How long is the flight from London?","o":["one hour","two and a half hours","five hours","half an hour"],"a":1,"e":"About two and a half hours."},{"q":"How much is the deposit?","o":["£600","£100","£50","£200"],"a":1,"e":"A deposit of one hundred pounds."}]},{"id":"l3","title":"A Volunteer's Story","script":"Today on the programme we're talking to Tom, who volunteers at a city food bank. Tom, how did you start? Well, I lost my own job two years ago and a charity helped me through a hard time. When I got back on my feet, I wanted to give something back, so I started volunteering. What do you actually do? I help collect food from supermarkets and pack it for families in need. I work about two days a week. Is it rewarding? Absolutely. The best part is meeting people and knowing you've made a real difference. I'd encourage anyone with free time to try it.","level":"Medium","q":[{"q":"Where does Tom volunteer?","o":["a hospital","a food bank","a school","a library"],"a":1,"e":"He volunteers at a city food bank."},{"q":"Why did he start volunteering?","o":["for money","a charity had helped him","his boss told him to","for a qualification"],"a":1,"e":"A charity helped him, so he wanted to give back."},{"q":"What does he do there?","o":["cook meals","collect and pack food","drive a bus","answer phones"],"a":1,"e":"He collects food and packs it for families."},{"q":"How often does he volunteer?","o":["every day","about two days a week","once a month","at weekends only"],"a":1,"e":"About two days a week."},{"q":"What does he say is the best part?","o":["the free food","meeting people and making a difference","the exercise","the training"],"a":1,"e":"Meeting people and making a real difference."}]},{"id":"l4","title":"A Local News Report","script":"And now the local news. The city council has announced that the old library in Oxford Street will be turned into a community centre. The building, which has been closed for three years, will reopen next spring after major repairs. The centre will offer free classes, a café, and a space for local groups to meet. The project will cost around two million pounds, most of which has come from the government. Not everyone is happy, however. Some residents argue that the money should have been spent on the city's schools instead. A public meeting will be held next Tuesday for people to share their views.","level":"Hard","q":[{"q":"What will the old library become?","o":["a shop","a community centre","a school","a hotel"],"a":1,"e":"It will become a community centre."},{"q":"How long has the building been closed?","o":["one year","three years","ten years","six months"],"a":1,"e":"It has been closed for three years."},{"q":"What will the new centre offer?","o":["only a café","free classes, a café and meeting space","a cinema","a swimming pool"],"a":1,"e":"Free classes, a café and a space for groups."},{"q":"Where did most of the money come from?","o":["local residents","the government","a charity","ticket sales"],"a":1,"e":"Most came from the government."},{"q":"Why are some residents unhappy?","o":["The café is too small.","They think the money should go to schools.","It opens too late.","It is too far away."],"a":1,"e":"They argue the money should have gone to schools."}]}],"GMORE":
