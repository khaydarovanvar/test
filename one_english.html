first on the left","the third on the right"],"a":1,"e":"Take the second turning on the left."},{"q":"What is the park next to?","o":["the bank","the library","the shop","the school"],"a":1,"e":"The park is next to the library."},{"q":"What is opposite the park?","o":["the library","the bank","the café","the hospital"],"a":1,"e":"The park is opposite the bank."},{"q":"How long does it take to walk there?","o":["two minutes","about five minutes","ten minutes","half an hour"],"a":1,"e":"About five minutes on foot."}]},{"id":"l4","title":"A Voicemail Message","script":"Hi Harry, this is Lucy. I'm calling about our plan for Saturday. Let's meet at the cinema at four o'clock, not three. The film starts at half past four. Please bring the tickets. Oh, and can you call Jack? He doesn't know about the new time. See you on Saturday. Bye!","level":"Medium","q":[{"q":"Who is calling?","o":["Harry","Jack","Lucy","Grace"],"a":2,"e":"The caller says ‘this is Lucy.’"},{"q":"What day are they meeting?","o":["Friday","Saturday","Sunday","Monday"],"a":1,"e":"They are meeting on Saturday."},{"q":"What is the new meeting time?","o":["three o'clock","four o'clock","half past four","five o'clock"],"a":1,"e":"They meet at four o’clock (not three)."},{"q":"What should Harry bring?","o":["the tickets","some food","a book","money"],"a":0,"e":"He should bring the tickets."},{"q":"Who should Harry call?","o":["Lucy","Jack","the cinema","his mother"],"a":1,"e":"He should call Jack, who doesn’t know the new time."}]}],"GMORE":{"g1":{"situation":"You meet someone new: “What’s your name?” — “Anna.” — “How do you <b>spell</b> it?” — “A-N-N-A.” We spell words and names letter by letter, so knowing the letter names is the first step in English.","mistakes":[{"x":"My name is spelt with double “n”: N-N. (said as “en en”)","v":"Say each letter clearly: “double N”. English speakers often say “double” for two of the same letter."},{"x":"The letter “i” sounds like Uzbek/Russian “и”.","v":"In English the letter “i” is named /aɪ/ (“eye”), not /iː/."}],"examples":["\"How do you <b>spell</b> ‘brother’? — B-R-O-T-H-E-R.\"","\"My name is Aziz: <b>A-Z-I-Z</b>.\"","\"‘Coffee’ has <b>double F</b> and <b>double E</b>.\"","\"The vowels are <b>a, e, i, o, u</b>.\"","\"‘Hour’ begins with a <b>silent h</b>.\"","\"‘University’ starts with a <b>‘y’ sound</b>: /juː/.\"","\"Please write your surname in <b>capital letters</b>.\"","\"The letter <b>‘w’</b> is called ‘double-u’.\""]},"g2":{"situation":"“I <b>am</b> a teacher. My sister <b>is</b> a doctor. We <b>are</b> from Tashkent.” The verb <b>be</b> connects a person to a job, a place or a description.","compare":{"title":"One form for each subject","a":{"h":"Singular","ex":["I <b>am</b> (I’m)","you <b>are</b> (you’re)","he / she / it <b>is</b> (he’s)"]},"b":{"h":"Plural","ex":["we <b>are</b> (we’re)","you <b>are</b>","they <b>are</b> (they’re)"]}},"mistakes":[{"x":"I student. / She doctor.","v":"I <b>am</b> a student. / She <b>is</b> a doctor. (don’t drop “be”)"},{"x":"He are happy.","v":"He <b>is</b> happy. (he/she/it → is)"},{"x":"I’m agree with you.","v":"I <b>agree</b> with you. (“agree” is a verb — no “be”)"}],"examples":["\"I <b>am</b> from Uzbekistan.\"","\"She <b>is</b> a nurse.\"","\"We <b>are</b> in the same class.\"","\"He <b>isn’t</b> at home today.\"","\"<b>Are</b> you ready?\"","\"<b>Is</b> it cold outside?\"","\"They <b>are</b> my best friends.\"","\"My parents <b>are</b> teachers.\""]},"g3":{"compare":{"title":"Subject vs. possessive","a":{"h":"Subject pronoun","ex":["<b>I</b> work here.","<b>He</b> is tall.","<b>They</b> are friends."]},"b":{"h":"Possessive adjective","ex":["This is <b>my</b> bag.","<b>His</b> car is red.","<b>Their</b> house is big."]}},"mistakes":[{"x":"Me like coffee.","v":"<b>I</b> like coffee. (subject = I)"},{"x":"This is me book.","v":"This is <b>my</b> book. (possessive = my)"},{"x":"Her is my sister.","v":"<b>She</b> is my sister. (subject = she)"}],"examples":["\"<b>I</b> live with <b>my</b> family.\"","\"<b>He</b> loves <b>his</b> job.\"","\"<b>She</b> is washing <b>her</b> car.\"","\"<b>We</b> like <b>our</b> new school.\"","\"<b>They</b> are with <b>their</b> children.\"","\"<b>It</b> is <b>its</b> own colour.\"","\"This book is <b>yours</b>, not <b>mine</b>.\"","\"Give <b>me</b> <b>your</b> phone number.\""]},"g4":{"compare":{"title":"a / an","a":{"h":"a + consonant sound","ex":["<b>a</b> book","<b>a</b> car","<b>a</b> university (“yoo-”)"]},"b":{"h":"an + vowel sound","ex":["<b>an</b> apple","<b>an</b> egg","<b>an</b> hour (silent h)"]}},"mistakes":[{"x":"a apple / a hour","v":"<b>an</b> apple / <b>an</b> hour (vowel sound)"},{"x":"I need a informations.","v":"I need <b>information</b>. (uncountable — no “a”, no “-s”)"},{"x":"She is teacher.","v":"She is <b>a</b> teacher. (jobs take “a/an”)"}],"examples":["\"I have <b>a</b> brother and <b>a</b> sister.\"","\"She is eating <b>an</b> orange.\"","\"It takes <b>an</b> hour by bus.\"","\"<b>The</b> sun is very bright today.\"","\"I need <b>some water</b>. (uncountable)\"","\"There are three <b>boxes</b> on the table.\"","\"He’s <b>a</b> doctor at <b>the</b> hospital.\"","\"Look at <b>the</b> moon!\""]},"g5":{"compare":{"title":"near vs. far","a":{"h":"Near (here)","ex":["<b>this</b> book (one)","<b>these</b> books (more)"]},"b":{"h":"Far (there)","ex":["<b>that</b> house (one)","<b>those</b> houses (more)"]}},"mistakes":[{"x":"this books / these book","v":"<b>this</b> book (one) · <b>these</b> books (more than one)"},{"x":"I like these. (pointing far away)","v":"I like <b>those</b>. (far = that/those)"}],"examples":["\"<b>This</b> is my pen.\"","\"<b>These</b> shoes are new.\"","\"<b>That</b> car is expensive.\"","\"<b>Those</b> people are tourists.\"","\"<b>This</b> coffee is hot.\"","\"Are <b>these</b> your keys?\"","\"<b>That</b> was a great film.\"","\"I don’t like <b>those</b> colours.\""]},"g6":{"situation":"Tom is a nurse. He <b>works</b> at a hospital. He <b>starts</b> at 8 and <b>finishes</b> at 4. He <b>doesn’t work</b> on Sundays. — Use the present simple for habits, routines and things that are generally true.","timeline":{"art":["   ✕    ✕    ✕    ✕    ✕   (every day)","──────────────●──────────► now"],"note":"A repeated action / general fact — true in the past, now and the future."},"mistakes":[{"x":"He work in a bank.","v":"He <b>works</b> in a bank. (he/she/it → add -s)"},{"x":"She don’t like tea.","v":"She <b>doesn’t</b> like tea. (he/she/it → doesn’t)"},{"x":"Do you likes football?","v":"<b>Do</b> you <b>like</b> football? (after do/does, no -s)"}],"examples":["\"I <b>get up</b> at seven every day.\"","\"She <b>works</b> in a bank.\"","\"We <b>don’t watch</b> much TV.\"","\"He <b>doesn’t eat</b> meat.\"","\"<b>Do</b> you <b>speak</b> English?\"","\"<b>Does</b> she <b>live</b> here?\"","\"The shop <b>opens</b> at nine.\"","\"They <b>play</b> football on Sundays.\""]},"g7":{"situation":"Look! It <b>is raining</b> and the children <b>are playing</b> inside. — Use the present continuous for an action happening <b>now</b>, at the moment of speaking.","timeline":{"art":["            ▓▓▓▓▓▓▓▓▓","──────────●──────────► now","        (in progress)"],"note":"The action is happening right now and is not finished."},"compare":{"a":{"h":"Present simple (routine)","ex":["I <b>work</b> every day.","She <b>drinks</b> coffee."]},"b":{"h":"Present continuous (now)","ex":["I <b>am working</b> now.","She <b>is drinking</b> coffee."]}},"mistakes":[{"x":"I am go to school now.","v":"I <b>am going</b> to school now. (be + -ing)"},{"x":"She cooking dinner.","v":"She <b>is cooking</b> dinner. (don’t drop “is”)"},{"x":"I am knowing the answer.","v":"I <b>know</b> the answer. (state verbs: no -ing)"}],"examples":["\"I <b>am studying</b> right now.\"","\"She <b>is cooking</b> dinner.\"","\"They <b>are playing</b> in the garden.\"","\"It <b>is raining</b> outside.\"","\"We <b>aren’t working</b> today.\"","\"<b>Are</b> you <b>listening</b> to me?\"","\"What <b>is</b> he <b>doing</b>?\"","\"The baby <b>is sleeping</b>.\""]},"g8":{"compare":{"title":"there is / there are","a":{"h":"Singular","ex":["<b>There is</b> a book on the table.","<b>Is there</b> a problem?"]},"b":{"h":"Plural","ex":["<b>There are</b> three books.","<b>There aren’t</b> any chairs."]}},"mistakes":[{"x":"There is three rooms.","v":"There <b>are</b> three rooms. (plural → there are)"},{"x":"She have got a car.","v":"She <b>has got</b> a car. (he/she/it → has got)"},{"x":"I have got not a pen.","v":"I <b>haven’t got</b> a pen."}],"examples":["\"I <b>have got</b> two brothers.\"","\"She <b>has got</b> blue eyes.\"","\"<b>Have</b> you <b>got</b> a pen?\"","\"We <b>haven’t got</b> any milk.\"","\"<b>There is</b> a bank near here.\"","\"<b>There are</b> five students in class.\"","\"<b>Is there</b> a problem?\"","\"<b>There aren’t</b> any free seats.\""]},"g9":{"situation":"“<b>Can</b> you swim?” — “Yes, I <b>can</b>, but I <b>can’t</b> dive.” <b>Can</b> shows ability and possibility, and it never changes form.","mistakes":[{"x":"I can to swim.","v":"I <b>can swim</b>. (can + base verb, no “to”)"},{"x":"He cans drive.","v":"He <b>can</b> drive. (no -s on modals)"},{"x":"Please to sit down.","v":"Please <b>sit</b> down. (imperative = base verb)"}],"examples":["\"I <b>can</b> swim very well.\"","\"She <b>can’t</b> drive yet.\"","\"<b>Can</b> you help me, please?\"","\"We <b>can</b> meet tomorrow.\"","\"<b>Open</b> your books, please.\"","\"<b>Don’t</b> touch that!\"","\"<b>Be</b> quiet, please.\"","\"<b>Let’s</b> go home.\""]},"g10":{"compare":{"title":"Word order & no plural","a":{"h":"Adjective before noun","ex":["a <b>red</b> car","an <b>old</b> house"]},"b":{"h":"After “be”","ex":["The car <b>is red</b>.","They <b>are old</b>."]}},"mistakes":[{"x":"a car red","v":"a <b>red car</b> (adjective before the noun)"},{"x":"They are happys.","v":"They are <b>happy</b>. (adjectives have no plural -s)"}],"examples":["\"It’s a <b>big</b> house.\"","\"She has <b>long</b> hair.\"","\"The weather is <b>cold</b> today.\"","\"They are <b>happy</b> children.\"","\"He bought a <b>new</b> phone.\"","\"This is an <b>interesting</b> book.\"","\"The soup is <b>delicious</b>.\"","\"I have a <b>small</b> red car.\""]},"g11":{"compare":{"title":"some vs. any","a":{"h":"some — positive","ex":["I have <b>some</b> money.","There are <b>some</b> apples."]},"b":{"h":"any — negative & questions","ex":["I don’t have <b>any</b> money.","Are there <b>any</b> apples?"]}},"mistakes":[{"x":"I don’t have some sugar.","v":"I don’t have <b>any</b> sugar. (negative → any)"},{"x":"Do you have some questions?","v":"Do you have <b>any</b> questions? (question → any)"}],"examples":["\"I have <b>some</b> money.\"","\"There are <b>some</b> apples in the bag.\"","\"We don’t have <b>any</b> bread.\"","\"Is there <b>any</b> coffee left?\"","\"Would you like <b>some</b> tea?\"","\"She didn’t buy <b>any</b> milk.\"","\"There are <b>some</b> nice cafés here.\"","\"Have you got <b>any</b> questions?\""]},"g12":{"compare":{"title":"in / on / at (time)","a":{"h":"Point / clock","ex":["<b>at</b> 7 o’clock","<b>on</b> Monday","<b>on</b> 5 May"]},"b":{"h":"Longer period","ex":["<b>in</b> the morning","<b>in</b> July","<b>in</b> 2025"]}},"mistakes":[{"x":"I get up in 7 o’clock.","v":"I get up <b>at</b> 7 o’clock. (clock time → at)"},{"x":"See you in Monday.","v":"See you <b>on</b> Monday. (days → on)"}],"examples":["\"The cat is <b>under</b> the table.\"","\"We meet <b>at</b> 6 o’clock.\"","\"My birthday is <b>in</b> May.\"","\"See you <b>on</b> Friday.\"","\"The book is <b>on</b> the shelf.\"","\"She lives <b>in</b> Tashkent.\"","\"He’s waiting <b>at</b> the bus stop.\"","\"There’s a picture <b>between</b> the windows.\""]},"g13":{"situation":"“<b>Where</b> do you live?” “<b>What</b> do you do?” “<b>When</b> does the film start?” — Question words go first, then we use <b>do / does</b> + subject + verb.","mistakes":[{"x":"Where you live?","v":"Where <b>do</b> you live? (add do/does)"},{"x":"What you are doing?","v":"What <b>are you</b> doing? (be questions: be + subject)"},{"x":"How much costs it?","v":"How much <b>does it cost</b>?"}],"examples":["\"<b>What</b> is your name?\"","\"<b>Where</b> do you live?\"","\"<b>When</b> does the lesson start?\"","\"<b>Why</b> are you late?\"","\"<b>Who</b> is that man?\"","\"<b>How</b> do you go to work?\"","\"<b>How much</b> is this?\"","\"<b>Which</b> bus goes to the centre?\""]},"g14":{"compare":{"title":"verb + -ing","a":{"h":"like / love / enjoy / hate +","ex":["I <b>like swimming</b>.","She <b>loves cooking</b>."]},"b":{"h":"After prepositions +","ex":["good <b>at drawing</b>","before <b>going</b> out"]}},"mistakes":[{"x":"I like swim.","v":"I like <b>swimming</b>. (like + -ing)"},{"x":"I enjoy to read.","v":"I enjoy <b>reading</b>. (enjoy + -ing)"}],"examples":["\"I <b>like reading</b> in the evening.\"","\"She <b>loves dancing</b>.\"","\"They <b>enjoy travelling</b>.\"","\"He <b>hates waiting</b>.\"","\"I’m good <b>at cooking</b>.\"","\"We <b>like watching</b> films.\"","\"Do you <b>enjoy learning</b> English?\"","\"I don’t <b>like getting up</b> early.\""]},"g15":{"mistakes":[{"x":"two hundreds people","v":"two <b>hundred</b> people (no -s after a number)"},{"x":"I am twenty years.","v":"I am twenty <b>years old</b>."},{"x":"It costs five dollar.","v":"It costs five <b>dollars</b>. (plural after numbers > 1)"}],"examples":["\"There are <b>twenty</b> students in my class.\"","\"It costs <b>five thousand</b> som.\"","\"She is <b>thirty</b> years old.\"","\"The box weighs <b>two kilos</b>.\"","\"I need <b>three hundred</b> grams of sugar.\"","\"The room is <b>four metres</b> long.\"","\"It’s <b>half past</b> nine.\"","\"We walked <b>five kilometres</b>.\""]}},"TR":{"g1":{"lead":{"uz":"Ingliz tili lotin alifbosidan foydalanadi: har bir soʻzni hijjalaydigan 26 ta harf. Harf nomlari va ularning tovushlarini bilish ismingizni hijjalash, yangi soʻzlarni oʻqish va ovozli hijjalashni tushunish imkonini beradi.","ru":"Английский использует латинский алфавит: 26 букв, из которых складывается каждое слово. Знание названий букв и их звуков помогает произносить по буквам своё имя, читать новые слова и понимать устное написание."},"situation":{"uz":"Siz yangi odam bilan tanishasiz: “What’s your name?” — “Anna.” — “How do you spell it?” — “A-N-N-A.” Soʻz va ismlarni harfma-harf hijjalaymiz, shuning uchun harf nomlarini bilish — ingliz tilidagi birinchi qadam.","ru":"Вы знакомитесь: «What’s your name?» — «Anna.» — «How do you spell it?» — «A-N-N-A.» Слова и имена произносят по буквам, поэтому знание названий букв — первый шаг в английском."},"tip":{"uz":"Unlilarga eʼtibor bering — bir xil unli har xil eshitilishi mumkin: ‘cat’dagi a ‘car’dagi a emas. Yangi soʻzlarni tinglang va takrorlang.","ru":"Будьте внимательны с гласными — одна и та же гласная может звучать по-разному: a в ‘cat’ не то же, что в ‘car’. Слушайте и повторяйте новые слова."},"q":[{"uz":"Unlilar: A, E, I, O, U — demak E unli.","ru":"Гласные — A, E, I, O, U, поэтому E — гласная."},{"uz":"Alifboda 26 ta harf bor.","ru":"В алфавите 26 букв."},{"uz":"‘Dog’ D-O-G deb hijjalanadi.","ru":"‘Dog’ пишется D-O-G."},{"uz":"M — undosh; A, O va U — unlilar.","ru":"M — согласная; A, O и U — гласные."},{"uz":"S-U-N = uchta harf.","ru":"S-U-N = три буквы."},{"uz":"Yonma-yon kelgan bir xil ikki harf ‘double’ deyiladi.","ru":"Две одинаковые буквы подряд называют ‘double’."},{"uz":"‘Apple’ unli A bilan boshlanadi.","ru":"‘Apple’ начинается с гласной A."},{"uz":"‘Happy’da ikkita P (double P): H-A-P-P-Y.","ru":"В ‘Happy’ двойная P: H-A-P-P-Y."},{"uz":"Shahar nomlari (Tashkent) doim bosh harf bilan yoziladi.","ru":"Названия городов (Tashkent) всегда пишутся с заглавной буквы."},{"uz":"C-O-F-F-E-Eda double F va double E bor.","ru":"В C-O-F-F-E-E двойная F и двойная E."},{"uz":"‘my’ soʻzida Y unli vazifasini bajaradi.","ru":"В ‘my’ Y выступает как гласная."},{"uz":"‘School’ — S-C-H-O-O-L, jim H va double O bilan.","ru":"‘School’ — S-C-H-O-O-L, с немой H и двойной O."},{"uz":"Bosh harf I, London shahri uchun bosh harf va gap boshida bosh harf.","ru":"Заглавная I, заглавная для города London и заглавная в начале предложения."},{"uz":"H harfi ‘aitch’ deb ataladi.","ru":"Букву H называют ‘aitch’."},{"uz":"‘know’ soʻzida K jim — biz /noʊ/ deymiz.","ru":"В ‘know’ K немая — мы произносим /noʊ/."}],"blocks":[{"h":{"uz":"26 harf, 2 guruh","ru":"26 букв, 2 группы"},"p":[{"uz":"Jami <b>26 ta harf</b> bor. Ulardan beshtasi <b>unli</b>: A, E, I, O, U. Qolgan 21 tasi <b>undosh</b> (B, C, D, F, G, …).","ru":"Всего <b>26 букв</b>. Пять из них — <b>гласные</b>: A, E, I, O, U. Остальные 21 — <b>согласные</b> (B, C, D, F, G, …)."},{"uz":"Baʼzan <b>Y</b> unli kabi ishlaydi, masalan <b>happy</b> yoki <b>my</b>da.","ru":"Иногда <b>Y</b> ведёт себя как гласная, как в <b>happy</b> или <b>my</b>."}]},{"h":{"uz":"Nomi va tovushi","ru":"Название и звук"},"p":[{"uz":"Har bir harfning <b>nomi</b> (harfni qanday aytishingiz) va <b>tovushi</b> (soʻz ichida qanday ishlashi) bor.","ru":"У каждой буквы есть <b>название</b> (как вы её называете) и <b>звук</b> (как она работает в слове)."},{"uz":"Masalan, <b>B</b> harfi <b>“bee”</b> deb ataladi, lekin uning tovushi /b/, <b>book</b>dagidek.","ru":"Например, букву <b>B</b> называют <b>“bee”</b>, но её звук — /b/, как в <b>book</b>."}]},{"h":{"uz":"Ovozli hijjalash","ru":"Произношение по буквам"},"p":[{"uz":"Soʻzni har bir harfini aytib hijjalaymiz. Yonma-yon kelgan bir xil ikki harf <b>“double”</b> deyiladi.","ru":"Слово произносят по буквам, называя каждую. Две одинаковые буквы подряд называют <b>“double”</b>."},{"uz":"‘Hello’ = H – E – <b>double L</b> – O.","ru":"‘Hello’ = H – E – <b>double L</b> – O."}]},{"h":{"uz":"Bosh va kichik harflar","ru":"Заглавные и строчные буквы"},"p":[{"uz":"Har bir harfning <b>bosh</b> (A, B, C) va <b>kichik</b> (a, b, c) shakli bor.","ru":"У каждой буквы есть <b>заглавная</b> (A, B, C) и <b>строчная</b> (a, b, c) форма."},{"uz":"Bosh harflarni <b>gap boshlash</b> uchun, <b>ismlar</b> uchun, <b>I</b> soʻzi uchun, hamda davlat, kun va oylar uchun ishlatamiz.","ru":"Заглавные используем, чтобы <b>начать предложение</b>, для <b>имён</b>, для слова <b>I</b>, а также для стран, дней и месяцев."}]}]},"g2":{"lead":{"uz":"‘Be’ — ingliz tilidagi eng muhim feʼl. U kimligimizni, qanday his qilishimizni, narsalar qayerdaligini aytadi va taʼriflaydi. Hozirgi zamonda uch shakli bor: am, is, are.","ru":"‘Be’ — важнейший глагол в английском. Им говорят, кто мы, как себя чувствуем, где находятся вещи, и описывают людей и предметы. В настоящем времени три формы: am, is, are."},"situation":{"uz":"“I am a teacher. My sister is a doctor. We are from Tashkent.” ‘Be’ feʼli odamni kasb, joy yoki taʼrif bilan bogʻlaydi.","ru":"«I am a teacher. My sister is a doctor. We are from Tashkent.» Глагол ‘be’ связывает человека с профессией, местом или описанием."},"tip":{"uz":"it’s (= it is) va its (egalik)ni adashtirmang. ‘It’s cold’ = sovuq. ‘The dog likes its food’ = unga tegishli ovqat.","ru":"Не путайте it’s (= it is) и its (принадлежность). ‘It’s cold’ = холодно. ‘The dog likes its food’ = его еда."},"q":[{"uz":"‘I’ bilan ‘am’ ishlatamiz.","ru":"С ‘I’ используем ‘am’."},{"uz":"he/she/it bilan ‘is’ ishlatamiz.","ru":"С he/she/it используем ‘is’."},{"uz":"we/you/they bilan ‘are’ ishlatamiz.","ru":"С we/you/they используем ‘are’."},{"uz":"‘he is’ = ‘he’s’.","ru":"‘he is’ = ‘he’s’."},{"uz":"‘they’ bilan ‘are’ ishlatamiz.","ru":"С ‘they’ используем ‘are’."},{"uz":"‘you’ bilan ‘are’, savolda esa u birinchi keladi.","ru":"С ‘you’ — ‘are’, и в вопросе оно идёт первым."},{"uz":"‘is not’ = ‘isn’t’.","ru":"‘is not’ = ‘isn’t’."},{"uz":"‘we’ bilan inkor shakli ‘aren’t’.","ru":"С ‘we’ отрицание — ‘aren’t’."},{"uz":"Savol ‘Is she…?’ va qisqa javob ‘Yes, she is.’","ru":"Вопрос ‘Is she…?’ и краткий ответ ‘Yes, she is.’"},{"uz":"‘it’ bilan ‘is’ ishlatamiz.","ru":"С ‘it’ используем ‘is’."},{"uz":"‘am not’ qisqarmaydi; ‘I’m not’ deymiz.","ru":"‘am not’ не сокращается; говорим ‘I’m not’."},{"uz":"‘parents’ koʻplik → ‘are’.","ru":"‘parents’ — множественное → ‘are’."},{"uz":"Qisqa javoblarda qisqartirmaymiz: ‘Yes, they are.’","ru":"В кратких ответах не сокращаем: ‘Yes, they are.’"},{"uz":"‘name is’ (it) va ‘I am’.","ru":"‘name is’ (it) и ‘I am’."},{"uz":"‘she’ bilan ‘is’: She is my best friend.","ru":"С ‘she’ — ‘is’: She is my best friend."}],"blocks":[{"h":{"uz":"Uch shakl","ru":"Три формы"},"p":[{"uz":"<b>I</b> bilan <b>am</b>, <b>he / she / it</b> bilan <b>is</b>, <b>you / we / they</b> bilan <b>are</b> ishlating.","ru":"С <b>I</b> — <b>am</b>, с <b>he / she / it</b> — <b>is</b>, с <b>you / we / they</b> — <b>are</b>."}]},{"h":{"uz":"Qisqa shakllar","ru":"Краткие формы"},"p":[{"uz":"Nutqda va norasmiy yozuvda olmosh bilan ‘be’ni qoʻshamiz: I’m, you’re, he’s, she’s, it’s, we’re, they’re.","ru":"В речи и неформальном письме местоимение и ‘be’ объединяют: I’m, you’re, he’s, she’s, it’s, we’re, they’re."}]},{"h":{"uz":"Inkor","ru":"Отрицание"},"p":[{"uz":"‘be’dan keyin <b>not</b> qoʻshing. Qisqa shakllar: isn’t (= is not), aren’t (= are not). ‘am not’ qisqa shaklga ega emas.","ru":"После ‘be’ добавьте <b>not</b>. Краткие формы: isn’t (= is not), aren’t (= are not). У ‘am not’ нет краткой формы."}]},{"h":{"uz":"Savol va qisqa javoblar","ru":"Вопросы и краткие ответы"},"p":[{"uz":"Savol yasash uchun ‘be’ni ega <b>oldidan</b> qoʻying. wh-savollarda wh-soʻz birinchi keladi.","ru":"Чтобы задать вопрос, поставьте ‘be’ <b>перед</b> подлежащим. В wh-вопросах wh-слово идёт первым."}]}]},"g3":{"lead":{"uz":"Olmoshlar otlar oʻrnini bosadi, shunda ismlarni takrorlamaymiz. Egalik soʻzlari nimanidir kimga tegishliligini koʻrsatadi. Ularni toʻgʻri ishlatish nutqingizni tabiiy qiladi.","ru":"Местоимения заменяют существительные, чтобы не повторять имена. Притяжательные слова показывают принадлежность. Их правильное употребление делает речь естественной."},"tip":{"uz":"‘Their’ (egasi), ‘there’ (joy) va ‘they’re’ (= they are) bir xil eshitiladi, lekin har xil soʻzlar. ‘Their car is over there, and they’re late.’","ru":"‘Their’ (владелец), ‘there’ (место) и ‘they’re’ (= they are) звучат одинаково, но это разные слова."},"q":[{"uz":"Soʻzlovchi bilan birga guruh uchun ega olmoshi ‘We’.","ru":"Подлежащее для группы с говорящим — ‘We’."},{"uz":"Ot oldidan egalik sifati ‘my’ ishlatamiz.","ru":"Перед существительным — притяжательное ‘my’."},{"uz":"Feʼldan keyin toʻldiruvchi olmosh ‘him’.","ru":"После глагола — дополнение ‘him’."},{"uz":"Yakka holda egalik olmoshi ‘ours’.","ru":"Самостоятельно — притяжательное ‘ours’."},{"uz":"Ayol kishi uchun ega olmoshi ‘She’.","ru":"Подлежащее для женщины — ‘She’."},{"uz":"‘Its’ (apostrofsiz) egalikni bildiradi.","ru":"‘Its’ (без апострофа) показывает принадлежность."},{"uz":"Predlogdan keyin toʻldiruvchi olmosh ‘us’.","ru":"После предлога — дополнение ‘us’."},{"uz":"Yakka holda egalik olmoshi ‘yours’.","ru":"Самостоятельно — притяжательное ‘yours’."},{"uz":"Ot oldidan ‘their’ ishlatamiz.","ru":"Перед существительным — ‘their’."},{"uz":"Egalik uchun ’s qoʻshamiz: Anna’s.","ru":"Для принадлежности добавляем ’s: Anna’s."},{"uz":"Ega ‘I’: I like coffee.","ru":"Подлежащее ‘I’: I like coffee."},{"uz":"‘her book’ (egalik sifati) va ‘to me’ (toʻldiruvchi olmosh).","ru":"‘her book’ (притяж.) и ‘to me’ (дополнение)."},{"uz":"‘theirs’ yakka turadi: This house is theirs.","ru":"‘theirs’ стоит самостоятельно: This house is theirs."},{"uz":"Bu yerda ‘It’s’ (= it is) kerak, egalik ‘its’ emas.","ru":"Здесь нужно ‘It’s’ (= it is), а не притяжательное ‘its’."},{"uz":"Eganing bir qismi sifatida ‘I’: My brother and I.","ru":"Как часть подлежащего — ‘I’: My brother and I."}],"blocks":[{"h":{"uz":"Ega olmoshlari","ru":"Местоимения-подлежащие"},"p":[{"uz":"Ular harakatni bajaradi va odatda feʼldan oldin keladi: <b>I, you, he, she, it, we, they</b>.","ru":"Они выполняют действие и обычно стоят перед глаголом: <b>I, you, he, she, it, we, they</b>."}]},{"h":{"uz":"Toʻldiruvchi olmoshlar","ru":"Местоимения-дополнения"},"p":[{"uz":"Ular harakatni qabul qiladi va feʼl yoki predlogdan keyin keladi: <b>me, you, him, her, it, us, them</b>.","ru":"Они принимают действие и стоят после глагола или предлога: <b>me, you, him, her, it, us, them</b>."}]},{"h":{"uz":"Egalik sifatlari","ru":"Притяжательные прилагательные"},"p":[{"uz":"Ular egasini koʻrsatish uchun <b>ot oldidan</b> keladi: <b>my, your, his, her, its, our, their</b>.","ru":"Они стоят <b>перед существительным</b> и показывают владельца: <b>my, your, his, her, its, our, their</b>."}]},{"h":{"uz":"Egalik olmoshlari va ’s","ru":"Притяжательные местоимения и ’s"},"p":[{"uz":"Egalik olmoshlari <b>yakka</b> turadi: mine, yours, his, hers, ours, theirs. Shuningdek, egalikni koʻrsatish uchun ismga <b>’s</b> qoʻshamiz.","ru":"Притяжательные местоимения стоят <b>самостоятельно</b>: mine, yours, his, hers, ours, theirs. Также к имени добавляем <b>’s</b> для принадлежности."}]}]},"g4":{"lead":{"uz":"Artikllar (a, an, the) ot oldidagi kichik soʻzlar. Toʻgʻrisini tanlash va koʻplik yasashni bilish aniq va toʻgʻri ingliz tili uchun zarur.","ru":"Артикли (a, an, the) — маленькие слова перед существительным. Правильный выбор и умение образовывать множественное число важны для грамотного английского."},"tip":{"uz":"a/an’ni harf emas, tovushga qarab tanlang. ‘an MP’ (em-tovush) toʻgʻri; ‘a university’ (yoo-tovush) ham toʻgʻri.","ru":"Выбирайте a/an по звуку, а не по букве. ‘an MP’ (звук «эм») верно; ‘a university’ (звук «ю») тоже верно."},"q":[{"uz":"‘Apple’ unli tovush bilan boshlanadi, shuning uchun ‘an’.","ru":"‘Apple’ начинается с гласного звука, поэтому ‘an’."},{"uz":"‘Book’ undosh tovush bilan boshlanadi, shuning uchun ‘a’.","ru":"‘Book’ начинается с согласного звука, поэтому ‘a’."},{"uz":"Koʻp otlar shunchaki -s qoʻshadi: cats.","ru":"Большинство существительных просто добавляют -s: cats."},{"uz":"-x dan keyin -es qoʻshamiz: boxes.","ru":"После -x добавляем -es: boxes."},{"uz":"Quyosh bitta, shuning uchun ‘the’ ishlatamiz.","ru":"Солнце одно, поэтому ‘the’."},{"uz":"Undosh + y → -ies: babies.","ru":"Согласная + y → -ies: babies."},{"uz":"‘an orange’ (unli tovush), ‘a banana’ (undosh tovush).","ru":"‘an orange’ (гласный), ‘a banana’ (согласный)."},{"uz":"‘Water’ sanoqsiz — koʻplik yoʻq, a/an yoʻq.","ru":"‘Water’ неисчисляемое — нет множественного, нет a/an."},{"uz":"‘man’ tartibsiz: men.","ru":"‘man’ — неправильное: men."},{"uz":"Film endi maʼlum, shuning uchun ‘the’.","ru":"Фильм уже известен, поэтому ‘the’."},{"uz":"‘Hour’da jim h (unli tovush), shuning uchun ‘an hour’.","ru":"В ‘hour’ немая h (гласный звук), поэтому ‘an hour’."},{"uz":"‘University’ ‘yoo’ tovushi bilan boshlanadi, shuning uchun ‘a university’.","ru":"‘University’ начинается со звука «ю», поэтому ‘a university’."},{"uz":"‘child’ tartibsiz: children.","ru":"‘child’ — неправильное: children."},{"uz":"‘Money’ sanoqsiz: ‘I need money / some money.’","ru":"‘Money’ неисчисляемое: ‘I need money / some money.’"},{"uz":"‘an egg’ (unli), ‘a spoon’ (undosh), ‘the table’ (aniq).","ru":"‘an egg’ (гласный), ‘a spoon’ (согласный), ‘the table’ (конкретное)."}],"blocks":[{"h":{"uz":"a / an — bitta, aniq emas","ru":"a / an — один, неконкретный"},"p":[{"uz":"Undosh <b>tovush</b> oldidan <b>a</b>, unli <b>tovush</b> oldidan <b>an</b> ishlating. Ularni birinchi marta tilga olingan birlik narsalar uchun ishlatamiz.","ru":"Перед согласным <b>звуком</b> — <b>a</b>, перед гласным <b>звуком</b> — <b>an</b>. Используем для единичных предметов, упомянутых впервые."}]},{"h":{"uz":"the — aniq / allaqachon maʼlum","ru":"the — конкретное / уже известное"},"p":[{"uz":"Soʻzlovchi va tinglovchi qaysi biri ekanini bilsa yoki bitta boʻlsa, <b>the</b> ishlating.","ru":"Используйте <b>the</b>, когда и говорящий, и слушающий знают, о ком речь, или предмет один."}]},{"h":{"uz":"Oddiy koʻplik","ru":"Правильное множественное число"},"p":[{"uz":"Koʻp otlar <b>-s</b> qoʻshadi. -s, -ss, -ch, -sh, -x dan keyin <b>-es</b> qoʻshamiz. Undosh + y → <b>-ies</b>.","ru":"Большинство существительных добавляют <b>-s</b>. После -s, -ss, -ch, -sh, -x — <b>-es</b>. Согласная + y → <b>-ies</b>."}]},{"h":{"uz":"Tartibsiz koʻplik va sanoqsizlar","ru":"Неправильное множественное и неисчисляемые"},"p":[{"uz":"Baʼzi koʻpliklar tartibsiz. Baʼzi otlar <b>sanoqsiz</b> (koʻplik yoʻq, a/an yoʻq): water, rice, money, information.","ru":"Некоторые формы множественного неправильные. Некоторые существительные <b>неисчисляемые</b> (нет множественного, нет a/an): water, rice, money, information."}]}]},"g5":{"lead":{"uz":"This, that, these va those odam yoki narsalarga ishora qiladi. Ular son (bitta yoki koʻp) va masofani (yaqin yoki uzoq) bildiradi.","ru":"This, that, these и those указывают на людей или предметы. Они показывают число (один или много) и расстояние (близко или далеко)."},"tip":{"uz":"Sonni diqqat bilan moslang: ‘these book’ notoʻgʻri. this book (bitta) yoki these books (koʻp) deng.","ru":"Внимательно согласуйте число: ‘these book’ неверно. Говорите this book (один) или these books (много)."},"q":[{"uz":"Yaqin + birlik = ‘This’.","ru":"Близко + единственное = ‘This’."},{"uz":"Yaqin + koʻplik = ‘These’.","ru":"Близко + множественное = ‘These’."},{"uz":"Uzoq + birlik = ‘that’.","ru":"Далеко + единственное = ‘that’."},{"uz":"Uzoq + koʻplik = ‘Those’.","ru":"Далеко + множественное = ‘Those’."},{"uz":"this → these.","ru":"this → these."},{"uz":"Yaqin + koʻplik ‘apples’ = ‘These’.","ru":"Близко + множественное ‘apples’ = ‘These’."},{"uz":"Yaqin + birlik = ‘this’.","ru":"Близко + единственное = ‘this’."},{"uz":"Telefonda oʻzimizni tanishtirib ‘this is …’ deymiz.","ru":"По телефону представляемся: ‘this is …’."},{"uz":"that → those.","ru":"that → those."},{"uz":"Ikki kishini tanishtirish (koʻplik) = ‘These’.","ru":"Представляя двух людей (множественное) = ‘These’."},{"uz":"Koʻplik ‘books’ uchun ‘These … are’ kerak.","ru":"Для множественного ‘books’ нужно ‘These … are’."},{"uz":"Yaqin koʻplik ‘These’ vs uzoq koʻplik ‘those’.","ru":"Близкое мн. ‘These’ vs далёкое мн. ‘those’."},{"uz":"‘car’ birlik va yaqin, shuning uchun ‘this car’ (yoki uzoq ‘that car’).","ru":"‘car’ единственное и близко, поэтому ‘this car’ (или далёкое ‘that car’)."},{"uz":"Koʻplik ‘friends’ → ‘Those are’ (yoki ‘These are’).","ru":"Множественное ‘friends’ → ‘Those are’ (или ‘These are’)."},{"uz":"Bitta narsa, yaqin/hozir = ‘This’.","ru":"Один предмет, близко/сейчас = ‘This’."}],"blocks":[{"h":{"uz":"Yaqin va uzoq","ru":"Близко и далеко"},"p":[{"uz":"Sizga <b>yaqin</b> narsalar uchun <b>this/these</b>, sizdan <b>uzoq</b> narsalar uchun <b>that/those</b> ishlating.","ru":"Для предметов <b>близко</b> — <b>this/these</b>, для предметов <b>далеко</b> — <b>that/those</b>."}]},{"h":{"uz":"Birlik va koʻplik","ru":"Единственное и множественное"},"p":[{"uz":"<b>This</b> va <b>that</b> — birlik (bitta). <b>These</b> va <b>those</b> — koʻplik (bittadan koʻp).","ru":"<b>This</b> и <b>that</b> — единственное (один). <b>These</b> и <b>those</b> — множественное (больше одного)."}]},{"h":{"uz":"Olmosh va sifat sifatida","ru":"Как местоимения и прилагательные"},"p":[{"uz":"Ular yakka turishi (olmosh) yoki ot oldidan kelishi (sifat) mumkin.","ru":"Они могут стоять самостоятельно (местоимение) или перед существительным (прилагательное)."}]},{"h":{"uz":"Keng tarqalgan iboralar","ru":"Частые выражения"},"p":[{"uz":"Ularni telefonda va odamlarni tanishtirishda ishlatamiz.","ru":"Их используют по телефону и при знакомстве людей."}]}]},"g6":{"lead":{"uz":"Hozirgi oddiy zamon — faktlar, kundalik ishlar va odatlar uchun. U kundalik ingliz tilidagi eng koʻp ishlatiladigan zamon.","ru":"Present simple — для фактов, распорядка и привычек, того, что обычно верно или происходит регулярно. Это самое частое время в повседневном английском."},"situation":{"uz":"Tom is a nurse. He works at a hospital. He starts at 8 and finishes at 4. He doesn’t work on Sundays. — Odat, kundalik ish va umumiy faktlar uchun present simple ishlatamiz.","ru":"Tom is a nurse. He works at a hospital. He starts at 8 and finishes at 4. He doesn’t work on Sundays. — Present simple используем для привычек, распорядка и общих фактов."},"tip":{"uz":"does/doesn’t dan keyin feʼlda -s boʻlmaydi: ‘She doesn’t likes’ notoʻgʻri → ‘She doesn’t like.’ -s allaqachon ‘does’da bor.","ru":"После does/doesn’t у глагола нет -s: ‘She doesn’t likes’ неверно → ‘She doesn’t like.’ -s уже в ‘does’."},"q":[{"uz":"‘he’ bilan -s qoʻshamiz: goes.","ru":"С ‘he’ добавляем -s: goes."},{"uz":"‘I’ bilan asosiy feʼl: drink.","ru":"С ‘I’ — базовый глагол: drink."},{"uz":"‘they’ bilan asosiy feʼl: play.","ru":"С ‘they’ — базовый глагол: play."},{"uz":"‘she’ bilan -s qoʻshamiz: speaks.","ru":"С ‘she’ добавляем -s: speaks."},{"uz":"‘we’ bilan asosiy feʼl: live.","ru":"С ‘we’ — базовый глагол: live."},{"uz":"‘she’ bilan inkor ‘doesn’t’.","ru":"С ‘she’ отрицание — ‘doesn’t’."},{"uz":"Undosh + y → -ies: studies.","ru":"Согласная + y → -ies: studies."},{"uz":"‘you’ bilan ‘Do’ ishlatamiz.","ru":"С ‘you’ используем ‘Do’."},{"uz":"Takror ravishi feʼldan oldin keladi: I always eat.","ru":"Наречие частотности идёт перед глаголом: I always eat."},{"uz":"‘she’ bilan ‘Does’ ishlatamiz.","ru":"С ‘she’ используем ‘Does’."},{"uz":"doesn’t + asosiy feʼl (-s yoʻq): He doesn’t play.","ru":"doesn’t + базовый глагол (без -s): He doesn’t play."},{"uz":"-o dan keyin -es qoʻshamiz: goes.","ru":"После -o добавляем -es: goes."},{"uz":"‘does’ dan keyin feʼlda -s yoʻq: ‘Does she like pizza?’","ru":"После ‘does’ у глагола нет -s: ‘Does she like pizza?’"},{"uz":"‘father goes’ (he) va ‘I prefer’.","ru":"‘father goes’ (he) и ‘I prefer’."},{"uz":"‘never’ allaqachon inkor va feʼldan oldin keladi: He never eats meat.","ru":"‘never’ уже отрицательное и идёт перед глаголом: He never eats meat."}],"blocks":[{"h":{"uz":"Qachon ishlatamiz","ru":"Когда используем"},"p":[{"uz":"<b>Kundalik ishlar</b> (har kuni), <b>faktlar</b> (doim toʻgʻri) va <b>odatlar</b> uchun.","ru":"Для <b>распорядка</b> (каждый день), <b>фактов</b> (всегда верно) и <b>привычек</b>."}]},{"h":{"uz":"Uchinchi shaxs -s","ru":"-s в третьем лице"},"p":[{"uz":"<b>he, she, it</b> bilan feʼlga <b>-s</b> qoʻshamiz. -o, -ss, -ch, -sh, -x dan keyin <b>-es</b>; undosh + y → <b>-ies</b>.","ru":"С <b>he, she, it</b> к глаголу добавляем <b>-s</b>. После -o, -ss, -ch, -sh, -x — <b>-es</b>; согласная + y → <b>-ies</b>."}]},{"h":{"uz":"Inkor","ru":"Отрицание"},"p":[{"uz":"<b>don’t</b> (I/you/we/they) va <b>doesn’t</b> (he/she/it) + asosiy feʼl (-s yoʻq) ishlating.","ru":"Используйте <b>don’t</b> (I/you/we/they) и <b>doesn’t</b> (he/she/it) + базовый глагол (без -s)."}]},{"h":{"uz":"Savollar va takrorlik","ru":"Вопросы и частотность"},"p":[{"uz":"<b>Do/Does</b> + ega + asosiy feʼl ishlating. Takror ravishlari (always, usually, often, sometimes, never) asosiy feʼldan <b>oldin</b> keladi.","ru":"Используйте <b>Do/Does</b> + подлежащее + базовый глагол. Наречия частотности (always, usually, often, sometimes, never) стоят <b>перед</b> главным глаголом."}]}]},"g7":{"lead":{"uz":"Hozirgi davom zamoni hozir, shu daqiqada yoki shu atrofda (vaqtinchalik holat) sodir boʻlayotgan ishni bildiradi. ‘be’ + feʼl-ing bilan yasaladi.","ru":"Present continuous описывает действие, происходящее сейчас, в этот момент или в этот период (временно). Образуется ‘be’ + глагол-ing."},"situation":{"uz":"Look! It is raining and the children are playing inside. — Hozir, gapirayotgan paytda sodir boʻlayotgan ish uchun present continuous ishlatamiz.","ru":"Look! It is raining and the children are playing inside. — Present continuous используем для действия, происходящего сейчас, в момент речи."},"tip":{"uz":"Baʼzi feʼllar (like, want, know, love, need, understand) holatni bildiradi, harakatni emas. Ularni odatda davom shaklida ishlatmaymiz: ‘I want tea’, ‘I am wanting tea’ emas.","ru":"Некоторые глаголы (like, want, know, love, need, understand) выражают состояние, а не действие. Их обычно не ставят в continuous: ‘I want tea’, а не ‘I am wanting tea’."},"q":[{"uz":"‘now’ → present continuous: is crying.","ru":"‘now’ → present continuous: is crying."},{"uz":"‘at the moment’ → are playing.","ru":"‘at the moment’ → are playing."},{"uz":"‘right now’ → am reading.","ru":"‘right now’ → am reading."},{"uz":"Jim -e tushadi: making.","ru":"Немая -e отпадает: making."},{"uz":"‘now’ → is listening.","ru":"‘now’ → is listening."},{"uz":"Qisqa urgʻuli unli → undoshni ikkilantiramiz: running.","ru":"Краткий ударный гласный → удваиваем согласную: running."},{"uz":"‘at the moment’ → are having.","ru":"‘at the moment’ → are having."},{"uz":"‘right now’ davom shaklini talab qiladi.","ru":"‘right now’ требует продолженной формы."},{"uz":"Present continuous inkori: isn’t watching.","ru":"Отрицание present continuous: isn’t watching."},{"uz":"Qisqa urgʻuli unli → ikkilantirish: sitting.","ru":"Краткий ударный гласный → удвоение: sitting."},{"uz":"‘want’ — holat feʼli, davomda ishlatilmaydi: I want a coffee.","ru":"‘want’ — глагол состояния, не в continuous: I want a coffee."},{"uz":"Hozir sodir boʻlayotgan harakat → are taking.","ru":"Действие сейчас → are taking."},{"uz":"‘ie’ → ‘y’: lying.","ru":"‘ie’ → ‘y’: lying."},{"uz":"Davom savoli: Are you doing…?","ru":"Вопрос в continuous: Are you doing…?"},{"uz":"‘is’ dan keyin -ing shakli kerak: She is reading.","ru":"После ‘is’ нужна форма -ing: She is reading."}],"blocks":[{"h":{"uz":"Shakl: am/is/are + -ing","ru":"Форма: am/is/are + -ing"},"p":[{"uz":"‘be’ning toʻgʻri shaklini ishlating va asosiy feʼlga <b>-ing</b> qoʻshing.","ru":"Используйте нужную форму ‘be’ и добавьте <b>-ing</b> к главному глаголу."}]},{"h":{"uz":"-ing imlo qoidalari","ru":"Правила написания -ing"},"p":[{"uz":"Oxiridagi jim <b>-e</b>ni tushiring (make → making). Qisqa urgʻuli unlidan keyin oxirgi undoshni ikkilantiring (run → running). ‘ie’ → ‘y’ (lie → lying).","ru":"Опускайте конечную немую <b>-e</b> (make → making). Удваивайте конечную согласную после краткого ударного гласного (run → running). ‘ie’ → ‘y’ (lie → lying)."}]},{"h":{"uz":"Hozir va kundalik","ru":"Сейчас и распорядок"},"p":[{"uz":"Present simple = kundalik ishlar/faktlar. Present continuous = <b>hozir</b> sodir boʻlayotgan yoki vaqtinchalik.","ru":"Present simple = распорядок/факты. Present continuous = происходит <b>сейчас</b> или временно."}]},{"h":{"uz":"Inkor va savollar","ru":"Отрицания и вопросы"},"p":[{"uz":"Inkor: ‘be’dan keyin <b>not</b> qoʻshing. Savol: ‘be’ni birinchi qoʻying.","ru":"Отрицание: после ‘be’ добавьте <b>not</b>. Вопрос: поставьте ‘be’ первым."}]}]},"g8":{"lead":{"uz":"‘Have got’ egalik, oila va xususiyatlar haqida. ‘There is / there are’ nimadir mavjudligini yoki borligini bildiradi. Ikkalasi ham kundalik nutqda juda koʻp uchraydi.","ru":"‘Have got’ — о принадлежности, семье и признаках. ‘There is / there are’ — о существовании или наличии. Оба очень частотны в речи."},"tip":{"uz":"Ularni aralashtirmang: egasi uchun have got (‘I have got a dog’), mavjudlik uchun there is/are (‘There is a dog in the garden’).","ru":"Не путайте: для владельца — have got (‘I have got a dog’), для существования — there is/are (‘There is a dog in the garden’)."},"q":[{"uz":"‘I’ bilan ‘have got’.","ru":"С ‘I’ — ‘have got’."},{"uz":"‘she’ bilan ‘has got’.","ru":"С ‘she’ — ‘has got’."},{"uz":"Birlik ‘a pen’ → There is.","ru":"Единственное ‘a pen’ → There is."},{"uz":"Koʻplik ‘windows’ → There are.","ru":"Множественное ‘windows’ → There are."},{"uz":"‘I have’ = ‘I’ve’ → I’ve got.","ru":"‘I have’ = ‘I’ve’ → I’ve got."},{"uz":"‘we’ bilan inkor ‘haven’t got’.","ru":"С ‘we’ отрицание — ‘haven’t got’."},{"uz":"‘milk’ sanoqsiz (birlik) → Is there.","ru":"‘milk’ неисчисляемое (единственное) → Is there."},{"uz":"‘he’ bilan savol ‘Has he got…?’.","ru":"С ‘he’ вопрос — ‘Has he got…?’."},{"uz":"‘people’ koʻplik → are.","ru":"‘people’ множественное → are."},{"uz":"Koʻplik ‘chairs’ → There aren’t.","ru":"Множественное ‘chairs’ → There aren’t."},{"uz":"‘she’ bilan: She has got a dog.","ru":"С ‘she’: She has got a dog."},{"uz":"‘a problem’ (birlik) → there is; ‘answers’ (koʻplik) → there are.","ru":"‘a problem’ (ед.) → there is; ‘answers’ (мн.) → there are."},{"uz":"Koʻplik ‘five students’ uchun ‘There are’ kerak.","ru":"Для множественного ‘five students’ нужно ‘There are’."},{"uz":"‘you’ bilan: Have you got a car?","ru":"С ‘you’: Have you got a car?"},{"uz":"‘sister has got’ (egalik) + ‘there is a park’ (mavjudlik, birlik).","ru":"‘sister has got’ (принадлежность) + ‘there is a park’ (существование, ед.)."}],"blocks":[{"h":{"uz":"have got = have (egalik)","ru":"have got = have (принадлежность)"},"p":[{"uz":"<b>have got</b> (I/you/we/they) va <b>has got</b> (he/she/it) ishlating. Qisqa shakllar: I’ve got, she’s got.","ru":"Используйте <b>have got</b> (I/you/we/they) и <b>has got</b> (he/she/it). Краткие формы: I’ve got, she’s got."}]},{"h":{"uz":"have got bilan inkor va savollar","ru":"Отрицания и вопросы с have got"},"p":[{"uz":"Inkor: <b>haven’t/hasn’t got</b>. Savol: <b>Have/Has</b> + ega + got?","ru":"Отрицание: <b>haven’t/hasn’t got</b>. Вопрос: <b>Have/Has</b> + подлежащее + got?"}]},{"h":{"uz":"there is / there are","ru":"there is / there are"},"p":[{"uz":"Nimadir mavjudligini aytish uchun <b>there is</b> (+ birlik / sanoqsiz) va <b>there are</b> (+ koʻplik) ishlating.","ru":"Чтобы сказать о существовании, используйте <b>there is</b> (+ ед./неисчисляемое) и <b>there are</b> (+ мн.)."}]},{"h":{"uz":"Inkor va savollar","ru":"Отрицания и вопросы"},"p":[{"uz":"Inkor: there isn’t / there aren’t. Savol: Is there…? / Are there…?","ru":"Отрицание: there isn’t / there aren’t. Вопрос: Is there…? / Are there…?"}]}]},"g9":{"lead":{"uz":"‘Can’ qobiliyat, imkoniyat va ruxsatni bildiradi. ‘Can’t’ uning inkori. Buyruq mayli koʻrsatma, buyruq va maslahat beradi. Ikkalasi ham qisqa va juda foydali.","ru":"‘Can’ выражает способность, возможность и разрешение. ‘Can’t’ — его отрицание. Повелительное наклонение даёт указания, приказы и советы. Оба коротки и полезны."},"situation":{"uz":"“Can you swim?” — “Yes, I can, but I can’t dive.” Can qobiliyat va imkoniyatni bildiradi va shakli oʻzgarmaydi.","ru":"«Can you swim?» — «Yes, I can, but I can’t dive.» Can выражает способность и возможность и не меняет форму."},"tip":{"uz":"‘can’ dan keyin hech qachon ‘to’ ishlatmang: ‘I can to swim’ notoʻgʻri → ‘I can swim.’ Va ‘can’ he/she/it bilan -s olmaydi: ‘She can swim’, ‘She cans’ emas.","ru":"После ‘can’ никогда не ставьте ‘to’: ‘I can to swim’ неверно → ‘I can swim.’ И ‘can’ не получает -s с he/she/it: ‘She can swim’, а не ‘She cans’."},"q":[{"uz":"‘can’ + asosiy feʼl, -s yoʻq, ‘to’ yoʻq.","ru":"‘can’ + базовый глагол, без -s, без ‘to’."},{"uz":"Inkor qobiliyat = can’t.","ru":"Отрицательная способность = can’t."},{"uz":"Ruxsat soʻrash: ‘Can I…?’","ru":"Просьба о разрешении: ‘Can I…?’"},{"uz":"Buyruq mayli asosiy feʼl bilan: Open.","ru":"Повелительное — базовый глагол: Open."},{"uz":"‘can’ oʻzgarmaydi: She can speak.","ru":"‘can’ не меняется: She can speak."},{"uz":"Inkor buyruq: Don’t be late!","ru":"Отрицательное повеление: Don’t be late!"},{"uz":"Inkor qobiliyat: can’t hear.","ru":"Отрицательная способность: can’t hear."},{"uz":"can + asosiy feʼl: I can play.","ru":"can + базовый глагол: I can play."},{"uz":"‘be’ buyrugʻi shunchaki ‘Be’.","ru":"Повеление ‘be’ — просто ‘Be’."},{"uz":"Inkor qobiliyat/imkoniyat: can’t come.","ru":"Отрицательная способность/возможность: can’t come."},{"uz":"‘can’ -s olmaydi va feʼl asosiy qoladi: She can cook.","ru":"‘can’ без -s, глагол в базовой форме: She can cook."},{"uz":"Inkor buyruq: Don’t + asosiy feʼl.","ru":"Отрицательное повеление: Don’t + базовый глагол."},{"uz":"‘can’ dan keyin ‘to’ ishlatmaymiz: Can you help me?","ru":"После ‘can’ не ставим ‘to’: Can you help me?"},{"uz":"Ichkarida ruxsat yoʻq (can’t), tashqarida ruxsat (can).","ru":"Внутри нельзя (can’t), снаружи можно (can)."},{"uz":"Buyruq + please: ‘Sit down, please.’","ru":"Повеление + please: ‘Sit down, please.’"}],"blocks":[{"h":{"uz":"qobiliyat uchun can","ru":"can для способности"},"p":[{"uz":"<b>Can</b> + asosiy feʼl ‘qodir’ degani. U shaklini hech qachon oʻzgartirmaydi (-s yoʻq, ‘to’ yoʻq).","ru":"<b>Can</b> + базовый глагол значит ‘уметь/мочь’. Форма никогда не меняется (без -s, без ‘to’)."}]},{"h":{"uz":"ruxsat/soʻrov uchun can","ru":"can для разрешения/просьбы"},"p":[{"uz":"Shuningdek, ruxsat soʻrash va berish uchun <b>can</b> ishlatamiz.","ru":"Также <b>can</b> используют, чтобы просить и давать разрешение."}]},{"h":{"uz":"can’t (inkor)","ru":"can’t (отрицание)"},"p":[{"uz":"Inkor shakli <b>can’t</b> (cannot). Barcha egalar uchun bir xil.","ru":"Отрицание — <b>can’t</b> (cannot). Одна форма для всех подлежащих."}]},{"h":{"uz":"Buyruq mayli","ru":"Повелительное наклонение"},"p":[{"uz":"Koʻrsatma berish uchun <b>asosiy feʼl</b> ishlating. Inkor buyruq uchun <b>don’t</b> qoʻshing. Muloyimlik uchun koʻpincha ‘please’ qoʻshamiz.","ru":"Для указания используйте <b>базовый глагол</b>. Для отрицательного повеления добавьте <b>don’t</b>. Для вежливости часто добавляем ‘please’."}]}]},"g10":{"lead":{"uz":"Sifatlar otlarni taʼriflaydi — odam, joy va narsalar qanaqaligini aytadi. Ularning oʻrnini va keng tarqalgan qarama-qarshilarini bilish taʼrifni aniq qiladi.","ru":"Прилагательные описывают существительные — какими являются люди, места и вещи. Знание их места и распространённых антонимов делает описание ясным."},"tip":{"uz":"Ingliz tilida sifatlar hech qachon koʻplik -s olmaydi: ‘three big dogs’ deng, ‘three bigs dogs’ emas.","ru":"В английском прилагательные никогда не получают -s множественного: ‘three big dogs’, а не ‘three bigs dogs’."},"q":[{"uz":"Sifat ot oldidan: a red car.","ru":"Прилагательное перед существительным: a red car."},{"uz":"big ↔ small.","ru":"big ↔ small."},{"uz":"Sifat ‘be’ dan keyin, koʻplik -s yoʻq: are beautiful.","ru":"Прилагательное после ‘be’, без -s: are beautiful."},{"uz":"hot ↔ cold.","ru":"hot ↔ cold."},{"uz":"‘day’ oldidan sifat kerak: a sunny day.","ru":"Перед ‘day’ нужно прилагательное: a sunny day."},{"uz":"Sifat ‘be’ dan keyin, -s yoʻq: are happy.","ru":"Прилагательное после ‘be’, без -s: are happy."},{"uz":"difficult ↔ easy.","ru":"difficult ↔ easy."},{"uz":"Oʻlcham rangdan oldin: a small black bag.","ru":"Размер перед цветом: a small black bag."},{"uz":"Sifat birlikda qoladi: blue eyes.","ru":"Прилагательное в единственном: blue eyes."},{"uz":"‘very’ + sifat: very good.","ru":"‘very’ + прилагательное: very good."},{"uz":"Sifatlar -s olmaydi: two red pens.","ru":"Прилагательные без -s: two red pens."},{"uz":"Fikr (nice) oʻlchamdan (big) oldin: a nice big house.","ru":"Мнение (nice) перед размером (big): a nice big house."},{"uz":"old ↔ young; sifatlar birlikda qoladi.","ru":"old ↔ young; прилагательные в единственном."},{"uz":"‘interesting’ unli tovush bilan boshlanadi → ‘an’, va sifat ot oldidan keladi.","ru":"‘interesting’ начинается с гласного → ‘an’, и прилагательное перед существительным."},{"uz":"‘an’ (unli tovush) + fikr/fakt tartibi: an expensive new phone.","ru":"‘an’ (гласный) + порядок мнение/факт: an expensive new phone."}],"blocks":[{"h":{"uz":"Oʻrni","ru":"Положение"},"p":[{"uz":"Sifat odatda <b>ot oldidan</b> yoki <b>‘be’ feʼlidan keyin</b> keladi. U koʻplik uchun oʻzgarmaydi.","ru":"Прилагательное обычно стоит <b>перед существительным</b> или <b>после глагола ‘be’</b>. Во множественном не меняется."}]},{"h":{"uz":"Keng tarqalgan qarama-qarshilar","ru":"Частые антонимы"},"p":[{"uz":"Sifatlarni juftlikda oʻrganing.","ru":"Учите прилагательные парами."}]},{"h":{"uz":"Sifatlar tartibi (asosiy)","ru":"Порядок прилагательных (основы)"},"p":[{"uz":"Ikki sifat otni taʼriflasa, fikr faktdan oldin keladi: a <b>nice big</b> house (fikr + oʻlcham).","ru":"Когда два прилагательных описывают существительное, мнение идёт перед фактом: a <b>nice big</b> house (мнение + размер)."}]},{"h":{"uz":"Very / really","ru":"Very / really"},"p":[{"uz":"Sifatni kuchaytirish uchun undan oldin <b>very</b> yoki <b>really</b> ishlating.","ru":"Чтобы усилить прилагательное, ставьте перед ним <b>very</b> или <b>really</b>."}]}]},"g11":{"lead":{"uz":"‘Some’ va ‘any’ aniq boʻlmagan miqdor haqida. Ular orasida tanlash gap tasdiq, inkor yoki savol ekanligiga va ot sanaladimi-yoʻqligiga bogʻliq.","ru":"‘Some’ и ‘any’ говорят о неточном количестве. Выбор зависит от того, утверждение это, отрицание или вопрос, и можно ли сосчитать существительное."},"tip":{"uz":"Sanoqsiz otlar bilan a/an yoki koʻplik ishlatmang: ‘some bread’ deng, ‘a bread’ yoki ‘breads’ emas.","ru":"С неисчисляемыми не используйте a/an или множественное: ‘some bread’, а не ‘a bread’ или ‘breads’."},"q":[{"uz":"Tasdiq gap → some.","ru":"Утвердительное предложение → some."},{"uz":"Inkor gap → any.","ru":"Отрицательное предложение → any."},{"uz":"Savol → any.","ru":"Вопрос → any."},{"uz":"‘Rice’ sanoqsiz.","ru":"‘Rice’ неисчисляемое."},{"uz":"Tasdiq + koʻplik → some.","ru":"Утверждение + множественное → some."},{"uz":"Muloyim taklif ‘some’ ishlatadi.","ru":"Вежливое предложение использует ‘some’."},{"uz":"Inkor → any.","ru":"Отрицание → any."},{"uz":"Muloyim soʻrov ‘some’ ishlatadi.","ru":"Вежливая просьба использует ‘some’."},{"uz":"‘Bread’ sanoqsiz → some bread.","ru":"‘Bread’ неисчисляемое → some bread."},{"uz":"Tasdiq + koʻplik → some.","ru":"Утверждение + множественное → some."},{"uz":"Oddiy savolda ‘any’ ishlatamiz: Do you have any questions?","ru":"В обычном вопросе используем ‘any’: Do you have any questions?"},{"uz":"Tasdiq → some rice; inkor → any vegetables.","ru":"Утверждение → some rice; отрицание → any vegetables."},{"uz":"Inkor + koʻplik → aren’t any.","ru":"Отрицание + множественное → aren’t any."},{"uz":"Takliflar ‘some’ ishlatadi: Would you like some cake?","ru":"Предложения используют ‘some’: Would you like some cake?"},{"uz":"Savol → any; tasdiq javob → some.","ru":"Вопрос → any; утвердительный ответ → some."}],"blocks":[{"h":{"uz":"Sanaladigan va sanoqsiz","ru":"Исчисляемое и неисчисляемое"},"p":[{"uz":"Sanaladigan otlarning koʻpligi bor (apple → apples). Sanoqsizlarda yoʻq (water, rice, money, bread).","ru":"У исчисляемых есть множественное (apple → apples). У неисчисляемых нет (water, rice, money, bread)."}]},{"h":{"uz":"some — tasdiq gaplar","ru":"some — утвердительные предложения"},"p":[{"uz":"Koʻplik va sanoqsiz otlar bilan tasdiq gaplarda <b>some</b> ishlating.","ru":"В утвердительных предложениях с множественными и неисчисляемыми используйте <b>some</b>."}]},{"h":{"uz":"any — inkor va savollar","ru":"any — отрицания и вопросы"},"p":[{"uz":"Inkor va koʻp savollarda <b>any</b> ishlating.","ru":"В отрицаниях и большинстве вопросов используйте <b>any</b>."}]},{"h":{"uz":"takliflar/soʻrovlarda some","ru":"some в предложениях/просьбах"},"p":[{"uz":"Muloyim takliflar va soʻrovlarda, savol boʻlsa ham, <b>some</b> (any emas) ishlatamiz.","ru":"В вежливых предложениях и просьбах, хотя это вопросы, используем <b>some</b> (не any)."}]}]},"g12":{"lead":{"uz":"Predloglar joy va vaqt munosabatlarini koʻrsatadigan kichik soʻzlar. Eng koʻp uchraydiganlari in, on, at va bir nechta harakat soʻzlari. Ularni tayyor iboralarda oʻrganing.","ru":"Предлоги — маленькие слова, показывающие отношения места и времени. Самые частые — in, on, at и несколько слов движения. Учите их в устойчивых выражениях."},"tip":{"uz":"Vaqt predloglari naqsh boʻyicha: at = kichik (soat vaqti), on = oʻrta (kun), in = katta (oy/yil). Kichik → katta deb oʻylang.","ru":"Предлоги времени по схеме: at = малое (часы), on = среднее (день), in = большое (месяц/год). Думайте малое → большое."},"q":[{"uz":"Yuza → on the table.","ru":"Поверхность → on the table."},{"uz":"Shaharlar ‘in’ ishlatadi.","ru":"Города используют ‘in’."},{"uz":"Pastda = under.","ru":"Внизу = under."},{"uz":"Kunlar ‘on’ ishlatadi: on Monday.","ru":"Дни используют ‘on’: on Monday."},{"uz":"Soat vaqti ‘at’ ishlatadi.","ru":"Время на часах использует ‘at’."},{"uz":"Ikki narsa orasida = between.","ru":"Между двумя предметами = between."},{"uz":"Oylar ‘in’ ishlatadi: in July.","ru":"Месяцы используют ‘in’: in July."},{"uz":"Tayyor ibora: at home.","ru":"Устойчивое выражение: at home."},{"uz":"Yuza (devor) → on.","ru":"Поверхность (стена) → on."},{"uz":"Nuqta/joy → at the door.","ru":"Точка/место → at the door."},{"uz":"Soat vaqti ‘at 7’, kun qismi ‘in the morning’.","ru":"Время ‘at 7’, часть суток ‘in the morning’."},{"uz":"Tayyor ibora: in bed.","ru":"Устойчивое выражение: in bed."},{"uz":"Ibora ‘in front of’: in front of the school.","ru":"Выражение ‘in front of’: in front of the school."},{"uz":"‘at the weekend’, ‘on Saturday’, ‘at 5 pm’.","ru":"‘at the weekend’, ‘on Saturday’, ‘at 5 pm’."},{"uz":"‘between two windows’ toʻgʻri; qolganlari in/on/at’ni adashtiradi.","ru":"‘between two windows’ верно; остальные путают in/on/at."}],"blocks":[{"h":{"uz":"Joy: in / on / at","ru":"Место: in / on / at"},"p":[{"uz":"<b>in</b> = ichida / hududlar (in a box, in Tashkent). <b>on</b> = yuza (on the table, on the wall). <b>at</b> = nuqta/joy (at the door, at school).","ru":"<b>in</b> = внутри / области (in a box, in Tashkent). <b>on</b> = поверхность (on the table, on the wall). <b>at</b> = точка/место (at the door, at school)."}]},{"h":{"uz":"Yana joy soʻzlari","ru":"Ещё слова места"},"p":[{"uz":"<b>under</b> (ostida), <b>next to</b> (yonida), <b>between</b> (ikkitasi orasida), <b>behind</b> (orqasida), <b>in front of</b> (oldida), <b>near</b> (yaqinida).","ru":"<b>under</b> (под), <b>next to</b> (рядом), <b>between</b> (между двумя), <b>behind</b> (за), <b>in front of</b> (перед), <b>near</b> (около)."}]},{"h":{"uz":"Vaqt: at / on / in","ru":"Время: at / on / in"},"p":[{"uz":"<b>at</b> + soat vaqti/tun (at 7, at night). <b>on</b> + kunlar/sanalar (on Monday). <b>in</b> + oylar/yillar/kun qismlari (in July, in the morning).","ru":"<b>at</b> + время на часах/ночь (at 7, at night). <b>on</b> + дни/даты (on Monday). <b>in</b> + месяцы/годы/части суток (in July, in the morning)."}]},{"h":{"uz":"Tayyor iboralar","ru":"Устойчивые выражения"},"p":[{"uz":"Baʼzi iboralarni yodlash kerak.","ru":"Некоторые выражения нужно запомнить."}]}]},"g13":{"lead":{"uz":"Savol soʻzlari (wh- soʻzlar) maʼlumot soʻraydi. Har biri boshqa narsani soʻraydi — odam, joy, vaqt, sabab. Ularni bilish atrofingizdagi hamma narsani soʻrash imkonini beradi.","ru":"Вопросительные слова (wh-) запрашивают информацию. Каждое спрашивает о своём — о человеке, месте, времени, причине. Зная их, вы можете спросить обо всём."},"situation":{"uz":"“Where do you live?” “What do you do?” “When does the film start?” — Savol soʻzlari birinchi keladi, soʻng do / does + ega + feʼl ishlatamiz.","ru":"«Where do you live?» «What do you do?» «When does the film start?» — Вопросительные слова идут первыми, затем do / does + подлежащее + глагол."},"tip":{"uz":"Sanaladigan narsalar uchun how many, sanalmaydigan (va narx) uchun how much: ‘How many apples?’ lekin ‘How much money?’","ru":"Для исчисляемого — how many, для неисчисляемого (и цены) — how much: ‘How many apples?’, но ‘How much money?’"},"q":[{"uz":"Ism (narsa) haqida ‘What’ bilan soʻraymiz.","ru":"Об имени (предмете) спрашиваем ‘What’."},{"uz":"Joy → Where.","ru":"Место → Where."},{"uz":"Odam → Who.","ru":"Человек → Who."},{"uz":"Vaqt/sana → When.","ru":"Время/дата → When."},{"uz":"Sabab → Why.","ru":"Причина → Why."},{"uz":"Sanaladigan ‘apples’ → How many.","ru":"Исчисляемое ‘apples’ → How many."},{"uz":"Narx → How much.","ru":"Цена → How much."},{"uz":"Joy → Where.","ru":"Место → Where."},{"uz":"Yosh ‘How old’ ishlatadi.","ru":"Возраст использует ‘How old’."},{"uz":"Ish joyi → Where.","ru":"Место работы → Where."},{"uz":"wh- + be + ega: Where are you from?","ru":"wh- + be + подлежащее: Where are you from?"},{"uz":"‘What time’ + does (it) start.","ru":"‘What time’ + does (it) start."},{"uz":"Sanaladigan ‘books’ uchun ‘How many’ kerak.","ru":"Для исчисляемого ‘books’ нужно ‘How many’."},{"uz":"wh- + do + ega + asosiy feʼl: What do you want?","ru":"wh- + do + подлежащее + базовый глагол: What do you want?"},{"uz":"Ob-havoni ‘How is the weather?’ bilan soʻraymiz.","ru":"О погоде спрашиваем ‘How is the weather?’"}],"blocks":[{"h":{"uz":"Asosiy wh- soʻzlar","ru":"Основные wh-слова"},"p":[{"uz":"<b>What</b> (narsa), <b>Who</b> (odam), <b>Where</b> (joy), <b>When</b> (vaqt), <b>Why</b> (sabab), <b>How</b> (usul/tarz).","ru":"<b>What</b> (предмет), <b>Who</b> (человек), <b>Where</b> (место), <b>When</b> (время), <b>Why</b> (причина), <b>How</b> (способ)."}]},{"h":{"uz":"how many / how much","ru":"how many / how much"},"p":[{"uz":"<b>How many</b> + sanaladigan (how many books). <b>How much</b> + sanoqsiz / narx (how much water, how much is it).","ru":"<b>How many</b> + исчисляемое (how many books). <b>How much</b> + неисчисляемое / цена (how much water, how much is it)."}]},{"h":{"uz":"‘be’ bilan soʻz tartibi","ru":"Порядок слов с be"},"p":[{"uz":"wh- soʻz + <b>be</b> + ega.","ru":"wh-слово + <b>be</b> + подлежащее."}]},{"h":{"uz":"do/does bilan soʻz tartibi","ru":"Порядок слов с do/does"},"p":[{"uz":"wh- soʻz + <b>do/does</b> + ega + asosiy feʼl.","ru":"wh-слово + <b>do/does</b> + подлежащее + базовый глагол."}]}]},"g14":{"lead":{"uz":"Yoqtirgan yoki yoqtirmagan mashgʻulotlar haqida gapirish uchun ingliz tili koʻpincha his feʼli (like, love, hate, enjoy) + -ing shaklini ishlatadi. Bu muhim A1 naqsh.","ru":"Чтобы говорить о занятиях, которые нравятся или нет, английский часто использует глагол чувства (like, love, hate, enjoy) + форму -ing. Это важная модель уровня A1."},"tip":{"uz":"like + -ing (mashgʻulotdan zavq) va would like + to (hozir biror narsani xohlash)ni adashtirmang: ‘I like swimming’ vs ‘I’d like to swim now.’","ru":"Не путайте like + -ing (нравится занятие) и would like + to (хотеть сейчас): ‘I like swimming’ vs ‘I’d like to swim now.’"},"q":[{"uz":"‘like’ dan keyin -ing: reading.","ru":"После ‘like’ — -ing: reading."},{"uz":"love + -ing: dancing.","ru":"love + -ing: dancing."},{"uz":"hate + -ing: getting.","ru":"hate + -ing: getting."},{"uz":"like + ot: music.","ru":"like + существительное: music."},{"uz":"enjoy + -ing: playing.","ru":"enjoy + -ing: playing."},{"uz":"don’t/doesn’t like + -ing: cooking.","ru":"don’t/doesn’t like + -ing: cooking."},{"uz":"like + -ing: I like swimming.","ru":"like + -ing: I like swimming."},{"uz":"love + -ing: listening.","ru":"love + -ing: listening."},{"uz":"would like + to + asosiy feʼl: to have.","ru":"would like + to + базовый глагол: to have."},{"uz":"enjoy + -ing: running.","ru":"enjoy + -ing: running."},{"uz":"would like + to + asosiy feʼl: I’d like to swim.","ru":"would like + to + базовый глагол: I’d like to swim."},{"uz":"like + -ing (painting); would like + to (to find).","ru":"like + -ing (painting); would like + to (to find)."},{"uz":"‘love’ dan keyin ‘to’siz -ing ishlating: I love cooking.","ru":"После ‘love’ — -ing без ‘to’: I love cooking."},{"uz":"Muloyim soʻrov: I’d like a tea, please.","ru":"Вежливая просьба: I’d like a tea, please."},{"uz":"like + -ing (reading); would like + to (to watch).","ru":"like + -ing (reading); would like + to (to watch)."}],"blocks":[{"h":{"uz":"like / love / hate / enjoy + -ing","ru":"like / love / hate / enjoy + -ing"},"p":[{"uz":"Bu feʼllardan keyin mashgʻulot odatda <b>-ing</b> shaklini oladi.","ru":"После этих глаголов занятие обычно стоит в форме <b>-ing</b>."}]},{"h":{"uz":"+ ot","ru":"+ существительное"},"p":[{"uz":"Bu feʼllardan keyin toʻgʻridan-toʻgʻri <b>ot</b> ham kelishi mumkin.","ru":"После этих глаголов может идти и прямо <b>существительное</b>."}]},{"h":{"uz":"Inkor","ru":"Отрицание"},"p":[{"uz":"<b>don’t/doesn’t</b> + like/enjoy + -ing ishlating.","ru":"Используйте <b>don’t/doesn’t</b> + like/enjoy + -ing."}]},{"h":{"uz":"would like = want (muloyim)","ru":"would like = want (вежливо)"},"p":[{"uz":"<b>would like</b> boshqacha: u ‘xohlamoq’ degani va undan keyin <b>to + asosiy feʼl</b> yoki ot keladi.","ru":"<b>would like</b> — другое: значит ‘хотеть’, и за ним следует <b>to + базовый глагол</b> или существительное."}]}]},"g15":{"lead":{"uz":"Sonlar hamma joyda — yosh, narx, sana va vaqt. Bu dars sanoq va tartib sonlarni, hamda sana, narx va soatni qanday aytishni oʻrgatadi.","ru":"Числа повсюду — возраст, цены, даты и время. Этот урок охватывает количественные и порядковые числительные, а также как называть даты, цены и время."},"tip":{"uz":"Oʻn va oʻnlikni urgʻudan farqlang: thirTEEN (oxirida urgʻu) vs THIRty (boshida urgʻu).","ru":"Различайте «-надцать» и десятки по ударению: thirTEEN (ударение в конце) vs THIRty (ударение в начале)."},"q":[{"uz":"15 = fifteen.","ru":"15 = fifteen."},{"uz":"two → second (2nd).","ru":"two → second (2nd)."},{"uz":"August — oy.","ru":"August — месяц."},{"uz":"Toʻliq soat → o’clock.","ru":"Полный час → o’clock."},{"uz":"19 dan keyin 20 (twenty) keladi.","ru":"После 19 идёт 20 (twenty)."},{"uz":"30 = thirty (eslatma: thirteen emas).","ru":"30 = thirty (не thirteen)."},{"uz":"3rd = third.","ru":"3rd = third."},{"uz":"6:30 = half past six.","ru":"6:30 = half past six."},{"uz":"five → fifth.","ru":"five → fifth."},{"uz":"Narxlar: ‘ten twenty’.","ru":"Цены: ‘ten twenty’."},{"uz":"thirteen = 13; thirty = 30.","ru":"thirteen = 13; thirty = 30."},{"uz":"7:45 = quarter to eight.","ru":"7:45 = quarter to eight."},{"uz":"2026 odatda ‘twenty twenty-six’.","ru":"2026 обычно ‘twenty twenty-six’."},{"uz":"Sanalar tartib sonni ishlatadi: the first of March.","ru":"Даты используют порядковые: the first of March."},{"uz":"8:15 = quarter past eight.","ru":"8:15 = quarter past eight."}],"blocks":[{"h":{"uz":"Sanoq sonlar","ru":"Количественные числительные"},"p":[{"uz":"Ular sanaydi: one, two, three… ‘teens’ va ‘tens’ chalkash: thirteen vs thirty, fifteen vs fifty.","ru":"Они считают: one, two, three… Внимание к ‘teens’ и ‘tens’: thirteen vs thirty, fifteen vs fifty."}]},{"h":{"uz":"Tartib sonlar","ru":"Порядковые числительные"},"p":[{"uz":"Ular tartibni koʻrsatadi: first (1st), second (2nd), third (3rd), fourth (4th)… Ularni sana va qavatlar uchun ishlatamiz.","ru":"Они показывают порядок: first (1st), second (2nd), third (3rd), fourth (4th)… Используем для дат и этажей."}]},{"h":{"uz":"Sanalar","ru":"Даты"},"p":[{"uz":"Kunni tartib son bilan ayting: ‘the 5th of June’ yoki ‘June the 5th’. Yillar: 2026 = ‘twenty twenty-six’.","ru":"День называйте порядковым: ‘the 5th of June’ или ‘June the 5th’. Годы: 2026 = ‘twenty twenty-six’."}]},{"h":{"uz":"Narxlar va vaqt","ru":"Цены и время"},"p":[{"uz":"Narxlar: $5.50 = ‘five fifty’ / ‘five dollars fifty’. Vaqt: 9:00 = ‘nine o’clock’, 9:15 = ‘quarter past nine’, 9:30 = ‘half past nine’, 9:45 = ‘quarter to ten’.","ru":"Цены: $5.50 = ‘five fifty’ / ‘five dollars fifty’. Время: 9:00 = ‘nine o’clock’, 9:15 = ‘quarter past nine’, 9:30 = ‘half past nine’, 9:45 = ‘quarter to ten’."}]}]},"v1":{"q":[{"uz":"Otangizning onasi — buvingiz (grandmother).","ru":"Мать вашего отца — бабушка (grandmother)."},{"uz":"‘Hello’ — salomlashish.","ru":"‘Hello’ — приветствие."},{"uz":"‘Rahmat’ = thank you.","ru":"‘Rahmat’ = thank you (спасибо)."},{"uz":"Ota-onangizning boshqa qizi — singlingiz (sister).","ru":"Другая дочь ваших родителей — сестра (sister)."},{"uz":"Ketayotganda ‘Goodbye’ deymiz.","ru":"Уходя, говорим ‘Goodbye’."}]},"v2":{"q":[{"uz":"Millat — ‘English’.","ru":"Национальность — ‘English’."},{"uz":"London — Angliyaning poytaxti.","ru":"London — столица Англии."},{"uz":"Fransiyada French (fransuzcha) gapirishadi.","ru":"Во Франции говорят на French (французском)."},{"uz":"Rome Italiyada.","ru":"Rome находится в Италии."},{"uz":"‘Poytaxt’ = capital.","ru":"‘Poytaxt’ = capital (столица)."}]},"v3":{"q":[{"uz":"Oʻt yashil (green).","ru":"Трава зелёная (green)."},{"uz":"Bir haftada yetti kun bor.","ru":"В неделе семь дней."},{"uz":"‘Qizil’ = red.","ru":"‘Qizil’ = red (красный)."},{"uz":"Aylana (circle) — shakl.","ru":"Круг (circle) — форма."},{"uz":"Keyingi kun — tomorrow.","ru":"Следующий день — tomorrow."}]},"v4":{"q":[{"uz":"Ovqatni oshxonada (kitchen) pishirasiz.","ru":"Готовят на кухне (kitchen)."},{"uz":"Karavotda (bed) uxlaysiz.","ru":"Спят в кровати (bed)."},{"uz":"Poyabzal oyoqqa (feet) kiyiladi.","ru":"Обувь на ногах (feet)."},{"uz":"‘Deraza’ = window.","ru":"‘Deraza’ = window (окно)."},{"uz":"Biz koʻzlar (eyes) bilan koʻramiz.","ru":"Мы видим глазами (eyes)."}]},"v5":{"q":[{"uz":"Suv (water) — ichimlik.","ru":"Вода (water) — напиток."},{"uz":"‘Non’ = bread.","ru":"‘Non’ = bread (хлеб)."},{"uz":"Olma (apple) — meva.","ru":"Яблоко (apple) — фрукт."},{"uz":"Nonushta (breakfast) — birinchi taom.","ru":"Завтрак (breakfast) — первый приём пищи."},{"uz":"Shakar choyni shirin qiladi.","ru":"Сахар делает чай сладким."}]},"v6":{"q":[{"uz":"Ertalab uygʻonasiz (get up).","ru":"Утром встают (get up)."},{"uz":"Bu ‘do homework’ (uy vazifasini bajarish)ni bildiradi.","ru":"Это значит ‘do homework’ (делать домашнее задание)."},{"uz":"Futbol — sport.","ru":"Футбол — спорт."},{"uz":"Shanba va yakshanba — dam olish kunlari (weekend).","ru":"Суббота и воскресенье — выходные (weekend)."},{"uz":"Kechqurun uxlashga yotasiz (go to bed).","ru":"Ночью ложатся спать (go to bed)."}]},"v7":{"q":[{"uz":"Oʻqituvchi (teacher) dars beradi.","ru":"Учитель (teacher) преподаёт."},{"uz":"Ruchka (pen) bilan yozasiz.","ru":"Пишут ручкой (pen)."},{"uz":"‘Daftar’ = notebook.","ru":"‘Daftar’ = notebook (тетрадь)."},{"uz":"Hamshira (nurse) shifokorlar bilan ishlaydi.","ru":"Медсестра (nurse) работает с врачами."},{"uz":"Oʻqituvchi doskaga (board) yozadi.","ru":"Учитель пишет на доске (board)."}]},"v8":{"q":[{"uz":"Yoz issiq (hot).","ru":"Лето жаркое (hot)."},{"uz":"Rain → rainy.","ru":"Rain → rainy."},{"uz":"‘Mushuk’ = cat.","ru":"‘Mushuk’ = cat (кошка)."},{"uz":"Qishda qor yogʻadi.","ru":"Зимой идёт снег."},{"uz":"Baliq suvda yashaydi.","ru":"Рыба живёт в воде."}]},"v9":{"q":[{"uz":"happy ↔ sad.","ru":"happy ↔ sad."},{"uz":"Ovqat xohlash = hungry (och).","ru":"Хотеть есть = hungry (голодный)."},{"uz":"‘Charchagan’ = tired.","ru":"‘Charchagan’ = tired (усталый)."},{"uz":"Ichimlik xohlash = thirsty (chanqagan).","ru":"Хотеть пить = thirsty."},{"uz":"Sevimlingiz — eng yoqtirganingiz.","ru":"Любимое — то, что нравится больше всего."}]},"r1":{"q":[{"uz":"Matnda ‘I am eleven years old’ deyilgan.","ru":"В тексте сказано ‘I am eleven years old.’"},{"uz":"U Manchesterda yashaydi.","ru":"Он живёт в Манчестере."},{"uz":"Onasi shifokor (doctor).","ru":"Его мама — врач (doctor)."},{"uz":"Uning bir akasi va bir singlisi bor.","ru":"У него один брат и одна сестра."},{"uz":"Bobby jigarrang (brown).","ru":"Бобби коричневый (brown)."}]},"r2":{"q":[{"uz":"U soat yettida turadi.","ru":"Она встаёт в семь часов."},{"uz":"U maktabga avtobusda boradi.","ru":"Она едет в школу на автобусе."},{"uz":"U matematikani yoqtirmaydi.","ru":"Она не любит математику."},{"uz":"Kechqurun u televizor koʻradi yoki kitob oʻqiydi.","ru":"Вечером она смотрит ТВ или читает."},{"uz":"Dam olish kunlari u parkda doʻstlari bilan oʻynaydi.","ru":"В выходные она играет с друзьями в парке."}]},"r3":{"q":[{"uz":"Ular Oksforddagi bozorga borishadi.","ru":"Они идут на рынок в Оксфорде."},{"uz":"U olma, non va biroz sut xohlaydi.","ru":"Она хочет яблоки, хлеб и немного молока."},{"uz":"Olma bir kilosi ikki funt turadi.","ru":"Яблоки стоят два фунта за килограмм."},{"uz":"Uyda goʻshtlari bor.","ru":"Дома у них есть мясо."},{"uz":"Ular uyga taksida ketishadi.","ru":"Домой они едут на такси."}]},"r4":{"q":[{"uz":"Bu Angliyaning gʻarbida, Bath yaqinidagi kichik shaharcha.","ru":"Это маленький городок рядом с Батом, на западе Англии."},{"uz":"Park yonida kutubxona (library) bor.","ru":"Рядом с парком есть библиотека (library)."},{"uz":"Kafe pochta va bank orasida.","ru":"Кафе находится между почтой и банком."},{"uz":"Kinoteatr yoʻq.","ru":"Кинотеатра нет."},{"uz":"U baxtli, chunki doʻstlari va oilasi yaqin.","ru":"Он счастлив, потому что друзья и семья рядом."}]},"r5":{"q":[{"uz":"Ular koʻchishdi, chunki otasining yangi ishi bor.","ru":"Они переехали, потому что у отца новая работа."},{"uz":"Avval u xafa edi, chunki eski doʻstlarini sogʻindi.","ru":"Сначала ей было грустно, она скучала по старым друзьям."},{"uz":"Uning yangi maktabi eskisidan kattaroq.","ru":"Её новая школа больше старой."},{"uz":"Fransuz tili qiyin, lekin u yaxshilanyapti, oʻqituvchisi sabrli.","ru":"Французский трудный, но она прогрессирует, учитель терпеливый."},{"uz":"U Greysga yozgi taʼtilda uni yoʻqlashni taklif qiladi.","ru":"Она предлагает Грейс навестить её на летних каникулах."}]},"l1":{"q":[{"uz":"U ‘My name is Oliver’ deydi.","ru":"Он говорит ‘My name is Oliver.’"},{"uz":"U oʻn ikki yoshda.","ru":"Ему двенадцать лет."},{"uz":"U Braytondan.","ru":"Он из Брайтона."},{"uz":"Uning sevimli fani — science (tabiiy fan).","ru":"Его любимый предмет — science."},{"uz":"Mushukining ismi Luna.","ru":"Его кошку зовут Luna."}]},"l2":{"q":[{"uz":"Xaridor non va ikki shisha suv xohlaydi.","ru":"Покупатель хочет хлеб и две бутылки воды."},{"uz":"Ikki shisha suv.","ru":"Две бутылки воды."},{"uz":"Non bir funt.","ru":"Хлеб — один фунт."},{"uz":"Jami uch funt.","ru":"Всего три фунта."},{"uz":"Bu doʻkonda sodir boʻladi.","ru":"Это происходит в магазине."}]},"l3":{"q":[{"uz":"Bu odam parkni qidiryapti.","ru":"Человек ищет парк."},{"uz":"Chapdagi ikkinchi burilishga buriling.","ru":"Сверните на второй поворот налево."},{"uz":"Park kutubxona yonida.","ru":"Парк рядом с библиотекой."},{"uz":"Park bankning roʻparasida.","ru":"Парк напротив банка."},{"uz":"Piyoda taxminan besh daqiqa.","ru":"Около пяти минут пешком."}]},"l4":{"q":[{"uz":"Qoʻngʻiroq qiluvchi ‘this is Lucy’ deydi.","ru":"Звонящая говорит ‘this is Lucy.’"},{"uz":"Ular shanba kuni uchrashishadi.","ru":"Они встречаются в субботу."},{"uz":"Ular soat toʻrtda uchrashishadi (uchda emas).","ru":"Они встречаются в четыре часа (не в три)."},{"uz":"U chiptalarni olib kelishi kerak.","ru":"Он должен принести билеты."},{"uz":"U Jekka qoʻngʻiroq qilishi kerak, u yangi vaqtni bilmaydi.","ru":"Он должен позвонить Джеку, который не знает нового времени."}]}}},"A2":{"GRAMMAR":[{"id":"g1","title":"Past simple","lead":"The past simple describes finished actions and states at a definite time in the past. It is the main tense for telling stories and talking about yesterday, last week, or years ago.","blocks":[{"h":"Regular verbs: + -ed","p":["Most verbs add <b>-ed</b>. Verbs ending in -e add only <b>-d</b>; a consonant + y becomes <b>-ied</b>; a short stressed vowel doubles the final consonant."],"ex":["work → work<b>ed</b> · live → live<b>d</b> · study → stud<b>ied</b> · stop → stop<b>ped</b>"]},{"h":"Irregular verbs","p":["Many common verbs are irregular and must be learned."],"ex":["go → <b>went</b> · have → <b>had</b> · see → <b>saw</b> · make → <b>made</b> · buy → <b>bought</b>"]},{"h":"Negatives & questions","p":["Use <b>didn’t</b> + base verb for negatives, and <b>Did</b> + subject + base verb for questions. The main verb returns to its base form."],"ex":["I <b>didn’t go</b> out. · <b>Did</b> you <b>see</b> the film?"]},{"h":"Time expressions","p":["Past simple often appears with: yesterday, last night/week, two days ago, in 2010, when I was young."],"ex":["We <b>arrived</b> two hours <b>ago</b>. · She <b>was</b> born <b>in 2009</b>."]}],"tip":"After <b>didn’t</b> and <b>did</b>, never use the past form: ‘I didn’t <b>went</b>’ is wrong → ‘I didn’t <b>go</b>.’ The past is already shown by ‘did’.","examples":["\"Yesterday I <b>watched</b> a film and <b>cooked</b> dinner.\"","\"She <b>went</b> to London last summer.\"","\"They <b>didn’t come</b> to the party.\"","\"<b>Did</b> you <b>finish</b> your homework? — Yes, I did.\"","\"He <b>bought</b> a new bike two weeks ago.\"","\"We <b>were</b> very tired after the trip.\""],"q":[{"q":"Yesterday I ___ football with my friends.","o":["play","played","plaies","playing"],"a":1,"d":"easy","e":"Regular verb + -ed: played."},{"q":"The past simple of 'go' is ___.","o":["goed","gone","went","going"],"a":2,"d":"easy","e":"‘go’ is irregular: went."},{"q":"She ___ a sandwich for lunch.","o":["eat","eated","ate","eaten"],"a":2,"d":"easy","e":"Irregular: eat → ate."},{"q":"We ___ to the cinema last night.","o":["go","goed","went","gone"],"a":2,"d":"easy","e":"go → went."},{"q":"The past simple of 'study' is ___.","o":["studyed","studied","studed","study"],"a":1,"d":"easy","e":"Consonant + y → -ied: studied."},{"q":"I ___ TV yesterday evening.","o":["watch","watched","watching","did watch"],"a":1,"d":"med","e":"Regular past: watched."},{"q":"They ___ come to school yesterday.","o":["didn't","don't","wasn't","weren't"],"a":0,"d":"med","e":"Past negative: didn’t come."},{"q":"___ you see Tom last week?","o":["Do","Did","Was","Were"],"a":1,"d":"med","e":"Past question: Did you see…?"},{"q":"The past simple of 'buy' is ___.","o":["buyed","buied","bought","buy"],"a":2,"d":"med","e":"Irregular: buy → bought."},{"q":"He ___ his keys this morning.","o":["loses","lost","losed","loosed"],"a":1,"d":"med","e":"Irregular: lose → lost."},{"q":"Find the mistake: 'I didn't went home.'","o":["didn't → don't","went → go","home → to home","no mistake"],"a":1,"d":"hard","e":"After ‘didn’t’ use the base verb: I didn’t go home."},{"q":"Complete: 'She ___ a letter and ___ it to her friend.'","o":["write / send","wrote / sent","writed / sended","wrote / send"],"a":1,"d":"hard","e":"Irregular: write → wrote; send → sent."},{"q":"Which question is correct?","o":["Did you went out?","Did you go out?","Do you went out?","Were you go out?"],"a":1,"d":"hard","e":"Did + base verb: Did you go out?"},{"q":"Complete: 'We ___ tired, so we ___ early.'","o":["was / leaved","were / left","were / leaved","was / left"],"a":1,"d":"hard","e":"‘we were’ (plural) and irregular leave → left."},{"q":"The past simple of 'can' is ___.","o":["canned","could","caned","can"],"a":1,"d":"hard","e":"can → could."}]},{"id":"g2","title":"Past continuous","lead":"The past continuous describes an action in progress at a moment in the past. It is often used to set the scene in a story, or for an action interrupted by another.","blocks":[{"h":"Form: was/were + -ing","p":["Use <b>was</b> (I/he/she/it) or <b>were</b> (you/we/they) + verb-ing."],"ex":["I <b>was reading</b>. · They <b>were playing</b> outside."]},{"h":"Interrupted actions","p":["Use past continuous for the longer action and past simple for the shorter one that interrupts it, often joined by <b>when</b> or <b>while</b>."],"ex":["I <b>was sleeping</b> <b>when</b> the phone <b>rang</b>.","<b>While</b> she <b>was cooking</b>, he <b>arrived</b>."]},{"h":"Two actions together","p":["Use past continuous for two longer actions happening at the same time."],"ex":["I <b>was reading</b> while my brother <b>was watching</b> TV."]},{"h":"Negatives & questions","p":["Negative: wasn’t/weren’t + -ing. Question: Was/Were + subject + -ing?"],"ex":["She <b>wasn’t listening</b>. · <b>Were</b> you <b>working</b> at 8 pm?"]}],"tip":"Use the <b>past simple</b> for the short, completed action and the <b>past continuous</b> for the longer background action: ‘I <b>was walking</b> home when it <b>started</b> to rain.’","examples":["\"At 8 o’clock last night I <b>was studying</b>.\"","\"They <b>were watching</b> TV when I came in.\"","\"<b>While</b> we <b>were having</b> dinner, the lights went out.\"","\"She <b>wasn’t sleeping</b> at midnight.\"","\"<b>Were</b> you <b>waiting</b> for me?\"","\"He fell <b>while</b> he <b>was running</b>.\""],"q":[{"q":"At 7 pm yesterday I ___ dinner.","o":["have","had","was having","were having"],"a":2,"d":"easy","e":"Action in progress (I) → was having."},{"q":"They ___ football when it started to rain.","o":["played","were playing","was playing","play"],"a":1,"d":"easy","e":"Background action (they) → were playing."},{"q":"She ___ a book at 9 o'clock.","o":["was reading","were reading","read","reads"],"a":0,"d":"easy","e":"In progress (she) → was reading."},{"q":"We ___ TV all evening.","o":["was watching","were watching","watch","watched"],"a":1,"d":"easy","e":"With ‘we’ → were watching."},{"q":"The past continuous of 'he sleeps' is ___.","o":["he were sleeping","he was sleeping","he is sleeping","he sleeped"],"a":1,"d":"easy","e":"he + was + -ing."},{"q":"I ___ when the phone rang.","o":["showered","was showering","were showering","shower"],"a":1,"d":"med","e":"Longer action → was showering."},{"q":"While she ___, he arrived.","o":["cooked","was cooking","were cooking","cooks"],"a":1,"d":"med","e":"Background action (she) → was cooking."},{"q":"They ___ when I called.","o":["weren't working","wasn't working","didn't working","not working"],"a":0,"d":"med","e":"Negative (they) → weren’t working."},{"q":"___ you sleeping at midnight?","o":["Was","Were","Did","Are"],"a":1,"d":"med","e":"Question (you) → Were you sleeping?"},{"q":"Choose: 'I was walking home ___ it started to snow.'","o":["while","when","during","that"],"a":1,"d":"med","e":"A sudden interrupting action uses ‘when’."},{"q":"Find the mistake: 'They was playing in the garden.'","o":["was → were","playing → played","in → at","no mistake"],"a":0,"d":"hard","e":"With ‘they’ use ‘were’: They were playing."},{"q":"Complete: 'While I ___ TV, my sister ___ her homework.'","o":["watched / did","was watching / was doing","were watching / did","watch / do"],"a":1,"d":"hard","e":"Two parallel past actions → both continuous."},{"q":"Which sentence is correct?","o":["When I arrived, she cooked.","When I arrived, she was cooking.","When I was arriving, she cooked.","When I arrive, she was cooking."],"a":1,"d":"hard","e":"Short action ‘arrived’ + longer background ‘was cooking’."},{"q":"Complete: 'What ___ you ___ at 10 pm?'","o":["was / doing","were / doing","did / do","were / did"],"a":1,"d":"hard","e":"Question (you) → Were you doing?"},{"q":"Choose the correct pair.","o":["I was reading when he was calling.","I read when he was calling.","I was reading when he called.","I was read when he called."],"a":2,"d":"hard","e":"Longer action ‘was reading’ + interrupting ‘called’."}]},{"id":"g3","title":"Present perfect","lead":"The present perfect links the past and the present. We use it for life experiences (without saying exactly when), recent actions with a present result, and situations that started in the past and continue now.","blocks":[{"h":"Form: have/has + past participle","p":["Use <b>have</b> (I/you/we/they) or <b>has</b> (he/she/it) + the past participle (the 3rd form: done, gone, seen, been)."],"ex":["I <b>have seen</b> that film. · She <b>has finished</b> her work."]},{"h":"ever / never (experience)","p":["Use <b>ever</b> in questions and <b>never</b> in negatives to talk about experiences at any time in your life."],"ex":["<b>Have</b> you <b>ever been</b> to London? · I <b>have never eaten</b> sushi."]},{"h":"just / already / yet","p":["<b>just</b> = a very short time ago; <b>already</b> = sooner than expected; <b>yet</b> = used in questions and negatives at the end."],"ex":["I’ve <b>just</b> arrived. · She’s <b>already</b> left. · Have you finished <b>yet</b>?"]},{"h":"for / since","p":["Use <b>for</b> + a period of time and <b>since</b> + a point in time for situations continuing now."],"ex":["We’ve lived here <b>for</b> five years. · I’ve known him <b>since</b> 2018."]}],"tip":"Don’t use the present perfect with a finished past time. Say ‘I <b>saw</b> her yesterday’ (past simple), not ‘I have seen her yesterday’. Use the present perfect when the time is unfinished or unstated.","examples":["\"I <b>have visited</b> three countries.\"","\"<b>Have</b> you <b>ever ridden</b> a horse?\"","\"She <b>has never tried</b> Italian food.\"","\"We’ve <b>just finished</b> dinner.\"","\"He <b>has already done</b> his homework.\"","\"They’ve lived here <b>for</b> ten years.\""],"q":[{"q":"I ___ my homework. (it's finished now)","o":["finish","finished","have finished","finishing"],"a":2,"d":"easy","e":"Present perfect: have finished."},{"q":"She ___ to Paris. (experience)","o":["has been","have been","is been","was been"],"a":0,"d":"easy","e":"With ‘she’: has been."},{"q":"The past participle of 'see' is ___.","o":["saw","seen","seed","see"],"a"
