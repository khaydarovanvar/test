{"g1":{"situation":"“You look exhausted!” “Yes, I <b>’ve been working</b> in the garden all day.” — The present perfect continuous focuses on an activity that has been going on and explains a present result.","timeline":{"art":["  ▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓","─────────────────●──► now","  have been working …│"],"note":"An activity continuing up to now (and maybe still going on)."},"compare":{"a":{"h":"Continuous (how long / activity)","ex":["I’<b>ve been reading</b> all day.","It’<b>s been raining</b>."]},"b":{"h":"Simple (result / how many)","ex":["I’<b>ve read</b> three books.","It’<b>s rained</b> twice."]}},"mistakes":[{"x":"I have been knowing her for years.","v":"I <b>have known</b> her for years. (state verb → simple)"},{"x":"I am working here since May.","v":"I <b>’ve been working</b> here since May."}],"examples":["\"I <b>’ve been working</b> here since 2020.\"","\"She <b>’s been studying</b> all night.\"","\"They <b>’ve been waiting</b> for an hour.\"","\"It <b>’s been raining</b> since morning.\"","\"How long <b>have</b> you <b>been learning</b> English?\"","\"He’s tired because he <b>’s been running</b>.\"","\"We <b>’ve been living</b> abroad for two years.\"","\"You <b>’ve been working</b> too hard lately.\""]},"g2":{"situation":"“When I got to the station, the train <b>had</b> already <b>left</b>.” — The past perfect shows the train left <i>before</i> I arrived. It puts two past events in order.","timeline":{"art":["  ✕──────────────✕","  had left      I arrived","─────────────────────► now"],"note":"The “had” action happens first; the past simple action happens second."},"mistakes":[{"x":"After I had ate, I went out.","v":"After I had <b>eaten</b>, I went out. (past participle)"},{"x":"When I arrived, the film already started.","v":"…the film <b>had</b> already <b>started</b>."}],"examples":["\"When we arrived, the film <b>had</b> already <b>started</b>.\"","\"She <b>had finished</b> dinner before he came.\"","\"I knew I <b>had met</b> him somewhere.\"","\"They <b>had never flown</b> before that day.\"","\"By the time help came, he <b>had recovered</b>.\"","\"The thief <b>had escaped</b> before the police arrived.\"","\"We were late because we <b>had missed</b> the train.\"","\"<b>Had</b> you <b>eaten</b> when they called?\""]},"g3":{"compare":{"title":"choosing a future form","a":{"h":"plan / arrangement","ex":["We<b>’re going to</b> paint it. (intention)","I<b>’m meeting</b> Sam at six. (arrangement)"]},"b":{"h":"prediction / timetable","ex":["It <b>’ll</b> snow tonight. (prediction)","The train <b>leaves</b> at 9. (timetable)"]}},"mistakes":[{"x":"The plane will arrive at 6 — it’s the timetable.","v":"The plane <b>arrives</b> at 6. (timetable → present simple)"},{"x":"I think I’m passing the exam.","v":"I think I<b>’ll pass</b>. (prediction → will)"}],"examples":["\"I <b>’m meeting</b> Sara at six. (arrangement)\"","\"The train <b>leaves</b> at 9:15. (timetable)\"","\"We<b>’re going to</b> paint the house. (plan)\"","\"I think it <b>’ll snow</b> tonight. (prediction)\"","\"Look — it <b>’s going to</b> rain! (evidence)\"","\"I <b>might</b> go to the party. (possibility)\"","\"(phone rings) I <b>’ll answer</b> it. (decision)\"","\"The film <b>starts</b> at eight. (schedule)\""]},"g4":{"situation":"“If I <b>won</b> the lottery, I <b>’d</b> travel the world.” — The situation is imaginary and unlikely, so we use the past simple + would, not present + will.","compare":{"title":"first vs. second conditional","a":{"h":"First (real / likely)","ex":["If it <b>rains</b>, I<b>’ll</b> stay in."]},"b":{"h":"Second (unreal / unlikely)","ex":["If it <b>snowed</b> in July, I<b>’d</b> be amazed."]}},"mistakes":[{"x":"If I would have money, I would travel.","v":"If I <b>had</b> money, I would travel. (no “would” after if)"},{"x":"If I was you, I will help.","v":"If I <b>were</b> you, I <b>’d</b> help."}],"examples":["\"If I <b>won</b> the lottery, I <b>’d travel</b> the world.\"","\"If I <b>were</b> you, I <b>’d apologise</b>.\"","\"She <b>’d be</b> happier if she <b>had</b> a job.\"","\"If we <b>lived</b> by the sea, we <b>could swim</b> daily.\"","\"What <b>would</b> you do if you <b>lost</b> your phone?\"","\"If he <b>spoke</b> French, he <b>might get</b> the job.\"","\"I <b>wouldn’t buy</b> it if it <b>weren’t</b> so cheap.\"","\"If they <b>tried</b> harder, they <b>could win</b>.\""]},"g5":{"compare":{"title":"how sure are you?","a":{"h":"must / can’t (sure)","ex":["She <b>must</b> be home — the light’s on.","He <b>can’t</b> be hungry; he just ate."]},"b":{"h":"might / may / could (possible)","ex":["She <b>might</b> be at work.","They <b>could</b> be lost."]}},"mistakes":[{"x":"He isn’t home — he mustn’t be at work.","v":"…he <b>must</b> be at work. (mustn’t ≠ deduction)"},{"x":"She must works late.","v":"She must <b>be working</b> late. (modal + be + -ing)"}],"examples":["\"The light’s on — she <b>must be</b> home.\"","\"He <b>can’t be</b> hungry; he’s just eaten.\"","\"She <b>might be</b> at work.\"","\"They <b>could be</b> lost.\"","\"You <b>must be</b> tired after that journey.\"","\"That <b>can’t be</b> right.\"","\"He <b>must be</b> joking!\"","\"She <b>may know</b> the answer.\""]},"g6":{"situation":"“This bridge <b>was built</b> in 1890.” — We use the passive when the action matters more than who did it (or we don’t know who did it).","compare":{"title":"active ↔ passive","a":{"h":"Active","ex":["Orwell <b>wrote</b> the book.","Someone <b>has cleaned</b> the room."]},"b":{"h":"Passive (be + past participle)","ex":["The book <b>was written</b> by Orwell.","The room <b>has been cleaned</b>."]}},"mistakes":[{"x":"The letter was wrote by John.","v":"The letter was <b>written</b> by John. (past participle)"},{"x":"The accident was happened.","v":"The accident <b>happened</b>. (“happen” has no object → no passive)"}],"examples":["\"English <b>is spoken</b> all over the world.\"","\"The window <b>was broken</b> last night.\"","\"Millions of cars <b>are made</b> here.\"","\"The book <b>was written</b> by Orwell.\"","\"The room <b>has been cleaned</b>.\"","\"The work <b>will be finished</b> soon.\"","\"The thieves <b>were caught</b> by the police.\"","\"This bridge <b>is being repaired</b>.\""]},"g7":{"compare":{"title":"tenses move back","a":{"h":"Direct speech","ex":["“I <b>am</b> tired.”","“I <b>will</b> call.”","“I <b>can</b> swim.”"]},"b":{"h":"Reported speech","ex":["He said he <b>was</b> tired.","She said she <b>would</b> call.","He said he <b>could</b> swim."]}},"mistakes":[{"x":"He said me that he was late.","v":"He <b>told</b> me… / He <b>said</b> (that)… (tell + person, say + no person)"},{"x":"She said she will come.","v":"She said she <b>would</b> come. (will → would)"}],"examples":["\"He said he <b>was</b> tired.\"","\"She said she <b>would</b> call later.\"","\"They said they <b>lived</b> in Leeds.\"","\"He told me he <b>could</b> swim.\"","\"She said she <b>had bought</b> a car.\"","\"He said he <b>was working</b> then.\"","\"She told us she <b>didn’t like</b> it.\"","\"They said they <b>had finished</b> the work.\""]},"g8":{"compare":{"title":"questions vs. commands","a":{"h":"Reported question (statement order)","ex":["He asked <b>where I lived</b>.","She asked <b>if I was</b> ready."]},"b":{"h":"Reported command (to + verb)","ex":["She told me <b>to sit</b> down.","He told me <b>not to move</b>."]}},"mistakes":[{"x":"She asked me what time was it.","v":"She asked what time <b>it was</b>. (statement word order)"},{"x":"He told me to don’t go.","v":"He told me <b>not to go</b>."}],"examples":["\"She asked where I <b>lived</b>.\"","\"He asked <b>if I was</b> ready.\"","\"They asked what time <b>it was</b>.\"","\"She told me <b>to sit</b> down.\"","\"He asked me <b>to help</b> him.\"","\"She told me <b>not to be</b> late.\"","\"He asked <b>if I had</b> finished.\"","\"They asked why I <b>was</b> late.\""]},"g9":{"compare":{"title":"commas change everything","a":{"h":"Defining (no commas)","ex":["The man <b>who</b> lives here is a doctor.","The book <b>(that)</b> I read was great."]},"b":{"h":"Non-defining (commas, no “that”)","ex":["My dad, <b>who</b> is 60, still works.","Paris, <b>which</b> I love, is busy."]}},"mistakes":[{"x":"My car, that is red, is fast.","v":"My car, <b>which</b> is red, is fast. (non-defining → which)"},{"x":"The man which called…","v":"The man <b>who</b> called… (people → who)"}],"examples":["\"The man <b>who</b> lives next door is a doctor.\"","\"This is the phone <b>that</b> I bought.\"","\"My brother, <b>who</b> lives in Leeds, is a teacher.\"","\"Paris, <b>which</b> I love, is always busy.\"","\"That’s the town <b>where</b> I grew up.\"","\"She’s the woman <b>whose</b> car was stolen.\"","\"The keys <b>(that)</b> I lost were found.\"","\"He’s the boy <b>whose</b> dog bit me.\""]},"g10":{"compare":{"title":"used to vs. would","a":{"h":"used to (habits & states)","ex":["I <b>used to play</b> tennis.","She <b>used to have</b> long hair."]},"b":{"h":"would (repeated actions only)","ex":["Every summer we <b>would visit</b> them.","✗ I would have a bike."]}},"mistakes":[{"x":"I would have a red car when I was young.","v":"I <b>used to have</b> a red car. (state → used to)"},{"x":"Did you used to live here?","v":"Did you <b>use to</b> live here? (after did → no -d)"}],"examples":["\"I <b>used to play</b> tennis every weekend.\"","\"On Sundays, my dad <b>would cook</b> breakfast.\"","\"She <b>used to be</b> very shy.\"","\"We <b>would visit</b> our grandparents each summer.\"","\"He <b>didn’t use to</b> like coffee.\"","\"There <b>used to be</b> a shop on this corner.\"","\"As children, we <b>would play</b> outside all day.\"","\"<b>Did</b> you <b>use to</b> have a dog?\""]},"g11":{"compare":{"title":"to vs. -ing","a":{"h":"verb + to","ex":["decide <b>to leave</b>","refuse <b>to help</b>","manage <b>to do</b>"]},"b":{"h":"verb + -ing / after prepositions","ex":["enjoy <b>cooking</b>","good at <b>drawing</b>","before <b>going</b>"]}},"mistakes":[{"x":"I’m interested in to learn Spanish.","v":"I’m interested in <b>learning</b> Spanish. (preposition + -ing)"},{"x":"They allowed us stay.","v":"They allowed us <b>to stay</b>."}],"examples":["\"I enjoy <b>cooking</b> at weekends.\"","\"She decided <b>to study</b> abroad.\"","\"He’s thinking about <b>changing</b> jobs.\"","\"They asked me <b>to wait</b>.\"","\"Remember <b>to lock</b> the door.\"","\"I’ll never forget <b>visiting</b> Rome.\"","\"We can’t afford <b>to travel</b> this year.\"","\"She’s good at <b>solving</b> problems.\""]},"g12":{"compare":{"title":"equal / less / stronger","a":{"h":"as … as (equal)","ex":["She’s <b>as tall as</b> him.","not <b>as cold as</b> yesterday"]},"b":{"h":"less / modifiers","ex":["<b>less</b> interesting <b>than</b>","<b>much</b> better · <b>a bit</b> warmer"]}},"mistakes":[{"x":"This car is very better than mine.","v":"…is <b>much</b> better than mine. (much/far, not very)"},{"x":"She is as tall than him.","v":"She is as tall <b>as</b> him."}],"examples":["\"She’s <b>as tall as</b> her brother.\"","\"It’s <b>not as cold as</b> yesterday.\"","\"The book is <b>less exciting than</b> the film.\"","\"He’s <b>much taller</b> than me.\"","\"Today is <b>far hotter</b> than yesterday.\"","\"It’s <b>a bit warmer</b> today.\"","\"<b>The more</b> you practise, <b>the better</b> you get.\"","\"This phone is <b>just as good as</b> that one.\""]},"g13":{"compare":{"title":"general vs. specific","a":{"h":"No “of”","ex":["<b>Most</b> people like music.","<b>Every</b> student <b>has</b> a book."]},"b":{"h":"+ of the/my/these","ex":["<b>Most of</b> the students passed.","<b>None of</b> the answers were right."]}},"mistakes":[{"x":"Every students are present.","v":"<b>Every student is</b> present. (every + singular)"},{"x":"Most of people are kind.","v":"<b>Most people</b> are kind. (no “of” without the/my)"}],"examples":["\"<b>Most</b> people enjoy music.\"","\"<b>Most of</b> the students passed.\"","\"<b>None of</b> the answers were right.\"","\"<b>Both</b> films are worth seeing.\"","\"<b>Neither</b> of us wants to go.\"","\"<b>Every</b> child needs love.\"","\"<b>Each</b> answer is different.\"","\"<b>Several</b> people complained.\""]},"g14":{"compare":{"title":"zero vs. first","a":{"h":"Zero (always true)","ex":["If you <b>heat</b> ice, it <b>melts</b>."]},"b":{"h":"First (likely future)","ex":["If it <b>rains</b>, we<b>’ll</b> stay in."]}},"mistakes":[{"x":"I’ll help you as long as you will ask.","v":"…as long as you <b>ask</b>. (no “will” in the condition)"},{"x":"Unless you don’t hurry, we’ll be late.","v":"<b>Unless</b> you hurry… (unless already = if not)"}],"examples":["\"If you <b>heat</b> ice, it <b>melts</b>. (zero)\"","\"If it <b>rains</b>, we <b>’ll stay</b> in. (first)\"","\"We’ll be late <b>unless</b> we hurry.\"","\"You can stay <b>as long as</b> you’re quiet.\"","\"Take an umbrella <b>in case</b> it rains.\"","\"<b>Provided that</b> you pay, you can join.\"","\"If you <b>mix</b> blue and yellow, you <b>get</b> green.\"","\"I won’t go <b>unless</b> you come too.\""]},"g15":{"compare":{"title":"a/an · the · zero","a":{"h":"a/an (new) · the (specific)","ex":["I saw <b>a</b> dog. <b>The</b> dog was big.","She’s <b>the</b> best."]},"b":{"h":"zero (general)","ex":["<b>Dogs</b> are loyal.","I like <b>music</b>.","go to <b>school</b>"]}},"mistakes":[{"x":"I love the nature.","v":"I love <b>nature</b>. (general uncountable → no article)"},{"x":"She is best doctor in town.","v":"She is <b>the</b> best doctor in town. (superlative → the)"}],"examples":["\"She’s <b>a</b> teacher and <b>an</b> artist.\"","\"<b>The</b> Earth goes round <b>the</b> Sun.\"","\"I love <b>coffee</b> in <b>the</b> morning.\"","\"We went to <b>school</b> by bus. (zero)\"","\"He plays <b>the</b> guitar very well.\"","\"<b>Children</b> need plenty of sleep. (general)\"","\"It takes <b>an</b> hour to get there.\"","\"She’s <b>the</b> best doctor in town.\""]}}},"B2":{"GRAMMAR":[{"id":"g1","title":"Third conditional","lead":"The third conditional talks about unreal situations in the past — things that did not happen — and their imagined results. We use it to express regret, criticism or relief about the past.","blocks":[{"h":"Form: if + past perfect, would have + past participle","p":["Both clauses refer to an imagined past that is now impossible to change."],"ex":["<b>If</b> I <b>had studied</b>, I <b>would have passed</b>."]},{"h":"would / could / might have","p":["Use <b>could have</b> (ability/possibility) or <b>might have</b> (possible result) instead of ‘would have’."],"ex":["If we’d left earlier, we <b>could have caught</b> the train. · She <b>might have won</b> if she’d tried."]},{"h":"Contractions","p":["‘I’d’ can mean ‘I had’ or ‘I would’. In the if-clause it is ‘had’; in the result it is ‘would’."],"ex":["If I<b>’d</b> known (had), I<b>’d</b> have told you (would)."]},{"h":"Use","p":["Express regret, criticism, or relief about a finished situation."],"ex":["If you’d listened, this <b>wouldn’t have happened</b>."]}],"tip":"Never use ‘would have’ in the if-clause: ‘If I <b>would have</b> known’ is wrong → ‘If I <b>had</b> known, I would have…’.","examples":["\"If I <b>had known</b>, I <b>would have</b> helped.\"","\"She <b>would have passed</b> if she <b>had revised</b>.\"","\"If we<b>’d</b> left earlier, we <b>could have</b> caught the bus.\"","\"They <b>might have won</b> if they <b>had played</b> better.\"","\"If it <b>hadn’t rained</b>, we <b>would have</b> gone out.\"","\"You <b>wouldn’t have</b> got lost if you<b>’d</b> used a map.\""],"q":[{"q":"If I had studied, I ___ the exam.","o":["would pass","would have passed","passed","will pass"],"a":1,"d":"easy","e":"Third conditional result: would have passed."},{"q":"She would have come if you ___ her.","o":["invited","had invited","would invite","invite"],"a":1,"d":"easy","e":"if + past perfect: had invited."},{"q":"If we hadn't missed the train, we ___ on time.","o":["would arrive","would have arrived","arrived","will arrive"],"a":1,"d":"easy","e":"Result: would have arrived."},{"q":"If it ___ rained, we'd have gone to the beach.","o":["didn't","hadn't","wouldn't","doesn't"],"a":1,"d":"easy","e":"if + past perfect negative: hadn't rained."},{"q":"They ___ won if they'd trained harder.","o":["would have","will have","had","would"],"a":0,"d":"easy","e":"Result: would have won."},{"q":"If I'd had more time, I ___ you.","o":["would help","would have helped","helped","had helped"],"a":1,"d":"med","e":"Result: would have helped."},{"q":"We ___ caught the bus if we'd run.","o":["could have","can have","could","would"],"a":0,"d":"med","e":"Ability in the past → could have caught."},{"q":"If she ___ harder, she might have got the job.","o":["tried","had tried","would try","tries"],"a":1,"d":"med","e":"if + past perfect: had tried."},{"q":"What ___ you ___ if you'd won the prize?","o":["would / do","would / have done","had / done","will / do"],"a":1,"d":"med","e":"would have done."},{"q":"Choose the past possibility.","o":["She might win.","She might have won.","She will win.","She would win."],"a":1,"d":"med","e":"Past unreal → might have won."},{"q":"Find the mistake: 'If I would have known, I'd have called.'","o":["would have known → had known","I'd have → I have","called → call","no mistake"],"a":0,"d":"hard","e":"No ‘would have’ in the if-clause: had known."},{"q":"Complete: 'If they ___ a map, they ___ lost.'","o":["had used / wouldn't have got","used / wouldn't get","had used / wouldn't get","would use / hadn't got"],"a":0,"d":"hard","e":"had used + wouldn't have got."},{"q":"Which expresses regret about the past?","o":["If I study, I'll pass.","If I studied, I'd pass.","If I had studied, I'd have passed.","If I study, I pass."],"a":2,"d":"hard","e":"Third conditional = past regret."},{"q":"Complete: 'She ___ the train if she ___ ten minutes earlier.'","o":["would catch / left","would have caught / had left","caught / had left","had caught / would leave"],"a":1,"d":"hard","e":"would have caught + had left."},{"q":"Choose the correct sentence.","o":["If you'd asked, I would have helped.","If you'd asked, I would helped.","If you asked, I would have helped.","If you had ask, I would have helped."],"a":0,"d":"hard","e":"had asked + would have helped."}]},{"id":"g2","title":"Mixed conditionals","lead":"Mixed conditionals combine two time frames. The most common type links a past condition to a present result, or a present condition to a past result.","blocks":[{"h":"Past condition → present result","p":["<b>if + past perfect, would + base</b>. A past action affects the present."],"ex":["If I <b>had taken</b> the job, I <b>would be</b> rich now."]},{"h":"Present condition → past result","p":["<b>if + past simple, would have + past participle</b>. A present (general) fact affects the past."],"ex":["If I <b>were</b> more careful, I <b>wouldn’t have made</b> that mistake."]},{"h":"Time markers","p":["Words like <b>now, today, still</b> often signal a present result from a past cause."],"ex":["If she <b>hadn’t missed</b> the flight, she <b>would be</b> here <b>now</b>."]},{"h":"Meaning","p":["Mixed conditionals are unreal in both clauses; only the time frames differ."],"ex":["If I <b>spoke</b> French (now), I <b>would have understood</b> them (then)."]}],"tip":"Decide the time of each clause separately: if the <b>cause</b> is past, use past perfect; if the <b>result</b> is present, use ‘would + base’ (not ‘would have’).","examples":["\"If I <b>had saved</b> money, I <b>would be</b> on holiday now.\"","\"If she <b>were</b> taller, she <b>would have joined</b> the team.\"","\"If we <b>hadn’t moved</b>, we <b>would still live</b> in Leeds.\"","\"If he <b>weren’t</b> so shy, he <b>would have spoken</b> to her.\"","\"If I <b>had learnt</b> to drive, life <b>would be</b> easier now.\"","\"If you <b>liked</b> sport, you <b>would have come</b> with us.\""],"q":[{"q":"If I had taken that job, I ___ in London now.","o":["would have lived","would live","lived","will live"],"a":1,"d":"easy","e":"Past cause → present result: would live."},{"q":"If she weren't so busy, she ___ to the party last night.","o":["would come","would have come","came","comes"],"a":1,"d":"easy","e":"Present fact → past result: would have come."},{"q":"If we hadn't sold the house, we ___ there still.","o":["would live","would have lived","lived","live"],"a":0,"d":"easy","e":"Past cause → present result: would live."},{"q":"If he were more careful, he ___ his keys yesterday.","o":["wouldn't lose","wouldn't have lost","didn't lose","won't lose"],"a":1,"d":"easy","e":"Present trait → past result: wouldn't have lost."},{"q":"If I spoke Spanish, I ___ them in Madrid last week.","o":["would understand","would have understood","understood","understand"],"a":1,"d":"easy","e":"Present ability → past result: would have understood."},{"q":"If they had invested earlier, they ___ wealthy today.","o":["would be","would have been","were","are"],"a":0,"d":"med","e":"Past cause → present result: would be."},{"q":"Identify the type: 'If I had slept well, I wouldn't be tired now.'","o":["first","second","third","mixed (past→present)"],"a":3,"d":"med","e":"Past condition, present result → mixed."},{"q":"Complete: 'If she ___ a doctor, she ___ him last night.'","o":["were / would help","were / would have helped","had been / would help","was / helped"],"a":1,"d":"med","e":"Present fact ‘were’ + past result ‘would have helped’."},{"q":"Find the mistake: 'If I had studied medicine, I would have been a doctor now.'","o":["would have been → would be","had studied → studied","now → then","no mistake"],"a":0,"d":"med","e":"Present result → would be (not would have been)."},{"q":"Complete: 'If we ___ the map, we ___ lost right now.'","o":["had brought / wouldn't be","brought / wouldn't have been","had brought / wouldn't have been","brought / wouldn't be"],"a":0,"d":"med","e":"Past cause ‘had brought’ + present result ‘wouldn't be’."},{"q":"Which links a present condition to a past result?","o":["If I had money, I'd buy it.","If I were brave, I would have said yes.","If I had known, I'd have come.","If I study, I'll pass."],"a":1,"d":"hard","e":"Present trait ‘were’ + past result ‘would have said’."},{"q":"Complete: 'If he ___ so lazy, he ___ the project on time last week.'","o":["weren't / would finish","weren't / would have finished","hadn't been / would finish","wasn't / finished"],"a":1,"d":"hard","e":"Present trait + past result."},{"q":"Complete: 'If I ___ to drive, I ___ a car now.'","o":["had learnt / would have","had learnt / would have had","learnt / would have","had learnt / would had"],"a":1,"d":"hard","e":"Past cause ‘had learnt’ + present result ‘would have’."},{"q":"Choose the correct mixed conditional.","o":["If I'd booked, we would be there now.","If I book, we would be there now.","If I'd booked, we would have been there now.","If I booked, we will be there."],"a":0,"d":"hard","e":"Past cause → present result."},{"q":"Complete: 'If she didn't hate flying, she ___ to Japan with us last year.'","o":["would go","would have gone","went","goes"],"a":1,"d":"hard","e":"Present fact → past result: would have gone."}]},{"id":"g3","title":"Wish & if only","lead":"We use ‘wish’ and ‘if only’ to talk about things we would like to be different. The tense we choose shows whether we mean the present, the past, or an annoying situation we want to change.","blocks":[{"h":"wish + past simple (present)","p":["For present situations we want to be different, use the past simple (or ‘were’)."],"ex":["I <b>wish</b> I <b>had</b> more time. · I <b>wish</b> I <b>were</b> taller."]},{"h":"wish + past perfect (past)","p":["For regrets about the past, use the past perfect."],"ex":["I <b>wish</b> I <b>had studied</b> harder."]},{"h":"wish + would (annoyance)","p":["For another person’s annoying behaviour, or a change we want, use <b>would</b>."],"ex":["I <b>wish</b> you <b>would stop</b> shouting. · I wish it <b>would stop</b> raining."]},{"h":"if only","p":["<b>if only</b> works like ‘wish’ but is more emphatic."],"ex":["<b>If only</b> I <b>hadn’t said</b> that!"]}],"tip":"Don’t use ‘wish + would’ about yourself. Say ‘I wish I <b>could</b>…’, not ‘I wish I would…’. Use ‘would’ for other people’s behaviour.","examples":["\"I <b>wish</b> I <b>knew</b> the answer.\"","\"I <b>wish</b> I <b>hadn’t eaten</b> so much.\"","\"I <b>wish</b> you <b>would listen</b> to me.\"","\"If only I <b>were</b> on holiday now.\"","\"She <b>wishes</b> she <b>had taken</b> the job.\"","\"If only it <b>would stop</b> snowing!\""],"q":[{"q":"I wish I ___ taller.","o":["am","were","will be","had been"],"a":1,"d":"easy","e":"Present wish → were."},{"q":"I wish I ___ harder for the exam (it's finished).","o":["studied","had studied","study","would study"],"a":1,"d":"easy","e":"Past regret → had studied."},{"q":"I wish you ___ stop interrupting me!","o":["will","would","had","were"],"a":1,"d":"easy","e":"Annoying behaviour → would stop."},{"q":"I wish I ___ more money right now.","o":["have","had","will have","had had"],"a":1,"d":"easy","e":"Present wish → had."},{"q":"If only it ___ raining!","o":["stops","would stop","stopped","had stopped"],"a":1,"d":"easy","e":"Wanting a change → would stop."},{"q":"She wishes she ___ the truth earlier.","o":["knew","had known","knows","would know"],"a":1,"d":"med","e":"Past regret → had known."},{"q":"I wish I ___ speak Chinese.","o":["can","could","would","will"],"a":1,"d":"med","e":"Present ability wish → could."},{"q":"I wish my neighbours ___ so much noise.","o":["don't make","wouldn't make","didn't make","hadn't made"],"a":1,"d":"med","e":"Others' behaviour → wouldn't make."},{"q":"If only I ___ that email — it was a mistake.","o":["didn't send","hadn't sent","don't send","wouldn't send"],"a":1,"d":"med","e":"Past regret → hadn't sent."},{"q":"Choose the present wish.","o":["I wish I had gone.","I wish I lived nearer.","I wish you would help.","I wish I had known."],"a":1,"d":"med","e":"Present situation → past simple: lived."},{"q":"Find the mistake: 'I wish I would be on holiday now.'","o":["would be → were","wish → hope","now → then","no mistake"],"a":0,"d":"hard","e":"Don't use ‘wish + would’ about yourself: I wish I were."},{"q":"Complete: 'I wish I ___ the job, and I wish they ___ me another chance.'","o":["took / would give","had taken / would give","take / give","had taken / gave"],"a":1,"d":"hard","e":"Past regret ‘had taken’ + wanting future change ‘would give’."},{"q":"Which expresses a past regret?","o":["I wish I knew her.","I wish I had met her.","I wish you would call.","I wish I could swim."],"a":1,"d":"hard","e":"Past perfect → had met."},{"q":"Complete: 'If only he ___ listen — he never does!'","o":["will","would","had","were"],"a":1,"d":"hard","e":"Annoying habit → would listen."},{"q":"Choose the correct sentence.","o":["I wish I would have studied.","I wish I had studied.","I wish I studied yesterday.","I wish I will study."],"a":1,"d":"hard","e":"Past regret → wish + past perfect."}]},{"id":"g4","title":"The passive: advanced","lead":"At B2 we use the passive across all tenses and in impersonal reporting structures, which are common in news and academic writing to report opinions without naming a source.","blocks":[{"h":"All tenses","p":["Form the passive with the correct tense of <b>be</b> + past participle, including perfect and continuous forms."],"ex":["The road <b>is being repaired</b>. · The work <b>had been finished</b>. · It <b>will have been done</b>."]},{"h":"It is said that…","p":["Use <b>It + is/was + reporting verb + that…</b> to report general opinions."],"ex":["<b>It is said that</b> he is very rich. · <b>It was believed that</b> the Earth was flat."]},{"h":"Subject + is said to…","p":["A second pattern: <b>Subject + is/was + said/thought + to + infinitive</b>."],"ex":["He <b>is said to be</b> rich. · She <b>is thought to have left</b> the country."]},{"h":"have/get something done","p":["Use <b>have/get + object + past participle</b> when someone does a service for you (see causatives)."],"ex":["I <b>had my car repaired</b>."]}],"tip":"In ‘He is said <b>to have</b> left’, use the <b>perfect infinitive</b> (to have + pp) when the action is earlier than the reporting.","examples":["\"The bridge <b>is being rebuilt</b> at the moment.\"","\"The results <b>had been announced</b> before we arrived.\"","\"<b>It is believed that</b> prices will rise.\"","\"The painting <b>is thought to be</b> a fake.\"","\"He <b>is said to have made</b> a fortune.\"","\"The decision <b>will have been made</b> by Friday.\""],"q":[{"q":"The road ___ at the moment.","o":["is repairing","is being repaired","repairs","was repair"],"a":1,"d":"easy","e":"Present continuous passive: is being repaired."},{"q":"The letters ___ before noon yesterday.","o":["had delivered","had been delivered","have delivered","deliver"],"a":1,"d":"easy","e":"Past perfect passive: had been delivered."},{"q":"It ___ that he is very wealthy.","o":["is said","says","said","is saying"],"a":0,"d":"easy","e":"Impersonal report: It is said that."},{"q":"The house ___ by next week.","o":["will sell","will be sold","sells","is selling"],"a":1,"d":"easy","e":"Future passive: will be sold."},{"q":"The matter is still ___.","o":["discussing","being discussed","discussed it","discuss"],"a":1,"d":"easy","e":"Continuous passive: being discussed."},{"q":"It is believed ___ the painting is genuine.","o":["that","to","which","what"],"a":0,"d":"med","e":"It is believed that…"},{"q":"He is said ___ a genius.","o":["that he is","to be","being","be"],"a":1,"d":"med","e":"Subject + is said + to be."},{"q":"The project ___ by the end of the month.","o":["will finish","will have been finished","finishes","is finishing"],"a":1,"d":"med","e":"Future perfect passive: will have been finished."},{"q":"She is thought ___ the country.","o":["to leave","to have left","leaving","that left"],"a":1,"d":"med","e":"Earlier action → to have left."},{"q":"Rewrite impersonally: 'People say she is rich.'","o":["She is said to be rich.","She says to be rich.","She is said being rich.","It says she is rich."],"a":0,"d":"med","e":"She is said to be rich."},{"q":"Find the mistake: 'It is said that he has leave the company.'","o":["has leave → has left","said → say","that → which","no mistake"],"a":0,"d":"hard","e":"Past participle: has left."},{"q":"Complete: 'The new policy ___ since January.'","o":["is implemented","has been implemented","implements","is implementing"],"a":1,"d":"hard","e":"Present perfect passive: has been implemented."},{"q":"Which is correct?","o":["He is thought to have stolen it.","He is thought to have stole it.","He is thought stealing it.","He thinks to steal it."],"a":0,"d":"hard","e":"to have + past participle: to have stolen."},{"q":"Complete (continuous past passive): 'The house ___ when we drove past.'","o":["was being built","was build","is being built","had built"],"a":0,"d":"hard","e":"Past continuous passive: was being built."},{"q":"Rewrite: 'They believe the company has lost money.'","o":["The company is believed to have lost money.","The company is believed losing money.","The company believes to lose money.","It is believed the company to lose money."],"a":0,"d":"hard","e":"is believed to have lost money."}]},{"id":"g5","title":"Reported speech: reporting verbs","lead":"Beyond ‘say’ and ‘tell’, English uses many reporting verbs that summarise the function of what was said — such as offer, promise, suggest, admit and refuse — each with its own grammar pattern.","blocks":[{"h":"verb + to-infinitive","p":["offer, promise, agree, refuse, threaten, decide."],"ex":["He <b>offered to help</b>. · She <b>refused to answer</b>."]},{"h":"verb + object + to-infinitive","p":["advise, ask, tell, warn, remind, encourage, invite."],"ex":["They <b>advised me to wait</b>. · He <b>warned us not to go</b>."]},{"h":"verb + -ing","p":["suggest, admit, deny, recommend, mention."],"ex":["She <b>suggested leaving</b> early. · He <b>admitted breaking</b> it."]},{"h":"verb + preposition + -ing","p":["apologise <b>for</b>, insist <b>on</b>, accuse sb <b>of</b>, congratulate sb <b>on</b>."],"ex":["He <b>apologised for being</b> late. · She <b>insisted on paying</b>."]}],"tip":"Match the verb to its pattern: ‘suggest’ takes <b>-ing</b> or ‘that…’, never ‘to’. ‘He suggested <b>to go</b>’ is wrong → ‘He suggested <b>going</b>’.","examples":["\"She <b>offered to drive</b> me home.\"","\"They <b>warned us not to swim</b> there.\"","\"He <b>admitted stealing</b> the money.\"","\"I <b>apologised for forgetting</b> her birthday.\"","\"The doctor <b>advised him to rest</b>.\"","\"She <b>insisted on seeing</b> the manager.\""],"q":[{"q":"He offered ___ me with my bags.","o":["help","to help","helping","that help"],"a":1,"d":"easy","e":"offer + to: to help."},{"q":"She suggested ___ a taxi.","o":["take","to take","taking","takes"],"a":2,"d":"easy","e":"suggest + -ing: taking."},{"q":"They advised me ___ a doctor.","o":["see","to see","seeing","saw"],"a":1,"d":"easy","e":"advise + object + to: to see."},{"q":"He admitted ___ the window.","o":["break","to break","breaking","broke"],"a":2,"d":"easy","e":"admit + -ing: breaking."},{"q":"She refused ___ the question.","o":["answer","to answer","answering","answered"],"a":1,"d":"easy","e":"refuse + to: to answer."},{"q":"He apologised ___ late.","o":["to be","for being","being","that be"],"a":1,"d":"med","e":"apologise for + -ing: for being."},{"q":"They warned us ___ out late.","o":["to not stay","not to stay","not staying","don't stay"],"a":1,"d":"med","e":"warn + object + not to: not to stay."},{"q":"She insisted ___ for dinner.","o":["to pay","on paying","paying","that pay"],"a":1,"d":"med","e":"insist on + -ing: on paying."},{"q":"He denied ___ anything wrong.","o":["to do","doing","do","that do"],"a":1,"d":"med","e":"deny + -ing: doing."},{"q":"They invited us ___ the party.","o":["join","to join","joining","that join"],"a":1,"d":"med","e":"invite + object + to: to join."},{"q":"Find the mistake: 'She suggested to meet at six.'","o":["to meet → meeting","suggested → suggest","six → at six","no mistake"],"a":0,"d":"hard","e":"suggest + -ing: suggested meeting."},{"q":"Report: \"I'll definitely pay you back.\" → He ___.","o":["promised to pay me back","promised paying me back","suggested to pay back","admitted to pay back"],"a":0,"d":"hard","e":"promise + to: promised to pay back."},{"q":"Report: \"It was me. I took it.\" → She ___.","o":["denied taking it","admitted taking it","refused to take it","offered to take it"],"a":1,"d":"hard","e":"admit + -ing: admitted taking it."},{"q":"Report: \"You should rest.\" (doctor → patient)","o":["The doctor advised resting.","The doctor advised him to rest.","The doctor suggested him to rest.","The doctor offered to rest."],"a":1,"d":"hard","e":"advise + object + to: advised him to rest."},{"q":"Report: \"Well done on passing!\" → They ___.","o":["congratulated me on passing","congratulated me to pass","apologised for passing","insisted on passing"],"a":0,"d":"hard","e":"congratulate sb on + -ing."}]},{"id":"g6","title":"Past modals of deduction","lead":"To make guesses about the past, we use a modal verb + have + past participle. These show how certain we are that something happened, based on present evidence.","blocks":[{"h":"must have (almost certain)","p":["Use <b>must have</b> + past participle when you are sure something happened."],"ex":["The ground is wet — it <b>must have rained</b>."]},{"h":"can’t / couldn’t have (impossible)","p":["Use <b>can’t/couldn’t have</b> + pp when you are sure it did <b>not</b> happen."],"ex":["He <b>can’t have finished</b> already; it’s too soon."]},{"h":"might / may / could have (possible)","p":["Use these for things that possibly happened but you’re not sure."],"ex":["She <b>might have missed</b> the bus. · They <b>could have got</b> lost."]},{"h":"should have (criticism/regret)","p":["Use <b>should have</b> + pp for the right thing that didn’t happen (regret or criticism)."],"ex":["You <b>should have told</b> me. · I <b>shouldn’t have eaten</b> so much."]}],"tip":"For deduction the opposite of ‘must have’ is ‘<b>can’t have</b>’, not ‘mustn’t have’. ‘Mustn’t have’ is not used for deduction in standard English.","examples":["\"The lights are off — they <b>must have gone</b> out.\"","\"She <b>can’t have seen</b> us; she didn’t wave.\"","\"He <b>might have forgotten</b> the meeting.\"","\"You <b>should have called</b> a doctor.\"","\"I <b>shouldn’t have said</b> that.\"","\"They <b>could have taken</b> the wrong road.\""],"q":[{"q":"The grass is wet. It ___ last night.","o":["must rain","must have rained","can't rain","should rain"],"a":1,"d":"easy","e":"Sure it happened → must have rained."},{"q":"He ___ the news; he looks shocked.","o":["must have heard","can't have heard","should hear","must hear"],"a":0,"d":"easy","e":"Sure → must have heard."},{"q":"She didn't wave, so she ___ us.","o":["must have seen","can't have seen","should have seen","might see"],"a":1,"d":"easy","e":"Sure not → can't have seen."},{"q":"I'm not sure where he is. He ___ home.","o":["must have gone","can't have gone","might have gone","should have gone"],"a":2,"d":"easy","e":"Possible → might have gone."},{"q":"You're hurt! You ___ me.","o":["should have told","must have told","can't have told","might tell"],"a":0,"d":"easy","e":"Criticism/regret → should have told."},{"q":"The cake is gone. Someone ___ it.","o":["must have eaten","can't have eaten","should eat","must eat"],"a":0,"d":"med","e":"Sure → must have eaten."},{"q":"He failed? He ___ much.","o":["must have studied","can't have studied","should study","might study"],"a":1,"d":"med","e":"Sure not → can't have studied."},{"q":"They're late. They ___ stuck in traffic.","o":["should have been","can't have been","might have been","must be"],"a":2,"d":"med","e":"Possible → might have been."},{"q":"I feel ill. I ___ that fish.","o":["should have eaten","shouldn't have eaten","can't have eaten","must eat"],"a":1,"d":"med","e":"Regret → shouldn't have eaten."},{"q":"Choose the 'impossible' deduction.","o":["She must have left.","She can't have left.","She might have left.","She should have left."],"a":1,"d":"med","e":"can't have = sure it didn't happen."},{"q":"Find the mistake: 'He mustn't have heard the bell.'","o":["mustn't have → can't have","heard → hear","the → a","no mistake"],"a":0,"d":"hard","e":"For negative deduction use ‘can't have’."},{"q":"Complete: 'The door's open — someone ___ in, or you ___ to lock it.'","o":["must have broken / might have forgotten","can't have broken / must forget","should break / can't forget","might break / should forget"],"a":0,"d":"hard","e":"must have broken in (sure) + might have forgotten (possible)."},{"q":"Which shows regret about the past?","o":["I must have left early.","I should have left earlier.","I might have left early.","I can't have left."],"a":1,"d":"hard","e":"should have = regret."},{"q":"Complete: 'She passed easily — the exam ___ very hard.'","o":["must have been","can't have been","should have been","might be"],"a":1,"d":"hard","e":"Sure it wasn't hard → can't have been."},{"q":"Choose the correct sentence.","o":["You should have call me.","You should have called me.","You should called me.","You must called me."],"a":1,"d":"hard","e":"should have + past participle: should have called."}]},{"id":"g7","title":"Relative clauses: advanced","lead":"At B2 we use more formal relative structures: prepositions before the relative pronoun, ‘whose’ for possession, and quantifiers like ‘some of whom’ and ‘both of which’ in non-defining clauses.","blocks":[{"h":"Preposition + which/whom","p":["In formal English the preposition can go <b>before</b> the relative pronoun (which/whom)."],"ex":["The man <b>to whom</b> I spoke… · The house <b>in which</b> they live…"]},{"h":"Informal: preposition at the end","p":["In everyday English we usually move the preposition to the end and may drop the pronoun."],"ex":["The man (who) I spoke <b>to</b>… · The house (that) they live <b>in</b>…"]},{"h":"quantifier + of whom/which","p":["In non-defining clauses use <b>all/some/many/none/both + of whom/which</b>."],"ex":["I have three sisters, <b>all of whom</b> are doctors."]},{"h":"whose","p":["<b>whose</b> shows possession for people and things."],"ex":["A company <b>whose</b> products are famous… · The author, <b>whose</b> books I love…"]}],"tip":"After a preposition use <b>whom</b> (not ‘who’) and <b>which</b> (not ‘that’): ‘the person <b>to whom</b>…’, ‘the tool <b>with which</b>…’. ‘To that’ and ‘to who’ are wrong here.","examples":["\"The colleague <b>with whom</b> I work is brilliant.\"","\"This is the book <b>about which</b> we spoke.\"","\"She has many friends, <b>most of whom</b> live abroad.\"","\"They sell phones, <b>none of which</b> are cheap.\"","\"He’s an artist <b>whose</b> work sells worldwide.\"","\"The reason <b>for which</b> he left is unclear.\""],"q":[{"q":"The person ___ I spoke was helpful. (formal)","o":["to who","to whom","to that","whom to"],"a":1,"d":"easy","e":"Preposition + whom: to whom."},{"q":"That's the house ___ which they were born.","o":["in","on","at","of"],"a":0,"d":"easy","e":"born in a house → in which."},{"q":"He's a writer ___ novels are famous.","o":["who","which","whose","whom"],"a":2,"d":"easy","e":"Possession → whose."},{"q":"Informal: 'The man I spoke ___.'","o":["to","with","for","of"],"a":0,"d":"easy","e":"speak to → preposition at the end: to."},{"q":"I have two cousins, both ___ whom are nurses.","o":["of","in","to","for"],"a":0,"d":"easy","e":"both of whom."},{"q":"The tool ___ which we cut it was sharp.","o":["with","by","of","to"],"a":0,"d":"med","e":"cut with → with which."},{"q":"She has many fans, some ___ whom waited all night.","o":["of","in","to","for"],"a":0,"d":"med","e":"some of whom."},{"q":"The company ___ products we use is British.","o":["who","whose","which","whom"],"a":1,"d":"med","e":"Possession (company's) → whose."},{"q":"This is the issue ___ which we must decide.","o":["on","in","of","at"],"a":0,"d":"med","e":"decide on → on which."},{"q":"Choose the formal version of 'the man I work with'.","o":["the man with who I work","the man with whom I work","the man with that I work","the man whom I work"],"a":1,"d":"med","e":"with whom I work."},{"q":"Find the mistake: 'The client to that I wrote replied.'","o":["to that → to whom","wrote → write","replied → reply","no mistake"],"a":0,"d":"hard","e":"After a preposition use ‘whom’, not ‘that’."},{"q":"Complete: 'He owns three shops, ___ are in London.'","o":["all of which","all of whom","which all","that all"],"a":0,"d":"hard","e":"Things → all of which."},{"q":"Which is correct and formal?","o":["The report on which it is based is here.","The report on that it is based is here.","The report which it is based on which…","The report based which on it…"],"a":0,"d":"hard","e":"based on → on which."},{"q":"Complete: 'She interviewed ten people, ___ had experience.'","o":["none of whom","none of which","whom none","which none"],"a":0,"d":"hard","e":"People → none of whom."},{"q":"Choose the correct 'whose' sentence.","o":["The painter who paintings sell well is here.","The painter whose paintings sell well is here.","The painter which paintings sell well is here.","The painter whom paintings sell well is here."],"a":1,"d":"hard","e":"Possession → whose paintings."}]},{"id":"g8","title":"Causative: have/get something done","lead":"We use the causative when we arrange for someone else to do a service for us, rather than doing it ourselves. The structure focuses on the result, not on who does the work.","blocks":[{"h":"have + object + past participle","p":["The standard structure: <b>have</b> + thing + past participle."],"ex":["I <b>had my hair cut</b>. · We <b>had the house painted</b>."]},{"h":"get + object + past participle","p":["<b>get</b> is a more informal alternative to ‘have’."],"ex":["I <b>got my car repaired</b>. · She <b>got her photo taken</b>."]},{"h":"All tenses","p":["Change the tense of ‘have/get’ as needed."],"ex":["I<b>’m having</b> my eyes <b>tested</b> tomorrow. · He<b>’s had</b> his phone <b>fixed</b>."]},{"h":"Unpleasant events","p":["The same structure can describe something bad that happened to you."],"ex":["She <b>had her bag stolen</b>. · They <b>had their flight cancelled</b>."]}],"tip":"The order is <b>have + OBJECT + past participle</b>, not ‘have + past participle + object’. Say ‘I had <b>my car washed</b>’, not ‘I had washed my car’ (that means you did it yourself).","examples":["\"I <b>had my suit cleaned</b> for the wedding.\"","\"We<b>’re getting the kitchen redecorated</b>.\"","\"He <b>had his tooth taken out</b>.\"","\"She <b>got her hair coloured</b>.\"","\"They <b>had their car broken into</b>.\"","\"I need to <b>have my passport renewed</b>.\""],"q":[{"q":"I ___ my hair cut yesterday.","o":["had","have","did","made"],"a":0,"d":"easy","e":"Causative past: had my hair cut."},{"q":"We're going to ___ the house painted.","o":["have","do","make","take"],"a":0,"d":"easy","e":"have the house painted."},{"q":"She ___ her car repaired last week.","o":["got","made","did","took"],"a":0,"d":"easy","e":"got her car repaired."},{"q":"Choose the correct order.","o":["I had cut my hair.","I had my hair cut.","I had my cut hair.","I cut had my hair."],"a":1,"d":"easy","e":"have + object + past participle."},{"q":"He needs to have his eyes ___.","o":["test","tested","testing","to test"],"a":1,"d":"easy","e":"Past participle: tested."},{"q":"I'm ___ my photo taken tomorrow.","o":["have","having","had","got"],"a":1,"d":"med","e":"Present continuous: having."},{"q":"They ___ their windows cleaned every month.","o":["get","getting","got","to get"],"a":0,"d":"med","e":"Habit, present simple: get."},{"q":"She ___ her bag stolen on the train. (bad event)","o":["had","did","made","took"],"a":0,"d":"med","e":"had her bag stolen."},{"q":"We've just ___ the carpet cleaned.","o":["have","had","having","got had"],"a":1,"d":"med","e":"Present perfect: have had → 'have just had'... here 'had' completes 'have just had'."},{"q":"Choose the causative meaning 'someone did it for me'.","o":["I painted the door.","I had the door painted.","I was painting the door.","I paint the door."],"a":1,"d":"med","e":"Causative: had the door painted."},{"q":"Find the mistake: 'I had repaired my bike at the shop.'","o":["had repaired → had my bike repaired","at → in","the → a","no mistake"],"a":0,"d":"hard","e":"Causative needs object + pp: had my bike repaired."},{"q":"Complete: 'You should ___ that tooth ___.'","o":["have / looking at","get / looked at","got / look at","have / look"],"a":1,"d":"hard","e":"get + object + past participle: get it looked at."},{"q":"Which describes an unpleasant event?","o":["He had his car serviced.","He had his car stolen.","He had his car washed.","He had his car painted."],"a":1,"d":"hard","e":"had his car stolen = bad event."},{"q":"Complete: 'They ___ their flight ___ because of the storm.'","o":["had / cancelled","had / cancel","got / cancelling","have / cancel"],"a":0,"d":"hard","e":"had + object + past participle: had it cancelled."},{"q":"Choose the correct future causative.","o":["I'll have fix the roof.","I'll have the roof fixed.","I'll have fixed the roof for me.","I'll fix have the roof."],"a":1,"d":"hard","e":"have + object + past participle: have the roof fixed."}]},{"id":"g9","title":"Gerunds & infinitives: advanced","lead":"Some verbs are followed by either a gerund or an infinitive, but with a clear change of meaning. Knowing the difference lets you say exactly what you mean.","blocks":[{"h":"remember / forget","p":["<b>+ to</b> = the duty comes after; <b>+ -ing</b> = the memory comes before."],"ex":["Remember <b>to lock</b> the door. (do it) · I remember <b>locking</b> it. (memory)"]},{"h":"stop","p":["<b>stop + -ing</b> = end the activity; <b>stop + to</b> = pause in order to do something."],"ex":["He stopped <b>smoking</b>. (quit) · He stopped <b>to smoke</b>. (paused)"]},{"h":"try","p":["<b>try + -ing</b> = experiment; <b>try + to</b> = attempt something difficult."],"ex":["Try <b>adding</b> salt. (experiment) · I tried <b>to open</b> it. (attempt)"]},{"h":"regret / mean / go on","p":["<b>regret + -ing</b> = be sorry about the past; <b>regret + to</b> = be sorry to announce. <b>mean + -ing</b> = involve; <b>mean + to</b> = intend."],"ex":["I regret <b>saying</b> it. · I regret <b>to inform</b> you… · This job means <b>travelling</b>. · I meant <b>to call</b>."]}],"tip":"With ‘remember/forget’: use the <b>infinitive</b> for a task you must do, and the <b>-ing</b> form for a memory of something already done.","examples":["\"Please remember <b>to post</b> the letter.\"","\"I’ll never forget <b>meeting</b> her.\"","\"He stopped <b>to rest</b> for a minute.\"","\"Try <b>turning</b> it off and on again.\"","\"I regret <b>to tell</b> you the news is bad.\"","\"Studying abroad means <b>leaving</b> home.\""],"q":[{"q":"Remember ___ the door when you leave.","o":["lock","to lock","locking","locked"],"a":1,"d":"easy","e":"Duty to do → to lock."},{"q":"I remember ___ him at the party last year.","o":["meet","to meet","meeting","met"],"a":2,"d":"easy","e":"Memory → meeting."},{"q":"He stopped ___ because his lungs hurt. (quit)","o":["smoke","to smoke","smoking","smoked"],"a":2,"d":"easy","e":"Ended the activity → stopped smoking."},{"q":"On the walk, we stopped ___ photos.","o":["take","to take","taking","took"],"a":1,"d":"easy","e":"Paused in order to → to take."},{"q":"I regret ___ that I can't help.","o":["say","to say","saying","said"],"a":1,"d":"easy","e":"Sorry to announce → regret to say."},{"q":"The recipe didn't work. Try ___ more sugar.","o":["to add","adding","add","added"],"a":1,"d":"med","e":"Experiment → try adding."},{"q":"I tried ___ the window, but it was stuck.","o":["opening","to open","open","opened"],"a":1,"d":"med","e":"Attempt at something hard → tried to open."},{"q":"This new job means ___ to another city.","o":["to move","moving","move","moved"],"a":1,"d":"med","e":"mean = involve → moving."},{"q":"I'm sorry, I meant ___ you earlier.","o":["calling","to call","call","called"],"a":1,"d":"med","e":"mean = intend → to call."},{"q":"Don't forget ___ your medicine tonight.","o":["take","to take","taking","took"],"a":1,"d":"med","e":"Duty → to take."},{"q":"Find the mistake: 'I regret to tell him the truth; now he's angry.'","o":["to tell → telling","regret → regretting","him → to him","no mistake"],"a":0,"d":"hard","e":"Sorry about the past → regret telling."},{"q":"Complete: 'I'll never forget ___ the Pyramids, but please remember ___ the tickets.'","o":["to see / buying","seeing / to buy","seeing / buying","to see / to buy"],"a":1,"d":"hard","e":"Memory ‘seeing’ + duty ‘to buy’."},{"q":"Which means 'he paused his walk to make a call'?","o":["He stopped calling.","He stopped to call.","He stopped to be called.","He stopped called."],"a":1,"d":"hard","e":"stop + to = pause in order to."},{"q":"Complete: 'We regret ___ you that the flight ___, so we tried ___ another route.'","o":["telling / is cancelled / finding","to inform / has been cancelled / to find","to inform / cancelled / finding","informing / cancelling / to find"],"a":1,"d":"hard","e":"regret to inform + passive + tried to find."},{"q":"Choose the correct pair.","o":["Remember posting it (do it now) / I stopped to smoke (quit).","Remember to post it (do it) / I stopped smoking (quit).","Remember to post it / I stopped to smoke means I quit.","Remember posting it means do it now."],"a":1,"d":"hard","e":"to-infinitive = task; stop + -ing = quit."}]},{"id":"g10","title":"Future perfect & continuous","lead":"To talk about the future in detail, we use the future continuous for actions in progress at a future time, and the future perfect for actions that will be completed before a future point.","blocks":[{"h":"Future continuous: will be + -ing","p":["An action that will be <b>in progress</b> at a specific future time."],"ex":["This time tomorrow I <b>will be flying</b> to Rome."]},{"h":"Future perfect: will have + past participle","p":["An action that will be <b>finished before</b> a future time, often with ‘by’."],"ex":["By 2030 they <b>will have built</b> the bridge."]},{"h":"by / by the time","p":["Use <b>by</b> + time or <b>by the time</b> + clause with the future perfect."],"ex":["<b>By the time</b> you arrive, I <b>will have left</b>."]},{"h":"Future perfect continuous","p":["<b>will have been + -ing</b> stresses the <b>duration</b> up to a future point."],"ex":["By June I <b>will have been working</b> here for ten years."]}],"tip":"Use the future <b>continuous</b> for something happening <b>at</b> a future moment, and the future <b>perfect</b> for something completed <b>before</b> that moment.","examples":["\"At 8 pm I <b>’ll be having</b> dinner.\"","\"By Friday we <b>’ll have finished</b> the report.\"","\"This time next week she <b>’ll be lying</b> on a beach.\"","\"By the time he’s 30, he <b>’ll have travelled</b> the world.\"","\"In May I <b>’ll have been studying</b> here for three years.\"","\"Don’t call at six — I<b>’ll be driving</b>.\""],"q":[{"q":"This time tomorrow I ___ to Spain.","o":["will fly","will be flying","will have flown","fly"],"a":1,"d":"easy","e":"In progress at a future time → will be flying."},{"q":"By next year, they ___ the new road.","o":["will build","will be building","will have built","build"],"a":2,"d":"easy","e":"Completed before a future time → will have built."},{"q":"At 9 pm tonight, we ___ the match.","o":["will watch","will be watching","will have watched","watch"],"a":1,"d":"easy","e":"In progress → will be watching."},{"q":"By the time you arrive, I ___.","o":["will leave","will be leaving","will have left","leave"],"a":2,"d":"easy","e":"Finished before → will have left."},{"q":"Don't phone at six; I ___.","o":["will drive","will be driving","will have driven","drive"],"a":1,"d":"easy","e":"In progress → will be driving."},{"q":"By Friday she ___ the project.","o":["will finish","will be finishing","will have finished","finishes"],"a":2,"d":"med","e":"Completed by a deadline → will have finished."},{"q":"This time next week, they ___ on holiday.","o":["will relax","will be relaxing","will have relaxed","relax"],"a":1,"d":"med","e":"In progress → will be relaxing."},{"q":"In June I ___ here for five years.","o":["will work","will be working","will have been working","work"],"a":2,"d":"med","e":"Duration up to a future point → will have been working."},{"q":"By 2040, scientists ___ a cure, perhaps.","o":["will find","will be finding","will have found","find"],"a":2,"d":"med","e":"Completed before → will have found."},{"q":"Choose the action in progress at a future time.","o":["I'll have eaten by then.","I'll be eating at 8.","I'll eat at 8.","I eat at 8."],"a":1,"d":"med","e":"will be eating = in progress."},{"q":"Find the mistake: 'By next month I will finish the course.'","o":["will finish → will have finished","By → On","month → months","no mistake"],"a":0,"d":"hard","e":"Completed before a future time → will have finished."},{"q":"Complete: 'At noon we ___ the test; by 2 pm we ___ it.'","o":["will be taking / will have finished","will take / will finish","will have taken / will be finishing","take / finish"],"a":0,"d":"hard","e":"In progress ‘will be taking’ + completed ‘will have finished’."},{"q":"Which stresses duration up to a future point?","o":["I'll have written the book.","I'll be writing the book.","By May I'll have been writing for a year.","I'll write the book."],"a":2,"d":"hard","e":"will have been writing = duration."},{"q":"Complete: 'By the time the film ends, we ___ here for three hours.'","o":["will sit","will be sitting","will have been sitting","sit"],"a":2,"d":"hard","e":"Duration up to a point → will have been sitting."},{"q":"Choose the correct future perfect.","o":["By 6, they will have left.","By 6, they will leaving.","By 6, they will have leave.","By 6, they leave."],"a":0,"d":"hard","e":"will have + past participle: will have left."}]},{"id":"g11","title":"Past perfect continuous","lead":"The past perfect continuous shows that an activity had been in progress for a period before another point in the past. It emphasises duration and often explains a past situation.","blocks":[{"h":"Form: had been + -ing","p":["Use <b>had been</b> + verb-ing for an action that continued up to a point in the past."],"ex":["She <b>had been waiting</b> for an hour when the bus came."]},{"h":"Explaining a past result","p":["It often explains why something was the case at a past moment."],"ex":["His eyes were red because he <b>had been crying</b>."]},{"h":"with for / since","p":["Use <b>for</b> + period and <b>since</b> + starting point."],"ex":["They <b>had been living</b> there <b>for</b> years before they moved."]},{"h":"vs. past perfect simple","p":["The continuous stresses the <b>activity/duration</b>; the simple stresses the <b>completed result</b>."],"ex":["I <b>had been reading</b>. (activity) · I <b>had read</b> the book. (finished)"]}],"tip":"Don’t use the continuous with state verbs. Say ‘I <b>had known</b> her for years’, not ‘I had been knowing’.","examples":["\"He was tired because he <b>had been working</b> all night.\"","\"We <b>had been driving</b> for hours when the car broke down.\"","\"She <b>had been studying</b> French before she moved to Paris.\"","\"The ground was wet; it <b>had been raining</b>.\"","\"They <b>had been arguing</b> before we arrived.\"","\"I <b>had been waiting</b> for ages when she finally called.\""],"q":[{"q":"She ___ for an hour when the bus arrived.","o":["waited","had been waiting","has waited","was waiting"],"a":1,"d":"easy","e":"Duration up to a past point → had been waiting."},{"q":"His eyes were red because he ___.","o":["cried","had been crying","cries","has cried"],"a":1,"d":"easy","e":"Explains the past result → had been crying."},{"q":"They ___ for hours before they stopped.","o":["drove","had been driving","drive","have driven"],"a":1,"d":"easy","e":"Duration → had been driving."},{"q":"The form of the past perfect continuous is ___.","o":["had + -ing","had been + -ing","has been + -ing","was + -ing"],"a":1,"d":"easy","e":"had been + -ing."},{"q":"It was wet outside; it ___.","o":["rained","had been raining","rains","has rained"],"a":1,"d":"easy","e":"Earlier activity → had been raining."},{"q":"We ___ for the train when it was cancelled.","o":["waited","had been waiting","wait","have waited"],"a":1,"d":"med","e":"Duration before a past event → had been waiting."},{"q":"She was out of breath because she ___.","o":["ran","had been running","runs","has run"],"a":1,"d":"med","e":"Explains the state → had been running."},{"q":"How long ___ they ___ before they got married?","o":["had / been dating","have / dated","did / date","had / dated"],"a":0,"d":"med","e":"Duration → had they been dating."},{"q":"Which verb is WRONG in this form?","o":["working","waiting","knowing","studying"],"a":2,"d":"med","e":"‘know’ is a state verb."},{"q":"Choose the duration form.","o":["I had read for hours.","I had been reading for hours.","I have read for hours.","I was read for hours."],"a":1,"d":"med","e":"Duration → had been reading."},{"q":"Find the mistake: 'I had been knowing him for years before he left.'","o":["had been knowing → had known","left → leave","years → year","no mistake"],"a":0,"d":"hard","e":"State verb: had known."},{"q":"Complete: 'By the time help arrived, they ___ for three hours.'","o":["had been swimming","had swum","were swimming","have been swimming"],"a":0,"d":"hard","e":"Duration up to a past point → had been swimming."},{"q":"Which stresses the completed result?","o":["She had been painting the room.","She had painted the room.","She was painting the room.","She had been paint the room."],"a":1,"d":"hard","e":"Completed → past perfect simple: had painted."},{"q":"Complete: 'He failed because he ___ instead of revising.'","o":["had been playing","had played","played","was play"],"a":0,"d":"hard","e":"Ongoing activity explaining the result → had been playing."},{"q":"Choose the correct sentence.","o":["They had been lived there for years.","They had been living there for years.","They have been living there for years before.","They had living there for years."],"a":1,"d":"hard","e":"had been + -ing: had been living."}]},{"id":"g12","title":"Inversion","lead":"In formal or emphatic English, certain negative or limiting adverbials at the start of a sentence force inversion — the auxiliary verb comes before the subject, as in a question.","blocks":[{"h":"Negative adverbials","p":["After <b>never, rarely, seldom, hardly, no sooner, not only, little</b> at the start, invert subject and auxiliary."],"ex":["<b>Never have I</b> seen such a mess. · <b>Rarely does she</b> complain."]},{"h":"hardly… when / no sooner… than","p":["Used for one event quickly following another."],"ex":["<b>Hardly had we</b> arrived <b>when</b> it started to rain. · <b>No sooner had he</b> spoken <b>than</b> she left."]},{"h":"not only… but also","p":["<b>Not only + auxiliary + subject</b>, … but also …"],"ex":["<b>Not only did he</b> apologise, but he also paid."]},{"h":"only + time phrase","p":["After <b>only then / only after / only when / not until</b>, invert."],"ex":["<b>Only when</b> she left <b>did I</b> realise. · <b>Not until</b> midnight <b>did they</b> finish."]}],"tip":"Inversion uses the same auxiliary you’d use in a question: ‘<b>Never have I</b>…’, ‘<b>Rarely does he</b>…’, ‘<b>Not only did she</b>…’. Don’t use normal word order after these openers.","examples":["\"<b>Never have I</b> been so embarrassed.\"","\"<b>Rarely do we</b> see such talent.\"","\"<b>Hardly had I</b> sat down when the phone rang.\"","\"<b>No sooner had they</b> left than it snowed.\"","\"<b>Not only is she</b> clever, but she’s kind too.\"","\"<b>Only after</b> the test <b>did he</b> relax.\""],"q":[{"q":"Never ___ such a beautiful view.","o":["I have seen","have I seen","I saw","did I saw"],"a":1,"d":"easy","e":"Inversion: have I seen."},{"q":"Rarely ___ to the cinema.","o":["she goes","goes she","does she go","she does go"],"a":2,"d":"easy","e":"Inversion: does she go."},{"q":"Not only ___ late, but he was rude too.","o":["he was","was he","he is","did he"],"a":1,"d":"easy","e":"Inversion: was he."},{"q":"Seldom ___ such kindness.","o":["we see","see we","do we see","we do see"],"a":2,"d":"easy","e":"Inversion: do we see."},{"q":"Hardly ___ down when the bell rang.","o":["I had sat","had I sat","I sat","did I sit"],"a":1,"d":"easy","e":"Inversion: had I sat."},{"q":"No sooner had we left ___ it started to rain.","o":["when","than","that","then"],"a":1,"d":"med","e":"No sooner … than."},{"q":"Little ___ that he was being watched.","o":["he knew","knew he","did he know","he did know"],"a":2,"d":"med","e":"Inversion: did he know."},{"q":"Only when she apologised ___ better.","o":["I felt","felt I","did I feel","I did feel"],"a":2,"d":"med","e":"Inversion: did I feel."},{"q":"Not until the next day ___ the news.","o":["they heard","heard they","did they hear","they did hear"],"a":2,"d":"med","e":"Inversion: did they hear."},{"q":"Hardly had I arrived ___ the trouble began.","o":["than","when","then","that"],"a":1,"d":"med","e":"Hardly … when."},{"q":"Find the mistake: 'Never I have eaten such good food.'","o":["I have → have I","eaten → ate","such → so","no mistake"],"a":0,"d":"hard","e":"Inversion: Never have I eaten."},{"q":"Complete: 'No sooner ___ the door ___ the alarm rang.'","o":["had he opened / when","he opened / than","had he opened / than","did he open / when"],"a":2,"d":"hard","e":"No sooner had he opened … than."},{"q":"Which is correct?","o":["Not only she sings, but she dances.","Not only does she sing, but she also dances.","Not only sings she, but she dances.","Not only she does sing, but dances."],"a":1,"d":"hard","e":"Not only does she sing, but she also dances."},{"q":"Complete: 'Only after he left ___ how rude he had been.'","o":["I realised","realised I","did I realise","I did realise"],"a":2,"d":"hard","e":"Inversion after ‘Only after’: did I realise."},{"q":"Rewrite with inversion: 'I had rarely felt so happy.'","o":["Rarely I had felt so happy.","Rarely had I felt so happy.","Rarely did I had felt so happy.","Rarely felt I so happy."],"a":1,"d":"hard","e":"Rarely had I felt so happy."}]},{"id":"g13","title":"Cleft sentences","lead":"Cleft (‘divided’) sentences split one idea into two clauses to emphasise a particular part. They are very common in speech for adding focus and contrast.","blocks":[{"h":"It-cleft: It + be + focus + that/who…","p":["Emphasise a person, thing, time or place."],"ex":["<b>It was</b> Tom <b>who</b> broke it. · <b>It was</b> in 2010 <b>that</b> we met."]},{"h":"What-cleft: What… + be + focus","p":["Emphasise the whole idea, often an action or need."],"ex":["<b>What I need is</b> a holiday. · <b>What he did was</b> (to) call the police."]},{"h":"The thing / the reason / the place","p":["Other openers add focus too."],"ex":["<b>The reason</b> (why) I’m late <b>is</b> the traffic. · <b>The place where</b> we stayed was lovely."]},{"h":"All (that)…","p":["<b>All</b> can mean ‘the only thing’."],"ex":["<b>All</b> I want <b>is</b> peace and quiet."]}],"tip":"In a What-cleft, the verb ‘be’ is <b>singular</b> even before a plural idea if ‘what’ is the subject: ‘<b>What I need is</b> answers’ (not ‘are’).","examples":["\"<b>It was</b> my sister <b>who</b> called, not me.\"","\"<b>It’s</b> your help <b>that</b> I need.\"","\"<b>What</b> surprised me <b>was</b> his honesty.\"","\"<b>What we did was</b> book another flight.\"","\"<b>The reason</b> I left <b>was</b> the noise.\"","\"<b>All</b> she wanted <b>was</b> the truth.\""],"q":[{"q":"___ Tom who broke the window.","o":["It was","There was","That was","He was"],"a":0,"d":"easy","e":"It-cleft: It was Tom who…"},{"q":"What I need ___ a long rest.","o":["are","is","be","was being"],"a":1,"d":"easy","e":"What-cleft, singular: is."},{"q":"It was in Paris ___ they got married.","o":["who","which","that","what"],"a":2,"d":"easy","e":"Place/time it-cleft: that."},{"q":"___ I want is some peace.","o":["All","It","That","Which"],"a":0,"d":"easy","e":"All = the only thing."},{"q":"It was Sarah ___ helped me.","o":["which","who","what","whom"],"a":1,"d":"easy","e":"Person → who."},{"q":"What he did ___ apologise.","o":["was","were","is being","be"],"a":0,"d":"med","e":"What-cleft: was (to) apologise."},{"q":"The reason ___ I called was to thank you.","o":["which","why","what","who"],"a":1,"d":"med","e":"The reason why."},{"q":"It's not the money ___ matters.","o":["who","what","that","which one"],"a":2,"d":"med","e":"It-cleft: that matters."},{"q":"What surprised everyone ___ his decision.","o":["was","were","are","be"],"a":0,"d":"med","e":"Singular ‘what’ → was."},{"q":"Choose the cleft emphasising the place.","o":["We stayed in a lovely hotel.","It was the hotel that we loved.","The place where we stayed was lovely.","A lovely place we stayed."],"a":2,"d":"med","e":"The place where… = focus on place."},{"q":"Find the mistake: 'What I want are answers.'","o":["are → is","want → wants","What → That","no mistake"],"a":0,"d":"hard","e":"‘What’ as subject → singular: is."},{"q":"Rewrite to emphasise 'John': 'John sent the email.'","o":["It was John who sent the email.","It was the email who John sent.","What John was the email.","John it was sent the email."],"a":0,"d":"hard","e":"It was John who sent the email."},{"q":"Complete: '___ we should do ___ tell the truth.'","o":["What / is","That / is","It / that","All what / is"],"a":0,"d":"hard","e":"What we should do is tell the truth."},{"q":"Which correctly emphasises the reason?","o":["The reason why he left was the noise.","The reason what he left was the noise.","It was the reason the noise left.","Why the reason he left noise."],"a":0,"d":"hard","e":"The reason why he left was the noise."},{"q":"Complete: '___ that I admire ___ her honesty.'","o":["It is the thing / is","The thing / is","What it is / are","That thing / are"],"a":1,"d":"hard","e":"The thing that I admire is her honesty."}]},{"id":"g14","title":"Linking & contrast","lead":"Linkers of contrast and concession join ideas that seem to conflict. The right choice depends on whether the linker is followed by a noun, an -ing form, or a full clause.","blocks":[{"h":"although / even though / though + clause","p":["Followed by a <b>subject + verb</b>."],"ex":["<b>Although</b> it was late, we kept working. · <b>Even though</b> she tried, she failed."]},{"h":"despite / in spite of + noun/-ing","p":["Followed by a <b>noun</b> or <b>-ing</b> form, not a clause. Add ‘the fact that’ to use a clause."],"ex":["<b>Despite</b> the rain, we went out. · <b>In spite of</b> being tired, he worked. · <b>Despite the fact that</b> it rained…"]},{"h":"however / nevertheless (adverbs)","p":["Link two sentences; usually start a new sentence with a comma after."],"ex":["It was expensive. <b>However</b>, we bought it."]},{"h":"whereas / while (contrast two facts)","p":["Show a direct contrast between two ideas."],"ex":["He likes tea, <b>whereas</b> she prefers coffee."]}],"tip":"Use ‘<b>although</b>’ before a clause and ‘<b>despite / in spite of</b>’ before a noun or -ing. ‘Despite it was raining’ is wrong → ‘Despite the rain’ or ‘Although it was raining’.","examples":["\"<b>Although</b> he was rich, he wasn’t happy.\"","\"<b>Despite</b> the traffic, we arrived on time.\"","\"<b>In spite of</b> feeling ill, she came.\"","\"The plan was risky. <b>Nevertheless</b>, it worked.\"","\"I love cities, <b>whereas</b> my brother prefers the countryside.\"","\"<b>Even though</b> it costs more, it’s worth it.\""],"q":[{"q":"___ it was raining, we went out.","o":["Despite","Although","In spite","However"],"a":1,"d":"easy","e":"+ clause → Although."},{"q":"___ the rain, we went out.","o":["Although","Even though","Despite","Whereas"],"a":2,"d":"easy","e":"+ noun → Despite."},{"q":"He likes coffee, ___ she prefers tea.","o":["despite","whereas","although","in spite of"],"a":1,"d":"easy","e":"Contrast two facts → whereas."},{"q":"It was expensive. ___, we bought it.","o":["Although","Despite","However","Whereas"],"a":2,"d":"easy","e":"Links two sentences → However."},{"q":"In spite ___ the cost, they travelled.","o":["of","to","for","at"],"a":0,"d":"easy","e":"in spite of + noun."},{"q":"___ being tired, she finished the race.","o":["Although","Despite","However","Whereas"],"a":1,"d":"med","e":"+ -ing → Despite being tired."},{"q":"___ he studied hard, he didn't pass.","o":["Despite","In spite of","Even though","However"],"a":2,"d":"med","e":"+ clause → Even though."},{"q":"Choose the linker + clause.","o":["Despite the noise","In spite of being late","Although it was late","Despite that"],"a":2,"d":"med","e":"Although + clause."},{"q":"The food was cold. ___, it tasted fine.","o":["Although","Despite","Nevertheless","Whereas"],"a":2,"d":"med","e":"Adverb linking sentences → Nevertheless."},{"q":"Despite ___ that it was late, they continued.","o":["the fact","fact","of the fact","a fact"],"a":0,"d":"med","e":"despite the fact that + clause."},{"q":"Find the mistake: 'Despite it was cold, we swam.'","o":["Despite → Although","cold → the cold","swam → swim","no mistake"],"a":0,"d":"hard","e":"Despite + noun/-ing; before a clause use ‘Although’."},{"q":"Complete: '___ his wealth, he was unhappy, ___ his brother, who had little, was content.'","o":["Although / despite","Despite / whereas","Whereas / although","However / despite"],"a":1,"d":"hard","e":"Despite + noun ‘his wealth’ + whereas (contrast)."},{"q":"Which is correct?","o":["In spite the danger, they climbed.","In spite of the danger, they climbed.","In spite of they were in danger, they climbed.","In spite that the danger, they climbed."],"a":1,"d":"hard","e":"in spite of + noun."},{"q":"Complete: '___ being cheaper, the second option is better, ___ the first looks nicer.'","o":["Although / whereas","Despite / whereas","Despite / however","Whereas / although"],"a":1,"d":"hard","e":"Despite + -ing ‘being cheaper’ + whereas (contrast)."},{"q":"Choose the sentence that links two contrasting sentences.","o":["Although it was hard, however we tried.","It was hard. However, we tried.","Despite however it was hard.","However it was hard we tried."],"a":1,"d":"hard","e":"However links two separate sentences."}]},{"id":"g15","title":"Articles & determiners: advanced","lead":"At B2, article choice depends on shades of meaning: specific vs. general, the use of ‘the’ with unique reference, and fixed patterns with quantifiers and abstract nouns.","blocks":[{"h":"the for unique / specified reference","p":["Use <b>the</b> when context makes the noun specific, after superlatives, and with ‘the only/same/first’."],"ex":["<b>The</b> book <b>you lent me</b> was great. · He’s <b>the</b> best. · It’s <b>the only</b> way."]},{"h":"zero article for general meaning","p":["Use no article for plural and uncountable nouns talking in general."],"ex":["<b>Happiness</b> matters. · <b>Children</b> learn fast. · I study <b>history</b>."]},{"h":"the + adjective (groups)","p":["<b>the + adjective</b> can mean a whole group of people."],"ex":["<b>The rich</b> get richer. · The government helps <b>the unemployed</b>."]},{"h":"determiners & ‘of’","p":["Use <b>of</b> with the/my/these: ‘most <b>of the</b> students’, ‘none <b>of</b> my friends’; without ‘of’ for general: ‘most students’."],"ex":["<b>Most of the</b> water was gone. · <b>Most</b> water is recycled here."]}],"tip":"Use ‘<b>the</b>’ when the noun is made specific by context (‘the book <b>you lent me</b>’), but <b>no article</b> for general statements with plurals/uncountables (‘<b>books</b> are useful’).","examples":["\"<b>The</b> information <b>you gave me</b> was helpful.\"","\"<b>Knowledge</b> is power.\"","\"She wants to help <b>the poor</b>.\"","\"<b>Most of the</b> guests had left.\"","\"He’s <b>the</b> first <b>to</b> arrive.\"","\"I don’t drink <b>coffee</b>.\""],"q":[{"q":"___ book you recommended was excellent.","o":["A","An","The","—"],"a":2,"d":"easy","e":"Specified by context → The book you recommended."},{"q":"___ is important for everyone. (general)","o":["The health","A health","Health","An health"],"a":2,"d":"easy","e":"General uncountable → no article."},{"q":"The government should help ___.","o":["a poor","the poor","poor","poors"],"a":1,"d":"easy","e":"the + adjective = the group: the poor."},{"q":"___ of the students passed.","o":["Most","Most of","The most","Much"],"a":1,"d":"easy","e":"+ the → Most of the students."},{"q":"She's ___ only person who knows.","o":["a","an","the","—"],"a":2,"d":"easy","e":"‘only’ → the only person."},{"q":"I love ___ in general. (plural, general)","o":["the dogs","dogs","a dogs","an dog"],"a":1,"d":"med","e":"General plural → no article: dogs."},{"q":"___ water in this bottle is dirty.","o":["A","An","The","—"],"a":2,"d":"med","e":"Specified ‘in this bottle’ → The water."},{"q":"___ students learn at different speeds. (general)","o":["The","A","Most","—"],"a":3,"d":"med","e":"General plural → no article."},{"q":"He was ___ first to finish.","o":["a","an","the","—"],"a":2,"d":"med","e":"Ordinal → the first."},{"q":"Choose the general statement.","o":["The life is hard.","Life is hard.","A life is hard.","An life is hard."],"a":1,"d":"med","e":"Abstract general → Life is hard."},{"q":"Find the mistake: 'I'm interested in the nature.'","o":["the nature → nature","interested → interesting","in → on","no mistake"],"a":0,"d":"hard","e":"General uncountable → nature (no article)."},{"q":"Complete: '___ rich should pay more tax, and ___ advice you gave was wise.'","o":["A / the","The / the","The / a","Rich / the"],"a":1,"d":"hard","e":"the rich (group) + the advice (specified)."},{"q":"Which is correct?","o":["Most of people work hard.","Most people work hard.","The most people work hard.","Most of the people hard work."],"a":1,"d":"hard","e":"General → Most people (no ‘of’ without the)."},{"q":"Complete: 'She studies ___ history of ___ art.'","o":["the / —","— / the","the / the","a / an"],"a":0,"d":"hard","e":"‘the history of art’: specified ‘the history’, general ‘art’."},{"q":"Choose the correct sentence.","o":["He gave me an useful advice.","He gave me a useful advice.","He gave me useful advice.","He gave me the useful advices."],"a":2,"d":"hard","e":"‘advice’ is uncountable → no article, no plural."}]}],"VOCAB":[{"id":"v1","title":"Work & business","words":[{"w":"colleague","pos":"n","ipa":"/ˈkɒliːɡ/","uz":"hamkasb","ru":"коллега","ex":"My colleagues are very supportive."},{"w":"deadline","pos":"n","ipa":"/ˈdedlaɪn/","uz":"muddat","ru":"крайний срок","ex":"We're working to a tight deadline."},{"w":"negotiate","pos":"v","ipa":"/nɪˈɡəʊʃieɪt/","uz":"muzokara olib bormoq","ru":"вести переговоры","ex":"They negotiated a better contract."},{"w":"profit","pos":"n","ipa":"/ˈprɒfɪt/","uz":"foyda","ru":"прибыль","ex":"The company made a large profit."},{"w":"client","pos":"n","ipa":"/ˈklaɪənt/","uz":"mijoz","ru":"клиент","ex":"We met an important client."},{"w":"redundant","pos":"adj","ipa":"/rɪˈdʌndənt/","uz":"ishdan boʻshatilgan","ru":"сокращённый","ex":"He was made redundant last year."},{"w":"invest","pos":"v","ipa":"/ɪnˈvest/","uz":"sarmoya kiritmoq","ru":"инвестировать","ex":"They invested in new technology."},{"w":"revenue","pos":"n","ipa":"/ˈrevənjuː/","uz":"daromad","ru":"выручка","ex":"Annual revenue rose by ten percent."},{"w":"entrepreneur","pos":"n","ipa":"/ˌɒntrəprəˈnɜː/","uz":"tadbirkor","ru":"предприниматель","ex":"She's a successful entrepreneur."},{"w":"stakeholder","pos":"n","ipa":"/ˈsteɪkhəʊldə/","uz":"manfaatdor tomon","ru":"заинтересованная сторона","ex":"All stakeholders were consulted."},{"w":"merge","pos":"v","ipa":"/mɜːdʒ/","uz":"birlashmoq","ru":"сливаться","ex":"The two firms merged."},{"w":"bankrupt","pos":"adj","ipa":"/ˈbæŋkrʌpt/","uz":"bankrot","ru":"банкрот","ex":"The business went bankrupt."},{"w":"shareholder","pos":"n","ipa":"/ˈʃeəhəʊldə/","uz":"aksiyador","ru":"акционер","ex":"Shareholders met to vote."},{"w":"productivity","pos":"n","ipa":"/ˌprɒdʌkˈtɪvəti/","uz":"unumdorlik","ru":"производительность","ex":"Productivity has improved."},{"w":"recruit","pos":"v","ipa":"/rɪˈkruːt/","uz":"ishga olmoq","ru":"набирать","ex":"They are recruiting new staff."},{"w":"strategy","pos":"n","ipa":"/ˈstrætədʒi/","uz":"strategiya","ru":"стратегия","ex":"We need a clear strategy."},{"w":"budget","pos":"n","ipa":"/ˈbʌdʒɪt/","uz":"byudjet","ru":"бюджет","ex":"The project went over budget."},{"w":"competitor","pos":"n","ipa":"/kəmˈpetɪtə/","uz":"raqobatchi","ru":"конкурент","ex":"Our main competitor cut prices."},{"w":"launch","pos":"v","ipa":"/lɔːntʃ/","uz":"ishga tushirmoq","ru":"запускать","ex":"They launched a new product."},{"w":"turnover","pos":"n","ipa":"/ˈtɜːnəʊvə/","uz":"aylanma","ru":"оборот","ex":"The shop has a high turnover."},{"w":"promote","pos":"v","ipa":"/prəˈməʊt/","uz":"lavozimini koʻtarmoq","ru":"продвигать","ex":"She was promoted to manager."},{"w":"sustainable","pos":"adj","ipa":"/səˈsteɪnəbl/","uz":"barqaror","ru":"устойчивый","ex":"We aim for sustainable growth."}],"q":[{"q":"To discuss something in order to reach an agreement is to ___.","o":["recruit","negotiate","merge","launch"],"a":1,"e":"Negotiate = bargain to agree."},{"q":"'Foyda' (money a business gains) in English is ___.","o":["budget","profit","revenue","turnover"],"a":1,"e":"‘Foyda’ = profit."},{"q":"A person who starts their own business is an ___.","o":["entrepreneur","employee","client","competitor"],"a":0,"e":"Entrepreneur = business founder."},{"q":"If a company can no longer pay its debts, it is ___.","o":["sustainable","redundant","bankrupt","promoted"],"a":2,"e":"Bankrupt = unable to pay debts."},{"q":"To lose your job because it is no longer needed is to be made ___.","o":["redundant","recruited","prom
