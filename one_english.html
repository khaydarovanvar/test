<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>One English — Ingliz tili, o'zbekcha tushuntirilgan</title>
<style>
:root{
  --green:#006040; --green-2:#00805a; --orange:#F09A12; --orange-2:#FFB13A;
  --bg:#f3f6f4; --surface:#ffffff; --surface-2:#eef3f0; --line:#dde6e1;
  --ink:#10261d; --ink-2:#43594f; --muted:#7c8d85;
  --good:#117a4b; --good-bg:#e3f6ec; --bad:#c0392b; --bad-bg:#fdecea;
  --shadow:0 1px 2px rgba(16,38,29,.05),0 8px 24px rgba(16,38,29,.06);
  --radius:18px;
}
[data-theme="dark"]{
  --bg:#0c1512; --surface:#13201b; --surface-2:#19271f; --line:#27382f;
  --ink:#eaf3ee; --ink-2:#b3c6bd; --muted:#7f968b;
  --green:#1fa978; --green-2:#27c08a; --orange:#FFB13A; --orange-2:#FFC25E;
  --good:#3ddc97; --good-bg:#0f2e22; --bad:#ff6b5e; --bad-bg:#34161a;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.35);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  background:var(--bg);color:var(--ink);line-height:1.5;-webkit-font-smoothing:antialiased}
.wrap{max-width:760px;margin:0 auto;padding:0 16px calc(86px + env(safe-area-inset-bottom))}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
.hidden{display:none!important}
.appbar{position:sticky;top:0;z-index:30;background:var(--bg);padding:calc(10px + env(safe-area-inset-top)) 16px 10px}
.appbar-in{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:-.02em}
.brand .logo{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;
  background:linear-gradient(135deg,var(--green),var(--green-2));color:#fff;font-size:15px;font-weight:900}
.brand small{display:block;font-weight:600;color:var(--muted);font-size:11px;margin-top:-2px}
.spacer{flex:1}
.icon-btn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;
  background:var(--surface);box-shadow:var(--shadow);font-size:18px}
.hero{margin:6px 0 18px}
.hero h1{font-size:26px;line-height:1.15;letter-spacing:-.03em;margin:0 0 6px}
.hero p{margin:0;color:var(--ink-2);font-size:14px}
.hero .accent{color:var(--orange)}
.eyebrow{font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:24px 6px 10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
.pad{padding:18px}
.row{display:flex;align-items:center;gap:14px;padding:15px 16px;width:100%;text-align:left;background:none;transition:background .15s}
.row:hover{background:var(--surface-2)}
.row + .row{border-top:1px solid var(--line)}
.row .meta{flex:1;min-width:0}
.row .meta b{display:block;font-size:15.5px;letter-spacing:-.01em;margin-bottom:2px}
.row .meta span{font-size:12.5px;color:var(--muted)}
.row .chev{color:var(--muted);font-size:20px;flex:none}
.ring{--p:0;width:46px;height:46px;flex:none;border-radius:50%;display:grid;place-items:center;
  background:conic-gradient(var(--green) calc(var(--p)*1%), var(--line) 0)}
.ring i{width:36px;height:36px;border-radius:50%;background:var(--surface);display:grid;place-items:center;
  font-style:normal;font-weight:800;font-size:12.5px;color:var(--muted)}
.ring.done{background:var(--green)}
.ring.done i{background:var(--green);color:#fff}
.pbar{height:6px;background:var(--surface-2);border-radius:99px;overflow:hidden;margin:4px 0 14px}
.pbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--green),var(--green-2));border-radius:99px;transition:width .35s}
.badge{font-size:11px;font-weight:800;letter-spacing:.03em;padding:5px 10px;border-radius:99px;text-transform:uppercase;background:var(--surface-2);color:var(--ink-2)}
.badge.lvl{background:var(--good-bg);color:var(--good)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 20px;border-radius:14px;
  font-weight:800;font-size:15px;background:var(--green);color:#fff;box-shadow:var(--shadow);transition:transform .1s}
.btn:active{transform:scale(.97)}
.btn.sec{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.btn.orange{background:var(--orange);color:#3a2503}
.btn.block{display:flex;width:100%}
.btn:disabled{opacity:.5;cursor:default}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stat{padding:14px;text-align:center}
.stat b{display:block;font-size:22px;letter-spacing:-.02em}
.stat span{font-size:12px;color:var(--muted)}
.tabs{display:flex;gap:8px;margin:14px 0;overflow-x:auto;padding-bottom:2px}
.tab{flex:none;padding:9px 16px;border-radius:99px;background:var(--surface);border:1px solid var(--line);font-weight:700;font-size:13.5px}
.tab.active{background:var(--green);color:#fff;border-color:transparent}
.backbar{display:flex;align-items:center;gap:6px;margin:8px 0 4px}
.backbtn{color:var(--ink-2);font-size:15px;font-weight:700;padding:6px 10px 6px 0;border-radius:8px}
/* lesson */
.ltitle{font-size:23px;font-weight:900;letter-spacing:-.01em;margin:2px 0 10px;line-height:1.25}
.lead{font-size:15px;color:var(--ink-2);margin:0 0 6px;line-height:1.6}
.lead-tr{font-size:13.5px;color:var(--muted);font-style:italic;margin:0 0 14px;line-height:1.55;border-inline-start:3px solid var(--orange);padding-inline-start:10px}
.sec-h{font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:20px 2px 8px}
.block{border:1px solid var(--line);border-radius:14px;background:var(--surface);padding:14px 16px;margin-bottom:12px}
.block h4{margin:0 0 8px;font-size:15px}
.block p{margin:0 0 8px;font-size:14px;color:var(--ink-2)}
.exline{background:var(--surface-2);border-radius:10px;padding:9px 12px;font-size:14px;margin-top:6px;display:flex;align-items:center;gap:8px}
.exline .txt{flex:1}
.spk{flex:none;width:30px;height:30px;border-radius:9px;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center;font-size:14px}
.tip{background:var(--good-bg);border-radius:14px;padding:13px 15px;font-size:14px;color:var(--good);margin:14px 0}
.mist{border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:10px}
.mist .x{background:var(--bad-bg);color:var(--bad);padding:10px 13px;font-size:13.5px}
.mist .v{background:var(--good-bg);color:var(--good);padding:10px 13px;font-size:13.5px}
/* quiz */
.qtext{font-size:17px;font-weight:700;line-height:1.5;margin:4px 0 14px}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:13px 15px;border-radius:14px;
  border:1.5px solid var(--line);background:var(--surface);font-size:15px;font-weight:600;margin-bottom:10px;transition:border-color .12s}
.opt:hover{border-color:var(--green-2)}
.opt .k{flex:none;width:26px;height:26px;border-radius:8px;background:var(--surface-2);display:grid;place-items:center;font-size:12.5px;font-weight:800;color:var(--muted)}
.opt.sel{border-color:var(--green);background:var(--good-bg)}
.opt.correct{border-color:var(--good);background:var(--good-bg)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.expl{border-radius:14px;padding:13px 15px;font-size:14px;margin:6px 0 12px}
.expl.ok{background:var(--good-bg);color:var(--good)}
.expl.no{background:var(--bad-bg);color:var(--bad)}
.expl .tr2{display:block;margin-top:6px;font-style:italic;opacity:.85}
/* vocab */
.word{padding:14px 16px;border-top:1px solid var(--line);display:flex;gap:12px;align-items:flex-start}
.word:first-child{border-top:none}
.word .w-main{flex:1}
.word .w-en{font-size:16.5px;font-weight:800}
.word .w-en small{font-weight:600;color:var(--muted);font-size:12px;margin-left:6px}
.word .ipa{color:var(--muted);font-size:13px;margin:1px 0 3px}
.word .w-tr{font-size:14px;color:var(--ink-2)}
.word .w-ex{font-size:13px;color:var(--muted);font-style:italic;margin-top:3px}
/* flashcard */
.fcard{min-height:230px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:26px 18px;gap:8px}
.fcard .big{font-size:30px;font-weight:900;letter-spacing:-.02em}
.fcard .ipa{color:var(--muted)}
.fcard .ans{font-size:20px;font-weight:700;color:var(--green)}
.fcard .ex{font-size:14px;color:var(--muted);font-style:italic}
.fbtns{display:flex;gap:10px;margin-top:14px}
/* speak */
.saytext{font-size:21px;font-weight:800;line-height:1.45;text-align:center;padding:10px 4px}
.mic{width:74px;height:74px;border-radius:50%;background:var(--orange);color:#3a2503;font-size:30px;display:grid;place-items:center;margin:14px auto;box-shadow:var(--shadow)}
.mic.rec{background:var(--bad);color:#fff;animation:pulse 1s infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
.heard{text-align:center;font-size:15px;min-height:24px}
.heard .hit{color:var(--good);font-weight:700}
.heard .miss{color:var(--bad);font-weight:700;text-decoration:line-through}
.score-big{text-align:center;font-size:34px;font-weight:900;letter-spacing:-.03em}
/* nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--surface);border-top:1px solid var(--line);
  padding:6px 8px calc(6px + env(safe-area-inset-bottom))}
.nav-in{max-width:760px;margin:0 auto;display:flex}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 2px;border-radius:12px;
  font-size:10.5px;font-weight:700;color:var(--muted);position:relative}
.nav button.active{color:var(--green)}
.nav .e{font-size:19px}
.nav .dot{position:absolute;top:4px;right:calc(50% - 18px);min-width:16px;height:16px;border-radius:99px;background:var(--orange);
  color:#3a2503;font-size:10px;font-weight:800;display:grid;place-items:center;padding:0 4px}
/* placement */
.pl-progress{font-size:12.5px;color:var(--muted);font-weight:700;margin-bottom:8px}
.result-lvl{font-size:52px;font-weight:900;letter-spacing:-.03em;text-align:center;color:var(--green)}
.center{text-align:center}
.lang-pick{display:flex;flex-direction:column;gap:10px}
.lang-pick button{padding:15px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);font-size:16px;font-weight:700;text-align:left;display:flex;gap:12px;align-items:center}
.lang-pick button:hover{border-color:var(--green)}
.done-check{color:var(--good);font-weight:800;font-size:13px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:92px;background:var(--ink);color:var(--bg);
  padding:10px 18px;border-radius:99px;font-size:13.5px;font-weight:700;z-index:60;box-shadow:var(--shadow);opacity:0;transition:opacity .25s}
.toast.show{opacity:1}
.notice{background:var(--surface-2);border-radius:12px;padding:11px 14px;font-size:13px;color:var(--ink-2);margin-top:12px}
</style>
</head>
<body>

<div class="appbar"><div class="appbar-in">

</div></div>

<div class="wrap">

</div></div>

<script id="engData">
window.ENG={"A1":{"GRAMMAR":[{"id":"g1","title":"The Alphabet & Sounds","lead":"English uses the Latin alphabet: 26 letters that combine to spell every word. Knowing the letter names and their basic sounds lets you spell your name, read new words, and follow spelling out loud.","alphabet":[{"L":"A","name":"ay","ip":"/eɪ/","word":"apple","snd":"/æ/"},{"L":"B","name":"bee","ip":"/biː/","word":"ball","snd":"/b/"},{"L":"C","name":"see","ip":"/siː/","word":"cat","snd":"/k/"},{"L":"D","name":"dee","ip":"/diː/","word":"dog","snd":"/d/"},{"L":"E","name":"ee","ip":"/iː/","word":"egg","snd":"/e/"},{"L":"F","name":"ef","ip":"/ef/","word":"fish","snd":"/f/"},{"L":"G","name":"jee","ip":"/dʒiː/","word":"girl","snd":"/ɡ/"},{"L":"H","name":"aitch","ip":"/eɪtʃ/","word":"hat","snd":"/h/"},{"L":"I","name":"eye","ip":"/aɪ/","word":"ink","snd":"/ɪ/"},{"L":"J","name":"jay","ip":"/dʒeɪ/","word":"jam","snd":"/dʒ/"},{"L":"K","name":"kay","ip":"/keɪ/","word":"kite","snd":"/k/"},{"L":"L","name":"el","ip":"/el/","word":"lion","snd":"/l/"},{"L":"M","name":"em","ip":"/em/","word":"moon","snd":"/m/"},{"L":"N","name":"en","ip":"/en/","word":"nose","snd":"/n/"},{"L":"O","name":"oh","ip":"/əʊ/","word":"orange","snd":"/ɒ/"},{"L":"P","name":"pee","ip":"/piː/","word":"pen","snd":"/p/"},{"L":"Q","name":"cue","ip":"/kjuː/","word":"queen","snd":"/kw/"},{"L":"R","name":"ar","ip":"/ɑː/","word":"red","snd":"/r/"},{"L":"S","name":"ess","ip":"/es/","word":"sun","snd":"/s/"},{"L":"T","name":"tee","ip":"/tiː/","word":"table","snd":"/t/"},{"L":"U","name":"you","ip":"/juː/","word":"umbrella","snd":"/ʌ/"},{"L":"V","name":"vee","ip":"/viː/","word":"van","snd":"/v/"},{"L":"W","name":"double-u","ip":"/ˈdʌbljuː/","word":"water","snd":"/w/"},{"L":"X","name":"ex","ip":"/eks/","word":"box","snd":"/ks/"},{"L":"Y","name":"why","ip":"/waɪ/","word":"yellow","snd":"/j/"},{"L":"Z","name":"zed","ip":"/zed/","word":"zoo","snd":"/z/"}],"blocks":[{"h":"26 letters, 2 groups","p":["There are <b>26 letters</b>. Five of them are <b>vowels</b>: A, E, I, O, U. The other 21 are <b>consonants</b> (B, C, D, F, G, …).","Sometimes <b>Y</b> acts like a vowel, as in <i>happy</i> or <i>my</i>."],"ex":["Vowels: <b>A E I O U</b>","Consonants: B C D F G H J K L M N P Q R S T V W X Y Z"]},{"h":"Name vs. sound","p":["Every letter has a <b>name</b> (how you say the letter) and a <b>sound</b> (how it works inside a word).","For example, the letter <b>B</b> is called <i>“bee”</i>, but its sound is /b/ as in <i>book</i>."],"ex":["C = <b>“see”</b> → sound /k/ in <i>cat</i>","H = <b>“aitch”</b> → sound /h/ in <i>hat</i>"]},{"h":"Spelling out loud","p":["We spell a word by saying each letter. Two of the same letter together are called <b>“double”</b>.","‘Hello’ = H – E – <b>double L</b> – O."],"ex":["“How do you spell <b>cat</b>?” — “C–A–T.”","‘Coffee’ = C–O–<b>double F</b>–double E… (F–F, E–E)"]},{"h":"Capital and small letters","p":["Each letter has a <b>capital</b> (A, B, C) and a <b>small</b> form (a, b, c).","We use capitals to <b>start a sentence</b>, for <b>names</b>, for the word <b>I</b>, and for countries, days and months."],"ex":["<b>I</b> live in <b>Tashkent</b>.","<b>M</b>onday, <b>J</b>uly, <b>A</b>nna"]}],"tip":"Be careful with vowels — the same vowel can sound different: the <b>a</b> in <i>cat</i> is not the <b>a</b> in <i>car</i>. Listen and repeat new words to learn their real sound.","examples":["<b>B</b>-<b>O</b>-<b>O</b>-<b>K</b> spells the word ‘book’.","‘Class’ has a <b>double S</b>: C-L-A-<b>S-S</b>.","My name is <b>A</b>nna — names start with a capital letter.","‘<b>Hour</b>’ begins with a silent H, so we say it like ‘our’.","The vowels in ‘<b>e</b>duc<b>a</b>t<b>io</b>n’ are e, a, i and o.","We say the letter <b>W</b> as ‘double-u’."],"q":[{"q":"Which of these is a vowel?","o":["B","E","K","T"],"a":1,"d":"easy","e":"The vowels are A, E, I, O, U — so E is a vowel."},{"q":"How many letters are in the English alphabet?","o":["24","25","26","27"],"a":2,"d":"easy","e":"The alphabet has 26 letters."},{"q":"How do you spell 'dog'?","o":["D-O-G","D-A-G","T-O-G","D-O-K"],"a":0,"d":"easy","e":"‘Dog’ is spelled D-O-G."},{"q":"Which letter is a consonant?","o":["A","O","M","U"],"a":2,"d":"easy","e":"M is a consonant; A, O and U are vowels."},{"q":"The word 'sun' has how many letters?","o":["2","3","4","5"],"a":1,"d":"easy","e":"S-U-N = three letters."},{"q":"The 'LL' in 'ball' is called ___.","o":["two L","double L","big L","long L"],"a":1,"d":"med","e":"Two of the same letter together are called ‘double’."},{"q":"Which word begins with a vowel sound?","o":["table","apple","car","dog"],"a":1,"d":"med","e":"‘Apple’ begins with the vowel A."},{"q":"Choose the correct spelling.","o":["hapy","happy","happi","haapy"],"a":1,"d":"med","e":"‘Happy’ has a double P: H-A-P-P-Y."},{"q":"Which word must start with a capital letter?","o":["book","monday","tashkent","table"],"a":2,"d":"med","e":"Names of cities (Tashkent) always take a capital letter."},{"q":"'Coffee' is spelled with ___.","o":["double F and double E","double F only","double E only","no double letters"],"a":0,"d":"med","e":"C-O-F-F-E-E has double F and double E."},{"q":"Which letter can act as a vowel in 'my'?","o":["M","Y","both","none"],"a":1,"d":"hard","e":"In ‘my’, Y works as a vowel."},{"q":"How do you spell 'school'?","o":["S-C-H-O-O-L","S-K-O-O-L","S-C-O-O-L","S-C-H-U-L"],"a":0,"d":"hard","e":"‘School’ is S-C-H-O-O-L, with a silent H and double O."},{"q":"Which sentence uses capitals correctly?","o":["i live in london.","I live in London.","I Live In London.","i Live in london."],"a":1,"d":"hard","e":"Capital I, capital for the city London, and a capital to start the sentence."},{"q":"The name of the letter 'H' is ___.","o":["haitch","aitch","hatch","ah"],"a":1,"d":"hard","e":"The letter H is called ‘aitch’."},{"q":"Which word has a silent letter?","o":["cat","know","sun","dog"],"a":1,"d":"hard","e":"In ‘know’, the K is silent — we say /noʊ/."}]},{"id":"g2","title":"Verb to be","lead":"‘Be’ is the most important verb in English. We use it to say who we are, how we feel, where things are, and to describe people and objects. It has three present forms: am, is, are.","blocks":[{"h":"The three forms","p":["Use <b>am</b> with <i>I</i>, <b>is</b> with <i>he / she / it</i>, and <b>are</b> with <i>you / we / they</i>."],"ex":["I <b>am</b> a student. · She <b>is</b> happy. · They <b>are</b> at home."]},{"h":"Short forms (contractions)","p":["In speaking and informal writing we join the pronoun and ‘be’: I’m, you’re, he’s, she’s, it’s, we’re, they’re."],"ex":["<b>I’m</b> tired. · <b>He’s</b> from Italy. · <b>They’re</b> teachers."]},{"h":"Negatives","p":["Add <b>not</b> after ‘be’. Short forms: isn’t (= is not), aren’t (= are not). ‘am not’ has no short form."],"ex":["She <b>is not / isn’t</b> here. · We <b>are not / aren’t</b> ready. · I <b>am not</b> cold."]},{"h":"Questions and short answers","p":["To make a question, put ‘be’ <b>before</b> the subject. For wh‑questions, the wh‑word goes first."],"ex":["<b>Are</b> you a student? — Yes, I am. / No, I’m not.","<b>Where is</b> she? — She’s at school."]}],"tip":"Don’t confuse <b>it’s</b> (= it is) with <b>its</b> (possessive). ‘It’s cold’ = it is cold. ‘The dog likes its food’ = the food belonging to it.","examples":["<b>I am</b> from Spain. (I’m from Spain.)","<b>She is</b> a nurse. (She’s a nurse.)","<b>They are</b> in the garden. (They’re in the garden.)","<b>Is he</b> your brother? — Yes, he <b>is</b>.","We <b>aren’t</b> ready yet.","<b>It’s</b> a cold morning. (It is)"],"q":[{"q":"I ___ a student.","o":["is","am","are","be"],"a":1,"d":"easy","e":"With ‘I’ we use ‘am’."},{"q":"She ___ from Tashkent.","o":["am","are","is","be"],"a":2,"d":"easy","e":"With he/she/it we use ‘is’."},{"q":"We ___ friends.","o":["is","am","are","be"],"a":2,"d":"easy","e":"With we/you/they we use ‘are’."},{"q":"The short form of 'he is' is ___.","o":["he's","hes","he're","his"],"a":0,"d":"easy","e":"‘he is’ = ‘he’s’."},{"q":"They ___ at home.","o":["is","are","am","be"],"a":1,"d":"easy","e":"With ‘they’ we use ‘are’."},{"q":"___ you a teacher?","o":["Is","Am","Are","Be"],"a":2,"d":"med","e":"With ‘you’ we use ‘are’, and it comes first in a question."},{"q":"He ___ happy today.","o":["isn't","aren't","amn't","not is"],"a":0,"d":"med","e":"‘is not’ = ‘isn’t’."},{"q":"Choose the correct negative: 'We ___ ready.'","o":["isn't","aren't","not are","am not"],"a":1,"d":"med","e":"With ‘we’ the negative is ‘aren’t’."},{"q":"'___ she your sister?' — 'Yes, she ___.'","o":["Is / is","Are / are","Is / are","Am / is"],"a":0,"d":"med","e":"Question ‘Is she…?’ and short answer ‘Yes, she is.’"},{"q":"It ___ a beautiful day.","o":["am","are","is","be"],"a":2,"d":"med","e":"With ‘it’ we use ‘is’."},{"q":"Which sentence is correct?","o":["I amn't tired.","I not am tired.","I'm not tired.","I am not't tired."],"a":2,"d":"hard","e":"‘am not’ has no contraction; we say ‘I’m not’."},{"q":"'Where ___ your parents?'","o":["is","am","are","be"],"a":2,"d":"hard","e":"‘parents’ is plural → ‘are’."},{"q":"Complete: 'My name ___ Anna and I ___ ten.'","o":["is / am","am / is","are / am","is / are"],"a":0,"d":"hard","e":"‘name is’ (it) and ‘I am’."},{"q":"Choose the correct short answer: 'Are they students?'","o":["Yes, they're.","Yes, they are.","Yes, they is.","Yes, they am."],"a":1,"d":"hard","e":"In short answers we don’t contract: ‘Yes, they are.’"},{"q":"Find the mistake: 'She are my best friend.'","o":["are → is","She → Her","friend → friends","no mistake"],"a":0,"d":"hard","e":"With ‘she’ we use ‘is’: She is my best friend."}]},{"id":"g3","title":"Pronouns & possessives","lead":"Pronouns replace nouns so we don’t repeat names. Possessive words show who something belongs to. Getting these right makes your English sound natural.","blocks":[{"h":"Subject pronouns","p":["These do the action and usually come before the verb: <b>I, you, he, she, it, we, they</b>."],"ex":["<b>He</b> plays football. · <b>We</b> live here."]},{"h":"Object pronouns","p":["These receive the action and come after the verb or a preposition: <b>me, you, him, her, it, us, them</b>."],"ex":["She loves <b>me</b>. · Give the book to <b>him</b>. · I can see <b>them</b>."]},{"h":"Possessive adjectives","p":["These go <b>before a noun</b> to show owner: <b>my, your, his, her, its, our, their</b>."],"ex":["This is <b>my</b> bag. · <b>Their</b> house is big."]},{"h":"Possessive pronouns & 's","p":["Possessive pronouns stand <b>alone</b>: mine, yours, his, hers, ours, theirs. We also add <b>’s</b> to a name to show belonging."],"ex":["This book is <b>mine</b>. · That’s <b>Anna’s</b> pen (= the pen of Anna)."]}],"tip":"‘Their’ (owner), ‘there’ (place) and ‘they’re’ (= they are) sound the same but are different words. ‘Their car is over there, and they’re late.’","examples":["This is <b>my</b> book and that one is <b>yours</b>.","Can you help <b>me</b>, please?","<b>We</b> like <b>them</b>, and <b>they</b> like <b>us</b>.","<b>Her</b> bag is blue; <b>his</b> is black.","That car is <b>ours</b>, not <b>theirs</b>.","This is <b>Tom’s</b> pen (the pen of Tom)."],"q":[{"q":"___ play tennis every Sunday. (the speaker + friends)","o":["Us","We","Our","They"],"a":1,"d":"easy","e":"Subject pronoun for the group with the speaker is ‘We’."},{"q":"This is ___ book. (it belongs to me)","o":["I","me","my","mine"],"a":2,"d":"easy","e":"Before a noun we use the possessive adjective ‘my’."},{"q":"I can see ___. (he)","o":["he","him","his","himself"],"a":1,"d":"easy","e":"After the verb we use the object pronoun ‘him’."},{"q":"That car is ___. (it belongs to us)","o":["our","us","ours","we"],"a":2,"d":"easy","e":"Standing alone, we use the possessive pronoun ‘ours’."},{"q":"___ is a doctor. (female)","o":["Her","She","Hers","Him"],"a":1,"d":"easy","e":"Subject pronoun for a female is ‘She’."},{"q":"The dog likes ___ food. (belonging to the dog)","o":["it's","its","it","his"],"a":1,"d":"med","e":"‘Its’ (no apostrophe) shows possession."},{"q":"Give the keys to ___. (we)","o":["we","our","us","ours"],"a":2,"d":"med","e":"After a preposition we use the object pronoun ‘us’."},{"q":"This pen is ___. (it belongs to you)","o":["your","you","yours","you're"],"a":2,"d":"med","e":"Standing alone we use the possessive pronoun ‘yours’."},{"q":"___ parents are very kind. (they)","o":["Them","Their","They're","There"],"a":1,"d":"med","e":"Before a noun we use ‘their’."},{"q":"Whose bag is this? It's ___.","o":["Anna","Anna's","Annas","of Anna"],"a":1,"d":"med","e":"We add ’s to show possession: Anna’s."},{"q":"Choose the correct sentence.","o":["Me like coffee.","I like coffee.","My like coffee.","Mine like coffee."],"a":1,"d":"hard","e":"The subject is ‘I’: I like coffee."},{"q":"Complete: 'She gave ___ book to ___.'","o":["her / I","hers / me","her / me","she / me"],"a":2,"d":"hard","e":"‘her book’ (possessive adjective) and ‘to me’ (object pronoun)."},{"q":"Which uses 'theirs' correctly?","o":["Theirs house is big.","This house is theirs.","Theirs is big house.","That is theirs car."],"a":1,"d":"hard","e":"‘theirs’ stands alone: This house is theirs."},{"q":"Find the mistake: 'Its a beautiful day.'","o":["Its → It's","a → an","day → days","no mistake"],"a":0,"d":"hard","e":"Here we need ‘It’s’ (= it is), not the possessive ‘its’."},{"q":"Complete: 'My brother and ___ are at school.' (I)","o":["me","I","mine","my"],"a":1,"d":"hard","e":"As part of the subject we use ‘I’: My brother and I."}]},{"id":"g4","title":"Articles & nouns","lead":"Articles (a, an, the) are small words before nouns. Choosing the right one — and knowing how to make plurals — is essential for clear, correct English.","blocks":[{"h":"a / an — one, not specific","p":["Use <b>a</b> before a consonant <b>sound</b> and <b>an</b> before a vowel <b>sound</b>. We use them for singular things mentioned for the first time."],"ex":["<b>a</b> book · <b>a</b> university (‘yoo’ sound)","<b>an</b> apple · <b>an</b> hour (silent h)"]},{"h":"the — specific / already known","p":["Use <b>the</b> when both speaker and listener know which one, or there is only one."],"ex":["I bought <b>a</b> cake. <b>The</b> cake is delicious.","<b>The</b> sun is hot."]},{"h":"Regular plurals","p":["Most nouns add <b>-s</b>. After -s, -ss, -ch, -sh, -x we add <b>-es</b>. A consonant + y becomes <b>-ies</b>."],"ex":["book → book<b>s</b> · box → box<b>es</b> · baby → bab<b>ies</b>"]},{"h":"Irregular plurals & uncountables","p":["Some plurals are irregular. Some nouns are <b>uncountable</b> (no plural, no a/an): water, rice, money, information."],"ex":["man → men · woman → women · child → children · foot → feet","I need <b>some water</b> (not ‘a water’)."]}],"tip":"Choose a/an by the <b>sound</b>, not the letter. ‘an MP’ (em-sound) is correct; ‘a university’ (yoo-sound) is correct even though it starts with a vowel.","examples":["I ate <b>an</b> apple and <b>a</b> banana.","There is <b>a</b> dog in <b>the</b> garden. <b>The</b> dog is friendly.","one box → two box<b>es</b>; one baby → two bab<b>ies</b>.","<b>The</b> moon is bright tonight. (only one moon)","I need <b>some</b> water — not ‘a water’.","one child → three child<b>ren</b> (irregular)."],"q":[{"q":"I have ___ apple.","o":["a","an","the","-"],"a":1,"d":"easy","e":"‘Apple’ starts with a vowel sound, so ‘an’."},{"q":"She is reading ___ book.","o":["a","an","-","of"],"a":0,"d":"easy","e":"‘Book’ starts with a consonant sound, so ‘a’."},{"q":"The plural of 'cat' is ___.","o":["cates","cats","caties","cat"],"a":1,"d":"easy","e":"Most nouns just add -s: cats."},{"q":"The plural of 'box' is ___.","o":["boxs","boxes","boxies","box"],"a":1,"d":"easy","e":"After -x we add -es: boxes."},{"q":"___ sun is very bright today.","o":["A","An","The","-"],"a":2,"d":"easy","e":"There is only one sun, so we use ‘the’."},{"q":"The plural of 'baby' is ___.","o":["babys","babies","babyes","baby"],"a":1,"d":"med","e":"Consonant + y → -ies: babies."},{"q":"I'd like ___ orange and ___ banana.","o":["a / an","an / a","an / an","a / a"],"a":1,"d":"med","e":"‘an orange’ (vowel sound), ‘a banana’ (consonant sound)."},{"q":"Which noun is uncountable?","o":["apple","chair","water","book"],"a":2,"d":"med","e":"‘Water’ is uncountable — no plural, no a/an."},{"q":"The plural of 'man' is ___.","o":["mans","mens","men","manes"],"a":2,"d":"med","e":"‘man’ is irregular: men."},{"q":"I saw a film. ___ film was great.","o":["A","An","The","-"],"a":2,"d":"med","e":"The film is now known, so we use ‘the’."},{"q":"Choose the correct article: '___ hour.'","o":["a","an","the only","one of"],"a":1,"d":"hard","e":"‘Hour’ has a silent h (vowel sound), so ‘an hour’."},{"q":"Which is correct?","o":["a university","an university","the a university","an universities"],"a":0,"d":"hard","e":"‘University’ starts with a ‘yoo’ sound, so ‘a university’."},{"q":"The plural of 'child' is ___.","o":["childs","childes","children","childrens"],"a":2,"d":"hard","e":"‘child’ is irregular: children."},{"q":"Find the mistake: 'I need a money.'","o":["a → an","money → moneys","a money → money/some money","no mistake"],"a":2,"d":"hard","e":"‘Money’ is uncountable: ‘I need money / some money.’"},{"q":"Complete: 'There is ___ egg and ___ spoon on ___ table.'","o":["an / a / the","a / an / the","an / a / a","a / a / the"],"a":0,"d":"hard","e":"‘an egg’ (vowel), ‘a spoon’ (consonant), ‘the table’ (specific)."}]},{"id":"g5","title":"Demonstratives","lead":"This, that, these and those point to people or things. They tell us about number (one or many) and distance (near or far).","blocks":[{"h":"Near vs. far","p":["Use <b>this/these</b> for things <b>near</b> you, and <b>that/those</b> for things <b>far</b> from you."],"ex":["<b>This</b> is my phone (in my hand). · <b>That</b> is your car (over there)."]},{"h":"Singular vs. plural","p":["<b>This</b> and <b>that</b> are singular (one). <b>These</b> and <b>those</b> are plural (more than one)."],"ex":["<b>this</b> book → <b>these</b> books","<b>that</b> shoe → <b>those</b> shoes"]},{"h":"As pronouns and adjectives","p":["They can stand alone (a pronoun) or come before a noun (an adjective)."],"ex":["<b>This</b> is delicious. (alone)","<b>This</b> cake is delicious. (+ noun)"]},{"h":"Common phrases","p":["We use them on the phone and to introduce people."],"ex":["Hello, <b>this</b> is Anna. (on the phone)","<b>These</b> are my friends, Tom and Sam."]}],"tip":"Match number carefully: ‘these book’ is wrong. Say <b>this book</b> (one) or <b>these books</b> (many).","examples":["<b>This</b> phone (in my hand) is new.","<b>That</b> house (over there) is big.","<b>These</b> shoes are mine; <b>those</b> are yours.","Hello, <b>this</b> is Sara speaking. (on the phone)","<b>These</b> are my friends, Tom and Lucy.","<b>That</b> was a great film!"],"q":[{"q":"___ is my pen. (in my hand)","o":["This","These","Those","Them"],"a":0,"d":"easy","e":"Near + singular = ‘This’."},{"q":"___ are my shoes. (near me)","o":["This","That","These","Those"],"a":2,"d":"easy","e":"Near + plural = ‘These’."},{"q":"Look at ___ bird in the sky. (far)","o":["this","these","that","those"],"a":2,"d":"easy","e":"Far + singular = ‘that’."},{"q":"___ houses over there are new. (far)","o":["This","That","These","Those"],"a":3,"d":"easy","e":"Far + plural = ‘Those’."},{"q":"The plural of 'this' is ___.","o":["that","these","those","thises"],"a":1,"d":"easy","e":"this → these."},{"q":"___ apples here are fresh.","o":["This","That","These","Those"],"a":2,"d":"med","e":"Near + plural ‘apples’ = ‘These’."},{"q":"Choose: 'Is ___ your bag?' (the one near you)","o":["this","these","those","they"],"a":0,"d":"med","e":"Near + singular = ‘this’."},{"q":"On the phone: 'Hello, ___ is Sara.'","o":["that","this","these","those"],"a":1,"d":"med","e":"We say ‘this is …’ to introduce ourselves on the phone."},{"q":"The plural of 'that' is ___.","o":["these","those","thats","this"],"a":1,"d":"med","e":"that → those."},{"q":"___ are my parents. (introducing them)","o":["This","That","These","It"],"a":2,"d":"med","e":"Introducing two people (plural) = ‘These’."},{"q":"Which sentence is correct?","o":["These book is mine.","This books are mine.","These books are mine.","This book are mine."],"a":2,"d":"hard","e":"Plural ‘books’ needs ‘These … are’."},{"q":"Complete: '___ shoes are nicer than ___ ones over there.'","o":["This / that","These / those","Those / these","These / that"],"a":1,"d":"hard","e":"Near plural ‘These’ vs. far plural ‘those’."},{"q":"Find the mistake: 'Look at those car near us.'","o":["those → this/that","car → cars","near → far","no mistake"],"a":0,"d":"hard","e":"‘car’ is singular and near, so ‘this car’ (or far ‘that car’)."},{"q":"Choose the natural sentence.","o":["That is my friends.","Those are my friends.","These is my friends.","This are my friends."],"a":1,"d":"hard","e":"Plural ‘friends’ → ‘Those are’ (or ‘These are’)."},{"q":"'___ is delicious!' (the cake you are eating now)","o":["Those","These","This","That"],"a":2,"d":"hard","e":"One thing, near/now = ‘This’."}]},{"id":"g6","title":"Present simple","lead":"The present simple is the tense for facts, routines and habits — things that are generally true or happen regularly. It is the most common tense in everyday English.","blocks":[{"h":"When we use it","p":["For <b>routines</b> (every day), <b>facts</b> (always true) and <b>habits</b>."],"ex":["I <b>get up</b> at seven every day.","Water <b>boils</b> at 100°C."]},{"h":"The third-person -s","p":["With <b>he, she, it</b> we add <b>-s</b> to the verb. After -o, -ss, -ch, -sh, -x we add <b>-es</b>; consonant + y → <b>-ies</b>."],"ex":["I work → she work<b>s</b> · go → go<b>es</b> · study → stud<b>ies</b>"]},{"h":"Negatives","p":["Use <b>don’t</b> (I/you/we/they) and <b>doesn’t</b> (he/she/it) + the base verb (no -s)."],"ex":["They <b>don’t</b> eat meat. · He <b>doesn’t</b> like tea."]},{"h":"Questions & frequency","p":["Use <b>Do/Does</b> + subject + base verb. Adverbs of frequency (always, usually, often, sometimes, never) go <b>before</b> the main verb."],"ex":["<b>Do</b> you play chess? · <b>Does</b> she work here?","I <b>always</b> brush my teeth."]}],"tip":"After does/doesn’t, the verb has <b>no -s</b>: ‘She doesn’t <b>likes</b>’ is wrong → ‘She doesn’t <b>like</b>.’ The -s is already in ‘does’.","examples":["I <b>get up</b> at seven every day.","She <b>goes</b> to work by bus. (he/she/it + -s)","They <b>don’t eat</b> meat.","He <b>doesn’t like</b> coffee.","<b>Do</b> you <b>play</b> tennis? — Yes, I do.","We <b>always</b> have dinner at eight."],"q":[{"q":"He ___ to school every day.","o":["go","goes","going","went"],"a":1,"d":"easy","e":"With ‘he’ we add -s: goes."},{"q":"I ___ coffee every morning.","o":["drinks","drink","drinking","am drink"],"a":1,"d":"easy","e":"With ‘I’ we use the base verb: drink."},{"q":"They ___ football on Sundays.","o":["plays","play","playing","plaies"],"a":1,"d":"easy","e":"With ‘they’ we use the base verb: play."},{"q":"She ___ English very well.","o":["speak","speaks","speaking","speakes"],"a":1,"d":"easy","e":"With ‘she’ we add -s: speaks."},{"q":"We ___ in Tashkent.","o":["lives","live","living","lifes"],"a":1,"d":"easy","e":"With ‘we’ we use the base verb: live."},{"q":"She ___ like fish.","o":["don't","doesn't","isn't","not"],"a":1,"d":"med","e":"With ‘she’ the negative is ‘doesn’t’."},{"q":"The third-person form of 'study' is ___.","o":["studys","studyes","studies","study"],"a":2,"d":"med","e":"Consonant + y → -ies: studies."},{"q":"___ you like music?","o":["Does","Do","Are","Is"],"a":1,"d":"med","e":"With ‘you’ we use ‘Do’."},{"q":"Choose the correct sentence.","o":["I always eat breakfast.","I eat always breakfast.","Always I breakfast eat.","I eat breakfast always now."],"a":0,"d":"med","e":"The frequency adverb goes before the verb: I always eat."},{"q":"___ she work on Saturdays?","o":["Do","Does","Is","Are"],"a":1,"d":"med","e":"With ‘she’ we use ‘Does’."},{"q":"Negative of 'He plays tennis': ___","o":["He don't play tennis.","He doesn't plays tennis.","He doesn't play tennis.","He not play tennis."],"a":2,"d":"hard","e":"doesn’t + base verb (no -s): He doesn’t play."},{"q":"The third-person form of 'go' is ___.","o":["gos","goes","goies","going"],"a":1,"d":"hard","e":"After -o we add -es: goes."},{"q":"Find the mistake: 'Does she likes pizza?'","o":["Does → Do","likes → like","she → her","no mistake"],"a":1,"d":"hard","e":"After ‘does’ the verb has no -s: ‘Does she like pizza?’"},{"q":"Complete: 'My father ___ to work by bus, but I ___ to walk.'","o":["go / prefers","goes / prefer","goes / prefers","go / prefer"],"a":1,"d":"hard","e":"‘father goes’ (he) and ‘I prefer’."},{"q":"Which is correct?","o":["He never not eats meat.","He never eats meat.","He doesn't never eat meat.","He eats never meat."],"a":1,"d":"hard","e":"‘never’ is already negative and goes before the verb: He never eats meat."}]},{"id":"g7","title":"Present continuous","lead":"The present continuous describes actions happening now, at this moment, or around now (a temporary situation). It is formed with ‘be’ + verb-ing.","blocks":[{"h":"Form: am/is/are + -ing","p":["Use the right form of ‘be’ and add <b>-ing</b> to the main verb."],"ex":["I <b>am reading</b>. · She <b>is sleeping</b>. · They <b>are playing</b>."]},{"h":"-ing spelling rules","p":["Drop a final silent <b>-e</b> (make → making). Double the final consonant after a short stressed vowel (run → running). ‘ie’ → ‘y’ (lie → lying)."],"ex":["write → writing · sit → sitting · die → dying"]},{"h":"Now vs. routine","p":["Present simple = routines/facts. Present continuous = happening <b>now</b> or temporary."],"ex":["I <b>work</b> in a bank. (job) — I<b>’m working</b> from home today. (now)"]},{"h":"Negatives & questions","p":["Negative: add <b>not</b> after ‘be’. Question: put ‘be’ first."],"ex":["She <b>isn’t</b> listening. · <b>Are</b> you working?"]}],"tip":"Some verbs (like, want, know, love, need, understand) describe states, not actions. We don’t usually use them in the continuous: say ‘I <b>want</b> tea’, not ‘I am wanting tea’.","examples":["Listen! The baby <b>is crying</b>.","I <b>’m reading</b> a book right now.","They <b>are playing</b> in the park at the moment.","She <b>isn’t working</b> today.","<b>Are</b> you <b>watching</b> TV?","write → wri<b>ting</b>; run → ru<b>nning</b>; lie → l<b>ying</b>."],"q":[{"q":"Look! The baby ___ now.","o":["cries","is crying","cry","crying"],"a":1,"d":"easy","e":"‘now’ → present continuous: is crying."},{"q":"They ___ in the garden at the moment.","o":["play","plays","are playing","playing"],"a":2,"d":"easy","e":"‘at the moment’ → are playing."},{"q":"I ___ a book right now.","o":["read","am reading","reads","reading"],"a":1,"d":"easy","e":"‘right now’ → am reading."},{"q":"The -ing form of 'make' is ___.","o":["makeing","making","makking","makes"],"a":1,"d":"easy","e":"Drop the silent -e: making."},{"q":"She ___ to music now.","o":["listen","listens","is listening","listening"],"a":2,"d":"easy","e":"‘now’ → is listening."},{"q":"The -ing form of 'run' is ___.","o":["runing","running","runnning","runs"],"a":1,"d":"med","e":"Short stressed vowel → double the consonant: running."},{"q":"We ___ dinner at the moment.","o":["have","has","are having","having"],"a":2,"d":"med","e":"‘at the moment’ → are having."},{"q":"Choose the 'now' sentence.","o":["I read every day.","I am reading right now.","I read books.","I reads a book."],"a":1,"d":"med","e":"‘right now’ needs the continuous form."},{"q":"Negative: 'He ___ TV now.'","o":["isn't watching","doesn't watch","not watching","aren't watching"],"a":0,"d":"med","e":"Present continuous negative: isn’t watching."},{"q":"The -ing form of 'sit' is ___.","o":["siting","sitting","siteing","sits"],"a":1,"d":"med","e":"Short stressed vowel → double: sitting."},{"q":"Which sentence is correct?","o":["I am wanting a coffee.","I want a coffee.","I am want a coffee.","I wanting a coffee."],"a":1,"d":"hard","e":"‘want’ is a state verb — not used in the continuous: I want a coffee."},{"q":"Complete: 'Be quiet! The students ___ a test.'","o":["take","takes","are taking","taking"],"a":2,"d":"hard","e":"Action happening now → are taking."},{"q":"The -ing form of 'lie' is ___.","o":["lieing","lying","lieying","liing"],"a":1,"d":"hard","e":"‘ie’ → ‘y’: lying."},{"q":"Choose the correct question.","o":["Are you do your homework?","Do you doing your homework?","Are you doing your homework?","You are doing homework?"],"a":2,"d":"hard","e":"Continuous question: Are you doing…?"},{"q":"Find the mistake: 'She is read a book now.'","o":["is → are","read → reading","now → today","no mistake"],"a":1,"d":"hard","e":"After ‘is’ we need the -ing form: She is reading."}]},{"id":"g8","title":"Have got · there is/are","lead":"‘Have got’ talks about possession, family and features. ‘There is / there are’ says that something exists or is present. Both are very common in everyday speech.","blocks":[{"h":"have got = have (possession)","p":["Use <b>have got</b> (I/you/we/they) and <b>has got</b> (he/she/it). Short forms: I’ve got, she’s got."],"ex":["I<b>’ve got</b> two brothers. · She<b>’s got</b> a new phone."]},{"h":"Negatives & questions with have got","p":["Negative: <b>haven’t/hasn’t got</b>. Question: <b>Have/Has</b> + subject + got?"],"ex":["We <b>haven’t got</b> a car. · <b>Has</b> he <b>got</b> a sister?"]},{"h":"there is / there are","p":["Use <b>there is</b> (+ singular / uncountable) and <b>there are</b> (+ plural) to say something exists."],"ex":["<b>There is</b> a book on the table. · <b>There are</b> five chairs."]},{"h":"Negatives & questions","p":["Negative: there isn’t / there aren’t. Question: Is there…? / Are there…?"],"ex":["<b>There isn’t</b> any milk. · <b>Are there</b> any shops near here?"]}],"tip":"Don’t mix them up: use <b>have got</b> for an owner (‘I have got a dog’) and <b>there is/are</b> for existence (‘There is a dog in the garden’).","examples":["I <b>’ve got</b> two sisters.","She <b>’s got</b> a new phone.","We <b>haven’t got</b> a car.","<b>Has</b> he <b>got</b> a bike?","<b>There is</b> a book on the desk.","<b>There are</b> five chairs in the room."],"q":[{"q":"I ___ a new bag.","o":["has got","have got","got have","am got"],"a":1,"d":"easy","e":"With ‘I’ we use ‘have got’."},{"q":"She ___ two cats.","o":["have got","has got","got","is got"],"a":1,"d":"easy","e":"With ‘she’ we use ‘has got’."},{"q":"___ a pen on the desk.","o":["There is","There are","There be","Is there"],"a":0,"d":"easy","e":"Singular ‘a pen’ → There is."},{"q":"___ three windows in the room.","o":["There is","There are","There be","There am"],"a":1,"d":"easy","e":"Plural ‘windows’ → There are."},{"q":"Short form of 'I have got' is ___.","o":["I's got","I've got","I got's","Ive's"],"a":1,"d":"easy","e":"‘I have’ = ‘I’ve’ → I’ve got."},{"q":"We ___ a garden.","o":["haven't got","hasn't got","not got","don't got"],"a":0,"d":"med","e":"With ‘we’ the negative is ‘haven’t got’."},{"q":"___ any milk in the fridge?","o":["Are there","Is there","There is","Have there"],"a":1,"d":"med","e":"‘milk’ is uncountable (singular) → Is there."},{"q":"___ he got a bicycle?","o":["Have","Has","Is","Does"],"a":1,"d":"med","e":"With ‘he’ the question is ‘Has he got…?’."},{"q":"There ___ a lot of people here.","o":["is","are","be","has"],"a":1,"d":"med","e":"‘people’ is plural → are."},{"q":"Choose the correct negative: 'There ___ any chairs.'","o":["isn't","aren't","not are","hasn't"],"a":1,"d":"med","e":"Plural ‘chairs’ → There aren’t."},{"q":"Which sentence is correct?","o":["She have got a dog.","She has got a dog.","She has a got dog.","She got has a dog."],"a":1,"d":"hard","e":"With ‘she’: She has got a dog."},{"q":"Complete: '___ a problem, but ___ no easy answers.'","o":["There is / there are","There are / there is","There is / there is","There are / there are"],"a":0,"d":"hard","e":"‘a problem’ (singular) → there is; ‘answers’ (plural) → there are."},{"q":"Find the mistake: 'There is five students in the class.'","o":["is → are","five → fives","students → student","no mistake"],"a":0,"d":"hard","e":"Plural ‘five students’ needs ‘There are’."},{"q":"Which question is correct?","o":["Has you got a car?","Have you got a car?","Do you got a car?","Are you got a car?"],"a":1,"d":"hard","e":"With ‘you’: Have you got a car?"},{"q":"Complete: 'My sister ___ long hair, and ___ a beautiful park near her house.'","o":["has got / there is","have got / there are","has got / there are","there is / has got"],"a":0,"d":"hard","e":"‘sister has got’ (possession) + ‘there is a park’ (existence, singular)."}]},{"id":"g9","title":"Modals: can/can't · imperatives","lead":"‘Can’ expresses ability, possibility and permission. ‘Can’t’ is its negative. The imperative gives instructions, orders and advice. Both are short and very useful.","blocks":[{"h":"can for ability","p":["<b>Can</b> + base verb means ‘is able to’. It never changes form (no -s, no ‘to’)."],"ex":["I <b>can swim</b>. · She <b>can speak</b> three languages."]},{"h":"can for permission/requests","p":["We also use <b>can</b> to ask for and give permission."],"ex":["<b>Can</b> I open the window? · You <b>can</b> go now."]},{"h":"can't (negative)","p":["The negative is <b>can’t</b> (cannot). Same form for all subjects."],"ex":["He <b>can’t</b> drive. · We <b>can’t</b> hear you."]},{"h":"Imperatives","p":["Use the <b>base verb</b> to give an instruction. Add <b>don’t</b> for negative imperatives. We often add ‘please’ to be polite."],"ex":["<b>Open</b> your books. · <b>Don’t</b> run! · <b>Please</b> sit down."]}],"tip":"After ‘can’ never use ‘to’: ‘I can <b>to</b> swim’ is wrong → ‘I can swim.’ And ‘can’ has no -s with he/she/it: ‘She can swim’, not ‘She cans’.","examples":["I <b>can swim</b>, but I <b>can’t</b> drive.","<b>Can</b> I open the window, please?","She <b>can speak</b> three languages.","<b>Open</b> your books. (instruction)","<b>Don’t</b> run in the corridor!","Please <b>sit down</b>."],"q":[{"q":"I ___ swim very well.","o":["can","cans","am can","can to"],"a":0,"d":"easy","e":"‘can’ + base verb, no -s, no ‘to’."},{"q":"He ___ drive. He has no licence.","o":["can","can't","doesn't can","not can"],"a":1,"d":"easy","e":"Negative ability = can’t."},{"q":"___ I borrow your pen?","o":["Can","Cans","Do can","Am"],"a":0,"d":"easy","e":"Request for permission: ‘Can I…?’"},{"q":"___ your books, please. (instruction)","o":["Opening","Open","Opens","To open"],"a":1,"d":"easy","e":"Imperative uses the base verb: Open."},{"q":"She ___ speak French.","o":["can","cans","is can","can to"],"a":0,"d":"easy","e":"‘can’ never changes: She can speak."},{"q":"Negative imperative: '___ late!'","o":["Not be","Don't be","Be not","No be"],"a":1,"d":"med","e":"Negative imperative: Don’t be late!"},{"q":"We ___ hear the teacher. It's too noisy.","o":["can","can't","don't can","aren't can"],"a":1,"d":"med","e":"Negative ability: can’t hear."},{"q":"Choose the correct sentence.","o":["I can to play guitar.","I can play guitar.","I can playing guitar.","I cans play guitar."],"a":1,"d":"med","e":"can + base verb: I can play."},{"q":"'___ quiet, please.' (instruction)","o":["Are","Be","Being","To be"],"a":1,"d":"med","e":"Imperative of ‘be’ is just ‘Be’."},{"q":"They ___ come to the party. They're busy.","o":["can","can't","cannot to","don't can"],"a":1,"d":"med","e":"Negative ability/possibility: can’t come."},{"q":"Which is correct?","o":["She cans cook.","She can cooks.","She can cook.","She is can cook."],"a":2,"d":"hard","e":"‘can’ takes no -s and the verb stays base: She can cook."},{"q":"Make it negative: 'Touch the wall.'","o":["No touch the wall.","Don't touch the wall.","Not touch the wall.","Don't touching the wall."],"a":1,"d":"hard","e":"Negative imperative: Don’t + base verb."},{"q":"Find the mistake: 'Can you to help me?'","o":["Can → Do","you → your","to help → help","no mistake"],"a":2,"d":"hard","e":"After ‘can’ we don’t use ‘to’: Can you help me?"},{"q":"Complete: 'You ___ smoke here, but you ___ sit outside.'","o":["can / can't","can't / can","can / can","can't / can't"],"a":1,"d":"hard","e":"No permission inside (can’t), permission outside (can)."},{"q":"Which gives polite advice correctly?","o":["You please sit.","Sit down, please.","Please to sit down.","Sitting down please."],"a":1,"d":"hard","e":"Imperative + please: ‘Sit down, please.’"}]},{"id":"g10","title":"Adjectives","lead":"Adjectives describe nouns — they tell us what people, places and things are like. Knowing where to put them and learning common opposites makes your descriptions clear.","blocks":[{"h":"Position","p":["An adjective usually goes <b>before the noun</b>, or <b>after the verb ‘be’</b>. It never changes for plural."],"ex":["a <b>red</b> car · The car is <b>red</b>. · two <b>red</b> cars (not ‘reds’)"]},{"h":"Common opposites","p":["Learn adjectives in pairs."],"ex":["big ↔ small · hot ↔ cold · old ↔ new/young · happy ↔ sad · easy ↔ difficult"]},{"h":"Order of adjectives (basic)","p":["When two adjectives describe a noun, opinion comes before fact: a <b>nice big</b> house (opinion + size)."],"ex":["a <b>beautiful old</b> city · a <b>small black</b> bag"]},{"h":"Very / really","p":["Use <b>very</b> or <b>really</b> before an adjective to make it stronger."],"ex":["It’s <b>very</b> cold. · She’s <b>really</b> kind."]}],"tip":"Adjectives never take a plural -s in English: say ‘three <b>big</b> dogs’, not ‘three bigs dogs’.","examples":["a <b>red</b> car → two <b>red</b> cars (never ‘reds’)","The flowers are <b>beautiful</b>.","big ↔ small · hot ↔ cold · easy ↔ difficult","a <b>small black</b> bag (size before colour)","It’s <b>very</b> cold today.","a <b>nice big</b> house (opinion before size)"],"q":[{"q":"Choose the correct order.","o":["a car red","red a car","a red car","car a red"],"a":2,"d":"easy","e":"Adjective before noun: a red car."},{"q":"The opposite of 'big' is ___.","o":["large","small","tall","wide"],"a":1,"d":"easy","e":"big ↔ small."},{"q":"The flowers are ___.","o":["beautifuls","beautiful","beautify","a beautiful"],"a":1,"d":"easy","e":"Adjective after ‘be’, no plural -s: are beautiful."},{"q":"The opposite of 'hot' is ___.","o":["warm","cool","cold","dry"],"a":2,"d":"easy","e":"hot ↔ cold."},{"q":"It's a ___ day.","o":["sun","sunny","suns","sunnies"],"a":1,"d":"easy","e":"We need an adjective before ‘day’: a sunny day."},{"q":"Choose the correct sentence.","o":["They are happys.","They are happy.","They happy are.","They are a happy."],"a":1,"d":"med","e":"Adjective after ‘be’, no -s: are happy."},{"q":"The opposite of 'difficult' is ___.","o":["hard","easy","heavy","long"],"a":1,"d":"med","e":"difficult ↔ easy."},{"q":"Which order is correct?","o":["a black small bag","a small black bag","black a small bag","small a black bag"],"a":1,"d":"med","e":"Size before colour: a small black bag."},{"q":"She has ___ eyes.","o":["blue","blues","a blue","blueing"],"a":0,"d":"med","e":"Adjective stays singular: blue eyes."},{"q":"Make it stronger: 'The film was ___ good.'","o":["very","much","many","more very"],"a":0,"d":"med","e":"‘very’ + adjective: very good."},{"q":"Find the mistake: 'I have two reds pens.'","o":["two → second","reds → red","pens → pen","no mistake"],"a":1,"d":"hard","e":"Adjectives don’t take -s: two red pens."},{"q":"Choose the natural order.","o":["a nice big house","a big nice house","nice a big house","a house big nice"],"a":0,"d":"hard","e":"Opinion (nice) before size (big): a nice big house."},{"q":"Complete: 'My grandfather is ___, but he feels ___.'","o":["old / young","young / old","olds / young","old / youngs"],"a":0,"d":"hard","e":"old ↔ young; adjectives stay singular."},{"q":"Which sentence is correct?","o":["It is a interesting book.","It is an interesting book.","It is interesting a book.","It is a book interesting."],"a":1,"d":"hard","e":"‘interesting’ starts with a vowel sound → ‘an’, and the adjective goes before the noun."},{"q":"Choose the correct description.","o":["a expensive new phone","an new expensive phone","a new expensive phone","an expensive new phone"],"a":3,"d":"hard","e":"‘an’ (vowel sound) + opinion/fact order: an expensive new phone."}]},{"id":"g11","title":"Quantity: some / any","lead":"‘Some’ and ‘any’ talk about an amount that isn’t exact. Choosing between them depends on whether the sentence is positive, negative or a question — and on whether the noun can be counted.","blocks":[{"h":"Countable vs. uncountable","p":["Countable nouns have a plural (apple → apples). Uncountable nouns don’t (water, rice, money, bread)."],"ex":["three <b>apples</b> (countable) · some <b>water</b> (uncountable)"]},{"h":"some — positive sentences","p":["Use <b>some</b> in affirmative sentences with plural and uncountable nouns."],"ex":["I have <b>some</b> friends here. · There is <b>some</b> milk in the cup."]},{"h":"any — negatives & questions","p":["Use <b>any</b> in negatives and most questions."],"ex":["I don’t have <b>any</b> money. · Is there <b>any</b> sugar?"]},{"h":"some in offers/requests","p":["We use <b>some</b> (not any) in polite offers and requests, even though they are questions."],"ex":["Would you like <b>some</b> tea? · Can I have <b>some</b> water, please?"]}],"tip":"With uncountable nouns, don’t use a/an or a plural: say ‘<b>some bread</b>’, not ‘a bread’ or ‘breads’.","examples":["I have <b>some</b> apples.","There isn’t <b>any</b> milk.","Is there <b>any</b> bread?","Would you like <b>some</b> tea? (offer)","Can I have <b>some</b> water? (request)","We have <b>some</b> rice but we don’t have <b>any</b> eggs."],"q":[{"q":"I have ___ apples.","o":["any","some","a","an"],"a":1,"d":"easy","e":"Positive sentence → some."},{"q":"There isn't ___ juice.","o":["some","any","a","the some"],"a":1,"d":"easy","e":"Negative sentence → any."},{"q":"Is there ___ bread?","o":["some","a","any","an"],"a":2,"d":"easy","e":"Question → any."},{"q":"Which noun is uncountable?","o":["apple","egg","rice","banana"],"a":2,"d":"easy","e":"‘Rice’ is uncountable."},{"q":"We have ___ eggs in the fridge.","o":["any","a","some","an"],"a":2,"d":"easy","e":"Positive + plural → some."},{"q":"Would you like ___ coffee?","o":["any","some","a","an"],"a":1,"d":"med","e":"Polite offer uses ‘some’."},{"q":"He doesn't have ___ brothers.","o":["some","any","a","the"],"a":1,"d":"med","e":"Negative → any."},{"q":"Can I have ___ water, please?","o":["any","a","some","an"],"a":2,"d":"med","e":"Polite request uses ‘some’."},{"q":"Choose the correct sentence.","o":["I need a bread.","I need some bread.","I need breads.","I need an bread."],"a":1,"d":"med","e":"‘Bread’ is uncountable → some bread."},{"q":"There are ___ books on the shelf.","o":["any","a","some","much"],"a":2,"d":"med","e":"Positive + plural → some."},{"q":"Find the mistake: 'Do you have some questions?'","o":["some → any","Do → Are","have → has","no mistake"],"a":0,"d":"hard","e":"In a normal question we use ‘any’: Do you have any questions?"},{"q":"Complete: 'We have ___ rice but we don't have ___ vegetables.'","o":["any / some","some / any","some / some","any / any"],"a":1,"d":"hard","e":"Positive → some rice; negative → any vegetables."},{"q":"Which is correct?","o":["There aren't some chairs.","There aren't any chairs.","There isn't any chairs.","There are any chairs."],"a":1,"d":"hard","e":"Negative + plural → aren’t any."},{"q":"Choose the natural offer.","o":["Would you like any cake?","Do you want some help — yes or no?","Would you like some cake?","You like any cake?"],"a":2,"d":"hard","e":"Offers use ‘some’: Would you like some cake?"},{"q":"Complete: 'Is there ___ milk? — Yes, there's ___.'","o":["some / any","any / some","any / any","some / some"],"a":1,"d":"hard","e":"Question → any; positive answer → some."}]},{"id":"g12","title":"Prepositions","lead":"Prepositions are small words that show relationships of place and time. The most common are in, on, at, and a few movement words. Learn them in fixed phrases.","blocks":[{"h":"Place: in / on / at","p":["<b>in</b> = inside / areas (in a box, in Tashkent). <b>on</b> = a surface (on the table, on the wall). <b>at</b> = a point/place (at the door, at school)."],"ex":["The keys are <b>in</b> my bag. · The photo is <b>on</b> the wall. · I’m <b>at</b> home."]},{"h":"More place words","p":["<b>under</b> (below), <b>next to</b> (beside), <b>between</b> (in the middle of two), <b>behind</b>, <b>in front of</b>, <b>near</b>."],"ex":["The cat is <b>under</b> the chair. · The bank is <b>next to</b> the school."]},{"h":"Time: at / on / in","p":["<b>at</b> + clock time/night (at 7, at night). <b>on</b> + days/dates (on Monday). <b>in</b> + months/years/parts of day (in July, in the morning)."],"ex":["at 6 o’clock · on Friday · in 2026 · in the evening"]},{"h":"Fixed expressions","p":["Some phrases must be memorised."],"ex":["at home · at school · at work · in bed · on time · at the weekend"]}],"tip":"Time prepositions follow a pattern: <b>at</b> = small (clock time), <b>on</b> = medium (a day), <b>in</b> = large (month/year). Think small → big.","examples":["The book is <b>on</b> the table.","I live <b>in</b> Manchester.","The cat is <b>under</b> the chair.","We meet <b>on</b> Monday <b>at</b> 8 o’clock.","My birthday is <b>in</b> July.","The shop is <b>between</b> the bank and the café."],"q":[{"q":"The book is ___ the table.","o":["in","on","at","under"],"a":1,"d":"easy","e":"A surface → on the table."},{"q":"I live ___ Tashkent.","o":["on","at","in","by"],"a":2,"d":"easy","e":"Cities use ‘in’."},{"q":"The cat is ___ the chair. (below it)","o":["on","under","at","in"],"a":1,"d":"easy","e":"Below = under."},{"q":"We meet ___ Monday.","o":["in","at","on","by"],"a":2,"d":"easy","e":"Days use ‘on’: on Monday."},{"q":"School starts ___ 8 o'clock.","o":["in","on","at","by"],"a":2,"d":"easy","e":"Clock time uses ‘at’."},{"q":"The shop is ___ the bank and the café.","o":["between","on","under","at"],"a":0,"d":"med","e":"In the middle of two things = between."},{"q":"My birthday is ___ July.","o":["on","at","in","by"],"a":2,"d":"med","e":"Months use ‘in’: in July."},{"q":"She is ___ home now.","o":["in","on","at","to"],"a":2,"d":"med","e":"Fixed phrase: at home."},{"q":"The picture is ___ the wall.","o":["in","on","at","under"],"a":1,"d":"med","e":"A surface (wall) → on."},{"q":"The dog is ___ the door, waiting.","o":["in","on","at","under"],"a":2,"d":"med","e":"A point/place → at the door."},{"q":"Complete: 'I get up ___ 7 ___ the morning.'","o":["in / at","at / in","on / in","at / on"],"a":1,"d":"hard","e":"Clock time ‘at 7’, part of day ‘in the morning’."},{"q":"Which is correct?","o":["I'm on bed.","I'm at bed.","I'm in bed.","I'm to bed."],"a":2,"d":"hard","e":"Fixed phrase: in bed."},{"q":"Find the mistake: 'The bank is in front the school.'","o":["in → on","front → back","in front the → in front of the","no mistake"],"a":2,"d":"hard","e":"The phrase is ‘in front of’: in front of the school."},{"q":"Complete: 'See you ___ the weekend, ___ Saturday ___ 5 pm.'","o":["at / on / at","on / at / in","in / on / at","at / in / on"],"a":0,"d":"hard","e":"‘at the weekend’, ‘on Saturday’, ‘at 5 pm’."},{"q":"Choose the correct sentence.","o":["The ball is on the box. (inside it)","The keys are in the table.","She is at the kitchen.","The lamp is between two windows."],"a":3,"d":"hard","e":"‘between two windows’ is correct; the others mix up in/on/at."}]},{"id":"g13","title":"Question words","lead":"Question words (wh- words) ask for information. Each one asks about something different — a person, a place, a time, a reason. Knowing them lets you ask about everything around you.","blocks":[{"h":"The main wh- words","p":["<b>What</b> (thing), <b>Who</b> (person), <b>Where</b> (place), <b>When</b> (time), <b>Why</b> (reason), <b>How</b> (way/manner)."],"ex":["<b>What</b> is this? · <b>Who</b> is she? · <b>Where</b> do you live? · <b>Why</b> are you late?"]},{"h":"how many / how much","p":["<b>How many</b> + countable (how many books). <b>How much</b> + uncountable / price (how much water, how much is it)."],"ex":["<b>How many</b> students are there? · <b>How much</b> is this jacket?"]},{"h":"Word order with be","p":["wh- word + <b>be</b> + subject."],"ex":["<b>Where is</b> the station? · <b>Who are</b> they?"]},{"h":"Word order with do/does","p":["wh- word + <b>do/does</b> + subject + base verb."],"ex":["<b>What do</b> you want? · <b>Where does</b> she work?"]}],"tip":"Use <b>how many</b> for things you can count and <b>how much</b> for things you can’t (and for prices): ‘How many apples?’ but ‘How much money?’","examples":["<b>What</b> is your name?","<b>Where</b> do you live?","<b>Who</b> is that man?","<b>When</b> does the film start?","<b>How many</b> apples are there?","<b>How much</b> is this jacket?"],"q":[{"q":"___ is your name?","o":["Who","What","Where","When"],"a":1,"d":"easy","e":"We ask about a name (thing) with ‘What’."},{"q":"___ do you live?","o":["What","Who","Where","Why"],"a":2,"d":"easy","e":"Place → Where."},{"q":"___ is your teacher?","o":["What","Who","Where","When"],"a":1,"d":"easy","e":"Person → Who."},{"q":"___ is your birthday?","o":["Where","When","Who","How"],"a":1,"d":"easy","e":"Time/date → When."},{"q":"___ are you sad?","o":["What","Where","Why","Who"],"a":2,"d":"easy","e":"Reason → Why."},{"q":"___ apples are there?","o":["How much","How many","How","What"],"a":1,"d":"med","e":"Countable ‘apples’ → How many."},{"q":"___ is this bag?","o":["How many","How much","How","Who"],"a":1,"d":"med","e":"Price → How much."},{"q":"___ do you go to school?","o":["What","Who","Where","Which one"],"a":2,"d":"med","e":"Place → Where."},{"q":"___ old are you?","o":["What","How","Who","When"],"a":1,"d":"med","e":"Age uses ‘How old’."},{"q":"___ does she work?","o":["Where","Who","What","Which"],"a":0,"d":"med","e":"Place of work → Where."},{"q":"Which question is correct?","o":["Where you are from?","Where are you from?","Where from you are?","From where you are?"],"a":1,"d":"hard","e":"wh- + be + subject: Where are you from?"},{"q":"Complete: '___ time ___ the film start?'","o":["What / does","What / do","When / does","How / does"],"a":0,"d":"hard","e":"‘What time’ + does (it) start."},{"q":"Find the mistake: 'How much books do you have?'","o":["How much → How many","books → book","do → does","no mistake"],"a":0,"d":"hard","e":"Countable ‘books’ needs ‘How many’."},{"q":"Choose the correct order.","o":["What you do want?","What do you want?","What want you do?","Do what you want?"],"a":1,"d":"hard","e":"wh- + do + subject + base verb: What do you want?"},{"q":"Complete: '___ is the weather today?'","o":["What","How","Who","Where"],"a":1,"d":"hard","e":"We ask about weather with ‘How is the weather?’"}]},{"id":"g14","title":"Verb patterns: like + -ing","lead":"To talk about activities you enjoy or dislike, English often uses a verb of feeling (like, love, hate, enjoy) followed by the -ing form. This is a key A1 pattern.","blocks":[{"h":"like / love / hate / enjoy + -ing","p":["After these verbs, an activity usually takes the <b>-ing</b> form."],"ex":["I <b>like swimming</b>. · She <b>loves dancing</b>. · They <b>hate getting up</b> early."]},{"h":"+ noun","p":["These verbs can also be followed directly by a <b>noun</b>."],"ex":["I like <b>music</b>. · She loves <b>chocolate</b>."]},{"h":"Negatives","p":["Use <b>don’t/doesn’t</b> + like/enjoy + -ing."],"ex":["I <b>don’t like</b> cooking. · He <b>doesn’t enjoy</b> running."]},{"h":"would like = want (polite)","p":["<b>would like</b> is different: it means ‘want’ and is followed by <b>to + base verb</b> or a noun."],"ex":["I<b>’d like to go</b> home. · I<b>’d like</b> a coffee."]}],"tip":"Don’t confuse <b>like + -ing</b> (enjoy an activity) with <b>would like + to</b> (want something now): ‘I like swimming’ vs. ‘I’d like to swim now.’","examples":["I <b>like swimming</b> in summer.","She <b>loves dancing</b>.","They <b>hate getting</b> up early.","He <b>doesn’t enjoy cooking</b>.","I’<b>d like to go</b> home now. (= want)","I’<b>d like</b> a coffee, please."],"q":[{"q":"I like ___ books.","o":["read","reading","reads","to reading"],"a":1,"d":"easy","e":"After ‘like’ we use -ing: reading."},{"q":"She loves ___.","o":["dance","dancing","dances","to dancing"],"a":1,"d":"easy","e":"love + -ing: dancing."},{"q":"They hate ___ up early.","o":["get","getting","gets","to getting"],"a":1,"d":"easy","e":"hate + -ing: getting."},{"q":"I like ___. (a noun)","o":["music","musicing","to music","musics"],"a":0,"d":"easy","e":"like + noun: music."},{"q":"We enjoy ___ football.","o":["play","playing","plays","to play"],"a":1,"d":"easy","e":"enjoy + -ing: playing."},{"q":"He doesn't like ___.","o":["cook","cooking","cooks","to cooking"],"a":1,"d":"med","e":"don’t/doesn’t like + -ing: cooking."},{"q":"Choose the correct sentence.","o":["I like to swimming.","I like swimming.","I like swims.","I am like swimming."],"a":1,"d":"med","e":"like + -ing: I like swimming."},{"q":"She loves ___ to music.","o":["listen","listening","listens","to listening"],"a":1,"d":"med","e":"love + -ing: listening."},{"q":"I'd like ___ a sandwich, please.","o":["have","having","to have","has"],"a":2,"d":"med","e":"would like + to + base verb: to have."},{"q":"They don't enjoy ___ in winter.","o":["run","running","runs","to running"],"a":1,"d":"med","e":"enjoy + -ing: running."},{"q":"Which sentence is correct?","o":["I would like swimming now.","I'd like to swim now.","I'd like swim now.","I like to swimming now."],"a":1,"d":"hard","e":"would like + to + base verb: I’d like to swim."},{"q":"Complete: 'She likes ___ but she'd like ___ a new hobby.'","o":["paint / to find","painting / find","painting / to find","to paint / finding"],"a":2,"d":"hard","e":"like + -ing (painting); would like + to (to find)."},{"q":"Find the mistake: 'I love to cooking.'","o":["love → like","to cooking → cooking","cooking → cook","no mistake"],"a":1,"d":"hard","e":"After ‘love’ use -ing without ‘to’: I love cooking."},{"q":"Choose the natural request.","o":["I like a tea, please.","I'd like a tea, please.","I liking a tea, please.","I like to a tea, please."],"a":1,"d":"hard","e":"Polite request: I’d like a tea, please."},{"q":"Complete: 'Do you like ___? — Yes, but I'd like ___ a film tonight.'","o":["read / to watch","reading / watch","reading / to watch","to read / watching"],"a":2,"d":"hard","e":"like + -ing (reading); would like + to (to watch)."}]},{"id":"g15","title":"Numbers & measures","lead":"Numbers are everywhere — ages, prices, dates and the time. This lesson covers cardinal and ordinal numbers, and how to say dates, prices and the clock.","blocks":[{"h":"Cardinal numbers","p":["These count: one, two, three… Note the tricky ‘teens’ and ‘tens’: thirteen vs. thirty, fifteen vs. fifty."],"ex":["13 = thir<b>teen</b> · 30 = thir<b>ty</b> · 15 = fif<b>teen</b> · 50 = fif<b>ty</b>"]},{"h":"Ordinal numbers","p":["These show order: first (1st), second (2nd), third (3rd), fourth (4th)… We use them for dates and floors."],"ex":["the <b>first</b> of May · the <b>third</b> floor"]},{"h":"Dates","p":["Say the day as an ordinal: ‘the 5th of June’ or ‘June the 5th’. Years: 2026 = ‘twenty twenty-six’."],"ex":["My birthday is <b>the 12th of July</b>."]},{"h":"Prices & the time","p":["Prices: $5.50 = ‘five fifty’ / ‘five dollars fifty’. Time: 9:00 = ‘nine o’clock’, 9:15 = ‘quarter past nine’, 9:30 = ‘half past nine’, 9:45 = ‘quarter to ten’."],"ex":["It’s <b>half past six</b>. · It costs <b>twenty euros</b>."]}],"tip":"Listen for the stress to tell teens from tens: thir<b>TEEN</b> (stress at the end) vs. <b>THIR</b>ty (stress at the start).","examples":["13 = thir<b>teen</b>; 30 = thir<b>ty</b>.","the <b>first</b> of May; the <b>third</b> floor.","6:30 = <b>half past six</b>; 7:45 = <b>quarter to eight</b>.","It costs <b>twenty pounds</b>.","My exam is on the <b>12th</b> of June.","2026 = ‘twenty twenty-six’."],"q":[{"q":"How do you write the number 15?","o":["fifty","fiveteen","fifteen","fifthteen"],"a":2,"d":"easy","e":"15 = fifteen."},{"q":"The ordinal form of 'two' is ___.","o":["twoth","second","twice","two"],"a":1,"d":"easy","e":"two → second (2nd)."},{"q":"Which is a month?","o":["Monday","August","Winter","Tuesday"],"a":1,"d":"easy","e":"August is a month."},{"q":"9:00 — we say ___.","o":["nine o'clock","nine hours","the nine","nine time"],"a":0,"d":"easy","e":"A full hour → o’clock."},{"q":"Which number comes after nineteen?","o":["eighteen","twenty","twelve","ninety"],"a":1,"d":"easy","e":"After 19 comes 20 (twenty)."},{"q":"30 is written ___.","o":["thirteen","thirty","threety","thurty"],"a":1,"d":"med","e":"30 = thirty (note: not thirteen)."},{"q":"The 3rd of May means the ___ day of May.","o":["second","third","fourth","first"],"a":1,"d":"med","e":"3rd = third."},{"q":"6:30 — we say ___.","o":["half to six","half past six","six and half","thirty past six"],"a":1,"d":"med","e":"6:30 = half past six."},{"q":"The ordinal of 'five' is ___.","o":["fiveth","fifth","fifeth","five"],"a":1,"d":"med","e":"five → fifth."},{"q":"$10.20 is said ___.","o":["ten point twenty","ten twenty","ten and twenty","twenty ten"],"a":1,"d":"med","e":"Prices: ‘ten twenty’."},{"q":"Which is correct for 13 vs 30?","o":["thirteen = 30","thirty = 13","thirteen = 13","thirteen = 31"],"a":2,"d":"hard","e":"thirteen = 13; thirty = 30."},{"q":"7:45 — we say ___.","o":["quarter past seven","quarter to eight","three quarters seven","forty-five to eight"],"a":1,"d":"hard","e":"7:45 = quarter to eight."},{"q":"How do you say the year 2026?","o":["two thousand twenty-six","twenty twenty-six","two zero two six","twenty-six twenty"],"a":1,"d":"hard","e":"2026 is usually ‘twenty twenty-six’."},{"q":"Complete the date: 'My exam is on the ___ of March.' (1)","o":["one","oneth","first","firstth"],"a":2,"d":"hard","e":"Dates use ordinals: the first of March."},{"q":"It's 8:15. The correct phrase is ___.","o":["quarter to eight","quarter past eight","half past eight","fifteen to eight"],"a":1,"d":"hard","e":"8:15 = quarter past eight "ru":"расслабленный","ex":"I feel relaxed on holiday."}],"q":[{"q":"The opposite of 'happy' is ___.","o":["sad","tired","favourite","like"],"a":0,"e":"happy ↔ sad."},{"q":"When you want food, you are ___.","o":["thirsty","hungry","bored","happy"],"a":1,"e":"Wanting food = hungry."},{"q":"'Charchagan' in English is ___.","o":["angry","tired","excited","sad"],"a":1,"e":"‘Charchagan’ = tired."},{"q":"When you want a drink, you are ___.","o":["hungry","thirsty","bored","sad"],"a":1,"e":"Wanting a drink = thirsty."},{"q":"Your ___ colour is the one you like best.","o":["angry","favourite","bored","tired"],"a":1,"e":"Your favourite is the one you like best."}]}],"READING":[{"id":"r1","title":"My Family","text":"Hello! My name is Jack. I am eleven years old. I live in Manchester with my family.\nI have one brother and one sister. My brother is fourteen and my sister is seven. My mother is a doctor and my father is a teacher.\nWe have a small dog. Its name is Bobby. Bobby is brown and very friendly. I love my family very much.","level":"Easy","q":[{"q":"How old is Jack?","o":["seven","eleven","fourteen","ten"],"a":1,"e":"The text says ‘I am eleven years old.’"},{"q":"Where does Jack live?","o":["London","Oxford","Manchester","Bristol"],"a":2,"e":"He lives in Manchester."},{"q":"What is his mother's job?","o":["teacher","doctor","driver","cook"],"a":1,"e":"His mother is a doctor."},{"q":"How many brothers and sisters does Jack have?","o":["one brother only","one sister only","one brother and one sister","two sisters"],"a":2,"e":"He has one brother and one sister."},{"q":"What colour is the dog?","o":["black","white","brown","grey"],"a":2,"e":"Bobby is brown."}]},{"id":"r2","title":"Emily's Day","text":"Emily is a student in Leeds. From Monday to Friday she gets up at seven o'clock. She has breakfast with her family and then goes to school by bus.\nSchool starts at half past eight. Emily likes English and art, but she doesn't like maths.\nIn the afternoon she does her homework. In the evening she watches TV or reads a book. She goes to bed at ten o'clock.\nAt the weekend Emily doesn't go to school. She plays with her friends in the park.","level":"Easy","q":[{"q":"What time does Emily get up on school days?","o":["six o'clock","seven o'clock","half past eight","ten o'clock"],"a":1,"e":"She gets up at seven o’clock."},{"q":"How does she go to school?","o":["by car","by bus","on foot","by train"],"a":1,"e":"She goes to school by bus."},{"q":"Which subject does Emily NOT like?","o":["English","art","maths","reading"],"a":2,"e":"She doesn’t like maths."},{"q":"What does she do in the evening?","o":["goes to school","plays in the park","watches TV or reads","gets up"],"a":2,"e":"In the evening she watches TV or reads."},{"q":"What does Emily do at the weekend?","o":["goes to school","plays with friends in the park","does maths","gets up at seven"],"a":1,"e":"At the weekend she plays with friends in the park."}]},{"id":"r3","title":"At the Market","text":"On Saturday morning, Tom and his mother go to the market in Oxford. The market is big and busy. There are many people and lots of fruit and vegetables.\nTom's mother wants to buy apples, bread and some milk. The apples are red and fresh. They cost two pounds for one kilo. Tom likes the oranges, so his mother buys four oranges too.\nThey don't buy any meat today because they have meat at home. After shopping, they are tired and thirsty, so they drink some water and go home by taxi.","level":"Medium","q":[{"q":"Where do Tom and his mother go shopping?","o":["a market in London","a market in Oxford","a shop in Leeds","a café in Bath"],"a":1,"e":"They go to the market in Oxford."},{"q":"What does Tom's mother want to buy?","o":["meat, rice and tea","apples, bread and milk","shoes and a bag","fish and sugar"],"a":1,"e":"She wants apples, bread and some milk."},{"q":"How much do the apples cost?","o":["two pounds a kilo","four pounds a kilo","one pound a kilo","ten pounds a kilo"],"a":0,"e":"The apples cost two pounds for one kilo."},{"q":"Why don't they buy meat?","o":["It is too expensive.","They don't like meat.","They have meat at home.","The market has no meat."],"a":2,"e":"They have meat at home."},{"q":"How do they go home?","o":["by bus","on foot","by taxi","by train"],"a":2,"e":"They go home by taxi."}]},{"id":"r4","title":"My Town","text":"I live in a small town near Bath, in the west of England. It is a quiet place, but there is a lot to do.\nIn the centre there is a big park with tall trees and a small lake. Next to the park there is a library where I borrow books every week. There are two schools, a hospital and many shops.\nMy favourite place is the café on Green Street. It is between the post office and the bank. The coffee there is cheap and the people are friendly.\nThe town is not perfect — there isn't a cinema, and the buses are sometimes late. But I am happy here because my friends and family are close.","level":"Medium","q":[{"q":"Where is the town?","o":["near London","near Bath","by the sea","in Scotland"],"a":1,"e":"It is a small town near Bath, in the west of England."},{"q":"What is next to the park?","o":["the bank","the library","a cinema","the hospital"],"a":1,"e":"Next to the park there is a library."},{"q":"Where is the writer's favourite café?","o":["next to the park","between the post office and the bank","near the lake","in another town"],"a":1,"e":"The café is between the post office and the bank."},{"q":"What does the town NOT have?","o":["a park","a hospital","a cinema","shops"],"a":2,"e":"There isn’t a cinema."},{"q":"Why is the writer happy in the town?","o":["because it is perfect","because there is a cinema","because friends and family are close","because the buses are fast"],"a":2,"e":"He is happy because his friends and family are close."}]},{"id":"r5","title":"A Letter from Sophie","text":"Dear Grace,\n\nThank you for your letter. I am very happy to hear from you. How are you and your family?\n\nI am writing to you from my new home in Bristol. Last month we moved here from London because my father has a new job. At first I was sad because I missed my old friends, but now I feel better.\n\nMy new school is bigger than my old one. I am learning French and Spanish, and I really enjoy art. French is difficult, but my teacher is patient and I am getting better every day. After school I usually play netball with new friends.\n\nPlease write soon and tell me your news. Maybe you can visit me in the summer holidays!\n\nLove,\nSophie","level":"Hard","q":[{"q":"Why did Sophie's family move to Bristol?","o":["She changed schools.","Her father got a new job.","They wanted a bigger park.","Grace invited them."],"a":1,"e":"They moved because her father has a new job."},{"q":"How did Sophie feel at first?","o":["excited","sad","angry","bored"],"a":1,"e":"At first she was sad because she missed her old friends."},{"q":"How is her new school different?","o":["It is smaller.","It is bigger.","It has no art.","It is far away."],"a":1,"e":"Her new school is bigger than the old one."},{"q":"What does Sophie say about French?","o":["It is easy.","It is difficult, but she is improving.","She doesn't study it.","Her teacher is unkind."],"a":1,"e":"French is difficult, but she is getting better, and her teacher is patient."},{"q":"What does Sophie suggest Grace could do?","o":["move to Bristol","visit her in the summer holidays","stop writing letters","change schools"],"a":1,"e":"She suggests Grace visit her in the summer holidays."}]}],"LISTENING":[{"id":"l1","title":"A New Student","script":"Hello, everyone. My name is Oliver. I am twelve years old and I am from Brighton. I have two sisters and one brother. My favourite subject is science, and after school I like playing football with my friends. I have a small cat at home. Its name is Luna. Nice to meet you all!","level":"Easy","q":[{"q":"What is the boy's name?","o":["Harry","Oliver","Jack","Tom"],"a":1,"e":"He says ‘My name is Oliver.’"},{"q":"How old is he?","o":["ten","eleven","twelve","fourteen"],"a":2,"e":"He is twelve years old."},{"q":"Where is he from?","o":["London","Brighton","Manchester","Leeds"],"a":1,"e":"He is from Brighton."},{"q":"What is his favourite subject?","o":["maths","science","English","art"],"a":1,"e":"His favourite subject is science."},{"q":"What is the name of his cat?","o":["Bobby","Luna","Milo","Felix"],"a":1,"e":"His cat’s name is Luna."}]},{"id":"l2","title":"At the Shop","script":"Good morning. Can I help you? Yes, please. I would like some bread and two bottles of water. Of course. The bread is one pound, and the water is two pounds. That is three pounds in total. Here you are. Thank you. Have a nice day!","level":"Easy","q":[{"q":"What does the customer want to buy?","o":["bread and water","milk and eggs","tea and sugar","fruit and meat"],"a":0,"e":"The customer wants bread and two bottles of water."},{"q":"How many bottles of water does the customer buy?","o":["one","two","three","four"],"a":1,"e":"Two bottles of water."},{"q":"How much is the bread?","o":["one pound","two pounds","three pounds","five pounds"],"a":0,"e":"The bread is one pound."},{"q":"How much does the customer pay in total?","o":["one pound","two pounds","three pounds","four pounds"],"a":2,"e":"Three pounds in total."},{"q":"Where does this conversation happen?","o":["at school","at a shop","at home","at the doctor's"],"a":1,"e":"It happens at a shop."}]},{"id":"l3","title":"Directions to the Park","script":"Excuse me, where is the park, please? Go straight on along this street. Then take the second turning on the left. The park is next to the library, opposite the bank. It is about five minutes on foot. Thank you very much! You are welcome.","level":"Medium","q":[{"q":"What is the person looking for?","o":["the bank","the library","the park","the school"],"a":2,"e":"The person is looking for the park."},{"q":"Which turning should they take?","o":["the first on the right","the second on the left","the
